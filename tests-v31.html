<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VodaFit — Validaciones V31</title>
<style>
  :root{ color-scheme: light dark; }
  body{ font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; margin:0; padding:16px; background:#faf8f6; color:#1d1a17; }
  @media (prefers-color-scheme: dark){ body{ background:#171412; color:#eee9e3; } }
  h1{ font-size:18px; margin:0 0 4px; }
  #summary{ position:sticky; top:0; padding:10px 12px; border-radius:10px; font-weight:700; margin:12px 0; background:#e7e3de; }
  #summary.pass{ background:#DCF3E6; color:#1d5c38; }
  #summary.fail{ background:#FBE0DF; color:#8d2b2b; }
  @media (prefers-color-scheme: dark){
    #summary{ background:#26221e; } #summary.pass{ background:#173425; color:#8fe0b2; } #summary.fail{ background:#3A1F1E; color:#ff9f98; }
  }
  .grp{ margin:14px 0 6px; font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:.04em; opacity:.75; }
  .t{ padding:3px 0 3px 22px; position:relative; border-bottom:1px solid rgba(128,128,128,.14); }
  .t::before{ position:absolute; left:2px; }
  .ok::before{ content:"OK"; color:#2E9E5B; font-size:11px; font-weight:700; }
  .no::before{ content:"XX"; color:#C13B3B; font-size:11px; font-weight:700; }
  .msg{ display:block; color:#C13B3B; font-size:12.5px; padding-left:2px; }
  iframe{ position:absolute; width:420px; height:760px; left:-9999px; top:0; border:0; }
  code{ background:rgba(128,128,128,.14); padding:1px 4px; border-radius:4px; }
</style>
</head>
<body>
<h1>VodaFit — Validaciones V31</h1>
<p class="muted">Harness autocontenido: sin npm, sin build system, sin dependencias externas.
Carga <code>index.html</code> en un iframe y valida contra <code>window.__appTest</code>.
Abrilo con un servidor estático local (<code>file://</code> bloquea el acceso al iframe).</p>
<div id="summary">Cargando la app…</div>
<div id="out"></div>
<iframe id="app" src="index.html"></iframe>

<script>
(function(){
  var out = document.getElementById("out");
  var summary = document.getElementById("summary");
  var pass = 0, fail = 0, failures = [];
  var currentGroup = "";

  function group(name){
    currentGroup = name;
    var d = document.createElement("div");
    d.className = "grp"; d.textContent = name;
    out.appendChild(d);
  }
  function record(ok, name, msg){
    var d = document.createElement("div");
    d.className = "t " + (ok ? "ok" : "no");
    d.textContent = " " + name;
    if(!ok){
      var s = document.createElement("span");
      s.className = "msg"; s.textContent = msg || "";
      d.appendChild(s);
      fail++; failures.push(currentGroup + " > " + name + (msg ? " :: " + msg : ""));
    } else pass++;
    out.appendChild(d);
  }
  // Una aserción que lanza no debe cortar el resto del harness.
  function test(name, fn){
    try{
      var r = fn();
      if(r === false) record(false, name, "devolvió false");
      else if(typeof r === "string") record(false, name, r);
      else record(true, name);
    }catch(e){ record(false, name, (e && e.message) || String(e)); }
  }
  function assert(cond, msg){ if(!cond) throw new Error(msg || "assert falló"); }

  function finish(){
    var total = pass + fail;
    summary.className = fail ? "fail" : "pass";
    summary.textContent = (fail ? "FALLAN " + fail + " de " + total : "TODO OK — " + pass + "/" + total) +
      "  (pasados: " + pass + ", fallidos: " + fail + ")";
    // Para leer el resultado desde afuera (consola / automatización).
    window.__v31Results = { pass: pass, fail: fail, total: total, failures: failures };
    if(failures.length) console.error("FALLOS V31:\n" + failures.join("\n"));
    console.log("V31 tests:", pass + "/" + total + " pasados");
  }

  function run(A){
    var uniq = function(a){ return Array.from(new Set(a)); };
    var names = function(day){ return (day.exercises||[]).map(function(e){ return e.nombre; }); };
    // Repite una generación N veces: los generadores son aleatorios, así que
    // una sola corrida no prueba nada sobre las reglas.
    function repeat(n, fn){ for(var i=0;i<n;i++) fn(i); }

    /* ---------------- BIBLIOTECA ---------------- */
    group("Biblioteca");

    test("EXERCISES no tiene duplicados", function(){
      var d = A.EXERCISES.filter(function(n,i){ return A.EXERCISES.indexOf(n)!==i; });
      assert(d.length===0, "duplicados: " + d.join(", "));
    });

    test("todo nombre de EXERCISES activo existe en MUSCLE_MAP", function(){
      var missing = A.EXERCISES.filter(function(n){
        return !A.isRetiredExercise(n) && !A.MUSCLE_MAP[n] && !/^(Cinta|Bicicleta|Elíptico|Máquina de remo|Escaladora|Salto de soga|Burpees|Kettlebell|Battle rope|Trineo)/.test(n);
      });
      assert(missing.length===0, "sin MUSCLE_MAP: " + missing.join(", "));
    });

    test("los nombres canónicos nuevos de Piernas existen", function(){
      var req = ["Sentadilla con barra","Prensa inclinada","Extensión de piernas","Estocadas con mancuerna",
        "Peso muerto con barra","Peso muerto con mancuernas","Peso muerto sumo con barra","Peso muerto rumano con barra",
        "Isquio sentado","Isquio acostado","Gemelos en prensa","Gemelos en máquina","Gemelos sentado en máquina",
        "Sentadilla Hack","Step Up","Sentadilla Sumo","Puente de glúteos","Sentadilla Smith",
        "Peso muerto rumano con mancuernas","Peso muerto sumo con mancuernas","Patada de glúteo en máquina",
        "Aductores en máquina","Gemelos parado con mancuerna"];
      var missing = req.filter(function(n){ return !A.MUSCLE_MAP[n]; });
      assert(missing.length===0, "faltan: " + missing.join(", "));
    });

    test("ningún nombre viejo renombrado quedó como clave activa", function(){
      // V35.1: se exceptúan los RETIRADOS. La intención original sigue siendo
      // la misma (una clave de alias no debe ser un ejercicio que el generador
      // todavía ofrece), pero ahora hay un caso legítimo más: un retirado de
      // V31 aliaseado a su equivalente activo. El retirado sigue en EXERCISES y
      // en MUSCLE_MAP a propósito, para que el historial conserve su ficha, y
      // isRetiredExercise lo mantiene fuera del pool activo.
      var olds = Object.keys(A.EXERCISE_ALIASES);
      var leaked = olds.filter(function(o){
        return A.EXERCISES.indexOf(o)!==-1 && !A.isRetiredExercise(o);
      });
      assert(leaked.length===0, "claves de alias que son ejercicios ACTIVOS: " + leaked.join(", "));
    });

    test("los aliases apuntan a un nombre canónico real", function(){
      var bad = Object.keys(A.EXERCISE_ALIASES).filter(function(o){
        return !A.MUSCLE_MAP[A.EXERCISE_ALIASES[o]];
      });
      assert(bad.length===0, "alias roto: " + bad.join(", "));
    });

    test("canonicalExerciseName resuelve el histórico al nombre nuevo", function(){
      assert(A.canonicalExerciseName("Sentadilla")==="Sentadilla con barra", "Sentadilla");
      assert(A.canonicalExerciseName("Curl femoral sentado")==="Isquio sentado", "Curl femoral sentado");
      assert(A.canonicalExerciseName("Extensión de cadera en máquina")==="Patada de glúteo en máquina", "extensión de cadera");
      assert(A.canonicalExerciseName("Elevación de talones de pie con disco")==="Gemelos parado con mancuerna", "talones con disco");
      // Idempotente: un nombre ya canónico se devuelve igual.
      assert(A.canonicalExerciseName("Sentadilla con barra")==="Sentadilla con barra", "idempotencia");
    });

    test("el histórico viejo sigue encontrando ficha/lámina/equipamiento", function(){
      // V33: las fotos y videos de demostración se sacaron de la app, así que
      // la resolución por alias se verifica contra la lámina anatómica, que usa
      // exactamente el mismo canonicalExerciseName.
      assert(A.exerciseAnatomyImageFor("Sentadilla")!==null, "lámina por alias");
      assert(A.exerciseAnatomyImageFor("Prensa de piernas")!==null, "lámina por alias (prensa)");
      assert(A.exerciseEquipment("Curl femoral sentado")!=="No especificado", "equipamiento por alias");
      assert(A.exercisePrimarySubgroup("Peso muerto")!=null, "subgrupo por alias");
    });

    test("los retirados salen de los pools activos", function(){
      var pools = A.muscleGroupPools();
      var all = [];
      Object.keys(pools).forEach(function(g){ all = all.concat(pools[g]); });
      var leaked = Array.from(A.EXERCISES_RETIRED).filter(function(n){ return all.indexOf(n)!==-1; });
      assert(leaked.length===0, "retirados visibles: " + leaked.join(", "));
    });

    test("los retirados conservan su ficha (no se borró el dato)", function(){
      var lost = Array.from(A.EXERCISES_RETIRED).filter(function(n){ return !A.MUSCLE_MAP[n]; });
      assert(lost.length===0, "perdieron MUSCLE_MAP: " + lost.join(", "));
    });

    /* ---------------- CLASIFICACIÓN ---------------- */
    group("Clasificación (principal único + secundarios)");

    test("todo ejercicio activo tiene exactamente UN principal", function(){
      var bad = [];
      Object.keys(A.MUSCLE_MAP).forEach(function(n){
        if(A.isRetiredExercise(n)) return;
        var p = A.exercisePrimarySubgroup(n);
        if(!p) bad.push(n);
      });
      assert(bad.length===0, "sin principal: " + bad.join(", "));
    });

    test("el principal es estrictamente el de mayor intensidad (sin empate ambiguo)", function(){
      var bad = [];
      Object.keys(A.MUSCLE_MAP).forEach(function(n){
        if(A.isRetiredExercise(n)) return;
        var t = A.MUSCLE_MAP[n].t || [];
        if(!t.length) return;
        var max = Math.max.apply(null, t.map(function(x){ return x[1]; }));
        // Puede haber varias regiones en el máximo, pero todas deben caer en
        // el MISMO subgrupo — si no, el principal sería ambiguo.
        var sgs = uniq(t.filter(function(x){ return x[1]===max; }).map(function(x){ return A.REGION_SUBGROUP[x[0]]; }));
        if(sgs.length>1) bad.push(n + " (" + sgs.join("/") + ")");
      });
      assert(bad.length===0, "principal ambiguo: " + bad.join(", "));
    });

    var PRINCIPAL_ESPERADO = {
      "Sentadilla con barra":"quads", "Sentadilla frontal":"quads", "Prensa inclinada":"quads",
      "Extensión de piernas":"quads", "Sentadilla Hack":"quads", "Sentadilla búlgara":"quads",
      "Sentadilla Smith":"quads",
      "Estocadas con mancuerna":"glutes", "Step Up":"glutes", "Sentadilla Sumo":"glutes",
      "Peso muerto con barra":"glutes", "Peso muerto con mancuernas":"glutes",
      "Peso muerto sumo con barra":"glutes", "Peso muerto sumo con mancuernas":"glutes",
      "Hip thrust en máquina":"glutes", "Puente de glúteos":"glutes",
      "Patada de glúteo en máquina":"glutes", "Patada de glúteo en polea":"glutes",
      "Abductores en máquina":"glutes",
      "Peso muerto rumano con barra":"hamstrings", "Peso muerto rumano con mancuernas":"hamstrings",
      "Isquio sentado":"hamstrings", "Isquio acostado":"hamstrings",
      "Aductores en máquina":"adductors",
      "Gemelos en prensa":"calves", "Gemelos en máquina":"calves",
      "Gemelos parado con mancuerna":"calves", "Gemelos sentado en máquina":"calves"
    };
    test("Piernas: principal exacto según la spec §9", function(){
      var bad = [];
      Object.keys(PRINCIPAL_ESPERADO).forEach(function(n){
        var got = A.exerciseLegFocus(n);
        if(got !== PRINCIPAL_ESPERADO[n]) bad.push(n + ": esperaba " + PRINCIPAL_ESPERADO[n] + ", dio " + got);
      });
      assert(bad.length===0, bad.join(" | "));
    });

    test("Sentadilla con barra tiene glúteos y aductores como SECUNDARIOS", function(){
      var t = A.MUSCLE_MAP["Sentadilla con barra"].t;
      var reg = {}; t.forEach(function(x){ reg[x[0]] = x[1]; });
      assert(reg["glutes"]>0 && reg["glutes"]<1, "glúteos debe ser secundario");
      assert(reg["adductors"]>0 && reg["adductors"]<1, "aductores debe ser secundario");
    });

    test("Hiperextensiones es principal Core (no Espalda)", function(){
      assert(A.exercisePrimarySubgroup("Hiperextensiones")==="core",
        "dio " + A.exercisePrimarySubgroup("Hiperextensiones"));
      assert(A.exerciseMuscleGroup("Hiperextensiones")==="Core", "grupo visual");
    });

    test("Press tras nuca con barra es principal Hombros (no Espalda)", function(){
      assert(A.exercisePrimarySubgroup("Press tras nuca con barra")==="hombros");
    });

    test("Remo al mentón es principal Hombros con trapecios secundario", function(){
      assert(A.exercisePrimarySubgroup("Remo al mentón")==="hombros");
      var t = A.MUSCLE_MAP["Remo al mentón"].t; var reg = {};
      t.forEach(function(x){ reg[x[0]] = x[1]; });
      assert(reg["traps"]>0 && reg["traps"]<1, "trapecios secundario");
    });

    test("Encogimientos: principal Trapecios dentro del grupo visual Hombros", function(){
      ["Encogimientos con mancuernas","Encogimientos con barra","Encogimientos en máquina"].forEach(function(n){
        assert(A.exerciseMuscleGroup(n)==="Hombros", n + " grupo visual dio " + A.exerciseMuscleGroup(n));
      });
      assert(A.MUSCLE_GROUPS.length===6, "no se creó un séptimo grupo visual");
    });

    test("Abductores en máquina pertenece a Glúteos (no a un grupo Abductores)", function(){
      assert(A.exerciseLegFocus("Abductores en máquina")==="glutes");
    });

    /* ---------------- PATRONES Y PREDOMINANCIAS ---------------- */
    group("Patrones y predominancias");

    test("todo ejercicio activo de la biblioteca tiene patrón declarado", function(){
      var sinPatron = [];
      Object.keys(A.MUSCLE_MAP).forEach(function(n){
        if(A.isRetiredExercise(n)) return;
        if(!A.EXERCISE_PATTERN[n]) sinPatron.push(n);
      });
      assert(sinPatron.length===0, "sin patrón: " + sinPatron.join(", "));
    });

    test("los patrones de Piernas son los de la spec §10", function(){
      var esperado = {
        "Sentadilla con barra":"sentadilla","Sentadilla frontal":"sentadilla","Sentadilla Sumo":"sentadilla",
        "Sentadilla Smith":"sentadilla","Sentadilla Hack":"sentadilla",
        "Prensa inclinada":"prensa",
        "Sentadilla búlgara":"unilateral-pierna","Estocadas con mancuerna":"unilateral-pierna","Step Up":"unilateral-pierna",
        "Extensión de piernas":"extension-rodilla",
        "Peso muerto con barra":"bisagra","Peso muerto con mancuernas":"bisagra",
        "Peso muerto rumano con barra":"bisagra","Peso muerto rumano con mancuernas":"bisagra",
        "Peso muerto sumo con barra":"bisagra-sumo","Peso muerto sumo con mancuernas":"bisagra-sumo",
        "Hip thrust en máquina":"extension-cadera","Puente de glúteos":"extension-cadera",
        "Patada de glúteo en máquina":"extension-cadera","Patada de glúteo en polea":"extension-cadera",
        "Abductores en máquina":"abduccion",
        "Isquio sentado":"flexion-rodilla","Isquio acostado":"flexion-rodilla",
        "Aductores en máquina":"aduccion",
        "Gemelos en prensa":"gemelos-de-pie","Gemelos en máquina":"gemelos-de-pie","Gemelos parado con mancuerna":"gemelos-de-pie",
        "Gemelos sentado en máquina":"gemelos-sentado"
      };
      var bad = [];
      Object.keys(esperado).forEach(function(n){
        if(A.exercisePattern(n)!==esperado[n]) bad.push(n + ": " + A.exercisePattern(n));
      });
      assert(bad.length===0, bad.join(" | "));
    });

    test("la escala de predominancia es ÚNICA y de 4 niveles", function(){
      var keys = Object.keys(A.PATTERN_PREDOMINANCE_WEIGHT).sort();
      assert(keys.join(",")==="ALTA,BAJA,MEDIA,MEDIA_ALTA", "niveles: " + keys.join(","));
      var vals = Object.keys(A.PATTERN_PREDOMINANCE).map(function(p){ return A.PATTERN_PREDOMINANCE[p]; });
      var bad = uniq(vals).filter(function(v){ return keys.indexOf(v)===-1; });
      assert(bad.length===0, "predominancia fuera de escala: " + bad.join(", "));
    });

    test("los pesos de predominancia son monótonos (ALTA > MEDIA_ALTA > MEDIA > BAJA)", function(){
      var W = A.PATTERN_PREDOMINANCE_WEIGHT;
      assert(W.ALTA > W.MEDIA_ALTA && W.MEDIA_ALTA > W.MEDIA && W.MEDIA > W.BAJA, "no monótono");
      assert(W.BAJA > 0, "BAJA debe ser > 0 (no es prohibición)");
    });

    test("todo patrón usado tiene predominancia declarada", function(){
      var patrones = uniq(Object.keys(A.EXERCISE_PATTERN).map(function(n){ return A.EXERCISE_PATTERN[n]; }));
      var sin = patrones.filter(function(p){ return !A.PATTERN_PREDOMINANCE[p]; });
      assert(sin.length===0, "sin predominancia: " + sin.join(", "));
    });

    /* ---------------- EDAD Y EQUIPAMIENTO ---------------- */
    group("Edad y equipamiento");

    test("<40 no aplica preferencia (peso 1 para todos)", function(){
      ["Sentadilla con barra","Prensa inclinada","Sentadilla Smith","Peso muerto con barra"].forEach(function(n){
        assert(A.ageEquipmentWeight(n, 25)===1, n + " a los 25 dio " + A.ageEquipmentWeight(n,25));
      });
      assert(A.ageEquipmentWeight("Prensa inclinada", null)===1, "sin edad");
    });

    test("40-49 favorece máquina/Smith de forma moderada", function(){
      assert(A.ageEquipmentWeight("Prensa inclinada",45) > 1, "máquina no favorecida");
      assert(A.ageEquipmentWeight("Sentadilla con barra",45) === 1, "libre no debe penalizarse");
      assert(A.ageEquipmentWeight("Prensa inclinada",45) < A.ageEquipmentWeight("Prensa inclinada",55), "50+ debe ser mayor");
    });

    test("50+ favorece más, pero NUNCA prohíbe los libres", function(){
      assert(A.ageEquipmentWeight("Prensa inclinada",55) > A.ageEquipmentWeight("Prensa inclinada",45));
      assert(A.ageEquipmentWeight("Sentadilla búlgara",55) > 0, "un libre nunca puede quedar en peso 0");
    });

    test("EXERCISES_RISKY_50PLUS sigue siendo una regla independiente", function(){
      // La ponderación por edad no debe haber absorbido ni vaciado la
      // exclusión dura: sigue siendo un Set con nombres canónicos válidos.
      assert(A.EXERCISES_RISKY_50PLUS.size >= 8, "tamaño " + A.EXERCISES_RISKY_50PLUS.size);
      var invalid = Array.from(A.EXERCISES_RISKY_50PLUS).filter(function(n){ return !A.MUSCLE_MAP[n]; });
      assert(invalid.length===0, "nombres inválidos tras el renombre: " + invalid.join(", "));
      // Y un ejercicio riesgoso libre sigue teniendo peso > 0 por sí mismo
      // (la exclusión la hace el pool, no el peso).
      assert(A.ageEquipmentWeight("Sentadilla con barra",55) > 0);
    });

    test("50+ aumenta la proporción de máquina/polea sin llegar al 100%", function(){
      // Se compara la MISMA generación a dos edades, varias veces, porque el
      // sorteo es aleatorio.
      function proporcionGuiada(edad){
        var guiadas = 0, total = 0;
        repeat(40, function(){
          var day = A.generateFocusedDay(["cuadriceps","gluteos"], 0);
          if(!day) return;
          names(day).forEach(function(n){
            total++;
            var eq = A.exerciseEquipment(n);
            if(eq==="Máquina" || eq==="Polea") guiadas++;
          });
        });
        return total ? guiadas/total : 0;
      }
      var st = A.state;
      var prev = st.profile ? st.profile.edad : null;
      if(!st.profile) st.profile = { edad:null };
      st.profile.edad = 25; var joven = proporcionGuiada(25);
      st.profile.edad = 55; var mayor = proporcionGuiada(55);
      st.profile.edad = prev;
      assert(mayor > joven, "50+ (" + mayor.toFixed(2) + ") no supera a <40 (" + joven.toFixed(2) + ")");
      assert(mayor < 1, "llegó al 100% de máquinas (" + mayor.toFixed(2) + ")");
    });

    /* ---------------- ESPALDA ---------------- */
    group("Espalda");

    test("Dominadas supinas sigue siendo un ejercicio independiente y activo", function(){
      assert(!!A.MUSCLE_MAP["Dominadas supinas"], "no existe");
      assert(!A.isRetiredExercise("Dominadas supinas"), "está retirado");
      assert(A.MUSCLE_MAP["Dominadas"] !== A.MUSCLE_MAP["Dominadas supinas"], "se fusionaron");
    });

    test("Dominadas y Dominadas supinas comparten patrón (tracción vertical)", function(){
      assert(A.exercisePattern("Dominadas")===A.exercisePattern("Dominadas supinas"),
        "patrones distintos: " + A.exercisePattern("Dominadas") + " / " + A.exercisePattern("Dominadas supinas"));
    });

    test("Jalón tras nuca está fuera del pool activo", function(){
      assert(A.isRetiredExercise("Jalón tras nuca"), "no está retirado");
      var pools = A.subgroupPools();
      assert((pools.espalda||[]).indexOf("Jalón tras nuca")===-1, "sigue en el pool de espalda");
    });

    test("Remo en polea baja sigue presente y activo", function(){
      assert(!!A.MUSCLE_MAP["Remo en polea baja"] && !A.isRetiredExercise("Remo en polea baja"));
      assert((A.subgroupPools().espalda||[]).indexOf("Remo en polea baja")!==-1, "no está en el pool");
    });

    test("Hiperextensiones sigue presente (reclasificada, no eliminada)", function(){
      assert(!!A.MUSCLE_MAP["Hiperextensiones"] && !A.isRetiredExercise("Hiperextensiones"));
    });

    test("las variantes de jalón y remo de la spec §11 existen y están activas", function(){
      // V35.3: "Jalón agarre ancho" salió de esta lista. Se unificó con
      // "Jalón al pecho" (misma identidad: mismo equipamiento, mismo patrón,
      // mismo link de MuscleWiki) y se retiró para que haya UNA sola identidad
      // activa de ese movimiento. Sigue existiendo en MUSCLE_MAP para el
      // historial; lo que ya no es, es un ejercicio activo.
      var req = ["Jalón agarre supino","Jalón al pecho","Jalón agarre neutro",
                 "Remo en máquina unilateral","Remo en TRX","Remo en Hammer","Pullover","Remo con mancuerna unilateral"];
      var bad = req.filter(function(n){ return !A.MUSCLE_MAP[n] || A.isRetiredExercise(n); });
      assert(bad.length===0, "faltan/retirados: " + bad.join(", "));
      // Y el nombre viejo conserva su ficha, aunque retirado.
      assert(!!A.MUSCLE_MAP["Jalón agarre ancho"], "Jalón agarre ancho salió de MUSCLE_MAP");
      assert(A.isRetiredExercise("Jalón agarre ancho"), "Jalón agarre ancho debería estar retirado");
      assert(A.canonicalExerciseName("Jalón agarre ancho") === "Jalón al pecho", "no resuelve al canónico");
    });

    /* ---------------- HOMBROS ---------------- */
    group("Hombros");

    test("los ejercicios de la spec §12 existen y están activos", function(){
      var req = ["Press militar con barra","Press militar con mancuernas sentado","Press de hombros con mancuernas",
        "Press de hombros en máquina","Press tras nuca con barra","Arnold press","Vuelos laterales con mancuerna",

    // Helper: fija el perfil y pregunta por el bump. Restaura el perfil previo.
    function bumpCon(edad, peso){
      var prev = A.state.profile;
      A.state.profile = { id:"p", name:"t", metaSemanal:3, edad:edad, peso:peso };

      assert(bumpCon(36, 80) === false, "edad 36 no debería tener bump");
      // Y el resto del rango, por si alguien mueve los límites.
      assert(bumpCon(25, 80) === true, "edad 25 (centro del rango)");

      assert(referencia === true, "el caso de referencia (25a/80kg) debería tener bump");
      // Peso ausente con edad válida: el peso ya no importa.
      assert(bumpCon(25, null) === referencia, "peso ausente cambió el resultado");
      // Muy por debajo y muy por encima del viejo rango 73-93.
      assert(bumpCon(25, 50) === referencia, "peso 50 cambió el resultado");
      assert(bumpCon(25, 100) === referencia, "peso 100 cambió el resultado");
      // Y los bordes exactos del rango viejo, que antes eran los que decidían.
      [40, 72, 73, 93, 94, 120, 300, 0].forEach(function(p){
        assert(bumpCon(25, p) === referencia, "peso " + p + " cambió el resultado");
      });
      // Fuera del rango de edad, ningún peso lo enciende.
      [null, 50, 80, 100].forEach(function(p){
        assert(bumpCon(40, p) === false, "edad 40 con peso " + p + " no debería tener bump");
      });

      var prev = A.state.profile;

        var c80 = conteos(80), cNull = conteos(null), c50 = conteos(50), c100 = conteos(100);
        var k80 = Object.keys(c80).sort().join(",");

        assert(Object.keys(cNull).sort().join(",") === k80, "peso ausente cambió la rutina: " + JSON.stringify(cNull));
        assert(Object.keys(c50).sort().join(",") === k80, "peso 50 cambió la rutina: " + JSON.stringify(c50));

      } finally { A.state.profile = prev; }
    });

      assert(pools["Espalda"].indexOf("Jalón al pecho") !== -1, "el canónico no está en el pool de Espalda");
    });

    test("Jalón agarre ancho no es un ejercicio activo de la Biblioteca", function(){
      var activos = A.EXERCISES.filter(function(n){ return !A.isRetiredExercise(n); });
      assert(activos.indexOf("Jalón agarre ancho") === -1, "sigue apareciendo como activo");
      assert(activos.indexOf("Jalón al pecho") !== -1, "el canónico no aparece como activo");
      // Ya no hay dos entradas activas que canonicalicen al mismo ejercicio.
      var porIdentidad = {};
      activos.forEach(function(n){
        var c = A.canonicalExerciseName(n);
        (porIdentidad[c] = porIdentidad[c] || []).push(n);
      });
      var duplicadas = Object.keys(porIdentidad).filter(function(c){ return porIdentidad[c].length > 1; });
      assert(duplicadas.length === 0,
        "identidades con más de una entrada activa: " + duplicadas.map(function(c){
          return c + " <- " + porIdentidad[c].join(" + ");
        }).join(" ; "));
    });

    test("el historial del nombre viejo se agrupa con el canónico", function(){
      var prev = { regs:A.state.registros, hf:A.state.historyFilter, rut:A.state.rutina };
      try{
        A.state.registros = [
          A.Store.rowToRegistro({id:"r1", exercise:"Jalón agarre ancho", peso:50, date:"2026-01-05", set_number:null}),
          A.Store.rowToRegistro({id:"r2", exercise:"Jalón al pecho", peso:55, date:"2026-02-05", set_number:null}),
          A.Store.rowToRegistro({id:"r3", exercise:"Jalón tras nuca", peso:40, date:"2026-01-10", set_number:null}),
          A.Store.rowToRegistro({id:"r4", exercise:"Jalón agarre neutro", peso:45, date:"2026-01-15", set_number:null})
        ];
        var h = A.exerciseHistoryFor("Jalón al pecho");
        assert(h.length === 2, "esperaba 2 registros unificados, hubo " + h.length);
        assert(h.map(function(r){ return r.id; }).join(",") === "r1,r2", "ids: " + h.map(function(r){return r.id;}).join(","));
        // Entrar por el nombre viejo da el mismo historial.
        assert(A.exerciseHistoryFor("Jalón agarre ancho").length === 2, "por el nombre viejo da distinto");
        // Progresión continua, no dos series partidas.
        assert(A.exerciseWeeklyMax(h).map(function(s){ return s.peso; }).join(",") === "50,55", "gráfico partido");
        // Jalón tras nuca y agarre neutro quedan aparte.
        assert(A.exerciseHistoryFor("Jalón tras nuca").length === 1, "tras nuca se mezcló");
        assert(A.exerciseHistoryFor("Jalón agarre neutro").length === 1, "agarre neutro se mezcló");
        // Agrupación de la pantalla de Registro: un solo grupo para el jalón al pecho.
        A.state.historyFilter = { exercise:"", from:"", to:"" };
        A.state.rutina = { days:[] };
        var html = A.screenRegistro();
        assert(html.indexOf('data-hist-group="Jalón al pecho"') !== -1, "falta el grupo canónico");
        assert(html.indexOf('data-hist-group="Jalón agarre ancho"') === -1, "quedó un grupo con el nombre viejo");
        assert(html.indexOf('data-hist-group="Jalón tras nuca"') !== -1, "desapareció el grupo de tras nuca");
        // La escritura nueva entra canonicalizada.
        assert(A.Store.registroRowFor("p1",{exercise:"Jalón agarre ancho",peso:60,date:"2026-03-01"}).exercise === "Jalón al pecho",
          "la escritura no canonicaliza");
        assert(A.Store.registroRowFor("p1",{exercise:"Jalón tras nuca",peso:40,date:"2026-03-01"}).exercise === "Jalón tras nuca",
          "la escritura alteró Jalón tras nuca");
      } finally { A.state.registros = prev.regs; A.state.historyFilter = prev.hf; A.state.rutina = prev.rut; }
    });

    test("no se pierde ficha, lámina ni MuscleWiki del canónico", function(){
      assert(A.exerciseAnatomyImageFor("Jalón al pecho") === "ejercicios/anatomia/jalon-espalda-anatomia.jpg",
        "el canónico perdió la lámina: " + A.exerciseAnatomyImageFor("Jalón al pecho"));
      assert(A.exerciseHowtoLinkFor("Jalón al pecho") === "https://musclewiki.com/exercise/machine-pulldown",
        "el canónico perdió el link de MuscleWiki");
      assert(A.exerciseEquipment("Jalón al pecho") === "Polea", "el canónico perdió el equipamiento");
      assert(!!A.MUSCLE_MAP["Jalón al pecho"], "el canónico salió de MUSCLE_MAP");
      // El nombre viejo sigue en MUSCLE_MAP y hereda la ficha del canónico.
      assert(!!A.MUSCLE_MAP["Jalón agarre ancho"], "el nombre viejo salió de MUSCLE_MAP");
      assert(A.exerciseAnatomyImageFor("Jalón agarre ancho") === A.exerciseAnatomyImageFor("Jalón al pecho"),
        "el nombre viejo no hereda la lámina");
      assert(A.exerciseHowtoLinkFor("Jalón agarre ancho") === A.exerciseHowtoLinkFor("Jalón al pecho"),
        "el nombre viejo no hereda el MuscleWiki");
      // La ficha se abre sobre el canónico.
      var prev = A.state.exDetail;
      try{
        A.openExerciseDetail({ nombre:"Jalón agarre ancho" }, { returnTab:"rutina" });
        assert(A.state.exDetail.nombre === "Jalón al pecho",
          "la ficha no abrió sobre el canónico: " + A.state.exDetail.nombre);
      } finally { A.state.exDetail = prev; }
    });

    test("los pools quedan consistentes: Espalda 15, el resto sin cambios", function(){
      var pools = A.muscleGroupPools();
      assert(pools["Espalda"].length === 15, "Espalda: esperaba 15, hubo " + pools["Espalda"].length);
      var sinCambios = { Pecho:13, Piernas:28, Hombros:17, Brazos:18, Core:9 };
      Object.keys(sinCambios).forEach(function(g){
        assert(pools[g].length === sinCambios[g], g + ": esperaba " + sinCambios[g] + ", hubo " + pools[g].length);
      });
      var total = Object.keys(pools).reduce(function(a,g){ return a + pools[g].length; }, 0);
      assert(total === 100, "total de pools: esperaba 100, hubo " + total);
      assert(A.subgroupPools()["espalda"].length === 15, "subgroupPools espalda: " + A.subgroupPools()["espalda"].length);
    });

    test("estado final de identidad: 41 aliases, 12 retirados, sin cabos sueltos", function(){
      // V34 (38) + V35.1 (2) + V35.3 (1) = 41.
      assert(Object.keys(A.EXERCISE_ALIASES).length === 41,
        "cantidad de aliases inesperada: " + Object.keys(A.EXERCISE_ALIASES).length);
      // V31 (11) + V35.3 (1) = 12.
      assert(A.EXERCISES_RETIRED.size === 12, "cantidad de retirados inesperada: " + A.EXERCISES_RETIRED.size);
      assert(A.EXERCISES.length === 122, "EXERCISES cambió de tamaño: " + A.EXERCISES.length);
      // Ningún alias termina en un retirado.
      var aRetirado = Object.keys(A.EXERCISE_ALIASES).filter(function(k){
        return A.EXERCISES_RETIRED.has(A.EXERCISE_ALIASES[k]);
      });
      assert(aRetirado.length === 0, "aliases que terminan en un retirado: " + aRetirado.join(", "));
      // Los 12 retirados siguen detectados.
      var noDetectados = Array.from(A.EXERCISES_RETIRED).filter(function(n){ return !A.isRetiredExercise(n); });
      assert(noDetectados.length === 0, "retirados no detectados: " + noDetectados.join(", "));
      // Sin claves ambiguas en la normalización.
      var amb = [];
      A.EXERCISE_NORMALIZED_INDEX.forEach(function(v, k){ if(v === null) amb.push(k); });
      assert(amb.length === 0, "claves ambiguas: " + amb.join(" | "));
      // Los tres retirados CON alias son exactamente los aprobados.
      var conAlias = Array.from(A.EXERCISES_RETIRED).filter(function(n){ return !!A.EXERCISE_ALIASES[n]; }).sort();
      assert(conAlias.length === 3, "retirados con alias: " + conAlias.join(", "));
      ["Encogimientos de hombros","Extensión tríceps polea agarre prono","Jalón agarre ancho"].forEach(function(n){
        assert(conAlias.indexOf(n) !== -1, "falta " + n + " entre los retirados con alias");
      });
    });

    finish();
  }

  var frame = document.getElementById("app");
  var tries = 0;
  function waitForApp(){
    var A = null;
    try{ A = frame.contentWindow && frame.contentWindow.__appTest; }catch(e){
      summary.className = "fail";
      summary.textContent = "No se puede acceder al iframe. Abrí esta página con un servidor estático (http://), no con file://.";
      return;
    }
    if(A){ summary.textContent = "Corriendo validaciones…"; setTimeout(function(){ run(A); }, 0); return; }
    if(++tries > 120){
      summary.className = "fail";
      summary.textContent = "La app no expuso window.__appTest después de 12s.";
      return;
    }
    setTimeout(waitForApp, 100);
  }
  frame.addEventListener("load", waitForApp);
  waitForApp();
})();
</script>

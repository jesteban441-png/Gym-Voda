  function muscleTargets(exerciseName){
    const info = MUSCLE_MAP[canonicalExerciseName(exerciseName)];
    if(!info) return null;
    // V32: `views` (1 o 2) y `dominant` (para miniaturas) reemplazan a la
    // silueta única. `diagram` se conserva tal cual viene de MUSCLE_MAP —
    // queda como dato histórico, ya no decide qué se dibuja.
    const list = info.t.map(([region,intensity])=>({region,intensity})).sort((a,b)=>b.intensity-a.intensity);
    return { diagram: info.diagram, list, views: viewsForRegions(list), dominant: dominantView(list) };
  }

  function muscleDiagramFor(exerciseName){
    const m = muscleTargets(exerciseName);
    if(!m) return "";
    const primary = m.list.filter(x=>x.intensity>=0.75).map(x=>MUSCLE_LABELS[x.region]||x.region);
    const secondary = m.list.filter(x=>x.intensity<0.75).map(x=>MUSCLE_LABELS[x.region]||x.region);
    // V33: igual que la ficha y las miniaturas, si el ejercicio tiene lámina
    // propia se muestra esa en vez del diagrama SVG. Misma resolución
    // (exerciseAnatomyImageFor), sin un segundo mapa. La caja se mantiene en el
    // ancho de siempre (74px) para no mover el layout del formulario; con
    // height:auto la lámina conserva su proporción.
    const anatomyImg = exerciseAnatomyImageFor(exerciseName);
    const pic = anatomyImg
      ? `<img src="${esc(anatomyImg)}" style="width:74px; height:auto; display:block; border-radius:8px" alt="">`
      : `<div class="muscle-diagram-pic">${bodyDiagramSvg([m.dominant], m.list)}</div>`;
    return `
      <div class="muscle-diagram">
        ${pic}
        <div class="helptext" style="text-align:center">
          Principal: <b style="color:var(--text)">${esc(primary.join(" y "))}</b>${secondary.length?` · También: ${esc(secondary.join(", "))}`:""}
        </div>
      </div>
    `;
  }

  // Miniatura para listas (rutina/sesión): prioridad = imagen propia del
  // usuario (link pegado) > lámina anatómica del ejercicio > diagrama SVG
  // > diagrama muscular automático.
  // V32: la foto y el diagrama ya no comparten caja. El diagrama de cuerpo
  // entero es alto y angosto; una lámina/foto es casi cuadrada o apaisada. Si
  // se mete en la caja del diagrama queda diminuta y con dos franjas grises.
  // `photoSizeStyle` le da una caja propia (más ancha y más baja); como el alto
  // de la fila lo marca el diagrama, no cambia nada del layout.
  // Si no se pasa, se usa la misma caja de siempre (comportamiento anterior).
  //
  // V33: las fotos y videos de demostración se sacaron de la app (la ejecución
  // se consulta en MuscleWiki con "Cómo hacerlo ↗"), así que acá ya no hay foto
  // oficial. Queda `imagenUrl`, que es el link que el propio usuario pega en un
  // ejercicio de su rutina — dato suyo, no un asset de la app.
  function exerciseThumbHtml(ex, sizeStyle, photoSizeStyle){
    const url = ex && ex.imagenUrl;
    if(url){
      return `<img src="${esc(url)}" style="${photoSizeStyle || sizeStyle}; object-fit:contain; border-radius:8px; background:var(--surface-2)" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`;
    }
    // V32: si el ejercicio tiene lámina propia, la miniatura usa ESE mismo
    // archivo en vez del diagrama SVG. Se resuelve con la MISMA función que la
    // ficha (exerciseAnatomyImageFor → canónico + aliases), así que no hay un
    // segundo mapa que mantener sincronizado.
    // Va en la caja de la foto, no en la del diagrama: la lámina es casi
    // cuadrada (1,07) y la caja del diagrama es alta y angosta (0,42), así que
    // ahí quedaría diminuta. Son cajas que ya existen, no cambia el layout.
    // object-fit:contain la encaja sin deformarla. `loading="lazy"` sí sirve
    // acá (a diferencia de la ficha) porque la caja tiene alto explícito.
    const nombre = ex ? ex.nombre : "";
    const anatomyImg = exerciseAnatomyImageFor(nombre);
    if(anatomyImg){
      return `<img src="${esc(anatomyImg)}" style="${photoSizeStyle || sizeStyle}; object-fit:contain" alt="" loading="lazy">`;
    }
    const m = muscleTargets(nombre);
    if(!m) return "";
    return `<div class="muscle-diagram-pic" style="${sizeStyle}">${bodyDiagramSvg([m.dominant], m.list)}</div>`;
  }

  // V28: el gráfico de progreso pasa de graficar cada registro individual a
  // graficar el MÁXIMO de peso por semana (semana ISO lunes-domingo, mismo
  // criterio que usa la racha — ver isoWeekMonday/ymd) — un punto por cada
  // semana en la que realmente hubo al menos un registro de ese ejercicio.
  // No se inventan semanas sin datos: si el usuario no registró nada esa
  // semana, esa semana simplemente no aparece en el gráfico. La curva puede
  // bajar (no se fuerza que sea creciente) — es información real, no un
  // error a esconder.
  function exerciseWeeklyMax(historyAsc){
    const byWeek = {};
    historyAsc.forEach(r=>{
      const parts = (r.date||"").split("-").map(n=>parseInt(n,10));
      if(parts.length!==3 || parts.some(isNaN)) return;
      const dt = new Date(parts[0], parts[1]-1, parts[2]);
      const key = ymd(isoWeekMonday(dt));
      const peso = parseFloat(r.peso)||0;
      if(!byWeek[key] || peso > byWeek[key].peso) byWeek[key] = { weekStart: key, peso };
    });
    return Object.keys(byWeek).sort().map(k=>byWeek[k]);
  }

  // Gráfico de línea peso máximo-por-semana para la pestaña "Estadísticas" de
  // la ficha de ejercicio — mismo estilo visual que antes, pero cada punto es
  // ahora una semana (ver exerciseWeeklyMax) y el período representado queda
  // explícito debajo del gráfico en vez de mostrar fechas de registros sueltos.
  function exerciseLineChart(weeklyAsc){
    const w = 300, h = 140, padX = 10, padY = 18;
    const weights = weeklyAsc.map(r=> r.peso);
    const best = Math.max(...weights);
    const min = Math.min(...weights);
    const range = (best-min)||1;
    const pts = weights.map((val,i)=>{
      const x = weights.length===1 ? w/2 : (i/(weights.length-1))*(w-padX*2)+padX;
      const y = h - padY - ((val-min)/range)*(h-padY*2);
      return [x,y];
    });
    const path = pts.map((p,i)=> (i===0?"M":"L")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
    const first = weeklyAsc[0], last = weeklyAsc[weeklyAsc.length-1];
    return `
      <div class="exchart-wrap">
        <svg class="exchart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
          <line x1="0" y1="${h-padY}" x2="${w}" y2="${h-padY}" stroke="var(--border)" stroke-width="1"/>
          <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          ${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="var(--accent)"/>`).join("")}
        </svg>
        <div class="row between"><span class="helptext">Semana del ${esc(fmtDate(first.weekStart))}</span><span class="helptext">Semana del ${esc(fmtDate(last.weekStart))}</span></div>
        <div class="row between" style="margin-top:8px">
          <div><div class="num" style="font-weight:700; font-size:16px">${min} kg</div><div class="helptext">Mínimo semanal</div></div>
          <div style="text-align:right"><div class="num" style="font-weight:700; font-size:16px">${best} kg</div><div class="helptext">Mejor marca (máx. semanal)</div></div>
        </div>
        <div class="helptext" style="text-align:center; margin-top:6px">${weeklyAsc.length} semana${weeklyAsc.length===1?"":"s"} con registros · máximo de peso por semana</div>
      </div>
    `;
  }

  // Ficha de ejercicio (pantalla completa, no modal): equipamiento + grupo
  // muscular principal/secundario + diagrama corporal etiquetado, 3 pestañas
  // (Estadísticas / Historial / Indicaciones) que reusan datos ya existentes
  // (registros del usuario y EXERCISE_TIPS), y a la derecha una "Biblioteca"
  // con buscador + filtros para saltar a otro ejercicio sin salir de la
  // pantalla. En mobile se apila en una sola columna con un selector arriba
  // para alternar entre "Detalle" y "Biblioteca"; en pantallas anchas (ver
  // .exdetail-layout) se muestran las dos columnas lado a lado, como en la
  // referencia que mandó Juan.
  function openExerciseDetail(exOrName, opts){
    opts = opts || {};
    const isObj = exOrName && typeof exOrName === "object";
    // V28: se guarda el scroll de la pantalla que se está dejando (Entrenamiento,
    // Rutina, Explorador...) para poder restaurarlo al volver con "back" — ver
    // el handler de #btn-exdetail-back en renderExerciseDetail. Antes volver de
    // la ficha de un ejercicio siempre mandaba la pantalla de origen al tope.
    //
    // V33: además del scroll se guarda un ANCLA — el nombre del ejercicio que se
    // abrió y a qué altura de la pantalla estaba su fila. Al volver no alcanza
    // con un scrollY fijo: la lista puede medir distinto (las láminas cargan con
    // lazy, el subfiltro puede haber cambiado de alto), y el usuario terminaba en
    // otra parte. Con el ancla se recalcula la posición real de esa fila y se la
    // deja donde estaba. Si la fila ya no existe, se cae al scrollY de siempre.
    const nombreAbierto = isObj ? exOrName.nombre : exOrName;
    state.navScrollY = window.scrollY;
    // El ancla de scroll usa el nombre CRUDO a propósito: es el que está puesto
    // en el atributo data-ex-explore de la fila del DOM que se acaba de tocar.
    state.navScrollAnchor = anchorSnapshotFor(nombreAbierto);
    state.exDetail = {
      // V34: la ficha se abre siempre sobre la identidad canónica, así el
      // título, el equipamiento, la lámina, el gráfico y el historial son los
      // del mismo ejercicio aunque se haya entrado desde un día que todavía
      // tenía el nombre viejo.
      nombre: canonicalExerciseName(nombreAbierto),
      imagenUrl: isObj ? (exOrName.imagenUrl||"") : "", // link personalizado pegado en ESTE día/sesión (si lo hay)
      tab:"stats",
      mobileView:"detail",
      filterGroup:"",
      filterEquip:"",
      filterQuery:"",
      returnTab: opts.returnTab || state.tab,
      returnExplorerGroup: state.explorerGroup,
      returnExplorerSub: state.explorerSub,
    };
    state.tab = "exdetail";
    render();
  }

  // Ancla de scroll: guarda a qué altura de la ventana está la fila del
  // ejercicio que se abre. `top` es la distancia desde el borde de arriba de la
  // pantalla, que es lo que el usuario percibe como "donde estaba".
  function anchorSnapshotFor(nombre){
    if(!nombre) return null;
    const row = document.querySelector(`[data-ex-explore="${cssAttrEscape(nombre)}"]`);
    if(!row) return null;
    return { nombre, top: row.getBoundingClientRect().top };
  }
  function cssAttrEscape(v){
    return String(v).replace(/["\\]/g, "\\$&");
  }
  // Descarta una restauración pendiente. Se llama cuando el usuario cambia de
  // grupo o de subfiltro a propósito: en ese caso la lista es otra y volver a
  // una posición vieja sería molesto, no útil.
  function clearNavScroll(){
    state.navScrollY = null;
    state.navScrollAnchor = null;
  }

  // Restaura la posición de la pantalla a la que se vuelve. No es un scrollTo
  // fijo: reintenta durante unos frames porque la lista se pinta y después
  // crece (imágenes con lazy, fuentes, subfiltros), y un solo scrollTo se queda
  // corto cuando el documento todavía era más chico que la posición pedida.
  // Termina cuando la posición pedida se pudo aplicar de verdad (o al agotar
  // los intentos), así que no pelea con el usuario si ya empezó a scrollear.
  function restoreNavScroll(){
    const y = state.navScrollY;
    const anchor = state.navScrollAnchor;
    state.navScrollY = null;
    state.navScrollAnchor = null;
    if(y == null && !anchor) return;
    let tries = 0;
    const step = ()=>{
      tries++;
      let target = y || 0;
      if(anchor){
        const row = document.querySelector(`[data-ex-explore="${cssAttrEscape(anchor.nombre)}"]`);
        // La fila vuelve a quedar a la misma altura de pantalla que tenía.
        if(row) target = window.scrollY + row.getBoundingClientRect().top - anchor.top;
      }
      const max = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
      const clamped = Math.min(Math.max(0, target), max);
      if(Math.abs(window.scrollY - clamped) > 1) window.scrollTo(0, clamped);
      // Se sigue reintentando solo mientras el documento todavía no da la altura
      // necesaria; si ya llegamos, se corta.
      const llego = Math.abs(clamped - target) <= 1;
      if(!llego && tries < 12) nextFrame(step);
    };
    nextFrame(()=> nextFrame(step));
  }
  // requestAnimationFrame no dispara cuando la pestaña está oculta (pasar la app
  // a segundo plano justo al volver atrás dejaba la restauración colgada). Se
  // agenda por las dos vías y gana la primera que llegue.
  function nextFrame(fn){
    let hecho = false;
    const once = ()=>{ if(hecho) return; hecho = true; fn(); };
    requestAnimationFrame(once);
    setTimeout(once, 32);
  }

  // V34: los dos lados de la comparación pasan por canonicalExerciseName, así
  // un registro guardado con un nombre viejo ("Gemelos") y uno nuevo
  // ("Gemelos parado con mancuerna") caen en el MISMO historial y en el mismo
  // gráfico de evolución. `state.registros` ya viene canonicalizado por
  // rowToRegistro; canonicalizar igual los dos lados deja la función correcta
  // sin depender de quién la llame ni con qué nombre.
  function exerciseHistoryFor(nombre){
    const canon = canonicalExerciseName(nombre);
    return (state.registros||[]).filter(r=>canonicalExerciseName(r.exercise)===canon)
      .slice().sort((a,b)=> a.date<b.date?-1:(a.date>b.date?1:0));
  }
  function exStatsTabHtml(history){
    if(!history.length) return `<p class="helptext" style="text-align:center; padding:16px 0">No hay datos todavía.</p>`;
    return exerciseLineChart(exerciseWeeklyMax(history));
  }
  function exHistoryTabHtml(history){
    if(!history.length) return `<p class="helptext" style="text-align:center; padding:16px 0">No hay datos todavía.</p>`;
    const desc = history.slice().reverse();
    return `<div class="loglist">${desc.map(r=>`
      <div class="logrow">
        <div><div class="lex">${esc(fmtDate(r.date))}</div>${r.nota?`<div class="ldate">${esc(r.nota)}</div>`:""}</div>
        <div><div class="lval num">${esc(r.peso)} kg</div><div class="lsub">${esc(r.series||"-")}×${esc(r.reps||"-")}</div></div>
      </div>
    `).join("")}</div>`;
  }
  function exTipsTabHtml(nombre){
    const tips = EXERCISE_TIPS[canonicalExerciseName(nombre)] || [];
    if(!tips.length) return `<p class="helptext" style="text-align:center; padding:16px 0">Todavía no hay consejos de técnica cargados para este ejercicio.</p>`;
    return `<div class="tips-box"><ul class="tips-list">${tips.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`;
  }

  // Catálogo completo para la Biblioteca: todo EXERCISES, con su grupo
  // muscular (o "Cardio / funcional" si no tiene entrada en MUSCLE_MAP) y su
  // equipamiento — para poder buscar y filtrar sin inventar una fuente de
  // datos paralela.
  function exerciseLibraryCatalog(){
    return EXERCISES.map(n=>({
      nombre:n,
      group: exerciseMuscleGroup(n) || "Cardio / funcional",
      equip: exerciseEquipment(n),
    })).sort((a,b)=>a.nombre.localeCompare(b.nombre,"es"));
  }

  function screenExerciseDetail(){
    const d = state.exDetail;
    const nombre = d.nombre;
    const history = exerciseHistoryFor(nombre);
    const m = muscleTargets(nombre);
    const groups = exercisePrincipalSecondaryGroups(nombre);
    const equip = exerciseEquipment(nombre);
    // V33: ya no hay fotos ni videos de demostración cargados en la app — la
    // ejecución se consulta en MuscleWiki con "Cómo hacerlo ↗". Lo único que
    // queda es el link que el propio usuario pegó a mano en ESTE ejercicio de su
    // rutina (imagenUrl), que es dato suyo y se sigue respetando.
    const photoUrl = d.imagenUrl || null;
    const mediaUrl = photoUrl;
    const photoBlock = photoUrl ? `
      <div style="display:flex; justify-content:center">
        <img src="${esc(photoUrl)}" class="howto-photo" alt="${esc(nombre)}" onerror="this.style.display='none'">
      </div>
    ` : "";
    // Si el ejercicio tiene lámina anatómica propia se muestra esa imagen tal
    // cual, con sus proporciones originales, en vez del diagrama SVG. El resto
    // de los ejercicios no cambia.
    const anatomyImg = exerciseAnatomyImageFor(nombre);
    const diagramBlock = anatomyImg ? `
      <div style="display:flex; flex-direction:column; align-items:center; gap:8px">
        <img src="${esc(anatomyImg)}" class="anatomy-photo" alt="">
        ${m ? muscleLegendHtml(m.list) : ""}
      </div>
    ` : (m ? `
      <div style="display:flex; flex-direction:column; align-items:center; gap:8px">
        <div class="howto-pic howto-pic-labeled" style="width:${m.views.length>1 ? 230 : 115}px">${bodyDiagramSvg(m.views, m.list)}</div>
        ${muscleLegendHtml(m.list)}
      </div>
    ` : (mediaUrl ? "" : `<p class="helptext" style="text-align:center">Todavía no hay datos de músculo cargados para este ejercicio.</p>`));
    // V44: bloque de ejecución. Se arma SOLO si el ejercicio tiene animación; si
    // no, gifBlock es "" y la ficha queda exactamente como antes (sin hueco, sin
    // placeholder, sin pedido de red). El onerror esconde la tarjeta completa,
    // así que un archivo faltante tampoco deja un recuadro vacío.
    // V44.2: una sola animación por ejercicio, sin selector de variantes.
    const gifUrl = exerciseGifFor(nombre);
    const gifBlock = gifUrl ? `
      <div class="card exec-gif-card" style="margin-top:10px">
        <div class="section-title" style="margin-top:0">
          <h2 style="font-size:15px">Ejecución</h2>
        </div>
        <div class="exec-gif-box" style="margin-top:8px">
          <img class="exec-gif" src="${esc(gifUrl)}" alt="Animación de ejecución de ${esc(nombre)}"
               loading="lazy" decoding="async"
               onerror="this.closest('.exec-gif-card').style.display='none'">
        </div>
      </div>
    ` : "";
    const tabContent = d.tab==="stats" ? exStatsTabHtml(history) : d.tab==="history" ? exHistoryTabHtml(history) : exTipsTabHtml(nombre);

    const catalog = exerciseLibraryCatalog();
    const equipOptions = Array.from(new Set(catalog.map(x=>x.equip))).sort((a,b)=>a.localeCompare(b,"es"));
    const q = normalizeTxt(d.filterQuery);
    const filtered = catalog.filter(x=>{
      if(d.filterGroup && x.group!==d.filterGroup) return false;
      if(d.filterEquip && x.equip!==d.filterEquip) return false;
      if(q && !normalizeTxt(x.nombre).includes(q)) return false;
      return true;
    });

    const detailCol = `
      <div class="exdetail-col detail-col" data-col="detail" ${d.mobileView!=="detail" ? "hidden" : ""}>
        <h2 style="font-size:22px; margin-bottom:4px">${esc(nombre)}</h2>
        <div class="card exdetail-toprow">
          <div class="exdetail-meta">
            <div>Equipamiento: <b>${esc(equip)}</b></div>
            <div>Grupo muscular principal: <b>${esc(groups.principal||"No disponible")}</b></div>
            ${groups.secondary ? `<div>Grupo muscular secundario: <b>${esc(groups.secondary)}</b></div>` : ""}
          </div>
          ${mediaUrl ? photoBlock : diagramBlock}
        </div>
        ${mediaUrl && m ? diagramBlock : ""}
        ${gifBlock}
        ${(()=>{ const link = exerciseHowtoLinkFor(nombre); return link ? `
          <a class="btn btn-outline btn-block howto-link" id="btn-howto-link" href="${esc(link)}" target="_blank" rel="noopener noreferrer" style="margin-top:10px; border-color:var(--accent); color:var(--accent)">Cómo hacerlo ↗</a>
          <p class="helptext" style="text-align:center; margin-top:4px">Se abre MuscleWiki, un sitio externo.</p>` : ""; })()}
        <div class="segmented" style="margin-top:14px">
          <button data-extab="stats" class="${d.tab==="stats"?"active":""}">Estadísticas</button>
          <button data-extab="history" class="${d.tab==="history"?"active":""}">Historial</button>
          <button data-extab="tips" class="${d.tab==="tips"?"active":""}">Indicaciones</button>
        </div>
        <div class="card" style="margin-top:10px">${tabContent}</div>
      </div>
    `;
    const libraryCol = `
      <div class="exdetail-col library-col" data-col="library" ${d.mobileView!=="library" ? "hidden" : ""}>
        <div class="card stack">
          <button class="btn btn-outline btn-block" id="btn-ex-custom">${icon("plus")} Ejercicio personalizado</button>
          <div class="exlib-filters">
            <div class="field-row">
              <div class="field">
                <label>Equipamiento</label>
                <select id="exlib-equip">
                  <option value="">Todo el equipamiento</option>
                  ${equipOptions.map(e=>`<option value="${esc(e)}" ${d.filterEquip===e?"selected":""}>${esc(e)}</option>`).join("")}
                </select>
              </div>
              <div class="field">
                <label>Grupo muscular</label>
                <select id="exlib-group">
                  <option value="">Todos los grupos</option>
                  ${MUSCLE_GROUPS.concat(["Cardio / funcional"]).map(g=>`<option value="${esc(g)}" ${d.filterGroup===g?"selected":""}>${esc(g)}</option>`).join("")}
                </select>
              </div>
            </div>
            <div class="field">
              <label>Buscar</label>
              <input type="text" id="exlib-search" placeholder="Buscar ejercicios" value="${esc(d.filterQuery)}">
            </div>
          </div>
          <div class="section-title" style="margin-top:2px"><h2 style="font-size:15px">Todos los ejercicios</h2><span class="muted">${filtered.length}</span></div>
          <div class="exlib-list">
            ${filtered.length ? filtered.map(x=>`
              <div class="exlib-row ${x.nombre===nombre?"active":""}" data-exlib="${esc(x.nombre)}">
                ${exerciseThumbHtml({nombre:x.nombre}, "width:24px;height:58px;flex:none", "width:42px;height:54px;flex:none")}
                <div style="min-width:0">
                  <div class="exlib-name">${esc(x.nombre)}</div>
                  <div class="exlib-cap">${esc(x.group)}</div>
                </div>
              </div>
            `).join("") : `<p class="helptext" style="padding:10px 0">Ningún ejercicio coincide con estos filtros.</p>`}
          </div>
        </div>
      </div>
    `;

    return `
      <div class="exdetail-mobile-toggle segmented" style="margin-bottom:2px">
        <button data-exview="detail" class="${d.mobileView==="detail"?"active":""}">Detalle</button>
        <button data-exview="library" class="${d.mobileView==="library"?"active":""}">Biblioteca</button>
      </div>
      <div class="exdetail-layout">${detailCol}${libraryCol}</div>
    `;
  }

  function renderExerciseDetail(){
    app.classList.add("app-wide");
    app.innerHTML = `
      <div class="topbar">
        <span class="iconbtn" id="btn-exdetail-back">${icon("back")}</span>
        <h1 style="font-size:18px; flex:1; text-align:center">Ficha del ejercicio</h1>
        <span style="width:30px"></span>
      </div>
      <main><div class="screen" id="screen"></div></main>
    `;
    document.getElementById("btn-exdetail-back").onclick = ()=>{
      const d = state.exDetail;
      state.tab = (d && d.returnTab) || "rutina";
      state.explorerGroup = d ? d.returnExplorerGroup : null;
      // V33: el subfiltro del explorador (Cuádriceps, Bíceps, ...) también se
      // restaura; antes solo volvía el grupo y el subfiltro quedaba a la deriva.
      state.explorerSub = d ? (d.returnExplorerSub || null) : null;
      state.exDetail = null;
      render();
      // V28/V33: restaura la posición de la pantalla de origen (Entrenamiento,
      // Rutina, Explorador...). Ver restoreNavScroll: usa el ancla del ejercicio
      // cuando existe y reintenta hasta que el documento da la altura necesaria.
      restoreNavScroll();
    };
    document.getElementById("screen").innerHTML = screenExerciseDetail();
    mountExerciseDetail();
  }

  function mountExerciseDetail(){
    const el = document.getElementById("screen");
    const d = state.exDetail;
    el.querySelectorAll("[data-extab]").forEach(b=>{
      b.onclick = ()=>{ d.tab = b.dataset.extab; renderScreenExerciseDetail(); };
    });
    el.querySelectorAll("[data-exview]").forEach(b=>{
      b.onclick = ()=>{ d.mobileView = b.dataset.exview; renderScreenExerciseDetail(); };
    });
    el.querySelectorAll("[data-exlib]").forEach(row=>{
      row.onclick = ()=>{
        d.nombre = row.dataset.exlib;
        d.imagenUrl = ""; // el link personalizado era del ejercicio anterior, no de este
        d.tab = "stats";
        d.mobileView = "detail";
        renderScreenExerciseDetail();
      };
    });
    const equipSel = el.querySelector("#exlib-equip");

  /* ============ 2B: BUSCADOR DEL CATÁLOGO OFICIAL ============
     Problemas que tenía la versión anterior, medidos sobre el catálogo real:

     1. `includes` exige substring CONTIGUO, así que cualquier búsqueda de más
        de una palabra caía a cero resultados. "press banca" — que es,
        literalmente, el placeholder del propio formulario — devolvía 0 de 7
        coincidencias posibles. Lo mismo "sentadilla barra", "remo mancuerna",
        "aperturas banco".
     2. Los aliases NO entraban al pool (el pool era EXERCISES), así que todo
        el vocabulario real de gimnasio era inalcanzable: "Prensa de piernas",
        "Curl femoral", "Pec deck", "Elevaciones laterales" devolvían cero,
        aunque la tabla de aliases los traduce perfecto.
     3. El corte era alfabético dentro de cada nivel, no por relevancia, y
        escondía el resto en silencio.
     4. La coincidencia EXACTA se descartaba adrede.

     Jerarquía de relevancia (§4 de 2B). Un ejercicio entra por su MEJOR nivel:
       0 exacto   — el nombre normalizado es la consulta
       1 comienzo — el nombre empieza con la consulta
       2 palabras — todas las palabras de la consulta están en el nombre
       3 alias    — alguna de las de arriba matcheó contra un alias
       4 parcial  — la consulta aparece suelta dentro del nombre
     A igual nivel gana el nombre MÁS CORTO (casi siempre la variante base:
     "Press de banca con barra" antes que "...inclinado con mancuernas") y el
     alfabético decide el último empate.

     Devuelve la lista COMPLETA ya ordenada. El recorte a 4 y el "Ver X más..."
     son presentación y viven en attachAutocomplete.

     SÓLO devuelve ejercicios OFICIALES ACTIVOS. Los ejercicios personalizados
     del usuario (§7 de 2B) no son parte del catálogo y no se sugieren acá. */
  const AC_MIN_CHARS = 2;
  const AC_INITIAL = 4;
  const AC_RANK = { exacto:0, comienzo:1, palabras:2, alias:3, parcial:4 };

  // Normalización de búsqueda (§5 de 2B): minúsculas, sin tildes y espacios
  // repetidos colapsados, así que "PRESS  BANCA" y "press banca" son lo mismo.
  function normalizeSearch(s){
    return (s||"").toString().toLowerCase().normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/\s+/g, " ")
      .trim();
  }

  function exerciseSuggestions(query){
    const q = normalizeSearch(query);
    if(q.length < AC_MIN_CHARS) return [];
    const palabras = q.split(" ").filter(Boolean);
    // Nivel de una cadena candidata (nombre oficial o alias) contra la consulta.
    // null = no matchea. El nivel "palabras" solo aplica con 2+ palabras: con
    // una sola sería idéntico a "parcial".
    const nivel = (texto)=>{
      const t = normalizeSearch(texto);
      if(t === q) return AC_RANK.exacto;
      if(t.startsWith(q)) return AC_RANK.comienzo;
      if(palabras.length > 1 && palabras.every(p=> t.indexOf(p) !== -1)) return AC_RANK.palabras;
      if(t.indexOf(q) !== -1) return AC_RANK.parcial;
      return null;
    };
    // nombre oficial -> mejor nivel con el que se lo alcanzó
    const mejor = new Map();
    const considerar = (nombre, rank)=>{
      const prev = mejor.get(nombre);
      if(prev === undefined || rank < prev) mejor.set(nombre, rank);
    };
    activeExercises().forEach(nombre=>{
      const r = nivel(nombre);
      if(r !== null) considerar(nombre, r);
    });
    // Los aliases aportan VOCABULARIO, no entradas: lo que se sugiere es
    // siempre el nombre oficial de destino (§4: la interfaz muestra únicamente
    // el nombre oficial, sin explicar por qué apareció).
    Object.keys(EXERCISE_ALIASES).forEach(alias=>{
      const destino = EXERCISE_ALIASES[alias];
      if(EXERCISES.indexOf(destino) === -1) return; // alias colgado: se ignora
      if(nivel(alias) !== null) considerar(destino, AC_RANK.alias);
    });
    return Array.from(mejor.keys()).sort((a,b)=>{
      const d = mejor.get(a) - mejor.get(b);
      if(d) return d;
      if(a.length !== b.length) return a.length - b.length;
      return a.localeCompare(b, "es");
    });
  }

  // Muestra AC_INITIAL (4) resultados y, si hay más, una fila "Ver X más..."
  // que expande la lista EN EL MISMO LUGAR (§3 de 2B): no abre otra pantalla.
  // `expandido` se resetea en cada tecleo, porque la lista cambió.
  //
  // El input sigue siendo texto libre: el autocompletado solo PROPONE. Nunca
  // autoselecciona ni impide escribir un nombre que no está en el catálogo
  // (§7 de 2B — alta manual de ejercicios personalizados).
  function attachAutocomplete(input, listEl, onSelect){
    if(!input || !listEl) return;
    let expandido = false;
    function pintar(){
      const todas = exerciseSuggestions(input.value);
      if(!todas.length){ listEl.innerHTML=""; listEl.style.display="none"; return; }
      const visibles = expandido ? todas : todas.slice(0, AC_INITIAL);
      const resto = todas.length - visibles.length;
      listEl.innerHTML =
        visibles.map(s=>`<div class="ac-item" data-val="${esc(s)}">${esc(s)}</div>`).join("") +
        (resto > 0 ? `<div class="ac-item ac-more" data-ac-more="1">Ver ${resto} más...</div>` : "");
      listEl.style.display = "block";
      // "Ver X más..." NO lleva data-val: no se puede elegir como ejercicio.
      const more = listEl.querySelector("[data-ac-more]");
      if(more) more.addEventListener("mousedown", (e)=>{
        e.preventDefault();
        expandido = true;
        pintar();
        input.focus();
      });
      listEl.querySelectorAll(".ac-item[data-val]").forEach(it=>{
        it.addEventListener("mousedown", (e)=>{
          e.preventDefault();
          input.value = it.dataset.val;
          listEl.innerHTML = ""; listEl.style.display = "none";
          input.focus();
          if(onSelect) onSelect(input.value);
        });
      });
    }
    function update(){ expandido = false; pintar(); }
    input.addEventListener("input", update);
    input.addEventListener("focus", update);
    input.addEventListener("blur", ()=>{ setTimeout(()=>{ listEl.style.display="none"; }, 120); });
  }

  /* ---------- Utilities ---------- */

  function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

  /* ---------- Racha / meta semanal ---------- */
  function isoWeekMonday(d){
    const day = (d.getDay()+6)%7; // 0=lunes .. 6=domingo
    const monday = new Date(d.getFullYear(), d.getMonth(), d.getDate()-day);
    return monday;
  }
  function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function computeRacha(entrenos, metaSemanal){
    const goal = metaSemanal>0 ? metaSemanal : 3;
    const today = new Date();
    const curMonday = isoWeekMonday(today);
    const byWeek = {};
    (entrenos||[]).forEach(e=>{
      if(!e.date) return;
      const parts = e.date.split("-").map(n=>parseInt(n,10));
      const d = new Date(parts[0], parts[1]-1, parts[2]);
      const key = ymd(isoWeekMonday(d));
      byWeek[key] = (byWeek[key]||0)+1;
    });
    const curKey = ymd(curMonday);
    const thisWeekCount = byWeek[curKey]||0;
    const remaining = Math.max(0, goal-thisWeekCount);
    const todayIdx = (today.getDay()+6)%7;
    const daysLeft = 7-todayIdx;
    let streak = 0;
    let cursor = new Date(curMonday.getFullYear(), curMonday.getMonth(), curMonday.getDate()-7);
    while(streak<104){
      const key = ymd(cursor);
      const count = byWeek[key]||0;
      if(count>=goal){ streak++; cursor = new Date(cursor.getFullYear(), cursor.getMonth(), cursor.getDate()-7); }
      else break;
    }
    return { goal, thisWeekCount, remaining, daysLeft, streak };
  }

  /* ---------- Store abstraction (Supabase con autenticación real por correo) ---------- */

    function rowToProfile(r){

      if("edad" in data) row.edad = data.edad;

    const rutinaRepository = VodaFitPersistence.createRepository(client);
    const readRutina = pid => rutinaRepository.read(pid);
    async function getRutina(pid){ return (await readRutina(pid)).data; }
    const saveRutina = (pid, data, base, isCurrent) => rutinaRepository.write(pid, data, base, isCurrent);

    function rowToRegistro(r){
      return { id: r.id, exercise: canonicalExerciseName(r.exercise), peso: r.peso, date: r.date, series: r.series||"", reps: r.reps||"", nota: r.nota||"", createdAt: r.created_at||0, setNumber: (r.set_number==null? null : r.set_number), entrenoId:r.entreno_id||null, exerciseInstance:r.ejercicio_instancia||null };
    }
    async function listSessionRegistros(pid,entrenoId){
      const rows=[];
      for(let offset=0;;offset+=500){
        const {data,error}=await client().from("registros").select("*")
          .eq("profile_id",pid).eq("entreno_id",entrenoId).order("id").range(offset,offset+499);
        if(error) throw error;
        rows.push(...(data||[]).map(rowToRegistro));
        if(!data || data.length<500) return rows;
      }
    }

    // v28.1: `setNumber` es opcional (nullable en la base — ver
    // supabase-migration-v28.sql) — el formulario clásico de la pestaña
    // Registro sigue sin mandarlo (queda null, comportamiento de siempre).
    // Solo el registro por-serie desde dentro de una sesión lo manda.
    // Devuelve el `id` de la fila creada (antes devolvía solo un booleano) —
    // hace falta para poder reabrir y editar ESA serie puntual más tarde sin
    // crear un registro duplicado; ningún llamador existente miraba el valor
    // de retorno, así que este cambio de forma no rompe nada ya escrito.
    // V34: la fila que se va a insertar se arma en una función aparte y PURA,
    // para poder testear la canonicalización de la escritura sin tocar la base.
    // El nombre se canonicaliza acá, en este único punto de escritura — así
    // toda fila nueva entra ya con la identidad canónica y deja de sumar
    // variantes de escritura. Las filas históricas NO se tocan: se siguen
    // resolviendo al leer (rowToRegistro), que es lo que mantiene el historial
    // viejo y el nuevo en un mismo grupo.
    function registroRowFor(pid, data){
      return { profile_id: pid, exercise: canonicalExerciseName(data.exercise), peso: data.peso, date: data.date, series: data.series||"", reps: data.reps||"", nota: data.nota||"", created_at: data.createdAt||Date.now(), set_number: (data.setNumber==null? null : data.setNumber) };
    }

    const historyCompat=VodaFitHistory.createController({capabilities:VodaFitPersistence.capabilities,
      account:()=>({owner:state.profile?.id,loaded:!!state.persistence,clienteV48:!!state.persistence?.clienteV48,
        schemaReady:!!state.persistence?.schemaReady,epoch:authLoadGeneration}),
      rpc:(...args)=>nativeRpc(...args),canonical:canonicalExerciseName,
      readRecord:async(pid,id)=>{
        const {data,error}=await client().from("registros").select("id,profile_id,exercise,peso,date,reps,series,nota,set_number,created_at,entreno_id")
          .eq("profile_id",pid).eq("id",id).maybeSingle();if(error) throw error;return data;
      },
      readWorkout:async(pid,id)=>{
        const {data,error}=await client().from("entrenos").select("id,profile_id,date,day_nombre,is_manual,sesion_id")
          .eq("profile_id",pid).eq("id",id).maybeSingle();if(error) throw error;return data;
      }});
    let historyResult=null;
    function historyStatus(){return historyResult && historyResult.owner===state.profile?.id && historyResult.epoch===authLoadGeneration ? historyResult.result : null;}
    function rememberHistory(pid,result,epoch){
      if(state.profile?.id!==pid || epoch!==authLoadGeneration) return {ok:false,code:"ACCOUNT_CHANGED"};
      historyResult={owner:pid,epoch,result};return result;
    }
    function manualPayload(data){return {exercise:canonicalExerciseName(data.exercise),peso:data.peso,date:data.date,
      series:data.series||"",reps:data.reps||"",nota:data.nota||""};}
    async function addRegistro(pid, data){
      const route=historyCompat.mode(pid),epoch=authLoadGeneration;
      if(!route.ok)return rememberHistory(pid,route,epoch);
      try {
        if(route.mode==="v48"){
          if(data.setNumber!=null)return rememberHistory(pid,{ok:false,code:"LEGACY_SESSION_MUST_BE_FINISHED"},epoch);
          return rememberHistory(pid,await historyCompat.save(pid,manualPayload(data)),epoch);
        }
        const row = registroRowFor(pid, data);
        if(data.id)row.id=data.id; // UUID de este formulario: un retry no crea otra fila V47.
        const { data: inserted, error } = await client().from("registros").insert(row).select().single();
        if(error?.code==="23505" && data.id){
          const found=await client().from("registros").select("id,profile_id,exercise,peso,date,reps,series,nota,set_number")
            .eq("profile_id",pid).eq("id",data.id).maybeSingle();
          if(!found.error && found.data && VodaFitHistory.sameRecord(found.data,manualPayload(data))
            && found.data.set_number===(data.setNumber??null))return rememberHistory(pid,{ok:true,id:data.id,replayed:true},epoch);
        }
        return rememberHistory(pid,{ok:!error,id:inserted && inserted.id,error},epoch);
      } catch(error){return rememberHistory(pid,{ok:false,code:"NETWORK_ERROR",error},epoch);}
    }

    // v28.1: actualiza un registro ya existente en el lugar (en vez de crear
    // uno nuevo) — se usa para editar la serie activa cuando ya tenía un
    // registro cargado (ver openSessionLogModal). No toca `set_number` a
    // propósito (una serie no cambia de número al editarse).
    async function updateRegistro(pid, id, data){
      const route=historyCompat.mode(pid),epoch=authLoadGeneration;
      if(!route.ok){rememberHistory(pid,route,epoch);return false;}
      try {
        if(route.mode==="v48")return rememberHistory(pid,await historyCompat.edit(pid,id,{peso:data.peso,date:data.date,
          series:data.series||"",reps:data.reps||"",nota:data.nota||""}),epoch).ok;
        const row = { peso: data.peso, date: data.date, series: data.series||"", reps: data.reps||"", nota: data.nota||"" };
        const { error } = await client().from("registros").update(row).eq("id", id).eq("profile_id", pid);
        return rememberHistory(pid,{ok:!error,error},epoch).ok;
      } catch(error){rememberHistory(pid,{ok:false,code:"NETWORK_ERROR",error},epoch);return false;}
    }

    async function deleteRegistro(pid, id){
      const route=historyCompat.mode(pid),epoch=authLoadGeneration;
      if(!route.ok){rememberHistory(pid,route,epoch);return false;}
      try {
        if(route.mode==="v48")return rememberHistory(pid,await historyCompat.remove(pid,id),epoch).ok;
        const { error } = await client().from("registros").delete().eq("id", id).eq("profile_id", pid);
        return rememberHistory(pid,{ok:!error,error},epoch).ok;
      } catch(error){rememberHistory(pid,{ok:false,code:"NETWORK_ERROR",error},epoch);return false;}
    }

    /* ---------- V41: ventanas de lectura del historial ----------
       Antes estos dos números estaban escritos a mano dentro de su consulta
       (300 en registros, 200 en entrenos). El problema no era el valor sino
       que cualquier métrica calculada sobre lo cargado quedaba silenciosamente
       acotada a esa ventana: un "récord personal" era en realidad el máximo de
       los últimos 300 registros, y un total de entrenamientos se tapaba en 200
       sin avisar. La auditoría previa al dashboard de Perfil lo detectó.

       Ahora son constantes con nombre, exportadas, para que un test pueda
       fijar el valor en vez de confiar en que nadie lo cambie de nuevo.
       Quedan las tres fuentes en 1000, el mismo valor que ya usaba
       peso_corporal desde V40.

       NO es paginación ni son consultas agregadas: es solo una ventana más
       grande. Si el historial de alguien supera las 1000 filas, el recorte
       vuelve a existir — ese caso se resuelve cuando aparezca, con paginación
       o con count/max del lado del servidor. */
    const REGISTROS_LIMIT = 1000;
    const ENTRENOS_LIMIT = 1000;

    async function listRegistros(pid){
      const { data, error } = await client().from("registros").select("*").eq("profile_id", pid)
        .order("date",{ascending:false}).order("created_at",{ascending:false}).limit(REGISTROS_LIMIT);
      if(error) throw error;
      return (data||[]).map(rowToRegistro);
    }

    // V34: nombres de ejercicio CRUDOS de todo el historial, sin pasar por
    // rowToRegistro (que canonicaliza). Es solo-lectura y existe únicamente
    // para el diagnóstico de identidad: lo que hay que ver ahí es exactamente
    // lo que está guardado en la base, no la versión ya resuelta.
    //
    // No reusa listRegistros porque esa tiene su propia ventana de lectura
    // (REGISTROS_LIMIT) para la pantalla de Registro, y el diagnóstico necesita
    // mirar TODO el historial. Trae una sola columna, así el costo de pedir más
    // filas es bajo. V41: este límite de 5000 queda como estaba, a propósito.
    async function listRegistroExerciseNames(pid){
      const { data, error } = await client().from("registros").select("exercise").eq("profile_id", pid).limit(5000);
      if(error) throw error;
      return (data||[]).map(r=> r.exercise);
    }

    function rowToEntreno(r){
      return { id: r.id, date: r.date, dayId: r.day_id, dayNombre: r.day_nombre, setsCompletados: r.sets_completados, setsTotales: r.sets_totales, createdAt: r.created_at||0, isManual: !!r.is_manual, isSpecial: !!r.is_special, routineOrigin: r.routine_origin||null,
        sessionId:r.sesion_id||null,startedAt:r.inicio_ms??null,endedAt:r.fin_ms??null,timezone:r.zona_horaria||null,
        durationMs:r.sesion_id && Number.isSafeInteger(r.inicio_ms) && Number.isSafeInteger(r.fin_ms) && r.fin_ms>=r.inicio_ms ? r.fin_ms-r.inicio_ms : null };
    }

    // V28: `is_manual` distingue un entrenamiento cerrado desde "Finalizar"
    // (con series/sets reales) de uno marcado a mano desde el calendario
    // ("entrené este día", sin inventar series/pesos — ver openMarkTrainedModal).
    // Requiere la columna nueva de supabase-migration-v28.sql (default false,
    // así que las filas viejas siguen leyéndose como entrenamientos reales).
    async function addEntreno(pid, data){
      const route=historyCompat.mode(pid),epoch=authLoadGeneration;
      if(!route.ok)return rememberHistory(pid,route,epoch);
      if(route.mode==="v48"){
        if(!data.isManual || data.isSpecial || data.dayId || data.setsCompletados || data.setsTotales)
          return rememberHistory(pid,{ok:false,code:"USE_NATIVE_SESSION_RPC"},epoch);
        return rememberHistory(pid,await historyCompat.mark(pid,{date:data.date,dayNombre:data.dayNombre}),epoch);
      }
      try {
      const row = { profile_id: pid, date: data.date, day_id: data.dayId, day_nombre: data.dayNombre, sets_completados: data.setsCompletados, sets_totales: data.setsTotales, created_at: data.createdAt||Date.now(), is_manual: !!data.isManual };
      // V29: is_special (supabase-migration-v29.sql) se manda SOLO cuando es
      // true — así los entrenamientos normales y los marcados a mano siguen
      // funcionando igual aunque la migración v29 todavía no se haya corrido.
      if(data.isSpecial) row.is_special = true;
      if(data.id)row.id=data.id;
      // V30: el origen se toma de la sesión que se inició, no de la rutina
      // actualmente seleccionada. Los registros históricos y los marcados a
      // mano no mandan este campo y quedan como NULL en la base.
      if(data.routineOrigin) row.routine_origin = data.routineOrigin;
      const { error } = await client().from("entrenos").insert(row);
      if(error?.code==="23505" && data.id){
        const found=await client().from("entrenos").select("id,profile_id,date,day_nombre,is_manual,is_special,routine_origin,sets_completados,sets_totales,day_id")
          .eq("profile_id",pid).eq("id",data.id).maybeSingle();
        const old=found.data;
        if(!found.error && old && old.date===data.date && old.day_nombre===data.dayNombre
          && old.is_manual===!!data.isManual && !!old.is_special===!!data.isSpecial
          && (old.routine_origin||null)===(data.routineOrigin||null) && (old.day_id||null)===(data.dayId||null)
          && old.sets_completados===data.setsCompletados && old.sets_totales===data.setsTotales)
          return rememberHistory(pid,{ok:true,id:data.id,replayed:true},epoch);
      }
      // V29.2: devuelve también el error REAL de Supabase (antes solo un
      // booleano, y finalizeSession mostraba un mensaje genérico que
      // escondía la causa). Los demás llamadores ignoran el resultado.
      return rememberHistory(pid,error ? { ok:false, error } : { ok:true, error:null },epoch);
      } catch(error){return rememberHistory(pid,{ok:false,code:"NETWORK_ERROR",error},epoch);}
    }

    async function listEntrenos(pid){
      const { data, error } = await client().from("entrenos").select("*").eq("profile_id", pid)
        .order("date",{ascending:false}).order("created_at",{ascending:false}).limit(ENTRENOS_LIMIT);
      if(error) throw error;
      return (data||[]).map(rowToEntreno);
    }

    async function deleteEntreno(pid, id){
      const route=historyCompat.mode(pid),epoch=authLoadGeneration;
      if(!route.ok){rememberHistory(pid,route,epoch);return false;}
      try {
        if(route.mode==="v48")return rememberHistory(pid,await historyCompat.removeWorkout(pid,id),epoch).ok;
        const { error } = await client().from("entrenos").delete().eq("id", id).eq("profile_id", pid);
        return rememberHistory(pid,{ok:!error,error},epoch).ok;
      } catch(error){rememberHistory(pid,{ok:false,code:"NETWORK_ERROR",error},epoch);return false;}
    }

    /* ---------- V40: peso corporal ----------
       Tabla propia (`peso_corporal`, ver supabase-migration-v40.sql). NO se
       usa `registros`: esa tabla es el historial de pesos de EJERCICIOS, con
       su propia canonicalización de identidad, su propio límite de lectura y
       su propio CSV. Mezclar las dos cosas contaminaría todo eso.

       `profiles.peso_estimado` ya no participa: no se lee, no se escribe y no
       se sincroniza con esta tabla. `peso_corporal` es la única fuente de
       verdad del peso corporal. */

    // Límite de lectura propio, separado del de `registros` (300) y del de
    // `entrenos` (200). Con un pesaje por semana, 1000 filas son ~19 años; con
    // uno por día, casi 3. Es alto a propósito: el gráfico de "Todo" y el
    // peso inicial necesitan el historial COMPLETO, no una ventana.
    const PESO_CORPORAL_LIMIT = 1000;

    function rowToPesoCorporal(r){
      return {
        id: r.id,
        fecha: r.fecha,
        // numeric llega como número o como string según el serializador; se
        // normaliza acá, en el único punto de lectura.
        pesoKg: r.peso_kg==null ? null : parseFloat(r.peso_kg),
        nota: r.nota||"",
        createdAt: r.created_at||0,
        updatedAt: r.updated_at==null ? null : r.updated_at,
      };
    }

    // Pura, para poder testear la forma de la fila sin tocar la base.
    function pesoCorporalRowFor(pid, data){
      return {
        profile_id: pid,
        fecha: data.fecha,
        peso_kg: data.pesoKg,
        nota: data.nota ? data.nota : null,
        created_at: data.createdAt||Date.now(),
      };
    }

    async function listPesoCorporal(pid){
      // Mismo orden que el índice de la migración, y el mismo que define cuál
      // es el "peso actual": fecha desc, y ante empate de fecha el creado
      // más tarde primero.
      const { data, error } = await client().from("peso_corporal").select("*").eq("profile_id", pid)
        .order("fecha",{ascending:false}).order("created_at",{ascending:false}).limit(PESO_CORPORAL_LIMIT);
      if(error) throw error;
      return (data||[]).map(rowToPesoCorporal);
    }

    async function addPesoCorporal(pid, data){
      const row = pesoCorporalRowFor(pid, data);
      const { data: inserted, error } = await client().from("peso_corporal").insert(row).select().single();
      return { ok: !error, id: inserted && inserted.id, error: error||null };
    }

    // `updated_at` se escribe acá y en ningún otro lado: es la marca de que
    // esta fila fue editada después de crearse. `created_at` NUNCA se toca al
    // editar — si se moviera, un pesaje editado podría pasar a ser "el actual"
    // de su fecha solo por haberlo corregido.
    async function updatePesoCorporal(pid, id, data){
      const row = { fecha: data.fecha, peso_kg: data.pesoKg, nota: data.nota ? data.nota : null, updated_at: Date.now() };
      const { error } = await client().from("peso_corporal").update(row).eq("id", id).eq("profile_id", pid);
      return { ok: !error, error: error||null };
    }

    async function deletePesoCorporal(pid, id){
      const { error } = await client().from("peso_corporal").delete().eq("id", id).eq("profile_id", pid);
      return { ok: !error, error: error||null };
    }

    // Token capturado para el propietario; un cambio de cuenta no redirige la RPC.
    async function nativeRpc(owner,name,args){
      if(!VodaFitPersistence.capabilities.metadata || !VodaFitPersistence.capabilities.rpc) throw new Error("V48_NOT_READY");
      if(!["v48_iniciar","v48_estado","v48_finalizar","v48_cancelar","v48_eliminar","v48_registro_guardar","v48_registro_eliminar","v48_marcar_dia","v48_historico_eliminar"].includes(name)) throw new Error("RPC_NOT_ENABLED");
      const {data,error}=await client().auth.getSession();
      if(error || !data.session || data.session.user.id!==owner) throw new Error("ACCOUNT_CHANGED");
      const response=await fetch(SUPABASE_URL+"/rest/v1/rpc/"+name,{method:"POST",
        headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+data.session.access_token,"Content-Type":"application/json"},body:JSON.stringify(args)});
      const text=await response.text(),body=text?JSON.parse(text):null;
      return response.ok ? {data:body,status:response.status} : {error:body,status:response.status};
    }
    return { historyCompat, historyStatus, nativeRpc, listSessionRegistros, onAuthStateChange, signUp, signIn, signOut, resetPassword, updatePassword, ensureProfile, updateProfile, getRutina, readRutina, saveRutina, addRegistro,
      // V34: expuestas para los tests de canonicalizacion (escritura y lectura).
      registroRowFor, rowToRegistro, updateRegistro, deleteRegistro, listRegistros, listRegistroExerciseNames, addEntreno, listEntrenos, deleteEntreno,
      // V40: peso corporal. rowToPesoCorporal y pesoCorporalRowFor se exponen
      // para testear lectura y escritura sin tocar la base.
      listPesoCorporal, addPesoCorporal, updatePesoCorporal, deletePesoCorporal, rowToPesoCorporal, pesoCorporalRowFor, PESO_CORPORAL_LIMIT,
      // V41: expuestas para que los tests fijen la ventana de lectura.
      REGISTROS_LIMIT, ENTRENOS_LIMIT };
  })();

  function mapAuthError(error){
    const msg = (error && error.message) || "";
    if(/invalid login credentials/i.test(msg)) return "Correo o contraseña incorrectos.";
    if(/user already registered/i.test(msg)) return "Ya existe una cuenta con ese correo.";
    if(/email not confirmed/i.test(msg)) return "Todavía no confirmaste tu correo. Revisá tu bandeja de entrada.";
    if(/password should be at least/i.test(msg)) return "La contraseña tiene que tener al menos 6 caracteres.";
    if(/unable to validate email/i.test(msg) || /invalid email/i.test(msg)) return "Ese correo no parece válido.";
    if(/rate limit/i.test(msg)) return "Demasiados intentos. Esperá un minuto y probá de nuevo.";
    return msg || "Ocurrió un error. Probá de nuevo.";
  }

  /* ---------- Generic modal helper ---------- */
  function closeModal(){
    const back = document.querySelector(".modal-back");
    if(back) back.remove();
    document.removeEventListener("keydown", escHandler);
  }
  function escHandler(e){ if(e.key==="Escape") closeModal(); }
  function openModal(innerHtml, onMount){
    closeModal();
    const back = document.createElement("div");
    back.className = "modal-back";
    back.innerHTML = `<div class="modal">${innerHtml}</div>`;
    back.addEventListener("click", (e)=>{ if(e.target===back) closeModal(); });
    document.body.appendChild(back);
    document.addEventListener("keydown", escHandler);
    if(onMount) onMount(back.querySelector(".modal"));
    return back.querySelector(".modal");
  }

  // V28: pequeña confirmación visual no-bloqueante (guardar progreso,
  // registrar peso, marcar un día en el calendario) — a diferencia de un
  // modal, no requiere tocar nada para cerrarse y no interrumpe el flujo.
  let toastTimer = null;
  function showToast(msg){
    let t = document.querySelector(".toast");
    if(!t){
      t = document.createElement("div");
      t.className = "toast";
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.classList.remove("show");
    void t.offsetWidth; // reinicia la animación si ya estaba mostrándose
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>{ t.classList.remove("show"); }, 1800);
  }

  /* ---------- Rendering shell ---------- */
  /* ---------- V39: cierre del splash ----------
     El splash se va en cuanto la app terminó de inicializar (primer render
     con state.booted, sea la pantalla de login, la app o el error de
     conexión). No hay temporizador ni demora artificial: si el arranque es
     instantáneo, la transición es instantánea.
     Se quita del DOM después del fundido para que no quede un overlay
     fijo interceptando nada, y es idempotente: durante la navegación normal
     el elemento ya no existe y la función no hace nada. */
  let splashGone = false;
  function dismissSplash(){
    if(splashGone) return;
    splashGone = true;
    const el = document.getElementById("splash");
    if(!el) return;
    el.classList.add("splash-out");
    const drop = ()=>{ if(el.parentNode) el.parentNode.removeChild(el); };
    el.addEventListener("transitionend", drop, { once:true });
    setTimeout(drop, 400); // red de seguridad si no llega transitionend
  }

  function setTab(t){
    // V42: Perfil pasó a ser una pantalla larga, así que recuerda su propio

      const { error } = await Store.signIn(email, password);

        state.authError = mapAuthError(error);

      }

      const password = el.querySelector("#auth-password").value;
      const edad = parseInt(el.querySelector("#auth-edad").value, 10) || null;
      const meta = Math.max(1, Math.min(7, parseInt(el.querySelector("#auth-meta").value, 10) || 3));

      btnSignup.disabled = true; btnSignup.textContent = "Creando...";

      const { data, error } = await Store.signUp(email, password, { name, edad, metaSemanal: meta });

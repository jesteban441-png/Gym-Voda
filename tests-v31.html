<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VodaFit — Validaciones V31</title>
<style>
  :root{ color-scheme: light dark; }
  body{ font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; margin:0; padding:16px; background:#faf8f6; color:#1d1a17; }
  @media (prefers-color-scheme: dark){ body{ background:#171412; color:#eee9e3; } }
  h1{ font-size:18px; margin:0 0 4px; }
  #summary{ position:sticky; top:0; padding:10px 12px; border-radius:10px; font-weight:700; margin:12px 0; background:#e7e3de; }
  #summary.pass{ background:#DCF3E6; color:#1d5c38; }
  #summary.fail{ background:#FBE0DF; color:#8d2b2b; }
  @media (prefers-color-scheme: dark){
    #summary{ background:#26221e; } #summary.pass{ background:#173425; color:#8fe0b2; } #summary.fail{ background:#3A1F1E; color:#ff9f98; }
  }
  .grp{ margin:14px 0 6px; font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:.04em; opacity:.75; }
  .t{ padding:3px 0 3px 22px; position:relative; border-bottom:1px solid rgba(128,128,128,.14); }
  .t::before{ position:absolute; left:2px; }
  .ok::before{ content:"OK"; color:#2E9E5B; font-size:11px; font-weight:700; }
  .no::before{ content:"XX"; color:#C13B3B; font-size:11px; font-weight:700; }
  .msg{ display:block; color:#C13B3B; font-size:12.5px; padding-left:2px; }
  iframe{ position:absolute; width:420px; height:760px; left:-9999px; top:0; border:0; }
  code{ background:rgba(128,128,128,.14); padding:1px 4px; border-radius:4px; }
</style>
</head>
<body>
<h1>VodaFit — Validaciones V31</h1>
<p class="muted">Harness autocontenido: sin npm, sin build system, sin dependencias externas.
Carga <code>index.html</code> en un iframe y valida contra <code>window.__appTest</code>.
Abrilo con un servidor estático local (<code>file://</code> bloquea el acceso al iframe).</p>
<div id="summary">Cargando la app…</div>
<div id="out"></div>
<iframe id="app" src="index.html"></iframe>

<!-- 2C: la línea base de clasificación vive en su propio archivo. Se carga
     antes del harness y queda en window.VODAFIT_BASELINE_CLASIFICACION. -->
<script src="baseline-clasificacion.js"></script>
<script>
(function(){
  var out = document.getElementById("out");
  var summary = document.getElementById("summary");
  var pass = 0, fail = 0, failures = [];
  var currentGroup = "";
  var params = new URLSearchParams(location.search);
  var selectedGroup = params.get("group");
  var suiteStartedAt = performance.now(), testStartedAt = 0, completedTests = 0, skippedTests = 0;
  var testQueue = [], queueIndex = 0;
  var TEST_TIMEOUT_MS = Math.max(1000, Number(params.get("timeoutMs")) || 15000);

  function group(name){
    currentGroup = name;
    if(selectedGroup && selectedGroup !== name) return;
    testQueue.push({ kind:"group", name:name });
  }
  function record(ok, name, msg){
    var d = document.createElement("div");
    d.className = "t " + (ok ? "ok" : "no");
    d.textContent = " " + name;
    if(!ok){
      var s = document.createElement("span");
      s.className = "msg"; s.textContent = msg || "";
      d.appendChild(s);
      fail++; failures.push(currentGroup + " > " + name + (msg ? " :: " + msg : ""));
    } else pass++;
    out.appendChild(d);
  }
  // Una aserción que lanza no debe cortar el resto del harness.
  function test(name, fn){
    if(selectedGroup && selectedGroup !== currentGroup){ skippedTests++; return; }
    testQueue.push({ kind:"test", group:currentGroup, name:name, fn:fn });
  }
  function withTimeout(fn){
    return new Promise(function(resolve, reject){
      var timer = setTimeout(function(){ reject(new Error("superó el límite de " + TEST_TIMEOUT_MS + " ms")); }, TEST_TIMEOUT_MS);
      Promise.resolve().then(fn).then(function(value){ clearTimeout(timer); resolve(value); }, function(error){ clearTimeout(timer); reject(error); });
    });
  }
  function runNext(){
    if(queueIndex >= testQueue.length){ finish(); return; }
    var item = testQueue[queueIndex++];
    if(item.kind === "group"){
      currentGroup = item.name;
      var d = document.createElement("div");
      d.className = "grp"; d.textContent = item.name;
      out.appendChild(d);
      setTimeout(runNext, 0);
      return;
    }
    currentGroup = item.group;
    testStartedAt = performance.now();
    // Un test síncrono no se puede interrumpir desde setTimeout sin cambiar su
    // ejecución. Este estado y el log permiten que un runner externo aplique
    // un límite de tiempo real y diga exactamente en qué prueba quedó.
    window.__v31Progress = { status:"running", group:currentGroup, name:item.name, completed:completedTests, startedAt:testStartedAt };
    document.title = "V31 en curso — " + currentGroup + " > " + item.name;
    console.log("V31_START", currentGroup, ">", item.name);
    withTimeout(item.fn).then(function(r){
      if(r === false) record(false, item.name, "devolvió false");
      else if(typeof r === "string") record(false, item.name, r);
      else record(true, item.name);
    }, function(e){ record(false, item.name, (e && e.message) || String(e)); }).then(function(){
      completedTests++;
      window.__v31Progress = { status:"completed", group:currentGroup, name:item.name, completed:completedTests, elapsedMs:performance.now()-testStartedAt };
      setTimeout(runNext, 0);
    });
  }
  function assert(cond, msg){ if(!cond) throw new Error(msg || "assert falló"); }

  function finish(){
    var total = pass + fail;
    summary.className = fail ? "fail" : "pass";
    summary.textContent = (fail ? "FALLAN " + fail + " de " + total : "TODO OK — " + pass + "/" + total) +
      "  (pasados: " + pass + ", fallidos: " + fail + ")";
    // Para leer el resultado desde afuera (consola / automatización).
    window.__v31Results = { pass: pass, fail: fail, total: total, failures: failures,
      selectedGroup: selectedGroup, skippedTests: skippedTests, elapsedMs: performance.now()-suiteStartedAt };
    document.title = "V31 " + (fail ? "con fallos" : "completo") + " — " + total + " pruebas";
    if(failures.length) console.error("FALLOS V31:\n" + failures.join("\n"));
    console.log("V31 tests:", pass + "/" + total + " pasados");
  }

  function run(A){
    var uniq = function(a){ return Array.from(new Set(a)); };
    var names = function(day){ return (day.exercises||[]).map(function(e){ return e.nombre; }); };
    // Repite una generación N veces: los generadores son aleatorios, así que
    // una sola corrida no prueba nada sobre las reglas.
    function repeat(n, fn){ for(var i=0;i<n;i++) fn(i); }

    /* ---------------- BIBLIOTECA ---------------- */
    group("Biblioteca");

    test("EXERCISES no tiene duplicados", function(){
      var d = A.EXERCISES.filter(function(n,i){ return A.EXERCISES.indexOf(n)!==i; });
      assert(d.length===0, "duplicados: " + d.join(", "));
    });

    test("todo nombre de EXERCISES activo existe en MUSCLE_MAP", function(){
      var missing = A.EXERCISES.filter(function(n){
        return !A.MUSCLE_MAP[n] && !/^(Cinta|Bicicleta|Elíptico|Máquina de remo|Escaladora|Salto de soga|Burpees|Kettlebell|Battle rope|Trineo)/.test(n);
      });
      assert(missing.length===0, "sin MUSCLE_MAP: " + missing.join(", "));
    });

    test("los nombres canónicos nuevos de Piernas existen", function(){
      var req = ["Sentadilla con barra","Prensa inclinada","Extensión de piernas","Estocadas con mancuerna",
        "Peso muerto con barra","Peso muerto con mancuernas","Peso muerto sumo con barra","Peso muerto rumano con barra",
        "Isquio sentado","Isquio acostado","Gemelos en prensa","Gemelos en máquina","Gemelos sentado en máquina",
        "Sentadilla Hack","Step Up","Sentadilla Sumo","Puente de glúteos","Sentadilla Smith",
        "Peso muerto rumano con mancuernas","Peso muerto sumo con mancuernas","Patada de glúteo en máquina",
        "Aductores en máquina","Gemelos parado con mancuerna"];
      var missing = req.filter(function(n){ return !A.MUSCLE_MAP[n]; });
      assert(missing.length===0, "faltan: " + missing.join(", "));
    });

    test("ningún nombre viejo renombrado quedó como clave activa", function(){
      // 2B: desaparece la excepción de los retirados y el test vuelve a su
      // forma original, más estricta: NINGUNA clave de alias puede ser a la vez
      // un ejercicio del catálogo. Antes había tres (los retirados aliaseados
      // a su reemplazo); 2B borró esos ejercicios y esos aliases.
      var olds = Object.keys(A.EXERCISE_ALIASES);
      var leaked = olds.filter(function(o){ return A.EXERCISES.indexOf(o)!==-1; });
      assert(leaked.length===0, "claves de alias que son ejercicios del catálogo: " + leaked.join(", "));
    });

    test("los aliases apuntan a un nombre canónico real", function(){
      var bad = Object.keys(A.EXERCISE_ALIASES).filter(function(o){
        return !A.MUSCLE_MAP[A.EXERCISE_ALIASES[o]];
      });
      assert(bad.length===0, "alias roto: " + bad.join(", "));
    });

    test("canonicalExerciseName resuelve el histórico al nombre nuevo", function(){
      assert(A.canonicalExerciseName("Sentadilla")==="Sentadilla con barra", "Sentadilla");
      assert(A.canonicalExerciseName("Curl femoral sentado")==="Isquio sentado", "Curl femoral sentado");
      assert(A.canonicalExerciseName("Extensión de cadera en máquina")==="Patada de glúteo en máquina", "extensión de cadera");
      assert(A.canonicalExerciseName("Elevación de talones de pie con disco")==="Gemelos parado con mancuerna", "talones con disco");
      // Idempotente: un nombre ya canónico se devuelve igual.
      assert(A.canonicalExerciseName("Sentadilla con barra")==="Sentadilla con barra", "idempotencia");
    });

    test("el histórico viejo sigue encontrando ficha/lámina/equipamiento", function(){
      // V33: las fotos y videos de demostración se sacaron de la app, así que
      // la resolución por alias se verifica contra la lámina anatómica, que usa
      // exactamente el mismo canonicalExerciseName.
      assert(A.exerciseAnatomyImageFor("Sentadilla")!==null, "lámina por alias");
      assert(A.exerciseAnatomyImageFor("Prensa de piernas")!==null, "lámina por alias (prensa)");
      assert(A.exerciseEquipment("Curl femoral sentado")!=="No especificado", "equipamiento por alias");
      assert(A.exercisePrimarySubgroup("Peso muerto")!=null, "subgrupo por alias");
    });

    // 2B reemplaza estos dos tests. Afirmaban las dos mitades de la decisión
    // vieja: que los retirados salían de los pools PERO conservaban su ficha en
    // MUSCLE_MAP para el historial. La segunda mitad ya no es cierta ni
    // deseable: 2B los borró de verdad. Lo que se afirma ahora es lo contrario
    // — que no queda rastro de ellos en ninguna estructura.
    var BORRADOS_2B = ["Hip thrust","Puente de glúteo con barra","Puente de glúteo a una pierna",
      "Patada de glúteo en el piso","Patada lateral a cuatro patas","Elevación lateral de pierna",
      "Peso muerto piernas rígidas","Zancadas","Jalón tras nuca","Jalón agarre ancho",
      "Encogimientos de hombros","Extensión tríceps polea agarre prono"];

    test("2B — los doce retirados no existen en NINGUNA estructura", function(){
      var tablas = {
        EXERCISES: function(n){ return A.EXERCISES.indexOf(n)!==-1; },
        MUSCLE_MAP: function(n){ return !!A.MUSCLE_MAP[n]; },
        EXERCISE_TIPS: function(n){ return !!A.EXERCISE_TIPSñ; },
        EXERCISE_HOWTO_LINKS: function(n){ return !!A.EXERCISE_HOWTO_LINKSñ; },
        EXERCISE_EQUIPMENT: function(n){ return !!A.EXERCISE_EQUIPMENTñ; },
        EXERCISE_PATTERN: function(n){ return !!A.EXERCISE_PATTERNñ; },
        EXERCISE_ANATOMY_IMAGES: function(n){ return !!A.EXERCISE_ANATOMY_IMAGESñ; },
        EXERCISES_COMPOUND: function(n){ return A.EXERCISES_COMPOUND.has(n); },
        EXERCISES_RISKY_50PLUS: function(n){ return A.EXERCISES_RISKY_50PLUS.has(n); },
        EXERCISE_ALIASES_clave: function(n){ return !!A.EXERCISE_ALIASESñ; }
      };
      var sobrevivientes = [];
      BORRADOS_2B.forEach(function(n){
        Object.keys(tablas).forEach(function(t){
          if(tablas[t](n)) sobrevivientes.push(n + " en " + t);
        });
      });
      assert(sobrevivientes.length===0, "sobrevivieron: " + sobrevivientes.join(" | "));
    });

    test("2B — ningún alias apunta a un ejercicio borrado", function(){
      var colgados = Object.keys(A.EXERCISE_ALIASES).filter(function(k){
        return A.EXERCISES.indexOf(A.EXERCISE_ALIASES[k]) === -1;
      });
      assert(colgados.length===0, "aliases colgados: " + colgados.join(", "));
    });

    test("2B — la categoría \"retirados\" ya no existe como concepto", function(){
      assert(typeof A.isRetiredExercise === "undefined", "isRetiredExercise sigue exportada");
      assert(typeof A.EXERCISES_RETIRED === "undefined", "EXERCISES_RETIRED sigue exportada");
      // En su lugar hay una sola puerta de entrada al catálogo oficial.
      assert(typeof A.activeExercises === "function", "falta activeExercises()");
      assert(A.activeExercises().length === A.EXERCISES.length,
        "activeExercises no coincide con EXERCISES: " + A.activeExercises().length + " vs " + A.EXERCISES.length);
    });

    /* ---------------- CLASIFICACIÓN ---------------- */
    group("Clasificación (principal único + secundarios)");

    test("todo ejercicio activo tiene exactamente UN principal", function(){
      var bad = [];
      Object.keys(A.MUSCLE_MAP).forEach(function(n){
        var p = A.exercisePrimarySubgroup(n);
        if(!p) bad.push(n);
      });
      assert(bad.length===0, "sin principal: " + bad.join(", "));
    });

    test("el principal es estrictamente el de mayor intensidad (sin empate ambiguo)", function(){
      var bad = [];
      Object.keys(A.MUSCLE_MAP).forEach(function(n){
        var t = A.MUSCLE_MAP[n].t || [];
        if(!t.length) return;
        var max = Math.max.apply(null, t.map(function(x){ return x[1]; }));
        // Puede haber varias regiones en el máximo, pero todas deben caer en
        // el MISMO subgrupo — si no, el principal sería ambiguo.
        var sgs = uniq(t.filter(function(x){ return x[1]===max; }).map(function(x){ return A.REGION_SUBGROUP[x[0]]; }));
        if(sgs.length>1) bad.push(n + " (" + sgs.join("/") + ")");
      });
      assert(bad.length===0, "principal ambiguo: " + bad.join(", "));
    });

    var PRINCIPAL_ESPERADO = {
      "Sentadilla con barra":"quads", "Sentadilla frontal":"quads", "Prensa inclinada":"quads",
      "Extensión de piernas":"quads", "Sentadilla Hack":"quads", "Sentadilla búlgara":"quads",
      "Sentadilla Smith":"quads",
      "Estocadas con mancuerna":"glutes", "Step Up":"glutes", "Sentadilla Sumo":"glutes",
      "Peso muerto con barra":"glutes", "Peso muerto con mancuernas":"glutes",
      "Peso muerto sumo con barra":"glutes", "Peso muerto sumo con mancuernas":"glutes",
      "Hip thrust en máquina":"glutes", "Puente de glúteos":"glutes",
      "Patada de glúteo en máquina":"glutes", "Patada de glúteo en polea":"glutes",
      "Abductores en máquina":"glutes",
      "Peso muerto rumano con barra":"hamstrings", "Peso muerto rumano con mancuernas":"hamstrings",
      "Isquio sentado":"hamstrings", "Isquio acostado":"hamstrings",
      "Aductores en máquina":"adductors",
      "Gemelos en prensa":"calves", "Gemelos en máquina":"calves",
      "Gemelos parado con mancuerna":"calves", "Gemelos sentado en máquina":"calves"
    };
    test("Piernas: principal exacto según la spec §9", function(){
      var bad = [];
      Object.keys(PRINCIPAL_ESPERADO).forEach(function(n){
        var got = A.exerciseLegFocus(n);
        if(got !== PRINCIPAL_ESPERADO[n]) bad.push(n + ": esperaba " + PRINCIPAL_ESPERADO[n] + ", dio " + got);
      });
      assert(bad.length===0, bad.join(" | "));
    });

    test("Sentadilla con barra tiene glúteos y aductores como SECUNDARIOS", function(){
      var t = A.MUSCLE_MAP["Sentadilla con barra"].t;
      var reg = {}; t.forEach(function(x){ reg[x[0]] = x[1]; });
      assert(reg["glutes"]>0 && reg["glutes"]<1, "glúteos debe ser secundario");
      assert(reg["adductors"]>0 && reg["adductors"]<1, "aductores debe ser secundario");
    });

    test("Hiperextensiones es principal Core (no Espalda)", function(){
      assert(A.exercisePrimarySubgroup("Hiperextensiones")==="core",
        "dio " + A.exercisePrimarySubgroup("Hiperextensiones"));
      assert(A.exerciseMuscleGroup("Hiperextensiones")==="Core", "grupo visual");
    });

    test("Press tras nuca con barra es principal Hombros (no Espalda)", function(){
      assert(A.exercisePrimarySubgroup("Press tras nuca con barra")==="hombros");
    });

    test("Remo al mentón es principal Hombros con trapecios secundario", function(){
      assert(A.exercisePrimarySubgroup("Remo al mentón")==="hombros");
      var t = A.MUSCLE_MAP["Remo al mentón"].t; var reg = {};
      t.forEach(function(x){ reg[x[0]] = x[1]; });
      assert(reg["traps"]>0 && reg["traps"]<1, "trapecios secundario");
    });

    test("Encogimientos: principal Trapecios dentro del grupo visual Hombros", function(){
      ["Encogimientos con mancuernas","Encogimientos con barra","Encogimientos en máquina"].forEach(function(n){
        assert(A.exerciseMuscleGroup(n)==="Hombros", n + " grupo visual dio " + A.exerciseMuscleGroup(n));
      });
      assert(A.MUSCLE_GROUPS.length===6, "no se creó un séptimo grupo visual");
    });

    test("Abductores en máquina pertenece a Glúteos (no a un grupo Abductores)", function(){
      assert(A.exerciseLegFocus("Abductores en máquina")==="glutes");
    });

    /* ---------------- PATRONES Y PREDOMINANCIAS ---------------- */
    group("Patrones y predominancias");

    test("todo ejercicio activo de la biblioteca tiene patrón declarado", function(){
      var sinPatron = [];
      Object.keys(A.MUSCLE_MAP).forEach(function(n){
        if(!A.EXERCISE_PATTERN[n]) sinPatron.push(n);
      });
      assert(sinPatron.length===0, "sin patrón: " + sinPatron.join(", "));
    });

    test("los patrones de Piernas son los de la spec §10", function(){
      var esperado = {
        "Sentadilla con barra":"sentadilla","Sentadilla frontal":"sentadilla","Sentadilla Sumo":"sentadilla",
        "Sentadilla Smith":"sentadilla","Sentadilla Hack":"sentadilla",
        "Prensa inclinada":"prensa",
        "Sentadilla búlgara":"unilateral-pierna","Estocadas con mancuerna":"unilateral-pierna","Step Up":"unilateral-pierna",
        "Extensión de piernas":"extension-rodilla",
        "Peso muerto con barra":"bisagra","Peso muerto con mancuernas":"bisagra",
        "Peso muerto rumano con barra":"bisagra","Peso muerto rumano con mancuernas":"bisagra",
        "Peso muerto sumo con barra":"bisagra-sumo","Peso muerto sumo con mancuernas":"bisagra-sumo",
        "Hip thrust en máquina":"extension-cadera","Puente de glúteos":"extension-cadera",
        "Patada de glúteo en máquina":"extension-cadera","Patada de glúteo en polea":"extension-cadera",
        "Abductores en máquina":"abduccion",
        "Isquio sentado":"flexion-rodilla","Isquio acostado":"flexion-rodilla",
        "Aductores en máquina":"aduccion",
        "Gemelos en prensa":"gemelos-de-pie","Gemelos en máquina":"gemelos-de-pie","Gemelos parado con mancuerna":"gemelos-de-pie",
        "Gemelos sentado en máquina":"gemelos-sentado"
      };
      var bad = [];
      Object.keys(esperado).forEach(function(n){
        if(A.exercisePattern(n)!==esperado[n]) bad.push(n + ": " + A.exercisePattern(n));
      });
      assert(bad.length===0, bad.join(" | "));
    });

    test("la escala de predominancia es ÚNICA y de 4 niveles", function(){
      var keys = Object.keys(A.PATTERN_PREDOMINANCE_WEIGHT).sort();
      assert(keys.join(",")==="ALTA,BAJA,MEDIA,MEDIA_ALTA", "niveles: " + keys.join(","));
      var vals = Object.keys(A.PATTERN_PREDOMINANCE).map(function(p){ return A.PATTERN_PREDOMINANCE[p]; });
      var bad = uniq(vals).filter(function(v){ return keys.indexOf(v)===-1; });
      assert(bad.length===0, "predominancia fuera de escala: " + bad.join(", "));
    });

    test("los pesos de predominancia son monótonos (ALTA > MEDIA_ALTA > MEDIA > BAJA)", function(){
      var W = A.PATTERN_PREDOMINANCE_WEIGHT;
      assert(W.ALTA > W.MEDIA_ALTA && W.MEDIA_ALTA > W.MEDIA && W.MEDIA > W.BAJA, "no monótono");
      assert(W.BAJA > 0, "BAJA debe ser > 0 (no es prohibición)");
    });

    test("todo patrón usado tiene predominancia declarada", function(){
      var patrones = uniq(Object.keys(A.EXERCISE_PATTERN).map(function(n){ return A.EXERCISE_PATTERN[n]; }));
      var sin = patrones.filter(function(p){ return !A.PATTERN_PREDOMINANCE[p]; });
      assert(sin.length===0, "sin predominancia: " + sin.join(", "));
    });

    /* ---------------- EDAD Y EQUIPAMIENTO ---------------- */
    group("Edad y equipamiento");

    test("<40 no aplica preferencia (peso 1 para todos)", function(){
      ["Sentadilla con barra","Prensa inclinada","Sentadilla Smith","Peso muerto con barra"].forEach(function(n){
        assert(A.ageEquipmentWeight(n, 25)===1, n + " a los 25 dio " + A.ageEquipmentWeight(n,25));
      });
      assert(A.ageEquipmentWeight("Prensa inclinada", null)===1, "sin edad");
    });

    test("40-49 favorece máquina/Smith de forma moderada", function(){
      assert(A.ageEquipmentWeight("Prensa inclinada",45) > 1, "máquina no favorecida");
      assert(A.ageEquipmentWeight("Sentadilla con barra",45) === 1, "libre no debe penalizarse");
      assert(A.ageEquipmentWeight("Prensa inclinada",45) < A.ageEquipmentWeight("Prensa inclinada",55), "50+ debe ser mayor");
    });

    test("50+ favorece más, pero NUNCA prohíbe los libres", function(){
      assert(A.ageEquipmentWeight("Prensa inclinada",55) > A.ageEquipmentWeight("Prensa inclinada",45));
      assert(A.ageEquipmentWeight("Sentadilla búlgara",55) > 0, "un libre nunca puede quedar en peso 0");
    });

    test("EXERCISES_RISKY_50PLUS sigue siendo una regla independiente", function(){
      // La ponderación por edad no debe haber absorbido ni vaciado la
      // exclusión dura: sigue siendo un Set con nombres canónicos válidos.
      assert(A.EXERCISES_RISKY_50PLUS.size >= 8, "tamaño " + A.EXERCISES_RISKY_50PLUS.size);
      var invalid = Array.from(A.EXERCISES_RISKY_50PLUS).filter(function(n){ return !A.MUSCLE_MAP[n]; });
      assert(invalid.length===0, "nombres inválidos tras el renombre: " + invalid.join(", "));
      // Y un ejercicio riesgoso libre sigue teniendo peso > 0 por sí mismo
      // (la exclusión la hace el pool, no el peso).
      assert(A.ageEquipmentWeight("Sentadilla con barra",55) > 0);
    });

      function proporcionGuiada(edad){
        var guiadas = 0, total = 0;
        repeat(40, function(){
          var day = A.generateFocusedDay(["cuadriceps","gluteos"], 0);
          if(!day) return;
          names(day).forEach(function(n){
            total++;
            var eq = A.exerciseEquipment(n);
            if(eq==="Máquina" || eq==="Polea") guiadas++;
          });
        });
        return total ? guiadas/total : 0;
      }
      var st = A.state;
      var prev = st.profile ? st.profile.edad : null;
      if(!st.profile) st.profile = { edad:null };
      st.profile.edad = 25; var joven = proporcionGuiada(25);
      st.profile.edad = 55; var mayor = proporcionGuiada(55);
      st.profile.edad = prev;
      assert(mayor > joven, "50+ (" + mayor.toFixed(2) + ") no supera a <40 (" + joven.toFixed(2) + ")");
      assert(mayor < 1, "llegó al 100% de máquinas (" + mayor.toFixed(2) + ")");
    });

      assert(bumpCon(36, 80) === false, "edad 36 no debería tener bump");

      assert(bumpCon(25, 80) === true, "edad 25 (centro del rango)");

    });

    test("el peso corporal ya NO influye en el bump", function(){
      // V34: decisión de producto — el peso corporal es una métrica de

      var referencia = bumpCon(25, 80);
      assert(referencia === true, "el caso de referencia (25a/80kg) debería tener bump");
      // Peso ausente con edad válida: el peso ya no importa.
      assert(bumpCon(25, null) === referencia, "peso ausente cambió el resultado");
      // Muy por debajo y muy por encima del viejo rango 73-93.
      assert(bumpCon(25, 50) === referencia, "peso 50 cambió el resultado");
      assert(bumpCon(25, 100) === referencia, "peso 100 cambió el resultado");
      // Y los bordes exactos del rango viejo, que antes eran los que decidían.
      [40, 72, 73, 93, 94, 120, 300, 0].forEach(function(p){
        assert(bumpCon(25, p) === referencia, "peso " + p + " cambió el resultado");

      [null, 50, 80, 100].forEach(function(p){
        assert(bumpCon(40, p) === false, "edad 40 con peso " + p + " no debería tener bump");
      });
    });

    test("cambiar el peso corporal no cambia la rutina generada", function(){
      // Se compara la CANTIDAD de ejercicios por día, que es lo único que el
      // bump afecta. La selección en sí es aleatoria, así que se comparan las
      // distribuciones de conteos, no los nombres.
      var prev = A.state.profile;
      function conteos(peso){
        A.state.profile = { id:"p", name:"t", metaSemanal:3, edad:25, peso:peso };
        var dist = {};
        repeat(40, function(){
          A.generateAutoRoutine(4, "Masculino", null).forEach(function(d){
            var n = d.exercises.length;
            dist[n] = (dist[n] || 0) + 1;
          });
        });
        return dist;
      }
      try {
        // V36: con 4 días el tope duro es 7 y el bump ya no puede aumentarlo,
        // así que todos los días quedan en 7 para cualquier peso. Lo que este
        // test verifica sigue siendo lo mismo: el peso no cambia la rutina.
        var c80 = conteos(80), cNull = conteos(null), c50 = conteos(50), c100 = conteos(100);
        var k80 = Object.keys(c80).sort().join(",");
        assert(k80 === "7", "con 4 días esperaba todos los días en 7 (tope duro), hubo: " + JSON.stringify(c80));
        assert(Object.keys(cNull).sort().join(",") === k80, "peso ausente cambió la rutina: " + JSON.stringify(cNull));
        assert(Object.keys(c50).sort().join(",") === k80, "peso 50 cambió la rutina: " + JSON.stringify(c50));
        assert(Object.keys(c100).sort().join(",") === k80, "peso 100 cambió la rutina: " + JSON.stringify(c100));
      } finally { A.state.profile = prev; }
    });

    // Helper: genera `reps` semanas y devuelve métricas del tope.
    function medirTope(nd, edad, reps){
      var prev = A.state.profile;
      A.state.profile = { id:"p", name:"t", metaSemanal:3, edad:edad, peso:80 };
      try{
        var cap = A.sessionCountRange(nd)[0];
        var maxVisto = 0, minVisto = 99, excesos = 0, dups = 0, dias = 0, vacios = 0;
        repeat(reps, function(){
          A.generateAutoRoutine(nd, "Masculino", null).forEach(function(d){
            var n = d.exercises.length;
            dias++;
            if(n > maxVisto) maxVisto = n;
            if(n < minVisto) minVisto = n;
            if(n > cap) excesos++;
            if(n === 0) vacios++;
            var nombres = d.exercises.map(function(e){ return e.nombre; });
            if(new Set(nombres).size !== nombres.length) dups++;
          });
        });
        return { cap:cap, maxVisto:maxVisto, minVisto:minVisto, excesos:excesos, dups:dups, dias:dias, vacios:vacios };
      } finally { A.state.profile = prev; }
    }

    /* ========= V37 — vueltas del cronómetro de entrenamiento ========= */
    group("V37 · vueltas (laps)");

    // El cronómetro se manipula por su estado (running / elapsedMs / startEpoch),
    // que es exactamente lo que hacen los handlers reales. Así los tests no
    // dependen de esperar segundos de verdad.
    function conCrono(fn){
      var W = A.workoutClock;
      var backup = { running:W.running, elapsedMs:W.elapsedMs, startEpoch:W.startEpoch, laps:(W.laps||[]).slice() };
      try { return fn(W); }
      finally {
        W.running = backup.running; W.elapsedMs = backup.elapsedMs;
        W.startEpoch = backup.startEpoch; W.laps = backup.laps;
        A.persistWorkoutClock();
      }
    }
    // Deja el cronómetro corriendo como si hubiera arrancado `ms` atrás.
    function corriendoDesde(W, ms){
      W.running = true; W.elapsedMs = 0; W.startEpoch = Date.now() - ms; W.laps = [];
    }

    test("crear una vuelta registra el total transcurrido", function(){
      conCrono(function(W){
        corriendoDesde(W, 42000);
        var t = A.addWorkoutLap();
        assert(t !== null, "no creó la vuelta");
        assert(Math.abs(t - 42000) < 1000, "total registrado: " + t + " (esperaba ~42000)");
        assert(A.fmtElapsed(t) === "00:42", "formato: " + A.fmtElapsed(t));
        assert(W.laps.length === 1, "cantidad de vueltas: " + W.laps.length);
      });
    });

    test("varias vueltas: el ejemplo de la especificación", function(){
      conCrono(function(W){
        // 00:42 -> Vuelta 1. A los 25 segundos -> Vuelta 2 = 01:07.
        corriendoDesde(W, 42000);
        A.addWorkoutLap();
        W.startEpoch -= 25000; // pasan 25s
        A.addWorkoutLap();
        assert(W.laps.length === 2, "cantidad: " + W.laps.length);
        var filas = A.workoutLapRows();
        // Orden: la más reciente primero, con numeración cronológica.
        assert(filas[0].numero === 2 && filas[1].numero === 1, "orden/numeración: " + filas.map(function(r){return r.numero;}).join(","));
        assert(A.fmtElapsed(filas[1].total) === "00:42", "vuelta 1 total: " + A.fmtElapsed(filas[1].total));
        assert(A.fmtElapsed(filas[0].total) === "01:07", "vuelta 2 total: " + A.fmtElapsed(filas[0].total));
        // El parcial de la vuelta 2 son los 25 s desde la anterior.
        assert(A.fmtElapsed(filas[0].parcial) === "00:25", "parcial de la vuelta 2: " + A.fmtElapsed(filas[0].parcial));
        // El parcial de la primera es su propio total.
        assert(filas[1].parcial === filas[1].total, "el parcial de la vuelta 1 debería ser su total");
      });
    });

    test("los totales de las vueltas nunca decrecen", function(){
      conCrono(function(W){
        corriendoDesde(W, 5000);
        [3000, 7000, 1000, 12000].forEach(function(delta){
          W.startEpoch -= delta;
          A.addWorkoutLap();
        });
        for(var i=1;i<W.laps.length;i++){
          assert(W.laps[i] >= W.laps[i-1], "la vuelta " + (i+1) + " es menor que la anterior");
        }
        assert(W.laps.length === 4, "cantidad: " + W.laps.length);
        // Y todos los parciales son positivos.
        A.workoutLapRows().forEach(function(r){
          assert(r.parcial >= 0, "parcial negativo en la vuelta " + r.numero + ": " + r.parcial);
        });
      });
    });

    test("marcar vuelta NO detiene ni reinicia el cronómetro", function(){
      conCrono(function(W){
        corriendoDesde(W, 30000);
        var runningAntes = W.running, startAntes = W.startEpoch, elapsedAntes = W.elapsedMs;
        var tAntes = A.currentWorkoutElapsed();
        A.addWorkoutLap();
        assert(W.running === runningAntes, "cambió `running`");
        assert(W.startEpoch === startAntes, "cambió `startEpoch`");
        assert(W.elapsedMs === elapsedAntes, "cambió `elapsedMs`");
        assert(A.currentWorkoutElapsed() >= tAntes, "el tiempo transcurrido retrocedió");
        assert(W.running === true, "el cronómetro dejó de correr");
        // Tres vueltas seguidas tampoco lo tocan.
        A.addWorkoutLap(); A.addWorkoutLap();
        assert(W.running === true && W.startEpoch === startAntes, "varias vueltas alteraron el cronómetro");
      });
    });

    test("pausar y continuar conserva el tiempo y las vueltas", function(){

        W.running = true; W.startEpoch = Date.now();
        var alContinuar = A.currentWorkoutElapsed();
        assert(Math.abs(alContinuar - enPausa) < 1000, "el tiempo saltó al continuar: " + enPausa + " -> " + alContinuar);
        assert(W.laps.length === 2, "continuar perdió las vueltas");

    /* ---------------- V40 — MI PESO (peso corporal) ----------------
       Todo lo de acá es contra funciones PURAS o contra state: el harness no
       habla con Supabase, así que no se inventan datos de la base. Alta,
       edición y borrado se validan por la forma de la fila que se manda
       (pesoCorporalRowFor / rowToPesoCorporal) y por el efecto sobre el
       historial en memoria, que es lo que la pantalla lee. */

    // Fábrica de filas con la misma forma que devuelve Store.rowToPesoCorporal.
    function pc(fecha, kg, createdAt, nota, id){
      return { id: id || ("id-"+fecha+"-"+kg+"-"+(createdAt||0)), fecha: fecha, pesoKg: kg,
               nota: nota || "", createdAt: createdAt || 0, updatedAt: null };
    }
    // Corre fn con un historial puesto en state y restaura todo al salir.
    function conPeso(rows, err, fn){
      var prevRows = A.state.pesoCorporal, prevErr = A.state.pesoCorporalError, prevPer = A.state.pesoChartPeriod;
      A.state.pesoCorporal = rows;
      A.state.pesoCorporalError = err || null;
      try{ return fn(); }
      finally{
        A.state.pesoCorporal = prevRows;
        A.state.pesoCorporalError = prevErr;
        A.state.pesoChartPeriod = prevPer;
      }
    }

      assert(r.streak <= 104, "la racha no debería pasar de 104, dio " + r.streak);
    });

    /* ---------------- V42 — PERFIL COMO DASHBOARD ----------------
       Todo contra `state`: Perfil no hace consultas, así que se le puede poner
       cualquier historial sintético y leer el HTML que produce. */

    // Fecha a N días de hoy, en el formato que usa la app.
    function diasAtras(n){
      var h = new Date();
      var d = new Date(h.getFullYear(), h.getMonth(), h.getDate()-n);
      return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    }
    // Monta un estado completo de Perfil y lo restaura al salir.
    function conPerfil(datos, fn){
      var S = A.state;
      var prev = {
        profile:S.profile, auth:S.authSession, ents:S.entrenos, regs:S.registros,
        pc:S.pesoCorporal, pcErr:S.pesoCorporalError, tab:S.tab,
        wOff:S.weekOffset, wDet:S.weekDetailOpen,
        pOff:S.perfilWeekOffset, pDet:S.perfilWeekDetailOpen,
        pPer:S.perfilPesoPeriod, rPer:S.pesoChartPeriod, slot:S.activeSlot
      };
      S.profile = datos.profile || { id:"p", name:"Juan", metaSemanal:4, edad:30, createdAt:1 };
      S.authSession = { user:{ email:"juan@example.com" } };
      S.entrenos = datos.entrenos || [];
      S.registros = datos.registros || [];
      S.pesoCorporal = datos.pesoCorporal || [];
      S.pesoCorporalError = datos.pesoCorporalError || null;
      try{ return fn(); }
      finally{
        S.profile=prev.profile; S.authSession=prev.auth; S.entrenos=prev.ents;
        S.registros=prev.regs; S.pesoCorporal=prev.pc; S.pesoCorporalError=prev.pcErr;
        S.tab=prev.tab; S.weekOffset=prev.wOff; S.weekDetailOpen=prev.wDet;
        S.perfilWeekOffset=prev.pOff; S.perfilWeekDetailOpen=prev.pDet;
        S.perfilPesoPeriod=prev.pPer; S.pesoChartPeriod=prev.rPer; S.activeSlot=prev.slot;
      }
    }

    test("V50 — la semana en curso suma a la racha cuando cumple la meta", function(){
      // isoWeekMonday no está exportado, así que se replica acá: construir las
      // fechas desde el lunes ISO es lo único que hace el test independiente del
      // día en que se corra (ver el candado 2C más abajo).
      function lunesISO(d){
        var dia = (d.getDay()+6)%7;
        return new Date(d.getFullYear(), d.getMonth(), d.getDate()-dia);
      }
      function fecha(d){
        return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
      }
      function enSemana(semanasAtras, cuantos){
        var lun = lunesISO(new Date());
        var base = new Date(lun.getFullYear(), lun.getMonth(), lun.getDate()-7*semanasAtras);
        var out = [];
        for(var i=0;i<cuantos;i++) out.push({ date: fecha(base) });
        return out;
      }

      // 1. Meta cumplida esta semana y FALLADA la anterior. Hasta V49 daba 0
      //    mientras la misma tarjeta decía "¡Meta semanal cumplida!".
      var r1 = A.computeRacha(enSemana(0,3), 3);
      assert(r1.thisWeekCount === 3 && r1.remaining === 0, "control inválido: debería estar cumplida, dio " + JSON.stringify(r1));
      assert(r1.streak === 1, "con la meta cumplida esta semana la racha debería ser 1, dio " + r1.streak);

      // 2. Meta NO cumplida esta semana, con cinco semanas previas cumplidas.
      //    Es el caso que NO hay que romper: la racha no puede caer a 0 el lunes.
      var hist = [];
      for(var s=1; s<=5; s++) hist = hist.concat(enSemana(s,3));
      var r2 = A.computeRacha(hist.concat(enSemana(0,1)), 3);
      assert(r2.thisWeekCount === 1, "control inválido: debería haber 1 esta semana, dio " + r2.thisWeekCount);
      assert(r2.streak === 5, "sin cumplir esta semana la racha debería seguir en 5, dio " + r2.streak);

      // 3. Meta cumplida esta semana Y las cinco anteriores: la actual suma.
      var r3 = A.computeRacha(hist.concat(enSemana(0,3)), 3);
      assert(r3.streak === 6, "cumpliendo esta semana y las cinco previas debería dar 6, dio " + r3.streak);

      // 4. Sin datos y tope de 104 (el tope ya estaba, se verifica que el +1
      //    inicial no lo corra).
      assert(A.computeRacha([], 3).streak === 0, "sin entrenos la racha debería ser 0");
      var muchas = [];
      for(var k=0; k<140; k++) muchas = muchas.concat(enSemana(k,3));
      assert(A.computeRacha(muchas, 3).streak === 104,
        "con 140 semanas cumplidas la racha debería topearse en 104, dio " + A.computeRacha(muchas, 3).streak);
    });

    /* ---------------- V40.1 — SERVICE WORKER: SUPABASE FUERA DEL CACHÉ ----
       El harness no puede instalar un Service Worker, pero sí puede traer
       sw.js y probar su lógica de verdad: se extrae el predicado del fuente y
       se lo ejecuta contra una tabla de URLs reales. No es un test de texto,
       es el mismo código corriendo. Los invariantes que no son función (la
       versión de caché, el orden del corte, el precache) sí se comprueban
       sobre el fuente, que es donde viven. */

    group("V40.1 — Service Worker: Supabase fuera del caché");

    // sw.js se trae una sola vez, de forma síncrona, para no volver asíncrono
    // todo el harness por un archivo de 3 KB del mismo origen.
    var SW_SRC = (function(){
      try{
        var x = new XMLHttpRequest();
        x.open("GET", "sw.js?test=" + Date.now(), false);
        x.send(null);
        return x.status === 200 ? x.responseText : null;
      }catch(e){ return null; }
    })();

    /* ACTUALIZADO EN V50.4 — qué cambió y por qué.

       Hasta V48 el aislamiento de Supabase vivía en un predicado propio,
       `isSupabaseUrl(url)`, que miraba el hostname. V49 reescribió sw.js y el
       aislamiento pasó a ser una propiedad ESTRUCTURAL del fetch handler: su
       primera sentencia devuelve el control a la red para cualquier origen que
       no sea el propio. O sea que Supabase queda afuera por ser otro origen, no
       por estar en una lista.

       Eso es MÁS fuerte que antes, no menos: ya no hay forma de agregarle una
       estrategia de caché a Supabase sin romper la guarda de todos los orígenes
       ajenos. Estos tests verifican la garantía funcional —que el Service Worker
       no toque nada de Supabase y que el corte salga antes del Cache Storage—
       en vez de la sintaxis de V48. No se aflojó ninguna aserción: las mismas
       URLs que antes tenían que quedar excluidas siguen teniendo que quedarlo.

       sw.js NO se modificó en V50.4. */

    // La guarda del fetch handler, extraída del fuente y convertida en función
    // ejecutable. Devuelve true cuando el SW se desentiende del pedido y lo deja
    // con su semántica de red original.
    var swPasaDerecho = (function(){
      if(!SW_SRC) return null;
      var m = SW_SRC.match(/const request=event\.request,url=new URL\(request\.url\);[\s\S]*?if\(([\s\S]*?)\)return;/);
      if(!m) return null;
      try{ return new Function("request","url","ROOT","return (" + m[1] + ");"); }
      catch(e){ return null; }
    })();
    // El ROOT del Service Worker es new URL('./', self.location.href). El harness
    // se sirve desde la raíz del repo, así que coincide con el origen + "/".
    var SW_ROOT = new URL("./", location.origin + "/");

    test("sw.js se pudo leer y expone la guarda de origen del fetch handler", function(){
      assert(SW_SRC, "no se pudo traer sw.js (¿servidor estático?)");
      assert(typeof swPasaDerecho === "function",
        "no se pudo extraer la guarda del fetch handler de sw.js");
      // Y la guarda es lo PRIMERO del handler: no hay nada entre el handler y ella.
      var iHandler = SW_SRC.indexOf("self.addEventListener('fetch'");
      assert(iHandler !== -1, "no se encontró el fetch handler");
      var iGuarda = SW_SRC.indexOf("return;", iHandler);
      var antes = SW_SRC.slice(iHandler, iGuarda);
      assert(antes.indexOf("caches") === -1, "hay un acceso a caches antes de la guarda de origen");
      assert(antes.indexOf("respondWith") === -1, "hay un respondWith antes de la guarda de origen");
    });

    test("el corte sale ANTES de tocar el Cache Storage", function(){
      var iHandler = SW_SRC.indexOf("self.addEventListener('fetch'");
      assert(iHandler !== -1, "no se encontró el fetch handler");
      var iCorte = SW_SRC.indexOf("return;", iHandler);

      // Nada de Cache Storage antes del corte.

      assert(antes.indexOf("caches.open") === -1, "hay un caches.open antes del corte");

      assert(antes.indexOf("cache.put") === -1, "hay un cache.put antes del corte");

      // confundirse con una navegación.

    test("NO hay una estrategia de caché propia para Supabase", function(){
      // El corte es un `return` seco: ningún respondWith para esas URLs. En V49
      // es el mismo return que cubre todos los orígenes ajenos.
      var m = SW_SRC.match(/if\(request\.method!=='GET'[\s\S]*?\)(return;)/);
      assert(m && m[1] === "return;", "el corte debería ser un return seco");
      // Y las únicas cachés que el SW abre son las suyas: shell y media.
      var abiertas = (SW_SRC.match(/caches\.open\(([^)]*)\)/g) || []);
      abiertas.forEach(function(a){
        assert(/CACHE|MEDIA|key/.test(a), "abre una caché inesperada: " + a);

    test("el nombre de la caché cambia con cada release y con el contenido", function(){
      /* ACTUALIZADO EN V50.4. Hasta V48 el candado era literal: `const CACHE =
         "gymapp-v8"`, y había que subir el número a mano. V49 lo derivó:

           CACHE = 'vodafit-shell-' + encodeURIComponent(ROOT.pathname) + '-'
                 + RELEASE + '-' + SHELL_ID

         SHELL_ID es el hash del manifiesto de shell, así que cualquier cambio de
         contenido cambia el nombre de la caché SOLO. Eso cubre lo que el candado
         viejo cuidaba a mano —que una entrada huérfana no sobreviva a un cambio
         de contenido— sin depender de que alguien se acuerde de incrementarlo.
         Además el nombre lleva el pathname, así que dos despliegues en subrutas
         del mismo host no se pisan las cachés. */
      assert(/const CACHE = PREFIX \+ RELEASE \+ '-' \+ SHELL_ID;/.test(SW_SRC),
        "el nombre de la caché debería derivarse de RELEASE y SHELL_ID");
      assert(/const PREFIX = 'vodafit-shell-' \+ encodeURIComponent\(ROOT\.pathname\)/.test(SW_SRC),
        "el prefijo debería incluir el pathname para no pisar otras subrutas");
      var id = SW_SRC.match(/const SHELL_ID = "([0-9a-f]{64})";/);
      assert(id, "SHELL_ID debería ser un SHA-256 de 64 hex");
      assert(!/const CACHE = "gymapp-/.test(SW_SRC), "no debería quedar un nombre de caché literal");
    });

    test("las cachés viejas se CONSERVAN a propósito y sólo se leen", function(){
      /* ACTUALIZADO EN V50.4 — esto es una reversión deliberada de V49, no un
         olvido. El test viejo exigía que el activate borrara toda caché distinta
         de la actual (`filter(k => k !== CACHE)` + `caches.delete`). V49 hace lo
         contrario y lo deja escrito: "Retain old shells for suspended clients".

         El motivo: un cliente V48 suspendido todavía sirve desde su caché, y
         borrársela lo dejaría sin shell en medio de un entrenamiento. Por eso el
         activate ya no borra nada y las cachés `gymapp-v*` se usan como respaldo
         de LECTURA para URLs históricas de scripts. La evacuación ya no depende
         del activate sino del nombre derivado (test anterior): una caché que
         nadie vuelve a nombrar simplemente deja de usarse.

         Lo que este test fija es lo que no puede cambiar: que el activate no
         borre, que tampoco borre datos del usuario, y que las cachés legadas
         sólo se lean. */
      var iAct = SW_SRC.indexOf("self.addEventListener('activate'");
      assert(iAct !== -1, "no se encontró el activate");
      var act = SW_SRC.slice(iAct, SW_SRC.indexOf("async function windows", iAct));
      assert(act.indexOf("caches.delete") === -1,
        "el activate NO debería borrar cachés: los clientes suspendidos todavía las usan");
      assert(/self\.clients\.claim\(\)/.test(act), "falta clients.claim en el activate");
      // El único caches.delete del archivo es el rollback del install fallido,
      // y sólo sobre una caché que el propio install acababa de crear.
      var borrados = (SW_SRC.match(/caches\.delete\([^)]*\)/g) || []);
      assert(borrados.length === 1 && /caches\.delete\(CACHE\)/.test(borrados[0]),
        "el único borrado debería ser el rollback del install, dio: " + borrados.join(" | "));
      assert(/if\(!existed\)await caches\.delete\(CACHE\)/.test(SW_SRC),
        "el rollback sólo puede borrar la caché si el install la creó recién");
      // Y las cachés legadas aparecen sólo como respaldo de lectura.
      assert(/\^gymapp-v\\d\+/.test(SW_SRC), "debería reconocer las cachés gymapp-v* legadas");
      // IndexedDB es donde viven los borradores: el SW no la toca nunca.
      assert(!/indexedDB/i.test(SW_SRC), "el Service Worker no debería tocar IndexedDB");
    });

    test("el shell esencial se precarga completo y verificado por hash", function(){
      /* ACTUALIZADO EN V50.4. V48 tenía `const ASSETS = [...]` con rutas sueltas
         y un fetch con `cache:"reload"`. V49 lo reemplazó por un manifiesto
         ruta → SHA-256 que se descarga y se VERIFICA antes de tocar la caché
         destino, con `cache:'no-store'` y `redirect:'error'`.

         La entrada "./" ya no existe y no hace falta: la navegación se sirve
         desde "./index.html" (ver el test de navegación). */
      var iShell = SW_SRC.indexOf("const SHELL = {");
      var fShell = SW_SRC.indexOf("};", iShell);
      assert(iShell !== -1 && fShell !== -1, "no se pudo leer el manifiesto SHELL");
      var shell = SW_SRC.slice(iShell, fShell);
      ["./index.html", "./manifest.json", "./apple-touch-icon.png",
       "./icon-192.png", "./icon-512.png", "./icon-512-maskable.png", "./favicon-32.png"].forEach(function(a){
        assert(shell.indexOf('"' + a + '"') !== -1, "falta en el shell: " + a);
      });
      // Los cinco módulos V48 también son parte del shell esencial.
      ["v48-persistence.js", "v48-session.js", "v48-lifecycle.js",
       "v48-reconcile.js", "v48-history.js"].forEach(function(m){
        assert(shell.indexOf(m) !== -1, "falta en el shell el módulo " + m);
      });
      // Toda entrada tiene un SHA-256 de 64 hex: no hay precarga sin verificar.
      var hashes = shell.match(/:\s*"([0-9a-f]{64})"/g) || [];
      var rutas = shell.match(/"\.\/[^"]+":/g) || [];
      assert(hashes.length === rutas.length && rutas.length > 0,
        "cada ruta del shell debería tener su hash: " + rutas.length + " rutas, " + hashes.length + " hashes");
      assert(/cache:'no-store',redirect:'error'/.test(SW_SRC),
        "la descarga del shell debería ser no-store y sin seguir redirecciones");
      assert(/if\(digest!==hash\) throw Error\('SHELL_INTEGRITY_FAILED'\)/.test(SW_SRC),
        "falta la verificación de integridad por hash");
      // Y nada se escribe en la caché destino antes de validar todo.
      var iInstall = SW_SRC.indexOf("self.addEventListener('install'");
      var iPut = SW_SRC.indexOf("cache.put", iInstall);
      var iVerify = SW_SRC.indexOf("await verified", iInstall);
      assert(iVerify !== -1 && iVerify < iPut, "el install debería verificar antes de escribir");
    });

    test("navegación y assets propios funcionan sin conexión", function(){
      /* ACTUALIZADO EN V50.4. V48 servía la navegación con red primero
         (`cache:"no-store"`) y caída a la copia guardada. V49 la sirve
         SÓLO desde el shell verificado, y si no está responde 503 con un
         mensaje propio en vez de un error del navegador.

         Es un cambio de estrategia deliberado —el shell es inmutable y la
         actualización está coordinada, así que la navegación no necesita ir a
         la red— y para el funcionamiento offline es estrictamente mejor: no
         depende de que la red falle rápido. Lo que este test fija es la
         propiedad funcional: que haya navegación sin conexión y que los assets
         sean cache-first. */
      // Navegación: desde la caché del shell, con index.html como respuesta.
      assert(/const navigation=request\.mode==='navigate'/.test(SW_SRC),
        "falta la detección de navegación");
      assert(/caches\.open\(CACHE\)\.then\(c=>c\.match\(absolute\('\.\/index\.html'\)\)\)/.test(SW_SRC),
        "la navegación debería resolverse desde index.html del shell");
      assert(/r\|\|unavailable\(\)/.test(SW_SRC), "falta la respuesta de respaldo sin conexión");
      assert(/status:503/.test(SW_SRC), "la respuesta sin conexión debería ser un 503 explícito");
      // Assets del shell: cache-first, y si falta se re-verifica contra su hash.
      assert(/const cache=await caches\.open\(CACHE\),cached=await cache\.match\(request\);\s*\n?\s*if\(cached\)return cached;/.test(SW_SRC),
        "los assets del shell deberían ser cache-first");
      // Un script histórico nunca se baja de un despliegue posterior.
      assert(/Never fetch a historical script URL from a later deployment/.test(SW_SRC),
        "falta la rama que resuelve URLs históricas de scripts desde cachés previas");
      // Y el corte por método sigue primero que todo.
      assert(/request\.method!=='GET'/.test(SW_SRC), "se perdió el corte por método");
    });

    /* ---------------- V43 — MAPA MUSCULAR ----------------
       `muscleMapStats` es pura, así que todo se prueba con registros
       sintéticos y una fecha fija. Los desempates aleatorios se vuelven
       deterministas inyectando `rnd`. Los ejercicios usados son REALES del
       catálogo: así los tests fallan si alguien cambia MUSCLE_MAP. */

    var MM_HOY = "2026-10-01";
    function mmReg(ej, fecha, series, peso, setN){
      return { id: ej+fecha+(setN||"")+Math.random(), exercise: ej, date: fecha,
               peso: peso==null ? "" : String(peso),
               series: series==null ? "" : String(series),
               reps:"10", nota:"", createdAt:1,
               setNumber: setN==null ? null : setN };
    }
    // Fecha a k días antes de MM_HOY.
    function mmDia(k){
      var x = new Date(2026, 9, 1-k);
      return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
    }
    function mmStats(rows, dias, rnd){
      return A.muscleMapStats(rows, MM_HOY, dias || 7, rnd || function(){ return 0; });
    }

    group("V43 — Mapa muscular: puntuación");

    test("un ejercicio principal en un día da 1 punto", function(){
      var s = mmStats([mmReg("Press de banca con barra", MM_HOY, 3, 80)]);
      assert(s.regiones["chest-mid"].puntos === 1, "dio " + s.regiones["chest-mid"].puntos);
    });

    test("un ejercicio secundario da 0,5 puntos", function(){

      var s = mmStats([mmReg("Press de banca con barra", MM_HOY, 3, 80)]);
      assert(s.regiones["shoulder-front"].puntos === 0.5, "dio " + s.regiones["shoulder-front"].puntos);

    /* Monta un autocompletado real (input + lista) DENTRO del iframe, para que
       los eventos y el DOM vivan en el mismo realm que attachAutocomplete.
       Devuelve helpers para teclear, leer lo mostrado y hacer click. */
    function acMontar(){
      var doc = frame.contentDocument;
      var wrap = doc.createElement("div");
      wrap.className = "ac-wrap";
      wrap.innerHTML = '<input type="text"><div class="ac-list"></div>';
      doc.body.appendChild(wrap);
      var input = wrap.querySelector("input");
      var lista = wrap.querySelector(".ac-list");
      var api = {
        input: input,
        lista: lista,
        elegido: null,
        escribir: function(v){
          // El input se enfoca ANTES de escribir, como hace cualquier persona:
          // para teclear hay que estar parado en el campo. No es un detalle
          // cosmético. Al expandir "Ver X más...", attachAutocomplete llama a
          // input.focus(), y el listener de `focus` corre update(), que vuelve
          // a colapsar la lista. Con el input ya enfocado, focus() es un no-op
          // y no dispara nada — que es el caso real. Si el campo NO estaba
          // enfocado, la expansión se deshace sola: eso es una fragilidad de
          // attachAutocomplete, anterior a V47, documentada acá.
          input.focus();
          input.value = v;
          input.dispatchEvent(new frame.contentWindow.Event("input", { bubbles:true }));
        },
        items: function(){
          return Array.prototype.map.call(lista.querySelectorAll(".ac-item[data-val]"),
            function(el){ return el.getAttribute("data-val"); });
        },
        more: function(){ return lista.querySelector("[data-ac-more]"); },
        click: function(el){
          el.dispatchEvent(new frame.contentWindow.MouseEvent("mousedown", { bubbles:true, cancelable:true }));
        },
        limpiar: function(){ wrap.remove(); }
      };
      A.attachAutocomplete(input, lista, function(v){ api.elegido = v; });
      return api;
    }

    /* ================= ETAPA 2C — NO REGRESIÓN DE CLASIFICACIÓN =================

       Qué protege. exercisePrimarySubgroup(), exerciseMuscleGroup() y
       exerciseLegFocus() derivan TODAS de una sola cosa: la región de mayor
       intensidad del ejercicio. De ahí salen el grupo visual, el subgrupo, el
       subgrupo de 10, los pools del generador, Día Especial y la rutina
       enfocada. Agregar una región asistente con intensidad >= al máximo actual
       mueve el principal y arrastra todo eso en silencio: no hay error, no hay
       síntoma, solo rutinas que empiezan a salir distintas.

       Por qué una tabla literal y no un recálculo. Un test no puede comparar
       "antes y después": solo existe una versión del código a la vez. La única
       forma de detectar el cambio es tener la foto del estado aprobado
       ESCRITA Y COMMITEADA antes de tocar MUSCLE_MAP. Eso es
       baseline-clasificacion.js.

       Cómo se lee un fallo. El mensaje nombra el ejercicio, lo esperado y lo
       obtenido. Si el cambio fue deliberado, se actualiza esa fila de la
       baseline en el mismo commit. Si nadie lo quiso, el bug está en
       MUSCLE_MAP. Nunca se actualiza la baseline "para que pase".            */

    test("2C — la baseline DETECTA los cambios que tiene que detectar", function(){
      // Un baseline que no atrapa nada no sirve. Este test lo prueba: aplica
      // mutaciones sobre una COPIA de la entrada (MUSCLE_MAP real intacto) y
      // verifica que la comparacion las marque. Es el test del test.
      function principal(t){ var best = t[0]; t.forEach(function(x){ if(x[1] > best[1]) best = x; }); return best[0]; }
      function subgrupoDe(t){ return A.REGION_SUBGROUP[principal(t)]; }
      function clon(t){ return JSON.parse(JSON.stringify(t)); }
      function diferencias(nombre, tMutado){
        var f = BL.ejercicios.filter(function(x){ return x.ej === nombre; })[0];
        var d = [];
        if(subgrupoDe(tMutado) !== f.subgrupo) d.push("subgrupo");
        if(f.t.map(function(x){ return x[0]; }).join(",") !== tMutado.map(function(x){ return x[0]; }).join(",")) d.push("regiones");
        f.t.forEach(function(par, i){
          var r = tMutado[i];
          if(r && r[0] === par[0] && r[1] !== par[1]) d.push("intensidad");
        });
        if(JSON.stringify(f.t) !== JSON.stringify(tMutado)) d.push("entrada");
        return uniq(d);
      }
      var PB = "Press de banca con barra";
      // 1. Asistente que EMPATA con el máximo: es el caso peligroso de D2,
      //    porque mueve el principal (y con él subgrupo, grupo y pools).
      var m1 = clon(A.MUSCLE_MAP[PB].t); m1.push(["triceps-lateral", 1]);
      var d1 = diferencias(PB, m1);
      assert(d1.indexOf("regiones") !== -1 && d1.indexOf("entrada") !== -1,
        "no detectó un asistente que empata con el máximo: " + d1.join(","));
      // 2. Asistente POR DEBAJO del máximo: el caso normal de D2. No cambia la
      //    clasificación (por eso subgrupo NO debe aparecer), pero sí las regiones.
      var m2 = clon(A.MUSCLE_MAP[PB].t); m2.push(["triceps-lateral", 0.45]);
      var d2 = diferencias(PB, m2);
      assert(d2.indexOf("regiones") !== -1, "no detectó una región agregada: " + d2.join(","));
      assert(d2.indexOf("subgrupo") === -1, "marcó cambio de subgrupo donde no lo hay: " + d2.join(","));
      // 3. Solo una intensidad existente.
      var m3 = clon(A.MUSCLE_MAP["Dominadas"].t); m3[1][1] = 0.55;
      var d3 = diferencias("Dominadas", m3);
      assert(d3.indexOf("intensidad") !== -1, "no detectó un cambio de intensidad: " + d3.join(","));
      // 4. Reordenar sin cambiar valores: el orden importa (ante un empate
      //    futuro decide la primera región declarada).
      var m4 = clon(A.MUSCLE_MAP[PB].t).reverse();
      var d4 = diferencias(PB, m4);
      assert(d4.indexOf("regiones") !== -1, "no detectó un reordenamiento: " + d4.join(","));
      // 5. CONTROL: sin mutación no debe marcar nada. Si esto falla, los otros
      //    cuatro no prueban nada.
      var d5 = diferencias("Dominadas", clon(A.MUSCLE_MAP["Dominadas"].t));
      assert(d5.length === 0, "marcó diferencias sin mutación: " + d5.join(","));
    });

    // Se conserva el mismo criterio (HEAD y estado HTTP 200), pero se hace
    // asíncrono. Ochenta y dos XHR síncronos bloqueaban el hilo principal de
    // Chrome: el harness parecía colgado y ni siquiera podía informar cuál era
    // la prueba en curso. Cada petición tiene límite propio y la cola del
    // harness conserva el orden de las pruebas.
    function rutasFaltantes(rutas){
      return Promise.all(rutas.map(function(ruta){
        var controller = new AbortController();
        var timer = setTimeout(function(){ controller.abort(); }, 5000);
        return fetch(ruta, { method:"HEAD", cache:"no-store", signal:controller.signal })
          .then(function(resp){ return resp.status === 200 ? null : ruta; })
          .catch(function(){ return ruta; })
          .then(function(resultado){ clearTimeout(timer); return resultado; });
      })).then(function(resultados){ return resultados.filter(Boolean); });
    }

    test("sw.js cubre los medios con rama propia, cache-first SIN revalidar", function(){
      /* ACTUALIZADO EN V50.4. V48 identificaba los medios por extensión
         (`/\.(gif|webp)$/i`); V49 los identifica por RUTA: todo lo que cae bajo
         `ejercicios/` va a la caché de medios, que es un criterio más amplio y
         cubre .webp igual.

         La propiedad que no puede perderse es la misma de V44.2: con la copia ya
         guardada NO se rearma el fetch. La rama general de V48 devolvía
         `cached || fetchPromise`, y como construía la promesa siempre, volvía a
         bajar el archivo entero con la copia en mano (medido). En V49 el
         `return cached` sale antes de cualquier fetch. */
      assert(SW_SRC, "no se pudo traer sw.js");
      var i = SW_SRC.indexOf("url.pathname.startsWith(new URL('ejercicios/'");
      assert(i !== -1, "sw.js no tiene una rama propia para los medios de ejercicios/");
      var rama = SW_SRC.slice(i, i + 700);
      // Cache-first seco: el cached se devuelve antes de que aparezca un fetch.
      var iCached = rama.indexOf("if(cached)return cached;");
      var iFetch = rama.indexOf("await fetch(request)");
      assert(iCached !== -1, "la rama de medios debería devolver la copia guardada sin más");
      assert(iFetch !== -1 && iCached < iFetch,
        "el return de la copia guardada tiene que salir ANTES del fetch, o se rebaja el archivo entero");
      // Y usa su propia caché de medios, separada del shell.
      assert(/const MEDIA = 'vodafit-media-'/.test(SW_SRC),
        "los medios deberían vivir en su propia caché, aparte del shell");
      assert(rama.indexOf("caches.open(MEDIA)") !== -1, "la rama de medios debería abrir la caché MEDIA");
    });

    test("V46 — la biblioteca es integra: ids unicos, campos completos y taxonomia conocida", function(){
      // ESTIRAMIENTOS no puede inventar una quinta taxonomia: `subgrupos` usa
      // claves de REGION_SUBGROUP y `legFocus` valores de exerciseLegFocus.
      var subgruposValidos = {}, malos = [], ids = {};
      Object.keys(A.REGION_SUBGROUP).forEach(function(r){ subgruposValidos[A.REGION_SUBGROUP[r]] = true; });
      var focosValidos = { quads:true, hamstrings:true, glutes:true, calves:true, adductors:true };
      A.ESTIRAMIENTOS.forEach(function(e){
        if(ids[e.id]) malos.push(e.id + ": id repetido");
        ids[e.id] = true;
        // V46.2: `como` (un parrafo) se reemplazo por tres pasos rotulados.
        // No se afloja la asercion: se exige MAS que antes, los tres campos.
        if(!e.nombre || !e.duracion) malos.push(e.id + ": campo vacio");
        ["inicio","movimiento","cuidado"].forEach(function(k){
          if(!e[k]) malos.push(e.id + ": falta el paso " + k);
          else if(e[k].length < 40) malos.push(e.id + ": el paso " + k + " es demasiado corto (" + e[k].length + ")");
        });
        if(e.como !== undefined) malos.push(e.id + ": conserva el campo `como` de V46");
        if(["estiramiento","movilidad"].indexOf(e.tipo) === -1) malos.push(e.id + ": tipo invalido (" + e.tipo + ")");
        if(!e.subgrupos.length) malos.push(e.id + ": sin subgrupos");
        e.subgrupos.forEach(function(sg){ if(!subgruposValidos[sg]) malos.push(e.id + ": subgrupo desconocido " + sg); });
        if(e.legFocus && !focosValidos[e.legFocus]) malos.push(e.id + ": legFocus desconocido " + e.legFocus);
        // Las fichas de pierna DEBEN declarar legFocus y las demas NO pueden.
        if(e.subgrupos.indexOf("piernas") !== -1 && !e.legFocus) malos.push(e.id + ": ficha de pierna sin legFocus");
        if(e.legFocus && e.subgrupos.indexOf("piernas") === -1) malos.push(e.id + ": legFocus en una ficha que no es de pierna");
      });
      assert(A.ESTIRAMIENTOS.length === 24, "la biblioteca deberia tener 24 fichas, tiene " + A.ESTIRAMIENTOS.length);
      assert(malos.length === 0, malos.join(" | "));
    });

    test("V47.2 — la cobertura va solo al frente, es opaca y no tapa músculos", function(){
      // V47.2: el short deportivo se reemplazó por una cobertura MÍNIMA. Para
      // leerse como prenda, el short tenía que llegar a medio muslo y terminaba
      // tapando el tercio alto de aductores y recto femoral. La exigencia sube:
      // antes se toleraba que tapara algo; ahora no puede tapar NADA.
      var d = mapaDom();
      var front = d.querySelector('svg[data-view="front"]');
      var back = d.querySelector('svg[data-view="back"]');
      assert(front.querySelectorAll(".mapa-cobertura").length === 1, "falta la cobertura en la figura frontal");
      assert(back.querySelectorAll(".mapa-cobertura").length === 0, "la figura posterior no debería llevar cobertura");
      assert(!A.MAPA_ANATOMIA.cobertura.back, "no debería haber geometría de cobertura para la espalda");
      // No es una región: sin data-region, mountMuscleMap no le engancha clics.
      assert(!d.querySelector(".mapa-cobertura[data-region]"), "la cobertura no puede ser una región seleccionable");
      // Opaca y neutra: nada de transparencia, que dejaría distinguir lo que tapa.
      var cob = front.querySelector(".mapa-cobertura");
      assert(cob.getAttribute("fill") === "#2E2B28", "la cobertura debería ser gris oscuro neutro: " + cob.getAttribute("fill"));
      assert(cob.getAttribute("fill-opacity") === null, "la cobertura no puede ser semitransparente");
      assert(/mapaCoberturaBorde/.test(cob.getAttribute("filter") || ""), "falta el suavizado del borde");
      // Mínima: acotada a la zona genital medida sobre la lámina. Los límites
      // se calculan desde la GEOMETRÍA, no con getBBox(): el SVG de prueba está
      // desprendido del documento y getBBox() devolvería 0.
      var pts = A.MAPA_ANATOMIA.cobertura.front;
      var xs = pts.map(function(p){ return p[0]; }), ys = pts.map(function(p){ return p[1]; });
      var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
      var y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
      assert((x1-x0) <= 40 && (y1-y0) <= 45, "la cobertura creció: " + (x1-x0) + "x" + (y1-y0));
      assert(y0 >= 290 && y1 <= 335, "la cobertura se salió de la zona genital (y " + y0 + ".." + y1 + ")");

      function hs(v){
        var m = A.mapaTinteCapas(A.mapaIntensidad(v))[0].fill.match(/hsl\(([\d.]+) ([\d.]+)%/);

      assert(bajo.s < medio.s && medio.s < alto.s, "la saturación no sube: " + bajo.s + " / " + medio.s + " / " + alto.s);
      // Y no se escapa del naranja en ningún punto de la escala.

    test("V47.1 — ninguna región pintada queda tapada por otra posterior", function(){
      // Verificación real con isPointInFill, no con bounding boxes: se recorre
      // el interior de cada zona y se mira si alguna región que se pinta
      // DESPUÉS la cubre. El límite es generoso (12%) porque algunos músculos
      // se tocan de verdad en la lámina; lo que no se tolera es que una región
      // pierda un tercio o la mitad, como pasaba con los aductores (51%) y el
      // deltoides lateral de la espalda (23,6%).
      var host = frame.contentWindow.document.createElement("div");
      host.style.cssText = "position:absolute;left:-9999px;width:400px";
      host.innerHTML = A.muscleMapBodyHtml(mmStats([], 30));
      frame.contentWindow.document.body.appendChild(host);
      try{
        var malos = [];
        ["front","back"].forEach(function(v){
          var svg = host.querySelector('svg[data-view="' + v + '"]');
          var zonas = [].slice.call(svg.querySelectorAll(".mapa-zona"));
          // La cuadrícula y el criterio siguen siendo exactamente los mismos.
          // Sólo se evita llamar isPointInFill sobre una región posterior cuyo
          // bounding box ni siquiera toca el de la región actual: ese par no
          // puede cubrir ningún punto y era la causa del tiempo excesivo.
          var cajas = zonas.map(function(z){ return z.getBBox(); });
          zonas.forEach(function(z, i){
            var b = cajas[i], tot = 0, tap = 0, p = svg.createSVGPoint();
            var posteriores = [];
            for(var o = i + 1; o < zonas.length; o++){
              var c = cajas[o];
              if(!(b.x + b.width < c.x || c.x + c.width < b.x || b.y + b.height < c.y || c.y + c.height < b.y)) posteriores.push(zonas[o]);
            }
            // Sin una caja posterior que toque ésta, el numerador es
            // necesariamente 0: no hay nada que medir para esta región.
            if(!posteriores.length) return;
            for(var y = b.y; y <= b.y + b.height; y += 0.8)
            for(var x = b.x; x <= b.x + b.width; x += 0.8){
              p.x = x; p.y = y;
              if(!z.isPointInFill(p)) continue;
              tot++;
              for(var j = 0; j < posteriores.length; j++) if(posteriores[j].isPointInFill(p)){ tap++; break; }
            }
            if(tot && tap / tot > 0.12) malos.push(v + "/" + z.getAttribute("data-region") + " " + Math.round(100*tap/tot) + "%");
          });
        });
        assert(malos.length === 0, "regiones repintadas por una vecina: " + malos.join(", "));
      } finally { host.remove(); }
    });

      izq.forEach(function(p, i){

    test("V47.1 — ningún punto de ninguna región cae fuera de la silueta", function(){
      // mix-blend-mode:color sobre el fondo blanco es invisible POR DEFINICIÓN

      // pierde esa superficie sin aviso: al deltoides lateral de la espalda le
      // pasaba con 2 de sus 7 puntos, un 30% del área.
      //
      // ALCANCE: sólo las regiones que V47.1 rehizo. La medición encontró que
      // otras regiones anteriores también se salen —back/triceps y
      // back/hamstrings son las peores, y back/obliques pierde un 74% del área
      // sobre el fondo—, pero corregirlas es un cambio de geometría que no
      // estaba en el alcance de V47.1 y se informó aparte para decidirlo. Este
      // test impide que las regiones YA corregidas vuelvan atrás; ampliar la
      // lista es el paso siguiente cuando se decida rehacer las otras.
      var ALCANCE = ["adductors", "quads-inner", "shoulder-lateral", "calves-soleus"];
      // La silueta se aproxima con un margen generoso por vista; lo que se caza
      // es un punto claramente afuera, no un píxel de antialias.
      var limites = {
        // y: [xMin, xMax] admisibles para el cuerpo, medidos sobre la lámina.
        front: { 112:[66,264], 130:[62,268], 150:[60,270], 340:[86,244], 380:[84,246], 420:[90,240] },
        back:  { 112:[72,258], 130:[62,268], 150:[59,271], 340:[80,250], 380:[78,252], 420:[86,244] }

      var malos = [];

        var regs = A.MAPA_ANATOMIA.vistas[v].regiones;
        Object.keys(regs).filter(function(k){
          var base = k.replace(/2$/, "");
          return ALCANCE.indexOf(base) !== -1;
        }).forEach(function(k){
          regs[k].forEach(function(p){
            var ys = Object.keys(limites[v]).map(Number);
            var y = ys.reduce(function(a,b){ return Math.abs(b - p[1]) < Math.abs(a - p[1]) ? b : a; });

    // ===================================================================
    // A1 — el registro por serie del flujo heredado verifica el guardado.
    //
    // Historia: el handler de "Guardar" ignoraba el resultado de Supabase, así
    // que un guardado fallido marcaba la serie, decía "Registro guardado" y
    // dejaba `registroId: undefined`; después, editar ESA serie actualizaba
    // una fila inexistente. La implementación vigente (V48) además genera el
    // id en el cliente, envuelve las dos llamadas en try/catch y corta por
    // cambio de cuenta. Estos tests fijan ese comportamiento.
    //
    // Qué NO se afirma acá, a propósito: que el modal se cierre. El cierre
    // depende de `persistRutina()` y de refrescar el historial, y en el
    // harness no hay contexto de persistencia V48 cargado, así que el
    // borrador no se puede guardar. Lo que estos tests miden es la escritura
    // del registro y el estado de la sesión, que es donde estaba el bug.
    //
    // Nada llega a la base: se sustituyen los métodos de Store por stubs y se
    // restauran siempre en el `finally`.
    // ===================================================================
    group("A1 — el registro por serie verifica el guardado real");

    var EX_A1 = { id:"ex-a1", nombre:"Press de banca con barra", series:"3", reps:"10", notas:"", imagenUrl:"" };

    // Se drenan SOLO microtasks, nunca setTimeout: con los stubs resolviendo
    // al instante el handler entero son microtasks, y así el test es atómico.
    // Importa porque el harness llena la cola DOS veces y dos bucles la
    // consumen en paralelo avanzando con setTimeout(runNext,0): con
    // microtasks no pueden colarse entre estas líneas y robarnos el modal o
    // el state. Esperar con setTimeout sí se los permitía.
    async function flush(){
      for(var i=0; i<60; i++) await Promise.resolve();
    }

    // Monta una sesión mínima en memoria y deja el Store stubeado. Usa un Día
    // Especial porque así el día viaja DENTRO de la sesión y sessionDay() no
    // depende de la rutina cargada (si devolviera null, renderScreenSession
    // borraría state.session en medio del test).
    async function conRegistroDeSerie(logsIniciales, setsIniciales, fn){
      var W = frame.contentWindow, T = W.__appTest, D = W.document;
      var S = T.Store;
      var prev = {
        profile: T.state.profile, session: T.state.session,
        registros: T.state.registros, sel: T.state.exerciseSelForm,
        slots: T.state.rutinaSlots, activeSlot: T.state.activeSlot,
        add: S.addRegistro, upd: S.updateRegistro, list: S.listRegistros,
        save: S.saveRutina, hc: S.historyCompat, hs: S.historyStatus
      };
      var llamadas = { add:0, upd:0, list:0, save:0 };
      T.state.profile = { id:"perfil-test-a1", name:"Test", edad:30, sexo:"m" };
      T.state.session = {
        dayId:"dia-a1", slot:"especial", dayNombre:"Día A1", startedAt:1,
        specialDay:{ id:"dia-a1", nombre:"Día A1", exercises:[EX_A1] },
        sets:{ "ex-a1": setsIniciales.slice() },
        setLogs:{ "ex-a1": logsIniciales.slice() }
      };
      T.state.registros = [];
      if(!T.state.rutinaSlots){
        T.state.rutinaSlots = { personalizada:{days:[]}, automatica:{days:[]}, enfocada:{days:[]} };
        T.state.activeSlot = T.state.activeSlot || "personalizada";
      }
      // Ninguno de estos debe tocar Supabase ni la cola de historial V48.
      S.listRegistros = function(){ llamadas.list++; return Promise.resolve([]); };
      S.saveRutina = function(){ llamadas.save++; return Promise.resolve(true); };
      S.historyCompat = { acknowledge: function(){ return Promise.resolve(); } };
      S.historyStatus = function(){ return null; };
      // Un toast viejo daría un falso positivo al buscar el aviso de fallo.
      var viejo = D.querySelector(".toast");
      if(viejo) viejo.remove();
      var ctx = {
        T:T, D:D, S:S, W:W, llamadas:llamadas, ex:EX_A1,
        sets: function(){ return T.state.session.sets["ex-a1"]; },
        logs: function(){ return T.state.session.setLogs["ex-a1"]; },
        abierto: function(){ return !!D.querySelector(".modal-back"); },
        toast: function(){ var t = D.querySelector(".toast"); return t ? t.textContent : ""; },
        // showHistoryFailure() avisa por toast con el código de la operación.
        avisoDeFallo: function(){ return ctx.toast().indexOf("No se confirmó la operación") !== -1; },
        abrir: function(idx){
          T.openSessionLogModal(EX_A1, idx);
          var backs = D.querySelectorAll(".modal-back");
          assert(backs.length >= 1, "no se abrió el modal de registro");
          var m = backs[backs.length - 1].querySelector(".modal");
          m.__save = function(){ return m.querySelector('[data-act="save"]'); };
          m.__guardar = function(peso){
            if(peso !== undefined) m.querySelector("#slog-peso").value = peso;
            m.__save().click();
          };
          return m;
        }
      };
      try {
        return await fn(ctx);
      } finally {
        S.addRegistro = prev.add; S.updateRegistro = prev.upd; S.listRegistros = prev.list;
        S.saveRutina = prev.save; S.historyCompat = prev.hc; S.historyStatus = prev.hs;
        T.closeModal();
        T.state.profile = prev.profile; T.state.session = prev.session;
        T.state.registros = prev.registros; T.state.exerciseSelForm = prev.sel;
        T.state.rutinaSlots = prev.slots; T.state.activeSlot = prev.activeSlot;
      }
    }

    /* ===================================================================
       V50.2 — integridad del entrenamiento (E3 · E4 · E5 · E6 · E7 · E8).

       Qué se mide corriendo la app y qué se mide en el fuente, y por qué:

       - La lógica nueva (sessionSetCount, sesionLegadaEnDia,
         syncSessionSetsWithDay, olvidarRegistroDeLaSesion, sessionProgress)
         está expuesta en __appTest y se prueba llamándola con datos armados.
       - El modal de registro por serie se prueba de verdad: openSessionLogModal
         está expuesto y se le sustituyen los métodos de Store, así que E3, E4 y
         E7 se verifican sobre el handler que corre en producción.
       - Los handlers de "Eliminar día" y "Eliminar ejercicio" viven dentro de
         mountRutina, que no está expuesto, y renderizar esa pantalla completa
         exige una sesión de Supabase que el harness no tiene. Ahí se verifica
         el CABLEADO en el fuente —que la guarda corra antes de confirmDialog y
         que la sincronización corra antes de persistir— y la lógica se prueba
         aparte, llamándola. Es una limitación del harness, no una elección.
       =================================================================== */

    group("V50.2 — integridad del entrenamiento");

    var SESSION_SRC = (function(){
      try{
        var x = new XMLHttpRequest();
        x.open("GET", "v48-session.js?test=" + Date.now(), false);
        x.send(null);
        return x.status === 200 ? x.responseText : null;
      }catch(e){ return null; }
    })();

    function diaV502(){
      return { id:"d-502", nombre:"Día 502", exercises:[
        { id:"x1", nombre:"Press de banca con barra", series:"3", reps:"10", notas:"", imagenUrl:"" },
        { id:"x2", nombre:"Remo con barra", series:"2", reps:"10", notas:"", imagenUrl:"" }
      ]};
    }

    // Monta una sesión V47 sobre un día de la rutina "personalizada" (no un Día
    // Especial: lo que se prueba es justamente que el día viva FUERA de la
    // sesión, que es la causa de E5 y E6). Restaura todo siempre.
    function conSesionV502(fn){
      var W = frame.contentWindow, T = W.__appTest;
      var prev = {
        session: T.state.session, unresolved: T.state.unresolvedSession,
        slots: T.state.rutinaSlots, activeSlot: T.state.activeSlot, rutina: T.state.rutina
      };
      var day = diaV502();
      T.state.unresolvedSession = null;
      T.state.rutinaSlots = { personalizada:{ days:[day] }, automatica:{ days:[] }, enfocada:{ days:[] } };
      T.state.activeSlot = "personalizada";
      T.state.rutina = T.state.rutinaSlots.personalizada;
      T.state.session = {
        dayId: day.id, slot:"personalizada", dayNombre: day.nombre, startedAt: 1,
        sets: { x1:[false,false,false], x2:[false,false] },
        setLogs: { x1:[null,null,null], x2:[null,null] }
      };
      var ctx = {
        T:T, day:day,
        sets: function(){ return T.state.session.sets; },
        logs: function(){ return T.state.session.setLogs; }
      };
      try { return fn(ctx); }
      finally {
        T.state.session = prev.session; T.state.unresolvedSession = prev.unresolved;
        T.state.rutinaSlots = prev.slots; T.state.activeSlot = prev.activeSlot;
        T.state.rutina = prev.rutina;
      }
    }

      el.querySelector('[data-native-finalize]').onclick=requestNativeFinish;
      const nativeCancel=el.querySelector('[data-native-cancel]');
      if(nativeCancel) nativeCancel.onclick=requestNativeCancel;
      const useRemote=el.querySelector('[data-native-use-remote]');if(useRemote) useRemote.onclick=requestNativeRemoteResolution;
      if(VodaFitLifecycle.pending(session) || state.rutinaRaw?.__v48TerminalRequest){
        el.querySelectorAll('[data-native-field],[data-native-check],[data-native-finish]').forEach(e=>e.disabled=true);
        el.querySelector('[data-native-finalize]').textContent="Finalización pendiente · Reintentar guardado local";
        el.querySelectorAll('[data-native-count]').forEach(b=>{
          const id=b.dataset.nativeCount;b.textContent=VodaFitSession.completed(session,id).length+"/"+VodaFitSession.rows(session,id).length;
        });
        el.querySelectorAll('[data-native-rest]').forEach(b=>b.onclick=()=>{if(current()) openRestModal();});
        el.querySelectorAll('[data-native-info]').forEach(b=>b.onclick=()=>{
          if(!current()) return;
          const ex=day.exercises.find(x=>x.id===b.dataset.nativeInfo);
          if(ex) openExerciseDetail(ex,{returnTab:"sesion"});
        });
        return;
      }
      VodaFitSession.bind(el,session,{
        onChange:async()=>{
          if(!current()) return;
          const status=el.querySelector('[data-native-save-status]');
          if(status) status.textContent="Guardando borrador…";
          const saved=await persistRutina();
          if(!current()) return;
          if(status && status.isConnected) status.textContent=saved.ok ? "Borrador guardado en este dispositivo. Pendiente de sincronización."
            : "No se pudo guardar el último cambio. Conservá esta pantalla abierta y revisá el aviso.";
        },
        onFinish:exId=>openNativeReferenceDialog(session,exId,current),
        onRest:()=>{if(current()) openRestModal();},
        onInfo:exId=>{if(current()){const ex=day.exercises.find(x=>x.id===exId);if(ex) openExerciseDetail(ex,{returnTab:"sesion"});}}
      });
      return;
    }
    el.querySelectorAll(".setdot").forEach(dot=>{
      if(dot.classList.contains("locked")) return; // v28: bloqueada hasta completar la anterior de ESE ejercicio
      dot.onclick = ()=>{
        const exId = dot.dataset.ex, idx = parseInt(dot.dataset.idx,10);
        toggleSessionSet(exId, idx);
        persistRutina();
        renderScreenSession();
      };
    });
    el.querySelectorAll("[data-rest-btn]").forEach(b=>{
      b.onclick = ()=> openRestModal();
    });
    el.querySelectorAll("[data-howto-ex-session]").forEach(b=>{
      b.onclick = ()=>{
        const ex = (day.exercises||[]).find(x=>x.id===b.dataset.howtoExSession);
        if(ex) openExerciseDetail(ex, { returnTab:"sesion" });
      };
    });
    el.querySelectorAll("[data-log-weight]").forEach(b=>{
      b.onclick = ()=>{
        const ex = (day.exercises||[]).find(x=>x.id===b.dataset.logWeight);
        if(ex) openSessionLogModal(ex, parseInt(b.dataset.logIdx,10));
      };
    });
    el.querySelectorAll("[data-edit-set]").forEach(row=>{
      row.onclick = ()=>{
        const ex = (day.exercises||[]).find(x=>x.id===row.dataset.editSet);
        if(ex) openSessionLogModal(ex, parseInt(row.dataset.idx,10));
      };
    });
    const cancelBtn = el.querySelector("#btn-cancel-session");
    if(cancelBtn) cancelBtn.onclick = async ()=>{
      const ok = await confirmDialog("Cancelar entrenamiento", "¿Salir sin guardar este entrenamiento? Se va a perder el progreso marcado.");
      if(!ok) return;
      state.session = null;
      await persistRutina();
      state.tab = "rutina";
      render();
    };
  }

  function openNativeReferenceDialog(session,exId,current){
    if(!current() || VodaFitLifecycle.pending(session)) return;
    const snapshot=VodaFitSession.completed(session,exId);
    if(!snapshot.length){showToast("Completá al menos una serie válida antes de terminar el ejercicio.");return;}
    const m=openModal(`<h3>Terminar ejercicio</h3>
      <p>¿Querés guardar estos pesos y repeticiones como referencia para la próxima vez?</p>
      <p class="helptext">Ambas opciones conservan tus series completadas en el borrador. La referencia se confirma al finalizar el entrenamiento completo.</p>
      <div class="modal-actions"><button class="btn btn-outline" data-native-answer="no">No guardar</button>
      <button class="btn btn-primary" data-native-answer="yes">Guardar referencia</button></div>`);
    m.querySelectorAll('[data-native-answer]').forEach(button=>button.onclick=async()=>{
      if(!current() || VodaFitLifecycle.pending(session)) return;
      if(!VodaFitSession.decide(session,exId,button.dataset.nativeAnswer==="yes",snapshot)){
        closeModal();showToast("Las series cambiaron. Volvé a terminar el ejercicio para elegir la referencia.");return;
      }
      const saved=await persistRutina();
      if(!current()) return;
      closeModal();renderScreenSession();
      if(saved.ok){
        const index=session.day.exercises.findIndex(ex=>ex.id===exId),next=session.day.exercises[index+1];
        if(next){const card=Array.from(document.querySelectorAll('[data-native-card]')).find(el=>el.dataset.nativeCard===next.id);
          if(card) card.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});}
      }
    });
  }

  // Dentro de cada ejercicio las series se completan en orden: tocar la
  // próxima pendiente la marca; tocar una ya marcada la desmarca a ELLA y a
  // todas las que venían después (si esas dependían de que esta estuviera
  // hecha, dejarlas marcadas sería un dato falso — esta es la "corrección en
  // cascada" pedida). Tocar una serie todavía no alcanzada no hace nada (está
  // bloqueada visualmente, ver sessionExerciseCardHtml). Esto NUNCA bloquea
  // pasar a otro ejercicio — es solo el orden dentro de este.
  function toggleSessionSet(exId, idx){
    const arr = state.session.sets[exId];
    if(!arr) return;
    if(arr[idx]){
      for(let i=idx;i<arr.length;i++) arr[i]=false;
    } else {
      const nextIdx = arr.findIndex(v=>!v);
      if(nextIdx !== idx) return;
      arr[idx] = true;
    }
  }

  // V28.1: registrar peso/reps POR SERIE sin salir de "Entrenamiento" — un
  // solo acceso de registro por ejercicio (nunca un botón por serie), que
  // opera siempre sobre la serie activa (la próxima pendiente, `idx`); si esa
  // serie puntual ya tiene un registro cargado (se reabre tocando su propia
  // línea en la tarjeta, ver sessionExerciseCardHtml), el modal se abre en
  // modo EDICIÓN de ese mismo registro en vez de crear uno duplicado. Como el
  // resto de los modales de la app, se monta directo sobre document.body sin
  // tocar #app/#screen (openModal/closeModal), así que no se pierde el
  // scroll ni el estado de la pantalla de sesión al cerrarlo. Reusa
  // Store.addRegistro/updateRegistro (misma tabla `registros` de siempre,
  // con `set_number` = idx+1 para las filas nuevas) para que el historial y
  // el gráfico de Registro queden al día al instante.
  function openSessionLogModal(ex, idx){
    const owner=state.profile.id,generation=authLoadGeneration,session=state.session;
    const current=()=>state.profile?.id===owner && generation===authLoadGeneration && state.session===session;
    let existing = (state.session.setLogs[ex.id] || [])[idx] || null;
    const registroId=existing?.registroId || crypto.randomUUID?.();
    const m = openModal(`
      <h3>${existing?"Editar serie":"Registrar serie"} ${idx+1}</h3>
      <p class="helptext" style="margin:-8px 0 4px">${esc(ex.nombre)}</p>
      <div class="stack">
        <div class="field-row">
          <div class="field"><label>Fecha</label><input type="date" id="slog-date" value="${esc(existing? existing.date : todayStr())}"></div>
          <div class="field"><label>Peso (kg)</label><input type="number" id="slog-peso" inputmode="decimal" step="0.5" min="0" placeholder="Ej: 40" value="${existing? esc(existing.peso) : ""}"></div>
        </div>
        <div class="field">
          <label>Reps</label>
          <input type="text" id="slog-reps" maxlength="12" value="${esc(existing? existing.reps : (ex.reps||""))}">
        </div>
        <div class="field"><label>Nota (opcional)</label><input type="text" id="slog-nota" maxlength="60" placeholder="Ej: sentí bien la técnica" value="${existing? esc(existing.nota||"") : ""}"></div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" data-act="cancel">Cancelar</button>
        <button class="btn btn-primary" data-act="save">Guardar</button>
      </div>
    `);
    m.querySelector('[data-act="cancel"]').onclick = closeModal;
    m.querySelector('[data-act="save"]').onclick = async ()=>{
      const pesoInput = m.querySelector("#slog-peso");
      const peso = pesoInput.value;
      if(peso===""){ pesoInput.focus(); return; }
      const date = m.querySelector("#slog-date").value || todayStr();
      const reps = m.querySelector("#slog-reps").value;
      const nota = m.querySelector("#slog-nota").value.trim();
      const saveBtn = m.querySelector('[data-act="save"]');
      if(saveBtn.disabled || !current())return; // doble tap/cambio de cuenta
      saveBtn.disabled = true;
      const pesoNum = parseFloat(peso);
      if(existing){
        // Edición: actualiza la fila que ya existía para ESTA serie, nunca
        // crea una nueva. `set_number` no se toca (no cambia de serie).
        let ok;try{ok=await Store.updateRegistro(owner,existing.registroId,{peso:pesoNum,date,series:"1",reps,nota});}catch(error){ok=false;}
        if(!current())return;
        if(!ok){saveBtn.disabled=false;showHistoryFailure();return;}
        state.session.setLogs[ex.id][idx] = { registroId: existing.registroId, peso: pesoNum, reps, nota, date };
      } else {
        // Alta: una fila = una serie (series:"1" es correcto acá, no es el
        // total de series del ejercicio). set_number = idx+1 (1-indexado).
        const data = { id:registroId, exercise: ex.nombre, peso: pesoNum, date, series: "1", reps: reps||"", nota, setNumber: idx+1, createdAt: Date.now() };
        let res;try{res=await Store.addRegistro(owner,data);}catch(error){res={ok:false,error};}
        if(!current())return;
        if(!res?.ok || !res.id){saveBtn.disabled=false;showHistoryFailure(res);return;}
        state.session.setLogs[ex.id][idx] = { registroId: res.id, peso: pesoNum, reps, nota, date };
        existing=state.session.setLogs[ex.id][idx];
        toggleSessionSet(ex.id, idx); // idx es siempre la serie activa (next) acá, nunca una ya hecha — no hay riesgo de descascadear
      }
      const refreshed=await refreshHistoryAfterWrite(owner,generation,"registros");
      if(!current())return;
      state.exerciseSelForm = canonicalExerciseName(ex.nombre);
      const saved=await persistRutina();
      if(!current())return;
      if(!saved.ok || !refreshed){saveBtn.disabled=false;return;}
      closeModal();
      renderScreenSession();
      showToast(existing ? "Registro actualizado" : "Registro guardado");
    };
  }

  // V28: "Guardar entrenamiento" ahora es un guardado de PROGRESO, no un
  // cierre del entrenamiento — persiste el estado actual (mismo blob de
  // rutinas.data, ver persistRutina) y vuelve al menú, pero la sesión sigue
  // viva: no crea ningún registro en `entrenos` ni cuenta para la racha/meta
  // todavía. Eso solo lo hace "Finalizar" (ver finalizeSession), para no
  // duplicar registros de un mismo entrenamiento.
  async function saveSessionProgress(){
    // V48 confirma y congela el cierre; V47 conserva su guardado de progreso.
    if(nativeSession()) return requestNativeFinish();
    const saved=await persistRutina();
    if(!saved.ok) return;
    state.tab = state.nativeOffline ? "sesion" : "rutina";
    render();
    if(!saved.conflict && !saved.localError) showToast(saved.localOnly ? "Borrador guardado en este dispositivo" : "Progreso guardado");
  }

  // V28: "Finalizar" es la acción que de verdad cierra el entrenamiento y lo
  // cuenta para el calendario/racha/meta semanal — antes esto era lo único
  // que hacía "Terminar entrenamiento" en la propia pantalla de sesión; ahora
  // vive en el banner "Entrenamiento en curso" de Mi rutina (spec v28 sección
  // 11), separado de guardar progreso, para que no se puedan crear dos
  // registros del mismo entrenamiento.
  function nativeLifecycleHtml(s){
    const pending=VodaFitLifecycle.pending(s);
    return `<div class="card stack"><div>Duración <strong data-native-duration>${VodaFitLifecycle.clock(s)}</strong></div>
      <div class="helptext">Inicio: ${esc(VodaFitLifecycle.localDate(s.startedAt,s.timezone))} · ${esc(s.timezone)}</div>
      ${state.nativeOffline?'<div class="helptext">Entrenamiento recuperado. Los demás datos de la cuenta requieren conexión.</div>':''}
      <div class="helptext">${pending?"Finalización pendiente de confirmación remota. Hora de cierre fijada.":"Tiempo automático desde el inicio. El borrador se conserva en este dispositivo."}</div></div>`;
  }
  async function requestNativeFinish(){
    if(state.rutinaRaw?.__v48TerminalRequest){showToast("Hay una operación terminal pendiente. Recargá con conexión para reconciliarla.");return;}
    const s=nativeSession(),owner=state.profile?.id,generation=authLoadGeneration;
    if(!s) return;
    if(VodaFitLifecycle.pending(s)) return finalizeSession(s.day);
    for(const ex of s.day.exercises){
      const sets=VodaFitSession.completed(s,ex.id),decision=s.references[ex.id];
      if(sets.length && (!decision || !VodaFitPersistence.equal(sets,decision.sets))){
        showToast("Elegí primero si querés guardar la referencia de cada ejercicio completado.");
        openNativeReferenceDialog(s,ex.id,()=>nativeSession()===s && state.profile?.id===owner && authLoadGeneration===generation);return;
      }
    }
    const yes=await confirmDialog("Finalizar entrenamiento","Se fijará la hora de cierre. El borrador se conservará hasta confirmar el guardado completo; si no hay conexión quedará pendiente.","Finalizar");
    if(yes && nativeSession()===s && state.profile?.id===owner && generation===authLoadGeneration) return finalizeSession(s.day);
  }
  async function requestNativeCancel(){
    const s=nativeSession(),owner=state.profile?.id,generation=authLoadGeneration;
    if(!s || VodaFitLifecycle.pending(s) || state.rutinaRaw?.__v48TerminalRequest) return;
    const yes=await confirmDialog("Cancelar entrenamiento","Se descartará este borrador sin registrar series realizadas ni actualizar referencias. Si no hay conexión, la cancelación quedará pendiente.","Cancelar entrenamiento");
    if(!yes || nativeSession()!==s || state.profile?.id!==owner || generation!==authLoadGeneration) return;
    const saved=await persistRutina();
    if(!saved.ok || state.profile?.id!==owner || generation!==authLoadGeneration) return;
    const result=await nativeReconciler.cancel(owner,rutinaSync.getContext()?.base,s.sessionId,navigator.onLine!==false);
    if(state.profile?.id!==owner || generation!==authLoadGeneration) return;
    if(result.ok) await applyNativeTerminalResult(result,owner,generation);
    else {await loadProfileData().catch(()=>{});if(state.profile?.id!==owner || generation!==authLoadGeneration)return;render();showToast("Cancelación pendiente ("+result.code+"). El borrador se conserva hasta confirmación remota.");}
  }
  async function applyNativeTerminalResult(result,owner,generation){
    nativeTerminalRefresh=result;
    try {
      await loadProfileData({confirmedNative:true});
      if(generation!==authLoadGeneration || state.profile?.id!==owner) return;
      nativeTerminalRefresh=null;state.tab=nativeSession()?"sesion":"rutina";render();
      showToast(state.historyRefreshPending?"Operación confirmada. Falta actualizar el historial; volvé a cargar con conexión."
        : result.resolved?"Borrador reconciliado con el estado remoto.":result.terminal.estado==="finalizada"?"Entrenamiento registrado.":"Operación confirmada.");
    } catch(error){showToast("Operación remota confirmada. Falta actualizar esta pantalla; reintentá o recargá.");}
  }
  async function requestNativeRemoteResolution(){
    const s=nativeSession(),owner=state.profile?.id,generation=authLoadGeneration;
    if(!s) return;
    const yes=await confirmDialog("Resolver sesión", "Se conservará el estado confirmado en el servidor y se descartará este borrador local. No se crearán registros ni se aplicarán sus referencias pendientes. ¿Confirmar?", "Usar estado remoto");
    if(!yes || generation!==authLoadGeneration || state.profile?.id!==owner || nativeSession()!==s) return;
    const result=await nativeReconciler.acceptTerminal(owner,rutinaSync.getContext()?.base,s.sessionId,navigator.onLine!==false,true);
    if(generation!==authLoadGeneration || state.profile?.id!==owner) return;
    if(result.ok) await applyNativeTerminalResult(result,owner,generation);
    else showToast("No se confirmó la reconciliación ("+result.code+"). El borrador se conserva.");
  }
  async function finalizeNativeSession(){
      if(state.rutinaRaw?.__v48TerminalRequest) return {ok:false,code:"OPERATION_IN_PROGRESS"};
      const s=nativeSession(),owner=state.profile.id,generation=authLoadGeneration;
      try {VodaFitLifecycle.finish(s);} catch(e){showToast("No se pudo fijar la hora de cierre. Revisá la hora del dispositivo.");return {ok:false,code:e.message};}
      stopNativeClock();
      const cached=await rutinaCache.get(owner).catch(()=>null);
      const durableClose=cached && VodaFitPersistence.equal(cached.draft.sesionActiva?.lifecycle,s.lifecycle);
      const saved=nativeTerminalRefresh || durableClose?{ok:true}:await persistRutina();
      if(generation!==authLoadGeneration || state.profile?.id!==owner) return saved;
      if(!saved.ok){render();showToast("Cierre pendiente sin confirmar el guardado local. Conservá esta pantalla abierta y reintentá.");return saved;}
      const result=nativeTerminalRefresh || await nativeReconciler.finish(owner,rutinaSync.getContext()?.base,s.sessionId,navigator.onLine!==false);
      if(generation!==authLoadGeneration || state.profile?.id!==owner) return result;
      if(result.ok) await applyNativeTerminalResult(result,owner,generation);
      else {
        state.nativeReconcileIssue=result.code;render();
        showToast(result.code==="V48_NOT_READY" || result.code==="OFFLINE_PENDING" ? "Cierre guardado en este dispositivo. Pendiente de confirmación remota."
          : "Cierre pendiente ("+result.code+"). El borrador se conserva; no se sobrescribieron cambios remotos.");
      }
      return result;
  }
  async function finalizeSession(day){
    if(nativeSession()) return finalizeNativeSession();
    if(state.unresolvedSession && state.unresolvedSession.schemaVersion===48){
      showToast("El borrador no puede interpretarse. Se conserva sin modificar.");return;
    }
    const p = sessionProgress();
    // V29: un Día Especial se registra como cualquier entrenamiento (mismo
    // Store.addEntreno, misma tabla), marcado con isSpecial → is_special.
    const isSpecial = !!(state.session && state.session.slot==="especial");
    // V30: slot se fija al iniciar/recuperar la sesión, por lo que conserva
    // el origen real incluso si después cambia la rutina activa.
    const routineOrigin = state.session && state.session.slot;
    const data = { date: todayStr(), dayId: day.id, dayNombre: day.nombre, setsCompletados: p.done, setsTotales: p.total, createdAt: Date.now(), isSpecial, routineOrigin };
    const saved = await Store.addEntreno(state.profile.id, data);
    // Si la base rechaza el registro, NO se borra la sesión y se muestra el
    // error EXACTO que devolvió Supabase (V29.2). Causa conocida: si la
    // columna entrenos.is_special no existe (falta correr
    // supabase-migration-v29.sql), PostgREST responde PGRST204
    // "Could not find the 'is_special' column of 'entrenos' in the schema cache"
    // — solo afecta al Día Especial, porque solo él manda is_special.
    if(!saved || !saved.ok){
      const err = (saved && saved.error) || {};
      console.error("finalizeSession: Supabase rechazó el insert en entrenos", err, data);
      const missingSpecialCol = /is_special/.test(err.message||"") && (err.code==="PGRST204" || err.code==="42703");
      const missingRoutineOriginCol = /routine_origin/.test(err.message||"") && (err.code==="PGRST204" || err.code==="42703");
      const m = openModal(`
        <h3>No se pudo registrar el entrenamiento</h3>
        <p class="helptext" style="font-size:14px; color:var(--text)">Tu sesión sigue guardada — no se perdió nada.</p>
        ${missingSpecialCol ? `<p class="helptext" style="font-size:14px; color:var(--text)">La base de datos todavía no tiene la columna <b>is_special</b> en la tabla <b>entrenos</b>: hay que correr <b>supabase-migration-v29.sql</b> en Supabase (SQL Editor). Después, volvé a tocar "Finalizar".</p>` : ""}
        ${missingRoutineOriginCol ? `<p class="helptext" style="font-size:14px; color:var(--text)">La base de datos todavía no tiene la columna <b>routine_origin</b> en la tabla <b>entrenos</b>: hay que correr <b>supabase-migration-v30.sql</b> en Supabase (SQL Editor). Después, volvé a tocar "Finalizar".</p>` : ""}
        <p class="helptext">Error de Supabase${err.code?` (${esc(String(err.code))})`:""}: ${esc(err.message || "sin detalle")}</p>
        <div class="modal-actions"><button class="btn btn-primary btn-block" data-act="ok">Entendido</button></div>
      `);
      m.querySelector('[data-act="ok"]').onclick = closeModal;
      return;
    }
    // V46: los estiramientos sugeridos se calculan ACÁ, antes de limpiar
    // state.session, porque salen de las series completadas de esta sesión. Va
    // envuelto en try/catch a propósito: el entrenamiento YA quedó registrado
    // en `entrenos` unas líneas más arriba, así que un error calculando una
    // sugerencia opcional no puede ensuciar un guardado que ya salió bien.
    let estirSugeridos = [];
    try {
      estirSugeridos = estiramientosParaEjercicios(
        ejerciciosConSerieCompletada(day, state.session && state.session.sets)
      );
    } catch(e){
      console.error("V46: no se pudieron calcular los estiramientos sugeridos", e);
      estirSugeridos = [];
    }
    state.entrenos = await Store.listEntrenos(state.profile.id);
    state.session = null;
    await persistRutina();
    state.tab = "rutina";
    render();
    const m = openModal(`
      <h3>¡Entrenamiento registrado! 💪</h3>
      <p style="font-size:14px; color:var(--text)">${esc(fraseDelDia())}</p>
      ${estiramientosModalHtml(estirSugeridos)}
      <div class="modal-actions"><button class="btn btn-primary btn-block" data-act="ok">Dale</button></div>
    `);
    m.querySelector('[data-act="ok"]').onclick = closeModal;
    // Los estiramientos son OPCIONALES: "Dale" sigue siendo la acción principal
    // y cerrar el modal no exige pasar por ningún paso nuevo.
    // El modal muestra 3, pero a la biblioteca viajan las 5 calculadas: "Ver
    // todos" abre las recomendaciones DE ESTA SESION, no una lista generica.
    const estirIds = estirSugeridos.map(e=>e.id);
    const verTodos = m.querySelector('[data-act="estir-todos"]');
    if(verTodos) verTodos.onclick = ()=>{ closeModal(); abrirEstiramientos({ from:"rutina", sugeridos:estirIds }); };
    m.querySelectorAll("[data-estir-sug]").forEach(row=>{
      row.onclick = ()=>{ closeModal(); abrirEstiramientos({ id:row.dataset.estirSug, from:"rutina", sugeridos:estirIds }); };
    });
  }

  /* ================= REGISTRO ================= */
  function filterHistory(list){
    const f = state.historyFilter;
    return list.filter(r=>{
      // V34: el filtro puede traer un nombre viejo guardado en el estado; se
      // canonicalizan los dos lados para que coincida con el historial unificado.
      if(f.exercise && canonicalExerciseName(r.exercise)!==canonicalExerciseName(f.exercise)) return false;
      if(f.from && r.date < f.from) return false;
      if(f.to && r.date > f.to) return false;
      return true;
    });
  }

  function toCSV(rows){
    const header = ["Fecha","Ejercicio","Peso (kg)","Series","Reps","Nota"];
    const escCsv = (v)=>{
      const s = String(v==null?"":v);
      return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
    };
    const lines = [header.map(escCsv).join(",")];
    rows.forEach(r=> lines.push([r.date, r.exercise, r.peso, r.series||"", r.reps||"", r.nota||""].map(escCsv).join(",")));
    return lines.join("\r\n");
  }

  function exportCSV(rows){
    const csv = toCSV(rows);
    const blob = new Blob(["﻿"+csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `fierros-historial-${(state.profile.name||"perfil").toLowerCase().replace(/\s+/g,"-")}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=> URL.revokeObjectURL(url), 1000);
  }

  // Junta los datos de la rutina activa (state.rutina, que siempre apunta a
  // rutinaSlots[state.activeSlot]) más el peso máximo registrado para cada
  // ejercicio de esa rutina (buscado en state.registros), para armar el PDF.
  function buildRoutinePdfData(){
    const isAuto = state.activeSlot === "automatica";
    const registros = state.registros || [];
    const days = (state.rutina.days || []).map(d => ({
      nombre: d.nombre,
      exercises: (d.exercises||[]).map(ex => {
        let max = null;
        registros.forEach(r => {
          if(canonicalExerciseName(r.exercise) !== canonicalExerciseName(ex.nombre)) return;
          const p = parseFloat(r.peso);
          if(isNaN(p)) return;
          if(max===null || p > max.peso || (p === max.peso && r.date > max.date)){
            max = { peso: p, date: r.date };
          }
        });
        // V34: el PDF muestra el nombre canónico actual, no el que se haya
        // guardado en su momento.
        return { nombre: canonicalExerciseName(ex.nombre), series: ex.series||"", reps: ex.reps||"", notas: ex.notas||"", max };
      }),
    }));
    return {
      routineLabel: isAuto ? "Rutina automática" : "Mi rutina",
      profileName: state.profile.name || "Usuario",
      days,
      generatedAt: todayStr(),
    };
  }

  // Paleta del PDF: los mismos tonos que usa la app en tema claro (el PDF
  // siempre se genera sobre página blanca, no sigue el tema claro/oscuro del
  // celular) — así el documento se siente reconociblemente VodaFit sin
  // depender de ninguna imagen ni fuente nueva.
  const PDF_INK = [27,25,23];           // --text (claro)
  const PDF_MUTED = [107,101,96];       // --text-muted (claro)
  const PDF_ACCENT = [200,74,34];       // --accent (claro)
  const PDF_BORDER = [219,216,209];     // --border (claro)
  const PDF_SUCCESS = [46,158,91];      // --success (claro)
  const PDF_WATERMARK = [239,235,229];  // igual que --border pero más pálido, solo para la marca de agua

  // V38: isotipo VodaFit en el PDF, con la MISMA geometría que el SVG de la app
  // (viewBox 0 0 1164 578), dibujado como dos polígonos rellenos — nada de
  // imágenes ni fuentes nuevas, así se ve idéntico en la app y en el PDF.
  //
  // El PDF se imprime sobre página blanca, así que esta es la variante de
  // CONTRASTE PARA FONDO CLARO: la "V" va en tinta oscura (inkColor) en lugar
  // de blanca; la "F" mantiene el naranja de marca. `size` es el ANCHO del
  // isotipo; el alto sale de su proporción (~2:1).
  // Naranja del ISOTIPO: el de la marca (#FF6A00), igual que el ícono de la app
  // y el SVG del header. Es distinto de PDF_ACCENT (#C84A22), que es el acento
  // del documento y lo siguen usando el resto de los elementos del PDF.
  const PDF_BRAND_ORANGE = [255,106,0];
  const PDF_MARK_W = 1164, PDF_MARK_H = 578;
  const PDF_MARK_V = [[0,1],[199,1],[423,320],[682,1],[1164,1],[1057,136],[747,136],[404,564]];
  const PDF_MARK_F = [[751,199],[1018,199],[906,340],[817,340],[628,577],[457,577]];
  function pdfDrawMark(doc, x, y, size, inkColor, accentColor){
    const s = size/PDF_MARK_W;
    const poly = (pts, col)=>{
      doc.setFillColor(col[0], col[1], col[2]);
      // jsPDF dibuja polígonos con lines() a partir de un punto y deltas.
      const deltas = [];
      for(let i=1;i<pts.length;i++) deltas.push([(pts[i][0]-pts[i-1][0])*s, (pts[i][1]-pts[i-1][1])*s]);
      doc.lines(deltas, x + pts[0][0]*s, y + pts[0][1]*s, [1,1], "F", true);
    };
    poly(PDF_MARK_V, inkColor);
    poly(PDF_MARK_F, accentColor);
  }
  // Alto que ocupa el isotipo para un ancho dado — para centrarlo verticalmente.
  function pdfMarkHeight(size){ return size * PDF_MARK_H / PDF_MARK_W; }

  function pdfWatermark(doc, pageW, pageH){
    const size = 260; // ancho del isotipo; el alto sale de su proporción
    pdfDrawMark(doc, pageW/2 - size/2, pageH/2 - pdfMarkHeight(size)/2, size, PDF_WATERMARK, PDF_WATERMARK);
  }

  // Encabezado grande, solo en la primera página — hace las veces de portada
  // sin gastar una hoja aparte (una portada vacía solo con el logo no suma
  // nada práctico acá): marca + nombre + qué rutina es + para quién + fecha.
  function pdfBigHeader(doc, pageW, marginX, data){
    doc.setFillColor(PDF_INK[0], PDF_INK[1], PDF_INK[2]);
    doc.rect(0, 0, pageW, 92, "F");
    // Sobre la banda oscura va la variante blanco/naranja, como en la app.
    pdfDrawMark(doc, marginX, 34, 52, [255,255,255], PDF_BRAND_ORANGE);
    doc.setFont("helvetica","bold"); doc.setFontSize(24);
    doc.setTextColor(255,255,255);
    doc.text("V O D A F I T", marginX+66, 45); // espaciado manual entre letras: sin fuente nueva, sin riesgo de carga
    doc.setFont("helvetica","normal"); doc.setFontSize(11);
    doc.setTextColor(224,219,212);
    doc.text("Rutina de entrenamiento", marginX+66, 62);
    doc.setFont("helvetica","bold"); doc.setFontSize(10.5);
    doc.setTextColor(255,255,255);
    doc.text(data.routineLabel, pageW-marginX, 45, { align:"right" });
    doc.setFont("helvetica","normal"); doc.setFontSize(9.5);
    doc.setTextColor(224,219,212);
    doc.text(data.profileName, pageW-marginX, 60, { align:"right" });
    doc.text(`Generado el ${fmtDate(data.generatedAt)}`, pageW-marginX, 73, { align:"right" });
    return 92 + 24;
  }

  // Encabezado chico, repetido en cada página siguiente.
  function pdfSlimHeader(doc, pageW, marginX, data){
    // Sobre página blanca: variante de contraste, la V en tinta oscura.
    pdfDrawMark(doc, marginX, 16, 24, PDF_INK, PDF_BRAND_ORANGE);
    doc.setFont("helvetica","bold"); doc.setFontSize(11);
    doc.setTextColor(PDF_INK[0], PDF_INK[1], PDF_INK[2]);
    doc.text("VODAFIT", marginX+32, 28);
    doc.setFont("helvetica","normal"); doc.setFontSize(9.5);
    doc.setTextColor(PDF_MUTED[0], PDF_MUTED[1], PDF_MUTED[2]);
    doc.text(data.routineLabel, pageW-marginX, 28, { align:"right" });
    doc.setDrawColor(PDF_BORDER[0], PDF_BORDER[1], PDF_BORDER[2]);
    doc.setLineWidth(0.75);
    doc.line(marginX, 40, pageW-marginX, 40);
    return 40 + 20;
  }

  // Pie de página — se dibuja al final, en una segunda pasada, porque recién
  // ahí se sabe cuántas páginas salieron en total.
  function pdfFooter(doc, pageW, pageH, marginX, pageNum, totalPages){
    doc.setDrawColor(PDF_BORDER[0], PDF_BORDER[1], PDF_BORDER[2]);
    doc.setLineWidth(0.6);
    doc.line(marginX, pageH-34, pageW-marginX, pageH-34);
    doc.setFont("helvetica","normal"); doc.setFontSize(8.5);
    doc.setTextColor(PDF_MUTED[0], PDF_MUTED[1], PDF_MUTED[2]);
    doc.text("VodaFit", marginX, pageH-20);
    doc.text(`Página ${pageNum} de ${totalPages}`, pageW-marginX, pageH-20, { align:"right" });
  }

  function exportRoutinePDF(){
    if(!window.jspdf || !window.jspdf.jsPDF){
      alert("No se pudo cargar el generador de PDF. Revisá tu conexión a internet e intentá de nuevo.");
      return;
    }
    const data = buildRoutinePdfData();
    if(data.days.length === 0){
      alert('Todavía no hay días cargados en esta rutina. Agregá al menos un día antes de exportar el PDF.');
      return;
    }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit:"pt", format:"a4" });
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    const marginX = 40;
    const bottomLimit = pageH - 46; // deja lugar para el pie de página

    let y = pdfBigHeader(doc, pageW, marginX, data);
    pdfWatermark(doc, pageW, pageH);

    function newPage(){
      doc.addPage();
      pdfWatermark(doc, pageW, pageH);
      y = pdfSlimHeader(doc, pageW, marginX, data);
    }
    function ensureSpace(lineH){
      if(y + lineH > bottomLimit){ newPage(); }
    }
    function line(text, opts){
      opts = opts || {};
      const size = opts.size||11, bold = !!opts.bold, gap = opts.gap||16;
      const color = opts.color||PDF_INK, x = opts.x||marginX;
      doc.setFont("helvetica", bold ? "bold" : "normal");
      doc.setFontSize(size);
      doc.setTextColor(color[0], color[1], color[2]);
      const wrapWidth = pageW - x - marginX;
      const wrapped = doc.splitTextToSize(text, wrapWidth);
      wrapped.forEach(w=>{
        ensureSpace(gap);
        doc.text(w, x, y);
        y += gap;
      });
    }

    data.days.forEach(day=>{
      ensureSpace(30);
      // barrita de acento a la izquierda del título del día — el mismo
      // recurso visual (naranja como identidad) que ya usa el resto de la app.
      doc.setFillColor(PDF_ACCENT[0], PDF_ACCENT[1], PDF_ACCENT[2]);
      doc.rect(marginX, y-11, 3, 15, "F");
      line(day.nombre, { size:14, bold:true, gap:20, x: marginX+10 });
      if(day.exercises.length===0){
        line("Sin ejercicios cargados.", { size:10.5, gap:16, color:PDF_MUTED, x: marginX+10 });
      } else {
        day.exercises.forEach(ex=>{
          const base = `${ex.nombre} — ${ex.series}×${ex.reps}${ex.notas?` (${ex.notas})`:""}`;
          line(base, { size:11, gap:15, x: marginX+10 });
          const maxTxt = ex.max
            ? `Máximo registrado: ${ex.max.peso} kg (${fmtDate(ex.max.date)})`
            : "Sin registros de peso todavía.";
          line(maxTxt, { size:9.5, gap:16, color: ex.max?PDF_SUCCESS:PDF_MUTED, x: marginX+10 });
        });
      }
      y += 8;
    });

    // Pie de página en una segunda pasada sobre todas las páginas ya generadas.
    const totalPages = doc.internal.getNumberOfPages();
    for(let p=1; p<=totalPages; p++){
      doc.setPage(p);
      pdfFooter(doc, pageW, pageH, marginX, p, totalPages);
    }

    const fname = `vodafit-rutina-${(data.profileName||"perfil").toLowerCase().replace(/\s+/g,"-")}-${data.generatedAt}.pdf`;
    doc.save(fname);
  }

  /* ================= V40: MI PESO (peso corporal) =================
     Todo lo de abajo es peso CORPORAL. No comparte nada con el historial de
     pesos de ejercicios (`registros`): ni tabla, ni límite de lectura, ni
     gráfico, ni CSV. La única cosa que comparten es la pantalla donde viven.

     El peso corporal NO vuelve a influir en la generación de rutinas: ninguna
     de estas funciones es llamada por el generador, por las series, por los
     descansos ni por el tope diario. `profileHasPrimeBump` sigue siendo solo
     edad (desde V34). */

  const PESO_PERIODS = [
    { key:"7d",   label:"7 días",  dias:7 },
    { key:"30d",  label:"30 días", dias:30 },
    { key:"3m",   label:"3 meses", dias:90 },
    { key:"1a",   label:"1 año",   dias:365 },
    { key:"todo", label:"Todo",    dias:null },
  ];

  // Orden canónico, el mismo del índice de la migración v40: fecha desc y,
  // ante empate de fecha, el creado más tarde primero. Es LA definición de
  // "cuál es el peso actual" — por eso vive en una sola función y todo lo
  // demás la usa, en vez de repetir el comparador.
  function pesoCorporalSorted(rows){
    return (rows||[]).slice().sort((a,b)=>
      a.fecha===b.fecha ? (b.createdAt||0)-(a.createdAt||0) : (a.fecha<b.fecha ? 1 : -1)
    );
  }

  // El mismo criterio al revés. No es sorted().reverse() por un detalle que
  // importa: invertir el desc dejaría, dentro de un mismo día, el pesaje más
  // viejo al final. Acá el más viejo va primero, que es lo que el gráfico y el
  // "peso inicial" necesitan.
  function pesoCorporalAsc(rows){
    return (rows||[]).slice().sort((a,b)=>
      a.fecha===b.fecha ? (a.createdAt||0)-(b.createdAt||0) : (a.fecha<b.fecha ? -1 : 1)
    );
  }

  // Resumen de arriba del bloque: peso actual, peso inicial y diferencia.
  // La diferencia se calcula sobre el historial COMPLETO, no sobre el período
  // del gráfico: "cuánto cambié desde que empecé" no depende de qué ventana
  // esté mirando el gráfico en ese momento.
  function pesoResumen(rows){
    const desc = pesoCorporalSorted(rows);
    if(desc.length===0) return null;
    const actual = desc[0];
    const inicial = pesoCorporalAsc(rows)[0];
    return {
      actual, inicial,
      // Con un solo registro, actual e inicial son la MISMA fila y la
      // diferencia es 0 — no es un caso especial, sale solo.
      diff: +(actual.pesoKg - inicial.pesoKg).toFixed(1),
      unico: desc.length===1,
    };
  }

  function dateMinusDays(ymdStr, dias){
    const p = String(ymdStr||"").split("-").map(n=>parseInt(n,10));
    if(p.length!==3 || p.some(isNaN)) return ymdStr;
    const d = new Date(p[0], p[1]-1, p[2]);
    d.setDate(d.getDate() - dias);
    return ymd(d);
  }

  // Ventana EXACTA e inclusiva: "7 días" son 7 fechas contando hoy, así que el
  // corte es hoy-6, no hoy-7. "Todo" no filtra nada.
  // `hoy` es parámetro (no todayStr() adentro) para poder testear períodos con
  // fechas fijas.
  function pesoCorporalEnPeriodo(rows, periodKey, hoy){
    const per = PESO_PERIODS.find(p=>p.key===periodKey) || PESO_PERIODS[PESO_PERIODS.length-1];
    if(per.dias==null) return pesoCorporalAsc(rows);
    const desde = dateMinusDays(hoy||todayStr(), per.dias-1);
    return pesoCorporalAsc(rows).filter(r=> r.fecha >= desde);
  }

  // Valida lo que escribió el usuario contra el MISMO rango que el CHECK de la
  // base (0 < peso <= 500) y a un decimal, que es la precisión de numeric(5,1).
  // Si el cliente dejara pasar algo fuera de rango, el insert fallaría del lado
  // del servidor: mejor avisarlo acá con un mensaje entendible.
  function validarPesoKg(raw){
    const v = parseFloat(String(raw==null?"":raw).replace(",", "."));
    if(!isFinite(v)) return { ok:false, error:"Escribí un peso." };
    if(v<=0) return { ok:false, error:"El peso tiene que ser mayor que 0." };
    if(v>500) return { ok:false, error:"El peso no puede pasar de 500 kg." };
    return { ok:true, value:+v.toFixed(1) };
  }

  function fmtPesoKg(n){
    if(n==null || !isFinite(n)) return "-";
    return (Math.round(n*10)/10).toFixed(1).replace(/\.0$/, "");
  }

  function fmtPesoDiff(d){
    if(d==null || !isFinite(d)) return "-";
    if(Math.abs(d) < 0.05) return "0 kg";
    return (d>0 ? "+" : "-") + fmtPesoKg(Math.abs(d)) + " kg";
  }

  // Gráfico de evolución. Un punto por PESAJE, no por semana: a diferencia del
  // peso de un ejercicio (donde interesa el máximo semanal, ver
  // exerciseWeeklyMax), el peso corporal es una medición directa y agregarla
  // por semana escondería justamente lo que se quiere ver.
  // Reusa el mismo SVG inline y las clases .exchart que ya existen — no se
  // agrega ninguna librería.
  function pesoLineChart(rowsAsc, periodLabel){
    const w = 300, h = 140, padX = 10, padY = 18;
    const vals = rowsAsc.map(r=> r.pesoKg);
    const max = Math.max(...vals);
    const min = Math.min(...vals);
    const range = (max-min)||1;
    const pts = vals.map((val,i)=>{
      const x = vals.length===1 ? w/2 : (i/(vals.length-1))*(w-padX*2)+padX;
      const y = h - padY - ((val-min)/range)*(h-padY*2);
      return [x,y];
    });
    const path = pts.map((p,i)=> (i===0?"M":"L")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
    const first = rowsAsc[0], last = rowsAsc[rowsAsc.length-1];
    return `
      <div class="exchart-wrap">
        <svg class="exchart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
          <line x1="0" y1="${h-padY}" x2="${w}" y2="${h-padY}" stroke="var(--border)" stroke-width="1"/>
          <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          ${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="var(--accent)"/>`).join("")}
        </svg>
        <div class="row between"><span class="helptext">${esc(fmtDate(first.fecha))}</span><span class="helptext">${esc(fmtDate(last.fecha))}</span></div>
        <div class="row between" style="margin-top:8px">
          <div><div class="num" style="font-weight:700; font-size:16px">${fmtPesoKg(min)} kg</div><div class="helptext">Mínimo</div></div>
          <div style="text-align:right"><div class="num" style="font-weight:700; font-size:16px">${fmtPesoKg(max)} kg</div><div class="helptext">Máximo</div></div>
        </div>
        <div class="helptext" style="text-align:center; margin-top:6px">${rowsAsc.length} pesaje${rowsAsc.length===1?"":"s"} · ${esc(periodLabel||"")}</div>
      </div>
    `;
  }

  // Bloque "Mi peso" dentro de la pantalla Registro. Devuelve HTML; los
  // handlers se enganchan en mountPesoCorporal (llamado desde mountRegistro).
  function pesoCorporalBlockHtml(){
    const rows = state.pesoCorporal || [];
    const resumen = pesoResumen(rows);

    // La tabla puede no existir todavía (migración v40 sin correr). No es un
    // error del usuario ni un bug: se dice qué falta y no se rompe nada.
    const avisoTabla = state.pesoCorporalError ? `
      <div class="banner">${icon("info")}<div>
        <b>El peso corporal no está disponible todavía.</b>
        <div class="helptext" style="margin-top:2px">Falta ejecutar la migración supabase-migration-v40.sql en Supabase. El resto de la app funciona normalmente.</div>
      </div></div>
    ` : "";

    if(state.pesoCorporalError || !resumen){
      return `
        <div class="section-title"><h2>Mi peso</h2></div>
        ${avisoTabla}
        <div class="card">
          <div class="empty">
            ${icon("log")}
            <h3>Empezá a registrar tu progreso</h3>
            <p>Tu primer peso será el punto de partida para medir tu evolución.</p>
            <button class="btn btn-primary" id="btn-peso-nuevo" ${state.pesoCorporalError?"disabled":""}>${icon("plus")} Registrar peso</button>
          </div>
        </div>
      `;
    }

    const periodKey = PESO_PERIODS.some(p=>p.key===state.pesoChartPeriod) ? state.pesoChartPeriod : "30d";
    const per = PESO_PERIODS.find(p=>p.key===periodKey);
    const enPeriodo = pesoCorporalEnPeriodo(rows, periodKey, todayStr());
    const desc = pesoCorporalSorted(rows);

    const chart = enPeriodo.length===0
      ? `<p class="helptext" style="text-align:center; padding:18px 0">Sin pesajes en este período.</p>`
      : pesoLineChart(enPeriodo, per.label);

    const diffColor = resumen.diff > 0 ? "var(--danger)" : (resumen.diff < 0 ? "var(--success)" : "var(--text-muted)");

    return `
      <div class="section-title"><h2>Mi peso</h2><span class="muted">${desc.length} pesaje${desc.length===1?"":"s"}</span></div>
      <div class="card stack">
        <div class="pesostats">
          <div class="pesostat">
            <div class="num pesostat-val">${fmtPesoKg(resumen.actual.pesoKg)}<small> kg</small></div>
            <div class="helptext">Actual · ${esc(fmtDate(resumen.actual.fecha))}</div>
          </div>
          <div class="pesostat">
            <div class="num pesostat-val">${fmtPesoKg(resumen.inicial.pesoKg)}<small> kg</small></div>
            <div class="helptext">Inicial · ${esc(fmtDate(resumen.inicial.fecha))}</div>
          </div>
          <div class="pesostat">
            <div class="num pesostat-val" style="color:${diffColor}">${fmtPesoDiff(resumen.diff)}</div>
            <div class="helptext">${resumen.unico ? "Primer pesaje" : "Diferencia"}</div>
          </div>
        </div>
        <div class="segmented" id="peso-period-seg">
          ${PESO_PERIODS.map(p=>`<button data-peso-period="${p.key}" class="${p.key===periodKey?"active":""}">${esc(p.label)}</button>`).join("")}
        </div>
        ${chart}
        <button class="btn btn-primary btn-block" id="btn-peso-nuevo">${icon("plus")} Registrar peso</button>
      </div>

      <div class="section-title"><h2>Historial de peso</h2></div>
      <div class="loglist">
        ${desc.map(r=>`
          <div class="logrow">
            <div>
              <div class="lex">${esc(fmtDate(r.fecha))}</div>
              <div class="ldate">${r.nota ? esc(r.nota) : (r.updatedAt ? "editado" : "&#8201;")}</div>
            </div>
            <div class="row" style="gap:8px">
              <div class="lval num">${fmtPesoKg(r.pesoKg)} kg</div>
              <button class="iconbtn" data-peso-edit="${esc(r.id)}" title="Editar" aria-label="Editar pesaje">${icon("edit")}</button>
              <button class="iconbtn danger" data-peso-del="${esc(r.id)}" title="Eliminar" aria-label="Eliminar pesaje">${icon("trash")}</button>
            </div>
          </div>
        `).join("")}
      </div>
    `;
  }

  // Alta y edición comparten el mismo modal: la única diferencia es si se
  // recibe una fila existente.
  function openPesoCorporalModal(existing){
    const esEdicion = !!existing;
    const m = openModal(`
      <h3>${esEdicion ? "Editar pesaje" : "Registrar peso"}</h3>
      <div class="stack" style="margin-top:4px">
        <div class="field-row">
          <div class="field">
            <label>Fecha</label>
            <input type="date" id="peso-fecha" value="${esc(esEdicion ? existing.fecha : todayStr())}" max="${todayStr()}">
          </div>
          <div class="field">
            <label>Peso (kg)</label>
            <input type="number" id="peso-kg" step="0.1" min="0" max="500" placeholder="Ej: 78.5" value="${esEdicion ? esc(fmtPesoKg(existing.pesoKg)) : ""}">
          </div>
        </div>
        <div class="field">
          <label>Nota (opcional)</label>
          <input type="text" id="peso-nota" maxlength="80" placeholder="Ej: en ayunas" value="${esEdicion ? esc(existing.nota||"") : ""}">
        </div>
        <p class="helptext" id="peso-error" style="color:var(--danger); display:none"></p>
        <p class="helptext">Podés cargar una fecha anterior. Si registrás dos veces el mismo día, el último queda como peso actual.</p>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" data-act="cancel">Cancelar</button>
        <button class="btn btn-primary" data-act="save">${esEdicion ? "Guardar cambios" : "Registrar"}</button>
      </div>
    `);

    const errEl = m.querySelector("#peso-error");
    const showErr = (msg)=>{ errEl.textContent = msg; errEl.style.display = ""; };

    m.querySelector('[data-act="cancel"]').onclick = ()=> closeModal();
    const saveBtn = m.querySelector('[data-act="save"]');
    saveBtn.onclick = async ()=>{
      const fecha = m.querySelector("#peso-fecha").value;
      const v = validarPesoKg(m.querySelector("#peso-kg").value);
      const nota = m.querySelector("#peso-nota").value.trim();
      if(!fecha){ showErr("Elegí una fecha."); return; }
      if(!v.ok){ showErr(v.error); return; }
      saveBtn.disabled = true;
      const payload = { fecha, pesoKg: v.value, nota, createdAt: Date.now() };
      const res = esEdicion
        ? await Store.updatePesoCorporal(state.profile.id, existing.id, payload)
        : await Store.addPesoCorporal(state.profile.id, payload);
      if(!res.ok){
        saveBtn.disabled = false;
        showErr("No se pudo guardar. " + ((res.error && res.error.message) || ""));
        return;
      }
      await reloadPesoCorporal();
      closeModal();
      showToast(esEdicion ? "Pesaje actualizado" : "Peso registrado");
      renderScreen();
    };
    const kg = m.querySelector("#peso-kg");
    if(kg) kg.focus();
  }

  // Relee el historial después de escribir. Mismo catch que loadProfileData:
  // una escritura que funcionó pero una relectura que falla no debe mandar la
  // app a la pantalla de error.
  async function reloadPesoCorporal(){
    try{
      state.pesoCorporal = await Store.listPesoCorporal(state.profile.id);
      state.pesoCorporalError = null;
    }catch(e){
      state.pesoCorporalError = (e && e.message) ? e.message : "No se pudo leer el peso corporal.";
    }
  }

  function mountPesoCorporal(el){
    const nuevo = el.querySelector("#btn-peso-nuevo");
    if(nuevo && !nuevo.disabled) nuevo.onclick = ()=> openPesoCorporalModal(null);

    el.querySelectorAll("[data-peso-period]").forEach(btn=>{
      btn.onclick = ()=>{ state.pesoChartPeriod = btn.dataset.pesoPeriod; renderScreen(); };
    });

    const byId = (id)=> (state.pesoCorporal||[]).find(r=> String(r.id)===String(id)) || null;

    el.querySelectorAll("[data-peso-edit]").forEach(btn=>{
      btn.onclick = ()=>{
        const row = byId(btn.dataset.pesoEdit);
        if(row) openPesoCorporalModal(row);
      };
    });

    el.querySelectorAll("[data-peso-del]").forEach(btn=>{
      btn.onclick = async ()=>{
        const row = byId(btn.dataset.pesoDel);
        if(!row) return;
        const ok = await confirmDialog("Eliminar pesaje",
          "¿Eliminar el pesaje de " + fmtDate(row.fecha) + " (" + fmtPesoKg(row.pesoKg) + " kg)?");
        if(!ok) return;
        const res = await Store.deletePesoCorporal(state.profile.id, row.id);
        if(!res.ok){ showToast("No se pudo eliminar"); return; }
        await reloadPesoCorporal();
        showToast("Pesaje eliminado");
        renderScreen();
      };
    });
  }

  function screenRegistro(){
    const names = allExerciseNames();
    const sel = state.exerciseSelForm && (names.includes(state.exerciseSelForm) || state.exerciseSelForm==="__otro__")
      ? state.exerciseSelForm : (names[0]||"__otro__");
    state.exerciseSelForm = sel;

    const forExercise = sel==="__otro__" ? null : sel;
    const historyAll = state.registros;
    const canonSel = forExercise ? canonicalExerciseName(forExercise) : null;
    const historyForSel = canonSel ? historyAll.filter(r=>canonicalExerciseName(r.exercise)===canonSel) : [];
    const spark = forExercise ? sparklineFor(historyForSel) : "";

    return `
      ${pesoCorporalBlockHtml()}

      <div class="section-title"><h2>Registrar peso de ejercicio</h2></div>
      <div class="card stack">
        <div class="field">
          <label>Ejercicio</label>
          <select id="reg-exercise">
            ${names.map(n=>`<option value="${esc(n)}" ${n===sel?"selected":""}>${esc(n)}</option>`).join("")}
            <option value="__otro__" ${sel==="__otro__"?"selected":""}>Otro / nuevo ejercicio...</option>
          </select>
        </div>
        <div id="reg-other-wrap" style="${sel==="__otro__"?"":"display:none"}" class="field">
          <label>Nombre del ejercicio</label>
          <div class="ac-wrap">
            <input type="text" id="reg-other-name" maxlength="40" placeholder="Ej: Remo con barra" autocomplete="off">
            <div class="ac-list" id="reg-other-name-ac"></div>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Fecha</label>
            <input type="date" id="reg-date" value="${todayStr()}">
          </div>
          <div class="field">
            <label>Peso (kg)</label>
            <input type="number" id="reg-peso" step="0.5" min="0" placeholder="Ej: 40">
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Series</label>
            <input type="number" id="reg-series" min="1" max="20" placeholder="3">
          </div>
          <div class="field">
            <label>Reps</label>
            <input type="text" id="reg-reps" maxlength="12" placeholder="10">
          </div>
        </div>
        <div class="field">
          <label>Nota (opcional)</label>
          <input type="text" id="reg-nota" maxlength="60" placeholder="Ej: sentí bien la técnica">
        </div>
        <button class="btn btn-primary btn-block" id="btn-save-reg">${icon("plus")} Guardar registro</button>
      </div>

      ${forExercise ? `
        <div class="card">
          <div class="row between" style="margin-bottom:8px">
            <h3 style="font-size:15px; text-transform:none; letter-spacing:0; font-family:'Work Sans'">Progreso · ${esc(forExercise)}</h3>
          </div>
          ${spark}
        </div>
      ` : ""}

      ${(()=>{
        const filtered = filterHistory(historyAll);
        const hasFilter = !!(state.historyFilter.exercise || state.historyFilter.from || state.historyFilter.to);
        // Sin un ejercicio puntual filtrado, la lista se agrupa por ejercicio
        // (nombre + último peso + fecha) en vez de una lista plana enorme con
        // todo mezclado — pedido de Juan. Tocar un grupo lo despliega con el
        // historial completo de ESE ejercicio (mismo formato de fila que antes,
        // con el borrado de siempre). Filtrando por un ejercicio puntual la
        // vista vuelve a ser la lista plana simple (agrupar por uno solo no
        // aporta nada).
        const grouped = !state.historyFilter.exercise;
        let listHtml;
        if(filtered.length===0){
          listHtml = `<div class="card empty">${icon("log")}<h3>Sin registros para este filtro</h3><p>Probá cambiar el ejercicio o el rango de fechas.</p></div>`;
        } else if(grouped){
          const byExercise = {};
          // V34: se agrupa por nombre CANÓNICO, así los registros viejos y los
          // nuevos del mismo ejercicio caen en un solo grupo y el título que se
          // muestra es el nombre canónico actual.
          filtered.forEach(r=>{ const k = canonicalExerciseName(r.exercise); (byExercise[k]=byExercise[k]||[]).push(r); });
          const sortDesc = (a,b)=> a.date===b.date ? (b.createdAt||0)-(a.createdAt||0) : (a.date<b.date?1:-1);
          const groups = Object.keys(byExercise).map(name=>{
            const list = byExercise[name].slice().sort(sortDesc);
            return { name, list, last:list[0] };
          }).sort((a,b)=> sortDesc(a.last,b.last));
          listHtml = `<div class="loglist">

                ${isOpen ? g.list.slice(0,100).map(r=>`

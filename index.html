        }
      }
      // Igual que arriba: si no hay lugar ni sustitución, el subgrupo queda sin
      // cubrir antes que romper el tope.
    });

    applyFocusReplace(days, templ, focus, avoid, riskyExclude, edad);

    // Orden final de cada día: agrupado por músculo en bloques contiguos
    // (no saltar de pecho a tríceps y volver a pecho) y, dentro de cada
    // bloque, los ejercicios compuestos/multiarticulares primero y los de
    // aislamiento al final (los compuestos exigen más energía, van frescos
    // al principio) — pedido de Juan en v25. Los bloques respetan el orden
    // en que ya estaba armado dd.groups para ese día (las plantillas de
    // SPLIT_DAYS ya listan el grupo más importante primero, ej. "pecho"
    // antes que "tríceps" en un día de empuje), y cualquier ejercicio de un
    // subgrupo que no estaba en la plantilla del día (puede pasar por la red
    // de seguridad de cobertura semanal) va al final.
    days.forEach((day,i)=> reorderDayExercisesByGroup(day, templ[i].groups));

    return days;
  }

  // classifyFn (opcional, V29): permite ordenar por los 10 subgrupos de Día
  // Especial (exerciseSubgroup10). Sin ese parámetro el comportamiento es
  // exactamente el de siempre (exercisePrimarySubgroup) para la rutina automática.
  function reorderDayExercisesByGroup(day, templateGroups, classifyFn){
    const classify = classifyFn || exercisePrimarySubgroup;
    const byGroup = {};
    day.exercises.forEach(ex=>{
      const g = classify(ex.nombre) || "otros";
      (byGroup[g] = byGroup[g] || []).push(ex);
    });
    Object.keys(byGroup).forEach(g=>{
      byGroup[g].sort((a,b)=>{
        const ca = EXERCISES_COMPOUND.has(a.nombre) ? 0 : 1;
        const cb = EXERCISES_COMPOUND.has(b.nombre) ? 0 : 1;
        return ca - cb;
      });
    });
    const order = templateGroups.slice();
    Object.keys(byGroup).forEach(g=>{ if(order.indexOf(g)===-1) order.push(g); });
    const result = [];
    order.forEach(g=>{ if(byGroup[g]) result.push(...byGroup[g]); });
    day.exercises = result;
  }

  /* ================= V29: DÍA ESPECIAL — generación ================= */
  // Un entrenamiento de UN solo día, fuera de la rutina semanal (no se guarda
  // en rutinaSlots, no toca Mi rutina ni Rutina automática). Reutiliza los
  // mismos pools/selección/series que la rutina automática:
  // subgroupPools → pickForSubgroup → seriesForExercise → EXERCISES_COMPOUND
  // (orden compuesto primero). Para perfiles 50+ se sigue excluyendo
  // EXERCISES_RISKY_50PLUS, igual que en la rutina automática.
  // Tope de 8 ejercicios (mismo tope duro que pidió Juan para cualquier día).
  const SPECIAL_MAX_EXERCISES = 8;
  // Cantidad total según cuántos grupos se eligieron: 1 grupo → 4, 2 → 6,
  // 3 o más → 8. Se reparte parejo entre los grupos elegidos; con más de 8
  // grupos elegidos no todos entran en una sola generación (se rota al azar).
  function specialTargetCount(nGroups){
    return Math.min(SPECIAL_MAX_EXERCISES, Math.max(4, nGroups*3));
  }
  // Full Body: las dos variantes originales, tal cual se definieron (8
  // ejercicios cada una). "piernas" y "brazos" son grupos compuestos que se
  // expanden al generar (ver expandFullBodyParts) — no se agregan ejercicios
  // de más por existir ahora 10 subgrupos. Estructura en tabla para poder
  // sumar variantes nuevas más adelante sin tocar la lógica.
  const FULL_BODY_VARIANTS = {
    A: { label:"Full Body A", desc:"2 pecho · 2 espalda · 2 piernas · 1 brazos · 1 hombros",
         parts:[["pecho",2],["espalda",2],["piernas",2],["brazos",1],["hombros",1]] },
    B: { label:"Full Body B", desc:"3 piernas · 2 brazos · 2 espalda · 1 hombros",
         parts:[["piernas",3],["brazos",2],["espalda",2],["hombros",1]] },
  };
  // "piernas" N → N subgrupos de pierna DISTINTOS (elegidos al azar entre
  // cuádriceps/glúteos/isquiosurales/gemelos), 1 ejercicio de cada uno =
  // selección equilibrada sin repetir sub-foco. "brazos" N → alterna
  // bíceps/tríceps (1 → uno de los dos al azar; 2 → uno de cada uno).
  function expandFullBodyParts(parts){
    const out = [];
    parts.forEach(([g,n])=>{
      if(g==="piernas"){
        shuffleArr(LEG_SUBGROUPS10).slice(0,n).forEach(sg=> out.push([sg,1]));
        // si algún día se pidiera más de 4 piernas, el resto va a cuádriceps
        for(let i=4;i<n;i++) out.push(["cuadriceps",1]);
      } else if(g==="brazos"){
        const order = shuffleArr(["biceps","triceps"]);
        for(let i=0;i<n;i++) out.push([order[i%2],1]);
      } else out.push([g,n]);
    });
    // juntar repetidos (ej. dos veces "cuadriceps")
    const merged = {};
    const keys = [];
    out.forEach(([g,n])=>{ if(!(g in merged)){ merged[g]=0; keys.push(g); } merged[g]+=n; });
    return keys.map(g=>[g, merged[g]]);
  }
  // Reparto parejo de "total" entre los grupos elegidos, respetando cuántos
  // ejercicios DISTINTOS tiene cada pool (nunca pide más de los que hay, así
  // no se repiten ejercicios mientras existan alternativas).
  function distributeSpecialCount(groups, total, pools){
    const cap = {}; groups.forEach(g=> cap[g] = (pools[g]||[]).length);
    const counts = {}; groups.forEach(g=> counts[g]=0);
    const order = shuffleArr(groups);
    let left = total, progressed = true;
    while(left>0 && progressed){
      progressed = false;
      for(const g of order){
        if(left<=0) break;
        if(counts[g] < cap[g]){ counts[g]++; left--; progressed = true; }
      }
    }
    return groups.map(g=>[g, counts[g]]).filter(([,n])=>n>0);
  }
  function generateSpecialDay(groups, fullBodyKey){
    const edad = state.profile ? state.profile.edad : null;
    const riskyExclude = (edad!=null && edad>=50) ? EXERCISES_RISKY_50PLUS : null;
    const pools = subgroupPools(riskyExclude);
    let dist, nombre, templateOrder;
    if(groups && groups.length){
      const sel = SPECIAL_SUBGROUPS.filter(g=> groups.indexOf(g)!==-1);
      dist = distributeSpecialCount(sel, specialTargetCount(sel.length), pools);
      templateOrder = sel;
      nombre = "Día Especial — " + sel.map(g=>SPECIAL_SUBGROUP_LABELS[g]).join(" · ");
    } else {
      const v = FULL_BODY_VARIANTS[fullBodyKey] || FULL_BODY_VARIANTS.A;
      dist = expandFullBodyParts(v.parts);
      templateOrder = dist.map(([g])=>g);
      nombre = "Día Especial — " + v.label;
    }
    const avoid = new Set();
    const names = [];
    dist.forEach(([sg,count])=>{
      const picked = pickForSubgroup(sg, count, avoid, { riskyExclude });
      picked.forEach(n=>{ if(names.indexOf(n)===-1) names.push(n); });
    });
    const exercises = names.map(n=>({ id:uid(), nombre:n, series:String(seriesForExercise(n,edad)), reps:"10", notas:"", imagenUrl:"" }));
    const day = { id:uid(), nombre, exercises, isSpecial:true, specialGroups:(groups&&groups.length)?groups.slice():[], fullBody:(groups&&groups.length)?null:(fullBodyKey||"A") };
    reorderDayExercisesByGroup(day, templateOrder, exerciseSubgroup10);
    return day;
  }

  /* ================= V31: RUTINA AUTOMÁTICA ENFOCADA ==================
     Modalidad nueva, que NO reemplaza a Mi rutina, Rutina automática ni Día
     Especial. El usuario decide QUÉ entrena cada día (1 a 4 focos) y VodaFit
     decide CÓMO se arma ese día. Cada día se genera y se regenera por
     separado: regenerar el día 2 no toca los días 1, 3 ni 4.
     Reutiliza todo lo existente: los pools por principal (subgroupPools /
     legFocusPools), el sorteo ponderado único de V31 (predominancia × edad/
     equipamiento × diversidad de patrón), seriesForExercise y
     EXERCISES_RISKY_50PLUS. */
  const FOCUSED_GROUPS = ["pecho","espalda","hombros","biceps","triceps","cuadriceps","gluteos","isquios","aductores","gemelos","core"];
  const FOCUSED_GROUP_LABELS = {
    pecho:"Pecho", espalda:"Espalda", hombros:"Hombros", biceps:"Bíceps", triceps:"Tríceps",
    cuadriceps:"Cuádriceps", gluteos:"Glúteos", isquios:"Isquios", aductores:"Aductores",
    gemelos:"Gemelos", core:"Core",
  };
  // Los focos de pierna se resuelven por SUB-FOCO (legFocusPools, que ya está
  // construido con el principal de cada ejercicio); el resto por subgrupo.
  // Así un ejercicio nunca entra a un foco por ser su músculo secundario.
  const FOCUSED_LEG_FOCI = { cuadriceps:"quads", gluteos:"glutes", isquios:"hamstrings", aductores:"adductors", gemelos:"calves" };
  const FOCUSED_MIN_FOCI = 1;
  const FOCUSED_MAX_FOCI = 4;
  const FOCUSED_MIN_TOTAL = 3;
  const FOCUSED_HARD_MAX = 10;
  // §18: tope de ejercicios según cuántos focos se eligieron. Nunca más de 10.
  const FOCUSED_MAX_BY_FOCI = { 1:6, 2:8, 3:9, 4:10 };
  const FOCUSED_MIN_PER_FOCUS = 2;

  function focusedMaxExercises(nFoci){
    return Math.min(FOCUSED_HARD_MAX, FOCUSED_MAX_BY_FOCI[nFoci] || FOCUSED_HARD_MAX);
  }
  // Exclusión dura por edad que va a usar la generación. Se consulta también
  // al VALIDAR, para que la UI no habilite una combinación que después el
  // generador no pueda cumplir.
  function currentRiskyExclude(){
    const edad = state.profile ? state.profile.edad : null;
    return (edad!=null && edad>=50) ? EXERCISES_RISKY_50PLUS : null;
  }
  // Cuántos ejercicios PRINCIPALES tiene hoy este foco.
  function focusPoolSize(foco){
    return focusedPoolFor(foco, currentRiskyExclude()).length;
  }
  // ¿Puede este foco usarse como ÚNICO foco del día?
  // Solo si su pool principal llega al mínimo de ejercicios del día. Si no
  // llega, hay que combinarlo con otro foco: NO se completa con otros grupos,
  // no se promueven secundarios a protagonistas y no se inventa nada.
  // La regla es genérica (sale del tamaño del pool, no de una lista de
  // nombres), así que si mañana el foco suma ejercicios, se habilita solo.
  // Hoy el único caso es Aductores, con 1 ejercicio principal.
  function canFocusStandAlone(foco){
    return focusPoolSize(foco) >= FOCUSED_MIN_TOTAL;
  }
  function isValidFocusSelection(foci){
    if(!Array.isArray(foci)) return false;
    const uniq = Array.from(new Set(foci));
    if(uniq.length !== foci.length) return false;
    if(uniq.length < FOCUSED_MIN_FOCI || uniq.length > FOCUSED_MAX_FOCI) return false;
    if(!uniq.every(f=> FOCUSED_GROUPS.indexOf(f)!==-1)) return false;
    // Foco único: su pool tiene que alcanzar el mínimo por sí solo.
    if(uniq.length===1 && !canFocusStandAlone(uniq[0])) return false;
    return true;
  }
  // Pool ACTIVO de un foco, por principal.
  function focusedPoolFor(foco, riskyExclude){
    if(FOCUSED_LEG_FOCI[foco]) return (legFocusPools(riskyExclude)[FOCUSED_LEG_FOCI[foco]] || []).slice();
    return (subgroupPools(riskyExclude)[foco] || []).slice();
  }
  // Reparte el total entre los focos: primero el mínimo de 2 por foco (cuando
  // el pool alcanza), después ronda a ronda hasta llegar al total o agotar
  // candidatos. No es una división matemática rígida: el tope y la
  // disponibilidad mandan (§18).
  function distributeFocusedCount(foci, total, pools){
    const cap = {}; foci.forEach(f=> cap[f] = (pools[f]||[]).length);
    const counts = {}; foci.forEach(f=> counts[f] = 0);
    foci.forEach(f=>{
      const want = Math.min(FOCUSED_MIN_PER_FOCUS, cap[f]);
      counts[f] = Math.min(want, total - foci.reduce((a,k)=>a+counts[k],0));
      if(counts[f] < 0) counts[f] = 0;
    });
    let left = total - foci.reduce((a,f)=>a+counts[f],0);
    let progressed = true;
    while(left>0 && progressed){
      progressed = false;
      for(const f of foci){
        if(left<=0) break;
        if(counts[f] < cap[f]){ counts[f]++; left--; progressed = true; }
      }
    }
    return foci.map(f=>[f, counts[f]]).filter(([,n])=>n>0);
  }
  // ¿Los dos únicos focos son Bíceps + Tríceps? (§20 → 3 tríceps / 2 bíceps /
  // 1 antebrazo; el antebrazo no cuenta como tercer foco elegido).
  function isArmsOnlySelection(foci){
    return foci.length===2 && foci.indexOf("biceps")!==-1 && foci.indexOf("triceps")!==-1;
  }
  // Genera UN día enfocado. Devuelve null si la selección no es válida (§17:
  // 5 focos o más se rechaza, 0 focos también).
  function generateFocusedDay(foci, dayIndex){
    if(!isValidFocusSelection(foci)) return null;
    const sel = FOCUSED_GROUPS.filter(f=> foci.indexOf(f)!==-1); // orden estable
    const edad = state.profile ? state.profile.edad : null;
    // La exclusión dura de 50+ sigue siendo una regla independiente de la
    // ponderación por edad (§4): acá se sigue aplicando igual que siempre.
    const riskyExclude = (edad!=null && edad>=50) ? EXERCISES_RISKY_50PLUS : null;
    const avoid = new Set();
    const usedPatterns = new Set();
    let names = [];

    if(isArmsOnlySelection(sel)){
      names = pickArmsDayExercises(avoid, { edad, riskyExclude, usedPatterns });
    } else {
      const pools = {};
      sel.forEach(f=> pools[f] = focusedPoolFor(f, riskyExclude));
      const totalCap = sel.reduce((a,f)=> a + pools[f].length, 0);
      const target = Math.min(focusedMaxExercises(sel.length), totalCap);
      const dist = distributeFocusedCount(sel, target, pools);
      dist.forEach(([f,count])=>{
        const cands = pools[f].filter(n=> names.indexOf(n)===-1);
        // Orden conceptual §19: el pool ya garantiza "principal = foco"; el
        // sorteo ponderado aporta diversidad de patrón, predominancia y la
        // capa de edad/equipamiento, en ese orden.
        weightedPickMany(cands, count, { edad, usedPatterns }).forEach(n=>{
          if(names.indexOf(n)===-1){ names.push(n); avoid.add(n); }
        });
      });
    }

    names = Array.from(new Set(names)).slice(0, FOCUSED_HARD_MAX);
    if(!names.length) return null;
    const exercises = names.map(n=>({ id:uid(), nombre:n, series:String(seriesForExercise(n,edad)), reps:"10", notas:"", imagenUrl:"" }));
    const nombre = "Día " + ((dayIndex||0)+1) + " — " + sel.map(f=>FOCUSED_GROUP_LABELS[f]).join(" · ");
    const day = { id:uid(), nombre, exercises, focusedGroups: sel.slice() };
    // Orden dentro del día: compuestos primero dentro de cada foco, siguiendo
    // el orden en que el usuario eligió los focos.
    reorderDayExercisesByGroup(day, sel, (n)=>{
      for(const f of sel){
        if(FOCUSED_LEG_FOCI[f]){ if(exerciseLegFocus(n)===FOCUSED_LEG_FOCI[f]) return f; }
        else if(exercisePrimarySubgroup(n)===f) return f;
      }
      return null;
    });
    return day;
  }

  function openAutoRoutineModal(){
    let numDays = 3;
    let sexo = null; // se pide explícitamente antes de poder generar
    let focus = []; // hasta 3 grupos/músculos a priorizar, opcional (reemplaza ejercicios de otros grupos, no suma)
    let plan = null;
    const modalEl = openModal("", null);

    function bodyHtml(){
      const daysBtns = [1,2,3,4,5,6].map(n=>`<button class="btn btn-sm ${n===numDays?'btn-primary':'btn-ghost'}" data-days="${n}">${n}</button>`).join("");
      const sexoBtns = ["Femenino","Masculino"].map(s=>`<button class="btn btn-sm ${s===sexo?'btn-primary':'btn-ghost'}" data-sexo="${s}" style="flex:1">${s}</button>`).join("");
      const focusBtns = FOCUS_OPTIONS.map(key=>`<button class="btn btn-sm ${focus.indexOf(key)!==-1?'btn-primary':'btn-ghost'}" data-focus="${key}">${FOCUS_LABELS[key]}</button>`).join("");
      const edad = state.profile ? state.profile.edad : null;
      const [restLo,restHi] = restRangeForAge(edad);
      const seriesCompound = seriesForAge(edad);
      // V29: mismo cálculo que seriesForExercise (piso 3 en aislamiento) —
      // antes este texto usaba max(2,...) y mostraba "2" aunque el generador
      // real ya ponía 3 desde v28.
      const seriesAccessory = Math.max(3, seriesCompound-1);
      const previewHtml = plan ? `
        <p class="helptext">Series por ejercicio: <b>${seriesCompound}</b> en los compuestos (press, remo, sentadilla, peso muerto, dominadas, etc.) y <b>${seriesAccessory}</b> en los de aislamiento (curl, extensiones, elevaciones, gemelos, core, etc.)${edad!=null?` — según tu edad cargada, ${edad} años`:" — nivel intermedio, cargá tu edad en Perfil para ajustar esto"} · Descanso sugerido entre series: <b>${restLo}-${restHi} segundos</b>.</p>
        <div class="stack" style="max-height:260px; overflow-y:auto">
          ${plan.map(d=>`
            <div class="card" style="padding:10px">
              <b style="font-size:14px">${esc(d.nombre)}</b>
              <div class="helptext" style="margin-top:4px">${d.exercises.map(e=>esc(e.nombre)).join(" · ") || "Sin ejercicios disponibles para este día."}</div>
            </div>
          `).join("")}
        </div>
      ` : `<p class="helptext">Elegí sexo y días por semana. Vamos a armar una rutina completa (basada en splits reales — full body, empuje/tirón/pierna o torso/pierna según la frecuencia) combinando ejercicios compuestos y de aislamiento, que después podés revisar y editar como cualquier otra. Si tenés la edad cargada en tu Perfil, ajustamos series y elegimos variantes más cuidadas de las articulaciones cuando corresponde.</p>`;
      return `
        <h3>Rutina automática</h3>
        <div class="field">
          <label>Sexo</label>
          <div class="row" style="gap:8px">${sexoBtns}</div>
        </div>
        <div class="field">
          <label>Días por semana</label>
          <div class="autoroutine-daybtns">${daysBtns}</div>
        </div>
        <div class="field">
          <label>Enfoque (opcional, hasta 3) — reemplaza ejercicios de otros grupos por más de los que elijas, sin pasarse de la cantidad total del día</label>
          <div class="row" style="gap:6px; flex-wrap:wrap">${focusBtns}</div>
        </div>
        ${previewHtml}
        <div class="modal-actions">
          ${plan ? `
            <button class="btn btn-ghost" data-act="regen">${icon("shuffle")} Generar otra</button>
            <button class="btn btn-primary" data-act="use">Usar esta rutina</button>
          ` : `
            <button class="btn btn-ghost" data-act="cancel">Cancelar</button>
            <button class="btn btn-primary" data-act="gen" ${sexo?"":"disabled"}>Generar</button>
          `}
        </div>
      `;
    }

    function draw(){
      modalEl.innerHTML = bodyHtml();
      modalEl.querySelectorAll("[data-days]").forEach(b=>{
        b.onclick = ()=>{ numDays = parseInt(b.dataset.days,10); plan = null; draw(); };
      });
      modalEl.querySelectorAll("[data-sexo]").forEach(b=>{
        b.onclick = ()=>{ sexo = b.dataset.sexo; plan = null; draw(); };
      });
      modalEl.querySelectorAll("[data-focus]").forEach(b=>{
        b.onclick = ()=>{
          const key = b.dataset.focus;
          const idx = focus.indexOf(key);
          if(idx!==-1) focus.splice(idx,1);
          else if(focus.length<FOCUS_MAX_GROUPS) focus.push(key);
          // si ya hay 3 elegidos y toca un cuarto distinto, no hace nada
          // (el helptext del campo ya avisa "hasta 3") en vez de reemplazar
          // uno sin que quede claro cuál se sacó.
          plan = null; draw();
        };
      });
      const cancelBtn = modalEl.querySelector('[data-act="cancel"]');
      if(cancelBtn) cancelBtn.onclick = closeModal;
      const genBtn = modalEl.querySelector('[data-act="gen"]');
      if(genBtn) genBtn.onclick = ()=>{ if(!sexo) return; plan = generateAutoRoutine(numDays, sexo, focus); draw(); };
      const regenBtn = modalEl.querySelector('[data-act="regen"]');
      if(regenBtn) regenBtn.onclick = ()=>{ plan = generateAutoRoutine(numDays, sexo, focus); draw(); };
      const useBtn = modalEl.querySelector('[data-act="use"]');
      if(useBtn) useBtn.onclick = async ()=>{
        // La rutina automática SIEMPRE se guarda en su propia "ranura" separada
        // de la personalizada (desde v19) — así generarla nunca pisa la rutina
        // que el usuario armó a mano, y puede volver a ella cuando quiera.
        const apply = async ()=>{
          state.rutinaSlots.automatica = { days: plan };
          state.activeSlot = "automatica";
          state.rutina = state.rutinaSlots.automatica;
          await persistRutina();
          closeModal();
          state.tab = "rutina";
          renderScreen();
        };
        if((state.rutinaSlots.automatica.days||[]).length>0){
          const ok = await confirmDialog("Reemplazar rutina automática", "Ya tenías una rutina automática generada antes — ¿reemplazarla por esta? Tu rutina personalizada no se toca.", "Reemplazar");
          if(!ok) return;
        }
        await apply();
      };
    }
    draw();
  }

  /* ================= V29: DÍA ESPECIAL — pantalla de configuración ================= */
  // Mismo patrón de modal que la rutina automática. Elegir grupos (0 a 10);
  // con 0 grupos se ofrece explícitamente Full Body A/B. "Comenzar" arranca
  // la sesión de siempre (startSession con {special:true}) — no se guarda
  // nada en Mi rutina ni en Rutina automática.
  // Regla de Juan: Día Especial está disponible SIEMPRE — no depende del
  // objetivo semanal, del día, del progreso de la semana ni de si ya entrenó
  // hoy (ni de si ya hizo otro Día Especial). El botón se dibuja sin
  // condiciones en screenRutina. No agregar chequeos de fecha/progreso acá.
  // La única verificación es no pisar un entrenamiento que está EN CURSO
  // (la app maneja una sola sesión activa a la vez).
  /* ---- V31 §16: modal de Rutina automática enfocada ----
     A diferencia de la rutina automática, NO se genera toda la semana de una
     vez: el usuario elige cuántos días quiere y después, día por día, define
     los focos y genera ESE día. Regenerar un día no toca los demás. */
  function openFocusedRoutineModal(){
    const existing = ((state.rutinaSlots.enfocada||{}).days||[]);
    let numDays = existing.length || 3;
    // Estado de trabajo: un slot por día con sus focos y el día ya generado.
    let draft = [];
    for(let i=0;i<numDays;i++){
      const d = existing[i];
      draft.push({ foci: d && d.focusedGroups ? d.focusedGroups.slice() : [], day: d || null });
    }
    let openDay = 0;
    let warning = "";
    const modalEl = openModal("", null);

    function resizeDraft(n){
      if(n > draft.length){
        while(draft.length < n) draft.push({ foci:[], day:null });
      } else {
        draft = draft.slice(0, n); // conserva los días ya generados que siguen entrando
      }
      if(openDay >= draft.length) openDay = Math.max(0, draft.length-1);
    }

    function dayBlockHtml(i){
      const d = draft[i];
      const isOpen = i===openDay;
      const chips = FOCUSED_GROUPS.map(g=>{
        const on = d.foci.indexOf(g)!==-1;
        // §17: no se pueden marcar más de 4 focos.
        const full = !on && d.foci.length>=FOCUSED_MAX_FOCI;
        // Un foco que no alcanza el mínimo por sí solo se marca con "+" y se
        // explica en el tooltip: se puede elegir, pero hay que combinarlo.
        const solo = !canFocusStandAlone(g);
        const marca = solo ? `${FOCUSED_GROUP_LABELS[g]} +` : FOCUSED_GROUP_LABELS[g];
        const tip = solo ? ` title="Solo hay ${focusPoolSize(g)} ejercicio${focusPoolSize(g)===1?"":"s"} de ${FOCUSED_GROUP_LABELS[g]}: combinalo con otro foco."` : "";
        return `<button class="btn btn-sm ${on?'btn-primary':'btn-ghost'}" data-day="${i}" data-foco="${g}"${tip} ${full?'disabled style="opacity:.4"':''}>${marca}</button>`;
      }).join("");
      const gen = d.day;
      const summary = d.foci.length
        ? d.foci.map(g=>FOCUSED_GROUP_LABELS[g]).join(" · ")
        : "sin focos elegidos";
      const armsNote = isArmsOnlySelection(d.foci)
        ? `<p class="helptext">Bíceps + Tríceps: se arma con 3 de tríceps, 2 de bíceps y 1 de antebrazo.</p>` : "";
      // Foco único que no alcanza el mínimo: se explica qué falta y no se
      // deja generar, en vez de producir un día de 1 ejercicio.
      const soloBloqueado = d.foci.length===1 && !canFocusStandAlone(d.foci[0]);
      const soloNote = soloBloqueado
        ? `<p class="helptext" style="color:var(--danger)">${FOCUSED_GROUP_LABELS[d.foci[0]]} tiene ${focusPoolSize(d.foci[0])} ejercicio${focusPoolSize(d.foci[0])===1?"":"s"} y un día necesita al menos ${FOCUSED_MIN_TOTAL}. Agregá otro foco (por ejemplo Glúteos, Cuádriceps o Isquios) para poder generar este día.</p>` : "";
      const maxNote = (d.foci.length && !soloBloqueado)
        ? `<p class="helptext">${d.foci.length} foco${d.foci.length===1?"":"s"} · hasta ${focusedMaxExercises(d.foci.length)} ejercicios.</p>` : "";
      return `
        <div class="card" style="padding:10px; margin-bottom:8px">
          <div class="row between" data-daytoggle="${i}" style="cursor:pointer">
            <b style="font-size:14px">Día ${i+1}</b>
            <span class="helptext">${gen ? `${gen.exercises.length} ejercicios` : esc(summary)}</span>
          </div>
          ${isOpen ? `
            <div class="field" style="margin-top:8px">
              <label>Qué querés entrenar (1 a ${FOCUSED_MAX_FOCI})</label>
              <div class="special-grid">${chips}</div>
            </div>
            ${soloNote}${maxNote}${armsNote}
            ${gen ? `<div class="stack" style="gap:4px; margin-top:6px">${gen.exercises.map(e=>`
              <div class="row between" style="font-size:13.5px"><span>${esc(e.nombre)}</span><span class="helptext num">${esc(e.series)}×${esc(e.reps)}</span></div>`).join("")}</div>` : ""}
            <div class="row" style="gap:8px; margin-top:8px">
              <button class="btn btn-sm ${gen?'btn-ghost':'btn-primary'}" style="flex:1" data-gen="${i}" ${isValidFocusSelection(d.foci)?"":"disabled"}>
                ${icon("shuffle")} ${gen?"Regenerar este día":"Generar este día"}
              </button>
            </div>
          ` : ""}
        </div>`;
    }

    function bodyHtml(){
      const daysBtns = [1,2,3,4,5,6].map(n=>`<button class="btn btn-sm ${n===numDays?'btn-primary':'btn-ghost'}" data-days="${n}">${n}</button>`).join("");
      const generated = draft.filter(d=>d.day).length;
      return `
        <h3>Rutina automática enfocada</h3>
        <p class="helptext">Vos elegís qué entrenar cada día; VodaFit arma el día. Se genera día por día — regenerar uno no toca los demás. No reemplaza a Mi rutina, a la Rutina automática ni al Día Especial.</p>
        <div class="field">
          <label>Días por semana</label>
          <div class="row" style="gap:6px">${daysBtns}</div>
        </div>
        ${warning ? `<p class="helptext" style="color:var(--danger)">${esc(warning)}</p>` : ""}
        ${draft.map((_,i)=>dayBlockHtml(i)).join("")}
        <div class="modal-actions">
          <button class="btn btn-ghost" data-act="cancel">Cancelar</button>
          <button class="btn btn-primary" data-act="save" ${generated?"":"disabled"}>Guardar rutina enfocada</button>
        </div>
      `;
    }

    function draw(){
      modalEl.innerHTML = bodyHtml();
      modalEl.querySelectorAll("[data-days]").forEach(b=>{
        b.onclick = ()=>{ numDays = parseInt(b.dataset.days,10); resizeDraft(numDays); warning=""; draw(); };
      });
      modalEl.querySelectorAll("[data-daytoggle]").forEach(b=>{
        b.onclick = ()=>{ openDay = parseInt(b.dataset.daytoggle,10); draw(); };
      });
      modalEl.querySelectorAll("[data-foco]").forEach(b=>{
        b.onclick = ()=>{
          const i = parseInt(b.dataset.day,10);
          const g = b.dataset.foco;
          const d = draft[i];
          const at = d.foci.indexOf(g);
          if(at===-1){
            if(d.foci.length>=FOCUSED_MAX_FOCI){ warning = "Máximo " + FOCUSED_MAX_FOCI + " focos por día."; draw(); return; }
            d.foci.push(g);
          } else d.foci.splice(at,1);
          d.day = null; // cambiar los focos invalida lo generado para ESE día
          warning = "";
          draw();
        };
      });
      modalEl.querySelectorAll("[data-gen]").forEach(b=>{
        b.onclick = ()=>{
          const i = parseInt(b.dataset.gen,10);
          const d = draft[i];
          const generated = generateFocusedDay(d.foci, i);
          if(!generated){ warning = "Esa combinación de focos no es válida (1 a " + FOCUSED_MAX_FOCI + " focos)."; draw(); return; }
          d.day = generated;
          warning = "";
          draw();
        };
      });
      const cancel = modalEl.querySelector('[data-act="cancel"]');
      if(cancel) cancel.onclick = closeModal;
      const save = modalEl.querySelector('[data-act="save"]');
      if(save) save.onclick = async ()=>{
        const days = draft.filter(d=>d.day).map(d=>d.day);
        if(!days.length) return;
        state.rutinaSlots.enfocada = { days };
        state.activeSlot = "enfocada";
        state.rutina = state.rutinaSlots.enfocada;
        await persistRutina();
        closeModal();
        renderScreen();
      };
    }
    draw();
  }

  function openSpecialDayModal(){
    if(state.session){
      // No se pisa un entrenamiento en curso (normal o especial).
      const m = openModal(`
        <h3>Día Especial</h3>
        <p class="helptext" style="font-size:14px; color:var(--text)">Ya tenés un entrenamiento en curso (${esc(state.session.dayNombre||"")}). Finalizalo o cancelalo antes de empezar un Día Especial.</p>
        <div class="modal-actions"><button class="btn btn-primary btn-block" data-act="ok">Entendido</button></div>
      `);
      m.querySelector('[data-act="ok"]').onclick = closeModal;
      return;
    }
    let groups = [];
    let fullBody = "A";
    let plan = null;
    const modalEl = openModal("", null);

    function bodyHtml(){
      const chips = SPECIAL_SUBGROUPS.map(g=>`<button class="btn btn-sm ${groups.indexOf(g)!==-1?'btn-primary':'btn-ghost'}" data-sgroup="${g}">${SPECIAL_SUBGROUP_LABELS[g]}</button>`).join("");
      const fbBtns = Object.keys(FULL_BODY_VARIANTS).map(k=>`<button class="btn btn-sm ${k===fullBody?'btn-primary':'btn-ghost'}" data-fb="${k}" style="flex:1; flex-direction:column; gap:2px; height:auto; padding:8px 6px"><b>${FULL_BODY_VARIANTS[k].label}</b><span style="font-size:11px; font-weight:500; opacity:.85">${FULL_BODY_VARIANTS[k].desc}</span></button>`).join("");
      const fbBlock = groups.length===0 ? `
        <div class="field">
          <label>No elegiste grupos — Full Body</label>
          <div class="row" style="gap:8px">${fbBtns}</div>
        </div>` : `
        <p class="helptext">${groups.length} grupo${groups.length===1?"":"s"} elegido${groups.length===1?"":"s"} · ${specialTargetCount(groups.length)} ejercicios como máximo${groups.length>SPECIAL_MAX_EXERCISES?" (con más de 8 grupos no entran todos: se rota al azar en cada generación)":""}.</p>`;
      const previewHtml = plan ? `
        <div class="card" style="padding:10px">
          <b style="font-size:14px">${esc(plan.nombre)}</b>
          ${plan.exercises.length ? `<div class="stack" style="gap:4px; margin-top:6px">${plan.exercises.map(e=>`
            <div class="row between" style="font-size:13.5px"><span>${esc(e.nombre)}</span><span class="helptext num">${esc(e.series)}×${esc(e.reps)}</span></div>`).join("")}</div>`
            : `<div class="helptext" style="margin-top:4px">No hay ejercicios disponibles para esa selección.</div>`}
        </div>` : "";
      return `
        <h3>Día Especial</h3>
        <p class="helptext">Un entrenamiento extra de un solo día, aparte de tu rutina semanal. Queda en tu historial y calendario, pero no suma al objetivo semanal. Tu rutina no se modifica.</p>
        <div class="field">
          <label>Grupos a priorizar (opcional)</label>
          <div class="special-grid">${chips}</div>
        </div>
        ${fbBlock}
        ${previewHtml}
        <div class="modal-actions">
          ${plan ? `
            <button class="btn btn-ghost" data-act="regen">${icon("shuffle")} Generar otro</button>
            <button class="btn btn-primary" data-act="start" ${plan.exercises.length?"":"disabled"}>${icon("play")} Comenzar</button>
          ` : `
            <button class="btn btn-ghost" data-act="cancel">Cancelar</button>
            <button class="btn btn-primary" data-act="gen">Generar Día Especial</button>
          `}
        </div>
      `;
    }
    function draw(){
      modalEl.innerHTML = bodyHtml();
      modalEl.querySelectorAll("[data-sgroup]").forEach(b=>{
        b.onclick = ()=>{
          const g = b.dataset.sgroup;
          const i = groups.indexOf(g);
          if(i===-1) groups.push(g); else groups.splice(i,1);
          plan = null; draw();
        };
      });
      modalEl.querySelectorAll("[data-fb]").forEach(b=>{
        b.onclick = ()=>{ fullBody = b.dataset.fb; plan = null; draw(); };
      });
      const cancelBtn = modalEl.querySelector('[data-act="cancel"]');
      if(cancelBtn) cancelBtn.onclick = closeModal;
      const genBtn = modalEl.querySelector('[data-act="gen"]');
      if(genBtn) genBtn.onclick = ()=>{ plan = generateSpecialDay(groups, fullBody); draw(); };
      const regenBtn = modalEl.querySelector('[data-act="regen"]');
      if(regenBtn) regenBtn.onclick = ()=>{ plan = generateSpecialDay(groups, fullBody); draw(); };
      const startBtn = modalEl.querySelector('[data-act="start"]');
      if(startBtn) startBtn.onclick = ()=>{
        if(!plan || !plan.exercises.length) return;
        closeModal();
        startSession(plan, { special:true });
        window.scrollTo(0,0); // arrancar arriba, donde está el aviso "Día Especial"
      };
    }
    draw();
  }

  /* ================= CALENDARIO ================= */
  function currentCalMonth(){
    if(!state.calMonth){ const d=new Date(); state.calMonth = { y:d.getFullYear(), m:d.getMonth() }; }
    return state.calMonth;
  }

  const MONTH_NAMES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

  // V30: el origen visual se deriva solo de datos persistidos en `entrenos`.
  // Una fila normal histórica sin routine_origin queda explícitamente como
  // desconocida; nunca se infiere desde day_id, day_nombre ni la rutina actual.
  const CALENDAR_ORIGIN_LABELS = {
    personalizada:"Mi rutina", automatica:"Rutina automática", enfocada:"Rutina enfocada",
    especial:"Día Especial", manual:"Marcado manual", unknown:"Origen desconocido",
  };
  function calendarOriginFor(entreno){
    if(entreno.isManual) return "manual";
    if(entreno.isSpecial || entreno.routineOrigin==="especial") return "especial";
    if(entreno.routineOrigin==="personalizada") return "personalizada";
    if(entreno.routineOrigin==="automatica") return "automatica";
    // V31: origen propio — la rutina enfocada NO se esconde dentro de
    // "automatica", se distingue en el calendario como una modalidad más.
    if(entreno.routineOrigin==="enfocada") return "enfocada";
    return "unknown";
  }
  function calendarOriginsFor(entrenos){
    return Array.from(new Set((entrenos||[]).map(calendarOriginFor)));
  }
  function calendarOriginLabelHtml(origin){
    return `<span class="calendar-origin-label ${origin}">${CALENDAR_ORIGIN_LABELS[origin]||CALENDAR_ORIGIN_LABELS.unknown}</span>`;
  }
  function calendarOriginBarsHtml(origins){
    return `<span class="cal-origin-bars" aria-hidden="true">${origins.map(origin=>`<span class="cal-origin-bar ${origin}"></span>`).join("")}</span>`;
  }
  function calendarLegendHtml(){
    const origins = ["personalizada","automatica","enfocada","especial","manual","unknown"];
    return `<div class="cal-legend" aria-label="Leyenda de origen del entrenamiento">${origins.map(origin=>`<span class="cal-legend-item"><span class="cal-legend-dot ${origin}"></span>${CALENDAR_ORIGIN_LABELS[origin]}</span>`).join("")}</div>`;
  }

  function screenCalendario(){
    const { y, m } = currentCalMonth();
    const doneByDate = {};
    (state.entrenos||[]).forEach(e=>{ if(!e.date) return; (doneByDate[e.date] = doneByDate[e.date]||[]).push(e); });
    const first = new Date(y,m,1);
    const daysInMonth = new Date(y,m+1,0).getDate();
    const startOffset = (first.getDay()+6)%7; // 0=lunes
    const todayS = todayStr();
    const cells = [];
    for(let i=0;i<startOffset;i++) cells.push(`<div class="cal-cell empty"></div>`);
    for(let d=1; d<=daysInMonth; d++){
      const dateStr = `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      const done = doneByDate[dateStr];
      const isToday = dateStr===todayS;
      const origins = done ? calendarOriginsFor(done) : [];
      const originClass = origins.length===1 ? `cal-origin-${origins[0]}` : (origins.length>1 ? "cal-origin-mixed" : "");
      // V28: antes solo los días ya marcados eran clickeables. Ahora CUALQUIER
      // día de hoy hacia atrás es clickeable — si está vacío, tocarlo ofrece
      // "marcar como entrenado" (openMarkTrainedModal); si ya tiene registros,
      // muestra el detalle de siempre. Los días futuros quedan sin marcar
      // (no tiene sentido registrar un entrenamiento que todavía no pasó).
      const clickable = !!done || dateStr<=todayS;
      cells.push(`<div class="cal-cell ${done?"done":""} ${originClass} ${isToday?"today":""}" ${clickable?`data-cal-day="${dateStr}"`:""}>${d}${origins.length?calendarOriginBarsHtml(origins):""}</div>`);
    }
    const monthCount = Object.keys(doneByDate).filter(k=>k.startsWith(`${y}-${String(m+1).padStart(2,"0")}`)).length;
    return `
      <div class="section-title"><h2>Calendario</h2></div>
      <div class="card stack">
        <div class="row between">
          <span class="iconbtn" id="cal-prev">${icon("chevronLeft")}</span>
          <b style="font-size:16px">${MONTH_NAMES[m]} ${y}</b>
          <span class="iconbtn" id="cal-next">${icon("chevronRight")}</span>
        </div>
        <div class="cal-grid">
          ${["L","M","X","J","V","S","D"].map(w=>`<div class="cal-weekday">${w}</div>`).join("")}
          ${cells.join("")}
        </div>
        ${calendarLegendHtml()}
        <p class="helptext">${monthCount} entrenamiento${monthCount===1?"":"s"} este mes. Tocá un día para ver el detalle o marcarlo como entrenado.</p>
      </div>
    `;
  }

  function mountCalendario(){
    const el = document.getElementById("screen");
    const prevBtn = el.querySelector("#cal-prev");
    const nextBtn = el.querySelector("#cal-next");
    if(prevBtn) prevBtn.onclick = ()=>{ const c=currentCalMonth(); c.m--; if(c.m<0){c.m=11;c.y--;} renderScreen(); };
    if(nextBtn) nextBtn.onclick = ()=>{ const c=currentCalMonth(); c.m++; if(c.m>11){c.m=0;c.y++;} renderScreen(); };
    el.querySelectorAll("[data-cal-day]").forEach(cell=>{
      cell.onclick = ()=>{
        openCalDayModal(cell.dataset.calDay);
      };
    });
  }

  function openCalDayModal(date){
    const list = (state.entrenos||[]).filter(e=>e.date===date);
    // V28: un día sin entrenamientos ya no se ignora — se ofrece marcarlo
    // manualmente como entrenado (ver openMarkTrainedModal). Esto también
    // cubre el caso de borrar el último registro de un día: al reabrir ya no
    // hay nada que listar, así que directamente pasa a ofrecer marcarlo.
    if(list.length===0){ openMarkTrainedModal(date); return; }
    const m = openModal(`
      <h3>${esc(fmtDate(date))}</h3>
      <div class="loglist">
        ${list.map(e=>`
          <div class="logrow">
            <div>
              <div class="lex">${esc(e.dayNombre||"Entrenamiento")}</div>
              <div class="ldate">${calendarOriginLabelHtml(calendarOriginFor(e))}${calendarOriginFor(e)==="especial" ? " · no suma al objetivo semanal" : ""}</div>
              <div class="helptext">${sessionDurationText(e)}</div>
              ${e.sessionId?`<button class="btn btn-ghost" data-view-native-session="${esc(e.id)}">Ver series</button>`:''}
            </div>
            <div class="row" style="gap:8px; align-items:center">
              ${e.isManual
                ? `<div class="lsub">Sin detalle de series</div>`
                : `<div><div class="lval num">${e.setsCompletados}/${e.setsTotales}</div><div class="lsub">series</div></div>`}
              <span class="iconbtn danger" data-del-entreno="${e.id}" title="Borrar (marcado por error)">${icon("trash")}</span>
            </div>
          </div>
        `).join("")}
      </div>
      <p class="helptext">Si finalizaste un entrenamiento por error, tocá el tacho para borrarlo — no va a contar en la racha ni en el calendario.</p>
      <div class="modal-actions"><button class="btn btn-primary btn-block" data-act="ok">Cerrar</button></div>
    `);
    m.querySelectorAll('[data-view-native-session]').forEach(btn=>btn.onclick=async()=>{
      const entry=list.find(e=>e.id===btn.dataset.viewNativeSession),owner=state.profile?.id,generation=authLoadGeneration;
      if(!entry || !owner) return;
      btn.disabled=true;
      try {
        const rows=await Store.listSessionRegistros(owner,entry.id);
        if(generation!==authLoadGeneration || state.profile?.id!==owner || !m.isConnected) return;
        if(rows.length!==entry.setsCompletados) throw Error('El detalle cambió; recargá el historial');
        const detail=openModal(`<h3>${esc(entry.dayNombre||"Entrenamiento")}</h3><p class="helptext">${esc(fmtDate(entry.date))} · ${sessionDurationText(entry)}</p>${nativeHistoryRowsHtml(rows)}<div class="modal-actions"><button class="btn btn-primary" data-session-back>Volver</button></div>`);
        detail.querySelector('[data-session-back]').onclick=()=>openCalDayModal(date);
      }catch(error){if(generation===authLoadGeneration && state.profile?.id===owner && m.isConnected){btn.disabled=false;showToast("No se pudo cargar el detalle de esta sesión. Reintentá con conexión.");}}
    });
    m.querySelectorAll("[data-del-entreno]").forEach(btn=>{
      btn.onclick = async ()=>{
        const id = btn.dataset.delEntreno;
        const nativeEntry=list.find(e=>e.id===id && e.sessionId),owner=state.profile.id,generation=authLoadGeneration;
        const ok = await confirmDialog("Borrar entrenamiento", nativeEntry?"Se eliminará esta sesión y todas sus series vinculadas. No se puede deshacer.":"¿Seguro que querés borrar este registro? No se puede deshacer.", "Borrar");
        if(!ok){ openCalDayModal(date); return; } // reabre el modal (confirmDialog lo cerró)
        if(nativeEntry){
          if(generation!==authLoadGeneration || state.profile?.id!==owner) return;
          const result=await nativeReconciler.remove(owner,rutinaSync.getContext()?.base,nativeEntry.sessionId,navigator.onLine!==false);
          if(generation!==authLoadGeneration || state.profile?.id!==owner) return;
          if(result.ok){closeModal();await applyNativeTerminalResult(result,owner,generation);}
          else showToast("Eliminación pendiente ("+result.code+"). No se confirmó ningún cambio local.");
          return;
        }
        if(generation!==authLoadGeneration || state.profile?.id!==owner)return;
        let okDel;try{okDel=await Store.deleteEntreno(owner,id);}catch(error){okDel=false;}
        if(generation!==authLoadGeneration || state.profile?.id!==owner)return;
        if(okDel){
          await Store.historyCompat.acknowledge(owner,Store.historyStatus()).catch(()=>{});
          if(generation!==authLoadGeneration || state.profile?.id!==owner)return;
          state.entrenos = (state.entrenos||[]).filter(e=>e.id!==id);
          closeModal();
          openCalDayModal(date);
        } else {
          showHistoryFailure();openCalDayModal(date);
        }
      };
    });
    m.querySelector('[data-act="ok"]').onclick = closeModal;
  }

  function sessionDurationText(entry){
    if(!entry.sessionId || !Number.isSafeInteger(entry.durationMs) || entry.durationMs<0) return "Sin duración medida";
    const seconds=Math.floor(entry.durationMs/1000),h=Math.floor(seconds/3600),m=Math.floor(seconds/60)%60,s=seconds%60;
    const duration=[h,m,s].map(n=>String(n).padStart(2,'0')).join(':');
    let hours='';
    try {const f=new Intl.DateTimeFormat('es',{timeZone:entry.timezone,hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
      hours=` · ${f.format(new Date(entry.startedAt))}–${f.format(new Date(entry.endedAt))} (${entry.timezone})`;
    }catch{}
    return esc('Duración: '+duration+hours);
  }
  function nativeHistoryRowsHtml(rows){
    const groups=new Map();
    for(const r of rows){const key=r.exerciseInstance||r.exercise;if(!groups.has(key)) groups.set(key,[]);groups.get(key).push(r);}
    return Array.from(groups.values(),group=>`<div class="card stack"><b>${esc(group[0].exercise)}</b>${group.sort((a,b)=>a.setNumber-b.setNumber).map(r=>`<div class="row between"><span>Serie ${esc(r.setNumber)}</span><span class="num">${esc(r.peso)} kg × ${esc(r.reps)}</span></div>`).join('')}</div>`).join('') || '<p class="helptext">No se completaron series.</p>';
  }

  // V28: marcar manualmente "entrené este día" desde un día vacío del
  // calendario — sin inventar series, pesos ni ejercicios (queda un registro
  // en `entrenos` con sets en 0 y `isManual:true`, ver Store.addEntreno).
  // Cuenta para la racha y la meta semanal igual que cualquier entrenamiento
  // (computeRacha ya usa solo `e.date`, no distingue el origen), y se puede
  // borrar como cualquier otro desde el mismo modal de detalle del día.
  function openMarkTrainedModal(date){
    const owner=state.profile.id,generation=authLoadGeneration;
    let confirmedMark=null;
    const markId=crypto.randomUUID?.();
    const m = openModal(`
      <h3>${esc(fmtDate(date))}</h3>
      <p class="helptext" style="font-size:14px; color:var(--text)">¿Marcar este día como entrenado? No se van a inventar series, pesos ni ejercicios — solo queda anotado que entrenaste, y cuenta para tu racha y tu meta semanal.</p>
      <div class="field">
        <label>Nota (opcional)</label>
        <input type="text" id="calmark-nota" maxlength="40" placeholder="Ej: entrené en casa">
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" data-act="cancel">Cancelar</button>
        <button class="btn btn-primary" data-act="ok">Marcar como entrenado</button>
      </div>
    `);
    m.querySelector('[data-act="cancel"]').onclick = closeModal;
    m.querySelector('[data-act="ok"]').onclick = async ()=>{
      const btn = m.querySelector('[data-act="ok"]');
      if(btn.disabled || state.profile?.id!==owner || generation!==authLoadGeneration)return; // doble tap/cambio de cuenta
      btn.disabled = true;
      const nota = m.querySelector("#calmark-nota").value.trim();
      const data = { id:markId, date, dayId: null, dayNombre: nota || "Entrenamiento (marcado manualmente)", setsCompletados: 0, setsTotales: 0, createdAt: Date.now(), isManual: true };
      if(confirmedMark && confirmedMark.name!==data.dayNombre){btn.disabled=false;showToast("El día ya se confirmó. Actualizá el historial antes de cambiar la nota.");return;}
      let result;try{result=confirmedMark?.result || await Store.addEntreno(owner,data);}catch(error){result={ok:false,error};}
      if(result?.ok)confirmedMark={name:data.dayNombre,result};
      if(state.profile?.id!==owner || generation!==authLoadGeneration)return;
      if(!result?.ok){btn.disabled=false;showHistoryFailure(result);return;}
      if(!await refreshHistoryAfterWrite(owner,generation,"entrenos",result)){btn.disabled=false;return;}
      closeModal();renderScreen();showToast("Día marcado como entrenado");
    };
  }

  /* ================= EXPLORADOR POR GRUPO MUSCULAR ================= */
  function renderExplorer(){

  function screenExplorerGroups(){
    const pools = muscleGroupPools();
    return `
      <p class="helptext">Elegí un grupo muscular para ver todos los ejercicios disponibles, con foto y técnica.</p>
      <div class="wrap">

  // V29.2: dentro de "Piernas", el explorador permite filtrar por subgrupo.
  // Solo navegación/filtrado: usa la clasificación que ya existe
  // (exerciseLegFocus = región de mayor intensidad en MUSCLE_MAP), no cambia
  // la clasificación principal ni la lógica de Rutina automática/Día Especial.
  const EXPLORER_LEG_SUBGROUPS = [
    ["quads","Cuádriceps"], ["glutes","Glúteos"], ["hamstrings","Isquiosurales"], ["calves","Gemelos"], ["adductors","Aductores"],
  ];
  // V31: Brazos se explora por sus tres subgrupos. NO es un grupo principal
  // nuevo — "Brazos" sigue siendo uno solo de los 6 grupos visuales; esto es
  // únicamente el filtro de presentación del Explorador, igual que el que ya
  // tenía Piernas. La clasificación sale de exercisePrimarySubgroup, que ya
  // devuelve biceps/triceps/antebrazo: no se define acá ninguna taxonomía
  // paralela.
  const EXPLORER_ARM_SUBGROUPS = [
    ["biceps","Bíceps"], ["triceps","Tríceps"], ["antebrazo","Antebrazo"],
  ];
  // Un solo mecanismo de sub-filtros para todo el Explorador: qué grupos
  // tienen sub-filtro, cómo se clasifica cada ejercicio dentro de ese grupo y
  // qué opciones se muestran. Agregar un grupo más es agregar una fila acá.
  const EXPLORER_SUBFILTERS = {
    "Piernas": { classify: exerciseLegFocus, options: EXPLORER_LEG_SUBGROUPS },
    "Brazos":  { classify: exercisePrimarySubgroup, options: EXPLORER_ARM_SUBGROUPS },
  };
  // Sub-filtro efectivo de un grupo: solo vale para el grupo que lo declara,
  // así venir de "Piernas · Cuádriceps" y entrar a Brazos no arrastra la
  // selección vieja.
  function explorerSubFor(group){
    const f = EXPLORER_SUBFILTERS[group];
    if(!f || !state.explorerSub) return null;
    return f.options.some(o=>o[0]===state.explorerSub) ? state.explorerSub : null;
  }
  // Ejercicios de `group` que caen en el sub-filtro `sub` (sub null = todos).
  // ÚNICA vía de filtrado del Explorador: la usa la pantalla y la usan los
  // tests, así que lo que se valida es exactamente lo que ve el usuario.
  function explorerNamesFor(group, sub){
    const all = (muscleGroupPools()[group] || []);
    const f = EXPLORER_SUBFILTERS[group];
    if(!f || !sub) return all;
    return all.filter(n=> f.classify(n)===sub);
  }
  function screenExplorerList(group){
    const all = muscleGroupPools()[group] || [];
    const filter = EXPLORER_SUBFILTERS[group] || null;
    const sub = explorerSubFor(group);
    const names = explorerNamesFor(group, sub);
    let subChips = "";
    if(filter){
      const countOf = f => all.filter(n=> filter.classify(n)===f).length;
      subChips = `
        <div class="row explorer-subs" style="gap:6px; flex-wrap:wrap; margin-bottom:10px">
          <button class="btn btn-sm ${!sub?'btn-primary':'btn-ghost'}" data-sub="">Todos (${all.length})</button>
          ${filter.options.map(([f,label])=>`<button class="btn btn-sm ${sub===f?'btn-primary':'btn-ghost'}" data-sub="${f}">${label} (${countOf(f)})</button>`).join("")}
        </div>`;
    }
    const subLabel = (filter && sub) ? (filter.options.find(x=>x[0]===sub)||[])[1] : null;
    return `
      <div class="section-title"><h2>${esc(group)}${subLabel?` · ${esc(subLabel)}`:""}</h2><span class="muted">${names.length} ejercicio${names.length===1?"":"s"}</span></div>
      ${subChips}
      <div class="exlist">
        ${names.map(n=>`
          <div class="exrow" data-ex-explore="${esc(n)}" style="cursor:pointer">
            <div class="row" style="gap:10px; min-width:0">
              ${exerciseThumbHtml({nombre:n}, "width:32px;height:77px;flex:none", "width:56px;height:72px;flex:none")}
              <div class="exname">${esc(n)}</div>
            </div>
            <span class="iconbtn" style="pointer-events:none">${icon("info")}</span>
          </div>
        `).join("")}
      </div>
    `;
  }

  /* ================= V46: BIBLIOTECA DE ESTIRAMIENTOS ================= */
  // Una sola fuente para los dos accesos: la biblioteca de Perfil y las
  // recomendaciones del modal leen el MISMO array ESTIRAMIENTOS. No hay una
  // segunda lista ni un subconjunto "recomendable".
  function estiramientosFiltrados(){
    const q = normalizeSearch(state.estiramientosQuery);
    const g = state.estiramientosGrupo;
    return ESTIRAMIENTOS.filter(function(e){
      if(g && estiramientoGrupo(e) !== g) return false;
      if(!q) return true;
      return normalizeSearch(e.nombre + " " + estiramientoZona(e)).indexOf(q) !== -1;
    });
  }
  // Grupos que realmente tienen fichas: se derivan de la biblioteca, así que
  // agregar una ficha de un grupo nuevo no exige tocar los filtros.
  function estiramientoGruposDisponibles(){
    return MUSCLE_GROUPS.filter(function(g){
      return ESTIRAMIENTOS.some(function(e){ return estiramientoGrupo(e)===g; });
    });
  }
  function estiramientosChipsHtml(){
    const g = state.estiramientosGrupo;
    const countOf = function(x){ return ESTIRAMIENTOS.filter(function(e){ return estiramientoGrupo(e)===x; }).length; };
    return [
      '<button class="btn btn-sm ' + (!g?"btn-primary":"btn-ghost") + '" data-estir-grupo="">Todos (' + ESTIRAMIENTOS.length + ')</button>'
    ].concat(estiramientoGruposDisponibles().map(function(x){
      return '<button class="btn btn-sm ' + (g===x?"btn-primary":"btn-ghost") + '" data-estir-grupo="' + esc(x) + '">' + esc(x) + ' (' + countOf(x) + ')</button>';
    })).join("");
  }
  // Fila de la biblioteca. La ficha completa (instrucciones) se abre acá mismo
  // al tocar la fila: no hay una tercera pantalla.
  // `scope` separa la fila del bloque de sugeridos de la de la biblioteca: la
  // misma ficha aparece en los dos y cada uno abre y cierra por su cuenta.
  //
  // V46.2: la fila lleva un control VISIBLE ("Cómo se hace" + chevron). Antes
  // el único indicio era un ícono info con pointer-events:none, que se leía
  // como una insignia decorativa y no como algo que se pudiera tocar: las
  // instrucciones existían desde V46 pero quedaban invisibles en producción.
  function estiramientoRowHtml(e, abierto, scope){
    const attr = scope==="sug" ? "data-estir-sugfila" : "data-estir";
    return '' +
      '<div class="exrow" ' + attr + '="' + esc(e.id) + '" style="cursor:pointer; flex-direction:column; align-items:stretch; gap:8px">' +
        '<div class="row" style="justify-content:space-between; gap:10px; align-items:flex-start">' +
          '<div style="min-width:0">' +
            '<div class="exname">' + esc(e.nombre) + '</div>' +
            '<div class="helptext">' + esc(estiramientoZona(e)) + ' · ' + esc(e.duracion) + (e.tipo==="movilidad" ? ' · movilidad' : '') + '</div>' +
          '</div>' +
          '<span class="row" style="gap:4px; align-items:center; flex:none; pointer-events:none">' +
            '<span class="helptext" style="font-size:12px; color:var(--accent); white-space:nowrap">Cómo se hace</span>' +
            '<span class="iconbtn" style="transform:rotate(' + (abierto?"180":"0") + 'deg)">' + icon("chevronDown") + '</span>' +
          '</span>' +
        '</div>' +
        (abierto ? estiramientoPasosHtml(e) : '') +
      '</div>';
  }
  // V46.2: las instrucciones se leen de pie y entre series, asi que van en tres
  // pasos cortos y rotulados (posicion inicial / movimiento / precaucion) en vez
  // del parrafo corrido que tenian en V46.
  function estiramientoPasosHtml(e){
    const paso = function(rotulo, texto){
      return '<div style="margin-top:6px">' +
        '<div class="helptext" style="font-size:11.5px; text-transform:uppercase; letter-spacing:.04em">' + esc(rotulo) + '</div>' +
        '<div class="helptext" style="color:var(--text); line-height:1.5">' + esc(texto) + '</div>' +
      '</div>';
    };
    return '<div style="border-top:1px solid var(--border); padding-top:4px">' +
      paso("Posición inicial", e.inicio) +
      paso("Movimiento", e.movimiento) +
      paso("Precaución", e.cuidado) +
    '</div>';
  }
  // Qué ficha está abierta en una lista. `null` = nadie eligió todavía, así que
  // se abre la PRIMERA: el usuario ve de entrada que la ficha tiene contenido
  // adentro. La cadena vacía es "el usuario cerró a propósito", y por eso no se
  // puede usar null para las dos cosas.
  function estiramientoAbiertoId(lista, sel){
    if(sel === null || sel === undefined) return lista.length ? lista[0].id : null;
    return sel || null;
  }
  function estiramientosListaHtml(){
    const lista = estiramientosFiltrados();
    if(!lista.length) return '<p class="helptext" style="padding:10px 0">Ningún estiramiento coincide con estos filtros.</p>';
    const abierto = estiramientoAbiertoId(lista, state.estiramientoSel);
    return lista.map(function(e){ return estiramientoRowHtml(e, abierto===e.id); }).join("");
  }
  // Fichas sugeridas en el ultimo entrenamiento finalizado, resueltas desde los
  // ids guardados. Si alguna ya no existe (una ficha borrada en otra version),
  // se descarta sin romper nada.
  function estiramientosSugeridosDeSesion(){
    return (state.estiramientosSugeridos||[]).map(estiramientoPorId).filter(Boolean);
  }
  // Bloque de contexto arriba de la biblioteca: "Ver todos" no lleva a una
  // lista generica, lleva a ESTA sesion. Se oculta mientras hay busqueda o
  // filtro activos, para no mezclar el contexto con el resultado del filtro.
  // V46.2: el título y el pie del bloque dependen del ORIGEN, porque ahora se
  // llega desde dos lados: al finalizar un entrenamiento (sobre las series
  // completadas) y desde un día de la rutina (sobre sus ejercicios, sin haber
  // entrenado). Decir "tu último entrenamiento" en el segundo caso seria falso.
  const ESTIRAMIENTOS_CONTEXTO_SESION = { titulo:"Sugeridos para tu último entrenamiento", pie:"Según los ejercicios que completaste. Son opcionales." };
  function estiramientosContexto(){
    return state.estiramientosContexto || ESTIRAMIENTOS_CONTEXTO_SESION;
  }
  function estiramientosSugeridosHtml(){
    const sug = estiramientosSugeridosDeSesion();
    if(!sug.length) return "";
    if(state.estiramientosQuery || state.estiramientosGrupo) return "";
    const ctx = estiramientosContexto();
    const abierto = estiramientoAbiertoId(sug, state.estiramientoSelSug);
    return '' +
      '<div class="section-title" style="margin-top:2px"><h2 style="font-size:15px">' + esc(ctx.titulo) + '</h2><span class="muted">' + sug.length + '</span></div>' +
      '<p class="helptext">' + esc(ctx.pie) + '</p>' +
      '<div class="exlist">' + sug.map(function(e){ return estiramientoRowHtml(e, abierto===e.id, "sug"); }).join("") + '</div>' +
      '<div class="section-title" style="margin-top:10px"><h2 style="font-size:15px">Toda la biblioteca</h2><span class="muted">' + ESTIRAMIENTOS.length + '</span></div>';
  }
  function screenEstiramientos(){
    return '' +
      '<p class="helptext">' + esc(ESTIRAMIENTOS_AVISO) + '</p>' +
      '<div class="card stack">' +
        '<div class="field"><label>Buscar</label>' +
          '<input type="text" id="estir-search" placeholder="Buscar estiramientos" value="' + esc(state.estiramientosQuery) + '">' +
        '</div>' +
        '<div class="row" id="estir-chips" style="gap:6px; flex-wrap:wrap">' + estiramientosChipsHtml() + '</div>' +
      '</div>' +
      '<div id="estir-sug">' + estiramientosSugeridosHtml() + '</div>' +
      '<p class="helptext" style="margin-bottom:2px">Tocá un estiramiento para ver cómo se hace.</p>' +
      '<div class="exlist" id="estir-list">' + estiramientosListaHtml() + '</div>';
  }
  function renderEstiramientos(){
    app.classList.remove("app-wide");
    app.innerHTML = '' +
      '<div class="topbar">' +
        '<span class="iconbtn" id="btn-estir-back">' + icon("back") + '</span>' +
        '<h1 style="font-size:18px; flex:1; text-align:center">Estiramientos</h1>' +
        '<span style="width:30px"></span>' +
      '</div>' +
      '<main><div class="screen" id="screen"></div></main>';
    document.getElementById("btn-estir-back").onclick = function(){
      const destino = state.estiramientosFrom === "rutina" ? "rutina" : "perfil";
      state.estiramientoSel = null;
      state.tab = destino;
      if(destino === "perfil") state.perfilScrollPending = true;
      render();
    };
    document.getElementById("screen").innerHTML = screenEstiramientos();
    mountEstiramientos();
  }
  // El buscador NO re-renderiza la pantalla entera: sólo la lista. Si se
  // rehiciera el <input> en cada tecla, el foco y el cursor se perderían.
  function mountEstiramientosLista(){
    const sugCont = document.getElementById("estir-sug");
    if(sugCont){
      sugCont.innerHTML = estiramientosSugeridosHtml();
      sugCont.querySelectorAll("[data-estir-sugfila]").forEach(function(row){
        row.onclick = function(){
          const id = row.dataset.estirSugfila;
          const sug = estiramientosSugeridosDeSesion();
          // Cerrar deja "" (cerrado a propósito), nunca null: null volvería a
          // abrir la primera y la ficha no se podría cerrar nunca.
          state.estiramientoSelSug = (estiramientoAbiertoId(sug, state.estiramientoSelSug)===id) ? "" : id;
          mountEstiramientosLista();
        };
      });
    }
    const cont = document.getElementById("estir-list");
    if(!cont) return;
    cont.innerHTML = estiramientosListaHtml();
    cont.querySelectorAll("[data-estir]").forEach(function(row){
      row.onclick = function(){
        const id = row.dataset.estir;
        state.estiramientoSel = (estiramientoAbiertoId(estiramientosFiltrados(), state.estiramientoSel)===id) ? "" : id;
        mountEstiramientosLista();
      };
    });
  }
  function mountEstiramientos(){
    const el = document.getElementById("screen");
    if(!el) return;
    const input = el.querySelector("#estir-search");
    if(input) input.oninput = function(){
      state.estiramientosQuery = input.value;
      mountEstiramientosLista();
    };
    const chips = el.querySelector("#estir-chips");
    if(chips) chips.querySelectorAll("[data-estir-grupo]").forEach(function(b){
      b.onclick = function(){
        state.estiramientosGrupo = b.dataset.estirGrupo || null;
        chips.innerHTML = estiramientosChipsHtml();
        mountEstiramientos();
        mountEstiramientosLista();
      };
    });
    mountEstiramientosLista();
  }
  // Abrir la biblioteca desde cualquier lado, opcionalmente con una ficha ya
  // desplegada. Única puerta de entrada a la pantalla.
  function abrirEstiramientos(opts){
    const o = opts || {};
    state.estiramientoSel = null;
    state.estiramientoSelSug = null;
    state.estiramientosQuery = "";
    state.estiramientosGrupo = null;
    state.estiramientosFrom = o.from || "perfil";
    // `sugeridos` solo se pisa cuando lo mandan: entrar desde Perfil sin
    // argumento NO borra las recomendaciones del ultimo entrenamiento, y
    // mandar [] explicitamente las limpia.
    if(o.sugeridos) state.estiramientosSugeridos = o.sugeridos.slice();
    if(o.contexto) state.estiramientosContexto = o.contexto;
    else if(o.sugeridos) state.estiramientosContexto = null; // vuelve al texto de sesión
    // Una ficha pedida desde el modal se abre en el bloque de sugeridos si
    // esta ahi, y si no en la biblioteca.
    if(o.id){
      if((state.estiramientosSugeridos||[]).indexOf(o.id) !== -1) state.estiramientoSelSug = o.id;
      else state.estiramientoSel = o.id;
    }
    state.tab = "estiramientos";
    render();
  }
  // Bloque del modal de fin de entrenamiento. PURO: recibe la lista ya
  // calculada y devuelve HTML (o "" si no hay nada que sugerir, en cuyo caso el
  // modal queda exactamente como antes de V46, sin hueco ni título vacío).
  function estiramientosModalHtml(sugeridos){
    if(!sugeridos || !sugeridos.length) return "";
    const visibles = sugeridos.slice(0, ESTIRAMIENTOS_MODAL_MAX);
    const resto = sugeridos.length - visibles.length;
    return '' +
      '<div class="section-title" style="margin-top:2px"><h2 style="font-size:15px">Estiramientos sugeridos</h2><span class="muted">opcional</span></div>' +
      '<p class="helptext">Según los ejercicios que completaste hoy. ' + esc(ESTIRAMIENTOS_AVISO) + '</p>' +
      '<div class="exlist">' + visibles.map(function(e){
        return '<div class="exrow" data-estir-sug="' + esc(e.id) + '" style="cursor:pointer">' +
          '<div style="min-width:0">' +
            '<div class="exname">' + esc(e.nombre) + '</div>' +
            '<div class="helptext">' + esc(estiramientoZona(e)) + ' · ' + esc(e.duracion) + '</div>' +
          '</div>' +
          '<span class="iconbtn" style="pointer-events:none">' + icon("info") + '</span>' +
        '</div>';
      }).join("") + '</div>' +
      '<button class="btn btn-ghost btn-block" data-act="estir-todos">' +
        (resto > 0 ? 'Ver los ' + sugeridos.length + ' de esta sesión' : 'Ver todos los estiramientos') +
      '</button>';
  }
  function afterScreenMount(){
    if(state.tab==="rutina") mountRutina();
    else if(state.tab==="registro") mountRegistro();
    else if(state.tab==="calendario") mountCalendario();
    else if(state.tab==="cronometro") mountCronometro();
    else if(state.tab==="perfil") mountPerfil();
  }

  function mountRutina(){
    if(nativeSession()) mountNativeClock();
    const el = document.getElementById("screen");
    const addDayBtn = el.querySelector("#btn-add-day");
    if(addDayBtn) addDayBtn.onclick = ()=> openDayModal(null);

    const autoBtn = el.querySelector("#btn-auto-routine");
    if(autoBtn) autoBtn.onclick = openAutoRoutineModal;
    const specialBtn = el.querySelector("#btn-special-day");
    if(specialBtn) specialBtn.onclick = openSpecialDayModal;
    const focusedBtn = el.querySelector("#btn-focused-routine");
    if(focusedBtn) focusedBtn.onclick = openFocusedRoutineModal;
    // V29: navegación del historial semanal.
    // V42: los tres handlers pasaron a mountWeekNav, compartido con Perfil, con
    // el mismo comportamiento de siempre para Rutina (scope "rutina").
    mountWeekNav(el, "rutina");
    const explorarBtn = el.querySelector("#btn-explorar-musculos");
    if(explorarBtn) explorarBtn.onclick = ()=>{ state.explorerGroup = null; state.tab = "explorar"; render(); };
    const exportPdfBtn = el.querySelector("#btn-export-pdf");
    if(exportPdfBtn) exportPdfBtn.onclick = exportRoutinePDF;

    el.querySelectorAll("[data-rutina-slot]").forEach(b=>{
      b.onclick = ()=> selectRutinaSlot(b.dataset.rutinaSlot);
    });

    el.querySelectorAll("[data-toggle]").forEach(h=>{
      h.onclick = ()=>{
        const id = h.dataset.toggle;
        state.dayOpen[id] = !(state.dayOpen[id] !== false);
        renderScreen();
      };
    });
    el.querySelectorAll("[data-toggle-editex]").forEach(b=>{
      b.onclick = (e)=>{
        e.stopPropagation();
        const id = b.dataset.toggleEditex;
        state.dayEditMode[id] = !state.dayEditMode[id];
        renderScreen();
      };
    });
    el.querySelectorAll("[data-edit-day]").forEach(b=>{
      b.onclick = (e)=>{ e.stopPropagation(); const day = state.rutina.days.find(d=>d.id===b.dataset.editDay); openDayModal(day); };
    });
    el.querySelectorAll("[data-del-day]").forEach(b=>{
      b.onclick = async (e)=>{
        e.stopPropagation();
        const day = state.rutina.days.find(d=>d.id===b.dataset.delDay);
        const ok = await confirmDialog("Eliminar día", `¿Eliminar "${day.nombre}" y todos sus ejercicios?`);
        if(!ok) return;
        state.rutina.days = state.rutina.days.filter(d=>d.id!==day.id);
        await persistRutina();
        renderScreen();
      };
    });
    el.querySelectorAll("[data-add-ex]").forEach(b=>{
      b.onclick = ()=>{ const day = state.rutina.days.find(d=>d.id===b.dataset.addEx); openExerciseModal(day, null); };
    });
    el.querySelectorAll("[data-edit-ex]").forEach(b=>{
      b.onclick = ()=>{
        const [dayId, exId] = b.dataset.editEx.split("|");
        const day = state.rutina.days.find(d=>d.id===dayId);
        const ex = day.exercises.find(x=>x.id===exId);
        openExerciseModal(day, ex);
      };
    });
    el.querySelectorAll("[data-del-ex]").forEach(b=>{
      b.onclick = async ()=>{
        const [dayId, exId] = b.dataset.delEx.split("|");
        const day = state.rutina.days.find(d=>d.id===dayId);
        const ex = day.exercises.find(x=>x.id===exId);
        const ok = await confirmDialog("Eliminar ejercicio", `¿Eliminar "${ex.nombre}" de este día?`);
        if(!ok) return;
        day.exercises = day.exercises.filter(x=>x.id!==exId);
        await persistRutina();
        renderScreen();
      };
    });
    el.querySelectorAll("[data-log-ex]").forEach(b=>{
      b.onclick = ()=>{ state.exerciseSelForm = canonicalExerciseName(b.dataset.logEx); setTab("registro"); };
    });
    el.querySelectorAll("[data-howto-ex]").forEach(b=>{
      b.onclick = (e)=>{
        e.stopPropagation();
        const [dayId, exId] = b.dataset.howtoEx.split("|");
        const day = state.rutina.days.find(d=>d.id===dayId);
        const ex = day && day.exercises.find(x=>x.id===exId);
        if(ex) openExerciseDetail(ex, { returnTab:"rutina" });
      };
    });
    // V46.2: acceso de LECTURA. No toca la sesión, ni las series, ni
    // persistRutina: arma la lista con el motor y abre la biblioteca.
    el.querySelectorAll("[data-estir-day]").forEach(b=>{
      b.onclick = ()=>{
        const day = ((state.rutina && state.rutina.days) || []).find(d=> d.id === b.dataset.estirDay);
        if(!day) return;
        const sug = estiramientosDeDia(day);
        if(!sug.length) return;
        abrirEstiramientos({
          from: "rutina",
          sugeridos: sug.map(e=>e.id),
          contexto: {
            titulo: "Estiramientos para " + (day.nombre || "este día"),
            pie: "Según los ejercicios de este día. Son opcionales."
          }
        });
      };
    });
    el.querySelectorAll("[data-start-session]").forEach(b=>{
      b.onclick = (e)=>{
        e.stopPropagation();
        const day = state.rutina.days.find(d=>d.id===b.dataset.startSession);
        startSession(day);
      };
    });
    const resumeBtn = el.querySelector("#btn-resume-session");
    if(resumeBtn) resumeBtn.onclick = ()=>{ state.tab = "sesion"; render(); };
    const finalizeBtn = el.querySelector("#btn-finalize-session");
    if(finalizeBtn) finalizeBtn.onclick = async ()=>{
      if(nativeSession()) return requestNativeFinish();
      const day = sessionDay();
      const p = sessionProgress();
      const ok = await confirmDialog("Finalizar entrenamiento", `Vas a cerrar este entrenamiento (${p.done}/${p.total} series) y contará para tu racha y meta semanal. ¿Confirmar?`, "Finalizar");
      if(!ok) return;
      await finalizeSession(day);
    };
  }

  /* ================= MODO ENTRENANDO ================= */
  // V28: la pantalla de Entrenamiento pasa a ser el centro operativo real de
  // la sesión de gimnasio — desde acá, sin salir: marcar series, registrar
  // peso/reps, ver info del ejercicio, abrir el descanso, saltar libremente
  // entre ejercicios, guardar el progreso y (desde el banner de Mi rutina)
  // finalizar. Ver comentarios en sessionExerciseCardHtml/toggleSessionSet/
  // saveSessionProgress/finalizeSession para el detalle de cada parte.
  // V29: opts.special → Día Especial. Es la MISMA sesión de siempre (mismos
  // sets/setLogs, mismo guardado en sesionActiva), solo que con slot
  // "especial" y el día completo embebido en `specialDay` (ese día no vive
  // en ninguna rutina, así que sessionDay() no lo encontraría en rutinaSlots).
  function startSession(day, opts){
    if(state.rutinaRaw?.__v48TerminalRequest || nativeTerminalRefresh){showToast("Hay una operación pendiente. Reconciliá antes de iniciar otro entrenamiento.");return;}
    if(nativeSession()){state.tab="sesion";render();return;}
    if(state.persistence && state.persistence.clienteV48 && !state.unresolvedSession && !state.session){
      const owner=state.profile.id,generation=authLoadGeneration;
      return nativeLifecycle.start(owner,rutinaSync.getContext()?.base,day,opts && opts.special?"especial":state.activeSlot,navigator.onLine!==false).then(async result=>{
        if(generation!==authLoadGeneration || !state.profile || state.profile.id!==owner) return result;
        if(result.ok){await loadProfileData();if(generation===authLoadGeneration && state.profile?.id===owner){state.tab="sesion";render();}}
        else showToast(result.code==="ONLINE_REQUIRED" ? "Necesitás conexión para iniciar un entrenamiento V48."
          : result.code==="V48_NOT_READY" ? "El inicio V48 requiere la reserva online. Todavía no está habilitado; no se creó ninguna sesión."
          : "No se confirmó el inicio ("+result.code+"). La solicitud se conserva para reintentar sin duplicar.");
        return result;
      });
    }
    if(state.unresolvedSession || (state.persistence && state.persistence.clienteV48)){
      showToast("El entrenamiento V48 todavía no está habilitado en esta versión. Tu sesión se conserva."); return;
    }
    if(state.session){state.tab="sesion";render();return;}
    const special = !!(opts && opts.special);
    const sets = {};
    const setLogs = {};
    (day.exercises||[]).forEach(ex=>{
      const n = Math.max(1, Math.min(12, parseInt(ex.series,10)||1));
      sets[ex.id] = new Array(n).fill(false);
      setLogs[ex.id] = new Array(n).fill(null);
    });
    state.session = { dayId: day.id, slot: special ? "especial" : state.activeSlot, dayNombre: day.nombre, startedAt: Date.now(), sets, setLogs };
    if(special) state.session.specialDay = day;
    state.tab = "sesion";
    persistRutina(); // guardado inmediato: si cierran la app un segundo después, el entrenamiento ya quedó recuperable
    render();
  }

  function renderSession(){
    const day = sessionDay();
    if(!day){ state.session=null; state.tab="rutina"; render(); return; }
    app.innerHTML = `
      <div class="topbar">
        <span class="iconbtn" id="btn-session-back">${icon("back")}</span>
        <h1 style="font-size:18px; flex:1; text-align:center">${esc(day.nombre)}</h1>
        <span style="width:30px"></span>
      </div>
      <main><div class="screen" id="screen"></div></main>
      <nav class="bottomnav">
        <button class="btn btn-primary btn-block" id="btn-save-session" style="max-width:444px; margin:0 auto">${icon("check")} ${nativeSession() ? (VodaFitLifecycle.pending(nativeSession()) ? "Reintentar finalización" : "Finalizar entrenamiento") : "Guardar entrenamiento"}</button>
      </nav>
    `;
    document.getElementById("btn-session-back").onclick = ()=>{
      if(state.nativeOffline){showToast("Entrenamiento recuperado. Los demás datos de la cuenta requieren conexión.");return;}
      state.tab="rutina"; render();
    };
    document.getElementById("screen").innerHTML = screenSession(day);
    mountSession(day);
    document.getElementById("btn-save-session").onclick = saveSessionProgress;
  }

  // Reemplaza a `render()`/`renderSession()` para un simple refresco del
  // contenido tras marcar una serie: reconstruye solo #screen (misma idea que
  // renderScreenExerciseDetail para la ficha de ejercicio), sin recrear el
  // topbar/bottomnav ni perder el scroll de la pantalla.
  function renderScreenSession(){
    const day = sessionDay();
    if(!day){ state.session=null; state.tab="rutina"; render(); return; }
    const el = document.getElementById("screen");
    if(!el) return;
    el.innerHTML = screenSession(day);
    mountSession(day);
  }

  function screenSession(day){
    if(nativeSession()) return nativeLifecycleHtml(nativeSession())+VodaFitSession.html(nativeSession(),state.rutinaRaw && state.rutinaRaw.referenciasEjercicios,canonicalExerciseName)
      +'<button class="btn btn-outline btn-block" data-native-finalize>Finalizar entrenamiento</button>'
      +(!VodaFitLifecycle.pending(nativeSession()) && !state.rutinaRaw?.__v48TerminalRequest ? '<button class="btn btn-outline btn-block" data-native-cancel>Cancelar entrenamiento</button>' : '')
      +(['REMOTE_ELIMINADA','REMOTE_CANCELADA','REMOTE_FINALIZADA','IDEMPOTENCY_CONFLICT'].includes(state.nativeReconcileIssue)?'<button class="btn btn-outline btn-block" data-native-use-remote>Resolver con el estado remoto</button>':'');
    const exs = day.exercises||[];
    if(exs.length===0){
      return `<div class="card empty">${icon("routine")}<h3>Este día no tiene ejercicios</h3><p>Agregale ejercicios desde "Rutina" antes de entrenar.</p></div>`;
    }
    // V29: aviso visible de que es un Día Especial (no suma al objetivo semanal).
    const specialNote = (state.session && state.session.slot==="especial")
      ? `<div class="card special-note"><span class="special-badge">Día Especial</span><span class="helptext">Entrenamiento extra — queda en tu historial y calendario, pero no suma al objetivo semanal.</span></div>`
      : "";
    return specialNote + exs.map(ex=> sessionExerciseCardHtml(ex)).join("") + `<button class="btn btn-outline btn-block" id="btn-cancel-session">Cancelar entrenamiento</button>`;
  }

  // Una sola tarjeta por ejercicio con todo lo necesario para entrenar sin
  // salir de la pantalla. Los ejercicios NUNCA se bloquean entre sí — el
  // usuario puede saltar a cualquier otro en cualquier momento (superseries,
  // orden libre, lo que haya hecho de verdad); lo secuencial es solo DENTRO
  // de cada ejercicio (ver toggleSessionSet) y es una ayuda de uso, no una
  // restricción de flujo entre ejercicios.
  function sessionExerciseCardHtml(ex){
    const done = state.session.sets[ex.id] || [];
    const logs = state.session.setLogs[ex.id] || [];
    const allDone = done.length>0 && done.every(Boolean);
    const nextIdx = done.findIndex(v=>!v);
    // v28.1: registro POR SERIE (progresión de carga dentro del mismo
    // ejercicio, ej. sentadilla 60/70/80/90kg) — cada línea con datos ya
    // cargados es tocable para reabrirla y editarla; el botón único de abajo
    // siempre apunta a la serie activa (la misma que se resalta como
    // "next" en los círculos), nunca a una lista de botones por serie.
    const loggedRows = logs.map((log,i)=> log ? `
      <div class="setlog-row" data-edit-set="${ex.id}" data-idx="${i}">
        <span class="sl-num">Serie ${i+1}</span>
        <span class="sl-val">${esc(log.peso)} kg × ${esc(log.reps||"-")}</span>
      </div>` : "").join("");
    return `
      <div class="card stack" data-exercise-card="${ex.id}">
        <div class="row between">
          <div style="display:flex; align-items:center; gap:10px; min-width:0">
            ${exerciseThumbHtml(ex, "width:32px; height:77px; flex:none", "width:56px; height:72px; flex:none")}
            <div style="min-width:0">
              <div class="exname" style="font-size:16px">${esc(ex.nombre)}</div>
              <div class="exmeta">${esc(ex.series)} series × ${esc(ex.reps)} reps${ex.notas? " · "+esc(ex.notas):""}</div>
            </div>
          </div>
          ${allDone ? `<span class="badge pr" style="flex:none">${icon("check")} Completo</span>` : ""}
        </div>
        <div class="setrow">
          ${done.map((v,i)=>{
            const isNext = i===nextIdx;
            const locked = !v && !isNext;
            return `<div class="setdot ${v?"done":""}${isNext?" next":""}${locked?" locked":""}" data-ex="${ex.id}" data-idx="${i}">${i+1}</div>`;
          }).join("")}
        </div>
        ${loggedRows ? `<div class="stack" style="gap:4px">${loggedRows}</div>` : ""}
        <div class="row" style="gap:8px">
          <span class="iconbtn iconbtn-lg" data-howto-ex-session="${ex.id}" title="Cómo hacerlo" style="flex:none">${icon("info")}</span>
          <span class="iconbtn iconbtn-lg" data-rest-btn title="Descansar" style="flex:none">${icon("timer")}</span>
          ${nextIdx!==-1 ? `<button class="btn btn-outline btn-sm" style="flex:1" data-log-weight="${ex.id}" data-log-idx="${nextIdx}">${icon("dumbbell")} Registrar peso y reps</button>` : ""}
        </div>
      </div>
    `;
  }

  function mountSession(day){
    const el = document.getElementById("screen");
    if(nativeSession()){
      const session=nativeSession(),owner=state.profile && state.profile.id,generation=authLoadGeneration;
      const current=()=>nativeSession()===session && state.profile && state.profile.id===owner && generation===authLoadGeneration;
      mountNativeClock();

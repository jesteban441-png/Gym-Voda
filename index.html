<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>VodaFit</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VodaFit">
<meta name="theme-color" content="#171412">
<meta name="description" content="Rutina, registro de pesos y cronómetro para el gimnasio">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F1F0EC;
    --surface:#FFFFFF;
    --surface-2:#E8E6E0;
    --text:#1B1917;
    --text-muted:#6B6560;
    --border:#DBD8D1;
    --accent:#C84A22;
    --accent-strong:#B8431D;
    --accent-on:#FFFFFF;
    --accent-soft:#FBE3D8;
    --secondary:#2A5FD9;
    --secondary-soft:#DCE6FB;
    --success:#2E9E5B;
    --success-soft:#DCF3E6;
    --danger:#C13B3B;
    --danger-soft:#FBE0DF;
    --shadow: 0 1px 2px rgba(20,15,10,.06), 0 6px 16px -8px rgba(20,15,10,.15);
    --radius-s: 10px;
    --radius-m: 16px;
    --radius-l: 22px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15130F;
      --surface:#211D18;
      --surface-2:#2A2520;
      --text:#F3EFE9;
      --text-muted:#A79E93;
      --border:#3A342D;
      --accent:#FF7A47;
      --accent-strong:#FF8E5E;
      --accent-on:#1B1210;
      --accent-soft:#3A2116;
      --secondary:#7EA0FF;
      --secondary-soft:#1E2740;
      --success:#59C68A;
      --success-soft:#173425;
      --danger:#FF8A80;
      --danger-soft:#3A1F1E;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 24px -12px rgba(0,0,0,.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#15130F;
    --surface:#211D18;
    --surface-2:#2A2520;
    --text:#F3EFE9;
    --text-muted:#A79E93;
    --border:#3A342D;
    --accent:#FF7A47;
    --accent-strong:#FF8E5E;
    --accent-on:#1B1210;
    --accent-soft:#3A2116;
    --secondary:#7EA0FF;
    --secondary-soft:#1E2740;
    --success:#59C68A;
    --success-soft:#173425;
    --danger:#FF8A80;
    --danger-soft:#3A1F1E;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 24px -12px rgba(0,0,0,.5);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Work Sans", system-ui, -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }
  h1,h2,h3,.display{
    font-family:"Barlow Condensed", "Work Sans", sans-serif;
    text-transform:uppercase;
    letter-spacing:.02em;
    font-weight:700;
    text-wrap:balance;
    margin:0;
  }
  .num{ font-variant-numeric: tabular-nums; }
  button{ font-family:inherit; }
  input,select{ font-family:inherit; }
  ::selection{ background:var(--accent-soft); }

  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding-bottom: calc(78px + env(safe-area-inset-bottom));
    position:relative;
  }
  /* La ficha de ejercicio usa un layout de dos columnas en pantallas anchas
     (ver .exdetail-layout), así que en esa pantalla el contenedor se puede
     ensanchar — en mobile no cambia nada porque el viewport ya es angosto. */
  #app.app-wide{ max-width:960px; }

  .topbar{
    position:sticky; top:0; z-index:5;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px calc(10px);
    padding-top: calc(14px + env(safe-area-inset-top));
    background:var(--bg);
    border-bottom:1px solid var(--border);
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{
    width:30px;height:30px;border-radius:9px;background:var(--accent);
    display:flex;align-items:center;justify-content:center;flex:none;
  }
  .brand-mark svg{ width:18px; height:18px; }
  .brand h1{ font-size:22px; line-height:1; color:var(--text); }
  .profile-chip{
    display:flex; align-items:center; gap:8px;
    background:var(--surface); border:1px solid var(--border);
    border-radius:999px; padding:6px 12px 6px 6px;
    cursor:pointer;
  }
  .avatar{
    width:24px;height:24px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:12px; font-weight:700; color:var(--accent-on);
    background:var(--accent); flex:none;
  }
  .profile-chip span{ font-size:13px; font-weight:600; }

  main{ flex:1; padding:16px 18px 8px; }
  .screen{ display:flex; flex-direction:column; gap:14px; animation: fade .18s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

  .section-title{ display:flex; align-items:baseline; justify-content:space-between; margin-top:4px; }
  .section-title h2{ font-size:20px; color:var(--text); }
  .section-title .muted{ font-size:12px; color:var(--text-muted); text-transform:none; letter-spacing:0; font-family:"Work Sans",sans-serif; font-weight:500; }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-m);
    box-shadow:var(--shadow);
    padding:14px;
  }
  .card + .card{ margin-top:0; }
  .stack{ display:flex; flex-direction:column; gap:10px; }
  .row{ display:flex; align-items:center; gap:10px; }
  .row.between{ justify-content:space-between; }
  .wrap{ display:flex; flex-wrap:wrap; gap:8px; }

  .day-card .day-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .day-head h3{ font-size:18px; color:var(--text); }
  .day-head .actions{ display:flex; gap:6px; }
  .exlist{ display:flex; flex-direction:column; gap:8px; margin-top:10px; }
  .exrow{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:9px 10px; background:var(--surface-2); border-radius:var(--radius-s);
  }
  .exrow .exname{ font-weight:600; font-size:14.5px; }
  .exrow .exmeta{ font-size:12.5px; color:var(--text-muted); }
  .exrow .actions{ display:flex; gap:4px; flex:none; }

  .iconbtn{
    width:30px;height:30px; border-radius:9px; border:1px solid var(--border);
    background:var(--surface); color:var(--text-muted);
    display:flex;align-items:center;justify-content:center; cursor:pointer;
  }
  .iconbtn:active{ transform:scale(.94); }
  .iconbtn svg{ width:15px; height:15px; }
  .iconbtn.danger{ color:var(--danger); }

  .btn{
    appearance:none; border:none; border-radius:12px; padding:12px 16px;
    font-weight:700; font-size:14.5px; cursor:pointer; text-align:center;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn:active{ transform:scale(.98); }
  .btn svg{ width:17px; height:17px; flex:none; }
  .btn-primary{ background:var(--accent); color:var(--accent-on); }
  .btn-secondary{ background:var(--secondary-soft); color:var(--secondary); }
  .btn-ghost{ background:var(--surface-2); color:var(--text); }
  .btn-outline{ background:transparent; color:var(--text); border:1px solid var(--border); }
  .btn-block{ width:100%; }
  .btn-sm{ padding:8px 12px; font-size:13px; border-radius:10px; }
  .btn-danger{ background:var(--danger-soft); color:var(--danger); }

  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:12px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em; }
  .field input, .field select, .field textarea{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:10px 12px; font-size:15px; width:100%;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; min-width:0; }

  .ac-wrap{ position:relative; }
  .ac-list{
    position:absolute; left:0; right:0; top:calc(100% + 4px); z-index:6;
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    box-shadow:var(--shadow); max-height:210px; overflow-y:auto; display:none;
  }
  .ac-item{ padding:10px 12px; font-size:14px; cursor:pointer; }
  .ac-item + .ac-item{ border-top:1px solid var(--border); }
  .ac-item:hover, .ac-item:active{ background:var(--surface-2); }

  .empty{
    display:flex; flex-direction:column; align-items:center; text-align:center;
    gap:10px; padding:34px 16px; color:var(--text-muted);
  }
  .empty svg{ width:40px; height:40px; opacity:.5; }
  .empty h3{ color:var(--text); font-size:18px; }
  .empty p{ margin:0; font-size:13.5px; max-width:30ch; }

  .badge{ font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px; text-transform:uppercase; letter-spacing:.03em; }
  .badge.pin{ background:var(--secondary-soft); color:var(--secondary); }
  .badge.pr{ background:var(--success-soft); color:var(--success); }

  .bottomnav{
    position:fixed; left:0; right:0; bottom:0; z-index:10;
    background:var(--surface); border-top:1px solid var(--border);
    padding: 8px max(10px, calc(50% - 240px + 10px)) calc(8px + env(safe-area-inset-bottom));
    display:flex; justify-content:space-around;
  }
  .navbtn{
    display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; color:var(--text-muted); cursor:pointer;
    padding:6px 6px; border-radius:12px; flex:1; max-width:110px; min-width:0;
  }
  .navbtn svg{ width:22px; height:22px; }
  .navbtn span{ font-size:11px; font-weight:600; }
  .navbtn.active{ color:var(--accent); }

  .banner{
    display:flex; gap:10px; align-items:flex-start;
    background:var(--secondary-soft); color:var(--secondary);
    border-radius:var(--radius-s); padding:10px 12px; font-size:12.5px; line-height:1.4;
  }
  .banner svg{ width:16px; height:16px; flex:none; margin-top:1px; }
  .banner.warn{ background:var(--accent-soft); color:var(--accent-strong); }

  .modal-back{
    position:fixed; inset:0; background:rgba(10,8,6,.5); backdrop-filter:blur(2px);
    display:flex; align-items:flex-end; justify-content:center; z-index:50;
    animation: fadeIn .15s ease;
  }
  @keyframes fadeIn{ from{opacity:0} to{opacity:1} }
  .modal{
    background:var(--surface); width:100%; max-width:480px;
    border-radius:20px 20px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:14px;
    max-height:88vh; overflow-y:auto;
    animation: up .18s ease;
  }
  @keyframes up{ from{transform:translateY(16px); opacity:.6} to{transform:none; opacity:1} }
  .modal h3{ font-size:20px; }
  .modal-actions{ display:flex; gap:10px; margin-top:4px; }
  .modal-actions .btn{ flex:1; }

  .profilegrid{ display:flex; flex-direction:column; gap:8px; }
  .profileopt{
    display:flex; align-items:center; gap:12px; padding:11px 12px;
    background:var(--surface-2); border-radius:var(--radius-s); border:1px solid transparent;
    cursor:pointer;
  }
  .profileopt.current{ border-color:var(--accent); }
  .profileopt .avatar{ width:34px; height:34px; font-size:14px; }
  .profileopt .info{ flex:1; }
  .profileopt .info b{ font-size:14.5px; display:block; }
  .profileopt .info small{ color:var(--text-muted); font-size:12px; }
  .profileopt > svg{ width:16px; height:16px; color:var(--text-muted); flex:none; }

  .pindots{ display:flex; gap:10px; justify-content:center; margin:6px 0; }
  .pindots .d{ width:14px; height:14px; border-radius:50%; border:2px solid var(--border); }
  .pindots .d.on{ background:var(--accent); border-color:var(--accent); }
  .keypad{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .keypad button{
    padding:16px; font-size:20px; font-weight:700; border-radius:14px;
    border:1px solid var(--border); background:var(--surface-2); color:var(--text);
  }
  .keypad button:active{ transform:scale(.95); }

  /* Cronometro */
  .timer-wrap{ display:flex; flex-direction:column; align-items:center; gap:20px; padding:10px 0 4px; }
  .ring-box{ position:relative; width:240px; height:240px; }
  .ring-box svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .ring-bg{ fill:none; stroke:var(--surface-2); stroke-width:14; }
  .ring-fg{ fill:none; stroke:var(--accent); stroke-width:14; stroke-linecap:round; transition: stroke .2s ease; }
  .ring-fg.done{ stroke:var(--success); }
  .ring-label{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:2px;
  }
  .ring-label .time{ font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:54px; line-height:1; }
  .ring-label .state{ font-size:12px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em; font-weight:600; }
  .presets{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .preset{
    padding:9px 14px; border-radius:999px; border:1px solid var(--border);
    background:var(--surface); color:var(--text); font-weight:600; font-size:13.5px; cursor:pointer;
  }
  .preset.active{ background:var(--accent); border-color:var(--accent); color:var(--accent-on); }
  .timer-controls{ display:flex; gap:12px; }
  .timer-controls .btn{ width:76px; height:76px; border-radius:50%; font-size:13px; flex-direction:column; }
  .timer-controls .btn svg{ width:24px; height:24px; }

  /* Sparkline */
  .spark-row{ display:flex; align-items:center; gap:12px; }
  .spark-stats{ flex:none; text-align:right; }
  .spark-stats .best{ font-size:20px; font-weight:700; font-family:"Barlow Condensed",sans-serif; color:var(--text); }
  .spark-stats .lbl{ font-size:10.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em; }
  svg.spark{ flex:1; min-width:0; height:44px; width:100%; overflow:visible; }

  .loglist{ display:flex; flex-direction:column; gap:8px; }
  .logrow{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 12px; border-radius:var(--radius-s); background:var(--surface-2);
  }
  .logrow .lex{ font-weight:600; font-size:14px; }
  .logrow .ldate{ font-size:11.5px; color:var(--text-muted); }
  .logrow .lval{ font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:18px; text-align:right; }
  .logrow .lsub{ font-size:11.5px; color:var(--text-muted); text-align:right; }

  .segmented{ display:flex; background:var(--surface-2); border-radius:12px; padding:3px; }
  .segmented button{
    flex:1; border:none; background:none; padding:9px 6px; border-radius:9px;
    font-weight:600; font-size:13px; color:var(--text-muted); cursor:pointer;
  }
  .segmented button.active{ background:var(--surface); color:var(--text); box-shadow:var(--shadow); }

  a.linklike{ color:var(--secondary); font-weight:600; cursor:pointer; }
  .helptext{ font-size:12px; color:var(--text-muted); line-height:1.4; }

  .setrow{ display:flex; flex-wrap:wrap; gap:8px; }
  .setdot{
    width:36px; height:36px; border-radius:50%; border:2px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px;
    color:var(--text-muted); cursor:pointer; background:var(--surface-2); flex:none;
  }
  .setdot.done{ background:var(--success); border-color:var(--success); color:#fff; }
  .setdot:active{ transform:scale(.93); }

  .racha-card{ display:flex; flex-direction:column; gap:8px; }
  .racha-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .racha-count{ font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:23px; }
  .racha-streak{ text-align:right; }
  .racha-streak .fire{ font-size:22px; line-height:1; }

  .muscle-diagram{ display:flex; flex-direction:column; align-items:center; gap:6px; padding:8px 0 2px; }
  .muscle-diagram-pic{ width:74px; height:92px; }
  .muscle-diagram-pic svg [data-region], .howto-pic svg [data-region]{ stroke:var(--surface); stroke-width:1.2; stroke-linejoin:round; }
  .howto-pic{ width:150px; height:188px; border-radius:var(--radius-s); overflow:hidden; background:var(--surface-2); }
  .howto-pic svg{ width:100%; height:100%; }
  .howto-pic-labeled{ width:220px; height:276px; overflow:visible; margin:2px 0; }
  .muscle-section{ display:flex; flex-direction:column; gap:6px; }
  .howto-photo{ width:100%; max-width:320px; height:auto; display:block; margin:0 auto; border-radius:var(--radius-s); background:var(--surface-2); }
  .tips-box{ background:var(--surface-2); border-radius:var(--radius-s); padding:12px 14px; }
  .tips-list{ margin:0; padding-left:18px; display:flex; flex-direction:column; gap:6px; font-size:13.5px; line-height:1.4; color:var(--text); }

  .exdetail-meta{ display:flex; flex-direction:column; gap:5px; padding:2px 0 4px; font-size:13.5px; color:var(--text-muted); }
  .exdetail-meta b{ color:var(--text); font-weight:700; }
  .exchart-wrap{ padding:4px 2px 2px; }
  svg.exchart{ width:100%; height:140px; overflow:visible; }

  /* Ficha de ejercicio (pantalla completa, estilo Hevy: detalle + biblioteca) */
  .exdetail-toprow{ display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap; }
  .exdetail-toprow .exdetail-meta{ flex:1 1 160px; min-width:140px; }
  .exdetail-toprow .howto-pic-labeled{ flex:none; margin:0 auto; }
  .exdetail-mobile-toggle{ display:flex; }
  .exdetail-layout{ display:flex; flex-direction:column; gap:16px; }
  .exdetail-col[hidden]{ display:none; }
  .exlib-filters{ display:flex; flex-direction:column; gap:8px; }
  .exlib-filters .field-row{ gap:8px; }
  .exlib-filters select{ font-size:12.5px; padding:10px 8px; }
  .exlib-list{ display:flex; flex-direction:column; gap:6px; max-height:56vh; overflow-y:auto; margin-top:8px; }
  .exlib-row{
    display:flex; align-items:center; gap:10px; padding:8px 9px;
    background:var(--surface-2); border-radius:var(--radius-s); cursor:pointer; text-align:left; border:1px solid transparent;
  }
  .exlib-row.active{ border-color:var(--accent); }
  .exlib-row .exlib-name{ font-weight:600; font-size:13.5px; }
  .exlib-row .exlib-cap{ font-size:11.5px; color:var(--text-muted); }
  @media (min-width:820px){
    .exdetail-mobile-toggle{ display:none; }
    .exdetail-layout{ display:grid; grid-template-columns:1.3fr 1fr; align-items:start; gap:20px; }
    .exdetail-col[hidden]{ display:block; }
  }

  /* Calendario */
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .cal-weekday{ font-size:11px; color:var(--text-muted); text-align:center; text-transform:uppercase; font-weight:600; padding-bottom:2px; }
  .cal-cell{
    aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    border-radius:10px; font-size:13px; color:var(--text-muted); font-weight:600;
  }
  .cal-cell.empty{ visibility:hidden; }
  .cal-cell.today{ box-shadow: inset 0 0 0 1.5px var(--accent); color:var(--text); }
  .cal-cell.done{ background:var(--success-soft); color:var(--success); cursor:pointer; }
  .cal-cell.done:active{ transform:scale(.92); }

  /* Explorador por grupo muscular */
  .grouptile{
    flex:1 1 45%; min-width:130px; text-align:left; cursor:pointer;
  }
  .grouptile:active{ transform:scale(.98); }

  /* Generador de rutina automática */
  .autoroutine-daybtns{ display:flex; gap:6px; flex-wrap:wrap; }
  .autoroutine-daybtns .btn{ flex:1; min-width:44px; }

  @media (max-width:360px){
    .ring-box{ width:200px; height:200px; }
    .ring-label .time{ font-size:44px; }
    .timer-controls .btn{ width:66px; height:66px; }
    .navbtn{ padding:6px 4px; }
    .navbtn span{ font-size:10px; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

(function(){
  "use strict";

  const SUPABASE_KEY = "sb_publishable_9NehCfiZ-MxRZ8eZmnAQUw_p-O0XIuA";

  /* ---------- Grupos musculares (para el explorador y el generador automático) ----------
     A partir de la región de MAYOR intensidad de cada ejercicio en MUSCLE_MAP se deduce un
     "subgrupo" fino (útil para el generador: separa bíceps/tríceps/pecho/hombros/espalda/
     piernas/core) y un "grupo" visible más general (Pecho, Espalda, Piernas, Hombros,
     Brazos, Core) para el explorador por grupo muscular. */
  const REGION_SUBGROUP = {
    "chest-upper":"pecho", "chest-mid":"pecho", "chest-lower":"pecho",
    "shoulder-front":"hombros", "shoulder-lateral":"hombros", "shoulder-rear":"hombros",
    "traps":"espalda", "rhomboids":"espalda", "lats":"espalda", "lower-back":"espalda",
    "biceps-long":"biceps", "biceps-short":"biceps",
    "triceps-long":"triceps", "triceps-lateral":"triceps", "triceps-medial":"triceps",
    "abs":"core", "obliques":"core",
    "quads-front":"piernas", "quads-outer":"piernas", "quads-inner":"piernas", "adductors":"piernas",
    "glutes":"piernas", "hamstrings":"piernas", "calves-gastro":"piernas", "calves-soleus":"piernas",
  };
  const SUBGROUP_TO_MUSCLEGROUP = { pecho:"Pecho", hombros:"Hombros", espalda:"Espalda", biceps:"Brazos", triceps:"Brazos", core:"Core", piernas:"Piernas" };
  const MUSCLE_GROUPS = ["Pecho","Espalda","Piernas","Hombros","Brazos","Core"];

  function exercisePrimarySubgroup(name){
    const info = MUSCLE_MAP[name];
    if(!info || !info.t || !info.t.length) return null;
    let best = info.t[0];
    info.t.forEach(t=>{ if(t[1]>best[1]) best=t; });
    return REGION_SUBGROUP[best[0]] || null;
  }
  function exerciseMuscleGroup(name){
    const sg = exercisePrimarySubgroup(name);
    return sg ? SUBGROUP_TO_MUSCLEGROUP[sg] : null;
  }
  // Grupo muscular PRINCIPAL y SECUNDARIO (taxonomía de 6 grupos, para la ficha
  // de ejercicio) — se recorren las regiones de MUSCLE_MAP ordenadas por
  // intensidad y se toman los dos primeros grupos DISTINTOS que aparecen.
  function exercisePrincipalSecondaryGroups(name){
    const info = MUSCLE_MAP[name];
    if(!info || !info.t || !info.t.length) return { principal:null, secondary:null };
    const sorted = info.t.slice().sort((a,b)=>b[1]-a[1]);
    const groupsInOrder = [];
    sorted.forEach(([region])=>{
      const sg = REGION_SUBGROUP[region];
      const g = sg && SUBGROUP_TO_MUSCLEGROUP[sg];
      if(g && groupsInOrder.indexOf(g)===-1) groupsInOrder.push(g);
    });
    return { principal: groupsInOrder[0]||null, secondary: groupsInOrder[1]||null };
  }
  // Sub-foco dentro de "piernas" (cuádriceps/glúteos/isquios/pantorrillas/
  // aductores) — usado por el generador automático para poder exigir que un
  // día de pierna tenga sí o sí un ejercicio de cuádriceps y uno de glúteo.
  function exerciseLegFocus(name){
    const info = MUSCLE_MAP[name];
    if(!info || !info.t || !info.t.length) return null;
    let best = info.t[0];
    info.t.forEach(t=>{ if(t[1]>best[1]) best=t; });
    const region = best[0];
    if(region.indexOf("quads")===0) return "quads";
    if(region==="glutes") return "glutes";
    if(region==="hamstrings") return "hamstrings";
    if(region.indexOf("calves")===0) return "calves";
    if(region==="adductors") return "adductors";

  let _legFocusPoolsCache = null;
  // excludeSet (opcional): nombres de ejercicio a dejar afuera del pool — lo usa
  // el generador de rutina automática para un perfil de 50+ años (ver
  // EXERCISES_RISKY_50PLUS más abajo). Con excludeSet no se usa el cache
  // (es un caso puntual, no vale la pena cachearlo aparte) — sin excludeSet
  // el comportamiento es exactamente el de siempre (Explorador, Biblioteca, etc.)
  function legFocusPools(excludeSet){
    if(!excludeSet && _legFocusPoolsCache) return _legFocusPoolsCache;
    const pools = { quads:[], glutes:[], hamstrings:[], calves:[], adductors:[] };
    Object.keys(MUSCLE_MAP).forEach(name=>{
      if(excludeSet && excludeSet.has(name)) return;
      const f = exerciseLegFocus(name);
      if(f && pools[f]) pools[f].push(name);
    });
    if(!excludeSet) _legFocusPoolsCache = pools;
    return pools;
  }
  let _subgroupPoolsCache = null;
  function subgroupPools(excludeSet){
    if(!excludeSet && _subgroupPoolsCache) return _subgroupPoolsCache;
    const pools = {};
    Object.keys(MUSCLE_MAP).forEach(name=>{
      if(excludeSet && excludeSet.has(name)) return;
      const sg = exercisePrimarySubgroup(name);
      if(!sg) return;
      (pools[sg] = pools[sg]||[]).push(name);
    });
    if(!excludeSet) _subgroupPoolsCache = pools;
    return pools;
  }
  function muscleGroupPools(){
    const pools = {};
    MUSCLE_GROUPS.forEach(g=>pools[g]=[]);
    Object.keys(MUSCLE_MAP).forEach(name=>{
      const g = exerciseMuscleGroup(name);
      if(g) pools[g].push(name);
    });
    MUSCLE_GROUPS.forEach(g=> pools[g].sort((a,b)=>a.localeCompare(b,"es")));
    return pools;
  }

  function regionFillCss(intensity){
    return intensity>0
      ? `color-mix(in srgb, var(--danger) ${Math.round(Math.min(1,intensity)*100)}%, var(--border))`
      : "var(--border)";
  }

  function bodyDiagramSvg(diagramKey, targets){
    const d = BODY_DIAGRAMS[diagramKey];
    if(!d) return "";
    const map = new Map((targets||[]).map(x=> Array.isArray(x) ? x : [x.region, x.intensity]));
    const colored = d.shapes.replace(/data-region="([\w-]+)"/g, (m, region)=>{
      const isBase = region==="base" || region==="head";
      if(isBase) return `data-region="${region}" fill="var(--surface-2)"`;
      const intensity = map.has(region) ? map.get(region) : 0;
      return `data-region="${region}" fill="${regionFillCss(intensity)}"`;
    });
    return `<svg viewBox="${d.viewBox}" style="width:100%; height:100%">${colored}</svg>`;
  }

  // Versión grande para el modal "Cómo hacerlo": el mismo diagrama, pero con
  // una lineita + etiqueta de texto sobre cada parte que trabaja en ESTE
  // ejercicio (solo las regiones con intensidad > 0, para no saturar).
  function bodyDiagramSvgLabeled(diagramKey, targets){
    const d = BODY_DIAGRAMS[diagramKey];
    if(!d) return "";
    const list = (targets||[]).map(x=> Array.isArray(x) ? {region:x[0], intensity:x[1]} : x);
    const map = new Map(list.map(x=>[x.region, x.intensity]));
    const colored = d.shapes.replace(/data-region="([\w-]+)"/g, (m, region)=>{
      const isBase = region==="base" || region==="head";
      if(isBase) return `data-region="${region}" fill="var(--surface-2)"`;
      const intensity = map.has(region) ? map.get(region) : 0;
      return `data-region="${region}" fill="${regionFillCss(intensity)}"`;
    });
    const geom = LABEL_GEOM[diagramKey] || {};
    const labels = list
      .filter(x=>x.intensity>0 && geom[x.region])
      .map(x=>{
        const g = geom[x.region];
        const text = MUSCLE_LABELS_SHORT[x.region] || MUSCLE_LABELS[x.region] || x.region;
        const fill = regionFillCss(x.intensity);
        return `
          <line x1="${g.cx}" y1="${g.cy}" x2="${g.lx}" y2="${g.ly}" style="stroke:var(--text-muted); stroke-width:.6; opacity:.6"/>
          <circle cx="${g.cx}" cy="${g.cy}" r="2.1" fill="${fill}" style="stroke:var(--surface); stroke-width:.6"/>
          <text x="${g.lx}" y="${g.ly}" text-anchor="${g.anchor}" dominant-baseline="middle"
                style="font:700 5.4px 'Nunito',sans-serif; fill:var(--text); paint-order:stroke; stroke:var(--surface); stroke-width:2.4px; stroke-linejoin:round">${esc(text)}</text>
        `;
      }).join("");
    return `<svg viewBox="${d.viewBox}" style="width:100%; height:100%; overflow:visible">${colored}${labels}</svg>`;
  }

  function exerciseEquipment(name){
    return EXERCISE_EQUIPMENT[name] || "No especificado";
  }

  function muscleTargets(exerciseName){
    const info = MUSCLE_MAP[exerciseName];
    if(!info) return null;
    return { diagram: info.diagram, list: info.t.map(([region,intensity])=>({region,intensity})).sort((a,b)=>b.intensity-a.intensity) };
  }

  function muscleDiagramFor(exerciseName){
    const m = muscleTargets(exerciseName);
    if(!m) return "";
    const primary = m.list.filter(x=>x.intensity>=0.75).map(x=>MUSCLE_LABELS[x.region]||x.region);
    const secondary = m.list.filter(x=>x.intensity<0.75).map(x=>MUSCLE_LABELS[x.region]||x.region);
    return `
      <div class="muscle-diagram">
        <div class="muscle-diagram-pic">${bodyDiagramSvg(m.diagram, m.list)}</div>
        <div class="helptext" style="text-align:center">
          Principal: <b style="color:var(--text)">${esc(primary.join(" y "))}</b>${secondary.length?` · También: ${esc(secondary.join(", "))}`:""}
        </div>
      </div>
    `;
  }

  // Miniatura para listas (rutina/sesión): prioridad = imagen propia del
  // usuario (link pegado) > foto oficial cargada por Juan para ese ejercicio
  // > diagrama muscular automático.
  function exerciseThumbHtml(ex, sizeStyle){
    const url = (ex && ex.imagenUrl) || exerciseImageFor(ex ? ex.nombre : "");
    if(url){
      return `<img src="${esc(url)}" style="${sizeStyle}; object-fit:contain; border-radius:8px; background:var(--surface-2)" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`;
    }
    const m = muscleTargets(ex ? ex.nombre : "");
    if(!m) return "";
    return `<div class="muscle-diagram-pic" style="${sizeStyle}">${bodyDiagramSvg(m.diagram, m.list)}</div>`;
  }

  // Gráfico de línea peso-a-lo-largo-del-tiempo para la pestaña "Estadísticas"
  // de la ficha de ejercicio — mismo estilo que el sparkline de Registro, pero
  // más grande y con eje de fechas.
  function exerciseLineChart(historyAsc){
    const w = 300, h = 140, padX = 10, padY = 18;
    const weights = historyAsc.map(r=> parseFloat(r.peso)||0);
    const best = Math.max(...weights);
    const min = Math.min(...weights);
    const range = (best-min)||1;
    const pts = weights.map((val,i)=>{
      const x = weights.length===1 ? w/2 : (i/(weights.length-1))*(w-padX*2)+padX;
      const y = h - padY - ((val-min)/range)*(h-padY*2);
      return [x,y];
    });
    const path = pts.map((p,i)=> (i===0?"M":"L")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
    const first = historyAsc[0], last = historyAsc[historyAsc.length-1];
    return `
      <div class="exchart-wrap">
        <svg class="exchart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
          <line x1="0" y1="${h-padY}" x2="${w}" y2="${h-padY}" stroke="var(--border)" stroke-width="1"/>
          <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          ${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="var(--accent)"/>`).join("")}
        </svg>
        <div class="row between"><span class="helptext">${esc(fmtDate(first.date))}</span><span class="helptext">${esc(fmtDate(last.date))}</span></div>
        <div class="row between" style="margin-top:8px">
          <div><div class="num" style="font-weight:700; font-size:16px">${min} kg</div><div class="helptext">Mínimo</div></div>
          <div style="text-align:right"><div class="num" style="font-weight:700; font-size:16px">${best} kg</div><div class="helptext">Mejor marca</div></div>
        </div>
      </div>
    `;
  }

  // Ficha de ejercicio (pantalla completa, no modal): equipamiento + grupo
  // muscular principal/secundario + diagrama corporal etiquetado, 3 pestañas
  // (Estadísticas / Historial / Indicaciones) que reusan datos ya existentes
  // (registros del usuario y EXERCISE_TIPS), y a la derecha una "Biblioteca"
  // con buscador + filtros para saltar a otro ejercicio sin salir de la
  // pantalla. En mobile se apila en una sola columna con un selector arriba
  // para alternar entre "Detalle" y "Biblioteca"; en pantallas anchas (ver
  // .exdetail-layout) se muestran las dos columnas lado a lado, como en la
  // referencia que mandó Juan.
  function openExerciseDetail(exOrName, opts){
    opts = opts || {};
    const isObj = exOrName && typeof exOrName === "object";
    state.exDetail = {
      nombre: isObj ? exOrName.nombre : exOrName,
      imagenUrl: isObj ? (exOrName.imagenUrl||"") : "", // link personalizado pegado en ESTE día/sesión (si lo hay)
      tab:"stats",
      mobileView:"detail",
      filterGroup:"",
      filterEquip:"",
      filterQuery:"",
      returnTab: opts.returnTab || state.tab,
      returnExplorerGroup: state.explorerGroup,
    };
    state.tab = "exdetail";
    render();
  }

  function exerciseHistoryFor(nombre){
    return (state.registros||[]).filter(r=>r.exercise===nombre)
      .slice().sort((a,b)=> a.date<b.date?-1:(a.date>b.date?1:0));
  }
  function exStatsTabHtml(history){
    if(!history.length) return `<p class="helptext" style="text-align:center; padding:16px 0">No hay datos todavía.</p>`;
    return exerciseLineChart(history);
  }
  function exHistoryTabHtml(history){
    if(!history.length) return `<p class="helptext" style="text-align:center; padding:16px 0">No hay datos todavía.</p>`;
    const desc = history.slice().reverse();
    return `<div class="loglist">${desc.map(r=>`
      <div class="logrow">
        <div><div class="lex">${esc(fmtDate(r.date))}</div>${r.nota?`<div class="ldate">${esc(r.nota)}</div>`:""}</div>
        <div><div class="lval num">${esc(r.peso)} kg</div><div class="lsub">${esc(r.series||"-")}×${esc(r.reps||"-")}</div></div>
      </div>
    `).join("")}</div>`;
  }
  function exTipsTabHtml(nombre){
    const tips = EXERCISE_TIPS[nombre] || [];
    if(!tips.length) return `<p class="helptext" style="text-align:center; padding:16px 0">Todavía no hay consejos de técnica cargados para este ejercicio.</p>`;
    return `<div class="tips-box"><ul class="tips-list">${tips.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`;
  }

  // Catálogo completo para la Biblioteca: todo EXERCISES, con su grupo
  // muscular (o "Cardio / funcional" si no tiene entrada en MUSCLE_MAP) y su
  // equipamiento — para poder buscar y filtrar sin inventar una fuente de
  // datos paralela.
  function exerciseLibraryCatalog(){
    return EXERCISES.map(n=>({
      nombre:n,
      group: exerciseMuscleGroup(n) || "Cardio / funcional",
      equip: exerciseEquipment(n),
    })).sort((a,b)=>a.nombre.localeCompare(b.nombre,"es"));
  }

  function screenExerciseDetail(){
    const d = state.exDetail;
    const nombre = d.nombre;
    const history = exerciseHistoryFor(nombre);
    const m = muscleTargets(nombre);
    const groups = exercisePrincipalSecondaryGroups(nombre);
    const equip = exerciseEquipment(nombre);
    // El link que el usuario pegó a mano (imagenUrl) es siempre una foto/link propio,
    // así que el video oficial solo se muestra cuando NO hay un link personalizado.
    const videoUrl = !d.imagenUrl ? exerciseVideoFor(nombre) : null;
    const photoUrl = d.imagenUrl || exerciseImageFor(nombre);
    const mediaUrl = videoUrl || photoUrl;
    const photoBlock = videoUrl ? `
      <div style="display:flex; justify-content:center">
        <video class="howto-photo" autoplay muted loop playsinline src="${esc(videoUrl)}"></video>
      </div>
    ` : (photoUrl ? `
      <div style="display:flex; justify-content:center">
        <img src="${esc(photoUrl)}" class="howto-photo" alt="${esc(nombre)}" onerror="this.style.display='none'">
      </div>
    ` : "");
    const diagramBlock = m ? `
      <div style="display:flex; justify-content:center">
        <div class="howto-pic howto-pic-labeled">${bodyDiagramSvgLabeled(m.diagram, m.list)}</div>
      </div>
    ` : (mediaUrl ? "" : `<p class="helptext" style="text-align:center">Todavía no hay datos de músculo cargados para este ejercicio.</p>`);
    const tabContent = d.tab==="stats" ? exStatsTabHtml(history) : d.tab==="history" ? exHistoryTabHtml(history) : exTipsTabHtml(nombre);

    const catalog = exerciseLibraryCatalog();
    const equipOptions = Array.from(new Set(catalog.map(x=>x.equip))).sort((a,b)=>a.localeCompare(b,"es"));
    const q = normalizeTxt(d.filterQuery);
    const filtered = catalog.filter(x=>{
      if(d.filterGroup && x.group!==d.filterGroup) return false;
      if(d.filterEquip && x.equip!==d.filterEquip) return false;
      if(q && !normalizeTxt(x.nombre).includes(q)) return false;
      return true;
    });

    const detailCol = `
      <div class="exdetail-col detail-col" data-col="detail" ${d.mobileView!=="detail" ? "hidden" : ""}>
        <h2 style="font-size:22px; margin-bottom:4px">${esc(nombre)}</h2>
        <div class="card exdetail-toprow">
          <div class="exdetail-meta">
            <div>Equipamiento: <b>${esc(equip)}</b></div>
            <div>Grupo muscular principal: <b>${esc(groups.principal||"No disponible")}</b></div>
            ${groups.secondary ? `<div>Grupo muscular secundario: <b>${esc(groups.secondary)}</b></div>` : ""}
          </div>
          ${mediaUrl ? photoBlock : diagramBlock}
        </div>
        ${mediaUrl && m ? diagramBlock : ""}
        <div class="segmented" style="margin-top:14px">
          <button data-extab="stats" class="${d.tab==="stats"?"active":""}">Estadísticas</button>
          <button data-extab="history" class="${d.tab==="history"?"active":""}">Historial</button>
          <button data-extab="tips" class="${d.tab==="tips"?"active":""}">Indicaciones</button>
        </div>
        <div class="card" style="margin-top:10px">${tabContent}</div>
      </div>
    `;
    const libraryCol = `
      <div class="exdetail-col library-col" data-col="library" ${d.mobileView!=="library" ? "hidden" : ""}>
        <div class="card stack">
          <button class="btn btn-outline btn-block" id="btn-ex-custom">${icon("plus")} Ejercicio personalizado</button>
          <div class="exlib-filters">
            <div class="field-row">
              <div class="field">
                <label>Equipamiento</label>
                <select id="exlib-equip">
                  <option value="">Todo el equipamiento</option>
                  ${equipOptions.map(e=>`<option value="${esc(e)}" ${d.filterEquip===e?"selected":""}>${esc(e)}</option>`).join("")}
                </select>
              </div>
              <div class="field">
                <label>Grupo muscular</label>
                <select id="exlib-group">
                  <option value="">Todos los grupos</option>
                  ${MUSCLE_GROUPS.concat(["Cardio / funcional"]).map(g=>`<option value="${esc(g)}" ${d.filterGroup===g?"selected":""}>${esc(g)}</option>`).join("")}
                </select>
              </div>
            </div>
            <div class="field">
              <label>Buscar</label>
              <input type="text" id="exlib-search" placeholder="Buscar ejercicios" value="${esc(d.filterQuery)}">
            </div>
          </div>
          <div class="section-title" style="margin-top:2px"><h2 style="font-size:15px">Todos los ejercicios</h2><span class="muted">${filtered.length}</span></div>
          <div class="exlib-list">
            ${filtered.length ? filtered.map(x=>`
              <div class="exlib-row ${x.nombre===nombre?"active":""}" data-exlib="${esc(x.nombre)}">
                ${exerciseThumbHtml({nombre:x.nombre}, "width:30px;height:36px;flex:none")}
                <div style="min-width:0">
                  <div class="exlib-name">${esc(x.nombre)}</div>
                  <div class="exlib-cap">${esc(x.group)}</div>

            `).join("") : `<p class="helptext" style="padding:10px 0">Ningún ejercicio coincide con estos filtros.</p>`}
          </div>
        </div>

    `;

    return `
      <div class="exdetail-mobile-toggle segmented" style="margin-bottom:2px">
        <button data-exview="detail" class="${d.mobileView==="detail"?"active":""}">Detalle</button>
        <button data-exview="library" class="${d.mobileView==="library"?"active":""}">Biblioteca</button>

  function renderExerciseDetail(){
    app.classList.add("app-wide");
    app.innerHTML = `
      <div class="topbar">
        <span class="iconbtn" id="btn-exdetail-back">${icon("back")}</span>
        <h1 style="font-size:18px; flex:1; text-align:center">Ficha del ejercicio</h1>
        <span style="width:30px"></span>
      </div>
      <main><div class="screen" id="screen"></div></main>
    `;
    document.getElementById("btn-exdetail-back").onclick = ()=>{
      const d = state.exDetail;
      state.tab = (d && d.returnTab) || "rutina";
      state.explorerGroup = d ? d.returnExplorerGroup : null;
      state.exDetail = null;
      render();
    };
    document.getElementById("screen").innerHTML = screenExerciseDetail();
    mountExerciseDetail();
  }

  function mountExerciseDetail(){
    const el = document.getElementById("screen");
    const d = state.exDetail;
    el.querySelectorAll("[data-extab]").forEach(b=>{
      b.onclick = ()=>{ d.tab = b.dataset.extab; renderScreenExerciseDetail(); };
    });
    el.querySelectorAll("[data-exview]").forEach(b=>{
      b.onclick = ()=>{ d.mobileView = b.dataset.exview; renderScreenExerciseDetail(); };
    });
    el.querySelectorAll("[data-exlib]").forEach(row=>{
      row.onclick = ()=>{
        d.nombre = row.dataset.exlib;
        d.imagenUrl = ""; // el link personalizado era del ejercicio anterior, no de este
        d.tab = "stats";
        d.mobileView = "detail";
        renderScreenExerciseDetail();
      };
    });
    const equipSel = el.querySelector("#exlib-equip");
    if(equipSel) equipSel.onchange = ()=>{ d.filterEquip = equipSel.value; renderScreenExerciseDetail(); };
    const groupSel = el.querySelector("#exlib-group");
    if(groupSel) groupSel.onchange = ()=>{ d.filterGroup = groupSel.value; renderScreenExerciseDetail(); };
    const searchInp = el.querySelector("#exlib-search");
    if(searchInp) searchInp.oninput = ()=>{ d.filterQuery = searchInp.value; renderScreenExerciseDetail(); };
    const customBtn = el.querySelector("#btn-ex-custom");
    if(customBtn) customBtn.onclick = ()=>{
      const m = openModal(`
        <h3>Ejercicio personalizado</h3>
        <p class="helptext" style="font-size:14px; color:var(--text)">Podés agregar cualquier ejercicio, con el nombre que quieras, al crear o editar un día de tu rutina — no hace falta que esté en esta biblioteca.</p>
        <div class="modal-actions"><button class="btn btn-primary btn-block" data-act="ok">Entendido</button></div>
      `);
      m.querySelector('[data-act="ok"]').onclick = closeModal;
    };
  }

  // Re-renderiza solo el contenido de la ficha (mantiene el foco del buscador
  // más natural que un render() completo) — usado por todos los handlers
  // internos de la pantalla.
  function renderScreenExerciseDetail(){
    const el = document.getElementById("screen");
    if(!el) return;
    const searchHadFocus = document.activeElement && document.activeElement.id==="exlib-search";
    el.innerHTML = screenExerciseDetail();
    mountExerciseDetail();
    if(searchHadFocus){
      const inp = el.querySelector("#exlib-search");
      if(inp){ inp.focus(); inp.selectionStart = inp.selectionEnd = inp.value.length; }
    }
  }

  function normalizeTxt(s){
    return (s||"").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
  }

  function exerciseSuggestions(query, extra){
    const q = normalizeTxt(query);
    if(!q) return [];
    const pool = new Set();
    (extra||[]).forEach(n=> n && pool.add(n));
    EXERCISES.forEach(n=> pool.add(n));
    const starts = [], contains = [];
    pool.forEach(name=>{
      const nn = normalizeTxt(name);
      if(nn===q) return;
      if(nn.startsWith(q)) starts.push(name);
      else if(nn.includes(q)) contains.push(name);
    });
    starts.sort((a,b)=>a.localeCompare(b,"es"));
    contains.sort((a,b)=>a.localeCompare(b,"es"));
    return starts.concat(contains).slice(0,6);
  }

  function attachAutocomplete(input, listEl, extraProvider, onSelect){
    if(!input || !listEl) return;
    function update(){
      const q = input.value;
      const sugg = q.trim() ? exerciseSuggestions(q, extraProvider?extraProvider():[]) : [];
      if(sugg.length===0){ listEl.innerHTML=""; listEl.style.display="none"; return; }
      listEl.innerHTML = sugg.map(s=>`<div class="ac-item" data-val="${esc(s)}">${esc(s)}</div>`).join("");
      listEl.style.display = "block";
      listEl.querySelectorAll(".ac-item").forEach(it=>{
        it.addEventListener("mousedown", (e)=>{
          e.preventDefault();
          input.value = it.dataset.val;
          listEl.innerHTML = ""; listEl.style.display = "none";
          input.focus();
          if(onSelect) onSelect(input.value);
        });
      });
    }
    input.addEventListener("input", update);
    input.addEventListener("focus", update);
    input.addEventListener("blur", ()=>{ setTimeout(()=>{ listEl.style.display="none"; }, 120); });
  }

  /* ---------- Utilities ---------- */
  function uid(){ return Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function fmtDate(s){
    if(!s) return "";
    const [y,m,d]=s.split("-");
    const meses=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
    return `${parseInt(d,10)} ${meses[parseInt(m,10)-1]}`;
  }
  function initials(name){
    return (name||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
  }
  function lsGet(k, fallback){ try{ const v = localStorage.getItem(k); return v===null?fallback:JSON.parse(v);}catch(e){ return fallback; } }
  function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  function deepClone(o){
    try{ return structuredClone(o); }catch(e){ return JSON.parse(JSON.stringify(o)); }
  }

  /* ---------- Frases motivacionales ---------- */
  const FRASES = [
    "Cada serie cuenta, aunque hoy rindas menos.",

  function fraseDelDia(){
    const start = new Date(new Date().getFullYear(),0,0);
    const dayOfYear = Math.floor((new Date()-start)/86400000);
    return FRASES[dayOfYear % FRASES.length];
  }

  /* ---------- Racha / meta semanal ---------- */
  function isoWeekMonday(d){
    const day = (d.getDay()+6)%7; // 0=lunes .. 6=domingo
    const monday = new Date(d.getFullYear(), d.getMonth(), d.getDate()-day);
    return monday;
  }
  function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function computeRacha(entrenos, metaSemanal){
    const goal = metaSemanal>0 ? metaSemanal : 3;
    const today = new Date();
    const curMonday = isoWeekMonday(today);
    const byWeek = {};
    (entrenos||[]).forEach(e=>{
      if(!e.date) return;
      const parts = e.date.split("-").map(n=>parseInt(n,10));
      const d = new Date(parts[0], parts[1]-1, parts[2]);
      const key = ymd(isoWeekMonday(d));
      byWeek[key] = (byWeek[key]||0)+1;
    });
    const curKey = ymd(curMonday);
    const thisWeekCount = byWeek[curKey]||0;
    const remaining = Math.max(0, goal-thisWeekCount);
    const todayIdx = (today.getDay()+6)%7;
    const daysLeft = 7-todayIdx;
    let streak = 0;
    let cursor = new Date(curMonday.getFullYear(), curMonday.getMonth(), curMonday.getDate()-7);
    while(streak<104){
      const key = ymd(cursor);
      const count = byWeek[key]||0;
      if(count>=goal){ streak++; cursor = new Date(cursor.getFullYear(), cursor.getMonth(), cursor.getDate()-7); }
      else break;
    }
    return { goal, thisWeekCount, remaining, daysLeft, streak };
  }

  /* ---------- Store abstraction (Supabase con autenticación real por correo) ---------- */
  const Store = (function(){
    let sb = null;
    function client(){
      if(!sb) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      return sb;
    }

    function onAuthStateChange(cb){
      return client().auth.onAuthStateChange((event, session)=> cb(event, session));
    }

    async function signUp(email, password, extra){
      return await client().auth.signUp({ email, password, options: { data: extra||{} } });
    }
    async function signIn(email, password){
      return await client().auth.signInWithPassword({ email, password });
    }
    async function signOut(){
      await client().auth.signOut();
    }
    async function resetPassword(email){
      return await client().auth.resetPasswordForEmail(email, { redirectTo: window.location.origin });
    }
    async function updatePassword(newPassword){
      return await client().auth.updateUser({ password: newPassword });
    }

    function rowToProfile(r){
      return {
        id: r.id, name: r.name, metaSemanal: r.meta_semanal||3, createdAt: r.created_at||0,
        edad: r.edad||null, peso: r.peso_estimado||null,
      };
    }

    async function ensureProfile(user){
      const sbc = client();
      const { data, error } = await sbc.from("profiles").select("*").eq("id", user.id).maybeSingle();
      if(error) throw error;
      if(data) return rowToProfile(data);
      const meta = (user.user_metadata) || {};
      const name = meta.name || (user.email ? user.email.split("@")[0] : "Usuario");
      const row = {
        id: user.id, name, meta_semanal: meta.metaSemanal || 3, created_at: Date.now(),
        edad: meta.edad || null, peso_estimado: meta.peso || null,
      };
      const { data: inserted, error: err2 } = await sbc.from("profiles").insert(row).select().single();
      if(err2) throw err2;
      return rowToProfile(inserted);
    }

    async function updateProfile(id, data){
      const row = {};
      if("name" in data) row.name = data.name;
      if("metaSemanal" in data) row.meta_semanal = data.metaSemanal;
      if("edad" in data) row.edad = data.edad;
      if("peso" in data) row.peso_estimado = data.peso;
      const { error } = await client().from("profiles").update(row).eq("id", id);
      return !error;
    }

    async function getRutina(pid){
      const { data, error } = await client().from("rutinas").select("data").eq("profile_id", pid).maybeSingle();
      if(error) throw error;
      return (data && data.data) ? deepClone(data.data) : { days: [] };
    }

    async function saveRutina(pid, data){
      const { error } = await client().from("rutinas").upsert({ profile_id: pid, data: data }, { onConflict: "profile_id" });
      return !error;
    }

    function rowToRegistro(r){
      return { id: r.id, exercise: r.exercise, peso: r.peso, date: r.date, series: r.series||"", reps: r.reps||"", nota: r.nota||"", createdAt: r.created_at||0 };
    }

    async function addRegistro(pid, data){
      const row = { profile_id: pid, exercise: data.exercise, peso: data.peso, date: data.date, series: data.series||"", reps: data.reps||"", nota: data.nota||"", created_at: data.createdAt||Date.now() };
      const { error } = await client().from("registros").insert(row);
      return !error;
    }

    async function deleteRegistro(pid, id){
      const { error } = await client().from("registros").delete().eq("id", id).eq("profile_id", pid);
      return !error;
    }

    async function listRegistros(pid){
      const { data, error } = await client().from("registros").select("*").eq("profile_id", pid)
        .order("date",{ascending:false}).order("created_at",{ascending:false}).limit(300);
      if(error) throw error;
      return (data||[]).map(rowToRegistro);
    }

    function rowToEntreno(r){
      return { id: r.id, date: r.date, dayId: r.day_id, dayNombre: r.day_nombre, setsCompletados: r.sets_completados, setsTotales: r.sets_totales, createdAt: r.created_at||0 };
    }

    async function addEntreno(pid, data){
      const row = { profile_id: pid, date: data.date, day_id: data.dayId, day_nombre: data.dayNombre, sets_completados: data.setsCompletados, sets_totales: data.setsTotales, created_at: data.createdAt||Date.now() };
      const { error } = await client().from("entrenos").insert(row);
      return !error;
    }

    async function listEntrenos(pid){
      const { data, error } = await client().from("entrenos").select("*").eq("profile_id", pid)
        .order("date",{ascending:false}).order("created_at",{ascending:false}).limit(200);
      if(error) throw error;
      return (data||[]).map(rowToEntreno);
    }

    return { onAuthStateChange, signUp, signIn, signOut, resetPassword, updatePassword, ensureProfile, updateProfile, getRutina, saveRutina, addRegistro, deleteRegistro, listRegistros, addEntreno, listEntrenos };
  })();

  function mapAuthError(error){
    const msg = (error && error.message) || "";
    if(/invalid login credentials/i.test(msg)) return "Correo o contraseña incorrectos.";
    if(/user already registered/i.test(msg)) return "Ya existe una cuenta con ese correo.";
    if(/email not confirmed/i.test(msg)) return "Todavía no confirmaste tu correo. Revisá tu bandeja de entrada.";
    if(/password should be at least/i.test(msg)) return "La contraseña tiene que tener al menos 6 caracteres.";
    if(/unable to validate email/i.test(msg) || /invalid email/i.test(msg)) return "Ese correo no parece válido.";
    if(/rate limit/i.test(msg)) return "Demasiados intentos. Esperá un minuto y probá de nuevo.";
    return msg || "Ocurrió un error. Probá de nuevo.";
  }

  /* ---------- Generic modal helper ---------- */
  function closeModal(){
    const back = document.querySelector(".modal-back");
    if(back) back.remove();
    document.removeEventListener("keydown", escHandler);
  }
  function escHandler(e){ if(e.key==="Escape") closeModal(); }
  function openModal(innerHtml, onMount){
    closeModal();
    const back = document.createElement("div");
    back.className = "modal-back";
    back.innerHTML = `<div class="modal">${innerHtml}</div>`;
    back.addEventListener("click", (e)=>{ if(e.target===back) closeModal(); });
    document.body.appendChild(back);
    document.addEventListener("keydown", escHandler);
    if(onMount) onMount(back.querySelector(".modal"));
    return back.querySelector(".modal");
  }

  function confirmDialog(title, msg, confirmLabel){
    return new Promise(resolve=>{
      const m = openModal(`
        <h3>${esc(title)}</h3>
        <p class="helptext" style="font-size:14px;color:var(--text)">${esc(msg)}</p>
        <div class="modal-actions">

          <button class="btn btn-danger" data-act="ok">${esc(confirmLabel||"Eliminar")}</button>
        </div>
      `);
      m.querySelector('[data-act="cancel"]').onclick = ()=>{ closeModal(); resolve(false); };
      m.querySelector('[data-act="ok"]').onclick = ()=>{ closeModal(); resolve(true); };
    });
  }

  async function loadProfileData(){
    if(!state.profile) return;
    const [raw, registros, entrenos] = await Promise.all([
      Store.getRutina(state.profile.id),
      Store.listRegistros(state.profile.id),
      Store.listEntrenos(state.profile.id),
    ]);
    // Desde v19 se guardan DOS rutinas por cuenta ("personalizada" la que arma
    // el usuario a mano, "automatica" la última que generó el botón de rutina
    // automática) más cuál de las dos está activa en este momento. Si lo que
    // viene de la base es el formato viejo (una sola rutina, de antes de v19),
    // se migra sola tratándola como "personalizada" sin perder nada.
    let slots;
    if(raw && (raw.personalizada || raw.automatica)){
      slots = {
        personalizada: (raw.personalizada && raw.personalizada.days) ? raw.personalizada : { days: [] },
        automatica: (raw.automatica && raw.automatica.days) ? raw.automatica : { days: [] },
      };
      state.activeSlot = raw.activeSlot === "automatica" ? "automatica" : "personalizada";
    } else {
      slots = { personalizada: (raw && raw.days) ? raw : { days: [] }, automatica: { days: [] } };
      state.activeSlot = "personalizada";
    }
    state.rutinaSlots = slots;
    state.rutina = slots[state.activeSlot];
    state.registros = registros || [];
    state.entrenos = entrenos || [];
  }

  // Guarda las DOS rutinas (personalizada + automática) y cuál está activa,
  // en una sola fila de la base (misma tabla `rutinas` de siempre). Como
  // `state.rutina` es siempre el MISMO objeto que `state.rutinaSlots[state.activeSlot]`
  // (por referencia), cualquier cambio hecho sobre `state.rutina.days` ya está
  // reflejado en `state.rutinaSlots` antes de llamar a esta función.
  async function persistRutina(){
    await Store.saveRutina(state.profile.id, {
      personalizada: state.rutinaSlots.personalizada,
      automatica: state.rutinaSlots.automatica,
      activeSlot: state.activeSlot,
    });
  }

  async function selectRutinaSlot(slot){
    if(state.activeSlot === slot) return;
    state.activeSlot = slot;
    state.rutina = state.rutinaSlots[slot];
    await persistRutina();
    renderScreen();
  }

  /* ================= RUTINA ================= */

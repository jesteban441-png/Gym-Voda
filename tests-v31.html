    // El toast final de openSessionLogModal sólo se muestra si persistRutina()
    // salió bien, y en el harness no hay contexto de persistencia cargado. Se
    // sustituye rutinaSync.save —que es una propiedad de objeto, no una
    // referencia de función capturada en el closure— para que el borrador se
    // dé por guardado y el camino llegue hasta el aviso.
    async function conGuardadoOk(c, fn){
      // persistRutina() escribe state.persistence y state.rutinaRaw cuando el
      // guardado sale bien. Con el stub eso ocurre de verdad, asi que las dos
      // claves se restauran: un clienteV48:false colado aca cambiaria el camino
      // de cualquier prueba posterior.
      var prevPers = c.T.state.persistence, prevRaw = c.T.state.rutinaRaw;
      var prev = c.T.rutinaSync.save;
      c.T.rutinaSync.save = function(data){
        return Promise.resolve({ ok:true, envelope:{ data:data, revision:1, clienteV48:false, schemaReady:true } });
      };
      // Se AWAITEA dentro del try: con `return fn()` el finally restauraba el
      // stub en cuanto fn devolvia la promesa, antes de que el handler llegara
      // a persistir, y persistRutina volvia a hablar con el Store real.
      try { return await fn(); } finally {
        c.T.rutinaSync.save = prev;
        c.T.state.persistence = prevPers; c.T.state.rutinaRaw = prevRaw;
      }
    }

    /* ===================================================================
       V50.3 — guardado y finalización (O1 · O2 · O3).

       O1 se prueba contra rutinaSync.save, que es una PROPIEDAD de objeto y sí
       se puede sustituir (persistRutina es una referencia de closure y no).
       Contar las llamadas a save es además la medida que importa: ahí ocurre el
       clone() sincrónico del documento y de ahí sale la transacción de IndexedDB.
       =================================================================== */

    group("V50.3 — guardado y finalización");

    // Deja la cola en reposo y restaura todo lo que se sustituye.
    async function conCola(fn){
      var W = frame.contentWindow, T = W.__appTest;
      var prev = {
        save: T.rutinaSync.save, profile: T.state.profile,
        slots: T.state.rutinaSlots, activeSlot: T.state.activeSlot,
        raw: T.state.rutinaRaw, pers: T.state.persistence, session: T.state.session
      };
      T.state.profile = { id:"perfil-v503", name:"Test", edad:30, sexo:"m" };
      T.state.rutinaSlots = { personalizada:{days:[]}, automatica:{days:[]}, enfocada:{days:[]} };
      T.state.activeSlot = "personalizada";
      T.state.session = null;
      var reg = { llamadas:0, snapshots:[], resolvers:[] };
      // save() guarda el snapshot recibido y NO resuelve hasta que el test lo diga:
      // así se puede hacer llegar un cambio mientras hay un guardado en curso.
      T.rutinaSync.save = function(data){
        reg.llamadas++;
        reg.snapshots.push(JSON.parse(JSON.stringify(data)));
        return new Promise(function(resolve){
          reg.resolvers.push(function(){ resolve({ ok:true, envelope:{ data:data, revision:1, clienteV48:false, schemaReady:true } }); });
        });
      };
      reg.resolverUno = function(){ var r = reg.resolvers.shift(); if(r) r(); };
      reg.resolverTodos = async function(){ for(var i=0;i<8 && reg.resolvers.length;i++){ reg.resolverUno(); await flush(); } };
      T.borradorV48.reiniciarMedicion();
      try { return await fn({ T:T, W:W, reg:reg }); }
      finally {
        await reg.resolverTodos();
        await flush();
        T.rutinaSync.save = prev.save; T.state.profile = prev.profile;
        T.state.rutinaSlots = prev.slots; T.state.activeSlot = prev.activeSlot;
        T.state.rutinaRaw = prev.raw; T.state.persistence = prev.pers; T.state.session = prev.session;
      }
    }

       REESCRITO: hubo una versión con cola de coalescencia y se retiró por
       decisión de producto —simplicidad y durabilidad antes que una mejora de
       rendimiento que no se pudo demostrar (0,37 ms de CPU y 0,30 ms de
       IndexedDB por escritura en escritorio, sin superposición al tipear)—.
       Estas pruebas afirman el comportamiento FINAL: guardado inmediato, igual
       que en 18062d2, más la posibilidad de ESPERAR la escritura en curso.
       Las aserciones no se aflojaron: cambiaron de signo porque cambió la
       decisión, y las que protegen la durabilidad se endurecieron. */

    // Cuenta las lecturas de una recarga de datos. readRutina lanza un error de
    // red a propósito: loadProfileData lo absorbe (networkUnavailable), así que
    // el bloque nativo queda neutralizado sin necesitar el reconciliador, y lo
    // que se mide es exactamente cuántos pedidos se disparan.
    async function contarLecturas(opciones){
      var W = frame.contentWindow, T = W.__appTest, S = T.Store;
      var prev = {
        read: S.readRutina, peso: S.listPesoCorporal, reg: S.listRegistros, ent: S.listEntrenos,
        load: T.rutinaSync.load, save: T.rutinaSync.save,
        profile: T.state.profile, slots: T.state.rutinaSlots, activeSlot: T.state.activeSlot,
        raw: T.state.rutinaRaw, pers: T.state.persistence, session: T.state.session,
        registros: T.state.registros, entrenos: T.state.entrenos,
        pesoCorporal: T.state.pesoCorporal, pesoError: T.state.pesoCorporalError,
        tab: T.state.tab, offline: T.state.nativeOffline, issue: T.state.nativeReconcileIssue,
        histPend: T.state.historyRefreshPending
      };
      var n = { readRutina:0, peso:0, registros:0, entrenos:0, syncLoad:0 };
      T.state.profile = { id:"perfil-v503-o2", name:"Test", edad:30, sexo:"m" };
      T.state.pesoCorporal = [{ id:"p1", fecha:"2026-01-01", peso:80 }];
      T.state.pesoCorporalError = null;
      S.readRutina = function(){ n.readRutina++; return Promise.reject(new TypeError("Failed to fetch")); };
      S.listPesoCorporal = function(){ n.peso++; return Promise.resolve([]); };
      S.listRegistros = function(){ n.registros++; return Promise.resolve([]); };
      S.listEntrenos = function(){ n.entrenos++; return Promise.resolve([]); };
      T.rutinaSync.load = function(){
        n.syncLoad++;
        return Promise.resolve({ ok:true, data:{ personalizada:{days:[]}, automatica:{days:[]}, enfocada:{days:[]}, activeSlot:"personalizada" },
          revision:7, clienteV48:false, schemaReady:true });
      };
      T.rutinaSync.save = function(){ return Promise.resolve({ ok:true, envelope:{ data:{}, revision:7 } }); };
      try { await T.loadProfileData(opciones); return n; }
      finally {
        S.readRutina = prev.read; S.listPesoCorporal = prev.peso; S.listRegistros = prev.reg; S.listEntrenos = prev.ent;
        T.rutinaSync.load = prev.load; T.rutinaSync.save = prev.save;
        T.state.profile = prev.profile; T.state.rutinaSlots = prev.slots; T.state.activeSlot = prev.activeSlot;
        T.state.rutinaRaw = prev.raw; T.state.persistence = prev.pers; T.state.session = prev.session;
        T.state.registros = prev.registros; T.state.entrenos = prev.entrenos;
        T.state.pesoCorporal = prev.pesoCorporal; T.state.pesoCorporalError = prev.pesoError;
        T.state.tab = prev.tab; T.state.nativeOffline = prev.offline;
        T.state.nativeReconcileIssue = prev.issue; T.state.historyRefreshPending = prev.histPend;
      }
    }

    /* ===================================================================
       V50.6A — Rutina: cuatro pestañas, cada una con sus acciones.

       La prueba que de verdad importa acá es que "especial" NO se filtre al
       modelo de persistencia: ni a RUTINA_SLOTS, ni a state.activeSlot, ni al
       blob guardado. Si se filtrara, state.rutina quedaría undefined y la
       pantalla rompería; y un activeSlot:"especial" guardado se degradaría solo
       a "personalizada" en la próxima carga, perdiendo la pestaña en silencio.
       =================================================================== */

    group("V50.6A — Rutina: cuatro pestañas");

    // Monta las tres rutinas con contenido distinguible y restaura todo.
    async function conRutinaV506(fn){
      var W = frame.contentWindow, T = W.__appTest;
      var prev = {
        slots: T.state.rutinaSlots, activeSlot: T.state.activeSlot, rutina: T.state.rutina,
        vista: T.state.rutinaVista, session: T.state.session, unresolved: T.state.unresolvedSession,
        profile: T.state.profile, entrenos: T.state.entrenos, registros: T.state.registros,
        save: T.rutinaSync.save, tab: T.state.tab
      };
      var dia = function(id, nombre, exId){
        return { id:id, nombre:nombre, exercises:[{ id:exId, nombre:"Press de banca con barra", series:"3", reps:"10", notas:"", imagenUrl:"" }] };
      };
      T.state.profile = { id:"perfil-506a", name:"Test", edad:30, sexo:"m" };
      T.state.rutinaSlots = {
        personalizada:{ days:[dia("p1","Día propio 1","xp1"), dia("p2","Día propio 2","xp2")] },
        automatica:{ days:[dia("a1","Día auto 1","xa1")] },
        enfocada:{ days:[dia("e1","Día enfocado 1","xe1"), dia("e2","Día enfocado 2","xe2"), dia("e3","Día enfocado 3","xe3")] }
      };
      T.state.activeSlot = "personalizada";
      T.state.rutina = T.state.rutinaSlots.personalizada;
      T.state.rutinaVista = null;
      T.state.session = null; T.state.unresolvedSession = null;
      T.state.entrenos = []; T.state.registros = [];
      var guardados = [];
      T.rutinaSync.save = function(data){
        guardados.push(JSON.parse(JSON.stringify(data)));
        return Promise.resolve({ ok:true, envelope:{ data:data, revision:1, clienteV48:false, schemaReady:true } });
      };
      try { return await fn({ T:T, W:W, guardados:guardados }); }
      finally {
        T.rutinaSync.save = prev.save;
        T.state.rutinaSlots = prev.slots; T.state.activeSlot = prev.activeSlot;
        T.state.rutina = prev.rutina; T.state.rutinaVista = prev.vista;
        T.state.session = prev.session; T.state.unresolvedSession = prev.unresolved;
        T.state.profile = prev.profile; T.state.entrenos = prev.entrenos;
        T.state.registros = prev.registros; T.state.tab = prev.tab;
      }
    }

    test("V50.6A — iPhone 375 px: la tira entra en una línea y no desborda", function(){
      var W = frame.contentWindow, D = W.document;
      var host = D.createElement("div");
      // Mismo ancho útil que la pantalla en un iPhone SE/8/13 mini: 375 menos el
      // padding lateral de .screen.
      host.style.cssText = "position:fixed; left:-9999px; top:0; width:351px;";
      host.innerHTML = '<div class="segmented seg-4">' +
        A.RUTINA_VISTAS.map(function(v){
          var n = v === "personalizada" ? 2 : v === "enfocada" ? 3 : v === "automatica" ? 1 : 0;
          return '<button data-rutina-vista="' + v + '">' + A.RUTINA_VISTA_LABELS[v] +
            (n ? '<span class="seg-n">' + n + ' día' + (n===1?"":"s") + '</span>' : "") + '</button>';
        }).join("") + '</div>';
      D.body.appendChild(host);
      try {
        var tira = host.querySelector(".segmented");
        var botones = Array.from(host.querySelectorAll("button"));
        assert(botones.length === 4, "cuatro botones, dio " + botones.length);
        assert(tira.scrollWidth <= tira.clientWidth + 1,
          "la tira desborda: scrollWidth " + tira.scrollWidth + " > clientWidth " + tira.clientWidth);
        // Ninguno puede quedar más alto que los otros: eso delataría un rótulo
        // partido en dos líneas y una tira despareja.
        var altos = botones.map(function(b){ return Math.round(b.getBoundingClientRect().height); });
        assert(Math.max.apply(null, altos) - Math.min.apply(null, altos) <= 1,
          "los botones quedaron de alturas distintas (rótulo partido): " + altos.join(","));
        // Y el rótulo no puede estar recortado por overflow.
        var recortados = botones.filter(function(b){ return b.scrollWidth > b.clientWidth + 1; })
          .map(function(b){ return b.textContent.trim(); });
        assert(recortados.length === 0, "rótulos recortados: " + recortados.join(" | "));
        // Área de toque: alto razonable para el pulgar, sin inflar la pantalla.
        var alto = botones[0].getBoundingClientRect().height;
        assert(alto >= 28, "la pestaña quedó demasiado baja para tocarla: " + alto.toFixed(1) + "px");
      } finally { host.remove(); }
    });

    /* ===================================================================
       V50.6B — Registro: máximo histórico, última carga y series.

       Los datos de prueba imitan lo que hay de verdad en la base:
         · filas por serie de V47  → setNumber 1..n, entrenoId null
         · filas de una sesión V48 → setNumber 1..n, entrenoId con el uuid
         · cargas del formulario   → setNumber NULL, series con el total
       Ninguna prueba reescribe un registro histórico para completarle el
       número de serie: eso es exactamente lo que no hay que hacer.
       =================================================================== */

    group("V50.6B — Registro: máximo histórico, última carga y series");

    // Historial de un mismo ejercicio, deliberadamente desordenado y con los
    // tres orígenes mezclados.
    function histV506B(){
      return [
        // Entrenamiento V47 del 10/01: tres series, la más pesada 70.
        { id:"r1", exercise:"Press de banca con barra", peso:60, date:"2026-01-10", series:"1", reps:"10", nota:"", createdAt:1000, setNumber:1, entrenoId:null },
        { id:"r3", exercise:"Press de banca con barra", peso:70, date:"2026-01-10", series:"1", reps:"8",  nota:"", createdAt:1200, setNumber:3, entrenoId:null },
        { id:"r2", exercise:"Press de banca con barra", peso:65, date:"2026-01-10", series:"1", reps:"9",  nota:"", createdAt:1100, setNumber:2, entrenoId:null },
        // Carga manual vieja, sin número de serie. El récord absoluto está acá.
        { id:"r0", exercise:"Press de banca con barra", peso:95, date:"2025-11-02", series:"4", reps:"5",  nota:"récord", createdAt:500, setNumber:null, entrenoId:null },
        // Sesión V48 del 20/01, la más reciente: la última serie es la 2, de 50 kg.
        { id:"r5", exercise:"Press de banca con barra", peso:55, date:"2026-01-20", series:"1", reps:"12", nota:"", createdAt:2000, setNumber:1, entrenoId:"E-48" },
        { id:"r6", exercise:"Press de banca con barra", peso:50, date:"2026-01-20", series:"1", reps:"12", nota:"", createdAt:2100, setNumber:2, entrenoId:"E-48" }
      ];
    }

    async function conRegistroV506B(regs, filtro, fn){
      var W = frame.contentWindow, T = W.__appTest;
      var prev = { regs:T.state.registros, hf:T.state.historyFilter, rutina:T.state.rutina,
        slots:T.state.rutinaSlots, activeSlot:T.state.activeSlot, sel:T.state.exerciseSelForm,
        expandido:T.state.historyExpanded, peso:T.state.pesoCorporal };
      T.state.registros = regs;
      T.state.historyFilter = filtro || { exercise:"", from:"", to:"" };
      T.state.pesoCorporal = T.state.pesoCorporal || [];
      try { return await fn({ T:T, W:W }); }
      finally {
        T.state.registros = prev.regs; T.state.historyFilter = prev.hf; T.state.rutina = prev.rutina;
        T.state.rutinaSlots = prev.slots; T.state.activeSlot = prev.activeSlot;
        T.state.exerciseSelForm = prev.sel; T.state.historyExpanded = prev.expandido;
        T.state.pesoCorporal = prev.peso;
      }
    }

    /* ------------------- 1. máximo histórico ------------------- */

        var v = css.match(/\d+(\.\d+)?/g).slice(0,3).map(function(n){
          var c = Number(n)/255;
          return c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4);
        });
        return 0.2126*v[0] + 0.7152*v[1] + 0.0722*v[2];
      };
      var ratio = function(a, b){
        var x = lum(a), y = lum(b), hi = Math.max(x,y), lo = Math.min(x,y);
        return (hi+0.05)/(lo+0.05);
      };
      try {
        var dot = host.querySelector(".setdot.done");
        // El número es 13px bold: NO califica como texto grande, así que el
        // umbral que corresponde es 4,5:1, no 3:1.
        [["dark", "rgb(89, 198, 138)"], ["light", "rgb(46, 158, 91)"]].forEach(function(par){
          root.setAttribute("data-theme", par[0]);
          var cs = W.getComputedStyle(dot);
          var r = ratio(cs.color, cs.backgroundColor);
          assert(cs.backgroundColor === par[1],
            "el verde de marca en " + par[0] + " no debe cambiar, dio " + cs.backgroundColor);
          assert(r >= 4.5, "contraste insuficiente en " + par[0] + ": " + r.toFixed(2) + ":1 (mínimo 4,5)");
        });
      } finally {
        host.remove();
        if(previo === null) root.removeAttribute("data-theme"); else root.setAttribute("data-theme", previo);
      }
    });

    test("M1 — los inputs del modal de registro no disparan el zoom de Safari iOS", function(){
      return conRegistroDeSerie([null,null,null], [false,false,false], async function(c){
        var m = c.abrir(0);
        var chicos = [];
        ["#slog-date", "#slog-peso", "#slog-reps", "#slog-nota"].forEach(function(id){
          var el = m.querySelector(id);
          assert(el, "falta el campo " + id);
          var px = parseFloat(c.W.getComputedStyle(el).fontSize);
          // 16px es el umbral exacto de Safari iOS: por debajo hace zoom solo.
          if(!(px >= 16)) chicos.push(id + " = " + px + "px");
        });
        assert(chicos.length === 0, "estos inputs harían zoom en iOS: " + chicos.join(", "));
        assert(m.querySelector("#slog-peso").getAttribute("inputmode") === "decimal",
          "el peso debería pedir el teclado decimal, dio " + m.querySelector("#slog-peso").getAttribute("inputmode"));
        // Reps es texto libre y admite rangos ("8-12"): un inputmode numérico
        // mostraría un teclado sin guion y haría imposible escribirlos. Por
        // eso NO lleva inputmode — es una decisión, no un olvido.
        assert(!m.querySelector("#slog-reps").hasAttribute("inputmode"),
          "reps no debe forzar teclado numérico: admite rangos como 8-12");
        assert(m.querySelector("#slog-reps").type === "text",
          "reps debe seguir siendo texto libre, dio type=" + m.querySelector("#slog-reps").type);
      });
    });

    runNext();
  }

  var frame = document.getElementById("app");
  var tries = 0;
  function waitForApp(){
    var A = null;
    try{ A = frame.contentWindow && frame.contentWindow.__appTest; }catch(e){
      summary.className = "fail";
      summary.textContent = "No se puede acceder al iframe. Abrí esta página con un servidor estático (http://), no con file://.";
      return;
    }
    if(A){ summary.textContent = "Corriendo validaciones…"; setTimeout(function(){ run(A); }, 0); return; }
    if(++tries > 120){
      summary.className = "fail";
      summary.textContent = "La app no expuso window.__appTest después de 12s.";
      return;
    }
    setTimeout(waitForApp, 100);
  }
  frame.addEventListener("load", waitForApp);
  waitForApp();
})();
</script>

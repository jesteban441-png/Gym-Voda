<!doctype html>
<meta charset="utf-8">
<title>V48.1A — Persistencia</title>
<h1>V48.1A — Persistencia</h1><pre id="results">Cargando…</pre>
<iframe id="app" src="index.html" style="width:420px;height:760px;position:absolute;left:-9999px"></iframe>
<script>
(async function(){
  const frame=document.getElementById('app');
  while(!frame.contentWindow.__appTest) await new Promise(r=>setTimeout(r,50));
  const A=frame.contentWindow.__appTest, P=A.persistence;
  const results=[];
  const assert=(v,m)=>{if(!v) throw new Error(m);};
  const clone=x=>JSON.parse(JSON.stringify(x));
  const env=data=>({data:clone(data),revision:null,clienteV48:false,schemaReady:false});
  const empty={personalizada:{days:[]},automatica:{days:[]},enfocada:{days:[]},activeSlot:'personalizada',sesionActiva:null};
  const day={id:'d',nombre:'Día de prueba',exercises:[{id:'e',nombre:'Dominadas',series:'2',reps:'8'}]};
  const legacy={...clone(empty),personalizada:{days:[day]},sesionActiva:{dayId:'d',slot:'personalizada',dayNombre:'Día de prueba',startedAt:123,sets:{e:[true,false]},setLogs:{e:[{registroId:'r',peso:0,reps:'8',date:'2026-10-18'},null]}}};
  let number=0;
  const cache=()=>P.createCache(frame.contentWindow.indexedDB,'v48-test-'+crypto.randomUUID());
  const memoryRepo=data=>({read:async()=>env(data),write:async(_u,value)=>({ok:true,envelope:env(value)})});
  async function test(name,fn){
    try {await fn();results.push({name,ok:true});} catch(e){results.push({name,ok:false,error:e.message});}
    document.getElementById('results').textContent=results.map(x=>(x.ok?'OK ':'FAIL ')+x.name+(x.error?' — '+x.error:'')).join('\n');
  }
  function fakeClient(remote){
    const calls=[];
    return {calls,from(table){
      assert(table==='rutinas','Consulta ajena a rutinas');
      return {select(fields){calls.push(['select',fields]);return {eq(key,id){calls.push(['eq',key,id]);return {maybeSingle:async()=>({data:{data:clone(remote)},error:null})};}};},
        upsert:async row=>{calls.push(['upsert',clone(row)]);remote=clone(row.data);return {error:null};}};
    },rpc:async()=>{throw new Error('RPC no autorizada');}};
  }

  await test('Esquema no desplegado: solo data, sin columnas nuevas ni RPC',async()=>{
    const client=fakeClient(legacy), repo=P.createRepository(()=>client,{metadata:false,rpc:false});
    const base=await repo.read('a');const result=await repo.write('a',{...base.data,activeSlot:'automatica'},base);
    assert(result.ok,'Falló el camino legado');
    assert(client.calls.filter(x=>x[0]==='select').every(x=>x[1]==='data'),'Solicitó metadatos');
    assert(client.calls.find(x=>x[0]==='upsert')[1].profile_id==='a','Usuario incorrecto');
    assert(!base.schemaReady && !base.clienteV48,'El repositorio sin capacidades activó V48');
  });
  await test('Cambio remoto legado: detectar antes de sobrescribir',async()=>{
    const client=fakeClient({...empty,extra:'otra copia'}),repo=P.createRepository(()=>client,{metadata:false,rpc:false});
    const result=await repo.write('a',legacy,env(empty));
    assert(result.code==='REVISION_CONFLICT','No detectó cambio remoto');
    assert(!client.calls.some(x=>x[0]==='upsert'),'Sobrescribió el remoto');
  });
  await test('Metadatos y CAS futuros: revisión 40001, nunca fallback a upsert',async()=>{
    let rpc;const client={from(){return {select(fields){assert(fields==='data,revision,cliente_v48','Campos');return {eq(){return {maybeSingle:async()=>({data:{data:empty,revision:7,cliente_v48:true}})};}};}};},
      rpc:async(name,args)=>{rpc={name,args};return {error:{code:'40001',message:'REVISION_CONFLICT'}};}};
    const repo=P.createRepository(()=>client,{metadata:true,rpc:true});
    const base=await repo.read('a');const result=await repo.write('a',base.data,base);
    assert(result.code==='REVISION_CONFLICT','Conflicto ignorado');
    assert(rpc.name==='v48_guardar_rutina' && rpc.args.p_revision===7,'RPC/revisión incorrectas');
    assert(!('sesionActiva' in rpc.args.p_patch),'Incluyó clave protegida');
  });
  await test('Cambio de usuario durante prelectura: no inicia upsert antiguo',async()=>{
    let release,entered,current=true;
    const wait=new Promise(r=>release=r),started=new Promise(r=>entered=r),client=fakeClient(empty);
    const original=client.from;
    client.from=table=>{const query=original(table),select=query.select;
      query.select=fields=>{const q=select(fields),eq=q.eq;q.eq=(...args)=>{const f=eq(...args);f.maybeSingle=async()=>{entered();await wait;return {data:{data:empty}};};return f;};return q;};return query;};
    const repo=P.createRepository(()=>client,{metadata:false,rpc:false}),pending=repo.write('a',legacy,env(empty),()=>current);
    await started;current=false;release();
    assert((await pending).code==='ACCOUNT_CHANGED' && !client.calls.some(x=>x[0]==='upsert'),'Escribió después de cambiar usuario');
  });
  await test('Activada pero RPC no habilitada: cerrar camino inseguro',async()=>{
    const client=fakeClient(empty),repo=P.createRepository(()=>client,{metadata:true,rpc:false});
    const result=await repo.write('a',empty,{...env(empty),revision:0,clienteV48:true,schemaReady:true});
    assert(result.code==='V48_NOT_READY' && client.calls.length===0,'Intentó escribir');
  });
  await test('IndexedDB real: red caída, recarga del controlador y recuperación',async()=>{
    const db=cache(),repo={read:async()=>env(empty),write:async()=>({ok:false,code:'NETWORK_ERROR'})};
    const sync=P.createSync(repo,db);await sync.load('a');
    assert((await sync.save(legacy)).localSaved,'No guardó borrador');
    sync.detach();const restored=P.createSync(repo,db);const loaded=await restored.load('a');
    assert(loaded.recovered && P.equal(loaded.data,legacy),'No recuperó el progreso tras recargar');
    assert(loaded.data.sesionActiva.setLogs.e[0].registroId==='r','Perdió vínculo histórico');
  });
  await test('Aislamiento A/B: no leer ni sincronizar borrador ajeno',async()=>{
    const db=cache(),sync=P.createSync({read:async()=>env(empty),write:async()=>({ok:false,code:'NETWORK_ERROR'})},db);
    await sync.load('a');await sync.save(legacy);sync.detach();
    const b=await sync.load('b');assert(!b.recovered && b.data.sesionActiva===null,'Mezcló sesiones');
    assert(await db.get('b')===null && (await db.get('a')).pending,'Borró o mezcló cachés');
  });
  await test('Red caída al leer: el borrador local permanece disponible',async()=>{
    const db=cache(),sync=P.createSync(memoryRepo(empty),db);await sync.load('a');await sync.save(legacy);
    const offline=P.createSync({read:async()=>{throw new Error('offline');}},db);
    const loaded=await offline.load('a');assert(loaded.offline && P.equal(loaded.data,legacy),'No recuperó copia local');
  });
  await test('Conflicto remoto: conservar ambas copias y bloquear sincronización',async()=>{
    const db=cache();let writes=0;
    const first=P.createSync({read:async()=>env(empty),write:async()=>({ok:false,code:'NETWORK_ERROR'})},db);
    await first.load('a');await first.save(legacy);
    const sync=P.createSync({read:async()=>env({...empty,extra:'remoto'}),write:async()=>{writes++;}},db);
    const loaded=await sync.load('a');assert(loaded.conflict && loaded.localDraft.sesionActiva,'Perdió la copia local');
    const result=await sync.save({...loaded.data,extra:'edición sobre copia remota'});
    assert(!result.ok && writes===0,'Sobrescribió conflicto');
    assert(P.equal((await db.get('a')).draft,legacy),'Reemplazó el borrador local que originó el conflicto');
    assert((await db.conflicts('a')).length===1,'No conservó la nueva variante');
  });
  await test('Dos pestañas: CAS local conserva la variante en conflicto',async()=>{
    const db=cache(),repo=memoryRepo(empty),a=P.createSync(repo,db),b=P.createSync(repo,db);
    await a.load('a');await b.load('a');await a.save(legacy);
    const result=await b.save({...legacy,extra:'segunda pestaña'});
    assert(result.code==='LOCAL_CONFLICT' && result.localSaved,'No guardó copia en conflicto');
    assert((await db.conflicts('a')).length===1,'Falta copia alternativa');
    assert((await db.get('a')).draft.extra===undefined,'Pisó el borrador principal');
    assert((await P.createSync(repo,db).load('a')).conflict,'Ocultó conflicto tras recarga');
  });
  await test('Guardados rápidos: orden de red y caché, última edición conservada',async()=>{
    let remote=env(empty);const repo={read:async()=>clone(remote),write:async(_u,data)=>{
      await new Promise(r=>setTimeout(r,10));remote=env(data);return {ok:true,envelope:clone(remote)};
    }};
    const db=cache(),sync=P.createSync(repo,db);await sync.load('a');
    const results=await Promise.all([sync.save({...empty,extra:1}),sync.save({...empty,extra:2})]);
    assert(results.every(x=>x.ok) && remote.data.extra===2 && (await db.get('a')).draft.extra===2,'Guardados fuera de orden');
  });
  await test('Cambio de usuario durante guardado: no aplica respuesta al nuevo contexto',async()=>{
    let release,entered;const started=new Promise(r=>entered=r),wait=new Promise(r=>release=r);
    const sync=P.createSync({read:async()=>env(empty),write:async(_u,data)=>{entered();await wait;return {ok:true,envelope:env(data)};}},cache());
    await sync.load('a');const pending=sync.save(legacy);await started;
    sync.detach();await sync.load('b');release();
    assert((await pending).code==='ACCOUNT_CHANGED' && sync.getContext().ownerId==='b','Respuesta vieja mezclada');
  });
  await test('IndexedDB no disponible: error explícito, sin falso respaldo local',async()=>{
    const sync=P.createSync({read:async()=>env(empty),write:async()=>({ok:false,code:'NETWORK_ERROR'})},P.createCache(null));
    await sync.load('a');const result=await sync.save(legacy);
    assert(!result.ok && !result.localSaved && result.localError,'Declaró respaldo inexistente');
  });
  await test('Estructura futura: UUID estable, snapshot independiente, sin conversión',async()=>{
    const draft=P.createSessionDraft(day,{slot:'personalizada',startedAt:123,timezone:'America/Montevideo'});
    const original=day.nombre;draft.day.nombre='copia';
    assert(day.nombre===original && /^[0-9a-f-]{36}$/.test(draft.sessionId),'Snapshot/identidad inválidos');
    assert(draft.sets.length===2 && draft.sets.every(x=>!x.completed && x.peso===null),'Valores realizados inventados');
    assert(!legacy.sesionActiva.schemaVersion,'Convirtió sesión heredada');
  });
  await test('Integración: historial, restauración y cierre de sesión',async()=>{
    const keys=['ensureProfile','readRutina','saveRutina','listRegistros','listEntrenos','listPesoCorporal'];
    const old=Object.fromEntries(keys.map(k=>[k,A.Store[k]]));
    const id='integration-'+crypto.randomUUID();let written;
    try {
      A.Store.ensureProfile=async user=>({id:user.id,name:'Prueba',metaSemanal:3});
      A.Store.readRutina=async()=>env({...legacy,claveDesconocida:{keep:true}});
      A.Store.saveRutina=async(owner,data)=>{written={owner,data:clone(data)};return {ok:true,envelope:env(data)};};
      A.Store.listRegistros=async()=>[{id:'r',exercise:'Dominadas',peso:0,reps:'8-10',series:'3',setNumber:null,date:'2025-01-01'}];
      A.Store.listEntrenos=async()=>[{id:'h',date:'2025-01-01',setsTotales:3}];
      A.Store.listPesoCorporal=async()=>[];
      await A.handleAuthStateChange('SIGNED_IN',{user:{id}});
      assert(A.state.session.startedAt===123 && A.state.session.setLogs.e[0].registroId==='r','Alteró la sesión heredada');
      assert(A.state.registros[0].reps==='8-10' && A.state.entrenos[0].id==='h','Alteró historia');
      assert((await A.persistRutina()).ok && written.owner===id && written.data.claveDesconocida.keep,'Perdió claves desconocidas');
      await A.handleAuthStateChange('SIGNED_OUT',null);
      assert(A.state.profile===null && A.state.session===null && A.state.registros.length===0,'Dejó datos de la cuenta');
    } finally {keys.forEach(k=>A.Store[k]=old[k]);A.clearAccountData();}
  });
  await test('Integración: carga tardía de A no reemplaza perfil ni historial B',async()=>{
    const keys=['ensureProfile','readRutina','listRegistros','listEntrenos','listPesoCorporal'];
    const old=Object.fromEntries(keys.map(k=>[k,A.Store[k]]));let release,entered;
    const wait=new Promise(r=>release=r),started=new Promise(r=>entered=r);
    const a='race-a-'+crypto.randomUUID(),b='race-b-'+crypto.randomUUID();
    try {
      A.Store.ensureProfile=async u=>({id:u.id,name:u.id,metaSemanal:3});
      A.Store.readRutina=async id=>{if(id===a){entered();await wait;}return env(empty);};
      A.Store.listRegistros=async id=>[{id}];A.Store.listEntrenos=async()=>[];A.Store.listPesoCorporal=async()=>[];
      const pending=A.handleAuthStateChange('SIGNED_IN',{user:{id:a}});await started;
      await A.handleAuthStateChange('SIGNED_IN',{user:{id:b}});release();await pending;
      assert(A.state.profile.id===b && A.state.registros[0].id===b,'Carga tardía cruzó usuarios');
    } finally {keys.forEach(k=>A.Store[k]=old[k]);A.clearAccountData();}
  });
  await test('Sesión sin día y sesión V48: conservar sin convertir ni permitir reemplazo',async()=>{
    const keys=['ensureProfile','readRutina','saveRutina','listRegistros','listEntrenos','listPesoCorporal'];
    const old=Object.fromEntries(keys.map(k=>[k,A.Store[k]]));let raw=clone(legacy),written;
    try {
      raw.personalizada.days=[];
      A.Store.ensureProfile=async u=>({id:u.id,name:'Prueba',metaSemanal:3});
      A.Store.readRutina=async()=>env(raw);
      A.Store.saveRutina=async(_id,data)=>{written=clone(data);return {ok:true,envelope:env(data)};};
      A.Store.listRegistros=async()=>[];A.Store.listEntrenos=async()=>[];A.Store.listPesoCorporal=async()=>[];
      await A.handleAuthStateChange('SIGNED_IN',{user:{id:crypto.randomUUID()}});
      assert(A.state.unresolvedSession && !A.state.session,'Descartó o convirtió sesión sin día');
      await A.persistRutina();assert(P.equal(written.sesionActiva,legacy.sesionActiva),'Sobrescribió sesión heredada');
      raw={...clone(empty),sesionActiva:P.createSessionDraft(day,{slot:'personalizada'})};
      await A.handleAuthStateChange('SIGNED_IN',{user:{id:crypto.randomUUID()}});
      A.startSession(day);
      assert(A.state.unresolvedSession.sessionId===raw.sesionActiva.sessionId && !A.state.session,'Usó UI heredada para sesión V48');
    } finally {keys.forEach(k=>A.Store[k]=old[k]);A.clearAccountData();}
  });
  /* ===================== V50.1 — salida del conflicto local (E1) =====================
     Hasta V50.4 el store `conflicts` se escribía y se leía, y nada lo borraba:
     una sola copia dejaba la cuenta sin poder guardar para siempre, porque
     load() volvía a bloquear en cada arranque. Estos tests cubren la salida. */

  await test('V50.1 — descartar copias: sólo los ids pedidos, sólo de ese dueño',async()=>{
    const db=cache(),repo=memoryRepo(empty);
    // Dos pestañas de 'a' generan una copia; una tercera genera la segunda.
    const a=P.createSync(repo,db),b=P.createSync(repo,db);
    await a.load('a');await b.load('a');await a.save(legacy);
    await b.save({...legacy,extra:'b'});
    const c=P.createSync(repo,db);await c.load('a');await c.save({...legacy,extra:'c'});
    const copias=await db.conflicts('a');
    assert(copias.length===2,'Control inválido: esperaba 2 copias, hay '+copias.length);
    // Y una copia de OTRO usuario, que no se puede tocar.
    const x=P.createSync(repo,db),y=P.createSync(repo,db);
    await x.load('z');await y.load('z');await x.save(legacy);await y.save({...legacy,extra:'z'});
    assert((await db.conflicts('z')).length===1,'Control inválido: falta la copia de z');
    const r=await db.discardConflicts('a',[copias[0].id]);
    assert(r.deleted===1 && r.kept===1 && r.missing.length===0,'Descarte selectivo incorrecto: '+JSON.stringify(r));
    assert((await db.conflicts('a')).length===1,'No quedó exactamente una copia de a');
    assert((await db.conflicts('z')).length===1,'Tocó la copia de otro usuario');
    // Un id de otro dueño no borra nada.
    const ajeno=(await db.conflicts('z'))[0].id;
    const r2=await db.discardConflicts('a',[ajeno]);
    assert(r2.deleted===0 && r2.missing.length===1,'Borró por id sin validar el dueño');
    assert((await db.conflicts('z')).length===1,'Borró la copia de z desde la cuenta a');
  });

  await test('V50.1 — resolver con la copia LOCAL: desbloquea y vuelve a guardar',async()=>{
    const db=cache(),repo=memoryRepo(empty),a=P.createSync(repo,db),b=P.createSync(repo,db);
    await a.load('a');await b.load('a');await a.save(legacy);
    const bloqueado=await b.save({...legacy,extra:'local'});
    assert(bloqueado.code==='LOCAL_CONFLICT','Control inválido: no quedó bloqueado');
    // Nueva carga: load() ve la copia y bloquea, como en cada arranque.
    const sync=P.createSync(repo,db),loaded=await sync.load('a');
    assert(loaded.conflict && loaded.localDrafts.length===1,'No ofreció la copia para elegir');
    const elegida=loaded.localDrafts[0].draft;
    const res=await sync.resolve('a',elegida,loaded.localDrafts.map(x=>x.id));
    assert(res.ok && res.draftSaved && res.discarded.deleted===1,'Resolución incompleta: '+JSON.stringify(res));
    assert((await db.conflicts('a')).length===0,'Quedaron copias sin descartar');
    assert(P.equal((await db.get('a')).draft,elegida),'No conservó la copia elegida');
    // Y lo que importa: se puede guardar otra vez, sin recargar.
    const despues=await sync.save({...elegida,extra:'después de resolver'});
    assert(despues.ok,'Sigue bloqueado tras resolver: '+JSON.stringify(despues));
    // Y una carga nueva ya no reporta conflicto.
    assert(!(await P.createSync(repo,db).load('a')).conflict,'load() sigue viendo conflicto');
  });

  await test('V50.1 — resolver con la copia REMOTA: descarta la local y no queda pendiente',async()=>{
    const db=cache(),repo=memoryRepo(empty),a=P.createSync(repo,db),b=P.createSync(repo,db);
    await a.load('a');await b.load('a');await a.save(legacy);
    await b.save({...legacy,extra:'descartable'});
    const sync=P.createSync(repo,db),loaded=await sync.load('a');
    const res=await sync.resolve('a',loaded.data,loaded.localDrafts.map(x=>x.id));
    assert(res.ok && res.discarded.deleted===1,'No descartó la copia local');
    const fila=await db.get('a');
    assert(P.equal(fila.draft,loaded.data),'No conservó la copia remota');
    assert(fila.pending===false,'Marcó pendiente un borrador idéntico al remoto');
    assert((await sync.save(loaded.data)).ok,'No se puede guardar tras elegir la remota');
  });

  await test('V50.1 — si falla el descarte, la copia elegida YA está guardada',async()=>{
    const db=cache(),repo=memoryRepo(empty),a=P.createSync(repo,db),b=P.createSync(repo,db);
    await a.load('a');await b.load('a');await a.save(legacy);
    await b.save({...legacy,extra:'local'});
    // Se rompe SÓLO el descarte: el orden escribir→borrar tiene que proteger.
    const roto={...db,discardConflicts:async()=>{throw new Error('almacenamiento caído');}};
    const sync=P.createSync(repo,roto),loaded=await sync.load('a');
    const elegida=loaded.localDrafts[0].draft;
    const res=await sync.resolve('a',elegida,loaded.localDrafts.map(x=>x.id));
    assert(!res.ok && res.code==='DISCARD_FAILED' && res.stage==='discard','Código de fallo inesperado: '+JSON.stringify(res));
    assert(res.draftSaved===true,'No informó que el borrador quedó a salvo');
    assert(P.equal((await db.get('a')).draft,elegida),'Perdió la copia elegida al fallar el descarte');
    assert((await db.conflicts('a')).length===1,'Borró copias pese a fallar el descarte');
    // Reintento con el store sano: termina el trabajo sin pérdida.
    const sano=P.createSync(repo,db),recargado=await sano.load('a');
    const r2=await sano.resolve('a',elegida,recargado.localDrafts.map(x=>x.id));
    assert(r2.ok && (await db.conflicts('a')).length===0,'El reintento no cerró la resolución');
  });

  await test('V50.1 — IndexedDB caído: no dice que guardó lo que no guardó',async()=>{
    const sync=P.createSync(memoryRepo(empty),P.createCache(null));
    await sync.load('a');
    const res=await sync.resolve('a',legacy,['x']);
    assert(!res.ok && res.stage==='draft','Debería fallar antes de descartar: '+JSON.stringify(res));
    assert(!res.draftSaved,'Declaró un borrador guardado sin almacenamiento');
  });

  await test('V50.1 — resolver no toca otra cuenta ni borra sin elección',async()=>{
    const db=cache(),repo=memoryRepo(empty),sync=P.createSync(repo,db);
    const a=P.createSync(repo,db),b=P.createSync(repo,db);
    await a.load('a');await b.load('a');await a.save(legacy);await b.save({...legacy,extra:'b'});
    await sync.load('a');
    // Resolver con el dueño equivocado no hace nada.
    const ajeno=await sync.resolve('otro',legacy,[]);
    assert(!ajeno.ok && ajeno.code==='ACCOUNT_CHANGED','Resolvió para otra cuenta');
    assert((await db.conflicts('a')).length===1,'Descartó copias con dueño equivocado');
    // Resolver sin ids guarda la elección y NO borra nada: el descarte es explícito.
    const sinIds=await sync.resolve('a',legacy,[]);
    assert(sinIds.ok && sinIds.discarded.deleted===0,'Borró sin que se lo pidieran');
    assert((await db.conflicts('a')).length===1,'Descartó copias sin ids');
  });

  await test('V50.1 — tras resolver y sincronizar, el inicio V48 deja de rechazar',async()=>{
    // Elegir una copia local que difiere del servidor deja el borrador PENDIENTE,
    // y el inicio de un entrenamiento V48 exige no tener cambios sin sincronizar
    // (v48-lifecycle.js:66). Sin sincronizar, iniciar daría UNSYNCED_CHANGES justo
    // después de resolver; con un guardado, el camino queda libre. La pantalla de
    // conflictos hace ese guardado sola (ver mountConflictos).
    const db=cache();
    let remoto=env(empty);
    const repo={read:async()=>clone(remoto),
      write:async(_u,d)=>{remoto=env(d);return {ok:true,envelope:clone(remoto)};}};
    const a=P.createSync(repo,db),b=P.createSync(repo,db);
    await a.load('a');await b.load('a');

  await test('V50.1 — si el remoto avanzó, el guardado posterior NO lo sobrescribe',async()=>{
    /* El punto crítico: después de resolver, la pantalla sincroniza la copia
       elegida con un persistRutina(). Si entre la resolución y ese guardado otro
       dispositivo cambió la rutina, ese guardado NO puede pisarlo en silencio.
       Y la copia elegida tiene que seguir recuperable para volver a decidir. */
    const db=cache();
    let remoto=env(empty);
    let escrituras=0;
    const repo={read:async()=>clone(remoto),write:async(_u,d,base)=>{
      escrituras++;
      // CAS: igual que el camino real (RPC con p_revision en V48, read+compare en V47).
      if(base.revision!==remoto.revision || !P.equal(base.data,remoto.data)) return {ok:false,code:'REVISION_CONFLICT'};
      remoto={data:clone(d),revision:(remoto.revision||0)+1,clienteV48:false,schemaReady:false};
      return {ok:true,envelope:clone(remoto)};
    }};
    remoto={data:clone(empty),revision:3,clienteV48:false,schemaReady:false};
    // Conflicto local entre dos contextos.
    const a=P.createSync(repo,db),b=P.createSync(repo,db);
    await a.load('a');await b.load('a');
    await a.save({...empty,extra:'p1'});
    await b.save({...empty,extra:'p2'});
    assert((await db.conflicts('a')).length===1,'Control inválido: falta la copia en conflicto');

    const sync=P.createSync(repo,db),cargado=await sync.load('a');
    const elegida=clone(cargado.localDrafts[0].draft);
    const res=await sync.resolve('a',elegida,cargado.localDrafts.map(x=>x.id));
    assert(res.ok,'No resolvió');

    // Otro dispositivo cambia la rutina DESPUÉS de resolver y ANTES de sincronizar.
    remoto={data:{...clone(empty),extra:'otro dispositivo'},revision:remoto.revision+5,clienteV48:false,schemaReady:false};
    const antes=escrituras;
    const guardado=await sync.save(elegida);
    assert(!guardado.ok && guardado.code==='REVISION_CONFLICT','Debería detectar el conflicto de revisión: '+JSON.stringify(guardado));
    assert(remoto.data.extra==='otro dispositivo','PISÓ el cambio remoto posterior');
    assert(escrituras===antes+1,'Reintentó la escritura a ciegas');
    // Y la copia elegida sigue guardada y pendiente: nada se perdió.
    const fila=await db.get('a');
    assert(P.equal(fila.draft,elegida) && fila.pending===true,'Perdió la copia elegida al chocar la revisión');

    // Una carga nueva la ofrece otra vez para decidir, en vez de dejarla muerta.
    const recarga=await P.createSync(repo,db).load('a');
    assert(recarga.conflict===true,'No volvió a ofrecer la decisión');
    assert(P.equal(recarga.localDraft,elegida),'No conservó la copia elegida como recuperable');
    assert(P.equal(recarga.data,remoto.data),'No mostró el estado remoto vigente');
  });

  /* ===================== V50.5 — activación de las funciones V48 =====================
     `v48_activar` activa la cuenta de quien la llama (auth.uid()), así que sale
     desde la sesión del propio usuario a través de Store.nativeRpc. Estas pruebas
     SUSTITUYEN nativeRpc: en ningún caso se llama a producción. */

  // Monta un estado de Perfil y lo restaura al salir. `rpc` reemplaza nativeRpc.
  async function conActivacion(parches, rpc, fn){
    const dia={id:'dz',nombre:'Día',exercises:[{id:'ez',nombre:'Dominadas',series:'2',reps:'8'}]};
    const base={personalizada:{days:[dia]},automatica:{days:[]},enfocada:{days:[]},activeSlot:'personalizada',sesionActiva:null};
    const prev={}; const claves=['profile','authSession','persistence','rutinaRaw','rutinaSlots','rutina','activeSlot','session','unresolvedSession','registros','entrenos','pesoCorporal','tab','booted','dbError'];
    claves.forEach(k=>prev[k]=A.state[k]);
    const llamadas=[];
    // Store.nativeRpc se sustituye: en ninguna prueba se llama a producción.
    // Y además se sustituyen las LECTURAS que usa loadProfileData, para que la
    // recarga posterior a la activación pueda completarse sin red — es parte de
    // lo que hay que verificar (requisito 7), no un atajo.
    const metodos=['nativeRpc','readRutina','listRegistros','listEntrenos','listPesoCorporal'];
    const storePrev={}; metodos.forEach(k=>storePrev[k]=A.Store[k]);
    A.Store.nativeRpc=async(owner,name,args)=>{llamadas.push({owner,name,args:clone(args)});return rpc(owner,name,args,llamadas);};
    let activadaEnServidor=false;
    A.Store.readRutina=async()=>({data:clone(base),revision:activadaEnServidor?6:5,
      clienteV48:activadaEnServidor,schemaReady:true});
    A.Store.listRegistros=async()=>[];
    A.Store.listEntrenos=async()=>[];
    A.Store.listPesoCorporal=async()=>[];
    A.state.booted=true;A.state.dbError=false;
    A.state.authSession={user:{id:'p'}};
    A.state.profile={id:'p',name:'Prueba',metaSemanal:3};
    A.state.rutinaRaw=clone(base);
    A.state.rutinaSlots={personalizada:{days:[dia]},automatica:{days:[]},enfocada:{days:[]}};
    A.state.rutina=A.state.rutinaSlots.personalizada;A.state.activeSlot='personalizada';
    A.state.session=null;A.state.unresolvedSession=null;
    A.state.registros=[];A.state.entrenos=[];A.state.pesoCorporal=[];A.state.tab='perfil';
    A.state.persistence={ok:true,data:clone(base),revision:5,clienteV48:false,schemaReady:true};
    Object.keys(parches||{}).forEach(k=>{
      if(k==='persistence') Object.assign(A.state.persistence,parches[k]); else A.state[k]=parches[k];
    });
    try { return await fn(llamadas, { activar(){ activadaEnServidor=true; } }); }
    finally { metodos.forEach(k=>A.Store[k]=storePrev[k]); claves.forEach(k=>A.state[k]=prev[k]); }
  }

      assert(llamadas.length>=1,'No pasó por Store.nativeRpc');
      const texto=A.activarV48.toString()+A.activacionV48Estado.toString()+A.perfilActivacionHtml.toString();
      assert(!/createClient/.test(texto),'Crea un cliente de Supabase propio');
      assert(!/access_token|getSession/.test(texto),'Manipula tokens de autenticación');
      assert(!/SUPABASE_KEY|apikey/.test(texto),'Usa la clave directamente');
    });
  });

  await test('V50.5 — v48_activar pasa la allowlist y NO llega a la red sin sesión',async()=>{
    /* Se prueba por COMPORTAMIENTO, no leyendo el fuente: V49 envuelve
       Store.nativeRpc con updates.track() para saber cuándo la app está ocupada,
       así que `toString()` devuelve el envoltorio y no la allowlist. Efecto
       secundario bueno: v48_activar queda protegida contra una actualización a
       mitad de la operación, igual que el resto de las RPC.

       En este entorno el cliente de Supabase es un stub sin sesión, y nativeRpc
       valida la allowlist ANTES de resolver la sesión. Entonces:
         - un nombre no habilitado  -> RPC_NOT_ENABLED (ni siquiera mira la sesión)
         - v48_activar              -> ACCOUNT_CHANGED (pasó la allowlist y se
                                       detuvo en la sesión, sin ningún fetch)
       Ninguno de los dos toca la red. */
    let err1=null;
    try { await A.Store.nativeRpc('p','v48_inventada',{}); } catch(e){ err1=e.message; }
    assert(err1==='RPC_NOT_ENABLED','Un nombre no habilitado debería cortarse: '+err1);
    let err2=null;
    try { await A.Store.nativeRpc('p','v48_activar',{p_revision:1}); } catch(e){ err2=e.message; }
    assert(err2==='ACCOUNT_CHANGED','v48_activar debería pasar la allowlist y parar en la sesión: '+err2);
    let err3=null;
    try { await A.Store.nativeRpc('p','v48_estado',{}); } catch(e){ err3=e.message; }
    assert(err3==='ACCOUNT_CHANGED','v48_estado debería seguir habilitada: '+err3);
  });

  window.__v48Results={total:results.length,pass:results.filter(x=>x.ok).length,fail:results.filter(x=>!x.ok).length,failures:results.filter(x=>!x.ok)};
})();
</script>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Voda Fit</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- V38.1: nombre con el que iOS rotula el ícono en la pantalla de inicio.
     iOS IGNORA name/short_name de manifest.json para esto: manda este meta. -->
<meta name="apple-mobile-web-app-title" content="Voda Fit">
<meta name="theme-color" content="#171412">
<meta name="description" content="Rutina, registro de pesos y cronómetro para el gimnasio">
<link rel="manifest" href="manifest.json">
<!-- V38.1: iOS tampoco usa los iconos del manifest para la pantalla de inicio;
     usa apple-touch-icon. Se sirve en 180x180, el tamaño nativo del iPhone, y
     CUADRADO a sangre: iOS le aplica su propio redondeo, así que un PNG ya
     redondeado quedaría con esquinas dobles.
     El archivo se llama apple-touch-icon.png a propósito: es además la ruta
     que iOS prueba por convención cuando no encuentra el <link>. -->
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="stylesheet" href="./vendor/fonts/fonts.css?h=6e2518a7cf7d0f4b82c918fc94226e5d8a463a25e1793bd44284466e4d3b8e2e" integrity="sha384-YxfyY3eIqW/kSRliN839BUzU7KWjfKN9quJ9YAOIVek2Hz0mJ2wMaWvSf+x1EVuK sha384-hYcMmIEgwqCDS9K88ROtJcv/ZocWJjhwGZ5pF3+tJwLgFBrQVkl/il9vx4rjikXR" crossorigin="anonymous">
<style>
  :root{
    --bg:#F1F0EC;
    --surface:#FFFFFF;
    --surface-2:#E8E6E0;
    --text:#1B1917;
    --text-muted:#6B6560;
    --border:#DBD8D1;
    --accent:#C84A22;
    --accent-strong:#B8431D;
    --accent-on:#FFFFFF;
    --accent-soft:#FBE3D8;
    --secondary:#2A5FD9;
    --secondary-soft:#DCE6FB;
    --success:#2E9E5B;
    --success-on:#1B1210;
    --success-soft:#DCF3E6;
    --danger:#C13B3B;
    --danger-soft:#FBE0DF;
    --calendar-special:#7559B8;
    --calendar-special-soft:#E8E0F7;
    --calendar-focused:#1F8A8A;
    --calendar-focused-soft:#D9F0EE;
    --muscle-off:#A6A093;
    --muscle-base:#9C9689;
    --calendar-manual:#827B72;
    --calendar-manual-soft:#E7E4E0;
    --calendar-unknown:#A49C91;
    --shadow: 0 1px 2px rgba(20,15,10,.06), 0 6px 16px -8px rgba(20,15,10,.15);
    --radius-s: 10px;
    --radius-m: 16px;
    --radius-l: 22px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15130F;
      --surface:#211D18;
      --surface-2:#2A2520;
      --text:#F3EFE9;
      --text-muted:#A79E93;
      --border:#3A342D;
      --accent:#FF7A47;
      --accent-strong:#FF8E5E;
      --accent-on:#1B1210;
      --accent-soft:#3A2116;
      --secondary:#7EA0FF;
      --secondary-soft:#1E2740;
      --success:#59C68A;
      --success-on:#1B1210;
      --success-soft:#173425;
      --danger:#FF8A80;
      --danger-soft:#3A1F1E;
      --calendar-special:#B9A1FF;
      --calendar-special-soft:#30284A;
      --calendar-focused:#6FD6D0;
      --calendar-focused-soft:#123A38;
      --muscle-off:#6E6456;
      --muscle-base:#786D5E;
      --calendar-manual:#A9A198;
      --calendar-manual-soft:#302C27;
      --calendar-unknown:#81796F;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 24px -12px rgba(0,0,0,.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#15130F;
    --surface:#211D18;
    --surface-2:#2A2520;
    --text:#F3EFE9;
    --text-muted:#A79E93;
    --border:#3A342D;
    --accent:#FF7A47;
    --accent-strong:#FF8E5E;
    --accent-on:#1B1210;
    --accent-soft:#3A2116;
    --secondary:#7EA0FF;
    --secondary-soft:#1E2740;
    --success:#59C68A;
    --success-on:#1B1210;
    --success-soft:#173425;
    --danger:#FF8A80;
    --danger-soft:#3A1F1E;
    --calendar-special:#B9A1FF;
    --calendar-special-soft:#30284A;
    --calendar-focused:#6FD6D0;
    --calendar-focused-soft:#123A38;
    --muscle-off:#6E6456;
    --muscle-base:#786D5E;
    --calendar-manual:#A9A198;
    --calendar-manual-soft:#302C27;
    --calendar-unknown:#81796F;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 24px -12px rgba(0,0,0,.5);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Work Sans", system-ui, -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }
  h1,h2,h3,.display{
    font-family:"Barlow Condensed", "Work Sans", sans-serif;
    text-transform:uppercase;
    letter-spacing:.02em;
    font-weight:700;
    text-wrap:balance;
    margin:0;
  }
  .num{ font-variant-numeric: tabular-nums; }
  button{ font-family:inherit; }
  input,select{ font-family:inherit; }
  ::selection{ background:var(--accent-soft); }

  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding-bottom: calc(78px + env(safe-area-inset-bottom));
    position:relative;
  }
  /* La ficha de ejercicio usa un layout de dos columnas en pantallas anchas
     (ver .exdetail-layout), así que en esa pantalla el contenedor se puede
     ensanchar — en mobile no cambia nada porque el viewport ya es angosto. */
  #app.app-wide{ max-width:960px; }

  .topbar{
    position:sticky; top:0; z-index:5;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px calc(10px);
    padding-top: calc(14px + env(safe-area-inset-top));
    background:var(--bg);
    border-bottom:1px solid var(--border);
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  /* V38: el tile de marca pasa a ser NEGRO, igual que el ícono de la app.
     El isotipo es blanco + naranja, así que necesita su propio fondo oscuro
     para conservar contraste en tema claro y en tema oscuro por igual. El
     borde sutil lo despega del fondo cuando la app está en oscuro. */
  .brand-mark{
    width:32px;height:32px;border-radius:10px;
    background:#111111; border:1px solid rgba(255,255,255,.10);
    display:flex;align-items:center;justify-content:center;flex:none;
  }
  /* El isotipo es apaisado (~2:1): se fija el ancho y el alto sale solo. */
  .brand-mark svg{ width:24px; height:auto; display:block; }
  .brand h1{ font-size:22px; line-height:1; color:var(--text); }
  .profile-chip{
    display:flex; align-items:center; gap:8px;
    background:var(--surface); border:1px solid var(--border);
    border-radius:999px; padding:6px 12px 6px 6px;
    cursor:pointer;
  }
  .avatar{
    width:24px;height:24px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:12px; font-weight:700; color:var(--accent-on);
    background:var(--accent); flex:none;
  }
  .profile-chip span{ font-size:13px; font-weight:600; }

  main{ flex:1; padding:16px 18px 8px; }
  .screen{ display:flex; flex-direction:column; gap:14px; animation: fade .18s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

  .section-title{ display:flex; align-items:baseline; justify-content:space-between; margin-top:4px; }
  .section-title h2{ font-size:20px; color:var(--text); }
  .section-title .muted{ font-size:12px; color:var(--text-muted); text-transform:none; letter-spacing:0; font-family:"Work Sans",sans-serif; font-weight:500; }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-m);
    box-shadow:var(--shadow);
    padding:14px;
  }
  .card + .card{ margin-top:0; }
  .stack{ display:flex; flex-direction:column; gap:10px; }
  .row{ display:flex; align-items:center; gap:10px; }
  .row.between{ justify-content:space-between; }
  .wrap{ display:flex; flex-wrap:wrap; gap:8px; }

  .day-card .day-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .day-head h3{ font-size:18px; color:var(--text); }
  .day-title{ display:flex; flex-direction:column; gap:1px; min-width:0; }
  .day-title-main{ font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:19px; letter-spacing:.01em; }
  .day-title-sub{ font-size:12.5px; font-weight:500; color:var(--text-muted); text-transform:none; letter-spacing:0; font-family:"Work Sans",sans-serif; }
  .day-head .actions{ display:flex; gap:6px; }
  .exlist{ display:flex; flex-direction:column; gap:8px; margin-top:10px; }
  .exrow{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:9px 10px; background:var(--surface-2); border-radius:var(--radius-s);
  }
  .exrow .exname{ font-weight:600; font-size:14.5px; }
  .exrow .exmeta{ font-size:12.5px; color:var(--text-muted); }
  .exrow .actions{ display:flex; gap:4px; flex:none; }

  .iconbtn{
    width:30px;height:30px; border-radius:9px; border:1px solid var(--border);
    background:var(--surface); color:var(--text-muted);
    display:flex;align-items:center;justify-content:center; cursor:pointer;
  }
  .iconbtn:active{ transform:scale(.94); }
  .iconbtn svg{ width:15px; height:15px; }
  .iconbtn.danger{ color:var(--danger); }

  .btn{
    appearance:none; border:none; border-radius:12px; padding:12px 16px;
    font-weight:700; font-size:14.5px; cursor:pointer; text-align:center;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn:active{ transform:scale(.98); }
  .btn svg{ width:17px; height:17px; flex:none; }
  .btn-primary{ background:var(--accent); color:var(--accent-on); }
  .btn-secondary{ background:var(--secondary-soft); color:var(--secondary); }
  .btn-ghost{ background:var(--surface-2); color:var(--text); }
  .btn-outline{ background:transparent; color:var(--text); border:1px solid var(--border); }
  .btn-block{ width:100%; }
  .btn-sm{ padding:8px 12px; font-size:13px; border-radius:10px; }
  .btn-danger{ background:var(--danger-soft); color:var(--danger); }

  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:12px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em; }
  .field input, .field select, .field textarea{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    /* M1: 16px es el mínimo que evita el zoom automático de Safari iOS al
       enfocar un input (D8). No cambia el ancho de las cajas, así que .field-row
       sigue entrando igual en pantallas angostas. */
    border-radius:10px; padding:10px 12px; font-size:16px; width:100%;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; min-width:0; }

  .ac-wrap{ position:relative; }
  .ac-list{
    position:absolute; left:0; right:0; top:calc(100% + 4px); z-index:6;
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    box-shadow:var(--shadow); max-height:210px; overflow-y:auto; display:none;
  }
  .ac-item{ padding:10px 12px; font-size:14px; cursor:pointer; }
  .ac-item + .ac-item{ border-top:1px solid var(--border); }
  .ac-item:hover, .ac-item:active{ background:var(--surface-2); }
  /* 2B: "Ver X más..." no es un ejercicio, es una acción. Se distingue para
     que nadie crea que está eligiendo un ejercicio llamado así. */
  .ac-more{ color:var(--accent); font-weight:600; }

  .empty{
    display:flex; flex-direction:column; align-items:center; text-align:center;
    gap:10px; padding:34px 16px; color:var(--text-muted);
  }
  .empty svg{ width:40px; height:40px; opacity:.5; }
  .empty h3{ color:var(--text); font-size:18px; }
  .empty p{ margin:0; font-size:13.5px; max-width:30ch; }

  .badge{ font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px; text-transform:uppercase; letter-spacing:.03em; }
  .badge.pin{ background:var(--secondary-soft); color:var(--secondary); }
  .badge.pr{ background:var(--success-soft); color:var(--success); }

  .bottomnav{
    position:fixed; left:0; right:0; bottom:0; z-index:10;
    background:var(--surface); border-top:1px solid var(--border);
    padding: 8px max(10px, calc(50% - 240px + 10px)) calc(8px + env(safe-area-inset-bottom));
    display:flex; justify-content:space-around;
  }
  .navbtn{
    display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; color:var(--text-muted); cursor:pointer;
    padding:6px 6px; border-radius:12px; flex:1; max-width:110px; min-width:0;
  }
  .navbtn svg{ width:22px; height:22px; }
  .navbtn span{ font-size:11px; font-weight:600; }
  .navbtn.active{ color:var(--accent); }

  /* Timer central: mismo botón e igual lógica de navegación de siempre —
     solo se destaca visualmente (más grande, elevado, ícono en un badge
     circular con los colores de marca) para que sea el más fácil de
     encontrar y tocar en pleno entrenamiento. */
  .navbtn-central{ margin-top:-16px; }
  .bottomnav .navbtn-central svg{
    width:46px; height:46px; padding:12px; box-sizing:border-box;
    background:var(--accent); color:var(--accent-on); border-radius:50%;
    box-shadow:var(--shadow); transition:transform .15s ease;
  }
  .navbtn-central span{ margin-top:2px; }
  .navbtn-central:active svg{ transform:scale(.94); }

  .banner{
    display:flex; gap:10px; align-items:flex-start;
    background:var(--secondary-soft); color:var(--secondary);
    border-radius:var(--radius-s); padding:10px 12px; font-size:12.5px; line-height:1.4;
  }
  .banner svg{ width:16px; height:16px; flex:none; margin-top:1px; }
  .banner.warn{ background:var(--accent-soft); color:var(--accent-strong); }

  .modal-back{
    position:fixed; inset:0; background:rgba(10,8,6,.5); backdrop-filter:blur(2px);
    display:flex; align-items:flex-end; justify-content:center; z-index:50;
    animation: fadeIn .15s ease;
  }
  @keyframes fadeIn{ from{opacity:0} to{opacity:1} }
  .modal{
    background:var(--surface); width:100%; max-width:480px;
    border-radius:20px 20px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:14px;
    max-height:88vh; overflow-y:auto;
    animation: up .18s ease;
  }
  @keyframes up{ from{transform:translateY(16px); opacity:.6} to{transform:none; opacity:1} }
  .modal h3{ font-size:20px; }
  .modal-actions{ display:flex; gap:10px; margin-top:4px; }
  .modal-actions .btn{ flex:1; }

  .profilegrid{ display:flex; flex-direction:column; gap:8px; }
  .profileopt{
    display:flex; align-items:center; gap:12px; padding:11px 12px;
    background:var(--surface-2); border-radius:var(--radius-s); border:1px solid transparent;
    cursor:pointer;
  }
  .profileopt.current{ border-color:var(--accent); }
  .profileopt .avatar{ width:34px; height:34px; font-size:14px; }
  .profileopt .info{ flex:1; }
  .profileopt .info b{ font-size:14.5px; display:block; }
  .profileopt .info small{ color:var(--text-muted); font-size:12px; }
  .profileopt > svg{ width:16px; height:16px; color:var(--text-muted); flex:none; }

  .pindots{ display:flex; gap:10px; justify-content:center; margin:6px 0; }
  .pindots .d{ width:14px; height:14px; border-radius:50%; border:2px solid var(--border); }
  .pindots .d.on{ background:var(--accent); border-color:var(--accent); }
  .keypad{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .keypad button{
    padding:16px; font-size:20px; font-weight:700; border-radius:14px;
    border:1px solid var(--border); background:var(--surface-2); color:var(--text);
  }
  .keypad button:active{ transform:scale(.95); }

  /* Cronometro */
  .timer-wrap{ display:flex; flex-direction:column; align-items:center; gap:20px; padding:10px 0 4px; }
  .ring-box{ position:relative; width:240px; height:240px; }
  .ring-box svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .ring-bg{ fill:none; stroke:var(--surface-2); stroke-width:14; }
  .ring-fg{ fill:none; stroke:var(--accent); stroke-width:14; stroke-linecap:round; transition: stroke .2s ease; }
  .ring-fg.done{ stroke:var(--success); }
  .ring-label{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:2px;
  }
  .ring-label .time{ font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:54px; line-height:1; }
  .ring-label .state{ font-size:12px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em; font-weight:600; }
  .presets{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .preset{
    padding:9px 14px; border-radius:999px; border:1px solid var(--border);
    background:var(--surface); color:var(--text); font-weight:600; font-size:13.5px; cursor:pointer;
  }
  .preset.active{ background:var(--accent); border-color:var(--accent); color:var(--accent-on); }
  .timer-controls{ display:flex; gap:12px; }
  .timer-controls .btn{ width:76px; height:76px; border-radius:50%; font-size:13px; flex-direction:column; }
  .timer-controls .btn svg{ width:24px; height:24px; }

  /* Sparkline */
  .spark-row{ display:flex; align-items:center; gap:12px; }
  .spark-stats{ flex:none; text-align:right; }
  .spark-stats .best{ font-size:20px; font-weight:700; font-family:"Barlow Condensed",sans-serif; color:var(--text); }
  .spark-stats .lbl{ font-size:10.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em; }
  svg.spark{ flex:1; min-width:0; height:44px; width:100%; overflow:visible; }

  /* V42: dashboard de Perfil. Se apoya en .pesostats/.pesostat de V40 y en
     los colores de origen del calendario (.cal-origin-bar/.cal-legend-dot),
     así que agrega lo mínimo: la fila de identidad, la barra apilada de
     origen y una fila de etiqueta+número. */
  /* V43: Mapa muscular. Reusa .anat-fig (las dos siluetas), .logrow,
     .pesostats y .segmented; agrega solo la caja del cuerpo, la barra de
     escala y el punto de color de cada fila. */
  .mapa-body{ max-width:340px; margin:0 auto; }
  .mapa-body .anat-fig{ gap:6px; }

  /* V47: anatomia real del mapa muscular. */
  /* La tarjeta es SIEMPRE clara, tambien en tema oscuro: el arte tiene el
     fondo blanco horneado y sobre una tarjeta oscura se recortaria como un
     rectangulo. Es una decision de producto, no un olvido. */
  .mapa-anat{ display:flex; gap:8px; justify-content:center; align-items:flex-start;
    background:#FFFFFF; border:1px solid var(--border); border-radius:14px; padding:10px; }
  .mapa-fig{ flex:1; max-width:50%; }
  .mapa-fig svg{ width:100%; height:auto; display:block; }
  .mapa-cap{ text-align:center; font-size:11.5px; color:#6E675F; margin-top:2px; }
  /* Capa pintada: solo tiñe, nunca recibe el clic.
     La opacidad es un atributo de CADA path, calculado por mapaTinteCapas().
     No se declara acá: una regla CSS ganaría al atributo SVG y haría visibles
     incluso las regiones con fill-opacity="0". */
  /* `multiply` es el piso: funciona en todos lados, aunque oscurece un poco. */
  .mapa-zona{ mix-blend-mode:multiply; pointer-events:none; }
  /* `color` toma el TONO del naranja y la LUMINOSIDAD de la lamina, asi que el
     musculo queda tenido conservando sus sombras en vez de tapado. Donde el
     navegador no lo soporte queda el multiply de arriba. */
  @supports (mix-blend-mode: color){
    .mapa-zona{ mix-blend-mode:color; }
  }
  /* V47.1. Segunda capa, solo para las intensidades altas. multiply es
     MULTIPLICATIVO: oscurece respetando el dibujo de abajo, asi que las sombras
     de la lamina siguen siendo sombras y las fibras no se tapan. Medido sobre
     el biceps a 5 puntos: el contraste local baja de 67,3 a 53,9, con el
     musculo claramente mas profundo. Una opacidad mas alta (se probo 0,60)
     aplastaba pectorales y dorsales en manchas planas. */
  .mapa-prof{ mix-blend-mode:multiply; pointer-events:none; }
  /* Cobertura genital: opaca y neutra. Sin mezcla ni transparencia — con
     multiply dejaba pasar el relieve de abajo, que es justo lo que no queremos
     que se marque. El borde se suaviza con un desenfoque chico. */
  .mapa-cobertura{ pointer-events:none; }
  /* Capa de toque: invisible y mas grande que el dibujo. */
  .mapa-hit{ fill:#000; fill-opacity:0; cursor:pointer; }
  .mapa-escala{ margin-top:10px; }
  .mapa-escala-barra{ display:flex; gap:2px; height:8px; border-radius:999px; overflow:hidden; }

  /* ---------- Grupos musculares (para el explorador y el generador automático) ----------
     A partir de la región de MAYOR intensidad de cada ejercicio en MUSCLE_MAP se deduce un
     "subgrupo" fino (útil para el generador: separa bíceps/tríceps/pecho/hombros/espalda/
     piernas/core) y un "grupo" visible más general (Pecho, Espalda, Piernas, Hombros,
     Brazos, Core) para el explorador por grupo muscular. */
  const REGION_SUBGROUP = {
    "chest-upper":"pecho", "chest-mid":"pecho", "chest-lower":"pecho",
    "shoulder-front":"hombros", "shoulder-lateral":"hombros", "shoulder-rear":"hombros",
    // V31 §12: "traps" pasa de espalda a hombros — los encogimientos son
    // principal Trapecios y Trapecios vive dentro del grupo visual Hombros
    // (no se crea un séptimo grupo). V31 §11: "lower-back" pasa de espalda a
    // core — Hiperextensiones queda como principal Core/zona lumbar en vez de
    // principal Espalda. Ambas son decisiones explícitas de V31 y reemplazan
    // lo documentado antes en VODAFIT_CONTEXT/VODAFIT_DECISIONS.
    "traps":"hombros", "rhomboids":"espalda", "lats":"espalda", "lower-back":"core",
    "biceps-long":"biceps", "biceps-short":"biceps",
    // V31 §13: el antebrazo es un SUBGRUPO propio (no un grupo visual nuevo):
    // cae dentro de "Brazos" vía SUBGROUP_TO_MUSCLEGROUP, igual que bíceps y
    // tríceps. Tiene ejercicios propios (Curl de muñeca / Curl de muñeca
    // inverso) — no se usa ningún curl de bíceps como sustituto.
    "forearms":"antebrazo",
    "triceps-long":"triceps", "triceps-lateral":"triceps", "triceps-medial":"triceps",
    "abs":"core", "obliques":"core",
    "quads-front":"piernas", "quads-outer":"piernas", "quads-inner":"piernas", "adductors":"piernas",
    "glutes":"piernas", "hamstrings":"piernas", "calves-gastro":"piernas", "calves-soleus":"piernas",
  };
  const SUBGROUP_TO_MUSCLEGROUP = { pecho:"Pecho", hombros:"Hombros", espalda:"Espalda", biceps:"Brazos", triceps:"Brazos", antebrazo:"Brazos", core:"Core", piernas:"Piernas" };
  const MUSCLE_GROUPS = ["Pecho","Espalda","Piernas","Hombros","Brazos","Core"];

  function exercisePrimarySubgroup(name){
    const info = MUSCLE_MAP[canonicalExerciseName(name)];
    if(!info || !info.t || !info.t.length) return null;
    let best = info.t[0];
    info.t.forEach(t=>{ if(t[1]>best[1]) best=t; });
    return REGION_SUBGROUP[best[0]] || null;
  }
  function exerciseMuscleGroup(name){
    const sg = exercisePrimarySubgroup(name);
    return sg ? SUBGROUP_TO_MUSCLEGROUP[sg] : null;
  }
  // Grupo muscular PRINCIPAL y SECUNDARIO (taxonomía de 6 grupos, para la ficha
  // de ejercicio) — se recorren las regiones de MUSCLE_MAP ordenadas por
  // intensidad y se toman los dos primeros grupos DISTINTOS que aparecen.
  function exercisePrincipalSecondaryGroups(name){
    const info = MUSCLE_MAP[canonicalExerciseName(name)];
    if(!info || !info.t || !info.t.length) return { principal:null, secondary:null };
    const sorted = info.t.slice().sort((a,b)=>b[1]-a[1]);
    const groupsInOrder = [];
    sorted.forEach(([region])=>{
      const sg = REGION_SUBGROUP[region];
      const g = sg && SUBGROUP_TO_MUSCLEGROUP[sg];
      if(g && groupsInOrder.indexOf(g)===-1) groupsInOrder.push(g);
    });
    return { principal: groupsInOrder[0]||null, secondary: groupsInOrder[1]||null };
  }
  // Sub-foco dentro de "piernas" (cuádriceps/glúteos/isquios/pantorrillas/
  // aductores) — usado por el generador automático para poder exigir que un
  // día de pierna tenga sí o sí un ejercicio de cuádriceps y uno de glúteo.
  function exerciseLegFocus(name){
    const info = MUSCLE_MAP[canonicalExerciseName(name)];
    if(!info || !info.t || !info.t.length) return null;
    let best = info.t[0];
    info.t.forEach(t=>{ if(t[1]>best[1]) best=t; });
    const region = best[0];
    if(region.indexOf("quads")===0) return "quads";
    if(region==="glutes") return "glutes";
    if(region==="hamstrings") return "hamstrings";
    if(region.indexOf("calves")===0) return "calves";
    if(region==="adductors") return "adductors";
    return null;
  }
  /* ================= V31: biblioteca definitiva ================= */
  // Cuatro estructuras nuevas, todas indexadas por NOMBRE canónico. Ninguna
  // duplica la información muscular: el principal y los secundarios se siguen
  // derivando de los pesos de MUSCLE_MAP (exercisePrimarySubgroup /
  // exercisePrincipalSecondaryGroups), que sigue siendo la única fuente de
  // verdad de "qué músculo trabaja cada ejercicio". Acá solo vive lo que
  // MUSCLE_MAP no puede expresar: cómo se llamaba antes un ejercicio, si
  // sigue ofreciéndose, a qué patrón de movimiento pertenece y cuánto pesa
  // ese patrón al sortear.

  // ---- Aliases: nombre viejo -> nombre canónico V31.
  // Sirven para que el HISTORIAL no se rompa al renombrar: un registro
  // guardado como "Sentadilla" se sigue leyendo, y se muestra/agrupa bajo
  // "Sentadilla con barra". No se borra ningún dato.
  const EXERCISE_ALIASES = {
    // Piernas — renombres V31 §5
    "Sentadilla": "Sentadilla con barra",
    "Prensa de piernas": "Prensa inclinada",
    "Extensión de cuádriceps": "Extensión de piernas",
    "Zancadas con mancuernas": "Estocadas con mancuerna",
    "Peso muerto": "Peso muerto con barra",
    "Peso muerto con mancuerna": "Peso muerto con mancuernas",
    "Peso muerto sumo": "Peso muerto sumo con barra",
    "Peso muerto rumano": "Peso muerto rumano con barra",
    "Curl femoral sentado": "Isquio sentado",
    "Curl femoral acostado": "Isquio acostado",
    "Elevación de talones en prensa": "Gemelos en prensa",
    "Elevación de talones de pie": "Gemelos en máquina",
    "Elevación de talones sentado": "Gemelos sentado en máquina",
    "Sentadilla hack": "Sentadilla Hack",
    "Step up": "Step Up",
    "Sentadilla sumo": "Sentadilla Sumo",
    "Puente de glúteo": "Puente de glúteos",
    // V31 §7: consolidaciones — mismo ejercicio bajo otro nombre, no duplicar.
    "Extensión de cadera en máquina": "Patada de glúteo en máquina",
    "Elevación de talones de pie con disco": "Gemelos parado con mancuerna",
    // Espalda / Hombros — renombres V31 §11 y §12
    "Pullover con mancuerna": "Pullover",
    "Remo con mancuerna": "Remo con mancuerna unilateral",
    "Press Arnold": "Arnold press",
    "Press tras nuca": "Press tras nuca con barra",
    "Elevaciones laterales": "Vuelos laterales con mancuerna",
    "Elevaciones frontales": "Vuelos frontales",
    "Pájaro (deltoide posterior)": "Vuelos pájaro",
    "Face pull": "Face Pull",
    "Press militar con mancuernas": "Press de hombros con mancuernas",
    // V32: nombres propios que Juan había cargado a mano en "Mi rutina" antes
    // de que existiera la biblioteca. Nunca tuvieron entrada en MUSCLE_MAP, así
    // que su ficha salía vacía ("Todavía no hay datos de músculo cargados").
    // Mapearlos acá les devuelve ficha, media y equipamiento sin tocar
    // MUSCLE_MAP ni perder un solo registro del historial.
    // V34: "Gemelos" era el único que quedaba sin decidir (es ambiguo por sí
    // solo: en máquina, en prensa, sentado o parado con mancuerna). Juan lo
    // confirmó a mano contra el diagnóstico de identidad — sus 5 registros
    // históricos y las 2 apariciones en rutinas son "Gemelos parado con
    // mancuerna". No se dedujo automáticamente: la capa normalizadora deja
    // "Gemelos" sin resolver a propósito, porque no es una variante de
    // escritura sino un nombre genuinamente distinto.
    "Gemelos": "Gemelos parado con mancuerna",
    "Press banca plano": "Press de banca con barra",
    "Press banca inclinado": "Press de banca inclinado con barra",
    "Pec deck (contractora)": "Pec Fly",
    "Pec deck inverso": "Pec Fly invertido",
    "Extensión de tríceps en polea c/barra": "Extensión de tríceps en polea con barra",
    "Extensión de tríceps en polea ag/Neutro": "Extensión de tríceps en polea",
    // V35.1: este alias apuntaba a un ejercicio intermedio que el generador no
    // ofrecía; se repuntó directo al activo. 2B borró ese intermedio.
    "Extensión de tríceps en polea ag/Prono": "Extensión de tríceps en polea con barra",
    "Curl con mancuernas inclinado": "Curl con mancuernas banco inclinado",
    "Press militar maquina": "Press de hombros en máquina",

    // ---- 2B: acá vivían los tres aliases cuya CLAVE era un ejercicio
    // retirado: "Jalón agarre ancho", "Encogimientos de hombros" y
    // "Extensión tríceps polea agarre prono". Existían para que el historial
    // viejo encontrara su reemplazo activo — o sea, compatibilidad histórica,
    // que es exactamente lo que 2B decidió no mantener. Se borraron junto con
    // sus ejercicios.
    //
    // Costo conocido, dejado a revisión: eran además TRES SINÓNIMOS DE
    // BÚSQUEDA útiles. "Encogimientos de hombros" es el nombre genérico más
    // natural en español y hoy escribirlo ya no sugiere nada. Si se quieren
    // recuperar, alcanza con volver a agregarlos como aliases PUROS (clave que
    // no es un ejercicio del catálogo — el caso normal de los otros 38), sin
    // resucitar ninguna entrada de catálogo.
    //
    // De los 38 que quedan, el de pushdown merece su nota: la diferencia de
    // énfasis en MUSCLE_MAP (cabeza larga vs lateral) no alcanzaba por sí sola
    // para justificar una identidad separada — decisión explícita de producto.
  };
  // Devuelve el nombre canónico de un ejercicio (el mismo nombre si ya lo es).
  // Se usa al LEER datos guardados (historial, registros, rutinas persistidas),
  // nunca para reescribir la base: los datos históricos quedan intactos.
  //
  // V34: la resolución pasa a tener DOS capas, en este orden:
  //   1) EXERCISE_ALIASES — la capa EXPLÍCITA, única fuente de equivalencias
  //      declaradas a mano. Siempre gana.
  //   2) Índice normalizado — colapsa diferencias de ESCRITURA (mayúsculas,
  //      acentos, puntuación, espacios y un set cerrado de preposiciones y
  //      artículos) contra los nombres canónicos. Solo resuelve cuando el
  //      resultado es ÚNICO; ante ambigüedad devuelve el nombre sin tocar.
  // La capa 2 NO inventa equivalencias: dos nombres genuinamente distintos
  // ("Prensa inclinada" vs "Sentadilla Hack") normalizan distinto y siguen
  // siendo ejercicios distintos. Lo único que resuelve son variantes de
  // escritura del MISMO nombre, que es lo que aparece cuando el nombre se
  // cargó a mano ("press de banca plano", "Press Banca Plano").
  function canonicalExerciseName(name){
    if(!name) return name;
    const explicit = EXERCISE_ALIASES[name];
    if(explicit) return explicit;
    return resolveExerciseNameNormalized(name) || name;
  }

  // ---- Capa normalizadora (V34).
  // Palabras que se descartan al normalizar. Es un set CERRADO y conservador:
  // solo preposiciones y artículos que nunca distinguen un ejercicio de otro.
  // No se descarta ninguna palabra con valor semántico ("sin", "unilateral",
  // "inverso", "alternado"...), porque ahí sí se perdería la variante.
  const EXERCISE_NAME_STOPWORDS = new Set([
    "de","del","la","el","los","las","con","en","a","al","y","para","por","un","una",
  ]);

  // Clave de comparación: minúsculas, sin acentos, sin puntuación, espacios
  // colapsados y sin las stopwords de arriba. Es SOLO una clave interna de
  // lookup — nunca se muestra ni se guarda.
  function normalizeExerciseName(name){
    if(!name) return "";
    // normalizeTxt (ya existe en la app) hace minúsculas + sin acentos; acá se
    // agrega puntuación y espacios para no duplicar esa lógica.
    const flat = normalizeTxt(name).replace(/[^a-z0-9]+/g, " ").trim();
    if(!flat) return "";
    return flat.split(/\s+/).filter(w=> !EXERCISE_NAME_STOPWORDS.has(w)).join(" ");
  }

  // Índice clave-normalizada -> nombre canónico, construido una sola vez a
  // partir de las MISMAS fuentes que ya existen (EXERCISES y los targets de
  // EXERCISE_ALIASES). No hay una tabla nueva de identidades ni un segundo
  // catálogo: si un nombre no sale de ahí, no se resuelve.
  //
  // Cuando dos nombres canónicos distintos comparten clave, la clave queda
  // marcada como AMBIGUA y deja de resolver: preferimos no resolver antes que
  // adivinar mal y unificar dos ejercicios que no son el mismo. Hoy no hay
  // ninguna clave ambigua entre los canónicos (verificado), pero la guarda
  // queda para que agregar un ejercicio nuevo nunca pueda romper el historial
  // en silencio.
  const EXERCISE_NORMALIZED_INDEX = (()=>{
    const idx = new Map();
    const add = (name, target)=>{
      const key = normalizeExerciseName(name);
      if(!key) return;
      const prev = idx.get(key);
      if(prev === undefined){ idx.set(key, target); return; }
      if(prev === null) return;              // ya marcada ambigua
      if(prev !== target) idx.set(key, null); // conflicto real -> ambigua
    };
    // Los canónicos primero: son el destino legítimo de cualquier variante.
    //
    // V35.1: se excluyen los que TIENEN alias explícito. Un nombre que está en
    // EXERCISE_ALIASES no es su propio canónico — su identidad es el target. La
    // exclusión hace falta desde que un nombre puede estar en EXERCISES y ser
    // clave de alias a la vez: los retirados de V31 siguen en EXERCISES (para
    // que el historial conserve su ficha) y dos de ellos ahora tienen alias
    // hacia un activo. Sin esta exclusión, ese nombre se agregaba dos veces con
    // destinos distintos, la clave quedaba marcada AMBIGUA y la capa
    // normalizadora dejaba de resolver sus variantes de escritura
    // ("encogimientos de hombros" en minúsculas ya no llegaba a ningún lado).
    // La capa explícita seguía funcionando, pero la normalizadora se perdía.
    EXERCISES.forEach(n=>{ if(!EXERCISE_ALIASES[n]) add(n, n); });
    // Las claves de los alias apuntan al MISMO target que el alias explícito,
    // así una variante de escritura de un nombre viejo ("face pull" con otra
    // capitalización) también llega al canónico. Cuando la clave de un alias
    // coincide con la de su propio target (los renombres que solo cambian
    // mayúsculas) no hay conflicto: el target es el mismo.
    Object.keys(EXERCISE_ALIASES).forEach(old=> add(old, EXERCISE_ALIASES[old]));
    return idx;
  })();

  // Devuelve el canónico si la clave normalizada resuelve de forma ÚNICA.
  // Devuelve null si el nombre no está en el índice o si la clave es ambigua.
  function resolveExerciseNameNormalized(name){
    const key = normalizeExerciseName(name);
    if(!key) return null;
    const hit = EXERCISE_NORMALIZED_INDEX.get(key);
    return (hit === undefined || hit === null) ? null : hit;
  }

  // ¿La clave de este nombre es ambigua en el índice? (se usa en el
  // diagnóstico para separar "no lo conozco" de "no me arriesgo a decidir").
  function isAmbiguousExerciseName(name){
    const key = normalizeExerciseName(name);
    if(!key) return false;
    return EXERCISE_NORMALIZED_INDEX.get(key) === null;
  }

  // ¿Este nombre resuelve a algún canónico, por cualquiera de las dos capas?
  function exerciseNameResolves(name){
    if(!name) return false;
    if(EXERCISE_ALIASES[name]) return true;
    if(EXERCISES.indexOf(name) !== -1) return true;
    return resolveExerciseNameNormalized(name) !== null;
  }

  // ---- Diagnóstico de identidad (V34).
  // Herramienta de LECTURA PURA: recorre los nombres crudos que aparecen en
  // los datos del usuario (registros históricos y rutinas guardadas) y los
  // clasifica. No escribe nada, no borra nada, no agrega aliases y no toca la
  // base. Sirve para decidir a mano qué equivalencias genuinas faltan.
  //
  // `registroNames` y `rutinaNames` son listas de nombres CRUDOS (sin pasar
  // por canonicalExerciseName), porque justamente lo que se quiere ver es qué
  // hay guardado de verdad.
  function exerciseIdentityDiagnostics(registroNames, rutinaNames){
    const clasificar = (names)=>{
      const seen = new Map(); // nombre crudo -> cantidad de apariciones
      (names||[]).forEach(n=>{
        const raw = (n==null ? "" : String(n)).trim();
        if(!raw) return;
        seen.set(raw, (seen.get(raw)||0) + 1);
      });
      const unresolved = [], ambiguous = [], normalized = [];
      seen.forEach((count, raw)=>{
        if(EXERCISE_ALIASES[raw] || EXERCISES.indexOf(raw) !== -1) return; // ya identificado
        if(isAmbiguousExerciseName(raw)){
          ambiguous.push({ nombre: raw, count, key: normalizeExerciseName(raw) });
          return;
        }
        const hit = resolveExerciseNameNormalized(raw);
        if(hit) normalized.push({ nombre: raw, count, canonico: hit });
        else unresolved.push({ nombre: raw, count });
      });
      const porNombre = (a,b)=> a.nombre.localeCompare(b.nombre, "es");
      return {
        unresolved: unresolved.sort(porNombre),
        ambiguous: ambiguous.sort(porNombre),
        normalized: normalized.sort(porNombre),
        total: seen.size,
      };
    };
    const registros = clasificar(registroNames);
    const rutinas = clasificar(rutinaNames);
    return {
      registros,
      rutinas,
      // Ambigüedades vistas en los datos, de las dos fuentes juntas.
      ambiguas: registros.ambiguous.concat(rutinas.ambiguous),
      sinResolver: registros.unresolved.length + rutinas.unresolved.length,
    };
  }

  // ---- CATÁLOGO OFICIAL ACTIVO (Etapa 2B).
  //
  // Hasta V43 existía una categoría "retirados": doce ejercicios que seguían
  // en EXERCISES y en MUSCLE_MAP, filtrados en cada consumidor por
  // un filtro en cada consumidor, para que el historial conservara su ficha.
  //
  // 2B elimina esa categoría. La app está en etapa de prueba y no hay
  // historial que preservar, así que los retirados se borraron de verdad de
  // todas las tablas en vez de quedar escondidos detrás de un filtro. Once se
  // eliminaron; "Hip thrust" se renombró a "Hip thrust con barra" y volvió al
  // catálogo (ver §2 de 2B).
  //
  // Consecuencia de diseño: EXERCISES ahora contiene EXACTAMENTE el catálogo
  // oficial activo. No hay nada que filtrar, y por eso no queda ningún
  // if(isRetired...) en los pools. Si alguna vez hay que retirar otro
  // ejercicio, se borra de las tablas — no se agrega un filtro nuevo.
  //
  // activeExercises() existe igual, como ÚNICA puerta de entrada al catálogo
  // oficial, por dos razones:
  //   1. deja un solo lugar donde cambiar la definición de "oficial activo";
  //   2. marca explícitamente la frontera con los ejercicios PERSONALIZADOS
  //      del usuario (§7 de 2B), que viven fuera de EXERCISES y que nunca
  //      deben entrar al generador automático ni a las sugerencias del
  //      catálogo oficial.
  function activeExercises(){
    return EXERCISES;
  }

  // ---- Patrón de movimiento (V31 §3 y §10).
  // Regla: DIVERSIDAD DE PATRÓN > DIVERSIDAD NOMINAL. Barra y mancuerna
  // pueden ser dos ejercicios distintos de la biblioteca y compartir patrón;
  // el selector evita elegir dos variantes del mismo patrón mientras haya
  // alternativas válidas.
  const EXERCISE_PATTERN = {
    // --- Piernas (§10) ---
    "Sentadilla con barra":"sentadilla", "Sentadilla frontal":"sentadilla",
    "Sentadilla Sumo":"sentadilla", "Sentadilla Smith":"sentadilla", "Sentadilla Hack":"sentadilla",
    "Prensa inclinada":"prensa",
    "Sentadilla búlgara":"unilateral-pierna", "Estocadas con mancuerna":"unilateral-pierna", "Step Up":"unilateral-pierna",
    "Extensión de piernas":"extension-rodilla",
    "Peso muerto con barra":"bisagra", "Peso muerto con mancuernas":"bisagra",
    "Peso muerto rumano con barra":"bisagra", "Peso muerto rumano con mancuernas":"bisagra",
    "Peso muerto sumo con barra":"bisagra-sumo", "Peso muerto sumo con mancuernas":"bisagra-sumo",
    "Hip thrust con barra":"extension-cadera", "Hip thrust en máquina":"extension-cadera",
    "Puente de glúteos":"extension-cadera",
    "Patada de glúteo en máquina":"extension-cadera", "Patada de glúteo en polea":"extension-cadera",
    "Abductores en máquina":"abduccion",
    "Isquio sentado":"flexion-rodilla", "Isquio acostado":"flexion-rodilla",
    "Aductores en máquina":"aduccion",
    "Gemelos en prensa":"gemelos-de-pie", "Gemelos en máquina":"gemelos-de-pie", "Gemelos parado con mancuerna":"gemelos-de-pie",
    "Gemelos sentado en máquina":"gemelos-sentado",
    // --- Espalda (§11) ---
    "Dominadas":"traccion-vertical", "Dominadas supinas":"traccion-vertical",
    "Jalón al pecho":"traccion-vertical", "Jalón agarre supino":"traccion-vertical",
    "Jalón agarre neutro":"traccion-vertical",
    "Remo con barra":"traccion-horizontal", "Remo con mancuerna unilateral":"traccion-horizontal",
    "Remo en polea baja":"traccion-horizontal", "Remo en máquina":"traccion-horizontal",
    "Remo en máquina unilateral":"traccion-horizontal", "Remo en máquina agarre ancho":"traccion-horizontal",
    "Remo en T":"traccion-horizontal", "Remo en TRX":"traccion-horizontal", "Remo en Hammer":"traccion-horizontal",
    "Pullover":"pullover",
    "Hiperextensiones":"extension-lumbar",
    // --- Pecho ---
    "Press de banca con barra":"press-horizontal", "Press de banca plano en Smith":"press-horizontal",
    "Press de banca inclinado con barra":"press-inclinado", "Press de banca inclinado con mancuernas":"press-inclinado",
    "Press de banca inclinado en Smith":"press-inclinado",
    "Press de banca declinado":"press-declinado", "Press de banca declinado en Smith":"press-declinado",
    "Aperturas de pecho con mancuernas en banco plano":"apertura",
    "Aperturas de pecho con mancuernas en banco inclinado":"apertura",
    "Pec Fly":"apertura", "Press de pecho en polea":"apertura",
    "Fondos inclinado":"fondos", "Flexiones de brazo":"press-horizontal",
    // --- Hombros (§12) ---
    "Press militar con barra":"press-hombro", "Press de hombros con mancuernas":"press-hombro",
    "Press militar con mancuernas sentado":"press-hombro", "Press de hombros en máquina":"press-hombro",
    "Arnold press":"press-hombro", "Press tras nuca con barra":"press-hombro",
    "Vuelos laterales con mancuerna":"elevacion-lateral", "Elevación lateral en máquina":"elevacion-lateral",
    "Elevación lateral en polea":"elevacion-lateral",
    "Vuelos frontales":"elevacion-frontal",
    "Vuelos pájaro":"deltoide-posterior", "Pec Fly invertido":"deltoide-posterior", "Face Pull":"deltoide-posterior",
    "Remo al mentón":"remo-menton",
    "Encogimientos con mancuernas":"encogimiento", "Encogimientos con barra":"encogimiento", "Encogimientos en máquina":"encogimiento",
    // --- Brazos (§13) — los patrones respetan las cabezas ---
    "Curl con barra":"curl-supinado", "Curl con mancuernas":"curl-supinado",
    "Curl con mancuernas alternado":"curl-supinado", "Curl en polea":"curl-supinado",
    "Curl con mancuernas banco inclinado":"curl-cabeza-larga",
    "Curl Scott (predicador)":"curl-cabeza-corta", "Curl concentrado":"curl-cabeza-corta",
    "Curl en polea unilateral":"curl-polea-unilateral",
    "Curl martillo":"curl-neutro",
    "Curl de muñeca":"flexion-muneca", "Curl de muñeca inverso":"extension-muneca",
    "Press francés":"triceps-sobre-cabeza", "Extensión de tríceps con mancuerna":"triceps-sobre-cabeza",
    "Extensión de tríceps en polea":"triceps-pushdown", "Extensión de tríceps en polea con barra":"triceps-pushdown",
    "Press cerrado":"triceps-press-cerrado",
    "Fondos de tríceps en banco":"triceps-fondos",
    "Patada de tríceps":"triceps-patada",
    // --- Core ---
    "Abdominales crunch":"flexion-tronco", "Crunch en polea":"flexion-tronco", "Rueda abdominal":"anti-extension",
    "Elevación de piernas colgado":"flexion-cadera-colgado",
    "Plancha":"anti-extension", "Plancha lateral":"anti-lateral",
    "Giro ruso (russian twist)":"rotacion", "Mountain climbers":"flexion-cadera-colgado",
  };
  function exercisePattern(name){
    const n = canonicalExerciseName(name);
    // Sin patrón declarado, el propio nombre actúa como patrón único: así un
    // ejercicio nuevo nunca se considera "equivalente" a otro por accidente.
    return EXERCISE_PATTERN[n] || ("nombre:" + n);
  }

  // ---- Predominancia por patrón (V31 §2). Escala ÚNICA de cuatro niveles;
  // PATTERN_PREDOMINANCE_WEIGHT es la traducción a número que usa el sorteo.
  // No existe una segunda escala en ningún otro lado.
  const PATTERN_PREDOMINANCE = {
    // Piernas
    "sentadilla":"ALTA", "prensa":"ALTA", "bisagra":"ALTA",
    "unilateral-pierna":"MEDIA_ALTA", "bisagra-sumo":"MEDIA_ALTA", "extension-cadera":"MEDIA_ALTA",
    "extension-rodilla":"MEDIA", "flexion-rodilla":"MEDIA", "gemelos-de-pie":"MEDIA",
    "gemelos-sentado":"BAJA", "abduccion":"BAJA", "aduccion":"BAJA",
    // Espalda
    "traccion-vertical":"ALTA", "traccion-horizontal":"ALTA", "pullover":"MEDIA", "extension-lumbar":"MEDIA",
    // Pecho
    "press-horizontal":"ALTA", "press-inclinado":"MEDIA_ALTA", "press-declinado":"MEDIA",
    "apertura":"MEDIA", "fondos":"MEDIA_ALTA",
    // Hombros
    "press-hombro":"ALTA", "elevacion-lateral":"MEDIA_ALTA", "deltoide-posterior":"MEDIA",
    "elevacion-frontal":"BAJA", "remo-menton":"MEDIA", "encogimiento":"MEDIA",
    // Brazos
    "curl-supinado":"MEDIA_ALTA", "curl-cabeza-larga":"MEDIA", "curl-cabeza-corta":"MEDIA",
    "curl-polea-unilateral":"MEDIA", "curl-neutro":"MEDIA",
    "flexion-muneca":"BAJA", "extension-muneca":"BAJA",
    "triceps-pushdown":"MEDIA_ALTA", "triceps-sobre-cabeza":"MEDIA_ALTA",
    "triceps-press-cerrado":"ALTA", "triceps-fondos":"MEDIA", "triceps-patada":"BAJA",
    // Core
    "flexion-tronco":"MEDIA", "anti-extension":"MEDIA", "anti-lateral":"BAJA",
    "rotacion":"BAJA", "flexion-cadera-colgado":"MEDIA",
  };
  const PATTERN_PREDOMINANCE_WEIGHT = { ALTA:1.6, MEDIA_ALTA:1.3, MEDIA:1.0, BAJA:0.7 };
  function exercisePredominance(name){
    return PATTERN_PREDOMINANCE[exercisePattern(name)] || "MEDIA";
  }
  function exercisePredominanceWeight(name){
    return PATTERN_PREDOMINANCE_WEIGHT[exercisePredominance(name)] || 1;
  }

  // ---- Edad y equipamiento (V31 §4 y §21).
  // Capa FINAL de ponderación, una sola función reutilizable para no duplicar
  // la lógica en cada selector. NO prohíbe nada: devuelve un multiplicador
  // siempre > 0, así los ejercicios libres siguen siendo elegibles a cualquier
  // edad. La exclusión dura sigue siendo responsabilidad exclusiva e
  // independiente de EXERCISES_RISKY_50PLUS.
  const GUIDED_EQUIPMENT = new Set(["Máquina","Polea"]);
  function ageEquipmentWeight(nombre, edad){
    if(edad==null || edad<40) return 1;
    const n = canonicalExerciseName(nombre);
    const eq = EXERCISE_EQUIPMENT[n];
    // "Smith" no es un valor de equipamiento propio (las variantes en Smith ya
    // están cargadas como "Máquina"), pero se contempla por nombre para los
    // ejercicios cuyo equipamiento todavía no esté declarado.
    const guided = GUIDED_EQUIPMENT.has(eq) || /smith/i.test(n);
    if(!guided) return 1;
    return edad>=50 ? 1.7 : 1.35;
  }

  // ---- Sorteo ponderado ÚNICO de V31.
  // Combina, en este orden: predominancia del patrón (§2) × preferencia por
  // equipamiento guiado según edad (§4) × penalización por patrón repetido
  // (§3, "diversidad de patrón > diversidad nominal"). Todos los selectores
  // pasan por acá, así la regla de edad se aplica una sola vez y no se
  // duplica en cada generador.
  // La penalización de patrón NO es una prohibición: si el único candidato
  // que queda comparte patrón, igual se elige (peso chico pero > 0).
  const PATTERN_REPEAT_PENALTY = 0.15;
  function v31Weight(name, opts){
    opts = opts || {};
    let w = exercisePredominanceWeight(name) * ageEquipmentWeight(name, opts.edad);
    if(opts.usedPatterns && opts.usedPatterns.has(exercisePattern(name))) w *= PATTERN_REPEAT_PENALTY;
    return Math.max(0.0001, w);
  }
  function weightedPick(cands, opts){
    if(!cands.length) return null;
    const weights = cands.map(n=> v31Weight(n, opts));
    const total = weights.reduce((a,b)=>a+b,0);
    let r = Math.random()*total;
    for(let i=0;i<cands.length;i++){ r -= weights[i]; if(r<=0) return cands[i]; }
    return cands[cands.length-1];
  }
  // Hasta `count` nombres DISTINTOS.
  // V31 §3/§10 es una regla DURA, no una preferencia: "no seleccionar dos
  // variantes equivalentes del mismo patrón si hay alternativas válidas".
  // Por eso, mientras quede algún candidato de patrón todavía no usado, se
  // sortea SOLO entre esos; recién cuando no queda ninguno se permite repetir
  // patrón (caso "ya no hay alternativas"). La ponderación por predominancia
  // y edad decide dentro del conjunto que esta regla ya dejó pasar.
  function candidatesWithFreshPattern(pool, used){
    const nuevos = pool.filter(n=> !used.has(exercisePattern(n)));
    return nuevos.length ? nuevos : pool;
  }
  function weightedPickMany(cands, count, opts){
    opts = opts || {};
    const used = opts.usedPatterns || new Set();
    const pool = cands.slice();
    const out = [];
    while(out.length<count && pool.length){
      const pick = weightedPick(candidatesWithFreshPattern(pool, used), { edad:opts.edad, usedPatterns:used });
      if(pick==null) break;
      out.push(pick);
      used.add(exercisePattern(pick));
      pool.splice(pool.indexOf(pick),1);
    }
    return out;
  }

  /* ---- V31 §13/§20: Brazos por patrón (3 tríceps / 2 bíceps / 1 antebrazo) ----
     "antebrazo" es un SUBGRUPO propio dentro del grupo visual Brazos (ver
     REGION_SUBGROUP / SUBGROUP_TO_MUSCLEGROUP), con ejercicios propios:
     Curl de muñeca (flexión) y Curl de muñeca inverso (extensión). El Curl
     martillo NO hace de antebrazo: es un ejercicio de bíceps.
     El antebrazo tampoco es un foco seleccionable en la UI (no está en
     FOCUSED_GROUPS): solo entra como el "+1" del día de Bíceps + Tríceps.
     La diversidad de patrón es la que garantiza la cobertura de cabezas:
     los patrones de tríceps ya están separados por cabeza dominante
     (sobre-cabeza = larga, pushdown = lateral/medial, press cerrado, fondos,
     patada) y los de bíceps por cabeza (larga / corta / supinado). */
  const ARM_PATTERN_SUBFOCUS = {
    "curl-supinado":"biceps", "curl-cabeza-larga":"biceps",
    "curl-cabeza-corta":"biceps", "curl-polea-unilateral":"biceps",
    // El Curl martillo es un ejercicio de BÍCEPS (agarre neutro). El antebrazo
    // tiene sus propios ejercicios, abajo — no se usa el martillo como
    // sustituto.
    "curl-neutro":"biceps",
    "flexion-muneca":"antebrazo", "extension-muneca":"antebrazo",
    "triceps-sobre-cabeza":"triceps", "triceps-pushdown":"triceps",
    "triceps-press-cerrado":"triceps", "triceps-fondos":"triceps", "triceps-patada":"triceps",
  };
  function exerciseArmSubfocus(name){
    return ARM_PATTERN_SUBFOCUS[exercisePattern(name)] || null;
  }
  // Pool activo de un sub-foco de brazo (biceps / triceps / antebrazo).
  function armSubfocusPool(subfocus, riskyExclude){
    return Object.keys(MUSCLE_MAP).filter(n=>{
      if(riskyExclude && riskyExclude.has(n)) return false;
      return exerciseArmSubfocus(n)===subfocus;
    });
  }
  // Elige `count` ejercicios del sub-foco priorizando PATRONES distintos
  // (= cabezas distintas) por sobre variedad de nombres.
  function pickArmsByPattern(subfocus, count, avoidSet, opts){
    opts = opts || {};
    const pool = armSubfocusPool(subfocus, opts.riskyExclude);
    if(!pool.length || count<=0) return [];
    const usedPatterns = opts.usedPatterns || new Set();
    const chosen = [];
    // Primera vuelta: un ejercicio por patrón todavía no usado.
    const byPattern = {};
    pool.forEach(n=>{ const p = exercisePattern(n); (byPattern[p] = byPattern[p]||[]).push(n); });
    const patterns = Object.keys(byPattern).filter(p=> !usedPatterns.has(p));
    shuffleArr(patterns).forEach(p=>{
      if(chosen.length>=count) return;
      const cands = byPattern[p].filter(n=> chosen.indexOf(n)===-1);
      const fresh = cands.filter(n=> !avoidSet.has(n));
      const pick = weightedPick(fresh.length ? fresh : cands, { edad:opts.edad });
      if(pick!=null){ chosen.push(pick); usedPatterns.add(p); avoidSet.add(pick); }
    });
    // Si faltan (menos patrones que cupos), se completa con lo que quede.
    if(chosen.length < count){
      const rest = pool.filter(n=> chosen.indexOf(n)===-1);
      weightedPickMany(rest, count-chosen.length, { edad:opts.edad, usedPatterns })
        .forEach(n=>{ chosen.push(n); avoidSet.add(n); });
    }
    return chosen.slice(0,count);
  }
  // Día exclusivamente de brazos: 3 tríceps + 2 bíceps + 1 antebrazo (§13).
  // El antebrazo NO cuenta como un foco elegido por el usuario (§20).
  const ARMS_DAY_SHAPE = [["triceps",3],["biceps",2],["antebrazo",1]];
  function pickArmsDayExercises(avoidSet, opts){
    opts = opts || {};
    const usedPatterns = opts.usedPatterns || new Set();
    const out = [];
    ARMS_DAY_SHAPE.forEach(([sf,n])=>{
      out.push(...pickArmsByPattern(sf, n, avoidSet, { edad:opts.edad, riskyExclude:opts.riskyExclude, usedPatterns }));
    });
    return out;
  }

  let _legFocusPoolsCache = null;
  // excludeSet (opcional): nombres de ejercicio a dejar afuera del pool — lo usa
  // el generador de rutina automática para un perfil de 50+ años (ver
  // EXERCISES_RISKY_50PLUS más abajo). Con excludeSet no se usa el cache
  // (es un caso puntual, no vale la pena cachearlo aparte) — sin excludeSet
  // el comportamiento es exactamente el de siempre (Explorador, Biblioteca, etc.)
  function legFocusPools(excludeSet){
    if(!excludeSet && _legFocusPoolsCache) return _legFocusPoolsCache;
    const pools = { quads:[], glutes:[], hamstrings:[], calves:[], adductors:[] };
    Object.keys(MUSCLE_MAP).forEach(name=>{
      if(excludeSet && excludeSet.has(name)) return;
      const f = exerciseLegFocus(name);
      if(f && pools[f]) pools[f].push(name);
    });
    if(!excludeSet) _legFocusPoolsCache = pools;
    return pools;
  }
  // ---- V29: 10 subgrupos (Día Especial) ----
  // "piernas" se divide en cuádriceps / glúteos / isquiosurales / gemelos
  // usando SOLO la clasificación que ya existía en MUSCLE_MAP (región de
  // mayor intensidad, vía exerciseLegFocus) — no se inventa ninguna
  // clasificación nueva. Los ejercicios cuya región principal es "adductors"
  // (aductores) no caen de forma inequívoca en ninguno de los 4 → quedan
  // SIN subgrupo de 10 (ambiguos, ver ambiguousLegExercises) y no se usan en
  // los pools de Día Especial.
  // IMPORTANTE: esto es ADITIVO. El subgrupo "piernas" se mantiene tal cual
  // para el generador de rutina automática semanal (SPLIT_DAYS, reparto por
  // sexo, cobertura semanal de v16), que ya maneja los sub-focos de pierna
  // por su cuenta con legFocusPools — cambiarlo rompería esa rutina.
  const LEG_FOCUS_TO_SUBGROUP10 = { quads:"cuadriceps", glutes:"gluteos", hamstrings:"isquiosurales", calves:"gemelos" };
  const LEG_SUBGROUPS10 = ["cuadriceps","gluteos","isquiosurales","gemelos"];
  const SPECIAL_SUBGROUPS = ["pecho","espalda","hombros","biceps","triceps","cuadriceps","gluteos","isquiosurales","gemelos","core"];
  const SPECIAL_SUBGROUP_LABELS = {
    pecho:"Pecho", espalda:"Espalda", hombros:"Hombros", biceps:"Bíceps", triceps:"Tríceps",
    cuadriceps:"Cuádriceps", gluteos:"Glúteos", isquiosurales:"Isquiosurales", gemelos:"Gemelos", core:"Core",
  };
  function exerciseSubgroup10(name){
    const sg = exercisePrimarySubgroup(name);
    if(!sg) return null;
    if(sg!=="piernas") return sg;
    return LEG_FOCUS_TO_SUBGROUP10[exerciseLegFocus(name)] || null;
  }
  // Ejercicios de "piernas" que no se pueden asignar sin ambigüedad a uno de
  // los 4 subgrupos (hoy: los de región principal "aductores").
  function ambiguousLegExercises(){
    return Object.keys(MUSCLE_MAP).filter(n=> exercisePrimarySubgroup(n)==="piernas" && !exerciseSubgroup10(n));
  }

  let _subgroupPoolsCache = null;
  // V29: además de los 7 subgrupos de siempre (incluido "piernas" completo,
  // que sigue usando la rutina automática), el objeto trae 4 claves nuevas
  // — cuadriceps, gluteos, isquiosurales, gemelos — para Día Especial. Todo
  // el código existente accede por clave, así que agregar claves no cambia
  // nada de lo que ya funcionaba.
  function subgroupPools(excludeSet){
    if(!excludeSet && _subgroupPoolsCache) return _subgroupPoolsCache;
    const pools = {};
    Object.keys(MUSCLE_MAP).forEach(name=>{
      if(excludeSet && excludeSet.has(name)) return;
      const sg = exercisePrimarySubgroup(name);
      if(!sg) return;
      (pools[sg] = pools[sg]||[]).push(name);
      if(sg==="piernas"){
        const sg10 = exerciseSubgroup10(name);
        if(sg10) (pools[sg10] = pools[sg10]||[]).push(name);
      }
    });
    if(!excludeSet) _subgroupPoolsCache = pools;
    return pools;
  }
  // 2B: las claves de MUSCLE_MAP son todas de ejercicios oficiales activos
  // (los retirados se borraron), así que no hay nada que filtrar acá.
  function muscleGroupPools(){
    const pools = {};
    MUSCLE_GROUPS.forEach(g=>pools[g]=[]);
    Object.keys(MUSCLE_MAP).forEach(name=>{
      const g = exerciseMuscleGroup(name);
      if(g) pools[g].push(name);
    });
    MUSCLE_GROUPS.forEach(g=> pools[g].sort((a,b)=>a.localeCompare(b,"es")));
    return pools;
  }

  const MUSCLE_LABELS = {
    "chest-upper":"pecho superior", "chest-mid":"pecho medio", "chest-lower":"pecho inferior",
    "shoulder-front":"hombro (deltoide frontal)", "shoulder-lateral":"hombro (deltoide lateral)", "shoulder-rear":"hombro (deltoide posterior)",
    "traps":"trapecios", "rhomboids":"espalda media (romboides)",
    "biceps-long":"bíceps (cabeza larga)", "biceps-short":"bíceps (cabeza corta)",
    "forearms":"antebrazo",
    "abs":"abdomen", "obliques":"oblicuos",
    "lats":"dorsales", "lower-back":"zona lumbar",
    "triceps-long":"tríceps (cabeza larga)", "triceps-lateral":"tríceps (cabeza lateral)", "triceps-medial":"tríceps (cabeza medial)",
    "quads-front":"cuádriceps (recto femoral)", "quads-outer":"cuádriceps (vasto externo)", "quads-inner":"cuádriceps (vasto interno)",
    "adductors":"aductores",
    "glutes":"glúteos", "hamstrings":"isquiotibiales",
    "calves-gastro":"gemelo", "calves-soleus":"sóleo",
  };

  // Etiquetas cortas para escribir directo sobre el diagrama grande (modal
  // "Cómo hacerlo"). Como cada silueta (front-upper/back-upper/front-leg/
  // back-leg) nunca mezcla, por ej., tríceps con bíceps en la misma imagen,
  // se puede omitir el nombre del músculo grande y dejar solo la parte
  // específica sin ambigüedad.
  const MUSCLE_LABELS_SHORT = {
    "chest-upper":"Pecho superior", "chest-mid":"Pecho medio", "chest-lower":"Pecho inferior",
    "shoulder-front":"Deltoide frontal", "shoulder-lateral":"Deltoide lateral", "shoulder-rear":"Deltoide posterior",
    "traps":"Trapecio", "rhomboids":"Romboides",
    "biceps-long":"Cabeza larga", "biceps-short":"Cabeza corta",
    "forearms":"Antebrazo",
    "abs":"Abdomen", "obliques":"Oblicuos",
    "lats":"Dorsales", "lower-back":"Zona lumbar",
    "triceps-long":"Cabeza larga", "triceps-lateral":"Cabeza lateral", "triceps-medial":"Cabeza medial",
    "quads-front":"Recto femoral", "quads-outer":"Vasto externo", "quads-inner":"Vasto interno",
    "adductors":"Aductores",
    "glutes":"Glúteos", "hamstrings":"Isquiotibiales",
    "calves-gastro":"Gemelo", "calves-soleus":"Sóleo",

  function estiramientoPorId(id){
    for(let i=0;i<ESTIRAMIENTOS.length;i++){ if(ESTIRAMIENTOS[i].id===id) return ESTIRAMIENTOS[i]; }
    return null;
  }
  // Grupo visual (los 6 de siempre) de una ficha, para los filtros de la
  // biblioteca. Sale de SUBGROUP_TO_MUSCLEGROUP, no de una lista nueva.
  function estiramientoGrupo(e){ return SUBGROUP_TO_MUSCLEGROUP[e.subgrupos[0]] || null; }
  // Etiqueta de zona que ve el usuario: para pierna, el foco (Cuadriceps,
  // Gluteos...); para el resto, el grupo visual.
  function estiramientoZona(e){
    if(e.legFocus) return (ESTIRAMIENTO_FOCO_LABEL[e.legFocus] || "Piernas");
    return ESTIRAMIENTO_ZONA_LABEL[e.subgrupos[0]] || estiramientoGrupo(e) || "";
  }

  // Clave de recomendacion de UN ejercicio. Devuelve null cuando no se puede
  // afirmar nada: el cardio y los personalizados no tienen MUSCLE_MAP, y una
  // pierna sin legFocus no se degrada a "piernas" generico — antes de
  // recomendar mal, no se recomienda.
  function estiramientoClaveDeEjercicio(nombre){
    const sg = exercisePrimarySubgroup(nombre);
    if(!sg) return null;
    if(sg !== "piernas") return sg;
    const lf = exerciseLegFocus(nombre);
    return lf ? ("pierna:" + lf) : null;
  }
  function estiramientosDeClave(clave){
    if(clave.indexOf("pierna:")===0){
      const lf = clave.slice(7);
      return ESTIRAMIENTOS.filter(function(e){ return e.legFocus===lf; });
    }
    return ESTIRAMIENTOS.filter(function(e){ return !e.legFocus && e.subgrupos.indexOf(clave)!==-1; });
  }

  // MOTOR PURO (sin DOM, sin state, sin Supabase, sin azar), al estilo de
  // muscleMapStats: recibe nombres de ejercicio y devuelve hasta
  // ESTIRAMIENTOS_MAX fichas. Mismo input -> mismo output, siempre.
  //
  // Reparto: se cuenta cuantos ejercicios DISTINTOS tocaron cada clave, se
  // ordena por esa cantidad (desempate alfabetico, para que sea determinista) y
  // se reparte una ficha por clave en rondas. Nunca se completa la lista con
  // zonas que no se entrenaron: si las claves trabajadas solo dan 2 fichas,
  // devuelve 2.
  function estiramientosParaEjercicios(nombres){
    const vistos = {}, cuenta = {};
    (nombres||[]).forEach(function(n){
      const canon = canonicalExerciseName(n);
      if(!canon || vistos[canon]) return;
      vistos[canon] = true;
      const clave = estiramientoClaveDeEjercicio(canon);
      if(!clave) return;
      cuenta[clave] = (cuenta[clave]||0) + 1;
    });
    const claves = Object.keys(cuenta).sort(function(a,b){ return (cuenta[b]-cuenta[a]) || (a<b?-1:(a>b?1:0)); });
    const out = [], usados = {};
    let ronda = 0, quedan = true;
    while(out.length < ESTIRAMIENTOS_MAX && quedan){
      quedan = false;
      for(let i=0;i<claves.length && out.length<ESTIRAMIENTOS_MAX;i++){
        const lista = estiramientosDeClave(claves[i]);
        if(ronda < lista.length){
          quedan = true;
          const e = lista[ronda];
          if(!usados[e.id]){ usados[e.id] = true; out.push(e); }
        }
      }
      ronda++;
    }
    return out;
  }

  // V46.2: estiramientos de un DIA de la rutina, sin haber entrenado. Es el
  // MISMO motor que usa el cierre de sesión (estiramientosParaEjercicios) con
  // otra entrada: al finalizar entran los ejercicios con series completadas,
  // acá entran todos los del día. No hay una segunda lógica de selección, así
  // que los focos de pierna y el tope de 5 se respetan igual por los dos lados.
  function estiramientosDeDia(day){
    return estiramientosParaEjercicios(((day && day.exercises) || []).map(function(ex){ return ex.nombre; }));
  }

  // Ejercicios de un dia con AL MENOS una serie completada. Pura: recibe el dia
  // y el mapa de sets de la sesion, no los lee de state — asi se puede calcular
  // ANTES de limpiar state.session al finalizar, y los tests la llaman sola.
  function ejerciciosConSerieCompletada(day, sets){
    const s = sets || {};
    return ((day && day.exercises) || [])
      .filter(function(ex){ return (s[ex.id]||[]).some(Boolean); })
      .map(function(ex){ return ex.nombre; });
  }

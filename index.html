      b.onclick = ()=>{ state.explorerGroup = b.dataset.group; renderExplorer(); };
    });
    el.querySelectorAll("[data-ex-explore]").forEach(row=>{
      row.onclick = ()=> openExerciseDetail(row.dataset.exExplore, { returnTab:"explorar" });
    });
  }

  function afterScreenMount(){
    if(state.tab==="rutina") mountRutina();
    else if(state.tab==="registro") mountRegistro();
    else if(state.tab==="calendario") mountCalendario();
    else if(state.tab==="cronometro") mountCronometro();
    else if(state.tab==="perfil") mountPerfil();
  }

  function mountRutina(){
    const el = document.getElementById("screen");
    const addDayBtn = el.querySelector("#btn-add-day");
    if(addDayBtn) addDayBtn.onclick = ()=> openDayModal(null);

    const autoBtn = el.querySelector("#btn-auto-routine");
    if(autoBtn) autoBtn.onclick = openAutoRoutineModal;
    const specialBtn = el.querySelector("#btn-special-day");
    if(specialBtn) specialBtn.onclick = openSpecialDayModal;
    // V29: navegación del historial semanal
    const weekPrev = el.querySelector("#week-prev");
    if(weekPrev) weekPrev.onclick = ()=>{ if(weekPrev.getAttribute("aria-disabled")==="true") return; state.weekOffset = (state.weekOffset||0)+1; renderScreen(); };
    const weekNext = el.querySelector("#week-next");
    if(weekNext) weekNext.onclick = ()=>{ if(weekNext.getAttribute("aria-disabled")==="true") return; state.weekOffset = Math.max(0,(state.weekOffset||0)-1); renderScreen(); };
    const weekToggle = el.querySelector("#week-toggle");
    if(weekToggle) weekToggle.onclick = ()=>{ state.weekDetailOpen = !state.weekDetailOpen; renderScreen(); };
    const explorarBtn = el.querySelector("#btn-explorar-musculos");
    if(explorarBtn) explorarBtn.onclick = ()=>{ state.explorerGroup = null; state.tab = "explorar"; render(); };
    const exportPdfBtn = el.querySelector("#btn-export-pdf");
    if(exportPdfBtn) exportPdfBtn.onclick = exportRoutinePDF;

    el.querySelectorAll("[data-rutina-slot]").forEach(b=>{
      b.onclick = ()=> selectRutinaSlot(b.dataset.rutinaSlot);
    });

    el.querySelectorAll("[data-toggle]").forEach(h=>{
      h.onclick = ()=>{
        const id = h.dataset.toggle;
        state.dayOpen[id] = !(state.dayOpen[id] !== false);
        renderScreen();
      };
    });
    el.querySelectorAll("[data-toggle-editex]").forEach(b=>{
      b.onclick = (e)=>{
        e.stopPropagation();
        const id = b.dataset.toggleEditex;
        state.dayEditMode[id] = !state.dayEditMode[id];
        renderScreen();
      };
    });
    el.querySelectorAll("[data-edit-day]").forEach(b=>{
      b.onclick = (e)=>{ e.stopPropagation(); const day = state.rutina.days.find(d=>d.id===b.dataset.editDay); openDayModal(day); };
    });
    el.querySelectorAll("[data-del-day]").forEach(b=>{
      b.onclick = async (e)=>{
        e.stopPropagation();
        const day = state.rutina.days.find(d=>d.id===b.dataset.delDay);
        const ok = await confirmDialog("Eliminar día", `¿Eliminar "${day.nombre}" y todos sus ejercicios?`);
        if(!ok) return;
        state.rutina.days = state.rutina.days.filter(d=>d.id!==day.id);
        await persistRutina();
        renderScreen();
      };
    });
    el.querySelectorAll("[data-add-ex]").forEach(b=>{
      b.onclick = ()=>{ const day = state.rutina.days.find(d=>d.id===b.dataset.addEx); openExerciseModal(day, null); };
    });
    el.querySelectorAll("[data-edit-ex]").forEach(b=>{
      b.onclick = ()=>{
        const [dayId, exId] = b.dataset.editEx.split("|");
        const day = state.rutina.days.find(d=>d.id===dayId);
        const ex = day.exercises.find(x=>x.id===exId);
        openExerciseModal(day, ex);
      };
    });
    el.querySelectorAll("[data-del-ex]").forEach(b=>{
      b.onclick = async ()=>{
        const [dayId, exId] = b.dataset.delEx.split("|");
        const day = state.rutina.days.find(d=>d.id===dayId);
        const ex = day.exercises.find(x=>x.id===exId);
        const ok = await confirmDialog("Eliminar ejercicio", `¿Eliminar "${ex.nombre}" de este día?`);
        if(!ok) return;
        day.exercises = day.exercises.filter(x=>x.id!==exId);
        await persistRutina();
        renderScreen();
      };
    });
    el.querySelectorAll("[data-log-ex]").forEach(b=>{
      b.onclick = ()=>{ state.exerciseSelForm = b.dataset.logEx; setTab("registro"); };
    });
    el.querySelectorAll("[data-howto-ex]").forEach(b=>{
      b.onclick = (e)=>{
        e.stopPropagation();
        const [dayId, exId] = b.dataset.howtoEx.split("|");
        const day = state.rutina.days.find(d=>d.id===dayId);
        const ex = day && day.exercises.find(x=>x.id===exId);
        if(ex) openExerciseDetail(ex, { returnTab:"rutina" });
      };
    });
    el.querySelectorAll("[data-start-session]").forEach(b=>{
      b.onclick = (e)=>{
        e.stopPropagation();
        const day = state.rutina.days.find(d=>d.id===b.dataset.startSession);
        startSession(day);
      };
    });
    const resumeBtn = el.querySelector("#btn-resume-session");
    if(resumeBtn) resumeBtn.onclick = ()=>{ state.tab = "sesion"; render(); };
    const finalizeBtn = el.querySelector("#btn-finalize-session");
    if(finalizeBtn) finalizeBtn.onclick = async ()=>{
      const day = sessionDay();
      const p = sessionProgress();
      const ok = await confirmDialog("Finalizar entrenamiento", `Vas a cerrar este entrenamiento (${p.done}/${p.total} series) y contará para tu racha y meta semanal. ¿Confirmar?`, "Finalizar");
      if(!ok) return;
      await finalizeSession(day);
    };
  }

  /* ================= MODO ENTRENANDO ================= */
  // V28: la pantalla de Entrenamiento pasa a ser el centro operativo real de
  // la sesión de gimnasio — desde acá, sin salir: marcar series, registrar
  // peso/reps, ver info del ejercicio, abrir el descanso, saltar libremente
  // entre ejercicios, guardar el progreso y (desde el banner de Mi rutina)
  // finalizar. Ver comentarios en sessionExerciseCardHtml/toggleSessionSet/
  // saveSessionProgress/finalizeSession para el detalle de cada parte.
  // V29: opts.special → Día Especial. Es la MISMA sesión de siempre (mismos
  // sets/setLogs, mismo guardado en sesionActiva), solo que con slot
  // "especial" y el día completo embebido en `specialDay` (ese día no vive
  // en ninguna rutina, así que sessionDay() no lo encontraría en rutinaSlots).
  function startSession(day, opts){
    const special = !!(opts && opts.special);
    const sets = {};
    const setLogs = {};
    (day.exercises||[]).forEach(ex=>{
      const n = Math.max(1, Math.min(12, parseInt(ex.series,10)||1));
      sets[ex.id] = new Array(n).fill(false);
      setLogs[ex.id] = new Array(n).fill(null);
    });
    state.session = { dayId: day.id, slot: special ? "especial" : state.activeSlot, dayNombre: day.nombre, startedAt: Date.now(), sets, setLogs };
    if(special) state.session.specialDay = day;
    state.tab = "sesion";
    persistRutina(); // guardado inmediato: si cierran la app un segundo después, el entrenamiento ya quedó recuperable
    render();
  }

  function renderSession(){
    const day = sessionDay();
    if(!day){ state.session=null; state.tab="rutina"; render(); return; }
    app.innerHTML = `
      <div class="topbar">
        <span class="iconbtn" id="btn-session-back">${icon("back")}</span>
        <h1 style="font-size:18px; flex:1; text-align:center">${esc(day.nombre)}</h1>
        <span style="width:30px"></span>
      </div>
      <main><div class="screen" id="screen"></div></main>
      <nav class="bottomnav">
        <button class="btn btn-primary btn-block" id="btn-save-session" style="max-width:444px; margin:0 auto">${icon("check")} Guardar entrenamiento</button>
      </nav>
    `;
    document.getElementById("btn-session-back").onclick = ()=>{ state.tab="rutina"; render(); };
    document.getElementById("screen").innerHTML = screenSession(day);
    mountSession(day);
    document.getElementById("btn-save-session").onclick = saveSessionProgress;
  }

  // Reemplaza a `render()`/`renderSession()` para un simple refresco del
  // contenido tras marcar una serie: reconstruye solo #screen (misma idea que
  // renderScreenExerciseDetail para la ficha de ejercicio), sin recrear el
  // topbar/bottomnav ni perder el scroll de la pantalla.
  function renderScreenSession(){
    const day = sessionDay();
    if(!day){ state.session=null; state.tab="rutina"; render(); return; }
    const el = document.getElementById("screen");
    if(!el) return;
    el.innerHTML = screenSession(day);
    mountSession(day);
  }

  function screenSession(day){
    const exs = day.exercises||[];
    if(exs.length===0){
      return `<div class="card empty">${icon("routine")}<h3>Este día no tiene ejercicios</h3><p>Agregale ejercicios desde "Rutina" antes de entrenar.</p></div>`;
    }
    // V29: aviso visible de que es un Día Especial (no suma al objetivo semanal).
    const specialNote = (state.session && state.session.slot==="especial")
      ? `<div class="card special-note"><span class="special-badge">Día Especial</span><span class="helptext">Entrenamiento extra — queda en tu historial y calendario, pero no suma al objetivo semanal.</span></div>`
      : "";
    return specialNote + exs.map(ex=> sessionExerciseCardHtml(ex)).join("") + `<button class="btn btn-outline btn-block" id="btn-cancel-session">Cancelar entrenamiento</button>`;
  }

  // Una sola tarjeta por ejercicio con todo lo necesario para entrenar sin
  // salir de la pantalla. Los ejercicios NUNCA se bloquean entre sí — el
  // usuario puede saltar a cualquier otro en cualquier momento (superseries,
  // orden libre, lo que haya hecho de verdad); lo secuencial es solo DENTRO
  // de cada ejercicio (ver toggleSessionSet) y es una ayuda de uso, no una
  // restricción de flujo entre ejercicios.
  function sessionExerciseCardHtml(ex){
    const done = state.session.sets[ex.id] || [];
    const logs = state.session.setLogs[ex.id] || [];
    const allDone = done.length>0 && done.every(Boolean);
    const nextIdx = done.findIndex(v=>!v);
    // v28.1: registro POR SERIE (progresión de carga dentro del mismo
    // ejercicio, ej. sentadilla 60/70/80/90kg) — cada línea con datos ya
    // cargados es tocable para reabrirla y editarla; el botón único de abajo
    // siempre apunta a la serie activa (la misma que se resalta como
    // "next" en los círculos), nunca a una lista de botones por serie.
    const loggedRows = logs.map((log,i)=> log ? `
      <div class="setlog-row" data-edit-set="${ex.id}" data-idx="${i}">
        <span class="sl-num">Serie ${i+1}</span>
        <span class="sl-val">${esc(log.peso)} kg × ${esc(log.reps||"-")}</span>
      </div>` : "").join("");
    return `
      <div class="card stack" data-exercise-card="${ex.id}">
        <div class="row between">
          <div style="display:flex; align-items:center; gap:10px; min-width:0">
            ${exerciseThumbHtml(ex, "width:40px; height:50px; flex:none")}
            <div style="min-width:0">
              <div class="exname" style="font-size:16px">${esc(ex.nombre)}</div>
              <div class="exmeta">${esc(ex.series)} series × ${esc(ex.reps)} reps${ex.notas? " · "+esc(ex.notas):""}</div>
            </div>
          </div>
          ${allDone ? `<span class="badge pr" style="flex:none">${icon("check")} Completo</span>` : ""}
        </div>
        <div class="setrow">
          ${done.map((v,i)=>{
            const isNext = i===nextIdx;
            const locked = !v && !isNext;
            return `<div class="setdot ${v?"done":""}${isNext?" next":""}${locked?" locked":""}" data-ex="${ex.id}" data-idx="${i}">${i+1}</div>`;
          }).join("")}
        </div>
        ${loggedRows ? `<div class="stack" style="gap:4px">${loggedRows}</div>` : ""}
        <div class="row" style="gap:8px">
          <span class="iconbtn iconbtn-lg" data-howto-ex-session="${ex.id}" title="Cómo hacerlo" style="flex:none">${icon("info")}</span>
          <span class="iconbtn iconbtn-lg" data-rest-btn title="Descansar" style="flex:none">${icon("timer")}</span>
          ${nextIdx!==-1 ? `<button class="btn btn-outline btn-sm" style="flex:1" data-log-weight="${ex.id}" data-log-idx="${nextIdx}">${icon("dumbbell")} Registrar peso y reps</button>` : ""}
        </div>
      </div>
    `;
  }

  function mountSession(day){
    const el = document.getElementById("screen");
    el.querySelectorAll(".setdot").forEach(dot=>{
      if(dot.classList.contains("locked")) return; // v28: bloqueada hasta completar la anterior de ESE ejercicio
      dot.onclick = ()=>{
        const exId = dot.dataset.ex, idx = parseInt(dot.dataset.idx,10);
        toggleSessionSet(exId, idx);
        persistRutina();
        renderScreenSession();
      };
    });
    el.querySelectorAll("[data-rest-btn]").forEach(b=>{
      b.onclick = ()=> openRestModal();
    });
    el.querySelectorAll("[data-howto-ex-session]").forEach(b=>{
      b.onclick = ()=>{
        const ex = (day.exercises||[]).find(x=>x.id===b.dataset.howtoExSession);
        if(ex) openExerciseDetail(ex, { returnTab:"sesion" });
      };
    });
    el.querySelectorAll("[data-log-weight]").forEach(b=>{
      b.onclick = ()=>{
        const ex = (day.exercises||[]).find(x=>x.id===b.dataset.logWeight);
        if(ex) openSessionLogModal(ex, parseInt(b.dataset.logIdx,10));
      };
    });
    el.querySelectorAll("[data-edit-set]").forEach(row=>{
      row.onclick = ()=>{
        const ex = (day.exercises||[]).find(x=>x.id===row.dataset.editSet);
        if(ex) openSessionLogModal(ex, parseInt(row.dataset.idx,10));
      };
    });
    const cancelBtn = el.querySelector("#btn-cancel-session");
    if(cancelBtn) cancelBtn.onclick = async ()=>{
      const ok = await confirmDialog("Cancelar entrenamiento", "¿Salir sin guardar este entrenamiento? Se va a perder el progreso marcado.");
      if(!ok) return;
      state.session = null;
      await persistRutina();
      state.tab = "rutina";
      render();
    };
  }

  // Dentro de cada ejercicio las series se completan en orden: tocar la
  // próxima pendiente la marca; tocar una ya marcada la desmarca a ELLA y a
  // todas las que venían después (si esas dependían de que esta estuviera
  // hecha, dejarlas marcadas sería un dato falso — esta es la "corrección en
  // cascada" pedida). Tocar una serie todavía no alcanzada no hace nada (está
  // bloqueada visualmente, ver sessionExerciseCardHtml). Esto NUNCA bloquea
  // pasar a otro ejercicio — es solo el orden dentro de este.
  function toggleSessionSet(exId, idx){
    const arr = state.session.sets[exId];
    if(!arr) return;
    if(arr[idx]){
      for(let i=idx;i<arr.length;i++) arr[i]=false;
    } else {
      const nextIdx = arr.findIndex(v=>!v);
      if(nextIdx !== idx) return;
      arr[idx] = true;
    }
  }

  // V28.1: registrar peso/reps POR SERIE sin salir de "Entrenamiento" — un
  // solo acceso de registro por ejercicio (nunca un botón por serie), que
  // opera siempre sobre la serie activa (la próxima pendiente, `idx`); si esa
  // serie puntual ya tiene un registro cargado (se reabre tocando su propia
  // línea en la tarjeta, ver sessionExerciseCardHtml), el modal se abre en
  // modo EDICIÓN de ese mismo registro en vez de crear uno duplicado. Como el
  // resto de los modales de la app, se monta directo sobre document.body sin
  // tocar #app/#screen (openModal/closeModal), así que no se pierde el
  // scroll ni el estado de la pantalla de sesión al cerrarlo. Reusa
  // Store.addRegistro/updateRegistro (misma tabla `registros` de siempre,
  // con `set_number` = idx+1 para las filas nuevas) para que el historial y
  // el gráfico de Registro queden al día al instante.
  function openSessionLogModal(ex, idx){
    const existing = (state.session.setLogs[ex.id] || [])[idx] || null;
    const m = openModal(`
      <h3>${existing?"Editar serie":"Registrar serie"} ${idx+1}</h3>
      <p class="helptext" style="margin:-8px 0 4px">${esc(ex.nombre)}</p>
      <div class="stack">
        <div class="field-row">
          <div class="field"><label>Fecha</label><input type="date" id="slog-date" value="${esc(existing? existing.date : todayStr())}"></div>
          <div class="field"><label>Peso (kg)</label><input type="number" id="slog-peso" step="0.5" min="0" placeholder="Ej: 40" value="${existing? esc(existing.peso) : ""}"></div>
        </div>
        <div class="field">
          <label>Reps</label>
          <input type="text" id="slog-reps" maxlength="12" value="${esc(existing? existing.reps : (ex.reps||""))}">
        </div>
        <div class="field"><label>Nota (opcional)</label><input type="text" id="slog-nota" maxlength="60" placeholder="Ej: sentí bien la técnica" value="${existing? esc(existing.nota||"") : ""}"></div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" data-act="cancel">Cancelar</button>
        <button class="btn btn-primary" data-act="save">Guardar</button>
      </div>
    `);
    m.querySelector('[data-act="cancel"]').onclick = closeModal;
    m.querySelector('[data-act="save"]').onclick = async ()=>{
      const pesoInput = m.querySelector("#slog-peso");
      const peso = pesoInput.value;
      if(peso===""){ pesoInput.focus(); return; }
      const date = m.querySelector("#slog-date").value || todayStr();
      const reps = m.querySelector("#slog-reps").value;
      const nota = m.querySelector("#slog-nota").value.trim();
      const saveBtn = m.querySelector('[data-act="save"]');
      if(saveBtn.disabled) return; // evita doble registro por doble tap mientras guarda
      saveBtn.disabled = true;
      const pesoNum = parseFloat(peso);
      if(existing){
        // Edición: actualiza la fila que ya existía para ESTA serie, nunca
        // crea una nueva. `set_number` no se toca (no cambia de serie).
        await Store.updateRegistro(state.profile.id, existing.registroId, { peso: pesoNum, date, series: "1", reps, nota });
        state.session.setLogs[ex.id][idx] = { registroId: existing.registroId, peso: pesoNum, reps, nota, date };
      } else {
        // Alta: una fila = una serie (series:"1" es correcto acá, no es el
        // total de series del ejercicio). set_number = idx+1 (1-indexado).
        const data = { exercise: ex.nombre, peso: pesoNum, date, series: "1", reps: reps||"", nota, setNumber: idx+1, createdAt: Date.now() };
        const res = await Store.addRegistro(state.profile.id, data);
        state.session.setLogs[ex.id][idx] = { registroId: res.id, peso: pesoNum, reps, nota, date };
        toggleSessionSet(ex.id, idx); // idx es siempre la serie activa (next) acá, nunca una ya hecha — no hay riesgo de descascadear
      }
      state.registros = await Store.listRegistros(state.profile.id);
      state.exerciseSelForm = ex.nombre;
      await persistRutina();
      closeModal();
      renderScreenSession();
      showToast(existing ? "Registro actualizado" : "Registro guardado");
    };
  }

  // V28: "Guardar entrenamiento" ahora es un guardado de PROGRESO, no un
  // cierre del entrenamiento — persiste el estado actual (mismo blob de
  // rutinas.data, ver persistRutina) y vuelve al menú, pero la sesión sigue
  // viva: no crea ningún registro en `entrenos` ni cuenta para la racha/meta
  // todavía. Eso solo lo hace "Finalizar" (ver finalizeSession), para no
  // duplicar registros de un mismo entrenamiento.
  async function saveSessionProgress(){
    await persistRutina();
    state.tab = "rutina";
    render();
    showToast("Progreso guardado");
  }

  // V28: "Finalizar" es la acción que de verdad cierra el entrenamiento y lo
  // cuenta para el calendario/racha/meta semanal — antes esto era lo único
  // que hacía "Terminar entrenamiento" en la propia pantalla de sesión; ahora
  // vive en el banner "Entrenamiento en curso" de Mi rutina (spec v28 sección
  // 11), separado de guardar progreso, para que no se puedan crear dos
  // registros del mismo entrenamiento.
  async function finalizeSession(day){
    const p = sessionProgress();
    // V29: un Día Especial se registra como cualquier entrenamiento (mismo
    // Store.addEntreno, misma tabla), marcado con isSpecial → is_special.
    const isSpecial = !!(state.session && state.session.slot==="especial");
    const data = { date: todayStr(), dayId: day.id, dayNombre: day.nombre, setsCompletados: p.done, setsTotales: p.total, createdAt: Date.now(), isSpecial };
    const saved = await Store.addEntreno(state.profile.id, data);
    // V29: si la base rechaza el registro (ej. falta correr la migración de
    // is_special), NO se borra la sesión — antes se limpiaba igual y el
    // entrenamiento se perdía sin aviso.
    if(!saved){
      showToast("No se pudo registrar el entrenamiento. Tu sesión sigue guardada — probá de nuevo.");
      return;
    }
    state.entrenos = await Store.listEntrenos(state.profile.id);
    state.session = null;
    await persistRutina();
    state.tab = "rutina";
    render();
    const m = openModal(`
      <h3>¡Entrenamiento registrado! 💪</h3>
      <p style="font-size:14px; color:var(--text)">${esc(fraseDelDia())}</p>
      <div class="modal-actions"><button class="btn btn-primary btn-block" data-act="ok">Dale</button></div>
    `);
    m.querySelector('[data-act="ok"]').onclick = closeModal;
  }

  /* ================= REGISTRO ================= */
  function filterHistory(list){
    const f = state.historyFilter;
    return list.filter(r=>{
      if(f.exercise && r.exercise!==f.exercise) return false;
      if(f.from && r.date < f.from) return false;
      if(f.to && r.date > f.to) return false;
      return true;
    });
  }

  function toCSV(rows){
    const header = ["Fecha","Ejercicio","Peso (kg)","Series","Reps","Nota"];
    const escCsv = (v)=>{
      const s = String(v==null?"":v);
      return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
    };
    const lines = [header.map(escCsv).join(",")];
    rows.forEach(r=> lines.push([r.date, r.exercise, r.peso, r.series||"", r.reps||"", r.nota||""].map(escCsv).join(",")));
    return lines.join("\r\n");
  }

  function exportCSV(rows){
    const csv = toCSV(rows);
    const blob = new Blob(["﻿"+csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `fierros-historial-${(state.profile.name||"perfil").toLowerCase().replace(/\s+/g,"-")}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=> URL.revokeObjectURL(url), 1000);
  }

  // Junta los datos de la rutina activa (state.rutina, que siempre apunta a
  // rutinaSlots[state.activeSlot]) más el peso máximo registrado para cada
  // ejercicio de esa rutina (buscado en state.registros), para armar el PDF.
  function buildRoutinePdfData(){
    const isAuto = state.activeSlot === "automatica";
    const registros = state.registros || [];
    const days = (state.rutina.days || []).map(d => ({
      nombre: d.nombre,
      exercises: (d.exercises||[]).map(ex => {
        let max = null;
        registros.forEach(r => {
          if(r.exercise !== ex.nombre) return;
          const p = parseFloat(r.peso);
          if(isNaN(p)) return;
          if(max===null || p > max.peso || (p === max.peso && r.date > max.date)){
            max = { peso: p, date: r.date };
          }
        });
        return { nombre: ex.nombre, series: ex.series||"", reps: ex.reps||"", notas: ex.notas||"", max };
      }),
    }));
    return {
      routineLabel: isAuto ? "Rutina automática" : "Mi rutina",
      profileName: state.profile.name || "Usuario",
      days,
      generatedAt: todayStr(),
    };
  }

  // Paleta del PDF: los mismos tonos que usa la app en tema claro (el PDF
  // siempre se genera sobre página blanca, no sigue el tema claro/oscuro del
  // celular) — así el documento se siente reconociblemente VodaFit sin
  // depender de ninguna imagen ni fuente nueva.
  const PDF_INK = [27,25,23];           // --text (claro)
  const PDF_MUTED = [107,101,96];       // --text-muted (claro)
  const PDF_ACCENT = [200,74,34];       // --accent (claro)
  const PDF_BORDER = [219,216,209];     // --border (claro)
  const PDF_SUCCESS = [46,158,91];      // --success (claro)
  const PDF_WATERMARK = [239,235,229];  // igual que --border pero más pálido, solo para la marca de agua

  // Dibuja el monograma VF con líneas vectoriales (misma geometría que el
  // ícono "logoVF" de la app, en escala 0-24) — nada de imágenes ni fuentes
  // nuevas, así se ve idéntico en la app y en el PDF.
  function pdfDrawMark(doc, x, y, size, inkColor, accentColor, weight){
    const s = size/24;
    doc.setLineWidth(weight*s);
    doc.setDrawColor(inkColor[0], inkColor[1], inkColor[2]);
    doc.line(x+4*s, y+5*s, x+12*s, y+20*s);
    doc.line(x+12*s, y+20*s, x+20*s, y+5*s);
    doc.setDrawColor(accentColor[0], accentColor[1], accentColor[2]);
    doc.line(x+18*s, y+8.6*s, x+23.2*s, y+8.6*s);
    doc.line(x+15.6*s, y+13.2*s, x+20.4*s, y+13.2*s);
  }

  function pdfWatermark(doc, pageW, pageH){
    const size = 230;
    pdfDrawMark(doc, pageW/2 - size/2, pageH/2 - size/2, size, PDF_WATERMARK, PDF_WATERMARK, 9);
  }

  // Encabezado grande, solo en la primera página — hace las veces de portada
  // sin gastar una hoja aparte (una portada vacía solo con el logo no suma
  // nada práctico acá): marca + nombre + qué rutina es + para quién + fecha.
  function pdfBigHeader(doc, pageW, marginX, data){
    doc.setFillColor(PDF_INK[0], PDF_INK[1], PDF_INK[2]);
    doc.rect(0, 0, pageW, 92, "F");
    pdfDrawMark(doc, marginX, 22, 46, [255,255,255], PDF_ACCENT, 3.2);
    doc.setFont("helvetica","bold"); doc.setFontSize(24);
    doc.setTextColor(255,255,255);
    doc.text("V O D A F I T", marginX+58, 45); // espaciado manual entre letras: sin fuente nueva, sin riesgo de carga
    doc.setFont("helvetica","normal"); doc.setFontSize(11);
    doc.setTextColor(224,219,212);
    doc.text("Rutina de entrenamiento", marginX+58, 62);
    doc.setFont("helvetica","bold"); doc.setFontSize(10.5);
    doc.setTextColor(255,255,255);
    doc.text(data.routineLabel, pageW-marginX, 45, { align:"right" });
    doc.setFont("helvetica","normal"); doc.setFontSize(9.5);
    doc.setTextColor(224,219,212);
    doc.text(data.profileName, pageW-marginX, 60, { align:"right" });
    doc.text(`Generado el ${fmtDate(data.generatedAt)}`, pageW-marginX, 73, { align:"right" });
    return 92 + 24;
  }

  // Encabezado chico, repetido en cada página siguiente.
  function pdfSlimHeader(doc, pageW, marginX, data){
    pdfDrawMark(doc, marginX, 14, 20, PDF_INK, PDF_ACCENT, 2.6);
    doc.setFont("helvetica","bold"); doc.setFontSize(11);
    doc.setTextColor(PDF_INK[0], PDF_INK[1], PDF_INK[2]);
    doc.text("VODAFIT", marginX+28, 28);
    doc.setFont("helvetica","normal"); doc.setFontSize(9.5);
    doc.setTextColor(PDF_MUTED[0], PDF_MUTED[1], PDF_MUTED[2]);
    doc.text(data.routineLabel, pageW-marginX, 28, { align:"right" });
    doc.setDrawColor(PDF_BORDER[0], PDF_BORDER[1], PDF_BORDER[2]);
    doc.setLineWidth(0.75);
    doc.line(marginX, 40, pageW-marginX, 40);
    return 40 + 20;
  }

  // Pie de página — se dibuja al final, en una segunda pasada, porque recién
  // ahí se sabe cuántas páginas salieron en total.
  function pdfFooter(doc, pageW, pageH, marginX, pageNum, totalPages){
    doc.setDrawColor(PDF_BORDER[0], PDF_BORDER[1], PDF_BORDER[2]);
    doc.setLineWidth(0.6);
    doc.line(marginX, pageH-34, pageW-marginX, pageH-34);
    doc.setFont("helvetica","normal"); doc.setFontSize(8.5);
    doc.setTextColor(PDF_MUTED[0], PDF_MUTED[1], PDF_MUTED[2]);
    doc.text("VodaFit", marginX, pageH-20);
    doc.text(`Página ${pageNum} de ${totalPages}`, pageW-marginX, pageH-20, { align:"right" });
  }

  function exportRoutinePDF(){
    if(!window.jspdf || !window.jspdf.jsPDF){
      alert("No se pudo cargar el generador de PDF. Revisá tu conexión a internet e intentá de nuevo.");
      return;
    }
    const data = buildRoutinePdfData();
    if(data.days.length === 0){
      alert('Todavía no hay días cargados en esta rutina. Agregá al menos un día antes de exportar el PDF.');
      return;
    }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit:"pt", format:"a4" });
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    const marginX = 40;
    const bottomLimit = pageH - 46; // deja lugar para el pie de página

    let y = pdfBigHeader(doc, pageW, marginX, data);
    pdfWatermark(doc, pageW, pageH);

    function newPage(){
      doc.addPage();
      pdfWatermark(doc, pageW, pageH);
      y = pdfSlimHeader(doc, pageW, marginX, data);
    }
    function ensureSpace(lineH){
      if(y + lineH > bottomLimit){ newPage(); }
    }
    function line(text, opts){
      opts = opts || {};
      const size = opts.size||11, bold = !!opts.bold, gap = opts.gap||16;
      const color = opts.color||PDF_INK, x = opts.x||marginX;
      doc.setFont("helvetica", bold ? "bold" : "normal");
      doc.setFontSize(size);
      doc.setTextColor(color[0], color[1], color[2]);
      const wrapWidth = pageW - x - marginX;
      const wrapped = doc.splitTextToSize(text, wrapWidth);
      wrapped.forEach(w=>{
        ensureSpace(gap);
        doc.text(w, x, y);
        y += gap;
      });
    }

    data.days.forEach(day=>{
      ensureSpace(30);
      // barrita de acento a la izquierda del título del día — el mismo
      // recurso visual (naranja como identidad) que ya usa el resto de la app.
      doc.setFillColor(PDF_ACCENT[0], PDF_ACCENT[1], PDF_ACCENT[2]);
      doc.rect(marginX, y-11, 3, 15, "F");
      line(day.nombre, { size:14, bold:true, gap:20, x: marginX+10 });
      if(day.exercises.length===0){
        line("Sin ejercicios cargados.", { size:10.5, gap:16, color:PDF_MUTED, x: marginX+10 });
      } else {
        day.exercises.forEach(ex=>{
          const base = `${ex.nombre} — ${ex.series}×${ex.reps}${ex.notas?` (${ex.notas})`:""}`;
          line(base, { size:11, gap:15, x: marginX+10 });
          const maxTxt = ex.max
            ? `Máximo registrado: ${ex.max.peso} kg (${fmtDate(ex.max.date)})`
            : "Sin registros de peso todavía.";
          line(maxTxt, { size:9.5, gap:16, color: ex.max?PDF_SUCCESS:PDF_MUTED, x: marginX+10 });
        });
      }
      y += 8;
    });

    // Pie de página en una segunda pasada sobre todas las páginas ya generadas.
    const totalPages = doc.internal.getNumberOfPages();
    for(let p=1; p<=totalPages; p++){
      doc.setPage(p);
      pdfFooter(doc, pageW, pageH, marginX, p, totalPages);
    }

    const fname = `vodafit-rutina-${(data.profileName||"perfil").toLowerCase().replace(/\s+/g,"-")}-${data.generatedAt}.pdf`;
    doc.save(fname);
  }

  // V28: mismo criterio que exerciseLineChart — un punto por semana (máximo
  // de peso registrado esa semana), no por registro individual, con el
  // período representado indicado debajo.
  function sparklineFor(history){
    const historyAsc = history.slice().sort((a,b)=> a.date<b.date?-1:1);
    const weekly = exerciseWeeklyMax(historyAsc).slice(-10);
    if(weekly.length===0) return `<p class="helptext">Todavía no hay registros de este ejercicio.</p>`;
    const weights = weekly.map(r=> r.peso);
    const best = Math.max(...weights);
    const min = Math.min(...weights);
    const w = 260, h = 40, pad = 6;
    const range = (best-min)||1;
    const pts = weights.map((val,i)=>{
      const x = weights.length===1 ? w/2 : (i/(weights.length-1))*(w-pad*2)+pad;
      const y = h - pad - ((val-min)/range)*(h-pad*2);
      return [x,y];
    });
    const path = pts.map((p,i)=> (i===0?"M":"L")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
    const last = pts[pts.length-1];
    return `
      <div class="spark-row">
        <svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
          <line x1="0" y1="${h-pad}" x2="${w}" y2="${h-pad}" stroke="var(--border)" stroke-width="1"/>
          <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="var(--accent)"/>
        </svg>
        <div class="spark-stats">
          <div class="best num">${best} kg</div>
          <div class="lbl">Máx. semanal</div>
        </div>
      </div>
      <div class="helptext" style="margin-top:4px">Semana del ${esc(fmtDate(weekly[0].weekStart))}${weekly.length>1?` – semana del ${esc(fmtDate(weekly[weekly.length-1].weekStart))}`:""}</div>
    `;
  }

      const peso = el.querySelector("#reg-peso").value;

      const series = el.querySelector("#reg-series").value;

      state.registros = await Store.listRegistros(state.profile.id);
      state.exerciseSelForm = exercise;
      renderScreen();
    };

    const histEx = el.querySelector("#hist-filter-ex");
    if(histEx) histEx.onchange = ()=>{ state.historyFilter.exercise = histEx.value; renderScreen(); };
    const histFrom = el.querySelector("#hist-from");
    if(histFrom) histFrom.onchange = ()=>{ state.historyFilter.from = histFrom.value; renderScreen(); };
    const histTo = el.querySelector("#hist-to");
    if(histTo) histTo.onchange = ()=>{ state.historyFilter.to = histTo.value; renderScreen(); };
    const clearFilterBtn = el.querySelector("#btn-clear-filter");

    const exportBtn = el.querySelector("#btn-export-csv");

      row.addEventListener("contextmenu", (e)=> e.preventDefault());

      row.title = "Tocá para eliminar este registro";
      row.onclick = async ()=>{
        const id = row.dataset.delLog;
        const ok = await confirmDialog("Eliminar registro", "¿Eliminar este registro del historial?");
        if(!ok) return;
        await Store.deleteRegistro(state.profile.id, id);
        state.registros = await Store.listRegistros(state.profile.id);
        renderScreen();
      };
    });
    // Filas-resumen de la vista agrupada por ejercicio (ver screenRegistro) —
    // tocarlas despliega/oculta el historial completo de ESE ejercicio, no
    // borran nada (el borrado sigue siendo solo en las filas de adentro,
    // arriba).
    el.querySelectorAll("[data-hist-group]").forEach(row=>{
      row.style.cursor = "pointer";
      row.title = "Tocá para ver el historial completo";
      row.onclick = ()=>{
        const name = row.dataset.histGroup;
        state.historyExpanded = (state.historyExpanded===name) ? null : name;
        renderScreen();
      };
    });
  }

  /* ================= CRONOMETRO ================= */
  /* ---------- Persistencia de cronómetros en segundo plano ----------
     Antes, el estado de los cronómetros (corriendo, tiempo transcurrido, hora
     de fin) vivía solo en memoria (variables JS) — al cerrar la app, cambiar
     de app o recargar la página, ese estado se perdía y el cronómetro volvía
     a cero aunque el usuario nunca haya apretado "Reiniciar". Ahora ambos
     cronómetros guardan su estado en localStorage en cada cambio, usando
     siempre una marca de tiempo absoluta (Date.now()/endAt/startEpoch, no un
     contador que solo avanza mientras la pestaña está abierta) — así, al
     volver a abrir la app, el tiempo transcurrido real se recalcula contra
     el reloj, sin importar cuánto tiempo estuvo la app cerrada o en segundo
     plano. Solo se reinicia si el usuario aprieta el botón "Reiniciar". */
  const savedRestTimer = lsGet("fierros:restTimer", null);
  const timer = savedRestTimer ? {
    total: savedRestTimer.total,
    remaining: savedRestTimer.remaining,
    running: savedRestTimer.running,
    intervalId: null,
    endAt: savedRestTimer.endAt,
    audioCtx: null,
  } : {
    total: lsGet("fierros:timerDefault", 90),
    remaining: null,
    running: false,
    intervalId: null,
    endAt: null,
    audioCtx: null,
  };
  // Si estaba corriendo y el tiempo restante ya se cumplió mientras la app
  // estuvo cerrada/en segundo plano, se da por terminado sin reproducir el
  // sonido (el usuario no está mirando en ese momento).
  if(timer.running && timer.endAt!=null){
    const rem = Math.max(0, Math.ceil((timer.endAt - Date.now())/1000));
    timer.remaining = rem;
    if(rem<=0){ timer.running = false; timer.endAt = null; }
  }
  function persistTimer(){
    lsSet("fierros:restTimer", { total:timer.total, remaining:timer.remaining, running:timer.running, endAt:timer.endAt });
    lsSet("fierros:timerDefault", timer.total);
  }

  let timerRerender = () => renderScreen();

  function timerBlockHtml(){
    const presets = [30,45,60,90,120,180];
    const remaining = timer.remaining==null ? timer.total : timer.remaining;
    const pct = Math.max(0, Math.min(1, remaining/timer.total));
    const R = 100, C = 2*Math.PI*R;
    const dash = C*pct;
    const mm = Math.floor(remaining/60), ss = Math.floor(remaining%60);
    const label = timer.running ? "Descansando" : (remaining===0 ? "¡Listo!" : "Pausado");
    return `
      <div class="presets" id="presets">
        ${presets.map(p=>`<button class="preset ${!timer.running && timer.total===p?"active":""}" data-preset="${p}">${p<60?p+"s":(p/60)+"m"}</button>`).join("")}
      </div>
      <div class="ring-box">
        <svg viewBox="0 0 220 220">
          <circle class="ring-bg" cx="110" cy="110" r="${R}"/>
          <circle class="ring-fg ${remaining===0?"done":""}" cx="110" cy="110" r="${R}"
            stroke-dasharray="${C}" stroke-dashoffset="${C-dash}"/>
        </svg>
        <div class="ring-label">
          <div class="time num" id="time-label">${String(mm).padStart(2,"0")}:${String(ss).padStart(2,"0")}</div>
          <div class="state">${label}</div>
        </div>
      </div>
      <div class="timer-controls">
        <button class="btn btn-ghost" id="btn-reset">${icon("reset")}<span>Reiniciar</span></button>
        <button class="btn btn-primary" id="btn-toggle">${timer.running?icon("pause"):icon("play")}<span>${timer.running?"Pausa":"Iniciar"}</span></button>
      </div>
      <div class="field" style="width:100%">
        <label>Tiempo personalizado (segundos)</label>
        <input type="number" id="custom-secs" min="5" max="900" value="${timer.total}">
      </div>
    `;
  }

  function wireTimerControls(root){
    root.querySelectorAll("[data-preset]").forEach(b=>{
      b.onclick = ()=>{
        const v = parseInt(b.dataset.preset,10);
        timer.total = v; timer.remaining = v; timer.running=false; clearInterval(timer.intervalId); timer.endAt=null;
        persistTimer();
        timerRerender();
      };
    });
    root.querySelector("#btn-toggle").onclick = ()=>{
      if(timer.running) pauseTimer(); else startTimer();
    };
    root.querySelector("#btn-reset").onclick = resetTimer;
    const custom = root.querySelector("#custom-secs");
    custom.onchange = ()=>{
      const v = Math.max(5, Math.min(900, parseInt(custom.value,10)||90));
      timer.total = v; timer.remaining = v; timer.running=false; clearInterval(timer.intervalId); timer.endAt=null;
      persistTimer();
      timerRerender();
    };
  }

  function openRestModal(){
    const m = openModal(`
      <h3>Descanso</h3>
      <div class="timer-wrap timer-modal-body">${timerBlockHtml()}</div>
      <button class="btn btn-ghost btn-block" data-act="close">Cerrar (sigue corriendo)</button>
    `);
    timerRerender = ()=>{
      if(!document.body.contains(m)){ timerRerender = renderScreen; return; }
      const body = m.querySelector(".timer-modal-body");
      body.innerHTML = timerBlockHtml();
      wireTimerControls(body);
    };
    wireTimerControls(m.querySelector(".timer-modal-body"));
    m.querySelector('[data-act="close"]').onclick = ()=>{ closeModal(); timerRerender = renderScreen; };
  }

  /* ---------- Cronómetro de tiempo total de entrenamiento (cuenta hacia arriba) ---------- */
  const savedWorkoutClock = lsGet("fierros:workoutClock", null);
  const workoutClock = savedWorkoutClock ? {
    running: savedWorkoutClock.running, elapsedMs: savedWorkoutClock.elapsedMs,
    startEpoch: savedWorkoutClock.startEpoch, intervalId: null,
  } : { running:false, elapsedMs:0, startEpoch:null, intervalId:null };
  function persistWorkoutClock(){
    lsSet("fierros:workoutClock", { running:workoutClock.running, elapsedMs:workoutClock.elapsedMs, startEpoch:workoutClock.startEpoch });
  }
  let workoutClockRerender = () => renderScreen();

  function fmtElapsed(ms){
    const total = Math.floor(ms/1000);
    const hh = Math.floor(total/3600), mm = Math.floor((total%3600)/60), ss = total%60;
    const mmss = `${String(mm).padStart(2,"0")}:${String(ss).padStart(2,"0")}`;
    return hh>0 ? `${String(hh).padStart(2,"0")}:${mmss}` : mmss;
  }

  function currentWorkoutElapsed(){
    return workoutClock.elapsedMs + (workoutClock.running ? (Date.now()-workoutClock.startEpoch) : 0);
  }

  function workoutClockHtml(){
    return `
      <div class="card" style="display:flex; flex-direction:column; align-items:center; gap:10px; padding:16px 14px">
        <div class="helptext" style="text-transform:uppercase; letter-spacing:.04em; font-weight:700">Tiempo de entrenamiento</div>
        <div class="num" id="workout-time-label" style="font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:38px">${fmtElapsed(currentWorkoutElapsed())}</div>
        <div class="row" style="gap:10px">
          <button class="btn btn-ghost btn-sm" id="btn-workout-reset">${icon("reset")} Reiniciar</button>
          <button class="btn btn-primary btn-sm" id="btn-workout-toggle">${workoutClock.running? icon("pause")+" Pausar" : icon("play")+" Iniciar entrenamiento"}</button>
        </div>
      </div>
    `;
  }

  function tickWorkoutClock(){
    const label = document.getElementById("workout-time-label");
    if(label) label.textContent = fmtElapsed(currentWorkoutElapsed());
  }

  function wireWorkoutClock(root){
    root.querySelector("#btn-workout-toggle").onclick = ()=>{
      if(workoutClock.running){
        workoutClock.elapsedMs = currentWorkoutElapsed();
        workoutClock.running = false;
        workoutClock.startEpoch = null;
        clearInterval(workoutClock.intervalId);
      } else {
        workoutClock.running = true;
        workoutClock.startEpoch = Date.now();
        clearInterval(workoutClock.intervalId);
        workoutClock.intervalId = setInterval(tickWorkoutClock, 1000);
      }
      persistWorkoutClock();
      workoutClockRerender();
    };
    root.querySelector("#btn-workout-reset").onclick = ()=>{
      clearInterval(workoutClock.intervalId);
      workoutClock.running = false;
      workoutClock.elapsedMs = 0;
      workoutClock.startEpoch = null;
      persistWorkoutClock();
      workoutClockRerender();
    };
  }

  function screenCronometro(){
    return `
      <div class="section-title"><h2>Cronómetro</h2></div>
      ${workoutClockHtml()}
      <div class="section-title" style="margin-top:6px"><h2>Descanso entre series</h2></div>
      <div class="card timer-wrap">${timerBlockHtml()}</div>
      <p class="helptext" style="text-align:center">Cuando termine el descanso vas a escuchar un sonido y (si tu celular lo permite) vibrar.</p>
    `;
  }

  function playBeep(){
    try{
      if(!timer.audioCtx) timer.audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      const ctx = timer.audioCtx;
      if(ctx.state==="suspended") ctx.resume();
      [0,0.18,0.36].forEach((t,i)=>{
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = "sine";
        o.frequency.value = i===2? 1046.5 : 880;
        g.gain.setValueAtTime(0.0001, ctx.currentTime+t);
        g.gain.exponentialRampToValueAtTime(0.28, ctx.currentTime+t+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+t+0.16);
        o.connect(g); g.connect(ctx.destination);
        o.start(ctx.currentTime+t);
        o.stop(ctx.currentTime+t+0.18);
      });
    }catch(e){}
    if(navigator.vibrate) navigator.vibrate([200,100,200,100,200]);
  }

  function tick(){
    if(timer.endAt==null) return;
    const remainingMs = timer.endAt - Date.now();
    const remaining = Math.max(0, Math.ceil(remainingMs/1000));
    timer.remaining = remaining;
    const timeLabel = document.getElementById("time-label");
    const ring = document.querySelector(".ring-fg");
    if(timeLabel){
      const mm=Math.floor(remaining/60), ss=Math.floor(remaining%60);
      timeLabel.textContent = `${String(mm).padStart(2,"0")}:${String(ss).padStart(2,"0")}`;
    }
    if(ring){
      const R=100, C=2*Math.PI*R;
      const pct = Math.max(0, Math.min(1, remaining/timer.total));
      ring.setAttribute("stroke-dashoffset", C-(C*pct));
    }
    if(remaining<=0){
      stopTimer(true);
      timerRerender();
    }
  }

  function startTimer(){
    if(timer.remaining==null) timer.remaining = timer.total;
    if(timer.remaining<=0) timer.remaining = timer.total;
    timer.endAt = Date.now() + timer.remaining*1000;
    timer.running = true;
    clearInterval(timer.intervalId);
    timer.intervalId = setInterval(tick, 250);
    persistTimer();
    timerRerender();
  }
  function pauseTimer(){
    timer.running = false;
    clearInterval(timer.intervalId);
    persistTimer();
    timerRerender();
  }
  function stopTimer(finished){
    timer.running = false;
    clearInterval(timer.intervalId);
    timer.endAt = null;
    if(finished){ timer.remaining = 0; playBeep(); }
    persistTimer();
  }
  function resetTimer(){
    stopTimer(false);
    timer.remaining = timer.total;
    persistTimer();
    timerRerender();
  }

  function mountCronometro(){
    timerRerender = renderScreen;
    workoutClockRerender = renderScreen;
    wireTimerControls(document.getElementById("screen"));
    wireWorkoutClock(document.getElementById("screen"));
    // Si algún cronómetro quedó corriendo de una sesión anterior (recargó la
    // página, volvió después de cerrar la app, etc.), retoma el intervalo
    // visual acá — el número ya está bien calculado (ver tick()/
    // currentWorkoutElapsed(), ambos contra Date.now()), esto solo hace que
    // se siga viendo actualizado en pantalla mientras esta pestaña esté abierta.
    if(timer.running && !timer.intervalId){
      clearInterval(timer.intervalId);
      timer.intervalId = setInterval(tick, 250);
    }
    if(workoutClock.running && !workoutClock.intervalId){
      clearInterval(workoutClock.intervalId);
      workoutClock.intervalId = setInterval(tickWorkoutClock, 1000);
    }
  }

  // Al volver a la pestaña/app (se desbloquea el celular, se vuelve de otra
  // app), refresca el número al toque en vez de esperar al próximo tick —
  // los navegadores frenan los setInterval mientras la pestaña está oculta.
  document.addEventListener("visibilitychange", ()=>{
    if(document.visibilityState==="visible"){
      if(timer.running) tick();
      if(workoutClock.running) tickWorkoutClock();
    }
  });

  /* ================= PERFIL ================= */
  function screenPerfil(){
    const email = (state.authSession && state.authSession.user && state.authSession.user.email) || "";
    return `
      <div class="section-title"><h2>Tu cuenta</h2></div>
      <div class="card row" style="gap:12px">
        <div class="avatar" style="width:40px;height:40px;font-size:16px">${esc(initials(state.profile.name))}</div>
        <div><b style="font-size:15px">${esc(state.profile.name)}</b><div class="helptext">${esc(email)}</div></div>
      </div>

      <div class="section-title" style="margin-top:6px"><h2>Preferencias</h2></div>
      <div class="card stack">
        <div class="field">
          <label>Nombre</label>
          <input type="text" id="perfil-name" maxlength="24" value="${esc(state.profile.name)}">
        </div>
        <div class="field">
          <label>Meta semanal (veces por semana)</label>
          <input type="number" id="meta-semanal" min="1" max="7" value="${state.profile.metaSemanal||3}">
        </div>
        <div class="field-row">
          <div class="field">
            <label>Edad</label>
            <input type="number" id="perfil-edad" min="10" max="99" placeholder="Opcional" value="${state.profile.edad||""}">
          </div>
          <div class="field">
            <label>Peso aprox. (kg)</label>
            <input type="number" id="perfil-peso" min="20" max="300" step="0.5" placeholder="Opcional" value="${state.profile.peso||""}">
          </div>
        </div>
        <p class="helptext">La edad y el peso son opcionales — van a servir para el futuro asistente de IA personalizado.</p>
      </div>

      <div class="section-title" style="margin-top:6px"><h2>Acerca de VodaFit</h2></div>
      <div class="card stack">
        <p class="helptext">Rutina, registro de pesos y cronómetro de descanso. Los videos de ejercicios y otras funciones se van a ir sumando más adelante.</p>
        <div class="row between">
          <span class="helptext">Tema</span>
          <div class="segmented" id="theme-seg" style="width:auto">
            <button data-theme="system" class="${lsGet('fierros:theme','system')==='system'?'active':''}">Auto</button>
            <button data-theme="light" class="${lsGet('fierros:theme','system')==='light'?'active':''}">Claro</button>
            <button data-theme="dark" class="${lsGet('fierros:theme','system')==='dark'?'active':''}">Oscuro</button>
          </div>
        </div>
      </div>

      <button class="btn btn-outline btn-block" id="btn-logout">${icon("back")} Cerrar sesión</button>
    `;
  }

  function mountPerfil(){
    const el = document.getElementById("screen");
    const nameInput = el.querySelector("#perfil-name");
    nameInput.onchange = async ()=>{
      const v = nameInput.value.trim() || state.profile.name;
      nameInput.value = v;
      state.profile.name = v;
      await Store.updateProfile(state.profile.id, { name: v });
      render();
    };
    const metaInput = el.querySelector("#meta-semanal");
    metaInput.onchange = async ()=>{
      const v = Math.max(1, Math.min(7, parseInt(metaInput.value,10)||3));
      metaInput.value = v;
      state.profile.metaSemanal = v;
      await Store.updateProfile(state.profile.id, { metaSemanal: v });
    };
    const edadInput = el.querySelector("#perfil-edad");
    edadInput.onchange = async ()=>{
      const v = edadInput.value ? parseInt(edadInput.value,10) : null;
      state.profile.edad = v;
      await Store.updateProfile(state.profile.id, { edad: v });
    };
    const pesoInput = el.querySelector("#perfil-peso");
    pesoInput.onchange = async ()=>{
      const v = pesoInput.value ? parseFloat(pesoInput.value) : null;
      state.profile.peso = v;
      await Store.updateProfile(state.profile.id, { peso: v });
    };
    el.querySelector("#btn-logout").onclick = async ()=>{
      const ok = await confirmDialog("Cerrar sesión", "¿Cerrar sesión en este dispositivo?", "Cerrar sesión");
      if(!ok) return;
      await Store.signOut();
      // el listener onAuthStateChange limpia el estado y muestra la pantalla de login
    };
    const seg = el.querySelector("#theme-seg");
    seg.querySelectorAll("button").forEach(b=>{
      b.onclick = ()=>{
        applyTheme(b.dataset.theme);
        renderScreen();
      };
    });
  }

  function applyTheme(mode){
    lsSet("fierros:theme", mode);
    if(mode==="system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", mode);
  }

  /* ---------- Boot ---------- */
  async function boot(){
    applyTheme(lsGet("fierros:theme","system"));

    try{
      Store.onAuthStateChange(async (event, session)=>{
        if(event === "PASSWORD_RECOVERY"){
          state.authView = "reset";
          state.booted = true;
          render();
          return;
        }
        state.authSession = session;
        try{
          if(session && session.user){
            if(!state.profile || state.profile.id !== session.user.id){
              state.profile = await Store.ensureProfile(session.user);
              await loadProfileData();
            }
          } else {
            state.profile = null;
            state.authView = "login";
            state.authError = "";
          }
          state.dbError = false;
        }catch(e){
          state.dbError = true;
        }
        state.booted = true;
        render();
      });
    }catch(e){
      state.dbError = true;
      state.booted = true;
      render();
    }

    // register service worker for installability (best-effort)
    if("serviceWorker" in navigator){
      navigator.serviceWorker.register("sw.js").catch(()=>{});
    }
  }

  render(); // initial loading frame
  boot();

  // Hook de solo-lectura para tests automatizados (Playwright) — no se usa en
  // la app real, no afecta el funcionamiento normal.
  window.__appTest = {
    pickLegDayExercises, legDayRulesOk, legEmphasisSequence, LEG_ROLE_WEIGHTS, LEG_PRIORITY, reorderDayExercisesByGroup,
    generateSpecialDay, exerciseSubgroup10, ambiguousLegExercises, SPECIAL_SUBGROUPS, FULL_BODY_VARIANTS,
    specialTargetCount, EXERCISE_HOWTO_LINKS, exerciseHowtoLinkFor, computeRacha, startSession, sessionDay, openSpecialDayModal,
    generateAutoRoutine, exerciseEquipment, exercisePrincipalSecondaryGroups,
    exerciseMuscleGroup, muscleGroupPools, subgroupPools, MUSCLE_GROUPS,
    exerciseLegFocus, seriesForAge, restRangeForAge, sessionCountRange,
    EXERCISES_RISKY_50PLUS, dayModality, get state(){ return state; },
    EXERCISES, EXERCISE_VIDEOS, EXERCISE_IMAGES, exerciseVideoFor, exerciseImageFor,
    screenExerciseDetail, EXERCISES_COMPOUND, seriesForExercise,
    FOCUS_OPTIONS, FOCUS_LABELS, FOCUS_MAX_GROUPS, buildRoutinePdfData, exportRoutinePDF,
    sessionCountRange, exercisePrimarySubgroup, MUSCLE_MAP, EXERCISE_TIPS, EXERCISE_EQUIPMENT,
    openExerciseDetail,
    // v28
    exerciseWeeklyMax, sessionProgress, sessionDay, reorderDayExercisesByGroup,
  };

})();
</script>
</body>

  /* ================= GENERADOR DE RUTINA AUTOMÁTICA ================= */
  // Palabras clave para distinguir ejercicios "compuestos" (multiarticulares) de
  // "aislamiento" — así cada día generado combina un poco de ambos en vez de,
  // por ej., 5 variantes de curl para bíceps.
  const COMPOUND_KEYWORDS = ["press","sentadilla","peso muerto","dominadas","remo","prensa","fondos","hip thrust","zancada","step up","jalón"];
  function isCompoundExercise(name){
    const n = normalizeTxt(name);
    return COMPOUND_KEYWORDS.some(k=> n.includes(normalizeTxt(k)));
  }
  function shuffleArr(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
    return a;
  }
  function pickFromPool(pool, count, avoidSet){
    if(count<=0 || !pool.length) return [];
    const fresh = shuffleArr(pool.filter(n=>!avoidSet.has(n)));
    const used = shuffleArr(pool.filter(n=>avoidSet.has(n)));
    const chosen = fresh.concat(used).slice(0,count);
    chosen.forEach(n=>avoidSet.add(n));
    return chosen;
  }
  // opts.forceLegFocus: lista de sub-focos (["glutes","quads"]) que hay que
  // garantizar sí o sí dentro del cupo de "piernas" (usado para Femenino, donde
  // Juan pidió que glúteo y cuádriceps sean obligatorios en cada día de pierna).
  // opts.riskyExclude: Set de nombres a evitar (perfil 50+, ver EXERCISES_RISKY_50PLUS).
  function pickForSubgroup(subgroup, count, avoidSet, opts){
    opts = opts || {};
    const pool = subgroupPools(opts.riskyExclude)[subgroup] || [];
    if(!pool.length || count<=0) return [];
    let chosen = [];
    if(opts.forceLegFocus && opts.forceLegFocus.length){
      const focusPools = legFocusPools(opts.riskyExclude);
      opts.forceLegFocus.forEach(cat=>{
        if(chosen.length>=count) return;
        const catPool = (focusPools[cat]||[]).filter(n=>pool.indexOf(n)!==-1 && chosen.indexOf(n)===-1);
        if(catPool.length) chosen = chosen.concat(pickFromPool(catPool, 1, avoidSet));
      });
    }
    const remaining = count - chosen.length;
    if(remaining>0){
      const restPool = pool.filter(n=>chosen.indexOf(n)===-1);
      const compounds = restPool.filter(isCompoundExercise);
      const isolations = restPool.filter(n=>!isCompoundExercise(n));
      const wantCompound = Math.min(compounds.length, Math.max(1, Math.round(remaining*0.4)));
      let more = pickFromPool(compounds, wantCompound, avoidSet);
      const secondPool = isolations.length ? isolations : restPool;
      more = more.concat(pickFromPool(secondPool.filter(n=>more.indexOf(n)===-1), remaining-more.length, avoidSet));
      if(more.length < remaining) more = more.concat(pickFromPool(restPool.filter(n=>more.indexOf(n)===-1), remaining-more.length, avoidSet));
      chosen = chosen.concat(more);
    }
    return Array.from(new Set(chosen)).slice(0,count);
  }

  // ---- Splits (convención real: full body / push-pull-legs / upper-lower /
  // bro split según frecuencia semanal — no listas al azar). Cada día define
  // solo QUÉ subgrupos entrenar; CUÁNTOS ejercicios de cada uno sale de
  // distributeCount() más abajo, según sexo y días/semana. Se garantiza que
  // los 6 grupos musculares (Pecho/Espalda/Piernas/Hombros/Brazos/Core)
  // aparecen al menos una vez en la semana completa para cualquier cantidad
  // de días — Brazos cubre bíceps+tríceps.
  const SPLIT_DAYS = {
    1: [ // Full body único — con una sola sesión semanal hay que cubrir todo el cuerpo esa vez
      { nombre:"Día único — Full body", groups:["pecho","espalda","piernas","hombros","biceps","triceps","core"] },
    ],
    2: [ // Full body x2 (frecuencia alta compensa con full body, no hay margen para split)
      { nombre:"Día 1 — Full body A", groups:["pecho","espalda","piernas","hombros","biceps","triceps","core"] },
      { nombre:"Día 2 — Full body B", groups:["pecho","espalda","piernas","hombros","biceps","triceps","core"] },
    ],
    3: [ // Push / Pull / Legs clásico
      { nombre:"Día 1 — Empuje (pecho/hombro/tríceps)", groups:["pecho","hombros","triceps"] },
      { nombre:"Día 2 — Tirón (espalda/bíceps)", groups:["espalda","biceps","core"] },
      { nombre:"Día 3 — Piernas", groups:["piernas","core"] },
    ],
    4: [ // Upper / Lower x2
      { nombre:"Día 1 — Tren superior A (empuje)", groups:["pecho","hombros","triceps"] },
      { nombre:"Día 2 — Tren inferior A", groups:["piernas","core"] },
      { nombre:"Día 3 — Tren superior B (tirón)", groups:["espalda","biceps","hombros"] },
      { nombre:"Día 4 — Tren inferior B", groups:["piernas","core"] },
    ],
    5: [ // Push/Pull/Legs/Upper/Lower (PPLUL) — el híbrido que usan programas de referencia para 5x/semana
      { nombre:"Día 1 — Empuje (pecho/hombro/tríceps)", groups:["pecho","hombros","triceps"] },
      { nombre:"Día 2 — Tirón (espalda/bíceps)", groups:["espalda","biceps"] },
      { nombre:"Día 3 — Piernas", groups:["piernas","core"] },
      { nombre:"Día 4 — Torso superior (mixto)", groups:["pecho","espalda","hombros"] },
      { nombre:"Día 5 — Brazos y core", groups:["biceps","triceps","core"] },
    ],
    6: [ // Push/Pull/Legs x2 — el split de mayor frecuencia por grupo
      { nombre:"Día 1 — Empuje A", groups:["pecho","hombros","triceps"] },
      { nombre:"Día 2 — Tirón A", groups:["espalda","biceps"] },
      { nombre:"Día 3 — Piernas A", groups:["piernas","core"] },
      { nombre:"Día 4 — Empuje B", groups:["pecho","hombros","triceps"] },
      { nombre:"Día 5 — Tirón B", groups:["espalda","biceps"] },
      { nombre:"Día 6 — Piernas B", groups:["piernas","core"] },
    ],
  };

  // Peso relativo "neutro" de cada subgrupo dentro de un día (más peso =
  // más ejercicios de ese subgrupo cuando hay que repartir el cupo del día).
  const SUBGROUP_BASE_WEIGHT = { pecho:1.0, espalda:1.0, piernas:1.15, hombros:0.85, biceps:0.7, triceps:0.75, core:0.7 };
  // Multiplicadores según sexo — Juan pidió: Femenino prioriza tren inferior
  // (glúteo/cuádriceps) y reduce pecho/bíceps; Masculino da más énfasis a
  // tren superior (pecho/espalda/hombros/brazos) que a piernas.
  const SEXO_SUBGROUP_MULT = {
    Masculino: { pecho:1.25, espalda:1.15, piernas:0.8, hombros:1.15, biceps:1.2, triceps:1.15, core:1.0 },
    Femenino:  { pecho:0.6,  espalda:1.0,  piernas:1.6, hombros:0.9,  biceps:0.6, triceps:0.85, core:1.05 },
  };
  function subgroupWeight(sg, sexo){
    const base = SUBGROUP_BASE_WEIGHT[sg] || 1;
    const mult = (SEXO_SUBGROUP_MULT[sexo] && SEXO_SUBGROUP_MULT[sexo][sg]) || 1;
    return base*mult;
  }
  // Reparte "total" ejercicios entre los subgrupos de un día, respetando un
  // mínimo por subgrupo (minMap) y usando el método del resto mayor para que
  // la suma final sea exactamente "total".
  function distributeCount(groups, total, sexo, minMap){
    minMap = minMap || {};
    // ojo: usar hasOwnProperty en vez de "minMap[g]||1" — un mínimo puesto
    // explícitamente en 0 (lo usa distributeCountByRatio para el lado "de
    // arriba" del reparto full-body) es falsy en JS y "0||1" daría 1 por error.
    const floorOf = g => (Object.prototype.hasOwnProperty.call(minMap,g) ? minMap[g] : 1);
    const weights = groups.map(g=> subgroupWeight(g, sexo));
    const sumW = weights.reduce((a,b)=>a+b,0) || 1;
    const raw = groups.map((g,i)=> (weights[i]/sumW)*total);
    const counts = raw.map((v,i)=> Math.max(floorOf(groups[i]), Math.floor(v)));
    let used = counts.reduce((a,b)=>a+b,0);
    if(used<total){
      let remainder = total-used;
      const order = raw.map((v,i)=>({ i, frac:v-Math.floor(v) })).sort((a,b)=>b.frac-a.frac);
      let idx=0;
      while(remainder>0){ counts[order[idx%order.length].i]++; remainder--; idx++; }
    } else if(used>total){
      let over = used-total;
      const order = counts.map((c,i)=>({ i, c })).sort((a,b)=>b.c-a.c);
      let guard=0;
      while(over>0 && guard<1000){
        let progressed=false;
        for(const o of order){
          const floor = floorOf(groups[o.i]);
          if(counts[o.i]>floor){ counts[o.i]--; over--; progressed=true; if(over<=0) break; }
        }
        guard++;
        if(!progressed) break;
      }
    }
    return groups.map((g,i)=>[g,counts[i]]);
  }

  // ¿Perfil "en su prime" (Juan): edad 19-35 y peso 73-93kg → un poco más de
  // volumen. Si edad/peso no están cargados, no hay bump (comportamiento
  // normal de siempre).
  function profileHasPrimeBump(){
    const p = state.profile;
    if(!p) return false;
    const edad = p.edad, peso = p.peso;
    return edad!=null && peso!=null && edad>=19 && edad<=35 && peso>=73 && peso<=93;
  }
  // Rango de ejercicios por sesión según días/semana — regla que pasó Juan
  // (14-sep/15-sep-2026): a 1-2 días hay que cubrir el cuerpo entero esa
  // sesión (más ejercicios); de ahí en más, a más frecuencia semanal, menos
  // ejercicios por sesión hacen falta porque cada grupo se entrena más seguido.
  function sessionCountRange(numDays){
    const table = { 1:[7,9], 2:[7,9], 3:[6,8], 4:[5,7], 5:[5,6], 6:[5,6] };
    return table[numDays] || table[3];
  }
  function randInt(lo,hi){ return lo + Math.floor(Math.random()*(hi-lo+1)); }

  // ---- Proporción tren superior/inferior por sexo dentro de una sesión FULL
  // BODY (donde un mismo día mezcla piernas con tren superior) — regla que
  // pasó Juan: Masculino ~60% tren superior / 40% tren inferior; Femenino
  // ~60-70% tren inferior / 30-40% tren superior (se usa el punto medio, 65%).
  // En días de split "puros" (un día que es TODO tren superior, o TODO
  // piernas+core) esta proporción no tiene nada que repartir dentro del día
  // — ahí el énfasis por sexo se aplica a nivel de CUÁNTOS ejercicios tiene
  // ese día completo, ver biasedTarget() más abajo.
  const LOWER_RATIO_BY_SEX = { Masculino: 0.40, Femenino: 0.65 };
  function distributeCountByRatio(groups, total, sexo, minMap){
    minMap = minMap || {};
    if(groups.indexOf("piernas")===-1) return distributeCount(groups, total, sexo, minMap);
    const lowerRatio = LOWER_RATIO_BY_SEX[sexo] != null ? LOWER_RATIO_BY_SEX[sexo] : 0.5;
    const piernasMin = minMap.piernas != null ? minMap.piernas : 1;
    let piernasCount = Math.max(piernasMin, Math.round(total*lowerRatio));
    piernasCount = Math.min(piernasCount, total-1); // dejar al menos 1 para el resto de grupos
    const upperGroups = groups.filter(g=>g!=="piernas");
    const upperTotal = total - piernasCount;
    // Piso 0 (no 1) para los subgrupos de arriba: con presupuesto chico (ej.
    // full body de 1 día repartiendo poco entre 6 subgrupos) no siempre entra
    // uno de cada uno en ESTE día puntual — la cobertura semanal completa la
    // sigue garantizando la red de seguridad al final de generateAutoRoutine().
    const upperMinMap = {};
    upperGroups.forEach(g=>{ upperMinMap[g] = 0; });
    const upperDist = upperGroups.length ? distributeCount(upperGroups, upperTotal, sexo, upperMinMap) : [];
    return [["piernas", piernasCount]].concat(upperDist);
  }
  // ¿Este día es "mixto" (full body: mezcla piernas con tren superior en la
  // misma sesión), "superior" (solo pecho/espalda/hombros/brazos/core) o
  // "inferior" (solo piernas, con o sin core)? Full body usa la proporción
  // de arriba; los días de split puro usan el sesgo de biasedTarget().
  function dayModality(groups){
    const hasLower = groups.indexOf("piernas")!==-1;
    const hasUpper = groups.some(g=> g!=="piernas" && g!=="core");
    if(hasLower && hasUpper) return "mixto";
    return hasLower ? "inferior" : "superior";
  }
  // Sesga cuántos ejercicios tiene un día de split puro según a quién
  // favorece ese tipo de día: Masculino → más ejercicios en días de tren
  // superior, menos en días de piernas; Femenino → al revés. Los días
  // "mixto" (full body) no se sesgan acá — ya se reparten con la proporción
  // de distributeCountByRatio(), así que usan el rango parejo de siempre.
  function biasedTarget(lo, hi, modality, sexo){
    if(modality==="mixto" || lo>=hi) return randInt(lo,hi);
    const mid = Math.round((lo+hi)/2);
    const sexFavorsUpper = sexo==="Masculino";
    const dayIsUpper = modality==="superior";
    const favored = sexFavorsUpper === dayIsUpper;
    return favored ? randInt(Math.max(mid,lo), hi) : randInt(lo, Math.min(mid,hi));
  }

  // ---- Volumen (series por ejercicio) según edad — curva descendente que
  // pasó Juan: 18-29 años tolerancia máxima (100% del volumen: 4 series por
  // ejercicio), 30-49 empieza a bajar (≈15-20% menos: 3 series), 50+ baja más
  // (≈30-40% menos: 2 series). Sin edad cargada, se usa el nivel intermedio
  // de siempre (3 series) para no asumir de más ni de menos.
  function seriesForAge(edad){
    if(edad==null) return 3;
    if(edad<=29) return 4;
    if(edad<=49) return 3;
    return 2;
  }
  // ---- Descanso sugerido entre series según edad — pasó Juan: 60-90s para
  // perfiles jóvenes, 120-180s para 50+ (la recuperación metabólica entre
  // series es más lenta). Es solo informativo (se muestra como sugerencia,
  // no cambia el cronómetro de nadie a la fuerza).
  function restRangeForAge(edad){
    return (edad!=null && edad>=50) ? [120,180] : [60,90];
  }
  // ---- Ejercicios libres de alta carga axial (columna) a evitar para 50+ —
  // pasó Juan: por ejemplo sentadilla libre, peso muerto y press militar con
  // barra deberían reemplazarse por variantes guiadas (máquina/polea). Estos
  // nombres simplemente se sacan del pool candidato para ese perfil — como
  // sus alternativas seguras (prensa, sentadilla hack, remo en polea, press
  // con mancuernas, peso muerto rumano, etc.) ya están cargadas en el mismo
  // subgrupo/foco, el generador las elige solas sin necesitar un mapa de
  // reemplazo exercicio-por-ejercicio.
  const EXERCISES_RISKY_50PLUS = new Set([
    "Sentadilla", "Sentadilla frontal", "Sentadilla sumo",
    "Peso muerto", "Peso muerto sumo", "Peso muerto piernas rígidas",
    "Remo con barra", "Press militar con barra", "Press tras nuca",
  ]);

  // Todos los subgrupos "de tren superior/core" que tienen que aparecer en la
  // semana completa (piernas se controla aparte con los 4 sub-focos de abajo,
  // porque "piernas" como bloque no alcanza — hay que exigir cuádriceps,
  // isquios, glúteo y pantorrilla cada uno por separado).
  const REQUIRED_WEEK_SUBGROUPS = ["pecho","espalda","hombros","biceps","triceps","core"];
  const REQUIRED_LEG_FOCI = ["quads","hamstrings","glutes","calves"];

  function generateAutoRoutine(numDays, sexo){
    const templ = SPLIT_DAYS[numDays] || SPLIT_DAYS[3];
    const bump = profileHasPrimeBump();
    const [lo,hi] = sessionCountRange(numDays);
    const edad = state.profile ? state.profile.edad : null;
    const riskyExclude = (edad!=null && edad>=50) ? EXERCISES_RISKY_50PLUS : null;
    const seriesCount = String(seriesForAge(edad));
    const avoid = new Set();
    const legFociCovered = new Set();
    const subgroupsCovered = new Set();
    // Orden de prioridad de sub-foco de pierna según sexo — Femenino exige
    // glúteo/cuádriceps primero (casi obligatorio todas las semanas), y
    // Masculino prioriza igual pero con menos peso relativo en el reparto.
    const legFocusPriority = sexo==="Femenino" ? ["glutes","quads","hamstrings","calves"] : ["quads","hamstrings","glutes","calves"];

    const days = templ.map(dd=>{
      const modality = dayModality(dd.groups);
      let target = biasedTarget(lo, hi, modality, sexo);
      if(bump) target = Math.min(hi+2, target + randInt(1,2));
      target = Math.max(lo, target);
      const dist = modality==="mixto"
        ? distributeCountByRatio(dd.groups, target, sexo, { piernas:2 })
        : distributeCount(dd.groups, target, sexo, { piernas:2 });
      const names = [];
      dist.forEach(([sg,count])=>{
        const opts = { riskyExclude };
        if(sg==="piernas"){
          const uncovered = legFocusPriority.filter(f=>!legFociCovered.has(f));
          if(uncovered.length) opts.forceLegFocus = uncovered.slice(0, count);
        }
        const picked = pickForSubgroup(sg,count,avoid,opts);
        if(sg==="piernas") picked.forEach(n=>{ const f=exerciseLegFocus(n); if(f) legFociCovered.add(f); });
        else if(picked.length) subgroupsCovered.add(sg);
        names.push(...picked);
      });
      const exercises = names.map(n=>({ id:uid(), nombre:n, series:seriesCount, reps:"10", notas:"", imagenUrl:"" }));
      return { id:uid(), nombre: dd.nombre, exercises };
    });

    // Red de seguridad: garantiza SIEMPRE (sin importar sexo, edad o cómo
    // cayeron los cupos por día) que la semana completa cubra los 4 sub-focos
    // de pierna y los 6 subgrupos de tren superior/core — nunca se puede
    // saltear un grupo muscular entero, el sexo solo cambia el ÉNFASIS/volumen
    // relativo, y la edad solo cambia QUÉ variante puntual se elige.
    const focusPools = legFocusPools(riskyExclude);
    const piernasDaysIdx = templ.map((dd,i)=> dd.groups.indexOf("piernas")!==-1 ? i : -1).filter(i=>i!==-1);
    REQUIRED_LEG_FOCI.filter(f=>!legFociCovered.has(f)).forEach((f,idx)=>{
      const pool = (focusPools[f]||[]).filter(n=>!avoid.has(n));
      const name = pool[0] || (focusPools[f]||[])[0];
      const dayIdx = piernasDaysIdx.length ? piernasDaysIdx[idx % piernasDaysIdx.length] : 0;
      if(name && days[dayIdx]){
        days[dayIdx].exercises.push({ id:uid(), nombre:name, series:seriesCount, reps:"10", notas:"", imagenUrl:"" });
        avoid.add(name); legFociCovered.add(f);
      }
    });
    const pools = subgroupPools(riskyExclude);
    REQUIRED_WEEK_SUBGROUPS.filter(sg=>!subgroupsCovered.has(sg)).forEach(sg=>{
      const pool = (pools[sg]||[]).filter(n=>!avoid.has(n));
      const name = pool[0] || (pools[sg]||[])[0];
      if(!name) return;
      const dayIdx = days.reduce((best,d,i)=> d.exercises.length < days[best].exercises.length ? i : best, 0);
      days[dayIdx].exercises.push({ id:uid(), nombre:name, series:seriesCount, reps:"10", notas:"", imagenUrl:"" });
      avoid.add(name); subgroupsCovered.add(sg);
    });

    return days;
  }

  function openAutoRoutineModal(){
    let numDays = 3;
    let sexo = null; // se pide explícitamente antes de poder generar
    let plan = null;
    const modalEl = openModal("", null);

    function bodyHtml(){
      const daysBtns = [1,2,3,4,5,6].map(n=>`<button class="btn btn-sm ${n===numDays?'btn-primary':'btn-ghost'}" data-days="${n}">${n}</button>`).join("");
      const sexoBtns = ["Femenino","Masculino"].map(s=>`<button class="btn btn-sm ${s===sexo?'btn-primary':'btn-ghost'}" data-sexo="${s}" style="flex:1">${s}</button>`).join("");
      const edad = state.profile ? state.profile.edad : null;
      const [restLo,restHi] = restRangeForAge(edad);
      const seriesNote = seriesForAge(edad);
      const previewHtml = plan ? `
        <p class="helptext">Series por ejercicio: <b>${seriesNote}</b>${edad!=null?` (según tu edad cargada, ${edad} años)`:" (nivel intermedio — cargá tu edad en Perfil para ajustar esto)"} · Descanso sugerido entre series: <b>${restLo}-${restHi} segundos</b>.</p>
        <div class="stack" style="max-height:260px; overflow-y:auto">
          ${plan.map(d=>`
            <div class="card" style="padding:10px">
              <b style="font-size:14px">${esc(d.nombre)}</b>
              <div class="helptext" style="margin-top:4px">${d.exercises.map(e=>esc(e.nombre)).join(" · ") || "Sin ejercicios disponibles para este día."}</div>
            </div>
          `).join("")}
        </div>
      ` : `<p class="helptext">Elegí sexo y días por semana. Vamos a armar una rutina completa (basada en splits reales — full body, empuje/tirón/pierna o torso/pierna según la frecuencia) combinando ejercicios compuestos y de aislamiento, que después podés revisar y editar como cualquier otra. Si tenés la edad cargada en tu Perfil, ajustamos series y elegimos variantes más cuidadas de las articulaciones cuando corresponde.</p>`;
      return `
        <h3>Rutina automática</h3>
        <div class="field">
          <label>Sexo</label>
          <div class="row" style="gap:8px">${sexoBtns}</div>
        </div>
        <div class="field">
          <label>Días por semana</label>
          <div class="autoroutine-daybtns">${daysBtns}</div>
        </div>
        ${previewHtml}
        <div class="modal-actions">
          ${plan ? `
            <button class="btn btn-ghost" data-act="regen">${icon("shuffle")} Generar otra</button>
            <button class="btn btn-primary" data-act="use">Usar esta rutina</button>
          ` : `
            <button class="btn btn-ghost" data-act="cancel">Cancelar</button>
            <button class="btn btn-primary" data-act="gen" ${sexo?"":"disabled"}>Generar</button>
          `}
        </div>
      `;
    }

    function draw(){
      modalEl.innerHTML = bodyHtml();
      modalEl.querySelectorAll("[data-days]").forEach(b=>{
        b.onclick = ()=>{ numDays = parseInt(b.dataset.days,10); plan = null; draw(); };
      });
      modalEl.querySelectorAll("[data-sexo]").forEach(b=>{
        b.onclick = ()=>{ sexo = b.dataset.sexo; plan = null; draw(); };
      });
      const cancelBtn = modalEl.querySelector('[data-act="cancel"]');
      if(cancelBtn) cancelBtn.onclick = closeModal;
      const genBtn = modalEl.querySelector('[data-act="gen"]');
      if(genBtn) genBtn.onclick = ()=>{ if(!sexo) return; plan = generateAutoRoutine(numDays, sexo); draw(); };
      const regenBtn = modalEl.querySelector('[data-act="regen"]');
      if(regenBtn) regenBtn.onclick = ()=>{ plan = generateAutoRoutine(numDays, sexo); draw(); };
      const useBtn = modalEl.querySelector('[data-act="use"]');
      if(useBtn) useBtn.onclick = async ()=>{
        // La rutina automática SIEMPRE se guarda en su propia "ranura" separada
        // de la personalizada (desde v19) — así generarla nunca pisa la rutina
        // que el usuario armó a mano, y puede volver a ella cuando quiera.
        const apply = async ()=>{
          state.rutinaSlots.automatica = { days: plan };
          state.activeSlot = "automatica";
          state.rutina = state.rutinaSlots.automatica;
          await persistRutina();
          closeModal();
          state.tab = "rutina";
          renderScreen();
        };
        if((state.rutinaSlots.automatica.days||[]).length>0){
          const ok = await confirmDialog("Reemplazar rutina automática", "Ya tenías una rutina automática generada antes — ¿reemplazarla por esta? Tu rutina personalizada no se toca.", "Reemplazar");
          if(!ok) return;
        }
        await apply();
      };
    }
    draw();
  }

  /* ================= CALENDARIO ================= */
  function currentCalMonth(){
    if(!state.calMonth){ const d=new Date(); state.calMonth = { y:d.getFullYear(), m:d.getMonth() }; }
    return state.calMonth;
  }

  const MONTH_NAMES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

  function screenCalendario(){
    const { y, m } = currentCalMonth();
    const doneByDate = {};
    (state.entrenos||[]).forEach(e=>{ if(!e.date) return; (doneByDate[e.date] = doneByDate[e.date]||[]).push(e); });
    const first = new Date(y,m,1);
    const daysInMonth = new Date(y,m+1,0).getDate();
    const startOffset = (first.getDay()+6)%7; // 0=lunes
    const todayS = todayStr();
    const cells = [];
    for(let i=0;i<startOffset;i++) cells.push(`<div class="cal-cell empty"></div>`);
    for(let d=1; d<=daysInMonth; d++){
      const dateStr = `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      const done = doneByDate[dateStr];
      const isToday = dateStr===todayS;
      cells.push(`<div class="cal-cell ${done?"done":""} ${isToday?"today":""}" ${done?`data-cal-day="${dateStr}"`:""}>${d}</div>`);
    }
    const monthCount = Object.keys(doneByDate).filter(k=>k.startsWith(`${y}-${String(m+1).padStart(2,"0")}`)).length;
    return `
      <div class="section-title"><h2>Calendario</h2></div>
      <div class="card stack">
        <div class="row between">
          <span class="iconbtn" id="cal-prev">${icon("chevronLeft")}</span>
          <b style="font-size:16px">${MONTH_NAMES[m]} ${y}</b>
          <span class="iconbtn" id="cal-next">${icon("chevronRight")}</span>
        </div>
        <div class="cal-grid">
          ${["L","M","X","J","V","S","D"].map(w=>`<div class="cal-weekday">${w}</div>`).join("")}
          ${cells.join("")}
        </div>
        <p class="helptext">${monthCount} entrenamiento${monthCount===1?"":"s"} este mes. Tocá un día marcado para ver el detalle.</p>
      </div>
    `;
  }

  function mountCalendario(){
    const el = document.getElementById("screen");
    const prevBtn = el.querySelector("#cal-prev");
    const nextBtn = el.querySelector("#cal-next");
    if(prevBtn) prevBtn.onclick = ()=>{ const c=currentCalMonth(); c.m--; if(c.m<0){c.m=11;c.y--;} renderScreen(); };
    if(nextBtn) nextBtn.onclick = ()=>{ const c=currentCalMonth(); c.m++; if(c.m>11){c.m=0;c.y++;} renderScreen(); };
    el.querySelectorAll("[data-cal-day]").forEach(cell=>{
      cell.onclick = ()=>{
        const date = cell.dataset.calDay;
        const list = (state.entrenos||[]).filter(e=>e.date===date);
        const m = openModal(`
          <h3>${esc(fmtDate(date))}</h3>
          <div class="loglist">
            ${list.map(e=>`
              <div class="logrow">
                <div><div class="lex">${esc(e.dayNombre||"Entrenamiento")}</div></div>
                <div><div class="lval num">${e.setsCompletados}/${e.setsTotales}</div><div class="lsub">series</div></div>
              </div>
            `).join("")}
          </div>
          <div class="modal-actions"><button class="btn btn-primary btn-block" data-act="ok">Cerrar</button></div>
        `);
        m.querySelector('[data-act="ok"]').onclick = closeModal;
      };
    });
  }

    const autoBtn = el.querySelector("#btn-auto-routine");
    if(autoBtn) autoBtn.onclick = openAutoRoutineModal;
    const explorarBtn = el.querySelector("#btn-explorar-musculos");
    if(explorarBtn) explorarBtn.onclick = ()=>{ state.explorerGroup = null; state.tab = "explorar"; render(); };

    el.querySelectorAll("[data-rutina-slot]").forEach(b=>{
      b.onclick = ()=> selectRutinaSlot(b.dataset.rutinaSlot);
    });

    el.querySelectorAll("[data-toggle]").forEach(h=>{
      h.onclick = ()=>{
        const id = h.dataset.toggle;
        state.dayOpen[id] = !(state.dayOpen[id] !== false);

    });

      b.onclick = (e)=>{
        e.stopPropagation();

        state.dayEditMode[id] = !state.dayEditMode[id];
        renderScreen();
      };
    });
    el.querySelectorAll("[data-edit-day]").forEach(b=>{
      b.onclick = (e)=>{ e.stopPropagation(); const day = state.rutina.days.find(d=>d.id===b.dataset.editDay); openDayModal(day); };
    });
    el.querySelectorAll("[data-del-day]").forEach(b=>{

        if(!ok) return;
        state.rutina.days = state.rutina.days.filter(d=>d.id!==day.id);
        await persistRutina();
        renderScreen();
      };
    });
    el.querySelectorAll("[data-add-ex]").forEach(b=>{
      b.onclick = ()=>{ const day = state.rutina.days.find(d=>d.id===b.dataset.addEx); openExerciseModal(day, null); };
    });
    el.querySelectorAll("[data-edit-ex]").forEach(b=>{
      b.onclick = ()=>{
        const [dayId, exId] = b.dataset.editEx.split("|");
        const day = state.rutina.days.find(d=>d.id===dayId);
        const ex = day.exercises.find(x=>x.id===exId);
        openExerciseModal(day, ex);
      };
    });
    el.querySelectorAll("[data-del-ex]").forEach(b=>{
      b.onclick = async ()=>{
        const [dayId, exId] = b.dataset.delEx.split("|");
        const day = state.rutina.days.find(d=>d.id===dayId);
        const ex = day.exercises.find(x=>x.id===exId);
        const ok = await confirmDialog("Eliminar ejercicio", `¿Eliminar "${ex.nombre}" de este día?`);
        if(!ok) return;
        day.exercises = day.exercises.filter(x=>x.id!==exId);
        await persistRutina();
        renderScreen();
      };
    });
    el.querySelectorAll("[data-log-ex]").forEach(b=>{
      b.onclick = ()=>{ state.exerciseSelForm = b.dataset.logEx; setTab("registro"); };
    });
    el.querySelectorAll("[data-howto-ex]").forEach(b=>{
      b.onclick = (e)=>{
        e.stopPropagation();
        const [dayId, exId] = b.dataset.howtoEx.split("|");
        const day = state.rutina.days.find(d=>d.id===dayId);
        const ex = day && day.exercises.find(x=>x.id===exId);
        if(ex) openExerciseDetail(ex, { returnTab:"rutina" });
      };
    });
    el.querySelectorAll("[data-start-session]").forEach(b=>{
      b.onclick = (e)=>{
        e.stopPropagation();
        const day = state.rutina.days.find(d=>d.id===b.dataset.startSession);
        startSession(day);
      };
    });
    const resumeBtn = el.querySelector("#btn-resume-session");
    if(resumeBtn) resumeBtn.onclick = ()=>{ state.tab = "sesion"; render(); };
  }

  /* ================= MODO ENTRENANDO ================= */
  function startSession(day){
    const sets = {};
    (day.exercises||[]).forEach(ex=>{
      const n = Math.max(1, Math.min(12, parseInt(ex.series,10)||1));
      sets[ex.id] = new Array(n).fill(false);
    });
    state.session = { dayId: day.id, sets };
    state.tab = "sesion";
    render();
  }

  function renderSession(){
    const day = state.rutina.days.find(d=>d.id===state.session.dayId);
    if(!day){ state.session=null; state.tab="rutina"; render(); return; }
    app.innerHTML = `
      <div class="topbar">
        <span class="iconbtn" id="btn-session-back">${icon("back")}</span>
        <h1 style="font-size:18px; flex:1; text-align:center">${esc(day.nombre)}</h1>
        <span style="width:30px"></span>
      </div>
      <main><div class="screen" id="screen"></div></main>
      <nav class="bottomnav">
        <button class="btn btn-primary btn-block" id="btn-finish-session" style="max-width:444px; margin:0 auto">${icon("check")} Terminar entrenamiento</button>
      </nav>
    `;
    document.getElementById("btn-session-back").onclick = ()=>{ state.tab="rutina"; render(); };
    document.getElementById("screen").innerHTML = screenSession(day);
    mountSession(day);
    document.getElementById("btn-finish-session").onclick = ()=> finishSession(day);
  }

  function screenSession(day){
    const exs = day.exercises||[];
    if(exs.length===0){
      return `<div class="card empty">${icon("routine")}<h3>Este día no tiene ejercicios</h3><p>Agregale ejercicios desde "Rutina" antes de entrenar.</p></div>`;
    }
    return exs.map(ex=>{
      const done = state.session.sets[ex.id] || [];
      return `
        <div class="card stack">
          <div class="row between">
            <div style="display:flex; align-items:center; gap:10px; min-width:0">
              ${exerciseThumbHtml(ex, "width:40px; height:50px; flex:none")}
              <div style="min-width:0">
                <div class="exname" style="font-size:16px">${esc(ex.nombre)}</div>
                <div class="exmeta">${esc(ex.series)} series × ${esc(ex.reps)} reps${ex.notas? " · "+esc(ex.notas):""}</div>
              </div>
            </div>
            <div class="row" style="gap:4px; flex:none">
              <span class="iconbtn" data-howto-ex-session="${ex.id}" title="Cómo hacerlo" style="flex:none">${icon("info")}</span>
              <span class="iconbtn" data-rest-btn title="Descansar" style="flex:none">${icon("timer")}</span>
            </div>
          </div>
          <div class="setrow">
            ${done.map((v,i)=>`<div class="setdot ${v?"done":""}" data-ex="${ex.id}" data-idx="${i}">${i+1}</div>`).join("")}
          </div>
        </div>
      `;
    }).join("") + `<button class="btn btn-outline btn-block" id="btn-cancel-session">Cancelar entrenamiento</button>`;
  }

  function mountSession(day){
    const el = document.getElementById("screen");
    el.querySelectorAll(".setdot").forEach(dot=>{
      dot.onclick = ()=>{
        const exId = dot.dataset.ex, idx = parseInt(dot.dataset.idx,10);
        state.session.sets[exId][idx] = !state.session.sets[exId][idx];
        dot.classList.toggle("done");
      };
    });
    el.querySelectorAll("[data-rest-btn]").forEach(b=>{
      b.onclick = ()=> openRestModal();
    });
    el.querySelectorAll("[data-howto-ex-session]").forEach(b=>{
      b.onclick = ()=>{
        const ex = (day.exercises||[]).find(x=>x.id===b.dataset.howtoExSession);
        if(ex) openExerciseDetail(ex, { returnTab:"sesion" });
      };
    });
    const cancelBtn = el.querySelector("#btn-cancel-session");
    if(cancelBtn) cancelBtn.onclick = async ()=>{
      const ok = await confirmDialog("Cancelar entrenamiento", "¿Salir sin registrar este entrenamiento?");
      if(!ok) return;
      state.session = null;
      state.tab = "rutina";
      render();
    };
  }

  async function finishSession(day){
    const setsObj = state.session.sets;
    let total=0, done=0;
    Object.keys(setsObj).forEach(exId=>{ setsObj[exId].forEach(v=>{ total++; if(v) done++; }); });
    const data = { date: todayStr(), dayId: day.id, dayNombre: day.nombre, setsCompletados: done, setsTotales: total, createdAt: Date.now() };
    await Store.addEntreno(state.profile.id, data);
    state.entrenos = await Store.listEntrenos(state.profile.id);
    state.session = null;
    state.tab = "rutina";
    render();
    const m = openModal(`
      <h3>¡Entrenamiento registrado! 💪</h3>
      <p style="font-size:14px; color:var(--text)">${esc(fraseDelDia())}</p>
      <div class="modal-actions"><button class="btn btn-primary btn-block" data-act="ok">Dale</button></div>
    `);
    m.querySelector('[data-act="ok"]').onclick = closeModal;
  }

  /* ================= REGISTRO ================= */
  function filterHistory(list){
    const f = state.historyFilter;
    return list.filter(r=>{
      if(f.exercise && r.exercise!==f.exercise) return false;
      if(f.from && r.date < f.from) return false;
      if(f.to && r.date > f.to) return false;
      return true;
    });
  }

  function toCSV(rows){
    const header = ["Fecha","Ejercicio","Peso (kg)","Series","Reps","Nota"];
    const escCsv = (v)=>{
      const s = String(v==null?"":v);
      return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
    };
    const lines = [header.map(escCsv).join(",")];
    rows.forEach(r=> lines.push([r.date, r.exercise, r.peso, r.series||"", r.reps||"", r.nota||""].map(escCsv).join(",")));
    return lines.join("\r\n");
  }

  function exportCSV(rows){
    const csv = toCSV(rows);
    const blob = new Blob(["﻿"+csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `fierros-historial-${(state.profile.name||"perfil").toLowerCase().replace(/\s+/g,"-")}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=> URL.revokeObjectURL(url), 1000);
  }

  function sparklineFor(history){
    const asc = history.slice().sort((a,b)=> a.date<b.date?-1:1).slice(-10);
    if(asc.length===0) return `<p class="helptext">Todavía no hay registros de este ejercicio.</p>`;
    const weights = asc.map(r=> parseFloat(r.peso)||0);
    const best = Math.max(...weights);
    const min = Math.min(...weights);
    const w = 260, h = 40, pad = 6;
    const range = (best-min)||1;
    const pts = weights.map((val,i)=>{
      const x = weights.length===1 ? w/2 : (i/(weights.length-1))*(w-pad*2)+pad;
      const y = h - pad - ((val-min)/range)*(h-pad*2);
      return [x,y];
    });
    const path = pts.map((p,i)=> (i===0?"M":"L")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
    const last = pts[pts.length-1];
    return `
      <div class="spark-row">
        <svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
          <line x1="0" y1="${h-pad}" x2="${w}" y2="${h-pad}" stroke="var(--border)" stroke-width="1"/>
          <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="var(--accent)"/>
        </svg>
        <div class="spark-stats">
          <div class="best num">${best} kg</div>
          <div class="lbl">Mejor marca</div>
        </div>
      </div>
    `;
  }

  /* ================= CRONOMETRO ================= */
  const timer = {
    total: lsGet("fierros:timerDefault", 90),
    remaining: null,
    running: false,
    intervalId: null,
    endAt: null,
    audioCtx: null,
  };

  let timerRerender = () => renderScreen();

  function timerBlockHtml(){
    const presets = [30,45,60,90,120,180];
    const remaining = timer.remaining==null ? timer.total : timer.remaining;
    const pct = Math.max(0, Math.min(1, remaining/timer.total));
    const R = 100, C = 2*Math.PI*R;
    const dash = C*pct;
    const mm = Math.floor(remaining/60), ss = Math.floor(remaining%60);
    const label = timer.running ? "Descansando" : (remaining===0 ? "¡Listo!" : "Pausado");
    return `
      <div class="presets" id="presets">
        ${presets.map(p=>`<button class="preset ${!timer.running && timer.total===p?"active":""}" data-preset="${p}">${p<60?p+"s":(p/60)+"m"}</button>`).join("")}
      </div>
      <div class="ring-box">
        <svg viewBox="0 0 220 220">
          <circle class="ring-bg" cx="110" cy="110" r="${R}"/>
          <circle class="ring-fg ${remaining===0?"done":""}" cx="110" cy="110" r="${R}"
            stroke-dasharray="${C}" stroke-dashoffset="${C-dash}"/>
        </svg>
        <div class="ring-label">
          <div class="time num" id="time-label">${String(mm).padStart(2,"0")}:${String(ss).padStart(2,"0")}</div>
          <div class="state">${label}</div>
        </div>
      </div>
      <div class="timer-controls">
        <button class="btn btn-ghost" id="btn-reset">${icon("reset")}<span>Reiniciar</span></button>
        <button class="btn btn-primary" id="btn-toggle">${timer.running?icon("pause"):icon("play")}<span>${timer.running?"Pausa":"Iniciar"}</span></button>
      </div>
      <div class="field" style="width:100%">
        <label>Tiempo personalizado (segundos)</label>
        <input type="number" id="custom-secs" min="5" max="900" value="${timer.total}">
      </div>
    `;
  }

  function wireTimerControls(root){
    root.querySelectorAll("[data-preset]").forEach(b=>{
      b.onclick = ()=>{
        const v = parseInt(b.dataset.preset,10);
        timer.total = v; timer.remaining = v; timer.running=false; clearInterval(timer.intervalId); timer.endAt=null;
        lsSet("fierros:timerDefault", v);
        timerRerender();
      };
    });
    root.querySelector("#btn-toggle").onclick = ()=>{
      if(timer.running) pauseTimer(); else startTimer();
    };
    root.querySelector("#btn-reset").onclick = resetTimer;
    const custom = root.querySelector("#custom-secs");
    custom.onchange = ()=>{
      const v = Math.max(5, Math.min(900, parseInt(custom.value,10)||90));
      timer.total = v; timer.remaining = v; timer.running=false; clearInterval(timer.intervalId); timer.endAt=null;
      lsSet("fierros:timerDefault", v);
      timerRerender();
    };
  }

  function openRestModal(){
    const m = openModal(`

      const body = m.querySelector(".timer-modal-body");
      body.innerHTML = timerBlockHtml();
      wireTimerControls(body);
    };
    wireTimerControls(m.querySelector(".timer-modal-body"));
    m.querySelector('[data-act="close"]').onclick = ()=>{ closeModal(); timerRerender = renderScreen; };

  /* ---------- Cronómetro de tiempo total de entrenamiento (cuenta hacia arriba) ---------- */
  const workoutClock = { running:false, elapsedMs:0, startEpoch:null, intervalId:null };
  let workoutClockRerender = () => renderScreen();

  function fmtElapsed(ms){
    const total = Math.floor(ms/1000);
    const hh = Math.floor(total/3600), mm = Math.floor((total%3600)/60), ss = total%60;
    const mmss = `${String(mm).padStart(2,"0")}:${String(ss).padStart(2,"0")}`;
    return hh>0 ? `${String(hh).padStart(2,"0")}:${mmss}` : mmss;
  }

  function currentWorkoutElapsed(){
    return workoutClock.elapsedMs + (workoutClock.running ? (Date.now()-workoutClock.startEpoch) : 0);
  }

  function workoutClockHtml(){
    return `
      <div class="card" style="display:flex; flex-direction:column; align-items:center; gap:10px; padding:16px 14px">
        <div class="helptext" style="text-transform:uppercase; letter-spacing:.04em; font-weight:700">Tiempo de entrenamiento</div>
        <div class="num" id="workout-time-label" style="font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:38px">${fmtElapsed(currentWorkoutElapsed())}</div>
        <div class="row" style="gap:10px">
          <button class="btn btn-ghost btn-sm" id="btn-workout-reset">${icon("reset")} Reiniciar</button>
          <button class="btn btn-primary btn-sm" id="btn-workout-toggle">${workoutClock.running? icon("pause")+" Pausar" : icon("play")+" Iniciar entrenamiento"}</button>
        </div>
      </div>
    `;
  }

  function tickWorkoutClock(){
    const label = document.getElementById("workout-time-label");
    if(label) label.textContent = fmtElapsed(currentWorkoutElapsed());
  }

  function wireWorkoutClock(root){
    root.querySelector("#btn-workout-toggle").onclick = ()=>{
      if(workoutClock.running){
        workoutClock.elapsedMs = currentWorkoutElapsed();
        workoutClock.running = false;
        workoutClock.startEpoch = null;
        clearInterval(workoutClock.intervalId);
      } else {
        workoutClock.running = true;
        workoutClock.startEpoch = Date.now();
        clearInterval(workoutClock.intervalId);
        workoutClock.intervalId = setInterval(tickWorkoutClock, 1000);
      }
      workoutClockRerender();
    };
    root.querySelector("#btn-workout-reset").onclick = ()=>{
      clearInterval(workoutClock.intervalId);
      workoutClock.running = false;
      workoutClock.elapsedMs = 0;
      workoutClock.startEpoch = null;
      workoutClockRerender();
    };
  }

  function screenCronometro(){
    return `
      <div class="section-title"><h2>Cronómetro</h2></div>
      ${workoutClockHtml()}
      <div class="section-title" style="margin-top:6px"><h2>Descanso entre series</h2></div>
      <div class="card timer-wrap">${timerBlockHtml()}</div>
      <p class="helptext" style="text-align:center">Cuando termine el descanso vas a escuchar un sonido y (si tu celular lo permite) vibrar.</p>
    `;
  }

  function playBeep(){
    try{
      if(!timer.audioCtx) timer.audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      const ctx = timer.audioCtx;
      if(ctx.state==="suspended") ctx.resume();
      [0,0.18,0.36].forEach((t,i)=>{
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = "sine";
        o.frequency.value = i===2? 1046.5 : 880;
        g.gain.setValueAtTime(0.0001, ctx.currentTime+t);
        g.gain.exponentialRampToValueAtTime(0.28, ctx.currentTime+t+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+t+0.16);
        o.connect(g); g.connect(ctx.destination);
        o.start(ctx.currentTime+t);
        o.stop(ctx.currentTime+t+0.18);
      });
    }catch(e){}
    if(navigator.vibrate) navigator.vibrate([200,100,200,100,200]);
  }

  function tick(){
    if(timer.endAt==null) return;
    const remainingMs = timer.endAt - Date.now();
    const remaining = Math.max(0, Math.ceil(remainingMs/1000));
    timer.remaining = remaining;
    const timeLabel = document.getElementById("time-label");
    const ring = document.querySelector(".ring-fg");
    if(timeLabel){
      const mm=Math.floor(remaining/60), ss=Math.floor(remaining%60);
      timeLabel.textContent = `${String(mm).padStart(2,"0")}:${String(ss).padStart(2,"0")}`;
    }
    if(ring){
      const R=100, C=2*Math.PI*R;
      const pct = Math.max(0, Math.min(1, remaining/timer.total));
      ring.setAttribute("stroke-dashoffset", C-(C*pct));
    }
    if(remaining<=0){
      stopTimer(true);
      timerRerender();
    }
  }

  function startTimer(){
    if(timer.remaining==null) timer.remaining = timer.total;
    if(timer.remaining<=0) timer.remaining = timer.total;
    timer.endAt = Date.now() + timer.remaining*1000;
    timer.running = true;
    clearInterval(timer.intervalId);
    timer.intervalId = setInterval(tick, 250);
    timerRerender();
  }
  function pauseTimer(){
    timer.running = false;
    clearInterval(timer.intervalId);
    timerRerender();
  }
  function stopTimer(finished){
    timer.running = false;
    clearInterval(timer.intervalId);
    timer.endAt = null;
    if(finished){ timer.remaining = 0; playBeep(); }
  }
  function resetTimer(){
    stopTimer(false);
    timer.remaining = timer.total;
    timerRerender();
  }

  function mountCronometro(){
    timerRerender = renderScreen;
    workoutClockRerender = renderScreen;
    wireTimerControls(document.getElementById("screen"));
    wireWorkoutClock(document.getElementById("screen"));
  }

  /* ================= PERFIL ================= */
  function screenPerfil(){
    const email = (state.authSession && state.authSession.user && state.authSession.user.email) || "";
    return `
      <div class="section-title"><h2>Tu cuenta</h2></div>
      <div class="card row" style="gap:12px">
        <div class="avatar" style="width:40px;height:40px;font-size:16px">${esc(initials(state.profile.name))}</div>
        <div><b style="font-size:15px">${esc(state.profile.name)}</b><div class="helptext">${esc(email)}</div></div>
      </div>

      <div class="section-title" style="margin-top:6px"><h2>Preferencias</h2></div>
      <div class="card stack">
        <div class="field">
          <label>Nombre</label>
          <input type="text" id="perfil-name" maxlength="24" value="${esc(state.profile.name)}">
        </div>
        <div class="field">
          <label>Meta semanal (veces por semana)</label>
          <input type="number" id="meta-semanal" min="1" max="7" value="${state.profile.metaSemanal||3}">
        </div>
        <div class="field-row">
          <div class="field">
            <label>Edad</label>
            <input type="number" id="perfil-edad" min="10" max="99" placeholder="Opcional" value="${state.profile.edad||""}">
          </div>
          <div class="field">
            <label>Peso aprox. (kg)</label>
            <input type="number" id="perfil-peso" min="20" max="300" step="0.5" placeholder="Opcional" value="${state.profile.peso||""}">
          </div>
        </div>
        <p class="helptext">La edad y el peso son opcionales — van a servir para el futuro asistente de IA personalizado.</p>
      </div>

      <div class="section-title" style="margin-top:6px"><h2>Acerca de VodaFit</h2></div>
      <div class="card stack">
        <p class="helptext">Rutina, registro de pesos y cronómetro de descanso. Los videos de ejercicios y otras funciones se van a ir sumando más adelante.</p>
        <div class="row between">
          <span class="helptext">Tema</span>
          <div class="segmented" id="theme-seg" style="width:auto">
            <button data-theme="system" class="${lsGet('fierros:theme','system')==='system'?'active':''}">Auto</button>
            <button data-theme="light" class="${lsGet('fierros:theme','system')==='light'?'active':''}">Claro</button>
            <button data-theme="dark" class="${lsGet('fierros:theme','system')==='dark'?'active':''}">Oscuro</button>
          </div>
        </div>
      </div>

      <button class="btn btn-outline btn-block" id="btn-logout">${icon("back")} Cerrar sesión</button>
    `;
  }

  function mountPerfil(){
    const el = document.getElementById("screen");
    const nameInput = el.querySelector("#perfil-name");
    nameInput.onchange = async ()=>{
      const v = nameInput.value.trim() || state.profile.name;
      nameInput.value = v;
      state.profile.name = v;
      await Store.updateProfile(state.profile.id, { name: v });
      render();
    };
    const metaInput = el.querySelector("#meta-semanal");
    metaInput.onchange = async ()=>{
      const v = Math.max(1, Math.min(7, parseInt(metaInput.value,10)||3));
      metaInput.value = v;
      state.profile.metaSemanal = v;
      await Store.updateProfile(state.profile.id, { metaSemanal: v });
    };
    const edadInput = el.querySelector("#perfil-edad");
    edadInput.onchange = async ()=>{
      const v = edadInput.value ? parseInt(edadInput.value,10) : null;
      state.profile.edad = v;
      await Store.updateProfile(state.profile.id, { edad: v });
    };
    const pesoInput = el.querySelector("#perfil-peso");
    pesoInput.onchange = async ()=>{
      const v = pesoInput.value ? parseFloat(pesoInput.value) : null;
      state.profile.peso = v;
      await Store.updateProfile(state.profile.id, { peso: v });
    };
    el.querySelector("#btn-logout").onclick = async ()=>{
      const ok = await confirmDialog("Cerrar sesión", "¿Cerrar sesión en este dispositivo?", "Cerrar sesión");
      if(!ok) return;
      await Store.signOut();
      // el listener onAuthStateChange limpia el estado y muestra la pantalla de login
    };
    const seg = el.querySelector("#theme-seg");
    seg.querySelectorAll("button").forEach(b=>{
      b.onclick = ()=>{
        applyTheme(b.dataset.theme);
        renderScreen();
      };
    });
  }

  function applyTheme(mode){
    lsSet("fierros:theme", mode);
    if(mode==="system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", mode);
  }

  /* ---------- Boot ---------- */
  async function boot(){
    applyTheme(lsGet("fierros:theme","system"));

    try{
      Store.onAuthStateChange(async (event, session)=>{
        if(event === "PASSWORD_RECOVERY"){
          state.authView = "reset";
          state.booted = true;
          render();
          return;
        }
        state.authSession = session;
        try{
          if(session && session.user){
            if(!state.profile || state.profile.id !== session.user.id){
              state.profile = await Store.ensureProfile(session.user);
              await loadProfileData();
            }
          } else {
            state.profile = null;
            state.authView = "login";
            state.authError = "";
          }
          state.dbError = false;
        }catch(e){
          state.dbError = true;
        }
        state.booted = true;
        render();
      });
    }catch(e){
      state.dbError = true;
      state.booted = true;
      render();
    }

    // register service worker for installability (best-effort)
    if("serviceWorker" in navigator){
      navigator.serviceWorker.register("sw.js").catch(()=>{});
    }
  }

  render(); // initial loading frame
  boot();

  // Hook de solo-lectura para tests automatizados (Playwright) — no se usa en
  // la app real, no afecta el funcionamiento normal.
  window.__appTest = {
    generateAutoRoutine, exerciseEquipment, exercisePrincipalSecondaryGroups,
    exerciseMuscleGroup, muscleGroupPools, subgroupPools, MUSCLE_GROUPS,
    exerciseLegFocus, seriesForAge, restRangeForAge, sessionCountRange,
    EXERCISES_RISKY_50PLUS, dayModality, get state(){ return state; },
    EXERCISES, EXERCISE_VIDEOS, EXERCISE_IMAGES, exerciseVideoFor, exerciseImageFor,
    screenExerciseDetail,
  };

})();
</script>

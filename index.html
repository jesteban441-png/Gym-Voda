  // V28: mismo criterio que exerciseLineChart — un punto por semana (máximo
  // de peso registrado esa semana), no por registro individual, con el
  // período representado indicado debajo.
  function sparklineFor(history){
    const historyAsc = history.slice().sort((a,b)=> a.date<b.date?-1:1);
    const weekly = exerciseWeeklyMax(historyAsc).slice(-10);
    if(weekly.length===0) return `<p class="helptext">Todavía no hay registros de este ejercicio.</p>`;
    const weights = weekly.map(r=> r.peso);
    const best = Math.max(...weights);
    const min = Math.min(...weights);
    const w = 260, h = 40, pad = 6;
    const range = (best-min)||1;
    const pts = weights.map((val,i)=>{
      const x = weights.length===1 ? w/2 : (i/(weights.length-1))*(w-pad*2)+pad;
      const y = h - pad - ((val-min)/range)*(h-pad*2);
      return [x,y];
    });
    const path = pts.map((p,i)=> (i===0?"M":"L")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
    const last = pts[pts.length-1];
    return `
      <div class="spark-row">
        <svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
          <line x1="0" y1="${h-pad}" x2="${w}" y2="${h-pad}" stroke="var(--border)" stroke-width="1"/>
          <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="var(--accent)"/>
        </svg>
        <div class="spark-stats">
          <div class="best num">${best} kg</div>
          <div class="lbl">Máx. semanal</div>
        </div>
      </div>
      <div class="helptext" style="margin-top:4px">Semana del ${esc(fmtDate(weekly[0].weekStart))}${weekly.length>1?` – semana del ${esc(fmtDate(weekly[weekly.length-1].weekStart))}`:""}</div>
    `;
  }

  function showHistoryFailure(result){
    const r=result || Store.historyStatus() || {},code=r.code || r.error?.code || r.error?.message || "SAVE_FAILED";
    showToast(code==="DELETE_WHOLE_SESSION_REQUIRED" || code==="SESSION_RECORD_IMMUTABLE" ? "Este registro pertenece a una sesión V48. Eliminá la sesión completa desde el calendario."
      : code==="USE_V48_ELIMINAR" ? "Esta sesión requiere el borrado completo de V48."
      : "No se confirmó la operación ("+code+"). Conservamos los datos para reintentar.");
  }
  async function resolveHistoryFailure(owner,generation,result){
    if(!["HISTORY_CONFLICT","IDEMPOTENCY_CONFLICT"].includes(result?.code) || !result.operationId)return null;
    const yes=await confirmDialog("El registro cambió", "Se conservará el registro del servidor y se descartarán estos cambios pendientes. ¿Usar el registro guardado?", "Usar registro guardado");
    if(!yes || state.profile?.id!==owner || generation!==authLoadGeneration)return null;
    const accepted=await Store.historyCompat.acceptRemote(owner,result,true);
    if(state.profile?.id!==owner || generation!==authLoadGeneration)return null;
    if(!accepted.ok)showHistoryFailure(accepted);
    return accepted.ok?accepted:null;
  }
  async function refreshHistoryAfterWrite(owner,generation,kind,result){
    if(state.profile?.id!==owner || generation!==authLoadGeneration)return false;
    try {
      const rows=await (kind==="registros"?Store.listRegistros(owner):Store.listEntrenos(owner));
      if(state.profile?.id!==owner || generation!==authLoadGeneration)return false;
      state[kind]=rows;
      await Store.historyCompat.acknowledge(owner,result || Store.historyStatus());
      return state.profile?.id===owner && generation===authLoadGeneration;
    } catch(error){
      if(state.profile?.id===owner && generation===authLoadGeneration)showToast("Operación confirmada. Falta actualizar el historial; reintentá con conexión sin crear otra operación.");
      return false;
    }
  }
  function mountRegistro(){
    const el = document.getElementById("screen");

    // V40: el bloque "Mi peso" vive en esta pantalla pero es independiente —
    // sus handlers no tocan nada del formulario de peso de ejercicios.
    mountPesoCorporal(el);

    const selEx = el.querySelector("#reg-exercise");
    selEx.onchange = ()=>{
      state.exerciseSelForm = selEx.value;
      renderScreen();
    };
    const otherWrap = el.querySelector("#reg-other-wrap");
    if(selEx.value==="__otro__") otherWrap.style.display = "";
    attachAutocomplete(el.querySelector("#reg-other-name"), el.querySelector("#reg-other-name-ac"));

    const formOwner=state.profile.id,formGeneration=authLoadGeneration;
    let formBusy=false,formConfirmed=null,formDirty=false;
    const formId=crypto.randomUUID?.();
    el.addEventListener("input",()=>{formDirty=true;},{once:true});
    if(state.persistence?.clienteV48)Store.historyCompat.draft(formOwner).then(op=>{
      if(!op || op.status==="confirmed" || formDirty || !el.isConnected || state.profile?.id!==formOwner || formGeneration!==authLoadGeneration)return;
      const d=op.request.data;
      if(Array.from(selEx.options).some(o=>o.value===d.exercise))selEx.value=d.exercise;
      else{selEx.value="__otro__";el.querySelector("#reg-other-name").value=d.exercise;otherWrap.style.display="";}
      for(const [key,id] of Object.entries({peso:"reg-peso",date:"reg-date",series:"reg-series",reps:"reg-reps",nota:"reg-nota"}))el.querySelector("#"+id).value=d[key]??"";
    }).catch(()=>{});
    el.querySelector("#btn-save-reg").onclick = async ()=>{
      if(formBusy || state.profile?.id!==formOwner || formGeneration!==authLoadGeneration)return;
      let exercise = selEx.value;
      if(exercise==="__otro__"){
        exercise = el.querySelector("#reg-other-name").value.trim();
      }
      const peso = el.querySelector("#reg-peso").value;
      const date = el.querySelector("#reg-date").value || todayStr();
      const series = el.querySelector("#reg-series").value;
      const reps = el.querySelector("#reg-reps").value;
      const nota = el.querySelector("#reg-nota").value.trim();
      if(!exercise){ el.querySelector(selEx.value==="__otro__"?"#reg-other-name":"#reg-exercise").focus(); return; }
      if(peso===""){ el.querySelector("#reg-peso").focus(); return; }
      const btn = el.querySelector("#btn-save-reg");
      btn.disabled = true;formBusy=true;
      const data = { id:formId, exercise, peso: parseFloat(peso), date, series: series||"", reps: reps||"", nota, createdAt: Date.now() };
      let result;
      const content={...data};delete content.createdAt;
      if(formConfirmed && !VodaFitPersistence.equal(content,formConfirmed.content)){
        btn.disabled=false;formBusy=false;showToast("El registro anterior ya se confirmó. Actualizá el historial antes de crear otro.");return;
      }
      try {result=formConfirmed?.result || await Store.addRegistro(formOwner,data);} catch(error){result={ok:false,error};}
      if(result?.ok)formConfirmed={content,result};
      if(state.profile?.id!==formOwner || formGeneration!==authLoadGeneration)return;
      if(!result?.ok){
        const accepted=await resolveHistoryFailure(formOwner,formGeneration,result);
        if(accepted)result=accepted;
        else{btn.disabled=false;formBusy=false;showHistoryFailure(result);return;}
      }
      if(!await refreshHistoryAfterWrite(formOwner,formGeneration,"registros",result)){btn.disabled=false;formBusy=false;return;}
      state.exerciseSelForm = canonicalExerciseName(exercise);
      renderScreen();
    };

    const histEx = el.querySelector("#hist-filter-ex");
    if(histEx) histEx.onchange = ()=>{ state.historyFilter.exercise = histEx.value; renderScreen(); };
    const histFrom = el.querySelector("#hist-from");
    if(histFrom) histFrom.onchange = ()=>{ state.historyFilter.from = histFrom.value; renderScreen(); };
    const histTo = el.querySelector("#hist-to");
    if(histTo) histTo.onchange = ()=>{ state.historyFilter.to = histTo.value; renderScreen(); };
    const clearFilterBtn = el.querySelector("#btn-clear-filter");
    if(clearFilterBtn) clearFilterBtn.onclick = ()=>{ state.historyFilter = { exercise:"", from:"", to:"" }; renderScreen(); };
    const exportBtn = el.querySelector("#btn-export-csv");
    if(exportBtn) exportBtn.onclick = ()=> exportCSV(filterHistory(state.registros));

    el.querySelectorAll("[data-del-log]").forEach(row=>{
      row.addEventListener("contextmenu", (e)=> e.preventDefault());
      row.style.cursor = "pointer";
      row.title = "Tocá para eliminar este registro";
      row.onclick = async ()=>{
        const id = row.dataset.delLog,owner=state.profile.id,generation=authLoadGeneration;
        const ok = await confirmDialog("Eliminar registro", "¿Eliminar este registro del historial?");
        if(!ok || state.profile?.id!==owner || generation!==authLoadGeneration)return;
        let removed;try{removed=await Store.deleteRegistro(owner,id);}catch(error){removed=false;}
        if(state.profile?.id!==owner || generation!==authLoadGeneration)return;
        if(!removed){showHistoryFailure();return;}
        if(await refreshHistoryAfterWrite(owner,generation,"registros"))renderScreen();
      };
    });
    // Filas-resumen de la vista agrupada por ejercicio (ver screenRegistro) —
    // tocarlas despliega/oculta el historial completo de ESE ejercicio, no
    // borran nada (el borrado sigue siendo solo en las filas de adentro,
    // arriba).
    el.querySelectorAll("[data-hist-group]").forEach(row=>{
      row.style.cursor = "pointer";
      row.title = "Tocá para ver el historial completo";
      row.onclick = ()=>{
        const name = row.dataset.histGroup;
        state.historyExpanded = (state.historyExpanded===name) ? null : name;
        renderScreen();
      };
    });
  }

  /* ================= CRONOMETRO ================= */
  /* ---------- Persistencia de cronómetros en segundo plano ----------
     Antes, el estado de los cronómetros (corriendo, tiempo transcurrido, hora
     de fin) vivía solo en memoria (variables JS) — al cerrar la app, cambiar
     de app o recargar la página, ese estado se perdía y el cronómetro volvía
     a cero aunque el usuario nunca haya apretado "Reiniciar". Ahora ambos
     cronómetros guardan su estado en localStorage en cada cambio, usando
     siempre una marca de tiempo absoluta (Date.now()/endAt/startEpoch, no un
     contador que solo avanza mientras la pestaña está abierta) — así, al
     volver a abrir la app, el tiempo transcurrido real se recalcula contra
     el reloj, sin importar cuánto tiempo estuvo la app cerrada o en segundo
     plano. Solo se reinicia si el usuario aprieta el botón "Reiniciar". */
  const savedRestTimer = lsGet("fierros:restTimer", null);
  const timer = savedRestTimer ? {
    total: savedRestTimer.total,
    remaining: savedRestTimer.remaining,
    running: savedRestTimer.running,
    intervalId: null,
    endAt: savedRestTimer.endAt,
    audioCtx: null,
  } : {
    total: lsGet("fierros:timerDefault", 90),
    remaining: null,
    running: false,
    intervalId: null,
    endAt: null,
    audioCtx: null,
  };
  // Si estaba corriendo y el tiempo restante ya se cumplió mientras la app
  // estuvo cerrada/en segundo plano, se da por terminado sin reproducir el
  // sonido (el usuario no está mirando en ese momento).
  if(timer.running && timer.endAt!=null){
    const rem = Math.max(0, Math.ceil((timer.endAt - Date.now())/1000));
    timer.remaining = rem;
    if(rem<=0){ timer.running = false; timer.endAt = null; }
  }
  function persistTimer(){
    lsSet("fierros:restTimer", { total:timer.total, remaining:timer.remaining, running:timer.running, endAt:timer.endAt });
    lsSet("fierros:timerDefault", timer.total);
  }

  let timerRerender = () => renderScreen();

  function timerBlockHtml(){
    const presets = [30,45,60,90,120,180];
    const remaining = timer.remaining==null ? timer.total : timer.remaining;
    const pct = Math.max(0, Math.min(1, remaining/timer.total));
    const R = 100, C = 2*Math.PI*R;
    const dash = C*pct;
    const mm = Math.floor(remaining/60), ss = Math.floor(remaining%60);
    const label = timer.running ? "Descansando" : (remaining===0 ? "¡Listo!" : "Pausado");
    return `
      <div class="presets" id="presets">
        ${presets.map(p=>`<button class="preset ${!timer.running && timer.total===p?"active":""}" data-preset="${p}">${p<60?p+"s":(p/60)+"m"}</button>`).join("")}
      </div>
      <div class="ring-box">
        <svg viewBox="0 0 220 220">
          <circle class="ring-bg" cx="110" cy="110" r="${R}"/>
          <circle class="ring-fg ${remaining===0?"done":""}" cx="110" cy="110" r="${R}"
            stroke-dasharray="${C}" stroke-dashoffset="${C-dash}"/>
        </svg>
        <div class="ring-label">
          <div class="time num" id="time-label">${String(mm).padStart(2,"0")}:${String(ss).padStart(2,"0")}</div>
          <div class="state">${label}</div>
        </div>
      </div>
      <div class="timer-controls">
        <button class="btn btn-ghost" id="btn-reset">${icon("reset")}<span>Reiniciar</span></button>
        <button class="btn btn-primary" id="btn-toggle">${timer.running?icon("pause"):icon("play")}<span>${timer.running?"Pausa":"Iniciar"}</span></button>
      </div>
      <div class="field" style="width:100%">
        <label>Tiempo personalizado (segundos)</label>
        <input type="number" id="custom-secs" min="5" max="900" value="${timer.total}">
      </div>
    `;
  }

  function wireTimerControls(root){
    root.querySelectorAll("[data-preset]").forEach(b=>{
      b.onclick = ()=>{
        const v = parseInt(b.dataset.preset,10);
        timer.total = v; timer.remaining = v; timer.running=false; clearInterval(timer.intervalId); timer.endAt=null;
        persistTimer();
        timerRerender();
      };
    });
    root.querySelector("#btn-toggle").onclick = ()=>{
      if(timer.running) pauseTimer(); else startTimer();
    };
    root.querySelector("#btn-reset").onclick = resetTimer;
    const custom = root.querySelector("#custom-secs");
    custom.onchange = ()=>{
      const v = Math.max(5, Math.min(900, parseInt(custom.value,10)||90));
      timer.total = v; timer.remaining = v; timer.running=false; clearInterval(timer.intervalId); timer.endAt=null;
      persistTimer();
      timerRerender();
    };
  }

  function openRestModal(){
    const m = openModal(`
      <h3>Descanso</h3>
      <div class="timer-wrap timer-modal-body">${timerBlockHtml()}</div>
      <button class="btn btn-ghost btn-block" data-act="close">Cerrar (sigue corriendo)</button>
    `);
    timerRerender = ()=>{
      if(!document.body.contains(m)){ timerRerender = renderScreen; return; }
      const body = m.querySelector(".timer-modal-body");
      body.innerHTML = timerBlockHtml();
      wireTimerControls(body);
    };
    wireTimerControls(m.querySelector(".timer-modal-body"));
    m.querySelector('[data-act="close"]').onclick = ()=>{ closeModal(); timerRerender = renderScreen; };
  }

  /* ---------- Cronómetro de tiempo total de entrenamiento (cuenta hacia arriba) ---------- */
  const savedWorkoutClock = lsGet("fierros:workoutClock", null);
  const workoutClock = savedWorkoutClock ? {
    running: savedWorkoutClock.running, elapsedMs: savedWorkoutClock.elapsedMs,
    startEpoch: savedWorkoutClock.startEpoch, intervalId: null,
    // V37: vueltas. Cada entrada es el TOTAL transcurrido desde el inicio en el
    // momento de marcarla, en ms. Se guarda el total y no el parcial porque el
    // total es el dato que el cronómetro ya sabe calcular (currentWorkoutElapsed);
    // el parcial se deriva restando la vuelta anterior, nunca al revés.
    // Defensivo: localStorage de antes de V37 no tiene la clave.
    laps: Array.isArray(savedWorkoutClock.laps) ? savedWorkoutClock.laps.filter(n=> typeof n==="number" && isFinite(n) && n>0) : [],
  } : { running:false, elapsedMs:0, startEpoch:null, intervalId:null, laps:[] };
  function persistWorkoutClock(){
    // V37: `laps` se suma al mismo blob que ya se guardaba. Es lo mínimo para
    // que recargar la app no pierda las vueltas de un entrenamiento en curso,
    // igual que ya pasaba con el tiempo transcurrido.
    lsSet("fierros:workoutClock", { running:workoutClock.running, elapsedMs:workoutClock.elapsedMs, startEpoch:workoutClock.startEpoch, laps:workoutClock.laps });
  }

  /* ---------- V37: vueltas del cronómetro de entrenamiento ----------
     Capa aditiva: marcar una vuelta NO inicia, NO pausa y NO reinicia el
     cronómetro. Lo único que hace es anotar cuánto tiempo va. */

  // Marca una vuelta con el total transcurrido actual. Devuelve el total
  // anotado, o null si no se creó ninguna.
  // Con el cronómetro en cero no se crea vuelta (no hay nada que marcar).
  function addWorkoutLap(){
    const total = currentWorkoutElapsed();
    if(!(total > 0)) return null;
    workoutClock.laps.push(total);
    persistWorkoutClock();
    return total;
  }

  function clearWorkoutLaps(){
    workoutClock.laps = [];
    persistWorkoutClock();
  }

  // Vueltas listas para mostrar. Orden: la MÁS RECIENTE primero (criterio único
  // en toda la pantalla, como el cronómetro del teléfono). `numero` mantiene el
  // orden cronológico de marcado, así la vuelta 1 siempre es la primera que se
  // marcó aunque se muestre última.
  // `parcial` es el tiempo desde la vuelta anterior; en la primera, el total.
  function workoutLapRows(){
    const laps = workoutClock.laps || [];
    return laps.map((total, i)=> ({
      numero: i+1,
      total,
      parcial: total - (i>0 ? laps[i-1] : 0),
    })).reverse();
  }
  let workoutClockRerender = () => renderScreen();

  function fmtElapsed(ms){
    const total = Math.floor(ms/1000);
    const hh = Math.floor(total/3600), mm = Math.floor((total%3600)/60), ss = total%60;
    const mmss = `${String(mm).padStart(2,"0")}:${String(ss).padStart(2,"0")}`;
    return hh>0 ? `${String(hh).padStart(2,"0")}:${mmss}` : mmss;
  }

  function currentWorkoutElapsed(){
    return workoutClock.elapsedMs + (workoutClock.running ? (Date.now()-workoutClock.startEpoch) : 0);
  }

  function workoutClockHtml(){
    return `
      <div class="card" style="display:flex; flex-direction:column; align-items:center; gap:10px; padding:16px 14px">
        <div class="helptext" style="text-transform:uppercase; letter-spacing:.04em; font-weight:700">Tiempo de entrenamiento</div>
        <div class="num" id="workout-time-label" style="font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:38px">${fmtElapsed(currentWorkoutElapsed())}</div>
        <div class="row" style="gap:10px">
          <button class="btn btn-ghost btn-sm" id="btn-workout-reset">${icon("reset")} Reiniciar</button>
          <button class="btn btn-primary btn-sm" id="btn-workout-toggle">${workoutClock.running? icon("pause")+" Pausar" : icon("play")+" Iniciar entrenamiento"}</button>
        </div>
        ${workoutLapsBlockHtml()}
      </div>
    `;
  }

  // V37: bloque de vueltas, dentro de la misma tarjeta del cronómetro.
  // El botón queda deshabilitado con el cronómetro en cero: así la regla "en
  // cero no se crea vuelta" se ve, en vez de que el botón no haga nada.
  function workoutLapsBlockHtml(){
    const rows = workoutLapRows();
    const enCero = !(currentWorkoutElapsed() > 0);
    return `
      <div style="width:100%; border-top:1px solid var(--border); padding-top:10px; margin-top:2px; display:flex; flex-direction:column; gap:8px">
        <div class="row between">
          <button class="btn btn-outline btn-sm" id="btn-workout-lap" ${enCero?"disabled":""}>${icon("plus")} Vuelta</button>
          ${rows.length ? `<a class="linklike" id="btn-workout-laps-clear" style="font-size:13px">Limpiar vueltas</a>` : `<span class="helptext">${enCero?"Iniciá el cronómetro para marcar vueltas":"Sin vueltas"}</span>`}
        </div>
        ${rows.length ? `
          <div class="loglist">
            ${rows.map(r=>`
              <div class="logrow">
                <div><div class="lex">Vuelta ${r.numero}</div><div class="ldate">+${esc(fmtElapsed(r.parcial))}</div></div>
                <div><div class="lval num">${esc(fmtElapsed(r.total))}</div></div>
              </div>
            `).join("")}
          </div>
          <div class="helptext" style="text-align:center">${rows.length} vuelta${rows.length===1?"":"s"} · la más reciente arriba</div>
        ` : ""}
      </div>
    `;
  }

  function tickWorkoutClock(){
    const label = document.getElementById("workout-time-label");
    if(label) label.textContent = fmtElapsed(currentWorkoutElapsed());
  }

  function wireWorkoutClock(root){
    root.querySelector("#btn-workout-toggle").onclick = ()=>{
      if(workoutClock.running){
        workoutClock.elapsedMs = currentWorkoutElapsed();
        workoutClock.running = false;
        workoutClock.startEpoch = null;
        clearInterval(workoutClock.intervalId);
      } else {
        workoutClock.running = true;
        workoutClock.startEpoch = Date.now();
        clearInterval(workoutClock.intervalId);
        workoutClock.intervalId = setInterval(tickWorkoutClock, 1000);
      }
      persistWorkoutClock();
      workoutClockRerender();
    };
    root.querySelector("#btn-workout-reset").onclick = ()=>{
      clearInterval(workoutClock.intervalId);
      workoutClock.running = false;
      workoutClock.elapsedMs = 0;
      workoutClock.startEpoch = null;
      workoutClock.laps = []; // V37: reiniciar el cronómetro reinicia las vueltas
      persistWorkoutClock();
      workoutClockRerender();
    };
    // V37: marcar vuelta. No toca running, elapsedMs, startEpoch ni el
    // intervalId — el cronómetro sigue corriendo exactamente igual.
    const lapBtn = root.querySelector("#btn-workout-lap");
    if(lapBtn) lapBtn.onclick = ()=>{
      if(addWorkoutLap() != null) workoutClockRerender();
    };
    const lapsClearBtn = root.querySelector("#btn-workout-laps-clear");
    if(lapsClearBtn) lapsClearBtn.onclick = ()=>{
      clearWorkoutLaps();
      workoutClockRerender();
    };
  }

  function screenCronometro(){
    return `
      <div class="section-title"><h2>Cronómetro</h2></div>
      ${workoutClockHtml()}
      <div class="section-title" style="margin-top:6px"><h2>Descanso entre series</h2></div>
      <div class="card timer-wrap">${timerBlockHtml()}</div>
      <p class="helptext" style="text-align:center">Cuando termine el descanso vas a escuchar un sonido y (si tu celular lo permite) vibrar.</p>
    `;
  }

  function playBeep(){
    try{
      if(!timer.audioCtx) timer.audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      const ctx = timer.audioCtx;
      if(ctx.state==="suspended") ctx.resume();
      [0,0.18,0.36].forEach((t,i)=>{
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = "sine";
        o.frequency.value = i===2? 1046.5 : 880;
        g.gain.setValueAtTime(0.0001, ctx.currentTime+t);
        g.gain.exponentialRampToValueAtTime(0.28, ctx.currentTime+t+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+t+0.16);
        o.connect(g); g.connect(ctx.destination);
        o.start(ctx.currentTime+t);
        o.stop(ctx.currentTime+t+0.18);
      });
    }catch(e){}
    if(navigator.vibrate) navigator.vibrate([200,100,200,100,200]);
  }

  function tick(){
    if(timer.endAt==null) return;
    const remainingMs = timer.endAt - Date.now();
    const remaining = Math.max(0, Math.ceil(remainingMs/1000));
    timer.remaining = remaining;
    const timeLabel = document.getElementById("time-label");
    const ring = document.querySelector(".ring-fg");
    if(timeLabel){
      const mm=Math.floor(remaining/60), ss=Math.floor(remaining%60);
      timeLabel.textContent = `${String(mm).padStart(2,"0")}:${String(ss).padStart(2,"0")}`;
    }
    if(ring){
      const R=100, C=2*Math.PI*R;
      const pct = Math.max(0, Math.min(1, remaining/timer.total));
      ring.setAttribute("stroke-dashoffset", C-(C*pct));
    }
    if(remaining<=0){
      stopTimer(true);
      timerRerender();
    }
  }

  function startTimer(){
    if(timer.remaining==null) timer.remaining = timer.total;
    if(timer.remaining<=0) timer.remaining = timer.total;
    timer.endAt = Date.now() + timer.remaining*1000;
    timer.running = true;
    clearInterval(timer.intervalId);
    timer.intervalId = setInterval(tick, 250);
    persistTimer();
    timerRerender();
  }
  function pauseTimer(){
    timer.running = false;
    clearInterval(timer.intervalId);
    persistTimer();
    timerRerender();
  }
  function stopTimer(finished){
    timer.running = false;
    clearInterval(timer.intervalId);
    timer.endAt = null;
    if(finished){ timer.remaining = 0; playBeep(); }
    persistTimer();
  }
  function resetTimer(){
    stopTimer(false);
    timer.remaining = timer.total;
    persistTimer();
    timerRerender();
  }

  function mountCronometro(){
    timerRerender = renderScreen;
    workoutClockRerender = renderScreen;
    wireTimerControls(document.getElementById("screen"));
    wireWorkoutClock(document.getElementById("screen"));
    // Si algún cronómetro quedó corriendo de una sesión anterior (recargó la
    // página, volvió después de cerrar la app, etc.), retoma el intervalo
    // visual acá — el número ya está bien calculado (ver tick()/
    // currentWorkoutElapsed(), ambos contra Date.now()), esto solo hace que
    // se siga viendo actualizado en pantalla mientras esta pestaña esté abierta.
    if(timer.running && !timer.intervalId){
      clearInterval(timer.intervalId);
      timer.intervalId = setInterval(tick, 250);
    }
    if(workoutClock.running && !workoutClock.intervalId){
      clearInterval(workoutClock.intervalId);
      workoutClock.intervalId = setInterval(tickWorkoutClock, 1000);
    }
  }

  // Al volver a la pestaña/app (se desbloquea el celular, se vuelve de otra
  // app), refresca el número al toque en vez de esperar al próximo tick —
  // los navegadores frenan los setInterval mientras la pestaña está oculta.
  document.addEventListener("visibilitychange", ()=>{
    if(document.visibilityState==="visible"){
      if(timer.running) tick();
      if(workoutClock.running) tickWorkoutClock();
    }
  });

  /* ---------- V34: diagnóstico de identidad de ejercicios ----------
     Pantalla de LECTURA PURA dentro de Perfil. No escribe, no borra, no agrega
     aliases y no toca la base. Su único objetivo es mostrar qué nombres reales
     hay guardados en los datos del usuario y cuáles no llegan a un canónico,
     para poder decidir A MANO las equivalencias genuinas que falten. */

  // Todos los nombres CRUDOS que aparecen en las rutinas guardadas: los tres
  // slots (personalizada / automatica / enfocada) más el día embebido de una
  // sesión de Día Especial en curso, que no vive en rutinaSlots.
  function rutinaExerciseNamesRaw(){
    const out = [];
    const pushDays = (days)=> (days||[]).forEach(d=> (d.exercises||[]).forEach(ex=> ex && ex.nombre && out.push(ex.nombre)));
    RUTINA_SLOTS.forEach(s=> pushDays((state.rutinaSlots && state.rutinaSlots[s] && state.rutinaSlots[s].days) || []));
    if(state.session && state.session.specialDay) pushDays([state.session.specialDay]);
    return out;
  }

  // Versión en texto plano del diagnóstico, para pegarla en el chat/repo.
  function exerciseDiagnosticsText(diag){
    const L = [];
    L.push("VodaFit — diagnóstico de identidad de ejercicios");
    L.push(`Nombres distintos en historial: ${diag.registros.total}`);
    L.push(`Nombres distintos en rutinas: ${diag.rutinas.total}`);
    const sec = (titulo, items, fmt)=>{
      L.push("");
      L.push(`${titulo} (${items.length})`);
      if(!items.length) L.push("  (ninguno)");
      else items.forEach(it=> L.push("  " + fmt(it)));
    };
    sec("HISTORIAL SIN RESOLVER", diag.registros.unresolved, it=> `${it.nombre}  [${it.count}]`);
    sec("RUTINAS SIN RESOLVER", diag.rutinas.unresolved, it=> `${it.nombre}  [${it.count}]`);
    sec("HISTORIAL RESUELTO POR NORMALIZACION", diag.registros.normalized, it=> `${it.nombre} -> ${it.canonico}  [${it.count}]`);
    sec("RUTINAS RESUELTAS POR NORMALIZACION", diag.rutinas.normalized, it=> `${it.nombre} -> ${it.canonico}  [${it.count}]`);
    sec("AMBIGUAS", diag.ambiguas, it=> `${it.nombre}  (clave: ${it.key})  [${it.count}]`);
    return L.join("\n");
  }
  /* ================= V43: MAPA MUSCULAR =================
     Mide actividad muscular REGISTRADA por sector anatómico, en una ventana
     móvil de 7 / 30 / 90 días.

     Fuente única: `registros`. `entrenos` NO se usa para reconstruir qué
     ejercicios se hicieron — no guarda la lista, y los caminos por day_id,
     day_nombre, rutinas.data o sesionActiva se descartaron en la auditoría
     previa porque no son fiables (los ids de día se regeneran y day_nombre es
     texto libre). Consecuencia asumida y dicha en pantalla: el mapa muestra lo
     que el usuario REGISTRÓ, no todo lo que entrenó.

     Capa propia sobre MUSCLE_MAP. No lo modifica, y no toca REGION_SUBGROUP ni
     LEG_FOCUS_TO_SUBGROUP10: el mapa trabaja con las 26 REGIONES anatómicas
     directamente, sin volver a agruparlas en los 10/11 subgrupos. Pecho
     superior, medio e inferior son tres sectores independientes con su propio
     puntaje y su propio color. */

  const MAPA_PERIODS = [
    { key:"7d",  label:"7 días",  dias:7  },
    { key:"30d", label:"30 días", dias:30 },
    { key:"90d", label:"90 días", dias:90 },
  ];

  // Las 26 regiones anatómicas, en el orden en que se listan abajo del mapa.
  // Sale de REGION_VIEW (tabla derivada que ya existía), así que no hay una
  // segunda lista de regiones que mantener sincronizada.
  const MAPA_REGIONS = Object.keys(REGION_VIEW);

  // Escala visual: 5 puntos/semana es el tope del color. El valor interno NO se
  // trunca; solo la representación.
  const MAPA_VISUAL_MAX = 5;
  // Tinte mínimo con el que se dibuja un sector que TIENE actividad. Hace
  // falta porque 0,25 puntos/semana son 5% de mezcla con el acento, que es
  // indistinguible del músculo apagado: el resumen diría "Músculos
  // entrenados: 9" con nueve sectores que se ven en gris.
  //
  // NO es un piso sobre el valor. Un piso (max(0,12, v/5)) achataba todo lo
  // que estuviera por debajo de 0,6 puntos a un mismo color, y eso rompía la
  // escala conceptual: 0,25 y 0,5 se veían igual. Lo que se hace en cambio es
  // mapear el rango con una recta: el valor normalizado 0..1 se lleva a
  // MAPA_TINTE_MIN..1. Así la escala sigue siendo CONTINUA y ESTRICTAMENTE
  // CRECIENTE — cada valor distinto tiene un color distinto — y 0 sigue
  // siendo 0 (regionFillCss(0) devuelve var(--muscle-off)).
  const MAPA_TINTE_MIN = 0.12;

  // Color de un sector a partir de sus puntos/semana. Es la única fórmula
  // de color del mapa: la usan las siluetas, la barra de escala y los puntos
  // de la lista, así que las tres no pueden discrepar.
  function mapaIntensidad(puntosSemana){
    if(!(puntosSemana > 0)) return 0;
    const t = Math.min(puntosSemana, MAPA_VISUAL_MAX) / MAPA_VISUAL_MAX;
    return MAPA_TINTE_MIN + (1 - MAPA_TINTE_MIN) * t;
  }

  // Escalera de puntos por sector y por día, según cuántos ejercicios DISTINTOS
  // de ese día involucran al sector. Índice 0 = primer ejercicio.
  const MAPA_PUNTOS_PRINCIPAL = [1, 0.5, 0.25];
  const MAPA_PUNTOS_SECUNDARIO = [0.5, 0.25, 0.25];
  // Valor del slot `indice` DENTRO DE SU PROPIO ROL. Del tercer ejercicio en
  // adelante el valor se mantiene (0,25 es el mínimo).
  function mapaPuntos(rol, indiceEnElDia){
    const tabla = rol==="principal" ? MAPA_PUNTOS_PRINCIPAL : MAPA_PUNTOS_SECUNDARIO;
    return tabla[Math.min(indiceEnElDia, tabla.length-1)];
  }

  // Total de un rol en un día, a partir de CU[A]NTOS ejercicios de ese rol
  // tocaron el sector. Es la suma de la escalera del rol, y por lo tanto una
  // función pura de un número: no hay orden del que pueda depender.
  //
  // Cada rol lleva SU PROPIA escalera y los dos totales se suman. Esto es lo
  // que elimina la dependencia del orden en el caso mixto: antes la escalera
  // era una sola secuencia compartida, y entonces un principal y un
  // secundario daban 1,25 o 1,00 según cuál ocupara el primer slot. Había
  // que inventar una regla de desempate. Ahora el sector recibe "un estímulo
  // principal (1,00) más un estímulo secundario (0,50)" = 1,50, sin que
  // exista ningún orden en el cálculo.
  //
  // Los cinco ejemplos de la especificación quedan IGUALES, porque todos son
  // homogéneos: 1 principal = 1; 1 secundario = 0,5; 2 principales = 1,5;
  // 4 principales = 2; 6 secundarios = 1,75.
  function mapaPuntosDeRol(rol, cantidad){
    let total = 0;
    for(let i=0;i<cantidad;i++) total += mapaPuntos(rol, i);
    return total;
  }

  // Peso de las series según el rol del sector en ese ejercicio.
  const MAPA_SERIES_PESO = { principal: 1, secundaria: 0.5 };

  // Fecha válida = formato YYYY-MM-DD **y** fecha real del calendario.
  // El chequeo del formato solo no alcanza: "2026-13-45" pasa el patrón y,
  // comparada como string, resulta mayor que hoy, así que se contaba como
  // "futura" en vez de "inválida". La especificación pide descartar los
  // registros sin fecha válida, y el mes 13 no es una fecha.
  function esFechaValida(s){
    if(typeof s !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
    const [y, m, d] = s.split("-").map(Number);
    if(m < 1 || m > 12 || d < 1) return false;
    // Se reconstruye la fecha y se comprueba que no haya desbordado de mes
    // (por ejemplo 31 de febrero, que Date corre al 2 o 3 de marzo).
    const dt = new Date(y, m-1, d);
    return dt.getFullYear() === y && dt.getMonth() === m-1 && dt.getDate() === d;
  }

  // Cuántas series representa UNA fila de `registros`.
  //
  // Hay dos formas de cargar y la fila tiene forma distinta en cada una:
  //   * registro por-serie desde dentro de una sesión -> una fila POR serie,
  //     con set_number. Esa fila es exactamente 1 serie.
  //   * formulario clásico de Registro -> una fila por ejercicio, con el campo
  //     `series` indicando cuántas fueron ("3").
  // Sin esta distinción, cinco filas por-serie con series:"1" darían 5 y una
  // sola fila con series:"5" daría 5 también, pero cinco filas por-serie con
  // series:"5" (que no pasa) darían 25. Se resuelve mirando set_number.
  // Si el campo viene vacío o no es un número, la fila vale 1: es un esfuerzo
  // registrado, no cero.
  function mapaSeriesDeFila(r){
    if(r && r.setNumber != null) return 1;
    const n = parseInt((r && r.series) || "", 10);
    return (isFinite(n) && n > 0) ? n : 1;
  }

  // Rol de cada región dentro de UN ejercicio: la de intensidad máxima es
  // principal, el resto secundarias. La intensidad NO multiplica el puntaje;
  // solo decide el rol.
  //
  // Empates en el máximo: hoy no existe ninguno (auditado sobre los 100
  // ejercicios mapeados). Si apareciera uno, TODAS las regiones empatadas en el
  // máximo quedan como principal. Es determinista, estable y no requiere tocar
  // los datos de MUSCLE_MAP.
  function mapaRolesDeEjercicio(nombreCanonico){
    const info = MUSCLE_MAP[nombreCanonico];
    if(!info || !info.t || !info.t.length) return null;
    let max = -Infinity;
    info.t.forEach(([, i])=>{ if(i > max) max = i; });
    return info.t.map(([region, i])=> ({ region, rol: i === max ? "principal" : "secundaria" }));
  }

  function mapaFechaMenosDias(ymdStr, dias){
    const p = String(ymdStr||"").split("-").map(n=>parseInt(n,10));
    if(p.length!==3 || p.some(isNaN)) return ymdStr;
    const d = new Date(p[0], p[1]-1, p[2]);
    d.setDate(d.getDate() - dias);
    return ymd(d);
  }

  // Desempate aleatorio entre candidatos ya empatados. Aislado en una función
  // para poder inyectar un azar fijo en los tests.
  function mapaPickAleatorio(lista, rnd){
    const r = typeof rnd === "function" ? rnd : Math.random;
    return lista[Math.floor(r() * lista.length) % lista.length];
  }

  // Elige el ejercicio "popular" de un conjunto: más DÍAS distintos, luego más
  // series, luego azar entre los empatados. La cantidad de filas no participa.
  function mapaEjercicioPopular(mapaPorEjercicio, rnd){
    const items = Object.keys(mapaPorEjercicio).map(n=> mapaPorEjercicio[n]);
    if(!items.length) return null;
    let mejores = [items[0]];
    for(let i=1;i<items.length;i++){
      const c = items[i], m = mejores[0];
      if(c.dias > m.dias || (c.dias === m.dias && c.series > m.series)) mejores = [c];
      else if(c.dias === m.dias && c.series === m.series) mejores.push(c);
    }
    return mejores.length === 1 ? mejores[0] : mapaPickAleatorio(mejores, rnd);
  }

  /* ---------- MOTOR DE CÁLCULO ----------
     Puro: sin DOM, sin `state`, sin Supabase, sin efectos. Un solo motor
     parametrizado por `dias` — no hay una versión por período.
     `rnd` es opcional y solo se usa para los desempates que la especificación
     define como aleatorios; con él, la función es totalmente determinista. */
  function muscleMapStats(registros, hoy, dias, rnd){
    const hasta = esFechaValida(hoy) ? hoy : todayStr();
    const nDias = (isFinite(dias) && dias > 0) ? Math.floor(dias) : 30;
    const desde = mapaFechaMenosDias(hasta, nDias - 1);
    const semanas = nDias / 7;

    const ignorados = { sinFecha:0, futuros:0, fueraDeVentana:0, sinMapa:0 };

    // Paso 1 — deduplicar por (fecha + ejercicio canónico). Las filas de series
    // del mismo ejercicio en el mismo día son UNA aparición para los puntos,
    // pero sus series se suman para la frecuencia.
    const porDia = new Map(); // fecha -> Map(canon -> {series, pesos:[]})
    let registrosEnVentana = 0;

    (registros||[]).forEach(r=>{
      if(!r || !esFechaValida(r.date)){ ignorados.sinFecha++; return; }
      if(r.date > hasta){ ignorados.futuros++; return; }
      if(r.date < desde){ ignorados.fueraDeVentana++; return; }
      const canon = canonicalExerciseName(r.exercise);
      if(!canon || !MUSCLE_MAP[canon]){ ignorados.sinMapa++; return; }
      registrosEnVentana++;
      if(!porDia.has(r.date)) porDia.set(r.date, new Map());
      const delDia = porDia.get(r.date);
      if(!delDia.has(canon)) delDia.set(canon, { nombre:canon, series:0, pesos:[] });
      const e = delDia.get(canon);
      e.series += mapaSeriesDeFila(r);
      const p = parseFloat(r.peso);
      if(isFinite(p) && p > 0) e.pesos.push(p);
    });

    // Acumuladores por región.
    const acc = {};
    MAPA_REGIONS.forEach(region=>{
      acc[region] = { region, puntos:0, seriesPonderadas:0, dias:new Set(), ejercicios:{} };
    });
    // Acumulador global de ejercicios (para el "más popular" del resumen).
    const globalEj = {};
    const diasConActividad = new Set();

    // Paso 2 — por día, repartir puntos por sector.
    porDia.forEach((delDia, fecha)=>{
      const ejercicios = Array.from(delDia.values());
      if(!ejercicios.length) return;
      diasConActividad.add(fecha);

      // Qué sectores toca cada ejercicio y con qué rol.
      const conRoles = ejercicios.map(e=>({ ...e, roles: mapaRolesDeEjercicio(e.nombre) || [] }));

      // Por sector, la lista de ejercicios del día que lo involucran.
      const porRegion = {};
      conRoles.forEach(e=>{
        e.roles.forEach(({region, rol})=>{
          if(!acc[region]) return; // región del arte que no esté en REGION_VIEW
          (porRegion[region] = porRegion[region]||[]).push({ nombre:e.nombre, rol, series:e.series, pesos:e.pesos });
        });
      });

      Object.keys(porRegion).forEach(region=>{
        const lista = porRegion[region];
        // Los puntos del día salen de CONTAR cuántos ejercicios de cada rol
        // tocaron el sector, no de recorrer una lista. El orden de los
        // registros no entra en el cálculo en ningún momento: no hace falta
        // ordenar nada ni elegir qué rol va primero (ver mapaPuntosDeRol).
        const A = acc[region];
        A.dias.add(fecha);
        let nPrincipal = 0, nSecundaria = 0;
        lista.forEach(e=>{ if(e.rol === "principal") nPrincipal++; else nSecundaria++; });
        A.puntos += mapaPuntosDeRol("principal", nPrincipal) + mapaPuntosDeRol("secundaria", nSecundaria);

        lista.forEach(e=>{
          A.seriesPonderadas += e.series * MAPA_SERIES_PESO[e.rol];
          const ej = A.ejercicios[e.nombre] || (A.ejercicios[e.nombre] = { nombre:e.nombre, dias:0, series:0, pesos:[], rol:e.rol });
          ej.dias += 1;
          ej.series += e.series;
          e.pesos.forEach(p=> ej.pesos.push(p));
          // El rol se guarda del último visto; es el mismo siempre para un
          // ejercicio dado, porque sale de MUSCLE_MAP y no del día.
          ej.rol = e.rol;
        });
      });

      // Acumulado global por ejercicio: días distintos y series.
      ejercicios.forEach(e=>{
        const g = globalEj[e.nombre] || (globalEj[e.nombre] = { nombre:e.nombre, dias:0, series:0 });
        g.dias += 1;
        g.series += e.series;
      });
    });

    // Paso 3 — derivar por región.
    const regiones = {};
    MAPA_REGIONS.forEach(region=>{
      const A = acc[region];
      const puntosSemana = A.puntos / semanas;
      const popular = mapaEjercicioPopular(A.ejercicios, rnd);
      // Peso récord: SOLO dentro del ejercicio popular y SOLO del período.
      let pesoRecord = null;
      if(popular && popular.pesos && popular.pesos.length) pesoRecord = Math.max(...popular.pesos);
      regiones[region] = {
        region,
        label: MUSCLE_LABELS[region] || region,
        vista: REGION_VIEW[region] || null,
        puntos: A.puntos,
        puntosSemana,
        // El valor interno NO se trunca; `visual` es solo para el color.
        visual: Math.min(puntosSemana, MAPA_VISUAL_MAX),
        intensidad: mapaIntensidad(puntosSemana),
        seriesPonderadas: A.seriesPonderadas,
        seriesSemana: A.seriesPonderadas / semanas,
        dias: A.dias.size,
        ejercicios: Object.keys(A.ejercicios).map(n=>{
          const e = A.ejercicios[n];
          return { nombre:e.nombre, dias:e.dias, series:e.series, rol:e.rol,
                   maxPeso: e.pesos.length ? Math.max(...e.pesos) : null };
        }).sort((a,b)=> b.dias - a.dias || b.series - a.series || (a.nombre < b.nombre ? -1 : 1)),
        popular: popular ? { nombre:popular.nombre, dias:popular.dias, series:popular.series } : null,
        pesoRecord,
      };
    });

    // Paso 4 — resumen general.
    const activas = MAPA_REGIONS.filter(r=> regiones[r].puntos > 0);

    // Sector más trabajado: mayor puntuación semanal; empate -> mayor puntaje
    // real sin redondear (es el mismo número, así que no agrega nada y se pasa
    // al siguiente criterio) -> mayor frecuencia ponderada de series -> azar.
    let sectorTop = null;
    if(activas.length){
      let mejores = [regiones[activas[0]]];
      for(let i=1;i<activas.length;i++){
        const c = regiones[activas[i]], m = mejores[0];
        if(c.puntosSemana > m.puntosSemana) mejores = [c];
        else if(c.puntosSemana === m.puntosSemana){
          if(c.seriesSemana > m.seriesSemana) mejores = [c];
          else if(c.seriesSemana === m.seriesSemana) mejores.push(c);
        }
      }
      sectorTop = mejores.length === 1 ? mejores[0] : mapaPickAleatorio(mejores, rnd);
    }

    return {
      dias: nDias, desde, hasta, semanas,
      regiones,
      resumen: {
        // Cuenta SECTORES anatómicos individuales con cualquier actividad
        // (0,25 puntos ya cuenta). No se reagrupa por pecho/espalda/piernas.
        musculosEntrenados: activas.length,
        // DEFINICIÓN, para que quede documentada y sea consistente: días
        // distintos del período con al menos un ejercicio mapeado registrado,
        // divididos por las semanas del período. No es una métrica fisiológica
        // ni pretende serlo: es "cuántos días por semana registraste trabajo
        // muscular".
        frecuenciaDiasSemana: diasConActividad.size / semanas,
        diasConActividad: diasConActividad.size,
        sectorTop: sectorTop ? { region:sectorTop.region, label:sectorTop.label, puntosSemana:sectorTop.puntosSemana } : null,
        ejercicioPopular: mapaEjercicioPopular(globalEj, rnd),
      },
      sinDatos: registrosEnVentana === 0,
      registrosEnVentana,
      ignorados,
    };
  }

  // Los puntos son NODOS de una curva cerrada, no vertices de un poligono: el
  // borde sigue el relieve del musculo. Tension baja (0.22) a proposito: una
  // curva mas suelta se abomba y vuelve a pisar al musculo vecino.
  // Las dos vistas se dibujan en un lienzo COMUN. Sin esto cada <svg> recibe el
  // mismo ancho en CSS pero con viewBox distinto (330 vs 297), asi que la
  // figura posterior se renderiza 11,1% mas grande que la frontal (285 px de
  // alto contra 258, medido). Con un lienzo unico las dos comparten escala, y
  // cada recorte se centra dentro con un desplazamiento, sin estirar nada.
  const MAPA_LIENZO = { w:330, h:608 };
  // ---- V47.1: como se expresa la intensidad sobre la lamina ----
  //
  // El calculo NO cambia: la intensidad sigue saliendo de mapaIntensidad, que
  // sigue siendo la unica formula. Lo que cambia es como se dibuja.
  //
  // El problema que resuelve: hasta V47 el relleno era SIEMPRE var(--accent) y
  // lo unico que variaba era la opacidad (0,40 a 0,90). Pero mix-blend-mode:
  // color toma el TONO y la SATURACION del relleno y la LUMINOSIDAD de la
  // lamina, asi que todas las intensidades pintaban el mismo tono con la misma
  // saturacion, y la opacidad solo interpola hacia ese color — una curva que
  // satura rapido. Medido en CIE Lab sobre un gris de lamina: la distancia de
  // color entre dos valores vecinos de la escala era 2,7, debajo del umbral de
  // ~2,3 en que dos colores se consideran indistinguibles, y el recorrido
  // completo de 0,5 a 5+ puntos/semana era de 25. Todo el mapa se veia del
  // mismo salmon.
  //
  // La solucion tiene dos partes:
  //
  //   1. El relleno deja de ser un color fijo. El tono gira de naranja
  //      amarillento (40 grados) a rojo anaranjado (14) y la saturacion sube de
  //      55% a 96%, asi que la separacion ya no depende de la opacidad.
  //   2. Encima, una capa de profundidad en multiply que SOLO entra arriba de
  //      1,9 puntos/semana. Los valores altos quedan mas oscuros, que es la
  //      diferencia perceptual mas fuerte disponible: la luminosidad.
  //
  // Resultado medido con el mismo metodo: 4,0 entre vecinos y 62,4 de recorrido
  // total, 2,5 veces el anterior.
  //
  // La escala es CONTINUA: no hay cinco escalones, cada valor distinto da un
  // color distinto. Intensidad 0 no pinta nada y el musculo queda en el gris
  // neutro de la lamina.
  //
  // Los colores son LITERALES, no var(--accent): la tarjeta del mapa es siempre
  // blanca, tambien en tema oscuro, asi que el tinte tiene que ser el mismo en
  // los dos temas. Antes seguia a --accent y el mapa cambiaba de color con el
  // tema sobre una tarjeta que no cambiaba.
  const MAPA_TONO_MIN = 40, MAPA_TONO_MAX = 14;     // grados HSL
  const MAPA_SAT_MIN = 55, MAPA_SAT_MAX = 96;       // %
  const MAPA_OPAC_MIN = 0.25, MAPA_OPAC_MAX = 1.00;
  const MAPA_PROF_DESDE = 0.38;                     // fraccion de la escala
  const MAPA_PROF_COLOR = "#A24418", MAPA_PROF_MAX = 0.33;

  // La intensidad vuelve a la fraccion 0..1 de la escala. mapaIntensidad mapea
  // esa fraccion a MAPA_TINTE_MIN..1 con una recta, asi que se despeja exacto.
  function mapaFraccion(intensidad){
    return intensidad > 0 ? (intensidad - MAPA_TINTE_MIN) / (1 - MAPA_TINTE_MIN) : 0;
  }

  // Las capas que pinta un sector, de abajo hacia arriba. Lista vacia = sin
  // actividad: no se dibuja nada y queda el gris de la lamina.
  function mapaTinteCapas(intensidad){
    if(!(intensidad > 0)) return [];
    const t = Math.max(0, Math.min(1, mapaFraccion(intensidad)));
    const h = MAPA_TONO_MIN + (MAPA_TONO_MAX - MAPA_TONO_MIN) * t;
    const sat = MAPA_SAT_MIN + (MAPA_SAT_MAX - MAPA_SAT_MIN) * t;
    // La luz del HSL no se percibe bajo mix-blend-mode:color (la toma de la
    // lamina). Se deja en 50% para que el fallback multiply del @supports no
    // quede ni negro ni lavado.
    const capas = [{
      fill: "hsl(" + h.toFixed(1) + " " + sat.toFixed(1) + "% 50%)",
      op: MAPA_OPAC_MIN + (MAPA_OPAC_MAX - MAPA_OPAC_MIN) * t
    }];
    const p = Math.max(0, (t - MAPA_PROF_DESDE) / (1 - MAPA_PROF_DESDE));
    if(p > 0) capas.push({ fill: MAPA_PROF_COLOR, op: MAPA_PROF_MAX * p, prof: true });
    return capas;
  }

  // Color PLANO equivalente, para los chips que NO van sobre la lamina: la
  // barra de escala y los puntos de la lista. Compone las mismas capas sobre
  // blanco, asi que la barra es una muestra real de la escala y no un degrade
  // dibujado aparte que podria desincronizarse.
  //
  // No se reusa regionFillCss a proposito: esa funcion la comparte la ficha de
  // ejercicio, que no cambia en V47.1.
  function mapaHslARgb(h, s, l){
    const k = n => (n + h/30) % 12, a = s * Math.min(l, 1 - l);
    const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
    return [f(0), f(8), f(4)];
  }
  function mapaTinteCss(intensidad){
    const capas = mapaTinteCapas(intensidad);
    if(!capas.length) return "var(--muscle-off)";
    let c = [1, 1, 1];
    capas.forEach(capa=>{
      let f;
      if(capa.fill[0] === "#"){
        f = [1,3,5].map(i=> parseInt(capa.fill.substr(i,2),16)/255);
        f = c.map((x,i)=> x * f[i]);          // multiply
      } else {
        const m = capa.fill.match(/hsl\(([\d.]+) ([\d.]+)% ([\d.]+)%\)/);
        f = mapaHslARgb(+m[1], +m[2]/100, +m[3]/100);
      }
      c = c.map((x,i)=> x + (f[i] - x) * capa.op);
    });
    return "#" + c.map(x=> Math.round(Math.max(0, Math.min(1, x))*255).toString(16).padStart(2,"0")).join("");
  }
  function mapaDesplazamiento(v){
    return { dx:(MAPA_LIENZO.w - v.w)/2, dy:(MAPA_LIENZO.h - v.h)/2 };
  }

  const MAPA_CURVA_TENSION = 0.22;
  function mapaAnatomiaPath(pts){
    const n = pts.length;
    if(n < 3) return "M" + pts.map(p=>p[0]+","+p[1]).join("L") + "Z";
    let d = "M" + pts[0][0].toFixed(1) + "," + pts[0][1].toFixed(1);
    for(let i=0;i<n;i++){
      const p0=pts[(i-1+n)%n], p1=pts[i], p2=pts[(i+1)%n], p3=pts[(i+2)%n];
      const c1=[p1[0]+(p2[0]-p0[0])*MAPA_CURVA_TENSION, p1[1]+(p2[1]-p0[1])*MAPA_CURVA_TENSION];
      const c2=[p2[0]-(p3[0]-p1[0])*MAPA_CURVA_TENSION, p2[1]-(p3[1]-p1[1])*MAPA_CURVA_TENSION];
      d += "C"+c1[0].toFixed(1)+","+c1[1].toFixed(1)+" "+c2[0].toFixed(1)+","+c2[1].toFixed(1)+" "+p2[0].toFixed(1)+","+p2[1].toFixed(1);
    }
    return d + "Z";
  }
  // Clave de datos -> region DIBUJADA (el triceps agrupa tres).
  function mapaRegionDibujada(clave){
    const g = MAPA_ANATOMIA.grupos;
    for(const d in g){ if(g[d].indexOf(clave) !== -1) return d; }
    return clave;
  }
  // Intensidad que PINTA una region dibujada: el MAXIMO de sus claves. No se
  // promedia ni se suma; el detalle por cabeza se lee en la lista de abajo.
  function mapaIntensidadDeRegion(region, mapa){
    const ks = MAPA_ANATOMIA.grupos[region] || [region];
    return ks.reduce((m,k)=> Math.max(m, mapa[k]||0), 0);
  }
  // El sufijo "2" es el lado derecho de la MISMA region (misma clave de datos).
  function mapaRegionBase(k){ return k.replace(/2$/, ""); }
  // Region DIBUJADA -> clave de DATOS que hay que seleccionar. Para una region
  // agrupada (el triceps) se elige la cabeza mas trabajada, que es la misma que
  // define el color: lo que se ve pintado y lo que se abre al tocar coinciden.
  // Sin esto el triceps no era clicable: mountMuscleMap filtra por MAPA_REGIONS
  // y "triceps" no es una clave de datos.
  function mapaClaveDeRegionDibujada(region, stats){
    const ks = MAPA_ANATOMIA.grupos[region];
    if(!ks) return MAPA_REGIONS.indexOf(region) !== -1 ? region : null;
    const st = stats || mapaStatsActuales();
    let mejor = ks[0];
    ks.forEach(k=>{
      if((st.regiones[k].puntosSemana||0) > (st.regiones[mejor].puntosSemana||0)) mejor = k;
    });
    return mejor;
  }
  // Estadisticas del periodo elegido. Unica fuente: muscleMapStats, sin copia.
  function mapaStatsActuales(){
    const periodKey = MAPA_PERIODS.some(p=>p.key===state.mapaPeriodo) ? state.mapaPeriodo : "30d";
    const per = MAPA_PERIODS.find(p=>p.key===periodKey);
    return muscleMapStats(state.registros||[], todayStr(), per.dias);
  }
  const MAPA_TOQUE_MIN = 30;   // lado corto minimo del area de toque
  const MAPA_TOQUE_MAX = 2.2;  // tope de ampliacion
  const MAPA_NUCLEO = 0.45;    // nucleo garantizado, centrado
  function mapaEscalarPts(pts, k){
    let cx=0, cy=0;
    pts.forEach(p=>{ cx+=p[0]; cy+=p[1]; });
    cx/=pts.length; cy/=pts.length;
    return pts.map(p=> [cx+(p[0]-cx)*k, cy+(p[1]-cy)*k]);
  }
  // Area del poligono (formula del cordon de zapato). Solo para ordenar.
  function mapaAreaPts(pts){
    let a = 0;
    for(let i=0;i<pts.length;i++){ const j=(i+1)%pts.length; a += pts[i][0]*pts[j][1] - pts[j][0]*pts[i][1]; }
    return Math.abs(a)/2;
  }
  function mapaLadoCorto(pts){
    const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
    return Math.min(Math.max.apply(null,xs)-Math.min.apply(null,xs), Math.max.apply(null,ys)-Math.min.apply(null,ys));
  }

  // Una vista. Capas, en orden:
  //   1. <image>       la lamina, recortada por el viewBox
  //   2. .mapa-zona    el tinte (pointer-events:none)
  //   3. .mapa-cobertura  la cobertura genital (solo la vista frontal)
  //   4. .mapa-hit     areas de toque ampliadas + nucleos, invisibles
  // Las de toque van ultimas para recibir el clic; dentro de esa capa, las mas
  // chicas al final, para ganarle a una region grande que las contenga.
  function mapaVistaSvg(viewKey, mapa){
    const v = MAPA_ANATOMIA.vistas[viewKey];
    if(!v) return "";
    const items = Object.keys(v.regiones).map(k=>({ k:k, pts:v.regiones[k] }));
    // V47.1. Se pinta de la region mas GRANDE a la mas chica. Antes se pintaba
    // en el orden del objeto y una region grande repintaba a su vecina chica,
    // que es justo la que necesita cada pixel: el deltoides lateral perdia 23,6%
    // bajo el triceps y los trapecios 14,6% bajo el pectoral superior. La capa
    // de toque ya usaba este criterio; ahora el dibujo lo acompaña.
    const porArea = items.slice().sort((a,b)=> mapaAreaPts(b.pts) - mapaAreaPts(a.pts));
    const zonas = porArea.map(it=>{
      const region = mapaRegionBase(it.k);
      const d = mapaAnatomiaPath(it.pts);
      const capas = mapaTinteCapas(mapaIntensidadDeRegion(region, mapa));
      // Un sector sin actividad igual emite su path, con opacidad 0. Podria
      // omitirse, pero entonces el DOM cambiaria segun los datos y tanto los
      // tests como cualquier consumidor tendrian que distinguir "no entrenado"
      // de "no existe". Un path invisible no cuesta nada.
      if(!capas.length) return '<path class="mapa-zona" data-region="' + esc(region) + '" d="' + d + '" fill="' + MAPA_PROF_COLOR + '" fill-opacity="0.000"/>';
      return capas.map(c=>
        '<path class="' + (c.prof ? "mapa-prof" : "mapa-zona") + '" data-region="' + esc(region) +
        '" d="' + d + '" fill="' + c.fill + '" fill-opacity="' + c.op.toFixed(3) + '"/>'
      ).join("");
    }).join("");
    const cobPts = (MAPA_ANATOMIA.cobertura || {})[viewKey] || [];
    const short = cobPts.length
      ? '<path class="mapa-cobertura" d="' + mapaAnatomiaPath(cobPts) + '" fill="#2E2B28" filter="url(#mapaCoberturaBorde)"/>'
      : "";
    const hits = items.slice().sort((a,b)=> mapaLadoCorto(b.pts)-mapaLadoCorto(a.pts)).map(it=>{
      const k = Math.min(MAPA_TOQUE_MAX, Math.max(1, MAPA_TOQUE_MIN/Math.max(1, mapaLadoCorto(it.pts))));
      return '<path class="mapa-hit" data-region="' + esc(mapaRegionBase(it.k)) + '" d="' + mapaAnatomiaPath(mapaEscalarPts(it.pts,k)) + '"/>';
    }).join("");
    // Nucleo: ultima capa. Garantiza que el centro de un musculo lo seleccione a
    // el aunque el area ampliada de un vecino lo tape.
    const nucleos = items.map(it=>
      '<path class="mapa-hit" data-region="' + esc(mapaRegionBase(it.k)) + '" d="' + mapaAnatomiaPath(mapaEscalarPts(it.pts, MAPA_NUCLEO)) + '"/>'
    ).join("");
    const off = mapaDesplazamiento(v);
    return '' +
      '<div class="mapa-fig">' +
        '<svg viewBox="0 0 ' + MAPA_LIENZO.w + ' ' + MAPA_LIENZO.h + '" data-view="' + esc(viewKey) + '" role="img" aria-label="Vista ' + esc(v.label.toLowerCase()) + '">' +
          '<g transform="translate(' + off.dx.toFixed(1) + ',' + off.dy.toFixed(1) + ')">' +
            '<image href="' + esc(v.src) + '" x="' + (-v.ox) + '" y="' + (-v.oy) + '" width="960" height="640"/>' +
            '<g>' + zonas + '</g>' +
            short +
            '<g>' + hits + nucleos + '</g>' +
          '</g>' +
        '</svg>' +
        '<div class="mapa-cap">' + esc(v.label) + '</div>' +
      '</div>';
  }
  function mapaAnatomiaHtml(targets){
    const mapa = {};
    (targets||[]).forEach(t=>{ mapa[t.region] = t.intensity; });
    // Un solo filtro: desenfoque chico para que el borde de la cobertura no se
    // lea como un recorte. El centro queda solido igual.
    const grad = '<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>' +
      '<filter id="mapaCoberturaBorde" x="-30%" y="-30%" width="160%" height="160%">' +
      '<feGaussianBlur stdDeviation="1.3"/></filter>' +
      '</defs></svg>';
    return '<div class="mapa-anat">' + grad + ANAT_VIEWS.map(v=> mapaVistaSvg(v, mapa)).join("") + '</div>';
  }

  function muscleMapBodyHtml(stats){
    // Mismo contrato de siempre: [{region,intensity}], una entrada por cada una
    // de las 26 regiones, sin agrupar por grupo muscular. Lo UNICO que cambio en
    // V47 es quien dibuja: antes bodyDiagramSvg (silueta propia), ahora
    // mapaAnatomiaHtml (las laminas anatomicas reales). muscleMapStats, la
    // clasificacion y la escala de color siguen intactas, y bodyDiagramSvg
    // sigue sirviendo a la ficha de ejercicio sin cambios.
    const targets = MAPA_REGIONS.map(r=> ({ region:r, intensity: stats.regiones[r].intensidad }));
    return mapaAnatomiaHtml(targets);
  }

  function muscleMapScaleHtml(){
    // Escala continua. Sin semáforo y sin etiquetas de juicio.
    // Misma fórmula que las siluetas (mapaIntensidad + mapaTinteCapas), así que
    // la barra es una muestra real de la escala y no una aproximación dibujada
    // aparte. V47.1: pasa a mapaTinteCss, que compone las MISMAS dos capas
    // sobre blanco; si la rampa cambia, la barra la sigue sola.
    const pasos = [0,1,2,3,4,5];
    return `
      <div class="mapa-escala">
        <div class="mapa-escala-barra" aria-hidden="true">
          ${pasos.map(p=>`<span style="background:${mapaTinteCss(mapaIntensidad(p))}"></span>`).join("")}
        </div>
        <div class="mapa-escala-lbl"><span>0</span><span>puntos / semana</span><span>5+</span></div>
      </div>
    `;
  }

  function muscleMapResumenHtml(stats){

    return `

        <div class="statline">
          <span class="helptext" style="font-size:13px; color:var(--text)">Músculos entrenados</span>
          <span class="num">${r.musculosEntrenados}<small style="font-size:12px; color:var(--text-muted)"> / ${MAPA_REGIONS.length}</small></span>
        </div>
        <div class="statline">
          <span class="helptext" style="font-size:13px; color:var(--text)">Frecuencia promedio</span>
          <span class="num">${fmtMapaNum(r.frecuenciaDiasSemana)}<small style="font-size:12px; color:var(--text-muted)"> días/sem</small></span>
        </div>
        <div class="statline">
          <span class="helptext" style="font-size:13px; color:var(--text)">Sector más trabajado</span>
          <span style="font-weight:600; font-size:13px; text-align:right">${r.sectorTop ? esc(r.sectorTop.label) : "-"}</span>
        </div>
        <div class="statline">
          <span class="helptext" style="font-size:13px; color:var(--text)">Ejercicio más popular</span>
          <span style="font-weight:600; font-size:13px; text-align:right">${r.ejercicioPopular ? esc(r.ejercicioPopular.nombre) : "-"}</span>
        </div>
      </div>
    `;
  }

  function muscleMapRegionDetailHtml(stats, region){
    const d = stats.regiones[region];
    if(!d) return "";
    return `
      <div class="card stack" id="mapa-detalle">
        <div class="row between">
          <h3 style="font-size:16px; text-transform:none; letter-spacing:0; font-family:'Work Sans'">${esc(d.label)}</h3>
          <span class="iconbtn" id="btn-mapa-cerrar-detalle" title="Volver al resumen">${icon("back")}</span>
        </div>
        <div class="pesostats">
          <div class="pesostat">
            <div class="num pesostat-val">${fmtMapaNum(d.puntosSemana)}</div>
            <div class="helptext">puntos / semana</div>
          </div>
          <div class="pesostat">
            <div class="num pesostat-val">${fmtMapaNum(d.seriesSemana)}</div>
            <div class="helptext">series / semana</div>
          </div>
          <div class="pesostat">
            <div class="num pesostat-val">${d.dias}</div>
            <div class="helptext">día${d.dias===1?"":"s"} del período</div>
          </div>
        </div>
        ${d.popular ? `
          <div class="statline">
            <span class="helptext" style="font-size:13px; color:var(--text)">Ejercicio más popular</span>
            <span style="font-weight:600; font-size:13px; text-align:right">${esc(d.popular.nombre)}</span>
          </div>
          <div class="statline">
            <span class="helptext" style="font-size:13px; color:var(--text)">Peso récord</span>
            <span class="num">${d.pesoRecord != null ? esc(fmtPesoKg(d.pesoRecord)) + " kg" : `<span style="font-size:13px; font-family:'Work Sans'; color:var(--text-muted)">Sin datos</span>`}</span>
          </div>
          <p class="helptext">El récord es el máximo de <b>${esc(d.popular.nombre)}</b> dentro de estos ${stats.dias} días, no el histórico.</p>
        ` : `<p class="helptext">Sin actividad registrada en este sector durante el período.</p>`}
      </div>
    `;
  }

  function muscleMapListHtml(stats){
    const activas = MAPA_REGIONS.map(r=> stats.regiones[r]).filter(d=> d.puntos > 0)
      .sort((a,b)=> b.puntosSemana - a.puntosSemana || (a.label < b.label ? -1 : 1));
    const inactivas = MAPA_REGIONS.map(r=> stats.regiones[r]).filter(d=> d.puntos === 0);
    const fila = (d)=> `
      <div class="logrow mapa-fila" data-mapa-region="${esc(d.region)}">
        <div class="row" style="gap:8px; min-width:0">
          <i class="mapa-dot" style="background:${mapaTinteCss(d.intensidad)}"></i>
          <div style="min-width:0">
            <div class="lex">${esc(d.label)}</div>
            <div class="ldate">${d.dias} día${d.dias===1?"":"s"}${d.puntos>0?` · ${fmtMapaNum(d.seriesSemana)} series/sem`:""}</div>
          </div>
        </div>
        <div class="lval num">${fmtMapaNum(d.puntosSemana)}</div>
      </div>`;
    return `
      <div class="section-title"><h2>Sectores</h2><span class="muted">puntos / semana</span></div>
      <div class="loglist">
        ${activas.map(fila).join("")}
        ${inactivas.length ? `<p class="helptext" style="margin-top:4px">Sin actividad registrada: ${inactivas.map(d=>esc(d.label)).join(" · ")}</p>` : ""}
      </div>
    `;
  }

  function muscleMapHtml(stats, periodKey, regionSel, contexto){
    const per = MAPA_PERIODS.find(p=>p.key===periodKey) || MAPA_PERIODS[1];
    return `
      <div class="segmented" style="margin-bottom:2px">
        ${MAPA_PERIODS.map(p=>`<button data-mapa-period="${p.key}" class="${p.key===periodKey?"active":""}">${esc(p.label)}</button>`).join("")}
      </div>
      <p class="helptext" style="text-align:center">${esc(fmtDate(stats.desde))} al ${esc(fmtDate(stats.hasta))}</p>

      <div class="card">
        <div class="mapa-body">${muscleMapBodyHtml(stats)}</div>
        ${muscleMapScaleHtml()}
        <p class="helptext" style="text-align:center; margin-top:8px">Tocá un sector para ver su detalle.</p>
      </div>

      ${regionSel ? muscleMapRegionDetailHtml(stats, regionSel) : muscleMapResumenHtml(stats)}

      ${stats.sinDatos ? `
        <div class="card">
          <div class="empty">
            ${icon("log")}
            <h3>Sin actividad registrada</h3>
            <p>El mapa se arma con los pesos que cargás en Registro. En estos ${stats.dias} días todavía no hay registros.</p>
          </div>
        </div>
      ` : muscleMapListHtml(stats)}

      <p class="helptext">${esc(contexto||"")}</p>
    `;
  }

  // Texto que explica qué NO está en el mapa. Es la pieza que evita que el
  // usuario lea "sector apagado" como "no lo entrené": si finalizó
  // entrenamientos sin cargar pesos, esos no pueden aparecer.
  function muscleMapContextoTexto(stats){
    const ents = (state.entrenos||[]).filter(e=> e.date >= stats.desde && e.date <= stats.hasta);
    const diasConRegistro = stats.resumen.diasConActividad;
    const diasConEntreno = new Set(ents.map(e=>e.date)).size;
    const sinRegistro = Math.max(0, diasConEntreno - diasConRegistro);
    let t = "El mapa se arma con los ejercicios que registrás en Registro.";
    if(sinRegistro > 0){
      t += ` En este período tuviste ${sinRegistro} día${sinRegistro===1?"":"s"} con entrenamiento registrado pero sin pesos cargados, que no figuran acá.`;
    }
    if(stats.ignorados.sinMapa > 0){
      t += ` ${stats.ignorados.sinMapa} registro${stats.ignorados.sinMapa===1?"":"s"} del período no tiene${stats.ignorados.sinMapa===1?"":"n"} músculo asignado (cardio o ejercicios propios) y no pinta${stats.ignorados.sinMapa===1?"":"n"} ninguna región.`;
    }
    return t;
  }

  // Wrapper: es el ÚNICO punto que lee `state` y llama al motor.
  function screenMuscleMap(){
    const periodKey = MAPA_PERIODS.some(p=>p.key===state.mapaPeriodo) ? state.mapaPeriodo : "30d";
    const stats = mapaStatsActuales();
    const regionSel = (state.mapaRegion && stats.regiones[state.mapaRegion]) ? state.mapaRegion : null;
    return muscleMapHtml(stats, periodKey, regionSel, muscleMapContextoTexto(stats));
  }

  function renderMuscleMap(){
    app.classList.remove("app-wide");
    app.innerHTML = `
      <div class="topbar">
        <span class="iconbtn" id="btn-mapa-back">${icon("back")}</span>
        <h1 style="font-size:18px; flex:1; text-align:center">Mapa muscular</h1>
        <span style="width:30px"></span>
      </div>
      <main><div class="screen" id="screen"></div></main>
    `;
    document.getElementById("btn-mapa-back").onclick = ()=>{
      if(state.mapaRegion){ state.mapaRegion = null; renderMuscleMap(); return; }
      state.tab = "perfil";
      state.perfilScrollPending = true;
      render();
    };
    document.getElementById("screen").innerHTML = screenMuscleMap();
    mountMuscleMap();
  }

  // `volver` es quien repinta despues de un clic. Por defecto la pantalla propia
  // del mapa; desde Perfil se pasa el re-render de Perfil, para que el mapa
  // embebido no salte a otra pantalla. Los handlers son los MISMOS en los dos
  // casos: no hay una segunda copia del mapa.
  function mountMuscleMap(volver){
    const el = document.getElementById("screen");
    if(!el) return;
    const repintar = typeof volver === "function" ? volver : renderMuscleMap;

    el.querySelectorAll("[data-mapa-period]").forEach(btn=>{
      btn.onclick = ()=>{ state.mapaPeriodo = btn.dataset.mapaPeriod; repintar(); };
    });

    el.querySelectorAll("[data-mapa-region]").forEach(row=>{
      row.style.cursor = "pointer";
      row.onclick = ()=>{ state.mapaRegion = row.dataset.mapaRegion; repintar(); };
    });

    const cerrar = el.querySelector("#btn-mapa-cerrar-detalle");
    if(cerrar) cerrar.onclick = ()=>{ state.mapaRegion = null; repintar(); };

    // Clicks sobre el dibujo. V47: lo que se toca es una region DIBUJADA, que
    // puede agrupar varias claves de datos (el triceps agrupa tres), asi que se
    // traduce antes de guardar la seleccion. `base` y `head` ya no existen en el
    // mapa (son parte de la lamina), pero el filtro queda por si vuelve a
    // dibujarse una silueta.
    el.querySelectorAll(".mapa-body [data-region]").forEach(node=>{
      const dibujada = node.getAttribute("data-region");
      if(dibujada === "base" || dibujada === "head") return;
      const region = mapaClaveDeRegionDibujada(dibujada);
      if(!region) return;
      node.style.cursor = "pointer";
      node.setAttribute("tabindex", "0");
      node.setAttribute("role", "button");
      node.setAttribute("aria-label", MUSCLE_LABELS[region] || region);
      const elegir = ()=>{ state.mapaRegion = mapaClaveDeRegionDibujada(dibujada); repintar(); };
      node.onclick = elegir;
      node.onkeydown = (e)=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); elegir(); } };
    });
  }

  /* ================= V42: PERFIL COMO DASHBOARD =================
     Perfil es LECTURA de progreso. Todo lo de acá lee `state` y no hace una
     sola consulta nueva: las cuatro fuentes (profile, entrenos, registros,
     pesoCorporal) ya vienen cargadas por loadProfileData en una sola tanda.

     Tampoco recalcula nada por su cuenta: el peso sale de las funciones de
     V40 (pesoResumen / pesoCorporalEnPeriodo / pesoLineChart), la semana de
     computeRacha + rachaCardHtml, y el origen de calendarOriginFor. Si alguna
     de esas reglas cambia, cambia en un solo lugar.

     Lo que NO muestra, a propósito: récord personal histórico, totales de por
     vida, volumen, tiempo entrenado, fuerza relativa y mapa muscular. No es
     que falte UI — es que los datos actuales no permiten calcularlos bien
     (ver la auditoría de Fase 2.2). */

  // Fecha del primer dato REAL del usuario, mirando las tres fuentes con
  // fecha. NO usa profile.createdAt: eso es cuándo se creó la cuenta, no
  // desde cuándo entrena, y mostrarlo como "entrenando desde" sería inventar
  // una fecha. Si no hay ningún dato todavía, devuelve null y la UI lo dice.
  function primerDatoFecha(){
    let oldest = null;
    const ver = (d)=>{ if(d && (!oldest || d < oldest)) oldest = d; };
    (state.entrenos||[]).forEach(e=> ver(e.date));
    (state.registros||[]).forEach(r=> ver(r.date));
    (state.pesoCorporal||[]).forEach(p=> ver(p.fecha));
    return oldest;
  }

  // Ejercicios distintos registrados, contados por identidad CANÓNICA: dos
  // nombres históricos que hoy resuelven al mismo ejercicio cuentan uno, no
  // dos. Es la misma regla que usa el historial agrupado de Registro.
  function ejerciciosDistintosCount(){
    const set = new Set();
    (state.registros||[]).forEach(r=>{
      const c = canonicalExerciseName(r.exercise);
      if(c) set.add(c);

  // que es la misma función que pinta el calendario, así los dos lugares no
  // pueden discrepar. El orden es fijo (el de la leyenda del calendario) y
  // los orígenes sin entrenamientos no aparecen.
  const PERFIL_ORIGIN_ORDER = ["personalizada","automatica","enfocada","especial","manual","unknown"];
  function entrenosPorOrigen(){
    const ents = state.entrenos||[];
    const counts = {};
    ents.forEach(e=>{ const o = calendarOriginFor(e); counts[o] = (counts[o]||0)+1; });
    const total = ents.length;
    return {
      total,
      rows: PERFIL_ORIGIN_ORDER.filter(o=> counts[o]).map(o=>({
        origin: o,
        count: counts[o],
        pct: total ? Math.round(100*counts[o]/total) : 0,
      })),
    };
  }

  function mountPerfil(){
    const el = document.getElementById("screen");

    // --- V42: dashboard (solo lectura) ---
    // Navegación semanal con estado propio de Perfil.
    mountWeekNav(el, "perfil");

    // Período del gráfico de peso. Clave propia: no toca el de Registro.
    el.querySelectorAll("[data-perfil-peso-period]").forEach(btn=>{
      btn.onclick = ()=>{ state.perfilPesoPeriod = btn.dataset.perfilPesoPeriod; renderScreen(); };
    });

    // El peso se GESTIONA en Registro; acá solo se manda para allá.
    const irPeso = el.querySelector("#btn-perfil-ir-peso");
    if(irPeso) irPeso.onclick = ()=> setTab("registro");

    // V47.1: el mapa vive dentro de Perfil. Se enganchan sus MISMOS handlers
    // (mountMuscleMap), pero repintando Perfil en vez de saltar a la pantalla
    // propia del mapa. Se conserva el scroll para que tocar un período o un
    // músculo no devuelva al usuario al principio de la página.
    if(el.querySelector(".perfil-mapa")){
      mountMuscleMap(()=>{
        const y = window.scrollY;
        renderScreen();
        window.scrollTo(0, y);
      });
    }

    // V46: Estiramientos. Misma mecánica que el Mapa muscular, incluido el
    // guardado del scroll para volver al mismo lugar de Perfil.
    const irEstir = el.querySelector("#btn-perfil-estiramientos");
    if(irEstir) irEstir.onclick = ()=>{
      state.perfilScrollY = window.scrollY;
      abrirEstiramientos({ from:"perfil" });
    };

    // Perfil es largo: al volver se recupera la posición donde estaba. Solo la
    // primera vez que se entra (perfilScrollPending), para no pelearle el
    // scroll al usuario en cada re-render de la misma pantalla.
    if(state.perfilScrollPending){
      state.perfilScrollPending = false;
      const target = state.perfilScrollY || 0;
      if(target > 0){
        let tries = 0;
        const step = ()=>{
          tries++;
          const max = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
          const clamped = Math.min(target, max);
          if(Math.abs(window.scrollY - clamped) > 1) window.scrollTo(0, clamped);
          if(clamped < target && tries < 12) nextFrame(step);
        };
        nextFrame(step);
      }
    }

    // --- Configuración (sin cambios de comportamiento) ---
    const nameInput = el.querySelector("#perfil-name");
    nameInput.onchange = async ()=>{
      const v = nameInput.value.trim() || state.profile.name;
      nameInput.value = v;
      state.profile.name = v;
      await Store.updateProfile(state.profile.id, { name: v });
      render();
    };
    const metaInput = el.querySelector("#meta-semanal");
    metaInput.onchange = async ()=>{
      const v = Math.max(1, Math.min(7, parseInt(metaInput.value,10)||3));
      metaInput.value = v;
      state.profile.metaSemanal = v;
      await Store.updateProfile(state.profile.id, { metaSemanal: v });
    };
    const edadInput = el.querySelector("#perfil-edad");
    edadInput.onchange = async ()=>{
      const v = edadInput.value ? parseInt(edadInput.value,10) : null;
      state.profile.edad = v;
      await Store.updateProfile(state.profile.id, { edad: v });
    };
    const diagBtn = el.querySelector("#btn-ex-diagnostics");
    if(diagBtn) diagBtn.onclick = ()=> openExerciseDiagnosticsModal();
    el.querySelector("#btn-logout").onclick = async ()=>{
      const ok = await confirmDialog("Cerrar sesión", "¿Cerrar sesión en este dispositivo?", "Cerrar sesión");
      if(!ok) return;
      await Store.signOut();
      // el listener onAuthStateChange limpia el estado y muestra la pantalla de login
    };
    const seg = el.querySelector("#theme-seg");
    seg.querySelectorAll("button").forEach(b=>{
      b.onclick = ()=>{
        applyTheme(b.dataset.theme);
        renderScreen();
      };
    });
  }

  async function handleAuthStateChange(event,session){
    if(event==="PASSWORD_RECOVERY"){
      ++authLoadGeneration;clearAccountData();state.authSession=session;
      state.authView="reset";state.booted=true;render();return;
    }
    state.authSession=session;
    const user=session && session.user;
    if(user && state.profile && state.profile.id===user.id) return;
    const generation=++authLoadGeneration;
    clearAccountData();
    state.booted=false; render();
    try {
      if(user){
        let profile;
        try {profile=await Store.ensureProfile(user);} catch(error){
          if(!networkUnavailable(error)) throw error;
          const local=await rutinaCache.get(user.id);
          if(!local || !VodaFitSession.isNative(local.draft.sesionActiva)) throw error;
          // Sólo restaura el entrenamiento del usuario autenticado; no inventa un perfil remoto.
          profile={id:user.id,name:user.user_metadata?.name || "Usuario",metaSemanal:3};
        }
        if(generation!==authLoadGeneration) return;
        state.profile=profile;
        await loadProfileData();
      } else {state.authView="login";state.authError="";}
      if(generation!==authLoadGeneration) return;
      state.dbError=false;
    } catch(error){
      if(generation!==authLoadGeneration) return;
      state.dbError=true;
    }
    state.booted=true;render();
  }

      if((state.session || state.unresolvedSession) && !closed)return 'workout';
      if(timer.running || workoutClock.running)return 'timer';
      if(nativeTerminalRefresh || state.persistence?.conflict || rutinaSync.getContext()?.blocked ||

      if(saveFailure===authLoadGeneration)return 'unpersisted';

        if(!worker)return resolve(null);
        const channel=new MessageChannel(),timeout=setTimeout(()=>{channel.port1.close();resolve(null);},2000);
        channel.port1.onmessage=event=>{clearTimeout(timeout);channel.port1.close();resolve(event.data?.build?event.data.release+':'+event.data.build:null);};
        try{worker.postMessage({type:'VF_VERSION'},[channel.port2]);}catch(error){clearTimeout(timeout);resolve(null);}
      });
    }
    async function apply(){
      if(checking || refreshing || lock || !registration)return;
      checking=true;
      try {
        if(registration.waiting){
          const waiting=registration.waiting;
          pending=await version(waiting);
          if(pending && await safe() && registration.waiting===waiting)waiting.postMessage({type:'VF_TRY_UPDATE'});
          return;
        }
        const release=await version(navigator.serviceWorker.controller);
        if(!release || release===APP_RELEASE+':'+APP_BUILD){pending=null;return;}
        pending=release;
        if(!await safe())return;
        // Navigation is served from the active worker's verified shell, including offline.
        // Guard is scoped to this tab and target version, not shared across tabs.
        const key='vodafit:last-update:'+location.pathname;
        try{if(sessionStorage.getItem(key)===release)return;sessionStorage.setItem(key,release);}catch(error){return;}
        refreshing=true;location.reload();
      }finally{checking=false;}
    }
    async function check(){
      if(!registration)return;
      // update() only checks/downloads; it cannot interrupt the workout.
      if(navigator.onLine!==false)try{await registration.update();}catch(error){}
      await apply();
    }
    function start(){
      if(!('serviceWorker' in navigator))return;
      navigator.serviceWorker.addEventListener('message',async event=>{
        const data=event.data,port=event.ports[0];

        if(!data || event.source!==registration?.waiting)return;
        if(data.type==='VF_ABORT'){if(lock?.token===data.token)unlock();return;}
        if(!port || !['VF_PROBE','VF_PREPARE','VF_COMMIT'].includes(data.type))return;
        let ok=false;
        if(data.type==='VF_PROBE')ok=!lock && await safe();
        else if(data.type==='VF_PREPARE'){
          if(!lock && await safe()){freeze(data.token,data.release);pending=data.release;ok=true;}
        }else ok=lock?.token===data.token && await safe();
        port.postMessage({token:data.token,ok});port.close();
      });
      navigator.serviceWorker.addEventListener('controllerchange',()=>{unlock();apply();});
      navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
        registration=reg;
        reg.addEventListener('updatefound',()=>{

        });

      }).catch(()=>{});
      document.addEventListener('visibilitychange',()=>{if(!document.hidden)check();});
      window.addEventListener('online',check);
      window.addEventListener('pageshow',()=>{unlock();check();});
      // Reevaluate completed operations/closed dialogs even if no visibility event occurs.
      setInterval(()=>{if(!document.hidden)apply();},3000);
      setInterval(()=>{if(!document.hidden)check();},60000);
    }
    return {start,track,check,status:()=>({release:APP_RELEASE,build:APP_BUILD,pending,busy,blocked:reason(),locked:!!lock})};

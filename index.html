<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Fierros</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fierros">
<meta name="theme-color" content="#171412">
<meta name="description" content="Rutina, registro de pesos y cronómetro para el gimnasio">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F1F0EC;
    --surface:#FFFFFF;
    --surface-2:#E8E6E0;
    --text:#1B1917;
    --text-muted:#6B6560;
    --border:#DBD8D1;
    --accent:#C84A22;
    --accent-strong:#B8431D;
    --accent-on:#FFFFFF;
    --accent-soft:#FBE3D8;
    --secondary:#2A5FD9;
    --secondary-soft:#DCE6FB;
    --success:#2E9E5B;
    --success-soft:#DCF3E6;
    --danger:#C13B3B;
    --danger-soft:#FBE0DF;
    --shadow: 0 1px 2px rgba(20,15,10,.06), 0 6px 16px -8px rgba(20,15,10,.15);
    --radius-s: 10px;
    --radius-m: 16px;
    --radius-l: 22px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15130F;
      --surface:#211D18;
      --surface-2:#2A2520;
      --text:#F3EFE9;
      --text-muted:#A79E93;
      --border:#3A342D;
      --accent:#FF7A47;
      --accent-strong:#FF8E5E;
      --accent-on:#1B1210;
      --accent-soft:#3A2116;
      --secondary:#7EA0FF;
      --secondary-soft:#1E2740;
      --success:#59C68A;
      --success-soft:#173425;
      --danger:#FF8A80;
      --danger-soft:#3A1F1E;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 24px -12px rgba(0,0,0,.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#15130F;
    --surface:#211D18;
    --surface-2:#2A2520;
    --text:#F3EFE9;
    --text-muted:#A79E93;
    --border:#3A342D;
    --accent:#FF7A47;
    --accent-strong:#FF8E5E;
    --accent-on:#1B1210;
    --accent-soft:#3A2116;
    --secondary:#7EA0FF;
    --secondary-soft:#1E2740;
    --success:#59C68A;
    --success-soft:#173425;
    --danger:#FF8A80;
    --danger-soft:#3A1F1E;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 24px -12px rgba(0,0,0,.5);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Work Sans", system-ui, -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }
  h1,h2,h3,.display{
    font-family:"Barlow Condensed", "Work Sans", sans-serif;
    text-transform:uppercase;
    letter-spacing:.02em;
    font-weight:700;
    text-wrap:balance;
    margin:0;
  }
  .num{ font-variant-numeric: tabular-nums; }
  button{ font-family:inherit; }
  input,select{ font-family:inherit; }
  ::selection{ background:var(--accent-soft); }

  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding-bottom: calc(78px + env(safe-area-inset-bottom));
    position:relative;
  }

  .topbar{
    position:sticky; top:0; z-index:5;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px calc(10px);
    padding-top: calc(14px + env(safe-area-inset-top));
    background:var(--bg);
    border-bottom:1px solid var(--border);
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{
    width:30px;height:30px;border-radius:9px;background:var(--accent);
    display:flex;align-items:center;justify-content:center;flex:none;
  }
  .brand-mark svg{ width:18px; height:18px; }
  .brand h1{ font-size:22px; line-height:1; color:var(--text); }
  .profile-chip{
    display:flex; align-items:center; gap:8px;
    background:var(--surface); border:1px solid var(--border);
    border-radius:999px; padding:6px 12px 6px 6px;
    cursor:pointer;
  }
  .avatar{
    width:24px;height:24px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:12px; font-weight:700; color:var(--accent-on);
    background:var(--accent); flex:none;
  }
  .profile-chip span{ font-size:13px; font-weight:600; }

  main{ flex:1; padding:16px 18px 8px; }
  .screen{ display:flex; flex-direction:column; gap:14px; animation: fade .18s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

  .section-title{ display:flex; align-items:baseline; justify-content:space-between; margin-top:4px; }
  .section-title h2{ font-size:20px; color:var(--text); }
  .section-title .muted{ font-size:12px; color:var(--text-muted); text-transform:none; letter-spacing:0; font-family:"Work Sans",sans-serif; font-weight:500; }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-m);
    box-shadow:var(--shadow);
    padding:14px;
  }
  .card + .card{ margin-top:0; }
  .stack{ display:flex; flex-direction:column; gap:10px; }
  .row{ display:flex; align-items:center; gap:10px; }
  .row.between{ justify-content:space-between; }
  .wrap{ display:flex; flex-wrap:wrap; gap:8px; }

  .day-card .day-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .day-head h3{ font-size:18px; color:var(--text); }
  .day-head .actions{ display:flex; gap:6px; }
  .exlist{ display:flex; flex-direction:column; gap:8px; margin-top:10px; }
  .exrow{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:9px 10px; background:var(--surface-2); border-radius:var(--radius-s);
  }
  .exrow .exname{ font-weight:600; font-size:14.5px; }
  .exrow .exmeta{ font-size:12.5px; color:var(--text-muted); }
  .exrow .actions{ display:flex; gap:4px; flex:none; }

  .iconbtn{
    width:30px;height:30px; border-radius:9px; border:1px solid var(--border);
    background:var(--surface); color:var(--text-muted);
    display:flex;align-items:center;justify-content:center; cursor:pointer;
  }
  .iconbtn:active{ transform:scale(.94); }
  .iconbtn svg{ width:15px; height:15px; }
  .iconbtn.danger{ color:var(--danger); }

  .btn{
    appearance:none; border:none; border-radius:12px; padding:12px 16px;
    font-weight:700; font-size:14.5px; cursor:pointer; text-align:center;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn:active{ transform:scale(.98); }
  .btn svg{ width:17px; height:17px; flex:none; }
  .btn-primary{ background:var(--accent); color:var(--accent-on); }
  .btn-secondary{ background:var(--secondary-soft); color:var(--secondary); }
  .btn-ghost{ background:var(--surface-2); color:var(--text); }
  .btn-outline{ background:transparent; color:var(--text); border:1px solid var(--border); }
  .btn-block{ width:100%; }
  .btn-sm{ padding:8px 12px; font-size:13px; border-radius:10px; }
  .btn-danger{ background:var(--danger-soft); color:var(--danger); }

  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:12px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em; }
  .field input, .field select, .field textarea{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:10px 12px; font-size:15px; width:100%;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; min-width:0; }

  .ac-wrap{ position:relative; }
  .ac-list{
    position:absolute; left:0; right:0; top:calc(100% + 4px); z-index:6;
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    box-shadow:var(--shadow); max-height:210px; overflow-y:auto; display:none;
  }
  .ac-item{ padding:10px 12px; font-size:14px; cursor:pointer; }
  .ac-item + .ac-item{ border-top:1px solid var(--border); }
  .ac-item:hover, .ac-item:active{ background:var(--surface-2); }

  .empty{
    display:flex; flex-direction:column; align-items:center; text-align:center;
    gap:10px; padding:34px 16px; color:var(--text-muted);
  }
  .empty svg{ width:40px; height:40px; opacity:.5; }
  .empty h3{ color:var(--text); font-size:18px; }
  .empty p{ margin:0; font-size:13.5px; max-width:30ch; }

  .badge{ font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px; text-transform:uppercase; letter-spacing:.03em; }
  .badge.pin{ background:var(--secondary-soft); color:var(--secondary); }
  .badge.pr{ background:var(--success-soft); color:var(--success); }

  .bottomnav{
    position:fixed; left:0; right:0; bottom:0; z-index:10;
    background:var(--surface); border-top:1px solid var(--border);
    padding: 8px max(10px, calc(50% - 240px + 10px)) calc(8px + env(safe-area-inset-bottom));
    display:flex; justify-content:space-around;
  }
  .navbtn{
    display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; color:var(--text-muted); cursor:pointer;
    padding:6px 14px; border-radius:12px; flex:1; max-width:110px;
  }
  .navbtn svg{ width:22px; height:22px; }
  .navbtn span{ font-size:11px; font-weight:600; }
  .navbtn.active{ color:var(--accent); }

  .banner{
    display:flex; gap:10px; align-items:flex-start;
    background:var(--secondary-soft); color:var(--secondary);
    border-radius:var(--radius-s); padding:10px 12px; font-size:12.5px; line-height:1.4;
  }
  .banner svg{ width:16px; height:16px; flex:none; margin-top:1px; }
  .banner.warn{ background:var(--accent-soft); color:var(--accent-strong); }

  .modal-back{
    position:fixed; inset:0; background:rgba(10,8,6,.5); backdrop-filter:blur(2px);
    display:flex; align-items:flex-end; justify-content:center; z-index:50;
    animation: fadeIn .15s ease;
  }
  @keyframes fadeIn{ from{opacity:0} to{opacity:1} }
  .modal{
    background:var(--surface); width:100%; max-width:480px;
    border-radius:20px 20px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:14px;
    max-height:88vh; overflow-y:auto;
    animation: up .18s ease;
  }
  @keyframes up{ from{transform:translateY(16px); opacity:.6} to{transform:none; opacity:1} }
  .modal h3{ font-size:20px; }
  .modal-actions{ display:flex; gap:10px; margin-top:4px; }
  .modal-actions .btn{ flex:1; }

  .profilegrid{ display:flex; flex-direction:column; gap:8px; }
  .profileopt{
    display:flex; align-items:center; gap:12px; padding:11px 12px;
    background:var(--surface-2); border-radius:var(--radius-s); border:1px solid transparent;
    cursor:pointer;
  }
  .profileopt.current{ border-color:var(--accent); }
  .profileopt .avatar{ width:34px; height:34px; font-size:14px; }
  .profileopt .info{ flex:1; }
  .profileopt .info b{ font-size:14.5px; display:block; }
  .profileopt .info small{ color:var(--text-muted); font-size:12px; }
  .profileopt > svg{ width:16px; height:16px; color:var(--text-muted); flex:none; }

  .pindots{ display:flex; gap:10px; justify-content:center; margin:6px 0; }
  .pindots .d{ width:14px; height:14px; border-radius:50%; border:2px solid var(--border); }
  .pindots .d.on{ background:var(--accent); border-color:var(--accent); }
  .keypad{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .keypad button{
    padding:16px; font-size:20px; font-weight:700; border-radius:14px;
    border:1px solid var(--border); background:var(--surface-2); color:var(--text);
  }
  .keypad button:active{ transform:scale(.95); }

  /* Cronometro */
  .timer-wrap{ display:flex; flex-direction:column; align-items:center; gap:20px; padding:10px 0 4px; }
  .ring-box{ position:relative; width:240px; height:240px; }
  .ring-box svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .ring-bg{ fill:none; stroke:var(--surface-2); stroke-width:14; }
  .ring-fg{ fill:none; stroke:var(--accent); stroke-width:14; stroke-linecap:round; transition: stroke .2s ease; }
  .ring-fg.done{ stroke:var(--success); }
  .ring-label{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:2px;
  }
  .ring-label .time{ font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:54px; line-height:1; }
  .ring-label .state{ font-size:12px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em; font-weight:600; }
  .presets{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .preset{
    padding:9px 14px; border-radius:999px; border:1px solid var(--border);
    background:var(--surface); color:var(--text); font-weight:600; font-size:13.5px; cursor:pointer;
  }
  .preset.active{ background:var(--accent); border-color:var(--accent); color:var(--accent-on); }
  .timer-controls{ display:flex; gap:12px; }
  .timer-controls .btn{ width:76px; height:76px; border-radius:50%; font-size:13px; flex-direction:column; }
  .timer-controls .btn svg{ width:24px; height:24px; }

  /* Sparkline */
  .spark-row{ display:flex; align-items:center; gap:12px; }
  .spark-stats{ flex:none; text-align:right; }
  .spark-stats .best{ font-size:20px; font-weight:700; font-family:"Barlow Condensed",sans-serif; color:var(--text); }
  .spark-stats .lbl{ font-size:10.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em; }
  svg.spark{ flex:1; min-width:0; height:44px; width:100%; overflow:visible; }

  .loglist{ display:flex; flex-direction:column; gap:8px; }
  .logrow{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 12px; border-radius:var(--radius-s); background:var(--surface-2);
  }
  .logrow .lex{ font-weight:600; font-size:14px; }
  .logrow .ldate{ font-size:11.5px; color:var(--text-muted); }
  .logrow .lval{ font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:18px; text-align:right; }
  .logrow .lsub{ font-size:11.5px; color:var(--text-muted); text-align:right; }

  .segmented{ display:flex; background:var(--surface-2); border-radius:12px; padding:3px; }
  .segmented button{
    flex:1; border:none; background:none; padding:9px 6px; border-radius:9px;
    font-weight:600; font-size:13px; color:var(--text-muted); cursor:pointer;
  }
  .segmented button.active{ background:var(--surface); color:var(--text); box-shadow:var(--shadow); }

  a.linklike{ color:var(--secondary); font-weight:600; cursor:pointer; }
  .helptext{ font-size:12px; color:var(--text-muted); line-height:1.4; }

  .setrow{ display:flex; flex-wrap:wrap; gap:8px; }
  .setdot{
    width:36px; height:36px; border-radius:50%; border:2px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px;
    color:var(--text-muted); cursor:pointer; background:var(--surface-2); flex:none;
  }
  .setdot.done{ background:var(--success); border-color:var(--success); color:#fff; }
  .setdot:active{ transform:scale(.93); }

  .racha-card{ display:flex; flex-direction:column; gap:8px; }
  .racha-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .racha-count{ font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:23px; }
  .racha-streak{ text-align:right; }
  .racha-streak .fire{ font-size:22px; line-height:1; }

  .muscle-diagram{ display:flex; flex-direction:column; align-items:center; gap:6px; padding:8px 0 2px; }
  .muscle-diagram-pic{ width:74px; height:92px; }
  .muscle-diagram-pic svg [data-region], .howto-pic svg [data-region]{ stroke:var(--surface); stroke-width:1.2; stroke-linejoin:round; }
  .howto-pic{ width:150px; height:188px; border-radius:var(--radius-s); overflow:hidden; background:var(--surface-2); }
  .howto-pic svg{ width:100%; height:100%; }
  .howto-photo{ width:100%; max-width:320px; height:auto; display:block; margin:0 auto; border-radius:var(--radius-s); background:var(--surface-2); }
  .tips-box{ background:var(--surface-2); border-radius:var(--radius-s); padding:12px 14px; }
  .tips-list{ margin:0; padding-left:18px; display:flex; flex-direction:column; gap:6px; font-size:13.5px; line-height:1.4; color:var(--text); }

  @media (max-width:360px){
    .ring-box{ width:200px; height:200px; }
    .ring-label .time{ font-size:44px; }
    .timer-controls .btn{ width:66px; height:66px; }
  }
</style>
</head>

<div id="app"></div>

  function bodyDiagramSvg(diagramKey, targets){
    const d = BODY_DIAGRAMS[diagramKey];
    if(!d) return "";
    const map = new Map((targets||[]).map(x=> Array.isArray(x) ? x : [x.region, x.intensity]));
    const colored = d.shapes.replace(/data-region="([\w-]+)"/g, (m, region)=>{
      const isBase = region==="base" || region==="head";
      if(isBase) return `data-region="${region}" fill="var(--surface-2)"`;
      const intensity = map.has(region) ? map.get(region) : 0;
      const fill = intensity>0
        ? `color-mix(in srgb, var(--danger) ${Math.round(Math.min(1,intensity)*100)}%, var(--border))`
        : "var(--border)";
      return `data-region="${region}" fill="${fill}"`;
    });
    return `<svg viewBox="${d.viewBox}" style="width:100%; height:100%">${colored}</svg>`;
  }

  function normalizeTxt(s){
    return (s||"").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
  }

  function exerciseSuggestions(query, extra){
    const q = normalizeTxt(query);
    if(!q) return [];
    const pool = new Set();
    (extra||[]).forEach(n=> n && pool.add(n));
    EXERCISES.forEach(n=> pool.add(n));
    const starts = [], contains = [];
    pool.forEach(name=>{
      const nn = normalizeTxt(name);
      if(nn===q) return;
      if(nn.startsWith(q)) starts.push(name);
      else if(nn.includes(q)) contains.push(name);
    });
    starts.sort((a,b)=>a.localeCompare(b,"es"));
    contains.sort((a,b)=>a.localeCompare(b,"es"));
    return starts.concat(contains).slice(0,6);
  }

  function attachAutocomplete(input, listEl, extraProvider, onSelect){
    if(!input || !listEl) return;
    function update(){
      const q = input.value;
      const sugg = q.trim() ? exerciseSuggestions(q, extraProvider?extraProvider():[]) : [];
      if(sugg.length===0){ listEl.innerHTML=""; listEl.style.display="none"; return; }
      listEl.innerHTML = sugg.map(s=>`<div class="ac-item" data-val="${esc(s)}">${esc(s)}</div>`).join("");
      listEl.style.display = "block";
      listEl.querySelectorAll(".ac-item").forEach(it=>{
        it.addEventListener("mousedown", (e)=>{
          e.preventDefault();
          input.value = it.dataset.val;
          listEl.innerHTML = ""; listEl.style.display = "none";
          input.focus();
          if(onSelect) onSelect(input.value);
        });
      });
    }
    input.addEventListener("input", update);
    input.addEventListener("focus", update);
    input.addEventListener("blur", ()=>{ setTimeout(()=>{ listEl.style.display="none"; }, 120); });
  }

  /* ---------- Racha / meta semanal ---------- */
  function isoWeekMonday(d){
    const day = (d.getDay()+6)%7; // 0=lunes .. 6=domingo
    const monday = new Date(d.getFullYear(), d.getMonth(), d.getDate()-day);
    return monday;
  }
  function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function computeRacha(entrenos, metaSemanal){
    const goal = metaSemanal>0 ? metaSemanal : 3;
    const today = new Date();
    const curMonday = isoWeekMonday(today);
    const byWeek = {};
    (entrenos||[]).forEach(e=>{
      if(!e.date) return;
      const parts = e.date.split("-").map(n=>parseInt(n,10));
      const d = new Date(parts[0], parts[1]-1, parts[2]);
      const key = ymd(isoWeekMonday(d));
      byWeek[key] = (byWeek[key]||0)+1;
    });
    const curKey = ymd(curMonday);
    const thisWeekCount = byWeek[curKey]||0;
    const remaining = Math.max(0, goal-thisWeekCount);
    const todayIdx = (today.getDay()+6)%7;
    const daysLeft = 7-todayIdx;
    let streak = 0;
    let cursor = new Date(curMonday.getFullYear(), curMonday.getMonth(), curMonday.getDate()-7);
    while(streak<104){
      const key = ymd(cursor);
      const count = byWeek[key]||0;
      if(count>=goal){ streak++; cursor = new Date(cursor.getFullYear(), cursor.getMonth(), cursor.getDate()-7); }
      else break;
    }
    return { goal, thisWeekCount, remaining, daysLeft, streak };
  }

      await client().auth.signOut();
    }
    async function resetPassword(email){
      return await client().auth.resetPasswordForEmail(email, { redirectTo: window.location.origin });
    }
    async function updatePassword(newPassword){
      return await client().auth.updateUser({ password: newPassword });
    }

    function rowToProfile(r){
      return {
        id: r.id, name: r.name, metaSemanal: r.meta_semanal||3, createdAt: r.created_at||0,
        edad: r.edad||null, peso: r.peso_estimado||null,
      };
    }

    async function ensureProfile(user){
      const sbc = client();
      const { data, error } = await sbc.from("profiles").select("*").eq("id", user.id).maybeSingle();
      if(error) throw error;
      if(data) return rowToProfile(data);
      const meta = (user.user_metadata) || {};
      const name = meta.name || (user.email ? user.email.split("@")[0] : "Usuario");
      const row = {
        id: user.id, name, meta_semanal: meta.metaSemanal || 3, created_at: Date.now(),
        edad: meta.edad || null, peso_estimado: meta.peso || null,
      };
      const { data: inserted, error: err2 } = await sbc.from("profiles").insert(row).select().single();
      if(err2) throw err2;
      return rowToProfile(inserted);
    }

    async function updateProfile(id, data){
      const row = {};
      if("name" in data) row.name = data.name;
      if("metaSemanal" in data) row.meta_semanal = data.metaSemanal;
      if("edad" in data) row.edad = data.edad;
      if("peso" in data) row.peso_estimado = data.peso;
      const { error } = await client().from("profiles").update(row).eq("id", id);
      return !error;
    }

    async function getRutina(pid){
      const { data, error } = await client().from("rutinas").select("data").eq("profile_id", pid).maybeSingle();
      if(error) throw error;
      return (data && data.data) ? deepClone(data.data) : { days: [] };
    }

    async function saveRutina(pid, data){
      const { error } = await client().from("rutinas").upsert({ profile_id: pid, data: data }, { onConflict: "profile_id" });
      return !error;
    }

    function rowToRegistro(r){
      return { id: r.id, exercise: r.exercise, peso: r.peso, date: r.date, series: r.series||"", reps: r.reps||"", nota: r.nota||"", createdAt: r.created_at||0 };
    }

    async function addRegistro(pid, data){
      const row = { profile_id: pid, exercise: data.exercise, peso: data.peso, date: data.date, series: data.series||"", reps: data.reps||"", nota: data.nota||"", created_at: data.createdAt||Date.now() };
      const { error } = await client().from("registros").insert(row);
      return !error;
    }

    async function deleteRegistro(pid, id){
      const { error } = await client().from("registros").delete().eq("id", id).eq("profile_id", pid);
      return !error;
    }

    async function listRegistros(pid){
      const { data, error } = await client().from("registros").select("*").eq("profile_id", pid)
        .order("date",{ascending:false}).order("created_at",{ascending:false}).limit(300);
      if(error) throw error;
      return (data||[]).map(rowToRegistro);
    }

    function rowToEntreno(r){
      return { id: r.id, date: r.date, dayId: r.day_id, dayNombre: r.day_nombre, setsCompletados: r.sets_completados, setsTotales: r.sets_totales, createdAt: r.created_at||0 };
    }

    async function addEntreno(pid, data){
      const row = { profile_id: pid, date: data.date, day_id: data.dayId, day_nombre: data.dayNombre, sets_completados: data.setsCompletados, sets_totales: data.setsTotales, created_at: data.createdAt||Date.now() };
      const { error } = await client().from("entrenos").insert(row);
      return !error;
    }

    async function listEntrenos(pid){
      const { data, error } = await client().from("entrenos").select("*").eq("profile_id", pid)
        .order("date",{ascending:false}).order("created_at",{ascending:false}).limit(200);
      if(error) throw error;
      return (data||[]).map(rowToEntreno);
    }

    return { onAuthStateChange, signUp, signIn, signOut, resetPassword, updatePassword, ensureProfile, updateProfile, getRutina, saveRutina, addRegistro, deleteRegistro, listRegistros, addEntreno, listEntrenos };
  })();

  function mapAuthError(error){
    const msg = (error && error.message) || "";
    if(/invalid login credentials/i.test(msg)) return "Correo o contraseña incorrectos.";
    if(/user already registered/i.test(msg)) return "Ya existe una cuenta con ese correo.";
    if(/email not confirmed/i.test(msg)) return "Todavía no confirmaste tu correo. Revisá tu bandeja de entrada.";
    if(/password should be at least/i.test(msg)) return "La contraseña tiene que tener al menos 6 caracteres.";
    if(/unable to validate email/i.test(msg) || /invalid email/i.test(msg)) return "Ese correo no parece válido.";
    if(/rate limit/i.test(msg)) return "Demasiados intentos. Esperá un minuto y probá de nuevo.";
    return msg || "Ocurrió un error. Probá de nuevo.";
  }

  /* ---------- Generic modal helper ---------- */
  function closeModal(){
    const back = document.querySelector(".modal-back");
    if(back) back.remove();
    document.removeEventListener("keydown", escHandler);
  }
  function escHandler(e){ if(e.key==="Escape") closeModal(); }
  function openModal(innerHtml, onMount){
    closeModal();
    const back = document.createElement("div");
    back.className = "modal-back";
    back.innerHTML = `<div class="modal">${innerHtml}</div>`;
    back.addEventListener("click", (e)=>{ if(e.target===back) closeModal(); });
    document.body.appendChild(back);
    document.addEventListener("keydown", escHandler);
    if(onMount) onMount(back.querySelector(".modal"));
    return back.querySelector(".modal");
  }

  function confirmDialog(title, msg, confirmLabel){
    return new Promise(resolve=>{
      const m = openModal(`
        <h3>${esc(title)}</h3>
        <p class="helptext" style="font-size:14px;color:var(--text)">${esc(msg)}</p>
        <div class="modal-actions">
          <button class="btn btn-ghost" data-act="cancel">Cancelar</button>
          <button class="btn btn-danger" data-act="ok">${esc(confirmLabel||"Eliminar")}</button>
        </div>
      `);
      m.querySelector('[data-act="cancel"]').onclick = ()=>{ closeModal(); resolve(false); };
      m.querySelector('[data-act="ok"]').onclick = ()=>{ closeModal(); resolve(true); };
    });
  }

  function goToAuthView(view){
    state.authView = view;
    state.authError = "";
    state.authNotice = "";
    renderAuthScreen();
  }

  function mountAuthScreen(){
    const el = document.querySelector(".screen");
    const linkLogin = el.querySelector("#link-login");
    if(linkLogin) linkLogin.onclick = ()=> goToAuthView("login");
    const linkSignup = el.querySelector("#link-signup");
    if(linkSignup) linkSignup.onclick = ()=> goToAuthView("signup");
    const linkForgot = el.querySelector("#link-forgot");
    if(linkForgot) linkForgot.onclick = ()=> goToAuthView("forgot");

    const btnLogin = el.querySelector("#btn-login");
    if(btnLogin) btnLogin.onclick = async ()=>{
      const email = el.querySelector("#auth-email").value.trim();
      const password = el.querySelector("#auth-password").value;
      if(!email || !password){ state.authError = "Completá correo y contraseña."; renderAuthScreen(); return; }
      btnLogin.disabled = true; btnLogin.textContent = "Entrando...";
      const { error } = await Store.signIn(email, password);
      if(error){
        state.authError = mapAuthError(error);
        renderAuthScreen();
        return;
      }
      state.authError = ""; state.authNotice = "";
      // el listener onAuthStateChange se encarga de cargar el perfil y renderizar
    };

    const btnSignup = el.querySelector("#btn-signup");
    if(btnSignup) btnSignup.onclick = async ()=>{
      const name = el.querySelector("#auth-name").value.trim();
      const email = el.querySelector("#auth-email").value.trim();
      const password = el.querySelector("#auth-password").value;
      const edad = parseInt(el.querySelector("#auth-edad").value, 10) || null;
      const peso = parseFloat(el.querySelector("#auth-peso").value) || null;
      const meta = Math.max(1, Math.min(7, parseInt(el.querySelector("#auth-meta").value, 10) || 3));
      if(!name){ state.authError = "Ingresá tu nombre."; renderAuthScreen(); return; }
      if(!email || !password){ state.authError = "Completá correo y contraseña."; renderAuthScreen(); return; }
      if(password.length<6){ state.authError = "La contraseña tiene que tener al menos 6 caracteres."; renderAuthScreen(); return; }
      btnSignup.disabled = true; btnSignup.textContent = "Creando...";
      const { data, error } = await Store.signUp(email, password, { name, edad, peso, metaSemanal: meta });
      if(error){
        state.authError = mapAuthError(error);
        renderAuthScreen();
        return;
      }
      if(data && data.session){
        state.authError = ""; state.authNotice = "";
        // ya quedó logueado, el listener hace el resto
      } else {
        state.authNotice = "Te enviamos un correo para confirmar tu cuenta. Abrilo y después iniciá sesión.";
        state.authError = "";
        state.authView = "login";
        renderAuthScreen();
      }
    };

    const btnForgot = el.querySelector("#btn-forgot");
    if(btnForgot) btnForgot.onclick = async ()=>{
      const email = el.querySelector("#auth-email").value.trim();
      if(!email){ state.authError = "Ingresá tu correo."; renderAuthScreen(); return; }
      btnForgot.disabled = true; btnForgot.textContent = "Enviando...";
      const { error } = await Store.resetPassword(email);
      if(error){
        state.authError = mapAuthError(error);
        renderAuthScreen();
        return;
      }
      state.authNotice = "Si el correo existe, te enviamos un enlace para recuperar la contraseña.";
      state.authError = "";
      state.authView = "login";
      renderAuthScreen();
    };
  }

  async function moveDay(id, dir){
    const arr = state.rutina.days;
    const i = arr.findIndex(d=>d.id===id);
    const j = i+dir;
    if(i<0||j<0||j>=arr.length) return;
    [arr[i],arr[j]] = [arr[j],arr[i]];
    await Store.saveRutina(state.profile.id, state.rutina);
    renderScreen();
  }

  async function moveExercise(day, exId, dir){
    const arr = day.exercises;
    const i = arr.findIndex(x=>x.id===exId);
    const j = i+dir;
    if(i<0||j<0||j>=arr.length) return;
    [arr[i],arr[j]] = [arr[j],arr[i]];
    await Store.saveRutina(state.profile.id, state.rutina);
    renderScreen();
  }

  /* ================= MODO ENTRENANDO ================= */
  function startSession(day){
    const sets = {};
    (day.exercises||[]).forEach(ex=>{
      const n = Math.max(1, Math.min(12, parseInt(ex.series,10)||1));
      sets[ex.id] = new Array(n).fill(false);
    });
    state.session = { dayId: day.id, sets };
    state.tab = "sesion";
    render();
  }

  function renderSession(){
    const day = state.rutina.days.find(d=>d.id===state.session.dayId);
    if(!day){ state.session=null; state.tab="rutina"; render(); return; }
    app.innerHTML = `
      <div class="topbar">
        <span class="iconbtn" id="btn-session-back">${icon("back")}</span>
        <h1 style="font-size:18px; flex:1; text-align:center">${esc(day.nombre)}</h1>

      <nav class="bottomnav">
        <button class="btn btn-primary btn-block" id="btn-finish-session" style="max-width:444px; margin:0 auto">${icon("check")} Terminar entrenamiento</button>
      </nav>
    `;
    document.getElementById("btn-session-back").onclick = ()=>{ state.tab="rutina"; render(); };
    document.getElementById("screen").innerHTML = screenSession(day);
    mountSession(day);
    document.getElementById("btn-finish-session").onclick = ()=> finishSession(day);
  }

  function screenSession(day){

    if(exs.length===0){

    }
    return exs.map(ex=>{
      const done = state.session.sets[ex.id] || [];
      return `
        <div class="card stack">
          <div class="row between">
            <div style="display:flex; align-items:center; gap:10px; min-width:0">
              ${exerciseThumbHtml(ex, "width:40px; height:50px; flex:none")}
              <div style="min-width:0">
                <div class="exname" style="font-size:16px">${esc(ex.nombre)}</div>
                <div class="exmeta">${esc(ex.series)} series × ${esc(ex.reps)} reps${ex.notas? " · "+esc(ex.notas):""}</div>
              </div>
            </div>
            <div class="row" style="gap:4px; flex:none">
              <span class="iconbtn" data-howto-ex-session="${ex.id}" title="Cómo hacerlo" style="flex:none">${icon("info")}</span>
              <span class="iconbtn" data-rest-btn title="Descansar" style="flex:none">${icon("timer")}</span>
            </div>
          </div>
          <div class="setrow">
            ${done.map((v,i)=>`<div class="setdot ${v?"done":""}" data-ex="${ex.id}" data-idx="${i}">${i+1}</div>`).join("")}
          </div>
        </div>
      `;
    }).join("") + `<button class="btn btn-outline btn-block" id="btn-cancel-session">Cancelar entrenamiento</button>`;
  }

  function mountSession(day){
    const el = document.getElementById("screen");
    el.querySelectorAll(".setdot").forEach(dot=>{
      dot.onclick = ()=>{
        const exId = dot.dataset.ex, idx = parseInt(dot.dataset.idx,10);
        state.session.sets[exId][idx] = !state.session.sets[exId][idx];
        dot.classList.toggle("done");
      };
    });
    el.querySelectorAll("[data-rest-btn]").forEach(b=>{
      b.onclick = ()=> openRestModal();
    });
    el.querySelectorAll("[data-howto-ex-session]").forEach(b=>{
      b.onclick = ()=>{
        const ex = (day.exercises||[]).find(x=>x.id===b.dataset.howtoExSession);
        if(ex) openHowtoModal(ex);
      };
    });
    const cancelBtn = el.querySelector("#btn-cancel-session");
    if(cancelBtn) cancelBtn.onclick = async ()=>{
      const ok = await confirmDialog("Cancelar entrenamiento", "¿Salir sin registrar este entrenamiento?");
      if(!ok) return;
      state.session = null;
      state.tab = "rutina";
      render();
    };
  }

  async function finishSession(day){
    const setsObj = state.session.sets;
    let total=0, done=0;
    Object.keys(setsObj).forEach(exId=>{ setsObj[exId].forEach(v=>{ total++; if(v) done++; }); });
    const data = { date: todayStr(), dayId: day.id, dayNombre: day.nombre, setsCompletados: done, setsTotales: total, createdAt: Date.now() };
    await Store.addEntreno(state.profile.id, data);
    state.entrenos = await Store.listEntrenos(state.profile.id);
    state.session = null;
    state.tab = "rutina";
    render();
    const m = openModal(`
      <h3>¡Entrenamiento registrado! 💪</h3>
      <p style="font-size:14px; color:var(--text)">${esc(fraseDelDia())}</p>
      <div class="modal-actions"><button class="btn btn-primary btn-block" data-act="ok">Dale</button></div>
    `);
    m.querySelector('[data-act="ok"]').onclick = closeModal;
  }

  /* ================= REGISTRO ================= */
  function filterHistory(list){
    const f = state.historyFilter;
    return list.filter(r=>{
      if(f.exercise && r.exercise!==f.exercise) return false;
      if(f.from && r.date < f.from) return false;
      if(f.to && r.date > f.to) return false;
      return true;
    });
  }

  function toCSV(rows){
    const header = ["Fecha","Ejercicio","Peso (kg)","Series","Reps","Nota"];
    const escCsv = (v)=>{
      const s = String(v==null?"":v);
      return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
    };
    const lines = [header.map(escCsv).join(",")];
    rows.forEach(r=> lines.push([r.date, r.exercise, r.peso, r.series||"", r.reps||"", r.nota||""].map(escCsv).join(",")));
    return lines.join("\r\n");
  }

  function exportCSV(rows){
    const csv = toCSV(rows);
    const blob = new Blob(["﻿"+csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `fierros-historial-${(state.profile.name||"perfil").toLowerCase().replace(/\s+/g,"-")}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=> URL.revokeObjectURL(url), 1000);
  }

  function sparklineFor(history){
    const asc = history.slice().sort((a,b)=> a.date<b.date?-1:1).slice(-10);
    if(asc.length===0) return `<p class="helptext">Todavía no hay registros de este ejercicio.</p>`;
    const weights = asc.map(r=> parseFloat(r.peso)||0);
    const best = Math.max(...weights);
    const min = Math.min(...weights);
    const w = 260, h = 40, pad = 6;
    const range = (best-min)||1;
    const pts = weights.map((val,i)=>{
      const x = weights.length===1 ? w/2 : (i/(weights.length-1))*(w-pad*2)+pad;
      const y = h - pad - ((val-min)/range)*(h-pad*2);
      return [x,y];
    });
    const path = pts.map((p,i)=> (i===0?"M":"L")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
    const last = pts[pts.length-1];
    return `
      <div class="spark-row">
        <svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
          <line x1="0" y1="${h-pad}" x2="${w}" y2="${h-pad}" stroke="var(--border)" stroke-width="1"/>
          <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="var(--accent)"/>
        </svg>
        <div class="spark-stats">
          <div class="best num">${best} kg</div>
          <div class="lbl">Mejor marca</div>
        </div>
      </div>
    `;
  }

  function mountRegistro(){
    const el = document.getElementById("screen");
    const selEx = el.querySelector("#reg-exercise");
    selEx.onchange = ()=>{
      state.exerciseSelForm = selEx.value;
      renderScreen();
    };
    const otherWrap = el.querySelector("#reg-other-wrap");
    if(selEx.value==="__otro__") otherWrap.style.display = "";
    attachAutocomplete(el.querySelector("#reg-other-name"), el.querySelector("#reg-other-name-ac"), allExerciseNames);

    el.querySelector("#btn-save-reg").onclick = async ()=>{
      let exercise = selEx.value;
      if(exercise==="__otro__"){
        exercise = el.querySelector("#reg-other-name").value.trim();
      }
      const peso = el.querySelector("#reg-peso").value;
      const date = el.querySelector("#reg-date").value || todayStr();
      const series = el.querySelector("#reg-series").value;
      const reps = el.querySelector("#reg-reps").value;
      const nota = el.querySelector("#reg-nota").value.trim();
      if(!exercise){ el.querySelector(selEx.value==="__otro__"?"#reg-other-name":"#reg-exercise").focus(); return; }
      if(peso===""){ el.querySelector("#reg-peso").focus(); return; }
      const btn = el.querySelector("#btn-save-reg");
      btn.disabled = true;
      const data = { exercise, peso: parseFloat(peso), date, series: series||"", reps: reps||"", nota, createdAt: Date.now() };
      await Store.addRegistro(state.profile.id, data);
      state.registros = await Store.listRegistros(state.profile.id);
      state.exerciseSelForm = exercise;
      renderScreen();
    };

    const histEx = el.querySelector("#hist-filter-ex");
    if(histEx) histEx.onchange = ()=>{ state.historyFilter.exercise = histEx.value; renderScreen(); };
    const histFrom = el.querySelector("#hist-from");
    if(histFrom) histFrom.onchange = ()=>{ state.historyFilter.from = histFrom.value; renderScreen(); };
    const histTo = el.querySelector("#hist-to");
    if(histTo) histTo.onchange = ()=>{ state.historyFilter.to = histTo.value; renderScreen(); };
    const clearFilterBtn = el.querySelector("#btn-clear-filter");
    if(clearFilterBtn) clearFilterBtn.onclick = ()=>{ state.historyFilter = { exercise:"", from:"", to:"" }; renderScreen(); };
    const exportBtn = el.querySelector("#btn-export-csv");
    if(exportBtn) exportBtn.onclick = ()=> exportCSV(filterHistory(state.registros));

    el.querySelectorAll("[data-del-log]").forEach(row=>{
      row.addEventListener("contextmenu", (e)=> e.preventDefault());
    });
    // long-press / click-hold not implemented; provide delete via tap-and-hold alternative: simple click on date area triggers confirm
    el.querySelectorAll(".logrow").forEach(row=>{
      row.style.cursor = "pointer";
      row.title = "Tocá para eliminar este registro";
      row.onclick = async ()=>{
        const id = row.dataset.delLog;
        const ok = await confirmDialog("Eliminar registro", "¿Eliminar este registro del historial?");
        if(!ok) return;
        await Store.deleteRegistro(state.profile.id, id);
        state.registros = await Store.listRegistros(state.profile.id);
        renderScreen();
      };
    });
  }

  /* ================= CRONOMETRO ================= */
  const timer = {
    total: lsGet("fierros:timerDefault", 90),
    remaining: null,
    running: false,
    intervalId: null,
    endAt: null,
    audioCtx: null,
  };

  let timerRerender = () => renderScreen();

  function timerBlockHtml(){
    const presets = [30,45,60,90,120,180];
    const remaining = timer.remaining==null ? timer.total : timer.remaining;
    const pct = Math.max(0, Math.min(1, remaining/timer.total));
    const R = 100, C = 2*Math.PI*R;
    const dash = C*pct;
    const mm = Math.floor(remaining/60), ss = Math.floor(remaining%60);
    const label = timer.running ? "Descansando" : (remaining===0 ? "¡Listo!" : "Pausado");
    return `
      <div class="presets" id="presets">
        ${presets.map(p=>`<button class="preset ${!timer.running && timer.total===p?"active":""}" data-preset="${p}">${p<60?p+"s":(p/60)+"m"}</button>`).join("")}
      </div>
      <div class="ring-box">
        <svg viewBox="0 0 220 220">
          <circle class="ring-bg" cx="110" cy="110" r="${R}"/>
          <circle class="ring-fg ${remaining===0?"done":""}" cx="110" cy="110" r="${R}"
            stroke-dasharray="${C}" stroke-dashoffset="${C-dash}"/>
        </svg>
        <div class="ring-label">
          <div class="time num" id="time-label">${String(mm).padStart(2,"0")}:${String(ss).padStart(2,"0")}</div>
          <div class="state">${label}</div>
        </div>
      </div>
      <div class="timer-controls">
        <button class="btn btn-ghost" id="btn-reset">${icon("reset")}<span>Reiniciar</span></button>
        <button class="btn btn-primary" id="btn-toggle">${timer.running?icon("pause"):icon("play")}<span>${timer.running?"Pausa":"Iniciar"}</span></button>
      </div>
      <div class="field" style="width:100%">
        <label>Tiempo personalizado (segundos)</label>
        <input type="number" id="custom-secs" min="5" max="900" value="${timer.total}">
      </div>
    `;
  }

  function wireTimerControls(root){
    root.querySelectorAll("[data-preset]").forEach(b=>{
      b.onclick = ()=>{
        const v = parseInt(b.dataset.preset,10);
        timer.total = v; timer.remaining = v; timer.running=false; clearInterval(timer.intervalId); timer.endAt=null;
        lsSet("fierros:timerDefault", v);
        timerRerender();
      };
    });
    root.querySelector("#btn-toggle").onclick = ()=>{
      if(timer.running) pauseTimer(); else startTimer();
    };
    root.querySelector("#btn-reset").onclick = resetTimer;
    const custom = root.querySelector("#custom-secs");
    custom.onchange = ()=>{
      const v = Math.max(5, Math.min(900, parseInt(custom.value,10)||90));
      timer.total = v; timer.remaining = v; timer.running=false; clearInterval(timer.intervalId); timer.endAt=null;
      lsSet("fierros:timerDefault", v);
      timerRerender();
    };
  }

  function openRestModal(){
    const m = openModal(`
      <h3>Descanso</h3>
      <div class="timer-wrap timer-modal-body">${timerBlockHtml()}</div>
      <button class="btn btn-ghost btn-block" data-act="close">Cerrar (sigue corriendo)</button>
    `);
    timerRerender = ()=>{
      if(!document.body.contains(m)){ timerRerender = renderScreen; return; }
      const body = m.querySelector(".timer-modal-body");
      body.innerHTML = timerBlockHtml();
      wireTimerControls(body);
    };
    wireTimerControls(m.querySelector(".timer-modal-body"));
    m.querySelector('[data-act="close"]').onclick = ()=>{ closeModal(); timerRerender = renderScreen; };
  }

  /* ---------- Cronómetro de tiempo total de entrenamiento (cuenta hacia arriba) ---------- */
  const workoutClock = { running:false, elapsedMs:0, startEpoch:null, intervalId:null };
  let workoutClockRerender = () => renderScreen();

  function fmtElapsed(ms){
    const total = Math.floor(ms/1000);
    const hh = Math.floor(total/3600), mm = Math.floor((total%3600)/60), ss = total%60;
    const mmss = `${String(mm).padStart(2,"0")}:${String(ss).padStart(2,"0")}`;
    return hh>0 ? `${String(hh).padStart(2,"0")}:${mmss}` : mmss;
  }

  function currentWorkoutElapsed(){
    return workoutClock.elapsedMs + (workoutClock.running ? (Date.now()-workoutClock.startEpoch) : 0);
  }

  function workoutClockHtml(){
    return `
      <div class="card" style="display:flex; flex-direction:column; align-items:center; gap:10px; padding:16px 14px">
        <div class="helptext" style="text-transform:uppercase; letter-spacing:.04em; font-weight:700">Tiempo de entrenamiento</div>
        <div class="num" id="workout-time-label" style="font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:38px">${fmtElapsed(currentWorkoutElapsed())}</div>
        <div class="row" style="gap:10px">
          <button class="btn btn-ghost btn-sm" id="btn-workout-reset">${icon("reset")} Reiniciar</button>
          <button class="btn btn-primary btn-sm" id="btn-workout-toggle">${workoutClock.running? icon("pause")+" Pausar" : icon("play")+" Iniciar entrenamiento"}</button>
        </div>
      </div>
    `;
  }

  function tickWorkoutClock(){
    const label = document.getElementById("workout-time-label");
    if(label) label.textContent = fmtElapsed(currentWorkoutElapsed());
  }

  function wireWorkoutClock(root){
    root.querySelector("#btn-workout-toggle").onclick = ()=>{
      if(workoutClock.running){
        workoutClock.elapsedMs = currentWorkoutElapsed();
        workoutClock.running = false;
        workoutClock.startEpoch = null;
        clearInterval(workoutClock.intervalId);
      } else {
        workoutClock.running = true;
        workoutClock.startEpoch = Date.now();
        clearInterval(workoutClock.intervalId);
        workoutClock.intervalId = setInterval(tickWorkoutClock, 1000);
      }
      workoutClockRerender();
    };
    root.querySelector("#btn-workout-reset").onclick = ()=>{
      clearInterval(workoutClock.intervalId);
      workoutClock.running = false;
      workoutClock.elapsedMs = 0;
      workoutClock.startEpoch = null;
      workoutClockRerender();
    };
  }

  function screenCronometro(){
    return `
      <div class="section-title"><h2>Cronómetro</h2></div>
      ${workoutClockHtml()}
      <div class="section-title" style="margin-top:6px"><h2>Descanso entre series</h2></div>
      <div class="card timer-wrap">${timerBlockHtml()}</div>
      <p class="helptext" style="text-align:center">Cuando termine el descanso vas a escuchar un sonido y (si tu celular lo permite) vibrar.</p>
    `;
  }

  function playBeep(){
    try{
      if(!timer.audioCtx) timer.audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      const ctx = timer.audioCtx;
      if(ctx.state==="suspended") ctx.resume();
      [0,0.18,0.36].forEach((t,i)=>{
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = "sine";
        o.frequency.value = i===2? 1046.5 : 880;
        g.gain.setValueAtTime(0.0001, ctx.currentTime+t);
        g.gain.exponentialRampToValueAtTime(0.28, ctx.currentTime+t+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+t+0.16);
        o.connect(g); g.connect(ctx.destination);
        o.start(ctx.currentTime+t);
        o.stop(ctx.currentTime+t+0.18);
      });
    }catch(e){}
    if(navigator.vibrate) navigator.vibrate([200,100,200,100,200]);
  }

  function tick(){
    if(timer.endAt==null) return;
    const remainingMs = timer.endAt - Date.now();
    const remaining = Math.max(0, Math.ceil(remainingMs/1000));
    timer.remaining = remaining;
    const timeLabel = document.getElementById("time-label");
    const ring = document.querySelector(".ring-fg");
    if(timeLabel){
      const mm=Math.floor(remaining/60), ss=Math.floor(remaining%60);
      timeLabel.textContent = `${String(mm).padStart(2,"0")}:${String(ss).padStart(2,"0")}`;
    }
    if(ring){
      const R=100, C=2*Math.PI*R;
      const pct = Math.max(0, Math.min(1, remaining/timer.total));
      ring.setAttribute("stroke-dashoffset", C-(C*pct));
    }
    if(remaining<=0){
      stopTimer(true);
      timerRerender();
    }
  }

  function startTimer(){
    if(timer.remaining==null) timer.remaining = timer.total;
    if(timer.remaining<=0) timer.remaining = timer.total;
    timer.endAt = Date.now() + timer.remaining*1000;
    timer.running = true;
    clearInterval(timer.intervalId);
    timer.intervalId = setInterval(tick, 250);
    timerRerender();
  }
  function pauseTimer(){
    timer.running = false;
    clearInterval(timer.intervalId);
    timerRerender();
  }
  function stopTimer(finished){
    timer.running = false;
    clearInterval(timer.intervalId);
    timer.endAt = null;
    if(finished){ timer.remaining = 0; playBeep(); }
  }
  function resetTimer(){
    stopTimer(false);
    timer.remaining = timer.total;
    timerRerender();
  }

  function mountCronometro(){
    timerRerender = renderScreen;
    workoutClockRerender = renderScreen;
    wireTimerControls(document.getElementById("screen"));
    wireWorkoutClock(document.getElementById("screen"));
  }

  /* ================= PERFIL ================= */
  function screenPerfil(){
    const email = (state.authSession && state.authSession.user && state.authSession.user.email) || "";
    return `
      <div class="section-title"><h2>Tu cuenta</h2></div>
      <div class="card row" style="gap:12px">
        <div class="avatar" style="width:40px;height:40px;font-size:16px">${esc(initials(state.profile.name))}</div>
        <div><b style="font-size:15px">${esc(state.profile.name)}</b><div class="helptext">${esc(email)}</div></div>
      </div>

      <div class="section-title" style="margin-top:6px"><h2>Preferencias</h2></div>
      <div class="card stack">
        <div class="field">
          <label>Nombre</label>
          <input type="text" id="perfil-name" maxlength="24" value="${esc(state.profile.name)}">
        </div>
        <div class="field">
          <label>Meta semanal (veces por semana)</label>
          <input type="number" id="meta-semanal" min="1" max="7" value="${state.profile.metaSemanal||3}">
        </div>
        <div class="field-row">
          <div class="field">
            <label>Edad</label>
            <input type="number" id="perfil-edad" min="10" max="99" placeholder="Opcional" value="${state.profile.edad||""}">
          </div>
          <div class="field">
            <label>Peso aprox. (kg)</label>
            <input type="number" id="perfil-peso" min="20" max="300" step="0.5" placeholder="Opcional" value="${state.profile.peso||""}">
          </div>
        </div>
        <p class="helptext">La edad y el peso son opcionales — van a servir para el futuro asistente de IA personalizado.</p>
      </div>

      <div class="section-title" style="margin-top:6px"><h2>Acerca de Fierros</h2></div>
      <div class="card stack">
        <p class="helptext">Rutina, registro de pesos y cronómetro de descanso. Los videos de ejercicios y otras funciones se van a ir sumando más adelante.</p>
        <div class="row between">
          <span class="helptext">Tema</span>
          <div class="segmented" id="theme-seg" style="width:auto">
            <button data-theme="system" class="${lsGet('fierros:theme','system')==='system'?'active':''}">Auto</button>
            <button data-theme="light" class="${lsGet('fierros:theme','system')==='light'?'active':''}">Claro</button>
            <button data-theme="dark" class="${lsGet('fierros:theme','system')==='dark'?'active':''}">Oscuro</button>
          </div>
        </div>
      </div>

      <button class="btn btn-outline btn-block" id="btn-logout">${icon("back")} Cerrar sesión</button>
    `;
  }

  function mountPerfil(){
    const el = document.getElementById("screen");
    const nameInput = el.querySelector("#perfil-name");
    nameInput.onchange = async ()=>{
      const v = nameInput.value.trim() || state.profile.name;
      nameInput.value = v;
      state.profile.name = v;
      await Store.updateProfile(state.profile.id, { name: v });
      render();
    };
    const metaInput = el.querySelector("#meta-semanal");
    metaInput.onchange = async ()=>{
      const v = Math.max(1, Math.min(7, parseInt(metaInput.value,10)||3));
      metaInput.value = v;
      state.profile.metaSemanal = v;
      await Store.updateProfile(state.profile.id, { metaSemanal: v });
    };
    const edadInput = el.querySelector("#perfil-edad");
    edadInput.onchange = async ()=>{
      const v = edadInput.value ? parseInt(edadInput.value,10) : null;
      state.profile.edad = v;
      await Store.updateProfile(state.profile.id, { edad: v });
    };
    const pesoInput = el.querySelector("#perfil-peso");
    pesoInput.onchange = async ()=>{
      const v = pesoInput.value ? parseFloat(pesoInput.value) : null;
      state.profile.peso = v;
      await Store.updateProfile(state.profile.id, { peso: v });
    };
    el.querySelector("#btn-logout").onclick = async ()=>{
      const ok = await confirmDialog("Cerrar sesión", "¿Cerrar sesión en este dispositivo?", "Cerrar sesión");
      if(!ok) return;
      await Store.signOut();
      // el listener onAuthStateChange limpia el estado y muestra la pantalla de login
    };
    const seg = el.querySelector("#theme-seg");
    seg.querySelectorAll("button").forEach(b=>{
      b.onclick = ()=>{
        applyTheme(b.dataset.theme);
        renderScreen();
      };
    });
  }

  function applyTheme(mode){
    lsSet("fierros:theme", mode);
    if(mode==="system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", mode);
  }

  /* ---------- Boot ---------- */
  async function boot(){
    applyTheme(lsGet("fierros:theme","system"));

    try{
      Store.onAuthStateChange(async (event, session)=>{
        if(event === "PASSWORD_RECOVERY"){
          state.authView = "reset";
          state.booted = true;
          render();
          return;
        }
        state.authSession = session;
        try{
          if(session && session.user){
            if(!state.profile || state.profile.id !== session.user.id){
              state.profile = await Store.ensureProfile(session.user);
              await loadProfileData();
            }
          } else {
            state.profile = null;
            state.authView = "login";
            state.authError = "";
          }
          state.dbError = false;
        }catch(e){
          state.dbError = true;
        }
        state.booted = true;
        render();
      });
    }catch(e){
      state.dbError = true;
      state.booted = true;
      render();
    }

    // register service worker for installability (best-effort)
    if("serviceWorker" in navigator){
      navigator.serviceWorker.register("sw.js").catch(()=>{});
    }
  }

  render(); // initial loading frame
  boot();

})();
</script>
</body>
</html>

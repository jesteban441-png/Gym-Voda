  function networkUnavailable(error){
    return navigator.onLine===false || error instanceof TypeError || /failed to fetch|networkerror|network request failed/i.test(error && error.message || "");
  }
  async function loadProfileData({confirmedNative=false}={}){
    if(!state.profile) return;
    const ownerId=state.profile.id, generation=authLoadGeneration;
    // V40: el peso corporal se pide con su propio catch, NO dentro del
    // Promise.all "duro" de abajo. Razón: si la migración v40 todavía no se
    // corrió, la tabla no existe y la consulta falla; un throw acá haría que
    // loadProfileData entero reviente, lo que prende state.dbError y manda a
    // TODA la app a la pantalla de error de conexión. La funcionalidad nueva
    // no puede tirar abajo la que ya funciona: si no está disponible, queda
    // en [] y el bloque "Mi peso" muestra el aviso.
    const pesoPromise = Store.listPesoCorporal(ownerId)
      .then((rows)=> ({ rows: rows||[], error: null }))
      .catch((e)=> ({ rows: [], error: (e && e.message) ? e.message : "No se pudo leer el peso corporal." }));

    let nativeIssue=null;
    if(VodaFitPersistence.capabilities.metadata && VodaFitPersistence.capabilities.rpc){
      try {
        const base=await Store.readRutina(ownerId);
        if(generation!==authLoadGeneration || !state.profile || state.profile.id!==ownerId) return;
        const reconciled=await nativeReconciler.recover(ownerId,base,navigator.onLine!==false);
        if(reconciled.ok && !reconciled.unchanged) confirmedNative=true;
        if(!reconciled.ok) nativeIssue=reconciled.code;
        if(reconciled.unchanged) await nativeLifecycle.recover(ownerId,base,navigator.onLine!==false);
      } catch(error){if(!networkUnavailable(error)) throw error;}
    }
    const outcomes=await Promise.allSettled([rutinaSync.load(ownerId),Store.listRegistros(ownerId),Store.listEntrenos(ownerId),pesoPromise]);
    if(outcomes[0].status!=="fulfilled") throw outcomes[0].reason;
    const loaded=outcomes[0].value;
    if(loaded.conflict && VodaFitSession.isNative(loaded.localDraft?.sesionActiva) && (VodaFitLifecycle.pending(loaded.localDraft.sesionActiva) || loaded.localDraft.__v48TerminalRequest)){
      // Mostrar el cierre local protegido aunque el remoto ya tenga un comprobante.
      loaded.data={...loaded.data,sesionActiva:deepClone(loaded.localDraft.sesionActiva),...(loaded.localDraft.__v48TerminalRequest?{__v48TerminalRequest:deepClone(loaded.localDraft.__v48TerminalRequest)}:{})};
    }
    const recoverableNative=VodaFitSession.isNative(loaded.data && loaded.data.sesionActiva);
    const historyUnavailable=outcomes.slice(1,3).some(x=>x.status==="rejected");
    if(historyUnavailable && !recoverableNative && !confirmedNative) throw outcomes.slice(1,3).find(x=>x.status==="rejected").reason;
    const registros=outcomes[1].status==="fulfilled"?outcomes[1].value:(confirmedNative?state.registros:[]);
    const entrenos=outcomes[2].status==="fulfilled"?outcomes[2].value:(confirmedNative?state.entrenos:[]);
    const peso=outcomes[3].value || {rows:[],error:"Sin conexión"};
    if(generation!==authLoadGeneration || !state.profile || state.profile.id!==ownerId) return;
    state.nativeReconcileIssue=nativeIssue;
    state.historyRefreshPending=confirmedNative && historyUnavailable;
    state.nativeOffline=recoverableNative && (!!loaded.offline || historyUnavailable);
    if(state.nativeOffline) state.tab="sesion";

    if(generation !== authLoadGeneration || !state.profile || state.profile.id !== ownerId || !loaded.ok) return;
    const raw=loaded.data;
    state.rutinaRaw=deepClone(raw); state.persistence=loaded; state.unresolvedSession=null;
    if(loaded.conflict) showToast("Hay cambios en otra copia. El borrador local se conserva; la sincronización quedó bloqueada.");
    else if(loaded.recovered) showToast("Borrador local recuperado. Hay cambios pendientes de sincronizar.");
    else if(loaded.localError) showToast("El almacenamiento local no está disponible en este dispositivo.");

    // Desde v19 se guardan DOS rutinas por cuenta ("personalizada" la que arma
    // el usuario a mano, "automatica" la última que generó el botón de rutina
    // automática) más cuál de las dos está activa en este momento. Si lo que
    // viene de la base es el formato viejo (una sola rutina, de antes de v19),
    // se migra sola tratándola como "personalizada" sin perder nada.
    // V31: se agrega un TERCER slot, "enfocada" (Rutina automática enfocada),
    // dentro del mismo blob `rutinas.data` — no se crea una tabla nueva ni una
    // segunda fuente de verdad. Los perfiles que vienen de v19/v30 no tienen
    // la clave: queda vacía y todo lo demás sigue igual.
    let slots;
    if(raw && (raw.personalizada || raw.automatica || raw.enfocada)){
      slots = {
        personalizada: (raw.personalizada && raw.personalizada.days) ? raw.personalizada : { days: [] },
        automatica: (raw.automatica && raw.automatica.days) ? raw.automatica : { days: [] },
        enfocada: (raw.enfocada && raw.enfocada.days) ? raw.enfocada : { days: [] },
      };
      state.activeSlot = RUTINA_SLOTS.indexOf(raw.activeSlot)!==-1 ? raw.activeSlot : "personalizada";
    } else {
      slots = { personalizada: (raw && raw.days) ? raw : { days: [] }, automatica: { days: [] }, enfocada: { days: [] } };
      state.activeSlot = "personalizada";
    }
    // V34: los nombres de ejercicio de las rutinas guardadas se canonicalizan
    // acá, al cargar, ANTES de que cualquier pantalla los use. Es lo que hace
    // que "Mi rutina" muestre el nombre canónico actual y que las
    // comparaciones contra el historial (que ya viene canonicalizado por
    // rowToRegistro) coincidan de los dos lados.
    //
    // Solo cambia el campo `nombre`; los `id` de cada ejercicio quedan igual,
    // así que la sesión en curso (que indexa `sets`/`setLogs` por id) se
    // restaura sin tocar nada. No fuerza ninguna escritura: el blob de
    // `rutinas.data` se reescribe canonicalizado la próxima vez que algo
    // llame a persistRutina() por su cuenta.
    canonicalizeRutinaSlots(slots);
    state.rutinaSlots = slots;
    state.rutina = slots[state.activeSlot];
    state.registros = registros || [];
    state.entrenos = entrenos || [];
    // V40
    state.pesoCorporal = peso.rows;
    state.pesoCorporalError = peso.error;
    // V28: recuperar el entrenamiento en curso (si el usuario cerró la app o
    // recargó con una sesión activa sin guardar/finalizar). Se guarda dentro
    // del mismo blob `rutinas.data` (ver persistRutina) para no crear una
    // segunda fuente de verdad ni una tabla nueva. Se valida que el día
    // todavía exista en el slot en el que se guardó la sesión. V48.1A conserva
    // una sesión no interpretable en unresolvedSession y bloquea reemplazarla.
    state.session = null;
    if(raw && raw.sesionActiva && raw.sesionActiva.schemaVersion===48){
      state.unresolvedSession=deepClone(raw.sesionActiva);
      if(!nativeSession()) showToast("El borrador V48 no puede interpretarse. Se conserva sin modificar.");
    } else if(raw && raw.sesionActiva && raw.sesionActiva.dayId && raw.sesionActiva.sets){
      const s = raw.sesionActiva;
      // V29: una sesión de Día Especial trae su propio día embebido.
      const isSpecial = s.slot==="especial";
      // V31: "enfocada" es un slot más de rutina (vive en rutinaSlots), a
      // diferencia de "especial" que embebe su propio día.
      const slot = isSpecial ? "especial" : (RUTINA_SLOTS.indexOf(s.slot)!==-1 ? s.slot : "personalizada");
      const slotDays = isSpecial ? [] : ((slots[slot] && slots[slot].days) || []);
      const day = isSpecial
        ? ((s.specialDay && s.specialDay.id===s.dayId && Array.isArray(s.specialDay.exercises)) ? s.specialDay : null)
        : slotDays.find(d=>d.id===s.dayId);
      if(day){
        // v28.1: setLogs puede faltar (sesión guardada antes de este cambio,
        // o dato corrupto) — se completa con nulls del mismo largo que
        // `sets` para ese ejercicio en vez de romper la restauración.
        const setLogs = {};
        Object.keys(s.sets).forEach(exId=>{
          const savedLog = (s.setLogs && s.setLogs[exId]) || [];
          const n = s.sets[exId].length;
          setLogs[exId] = new Array(n).fill(null).map((_,i)=> savedLog[i] || null);
        });
        state.session = { ...s, dayId: s.dayId, slot, dayNombre: s.dayNombre||day.nombre, startedAt: s.startedAt||Date.now(), sets: s.sets, setLogs };
        // El día embebido del Día Especial no vive en rutinaSlots, así que
        // se canonicaliza por separado.
        if(isSpecial){ canonicalizeDayNames(day); state.session.specialDay = day; }
      } else {
        state.unresolvedSession=deepClone(s);
      }
    }
    if(raw && raw.sesionActiva && !state.session && !state.unresolvedSession)
      state.unresolvedSession=deepClone(raw.sesionActiva);
  }


  // ---- V34: canonicalización de los nombres de ejercicio de una rutina.
  // Reescribe SOLO el campo `nombre` de cada ejercicio, en el mismo objeto (no
  // clona): los `id`, series, reps, notas y el orden quedan intactos, así que
  // una sesión en curso —que indexa `sets`/`setLogs` por `id`— sigue válida.
  //
  // Es idempotente (aplicarla dos veces da lo mismo) y no destructiva: si un
  // nombre no resuelve a ningún canónico, se lo deja exactamente como está.
  // Nada se pierde y nada se inventa.
  function canonicalizeDayNames(day){
    if(!day || !Array.isArray(day.exercises)) return day;
    day.exercises.forEach(ex=>{
      if(ex && ex.nombre) ex.nombre = canonicalExerciseName(ex.nombre);
    });
    return day;
  }
  function canonicalizeRutinaSlots(slots){
    if(!slots) return slots;
    Object.keys(slots).forEach(k=>{
      const days = slots[k] && slots[k].days;
      if(Array.isArray(days)) days.forEach(canonicalizeDayNames);
    });
    return slots;
  }
  // V31: los tres slots de rutina que pueden estar guardados a la vez. El
  // orden es el que se muestra en la pestaña de Rutina. "especial" NO está
  // acá: el Día Especial no vive en rutinaSlots (embebe su propio día).
  const RUTINA_SLOTS = ["personalizada","automatica","enfocada"];
  const RUTINA_SLOT_LABELS = { personalizada:"Mi rutina", automatica:"Rutina automática", enfocada:"Rutina enfocada" };

  // Guarda las TRES rutinas (personalizada + automática + enfocada), cuál está activa, y
  // (desde v28) el entrenamiento en curso si lo hay, en una sola fila de la
  // base (misma tabla `rutinas` de siempre, mismo blob `data`). Como
  // `state.rutina` es siempre el MISMO objeto que `state.rutinaSlots[state.activeSlot]`
  // (por referencia), cualquier cambio hecho sobre `state.rutina.days` ya está
  // reflejado en `state.rutinaSlots` antes de llamar a esta función. Reusar
  // esta única vía de persistencia (en vez de una tabla/migración nueva) es
  // lo que permite que "Guardar entrenamiento" y el resumen automático al
  // reabrir la app funcionen sin crear una segunda fuente de verdad.
  async function persistRutina(){
    if(!state.profile) return {ok:false,code:"NOT_AUTHENTICATED"};
    const ownerId=state.profile.id, generation=authLoadGeneration;
    const data={...(state.rutinaRaw || {}),
      personalizada: state.rutinaSlots.personalizada,
      automatica: state.rutinaSlots.automatica,
      enfocada: state.rutinaSlots.enfocada,
      activeSlot: state.activeSlot,
      sesionActiva: state.session || state.unresolvedSession,
    };
    let result=await rutinaSync.save(data);
    if(result.code==="NATIVE_LOCAL_ONLY" && result.localSaved){
      result={...result,ok:true,localOnly:true,envelope:{data:deepClone(data),revision:state.persistence && state.persistence.revision,
        clienteV48:!!(state.persistence && state.persistence.clienteV48),schemaReady:!!(state.persistence && state.persistence.schemaReady)}};
    }
    if(generation!==authLoadGeneration || !state.profile || state.profile.id!==ownerId) return result;
    state.persistence={...state.persistence,...(result.ok ? result.envelope : {}),lastSave:result,pending:!result.ok || !!result.localOnly};
    if(result.ok) state.rutinaRaw=deepClone(result.envelope.data);
    if(!result.ok || result.conflict || result.localError){
      const conflict=result.code==="REVISION_CONFLICT" || result.code==="LOCAL_CONFLICT" || result.conflict;
      showToast(conflict ? "Conflicto de guardado. Conservamos las copias; no sobrescribimos los cambios remotos."
        : result.ok ? "Guardado remoto correcto; no se pudo mantener la copia local."
        : result.localSaved ? "No se pudo sincronizar. El borrador quedó guardado en este dispositivo."
        : "No se pudo guardar. Conservá la aplicación abierta para no perder los cambios.");
    }
    return result;
  }

  async function selectRutinaSlot(slot){
    if(state.activeSlot === slot) return;
    state.activeSlot = slot;
    state.rutina = state.rutinaSlots[slot];
    await persistRutina();
    renderScreen();
  }

  /* ================= RUTINA ================= */
  // V34: los nombres salen canonicalizados. Las rutinas ya se canonicalizan al
  // cargar (canonicalizeRutinaSlots), así que en la práctica esto es una red de
  // seguridad para un día recién armado en memoria; deja el selector del
  // formulario y el del filtro alineados con el historial unificado.
  function allExerciseNames(){
    const set = new Set();
    (state.rutina.days||[]).forEach(d=> (d.exercises||[]).forEach(ex=> set.add(canonicalExerciseName(ex.nombre))));
    return Array.from(set);
  }

  function screenRutina(){
    const days = state.rutina.days||[];
    const isAuto = state.activeSlot === "automatica";
    const slot = state.activeSlot;
    const nAutomatica = (state.rutinaSlots.automatica.days||[]).length;
    const nEnfocada = ((state.rutinaSlots.enfocada||{}).days||[]).length;
    const slotCount = { personalizada:(state.rutinaSlots.personalizada.days||[]).length, automatica:nAutomatica, enfocada:nEnfocada };
    // V31: tres slots. El botón de cada uno conserva el mismo comportamiento
    // de siempre (cambiar de slot no borra los otros).
    const slotBtns = RUTINA_SLOTS.map(s=>
      `<button data-rutina-slot="${s}" class="${slot===s?"active":""}">${RUTINA_SLOT_LABELS[s]}${slotCount[s]?` (${slotCount[s]})`:""}</button>`
    ).join("");
    const slotTitle = { personalizada:"Tu rutina", automatica:"Rutina automática", enfocada:"Rutina enfocada" }[slot] || "Tu rutina";
    return `
      ${rachaCardHtml()}
      ${(state.session || nativeSession()) ? sessionResumeBannerHtml() : ""}
      <div class="segmented" style="margin-bottom:2px">
        ${slotBtns}
      </div>
      <p class="helptext" style="margin:2px 0 8px">Tenés tres rutinas guardadas por separado — cambiar de pestaña no borra las otras, así podés compararlas o usar la que quieras.</p>
      <button class="btn btn-primary btn-block" id="btn-auto-routine">${icon("shuffle")} ${nAutomatica?"Generar otra rutina automática":"Generar rutina automática"}</button>
      <button class="btn btn-outline btn-block" id="btn-focused-routine" style="margin-top:8px; border-color:var(--accent); color:var(--accent)">${icon("shuffle")} ${nEnfocada?"Editar rutina enfocada":"Generar rutina enfocada"}</button>
      <button class="btn btn-outline btn-block" id="btn-special-day" style="margin-top:8px; border-color:var(--accent); color:var(--accent)">${icon("plus")} Día Especial</button>
      <div class="row" style="gap:8px; margin-top:8px">
        <button class="btn btn-outline" style="flex:1" id="btn-explorar-musculos">${icon("search")} Explorar ejercicios</button>
        ${days.length>0 ? `<button class="btn btn-ghost" style="flex:1" id="btn-export-pdf">${icon("download")} Exportar PDF</button>` : ""}
      </div>
      <div class="section-title">
        <h2>${slotTitle}</h2>
        <span class="muted">${days.length} día${days.length===1?"":"s"}</span>
      </div>
      ${days.length===0 ? `
        <div class="card empty">
          ${icon("routine")}
          <h3>${isAuto ? "Todavía no generaste una rutina automática" : "Todavía no armaste tu rutina"}</h3>
          <p>${isAuto
            ? 'Apretá "Rutina automática" arriba para armar una completa sola, según tus días por semana y tu sexo — después la podés editar como cualquier otra.'
            : 'Agregá un día (por ejemplo "Día 1 — Pecho y tríceps") y después sumale los ejercicios con series y repeticiones, o probá la rutina automática arriba.'}</p>
          <button class="btn btn-primary" id="btn-add-day">${icon("plus")} Agregar día</button>
        </div>
      ` : `
        ${days.map((d,i)=> dayCard(d,i)).join("")}
        <button class="btn btn-outline btn-block" id="btn-add-day">${icon("plus")} Agregar día</button>
      `}
    `;
  }

  // ---- V29: historial semanal navegable ----
  // Semana 0 = la actual (lunes a domingo, mismo isoWeekMonday que usa
  // computeRacha). Se puede ir hacia atrás hasta la semana del registro más
  // viejo (entrenos o registros de peso); nunca hacia semanas futuras.
  // "Reiniciar" el contador al empezar una semana nueva no borra nada: las
  // semanas anteriores se calculan siempre desde los mismos datos guardados.
  function weekRangeFor(offset){
    const mon = isoWeekMonday(new Date());
    const start = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate()-7*offset);
    const end = new Date(start.getFullYear(), start.getMonth(), start.getDate()+6);
    return { start: ymd(start), end: ymd(end), startD: start, endD: end };
  }
  function maxWeekOffset(){
    let oldest = null;
    (state.entrenos||[]).forEach(e=>{ if(e.date && (!oldest || e.date<oldest)) oldest = e.date; });
    (state.registros||[]).forEach(r=>{ if(r.date && (!oldest || r.date<oldest)) oldest = r.date; });
    if(!oldest) return 0;
    const p = oldest.split("-").map(n=>parseInt(n,10));
    const oldMon = isoWeekMonday(new Date(p[0], p[1]-1, p[2]));
    const curMon = isoWeekMonday(new Date());
    return Math.max(0, Math.round((curMon - oldMon) / (7*24*3600*1000)));
  }
  function weekShortLabel(rg){
    const d1 = rg.startD, d2 = rg.endD;
    const m1 = MONTH_NAMES[d1.getMonth()].slice(0,3).toLowerCase(), m2 = MONTH_NAMES[d2.getMonth()].slice(0,3).toLowerCase();
    return d1.getMonth()===d2.getMonth() ? `${d1.getDate()} al ${d2.getDate()} ${m2}` : `${d1.getDate()} ${m1} al ${d2.getDate()} ${m2}`;
  }
  function weekDetailHtml(rg){
    const ents = (state.entrenos||[]).filter(e=> e.date>=rg.start && e.date<=rg.end)
      .slice().sort((a,b)=> a.date===b.date ? (a.createdAt||0)-(b.createdAt||0) : (a.date<b.date?-1:1));
    const regs = (state.registros||[]).filter(r=> r.date>=rg.start && r.date<=rg.end)
      .slice().sort((a,b)=> a.date===b.date ? (a.createdAt||0)-(b.createdAt||0) : (a.date<b.date?-1:1));
    const entsHtml = ents.length ? ents.map(e=>`
      <div class="logrow">
        <div>
          <div class="lex">${esc(e.dayNombre||"Entrenamiento")}</div>
          <div class="ldate">${esc(fmtDate(e.date))}${e.isManual?" · marcado a mano":""}${e.isSpecial?` · <span class="special-badge">Día Especial</span>`:""}</div>
        </div>
        ${e.isManual ? `<div class="lsub">Sin detalle</div>` : `<div><div class="lval num">${e.setsCompletados}/${e.setsTotales}</div><div class="lsub">series</div></div>`}
      </div>`).join("") : `<p class="helptext">Sin entrenamientos registrados esta semana.</p>`;
    const regsHtml = regs.length ? regs.map(r=>`
      <div class="logrow">
        <div><div class="lex">${esc(r.exercise)}${r.setNumber?` · serie ${r.setNumber}`:""}</div><div class="ldate">${esc(fmtDate(r.date))}</div></div>
        <div><div class="lval num">${esc(r.peso)} kg</div><div class="lsub">${esc(r.series||"-")}×${esc(r.reps||"-")}</div></div>
      </div>`).join("") : `<p class="helptext">Sin registros de peso esta semana.</p>`;
    return `
      <div class="week-list">
        <div class="helptext" style="font-weight:700">Entrenamientos</div>
        <div class="loglist">${entsHtml}</div>
        <div class="helptext" style="font-weight:700; margin-top:6px">Registros de peso (${regs.length})</div>
        <div class="loglist">${regsHtml}</div>
      </div>`;
  }

  // V42: la tarjeta de la semana se muestra en Rutina Y en Perfil. El `scope`
  // elige QUÉ claves de `state` lleva la navegación semanal, para que mover la
  // semana en Perfil no mueva la de Rutina. Sin argumento se comporta igual
  // que antes (scope "rutina"), así la llamada existente no cambia.
  const WEEK_SCOPE_KEYS = {
    rutina: { offset:"weekOffset", detail:"weekDetailOpen" },
    perfil: { offset:"perfilWeekOffset", detail:"perfilWeekDetailOpen" },
  };
  function weekScopeKeys(scope){ return WEEK_SCOPE_KEYS[scope] || WEEK_SCOPE_KEYS.rutina; }

  function rachaCardHtml(scope){
    const sk = weekScopeKeys(scope);
    const goal = state.profile.metaSemanal || 3;
    const all = state.entrenos||[];
    // V29: el objetivo semanal NO cuenta los Día Especial (4/4 sigue 4/4).
    const normal = all.filter(e=>!e.isSpecial);
    const r = computeRacha(normal, goal);
    // La RACHA se deja exactamente como estaba en v28.1 (lista completa):
    // hoy la racha = semanas seguidas que cumplieron el objetivo, o sea que
    // depende del mismo contador. No se modifica sin la confirmación de Juan
    // (ver reporte V29).
    const streak = computeRacha(all, goal).streak;
    const frase = fraseDelDia();
    const maxOff = maxWeekOffset();
    const offset = Math.min(Math.max(0, state[sk.offset]||0), maxOff);
    state[sk.offset] = offset;
    const rg = weekRangeFor(offset);
    const inWeek = all.filter(e=> e.date>=rg.start && e.date<=rg.end);
    const specialCount = inWeek.filter(e=>e.isSpecial).length;
    const normalCount = inWeek.length - specialCount;
    const daysTrained = new Set(inWeek.map(e=>e.date)).size;
    const nav = `
      <div class="week-nav">
        <span class="iconbtn" id="week-prev" aria-disabled="${offset>=maxOff}" title="Semana anterior">${icon("chevronLeft")}</span>
        <span class="week-nav-label">${offset===0 ? "Esta semana" : "Semana del "+weekShortLabel(rg)}</span>
        <span class="iconbtn" id="week-next" aria-disabled="${offset===0}" title="Semana siguiente">${icon("chevronRight")}</span>
      </div>`;
    const extra = `<p class="helptext week-extra">Días entrenados: <b>${daysTrained}</b>${specialCount?` · +${specialCount} Día Especial (no suma al objetivo)`:""}</p>`;
    const detailOpen = !!state[sk.detail];
    const detailToggle = `<button class="btn btn-ghost btn-sm" id="week-toggle" style="align-self:flex-start">${detailOpen?"Ocultar detalle":"Ver detalle de la semana"}</button>`;
    if(offset>0){
      return `
        <div class="card racha-card">
          ${nav}
          <div class="racha-count num">${normalCount} entrenamiento${normalCount===1?"":"s"}</div>
          ${extra}
          <p class="helptext">El objetivo semanal de semanas anteriores no se guarda, por eso acá solo se muestra lo que entrenaste.</p>
          ${detailToggle}
          ${detailOpen ? weekDetailHtml(rg) : ""}
        </div>
      `;
    }
    const met = r.remaining<=0;
    return `
      <div class="card racha-card" style="${met?"background:var(--success-soft)":""}">
        ${nav}
        <div class="racha-top">
          <div>
            <div class="racha-count num">${r.thisWeekCount} / ${goal} entrenamientos</div>
          </div>
          ${streak>0 ? `<div class="racha-streak"><div class="fire">🔥${streak}</div><div class="helptext">semana${streak===1?"":"s"} seguida${streak===1?"":"s"}</div></div>` : ""}
        </div>
        ${extra}
        <p class="helptext" style="font-size:13px; color:var(--text)">${
          met ? "¡Meta semanal cumplida! 🎉"
              : `Te ${r.remaining===1?"falta":"faltan"} ${r.remaining} entrenamiento${r.remaining===1?"":"s"} — tenés ${r.daysLeft} día${r.daysLeft===1?"":"s"} para lograrlo.`
        }</p>
        <p class="helptext" style="font-style:italic">${esc(frase)}</p>
        ${detailToggle}
        ${detailOpen ? weekDetailHtml(rg) : ""}
      </div>
    `;
  }

  // V42: handlers de la navegación semanal, compartidos por Rutina y Perfil.
  // La única diferencia entre los dos es a qué claves de `state` escriben
  // (ver WEEK_SCOPE_KEYS), así que la lógica no se duplica.
  function mountWeekNav(el, scope){
    const sk = weekScopeKeys(scope);
    const prev = el.querySelector("#week-prev");
    if(prev) prev.onclick = ()=>{ if(prev.getAttribute("aria-disabled")==="true") return; state[sk.offset] = (state[sk.offset]||0)+1; renderScreen(); };
    const next = el.querySelector("#week-next");
    if(next) next.onclick = ()=>{ if(next.getAttribute("aria-disabled")==="true") return; state[sk.offset] = Math.max(0,(state[sk.offset]||0)-1); renderScreen(); };
    const toggle = el.querySelector("#week-toggle");
    if(toggle) toggle.onclick = ()=>{ state[sk.detail] = !state[sk.detail]; renderScreen(); };
  }

  // V28: helper único para ubicar el día de la sesión activa. Antes se hacía
  // `state.rutina.days.find(...)`, que asume que la rutina activa hoy es la
  // misma en la que se inició el entrenamiento — se rompía si el usuario
  // cambiaba de slot (Mi rutina ↔ Rutina automática) mientras entrenaba, y
  // era directamente incorrecto al RESUMIR una sesión guardada después de
  // recargar la app (el slot activo al recargar puede no ser el de la
  // sesión). Ahora la sesión guarda su propio `slot` y se busca siempre ahí.
  function nativeSession(){
    const s=state.session || state.unresolvedSession;
    return VodaFitSession.isNative(s) ? s : null;
  }
  function sessionDay(){
    if(nativeSession()) return nativeSession().day;
    if(!state.session) return null;
    // V29: el Día Especial no pertenece a ninguna rutina — viaja dentro de la sesión.
    if(state.session.slot==="especial") return state.session.specialDay || null;
    const slotObj = state.rutinaSlots[state.session.slot] || state.rutina;
    return (slotObj.days||[]).find(d=>d.id===state.session.dayId) || null;
  }

  function sessionProgress(){
    if(nativeSession()) return VodaFitSession.progress(nativeSession());
    const setsObj = (state.session && state.session.sets) || {};
    let total=0, done=0;
    Object.keys(setsObj).forEach(exId=>{ (setsObj[exId]||[]).forEach(v=>{ total++; if(v) done++; }); });
    return { done, total };
  }

  function sessionResumeBannerHtml(){
    const session=nativeSession() || state.session;
    const day = sessionDay();
    const p = sessionProgress();
    return `
      <div class="card stack" style="border-color:var(--accent)">
        <div>
          <div style="font-weight:700">Entrenamiento en curso${session.slot==="especial" ? ` <span class="special-badge">Día Especial</span>` : ""}</div>
          <div class="helptext">${esc(day?day.nombre:(session.dayNombre||""))} · ${p.done}/${p.total} series completadas</div>
          ${nativeSession()?nativeLifecycleHtml(nativeSession()):''}
        </div>
        <div class="row" style="gap:8px">
          <button class="btn btn-primary btn-sm" style="flex:1" id="btn-resume-session">Continuar entrenamiento</button>
          <button class="btn btn-outline btn-sm" id="btn-finalize-session">Finalizar</button>
        </div>
      </div>
    `;
  }

  // Solo presentación: si el nombre del día sigue el patrón "Día N — detalle"
  // (con guion largo, el que usan las plantillas de la rutina automática) lo
  // separamos visualmente en un título principal ("Día N") y un subtítulo
  // secundario (el detalle de grupos musculares). No toca ni reescribe
  // day.nombre — si el usuario puso un nombre manual que no sigue ese patrón,
  // se muestra completo y sin partir, como siempre.
  function formatDayTitle(nombre){
    const m = /^(.*?)\s+—\s+(.*)$/.exec(nombre||"");
    if(!m) return { main: nombre||"", sub: null };
    return { main: m[1], sub: m[2] };
  }

  function dayCard(day, idx){
    const open = state.dayOpen[day.id] !== false; // default open
    const editMode = !!state.dayEditMode[day.id];
    const exs = day.exercises||[];
    const t = formatDayTitle(day.nombre);
    return `
      <div class="card day-card" data-day="${day.id}">
        <div class="day-head" data-toggle="${day.id}" style="cursor:pointer">
          <h3 class="day-title"><span class="day-title-main">${esc(t.main)}</span>${t.sub?`<span class="day-title-sub">${esc(t.sub)}</span>`:""}</h3>
          <div class="actions">
            <span class="iconbtn" data-edit-day="${day.id}" title="Renombrar / mover día">${icon("edit")}</span>
            <span class="iconbtn danger" data-del-day="${day.id}" title="Eliminar día">${icon("trash")}</span>
            <span class="iconbtn" style="transform:rotate(${open?"180":"0"}deg)">${icon("chevronDown")}</span>
          </div>
        </div>
        <div class="row" style="gap:8px; margin-top:8px">
          <button class="btn btn-outline btn-sm" data-start-session="${day.id}" style="flex:1; border-color:var(--accent); color:var(--accent)">${icon("play")} Entrenar este día</button>
          ${exs.length>0 ? `<button class="btn ${editMode?"btn-primary":"btn-ghost"} btn-sm" data-toggle-editex="${day.id}">${icon("edit")} ${editMode?"Listo":"Editar ejercicios"}</button>` : ""}
        </div>
        ${estiramientosDeDia(day).length ? `<button class="btn btn-ghost btn-sm btn-block" data-estir-day="${day.id}" style="margin-top:6px">${icon("info")} Estiramientos del día</button>` : ""}
        ${open ? `
          <div class="exlist">
            ${exs.length===0 ? `<p class="helptext">Sin ejercicios todavía.</p>` : exs.map(ex=>`
              <div class="exrow">
                <div>
                  <div class="exname">${esc(ex.nombre)}</div>
                  <div class="exmeta">${esc(ex.series)} series × ${esc(ex.reps)} reps${ex.notas? " · "+esc(ex.notas):""}</div>
                </div>
                <div class="actions">
                  <span class="iconbtn" data-howto-ex="${day.id}|${ex.id}" title="Cómo hacerlo">${icon("info")}</span>
                  <span class="iconbtn" data-log-ex="${esc(ex.nombre)}" title="Registrar peso">${icon("log")}</span>
                  ${editMode ? `
                    <span class="iconbtn" data-edit-ex="${day.id}|${ex.id}" title="Editar">${icon("edit")}</span>
                    <span class="iconbtn danger" data-del-ex="${day.id}|${ex.id}" title="Eliminar">${icon("trash")}</span>
                  ` : ""}
                </div>
              </div>
            `).join("")}
          </div>
          <button class="btn btn-ghost btn-sm" data-add-ex="${day.id}">${icon("plus")} Ejercicio</button>
        ` : ""}
      </div>
    `;
  }

  function openDayModal(existing){
    const m = openModal(`
      <h3>${existing? "Editar día" : "Nuevo día"}</h3>
      <div class="field">
        <label>Nombre del día</label>
        <input type="text" id="day-name" placeholder='Ej: Día 1 — Pecho y tríceps' maxlength="40" value="${existing?esc(existing.nombre):""}">
      </div>
      ${existing ? `
        <div class="row" style="gap:8px">
          <button class="btn btn-ghost btn-sm" data-act="move-up" style="flex:1">${icon("arrowUp")} Subir</button>
          <button class="btn btn-ghost btn-sm" data-act="move-down" style="flex:1">${icon("arrowDown")} Bajar</button>
        </div>
      ` : ""}
      <div class="modal-actions">
        <button class="btn btn-ghost" data-act="cancel">Cancelar</button>
        <button class="btn btn-primary" data-act="save">Guardar</button>
      </div>
    `);
    m.querySelector("#day-name").focus();
    m.querySelector('[data-act="cancel"]').onclick = closeModal;
    const upBtn = m.querySelector('[data-act="move-up"]');
    const downBtn = m.querySelector('[data-act="move-down"]');
    if(upBtn) upBtn.onclick = async ()=>{ await moveDay(existing.id,-1); closeModal(); };
    if(downBtn) downBtn.onclick = async ()=>{ await moveDay(existing.id,1); closeModal(); };
    m.querySelector('[data-act="save"]').onclick = async ()=>{
      const nombre = m.querySelector("#day-name").value.trim();
      if(!nombre) return;
      if(existing){
        existing.nombre = nombre;
      } else {
        state.rutina.days.push({ id:uid(), nombre, exercises:[] });
      }
      await persistRutina();
      closeModal();
      renderScreen();
    };
  }

  async function moveDay(id, dir){
    const arr = state.rutina.days;
    const i = arr.findIndex(d=>d.id===id);
    const j = i+dir;
    if(i<0||j<0||j>=arr.length) return;
    [arr[i],arr[j]] = [arr[j],arr[i]];
    await persistRutina();
    renderScreen();
  }

  async function moveExercise(day, exId, dir){
    const arr = day.exercises;
    const i = arr.findIndex(x=>x.id===exId);
    const j = i+dir;
    if(i<0||j<0||j>=arr.length) return;
    [arr[i],arr[j]] = [arr[j],arr[i]];
    await persistRutina();
    renderScreen();
  }

  function openExerciseModal(day, existing){
    const m = openModal(`
      <h3>${existing? "Editar ejercicio":"Nuevo ejercicio"}</h3>
      <div class="field">
        <label>Ejercicio</label>
        <div class="ac-wrap">
          <input type="text" id="ex-name" placeholder="Ej: Press banca" maxlength="40" value="${existing?esc(existing.nombre):""}" autocomplete="off">
          <div class="ac-list" id="ex-name-ac"></div>
        </div>
      </div>
      <div id="ex-muscle-preview">${muscleDiagramFor(existing?existing.nombre:"")}</div>
      <div class="field-row">
        <div class="field">
          <label>Series</label>
          <input type="number" id="ex-series" min="1" max="20" value="${existing?esc(existing.series):"3"}">

      </div>
      ${existing ? `
        <div class="row" style="gap:8px">
          <button class="btn btn-ghost btn-sm" data-act="move-up" style="flex:1">${icon("arrowUp")} Subir</button>
          <button class="btn btn-ghost btn-sm" data-act="move-down" style="flex:1">${icon("arrowDown")} Bajar</button>

      <div class="modal-actions">

        <button class="btn btn-primary" data-act="save">Guardar</button>
      </div>
    `);
    m.querySelector("#ex-name").focus();
    const nameInput = m.querySelector("#ex-name");
    const imagenInput = m.querySelector("#ex-imagen");
    const musclePreview = m.querySelector("#ex-muscle-preview");
    const updateMusclePreview = ()=>{
      const url = imagenInput.value.trim();
      musclePreview.innerHTML = url

        : muscleDiagramFor(nameInput.value.trim());

    attachAutocomplete(nameInput, m.querySelector("#ex-name-ac"), updateMusclePreview);
    nameInput.addEventListener("input", updateMusclePreview);
    imagenInput.addEventListener("input", updateMusclePreview);
    m.querySelector('[data-act="cancel"]').onclick = closeModal;
    const upBtn = m.querySelector('[data-act="move-up"]');

    if(downBtn) downBtn.onclick = async ()=>{ await moveExercise(day, existing.id,1); closeModal(); };
    m.querySelector('[data-act="save"]').onclick = async ()=>{
      const nombre = m.querySelector("#ex-name").value.trim();

      // más abajo — sin esto, cargar varios ejercicios seguidos obligaba a
      // scrollear la lista entera cada vez para volver a encontrarlo. Se lo
      // lleva a la vista automáticamente (sin agregar ningún botón/UI nueva)
      // solo cuando se acaba de AGREGAR uno (no al editar uno existente).
      if(isNew){
        const addBtn = document.querySelector(`[data-add-ex="${day.id}"]`);
        if(addBtn) addBtn.scrollIntoView({ block:"center", behavior:"smooth" });
      }
    };
  }

  /* ================= GENERADOR DE RUTINA AUTOMÁTICA ================= */
  // Palabras clave para distinguir ejercicios "compuestos" (multiarticulares) de
  // "aislamiento" — así cada día generado combina un poco de ambos en vez de,
  // por ej., 5 variantes de curl para bíceps.
  const COMPOUND_KEYWORDS = ["press","sentadilla","peso muerto","dominadas","remo","prensa","fondos","hip thrust","zancada","step up","jalón"];
  function isCompoundExercise(name){
    const n = normalizeTxt(name);
    return COMPOUND_KEYWORDS.some(k=> n.includes(normalizeTxt(k)));
  }
  function shuffleArr(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
    return a;
  }
  // V31: el orden dentro de cada tramo deja de ser un shuffle plano y pasa
  // por el sorteo ponderado único (predominancia × edad/equipamiento ×
  // diversidad de patrón). Se conserva la prioridad estructural de siempre:
  // primero los ejercicios que todavía no se usaron en la semana, después
  // los repetidos. opts.edad es opcional — sin edad, ageEquipmentWeight
  // devuelve 1 y el comportamiento es el de antes más la predominancia.
  function pickFromPool(pool, count, avoidSet, opts){
    if(count<=0 || !pool.length) return [];
    opts = opts || {};
    const usedPatterns = opts.usedPatterns || new Set();
    const fresh = pool.filter(n=>!avoidSet.has(n));
    const used = pool.filter(n=>avoidSet.has(n));
    const chosen = weightedPickMany(fresh, count, { edad:opts.edad, usedPatterns });
    if(chosen.length < count){
      chosen.push(...weightedPickMany(used, count-chosen.length, { edad:opts.edad, usedPatterns }));
    }
    chosen.forEach(n=>avoidSet.add(n));
    return chosen.slice(0,count);
  }
  // opts.forceLegFocus: lista de sub-focos (["glutes","quads"]) que hay que
  // garantizar sí o sí dentro del cupo de "piernas" (usado para Femenino, donde
  // Juan pidió que glúteo y cuádriceps sean obligatorios en cada día de pierna).
  // opts.riskyExclude: Set de nombres a evitar (perfil 50+, ver EXERCISES_RISKY_50PLUS).
  // V31: opts.edad se propaga a pickFromPool para que la capa de
  // edad/equipamiento actúe también acá; opts.usedPatterns se comparte entre
  // todas las tomas del mismo día para que la diversidad de patrón valga
  // dentro del día entero y no solo dentro de cada tramo.
  function pickForSubgroup(subgroup, count, avoidSet, opts){
    opts = opts || {};
    const pool = subgroupPools(opts.riskyExclude)[subgroup] || [];
    if(!pool.length || count<=0) return [];
    const pOpts = { edad: opts.edad, usedPatterns: opts.usedPatterns || new Set() };
    let chosen = [];
    if(opts.forceLegFocus && opts.forceLegFocus.length){
      const focusPools = legFocusPools(opts.riskyExclude);
      opts.forceLegFocus.forEach(cat=>{
        if(chosen.length>=count) return;
        const catPool = (focusPools[cat]||[]).filter(n=>pool.indexOf(n)!==-1 && chosen.indexOf(n)===-1);
        if(catPool.length) chosen = chosen.concat(pickFromPool(catPool, 1, avoidSet, pOpts));
      });
    }
    const remaining = count - chosen.length;
    if(remaining>0){
      const restPool = pool.filter(n=>chosen.indexOf(n)===-1);
      const compounds = restPool.filter(isCompoundExercise);
      const isolations = restPool.filter(n=>!isCompoundExercise(n));
      const wantCompound = Math.min(compounds.length, Math.max(1, Math.round(remaining*0.4)));
      let more = pickFromPool(compounds, wantCompound, avoidSet, pOpts);
      const secondPool = isolations.length ? isolations : restPool;
      more = more.concat(pickFromPool(secondPool.filter(n=>more.indexOf(n)===-1), remaining-more.length, avoidSet, pOpts));
      if(more.length < remaining) more = more.concat(pickFromPool(restPool.filter(n=>more.indexOf(n)===-1), remaining-more.length, avoidSet, pOpts));
      chosen = chosen.concat(more);
    }
    return Array.from(new Set(chosen)).slice(0,count);
  }

  // ---- Splits (convención real: full body / push-pull-legs / upper-lower /
  // bro split según frecuencia semanal — no listas al azar). Cada día define
  // solo QUÉ subgrupos entrenar; CUÁNTOS ejercicios de cada uno sale de
  // distributeCount() más abajo, según sexo y días/semana. Se garantiza que
  // los 6 grupos musculares (Pecho/Espalda/Piernas/Hombros/Brazos/Core)
  // aparecen al menos una vez en la semana completa para cualquier cantidad
  // de días — Brazos cubre bíceps+tríceps.
  const SPLIT_DAYS = {
    1: [ // Full body único — con una sola sesión semanal hay que cubrir todo el cuerpo esa vez
      { nombre:"Día único — Full body", groups:["pecho","espalda","piernas","hombros","biceps","triceps","core"] },
    ],
    2: [ // Full body x2 (frecuencia alta compensa con full body, no hay margen para split)
      { nombre:"Día 1 — Full body A", groups:["pecho","espalda","piernas","hombros","biceps","triceps","core"] },
      { nombre:"Día 2 — Full body B", groups:["pecho","espalda","piernas","hombros","biceps","triceps","core"] },
    ],
    3: [ // Push / Pull / Legs clásico
      { nombre:"Día 1 — Empuje (pecho/hombro/tríceps)", groups:["pecho","hombros","triceps"] },
      { nombre:"Día 2 — Tirón (espalda/bíceps)", groups:["espalda","biceps","core"] },
      { nombre:"Día 3 — Piernas", groups:["piernas","core"] },
    ],
    4: [ // Upper / Lower x2
      { nombre:"Día 1 — Tren superior A (empuje)", groups:["pecho","hombros","triceps"] },
      { nombre:"Día 2 — Tren inferior A", groups:["piernas","core"] },
      { nombre:"Día 3 — Tren superior B (tirón)", groups:["espalda","biceps","hombros"] },
      { nombre:"Día 4 — Tren inferior B", groups:["piernas","core"] },
    ],
    5: [ // Push/Pull/Legs/Upper/Lower (PPLUL) — el híbrido que usan programas de referencia para 5x/semana
      { nombre:"Día 1 — Empuje (pecho/hombro/tríceps)", groups:["pecho","hombros","triceps"] },
      { nombre:"Día 2 — Tirón (espalda/bíceps)", groups:["espalda","biceps"] },
      { nombre:"Día 3 — Piernas", groups:["piernas","core"] },
      { nombre:"Día 4 — Torso superior (mixto)", groups:["pecho","espalda","hombros"] },
      { nombre:"Día 5 — Brazos y core", groups:["biceps","triceps","core"] },
    ],
    6: [ // Push/Pull/Legs x2 — el split de mayor frecuencia por grupo
      { nombre:"Día 1 — Empuje A", groups:["pecho","hombros","triceps"] },
      { nombre:"Día 2 — Tirón A", groups:["espalda","biceps"] },
      { nombre:"Día 3 — Piernas A", groups:["piernas","core"] },
      { nombre:"Día 4 — Empuje B", groups:["pecho","hombros","triceps"] },
      { nombre:"Día 5 — Tirón B", groups:["espalda","biceps"] },
      { nombre:"Día 6 — Piernas B", groups:["piernas","core"] },
    ],
  };

  // Peso relativo "neutro" de cada subgrupo dentro de un día (más peso =
  // más ejercicios de ese subgrupo cuando hay que repartir el cupo del día).
  const SUBGROUP_BASE_WEIGHT = { pecho:1.0, espalda:1.0, piernas:1.15, hombros:0.85, biceps:0.7, triceps:0.75, core:0.7 };
  // Multiplicadores según sexo — Juan pidió: Femenino prioriza tren inferior
  // (glúteo/cuádriceps) y reduce pecho/bíceps; Masculino da más énfasis a
  // tren superior (pecho/espalda/hombros/brazos) que a piernas.
  const SEXO_SUBGROUP_MULT = {
    Masculino: { pecho:1.25, espalda:1.15, piernas:0.8, hombros:1.15, biceps:1.2, triceps:1.15, core:1.0 },
    Femenino:  { pecho:0.6,  espalda:1.0,  piernas:1.6, hombros:0.9,  biceps:0.6, triceps:0.85, core:1.05 },
  };
  function subgroupWeight(sg, sexo){
    const base = SUBGROUP_BASE_WEIGHT[sg] || 1;
    const mult = (SEXO_SUBGROUP_MULT[sexo] && SEXO_SUBGROUP_MULT[sexo][sg]) || 1;
    return base*mult;
  }
  // Reparte "total" ejercicios entre los subgrupos de un día, respetando un
  // mínimo por subgrupo (minMap) y usando el método del resto mayor para que
  // la suma final sea exactamente "total".
  function distributeCount(groups, total, sexo, minMap){
    minMap = minMap || {};
    // ojo: usar hasOwnProperty en vez de "minMap[g]||1" — un mínimo puesto
    // explícitamente en 0 (lo usa distributeCountByRatio para el lado "de
    // arriba" del reparto full-body) es falsy en JS y "0||1" daría 1 por error.
    const floorOf = g => (Object.prototype.hasOwnProperty.call(minMap,g) ? minMap[g] : 1);
    const weights = groups.map(g=> subgroupWeight(g, sexo));
    const sumW = weights.reduce((a,b)=>a+b,0) || 1;
    const raw = groups.map((g,i)=> (weights[i]/sumW)*total);
    const counts = raw.map((v,i)=> Math.max(floorOf(groups[i]), Math.floor(v)));
    let used = counts.reduce((a,b)=>a+b,0);
    if(used<total){
      let remainder = total-used;
      const order = raw.map((v,i)=>({ i, frac:v-Math.floor(v) })).sort((a,b)=>b.frac-a.frac);
      let idx=0;
      while(remainder>0){ counts[order[idx%order.length].i]++; remainder--; idx++; }
    } else if(used>total){
      let over = used-total;
      const order = counts.map((c,i)=>({ i, c })).sort((a,b)=>b.c-a.c);
      let guard=0;
      while(over>0 && guard<1000){
        let progressed=false;
        for(const o of order){
          const floor = floorOf(groups[o.i]);
          if(counts[o.i]>floor){ counts[o.i]--; over--; progressed=true; if(over<=0) break; }
        }
        guard++;
        if(!progressed) break;
      }
    }
    return groups.map((g,i)=>[g,counts[i]]);
  }

  // ¿Perfil "en su prime": edad 19-35 → un poco más de volumen. Si la edad no
  // está cargada, no hay bump (comportamiento normal de siempre).
  //
  // V34: el bump DEJÓ de depender del peso corporal. Antes exigía además
  // peso 73-93kg, y eso lo volvía inaceptable a futuro: el peso corporal pasa
  // a ser una métrica de seguimiento con su propio historial, así que cruzar
  // 73 o 93kg habría cambiado solo la cantidad de ejercicios de la rutina
  // automática (medido: hasta 7 ejercicios semanales de diferencia con 6 días
  // por semana, y de golpe, porque el umbral era duro). Decisión de producto:
  // el peso corporal NO modifica automáticamente el volumen de una rutina.
  //
  // El resto del bump queda EXACTAMENTE igual: sigue sumando randInt(1,2) al
  // objetivo de cada día con el mismo tope de 8 (ver generateAutoRoutine), y
  // no se tocó la cantidad base por sesión, la red de cobertura semanal, las
  // series, el descanso ni ningún otro criterio.
  //
  // Consecuencia intencional: un perfil con edad 19-35 y SIN peso cargado
  // ahora sí recibe el bump (antes no, porque faltaba el segundo dato).
  function profileHasPrimeBump(){
    const p = state.profile;
    if(!p) return false;
    const edad = p.edad;
    return edad!=null && edad>=19 && edad<=35;
  }
  // Cantidad FIJA de ejercicios por sesión según días/semana — regla que
  // pasó Juan (15-sep-2026, v25, reemplaza el rango más amplio de v20): 10
  // ejercicios por día "es una locura", así que ahora es un número fijo por
  // franja en vez de un rango: 1-2 días → 8 (full body, hay que cubrir el
  // cuerpo entero esa sesión); 3-4 días → 7; 5-6 días → 6 (más frecuencia
  // semanal, cada grupo se entrena más seguido, hace falta menos por sesión).
  // Se mantiene como un rango [lo,hi] internamente (con lo===hi) para no
  // tocar el resto de las funciones que ya reciben este par — la única
  // excepción real a este número fijo es la red de seguridad de cobertura
  // semanal (ver más abajo), que puede sumar 1 ejercicio más en casos
  // puntuales para no dejar un grupo muscular en cero, tal como ya pasaba
  // desde v16/v20.
  function sessionCountRange(numDays){
    const table = { 1:[8,8], 2:[8,8], 3:[7,7], 4:[7,7], 5:[6,6], 6:[6,6] };
    return table[numDays] || table[3];
  }
  function randInt(lo,hi){ return lo + Math.floor(Math.random()*(hi-lo+1)); }

  // ---- Proporción tren superior/inferior por sexo dentro de una sesión FULL
  // BODY (donde un mismo día mezcla piernas con tren superior) — regla que
  // pasó Juan: Masculino ~60% tren superior / 40% tren inferior; Femenino
  // ~60-70% tren inferior / 30-40% tren superior (se usa el punto medio, 65%).
  // En días de split "puros" (un día que es TODO tren superior, o TODO
  // piernas+core) esta proporción no tiene nada que repartir dentro del día
  // — ahí el énfasis por sexo se aplica a nivel de CUÁNTOS ejercicios tiene
  // ese día completo, ver biasedTarget() más abajo.
  const LOWER_RATIO_BY_SEX = { Masculino: 0.40, Femenino: 0.65 };
  function distributeCountByRatio(groups, total, sexo, minMap){
    minMap = minMap || {};
    if(groups.indexOf("piernas")===-1) return distributeCount(groups, total, sexo, minMap);
    const lowerRatio = LOWER_RATIO_BY_SEX[sexo] != null ? LOWER_RATIO_BY_SEX[sexo] : 0.5;
    const piernasMin = minMap.piernas != null ? minMap.piernas : 1;
    let piernasCount = Math.max(piernasMin, Math.round(total*lowerRatio));
    piernasCount = Math.min(piernasCount, total-1); // dejar al menos 1 para el resto de grupos
    const upperGroups = groups.filter(g=>g!=="piernas");
    const upperTotal = total - piernasCount;
    // Piso 0 (no 1) para los subgrupos de arriba: con presupuesto chico (ej.
    // full body de 1 día repartiendo poco entre 6 subgrupos) no siempre entra
    // uno de cada uno en ESTE día puntual — la cobertura semanal completa la
    // sigue garantizando la red de seguridad al final de generateAutoRoutine().
    const upperMinMap = {};
    upperGroups.forEach(g=>{ upperMinMap[g] = 0; });
    const upperDist = upperGroups.length ? distributeCount(upperGroups, upperTotal, sexo, upperMinMap) : [];
    return [["piernas", piernasCount]].concat(upperDist);
  }
  // ¿Este día es "mixto" (full body: mezcla piernas con tren superior en la
  // misma sesión), "superior" (solo pecho/espalda/hombros/brazos/core) o
  // "inferior" (solo piernas, con o sin core)? Full body usa la proporción
  // de arriba; los días de split puro usan el sesgo de biasedTarget().
  function dayModality(groups){
    const hasLower = groups.indexOf("piernas")!==-1;
    const hasUpper = groups.some(g=> g!=="piernas" && g!=="core");
    if(hasLower && hasUpper) return "mixto";
    return hasLower ? "inferior" : "superior";
  }
  // Sesga cuántos ejercicios tiene un día de split puro según a quién
  // favorece ese tipo de día: Masculino → más ejercicios en días de tren
  // superior, menos en días de piernas; Femenino → al revés. Los días
  // "mixto" (full body) no se sesgan acá — ya se reparten con la proporción
  // de distributeCountByRatio(), así que usan el rango parejo de siempre.
  function biasedTarget(lo, hi, modality, sexo){
    if(modality==="mixto" || lo>=hi) return randInt(lo,hi);
    const mid = Math.round((lo+hi)/2);
    const sexFavorsUpper = sexo==="Masculino";
    const dayIsUpper = modality==="superior";
    const favored = sexFavorsUpper === dayIsUpper;
    return favored ? randInt(Math.max(mid,lo), hi) : randInt(lo, Math.min(mid,hi));
  }

  // ---- Volumen (series por ejercicio) según edad — curva descendente que
  // pasó Juan: 18-29 años tolerancia máxima (100% del volumen: 4 series por
  // ejercicio), 30+ baja a 3 series (hasta v28.1 50+ bajaba a 2 — eliminado
  // en V29, ver abajo). Sin edad cargada, se usa el nivel intermedio de
  // siempre (3 series) para no asumir de más ni de menos.
  // V29: Juan definió la regla definitiva — la edad YA NO baja
  // automáticamente a 2 series. Antes (v20-v28.1) un perfil de 50+ recibía 2
  // series en todos sus compuestos por regla general, sin excepción
  // justificada. Ahora: <=29 → 4, >=30 → 3, sin edad → 3. No existe (por
  // decisión explícita) ningún mecanismo automático de 2 series. La edad
  // 50+ sigue influyendo solo en el descanso sugerido (restRangeForAge) y en
  // qué variantes se eligen (EXERCISES_RISKY_50PLUS), ambos sin cambios.
  function seriesForAge(edad){
    if(edad==null) return 3;
    if(edad<=29) return 4;
    return 3;
  }
  // ---- Ejercicios "potentes"/compuestos (multiarticulares, con más fatiga
  // sistémica) vs. accesorios/aislamiento — pedido de Juan: press de banca,
  // jalón, remo, sentadillas, hip thrust y similares necesitan el volumen
  // completo (seriesForAge), pero ejercicios más chicos/de aislamiento (curl,
  // extensión de tríceps, elevaciones laterales, gemelos, core, etc.) no
  // hace falta meterles la misma cantidad — se les resta 1 serie (mínimo 2)
  // para que la rutina no se sienta tan pesada. Solo cambia CUÁNTAS series,
  // nunca qué ejercicios se eligen (eso ya lo deciden las reglas de sexo/edad
  // de arriba).
  // NOTA: esto es una lista aparte de `COMPOUND_KEYWORDS`/`isCompoundExercise`
  // (usada más arriba solo para mezclar variedad compuesto/aislamiento al
  // ELEGIR ejercicios, donde una imprecisión no se nota) — para decidir
  // series necesitamos más precisión porque el número queda a la vista de
  // Juan: por keyword, "Press francés" o "Press con disco (plate press)"
  // matchearían "press" y quedarían mal clasificados como compuestos, siendo
  // en realidad ejercicios de aislamiento. Si se agrega un ejercicio nuevo
  // multiarticular pesado (press/sentadilla/peso muerto/remo/dominada/fondo/
  // hip thrust), conviene sumarlo también acá.
  const EXERCISES_COMPOUND = new Set([
    // Pecho — presses y fondos (multiarticular hombro+codo)
    "Press de banca con barra","Press de banca inclinado con barra","Press de banca declinado",
    "Press de banca inclinado con mancuernas","Press de pecho en polea","Fondos inclinado",
    "Press de banca plano en Smith","Press de banca inclinado en Smith","Press de banca declinado en Smith",
    "Flexiones de brazo",
    // Espalda — dominadas/jalones/remos/peso muerto (multiarticular hombro+codo o cadera+rodilla)
    "Dominadas","Dominadas supinas","Jalón al pecho",
    "Remo con barra","Remo con mancuerna unilateral","Remo en polea baja","Remo en máquina",
    "Remo en máquina agarre ancho","Remo en T",
    // V31: variantes nuevas de tracción — mismo carácter multiarticular.
    "Remo en máquina unilateral","Remo en Hammer","Remo en TRX",
    "Jalón agarre supino","Jalón agarre neutro",
    "Peso muerto con barra","Peso muerto rumano con barra","Peso muerto sumo con barra","Peso muerto con mancuernas",
    "Peso muerto rumano con mancuernas","Peso muerto sumo con mancuernas",
    // Piernas — sentadillas/prensa/zancadas/hip thrust (multiarticular cadera+rodilla)
    "Sentadilla con barra","Sentadilla frontal","Sentadilla búlgara","Sentadilla Sumo","Sentadilla Hack",
    "Sentadilla Smith",
    "Prensa inclinada","Estocadas con mancuerna",
    "Hip thrust con barra","Hip thrust en máquina","Step Up",
    // Hombros — press militar (multiarticular hombro+codo)
    "Press militar con barra","Press de hombros con mancuernas","Press militar con mancuernas sentado",
    "Press de hombros en máquina","Arnold press","Press tras nuca con barra",
    // Brazos — el único press cerrado es multiarticular, el resto de brazos es aislamiento
    "Press cerrado",
  ]);
  // V28: Juan pidió que 2 series NO sea la configuración normal — antes,
  // cualquier ejercicio de aislamiento con base=3 (edad 30-49, o sin edad
  // cargada — el caso más común de todos) caía a max(2, 3-1) = 2 series,
  // que terminaba siendo el piso real para la enorme mayoría de cuentas, no
  // una excepción. Se sube el piso de aislamiento a 3 (antes 2): ahora un
  // ejercicio de aislamiento nunca baja de 3 series salvo que el compuesto
  // de referencia ya esté en 2 (perfil 50+, ver seriesForAge) — en ese único
  // caso, ya justificado por la edad desde v20, el aislamiento se mantiene en
  // 3 en vez de bajar más, y el "2" queda acotado solo al compuesto de ese
  // perfil (una excepción real y ya explicada, no la regla general).
  // V29: con seriesForAge en 3/4, el resultado es siempre compuesto 3-4 y
  // aislamiento 3 — ningún ejercicio generado sale con 2 series.
  function seriesForExercise(nombre, edad){
    const base = seriesForAge(edad);
    return EXERCISES_COMPOUND.has(nombre) ? base : Math.max(3, base-1);
  }
  // ---- Descanso sugerido entre series según edad — pasó Juan: 60-90s para
  // perfiles jóvenes, 120-180s para 50+ (la recuperación metabólica entre
  // series es más lenta). Es solo informativo (se muestra como sugerencia,
  // no cambia el cronómetro de nadie a la fuerza).
  function restRangeForAge(edad){
    return (edad!=null && edad>=50) ? [120,180] : [60,90];
  }
  // ---- Ejercicios libres de alta carga axial (columna) a evitar para 50+ —
  // pasó Juan: por ejemplo sentadilla libre, peso muerto y press militar con
  // barra deberían reemplazarse por variantes guiadas (máquina/polea). Estos
  // nombres simplemente se sacan del pool candidato para ese perfil — como
  // sus alternativas seguras (prensa, sentadilla hack, remo en polea, press
  // con mancuernas, peso muerto rumano, etc.) ya están cargadas en el mismo
  // subgrupo/foco, el generador las elige solas sin necesitar un mapa de
  // reemplazo exercicio-por-ejercicio.
  const EXERCISES_RISKY_50PLUS = new Set([
    "Sentadilla con barra", "Sentadilla frontal", "Sentadilla Sumo",
    "Peso muerto con barra", "Peso muerto sumo con barra",
    "Remo con barra", "Press militar con barra", "Press tras nuca con barra",
  ]);

  // Todos los subgrupos "de tren superior/core" que tienen que aparecer en la
  // semana completa (piernas se controla aparte con los 4 sub-focos de abajo,
  // porque "piernas" como bloque no alcanza — hay que exigir cuádriceps,
  // isquios, glúteo y pantorrilla cada uno por separado).
  const REQUIRED_WEEK_SUBGROUPS = ["pecho","espalda","hombros","biceps","triceps","core"];
  const REQUIRED_LEG_FOCI = ["quads","hamstrings","glutes","calves"];

  // ---- Enfoque muscular opcional (pedido de Juan: "quiero más glúteos y
  // cuádriceps" → priorizar esos grupos en la rutina que se genera). Se
  // eligen hasta 3 de los 10 grupos/sub-focos de siempre — reutiliza
  // exactamente las mismas listas (REQUIRED_WEEK_SUBGROUPS para tren
  // superior/core, REQUIRED_LEG_FOCI para pierna) que ya usa la red de
  // seguridad de cobertura semanal, así no hace falta mantener una lista
  // aparte.
  // Desde v25: el enfoque ya NO agrega ejercicios de más (Juan puso un tope
  // duro de 6-8 ejercicios por día, "es una locura hacer 10") — ahora
  // REEMPLAZA: por cada ejercicio nuevo del músculo elegido, saca uno
  // existente de otro grupo en ese mismo día, así el total de ejercicios del
  // día no cambia. Nunca saca: un ejercicio del propio músculo de enfoque
  // (para eso está, no tendría sentido sacarlo), ni la última aparición en
  // toda la semana de un subgrupo/foco de pierna obligatorio (la regla no
  // negociable de cobertura semanal de v16 sigue mandando por sobre el
  // enfoque). Si un día no tiene ningún ejercicio "sacrificable" bajo esas
  // reglas, ese reemplazo puntual se salta (con un tope de intentos) en vez
  // de romper la cobertura o quedarse en un loop infinito.
  const FOCUS_LABELS = {
    pecho:"Pecho", espalda:"Espalda", hombros:"Hombros", biceps:"Bíceps", triceps:"Tríceps", core:"Core",
    quads:"Cuádriceps", hamstrings:"Isquiotibiales", glutes:"Glúteos", calves:"Pantorrillas",
  };
  const FOCUS_OPTIONS = [...REQUIRED_WEEK_SUBGROUPS, ...REQUIRED_LEG_FOCI];
  const FOCUS_MAX_GROUPS = 3;
  const FOCUS_EXTRA_PER_GROUP = 2;

  // ¿Se puede sacar el ejercicio days[dayIdx].exercises[exIdx] para hacerle
  // lugar a un ejercicio del enfoque "focusKey"? No, si es del propio músculo
  // de enfoque, o si es la única aparición en toda la semana de un subgrupo/
  // foco de pierna que la regla no negociable de v16 exige cubrir sí o sí.
  function isSafeToDropForFocus(days, dayIdx, exIdx, focusKey, isLegFocus){
    const name = days[dayIdx].exercises[exIdx].nombre;
    const sg = exercisePrimarySubgroup(name);
    const legF = sg==="piernas" ? exerciseLegFocus(name) : null;
    if(isLegFocus ? legF===focusKey : sg===focusKey) return false;
    const weekCount = (matchFn) => days.reduce((acc,d)=> acc + d.exercises.filter(matchFn).length, 0);
    if(sg && REQUIRED_WEEK_SUBGROUPS.indexOf(sg)!==-1){
      if(weekCount(e=>exercisePrimarySubgroup(e.nombre)===sg) <= 1) return false;
    }
    if(legF && REQUIRED_LEG_FOCI.indexOf(legF)!==-1){
      if(weekCount(e=>exerciseLegFocus(e.nombre)===legF) <= 1) return false;
    }
    // V29.1: aun con enfoque explícito, el tren inferior mantiene una
    // estructura razonable — nunca se saca el último cuádriceps ni el último
    // glúteo de ESE día (los grupos grandes no pueden quedar desplazados del todo).
    if(legF==="quads" || legF==="glutes"){
      const inDay = days[dayIdx].exercises.filter(e=> exercisePrimarySubgroup(e.nombre)==="piernas" && exerciseLegFocus(e.nombre)===legF).length;
      if(inDay <= 1) return false;
    }
    return true;
  }
  // V29.1: con enfoque en un subgrupo secundario (isquios/gemelos), tope de
  // 2 ejercicios de ese subgrupo por día — el enfoque manda sobre el reparto
  // automático, pero nunca da "3 de gemelos" o "3 de isquios" en un mismo día.
  const LEG_FOCUS_DAY_CAP = { hamstrings:2, calves:2 };

  // ---- V36: alta de cobertura semanal RESPETANDO el tope diario.
  //
  // Antes las dos redes de cobertura de generateAutoRoutine hacían push directo
  // sin mirar cuántos ejercicios tenía el día, y por eso un día de 8 podía
  // terminar en 11. El tope diario ahora es DURO y la cobertura es un objetivo
  // subordinado: si no entra, se intenta sustituir, y si no se puede sustituir
  // el grupo queda sin cubrir. Nunca se supera el tope.
  //
  // Deliberadamente NO se hace un slice final del día: eso recortaría por
  // posición y podría tirar justo el ejercicio que aportaba la cobertura. La
  // decisión se toma acá, en el momento de agregar.
  //
  // Devuelve true si el ejercicio quedó en el día (por hueco o por sustitución),
  // false si no hubo forma. No muta nada cuando devuelve false.
  function coverageAdd(days, dayIdx, cap, name, key, isLegFocus, edad){
    const day = days[dayIdx];
    if(!day || !name) return false;
    // Nunca duplicar dentro del mismo día.
    if(day.exercises.some(e=> e.nombre===name)) return false;
    const nuevo = ()=> ({ id:uid(), nombre:name, series:String(seriesForExercise(name,edad)), reps:"10", notas:"", imagenUrl:"" });

    // Caso 1: hay lugar. Comportamiento de siempre.
    if(cap==null || day.exercises.length < cap){
      day.exercises.push(nuevo());
      return true;
    }

    // Caso 2: el día está lleno. Se busca un donante sobrerrepresentado.
    //
    // "Sobrerrepresentado" = su bucket (foco de pierna para piernas, subgrupo
    // principal para el resto) tiene 2 o más ejercicios en ESTE día, así que
    // sacarle uno no le quita la cobertura a nadie. Además se exige
    // isSafeToDropForFocus, que ya protege lo no negociable: el propio músculo
    // que se quiere cubrir, la última aparición semanal de un subgrupo o foco
    // requerido, y el último cuádriceps/glúteo del día.
    //
    // Se prefiere sacar un ejercicio de AISLAMIENTO antes que un compuesto
    // (mismo criterio que applyFocusReplace), y se recorre de atrás hacia
    // adelante porque los accesorios quedan al final del día.
    const bucketDe = (nombre)=>{
      const sg = exercisePrimarySubgroup(nombre);
      return sg==="piernas" ? ("leg:"+(exerciseLegFocus(nombre)||"")) : ("sg:"+(sg||""));
    };
    const conteo = {};
    day.exercises.forEach(e=>{ const b=bucketDe(e.nombre); conteo[b]=(conteo[b]||0)+1; });

    const esDonante = (i)=>{
      const e = day.exercises[i];
      if(conteo[bucketDe(e.nombre)] < 2) return false;      // es el único de su bucket en el día
      return isSafeToDropForFocus(days, dayIdx, i, key, isLegFocus);
    };

    let dropIdx = -1;
    for(let i=day.exercises.length-1; i>=0; i--){
      if(esDonante(i) && !EXERCISES_COMPOUND.has(day.exercises[i].nombre)){ dropIdx=i; break; }
    }
    if(dropIdx===-1){
      for(let i=day.exercises.length-1; i>=0; i--){
        if(esDonante(i)){ dropIdx=i; break; }
      }
    }
    if(dropIdx===-1) return false; // no hay sustitución válida: el día se queda como está

    day.exercises.splice(dropIdx, 1);
    day.exercises.push(nuevo());
    return true;
  }

  function applyFocusReplace(days, templ, focus, avoid, riskyExclude, edad){
    (focus||[]).slice(0,FOCUS_MAX_GROUPS).forEach(key=>{
      const isLeg = REQUIRED_LEG_FOCI.indexOf(key)!==-1;
      const pool = (isLeg ? legFocusPools(riskyExclude)[key] : subgroupPools(riskyExclude)[key]) || [];
      const groupKey = isLeg ? "piernas" : key;
      const candidateDaysIdx = templ.map((dd,i)=> dd.groups.indexOf(groupKey)!==-1 ? i : -1).filter(i=>i!==-1);
      if(!candidateDaysIdx.length || !pool.length) return;
      let added = 0, di = 0, guard = 0;
      while(added < FOCUS_EXTRA_PER_GROUP && guard < 40){
        guard++;
        const avail = pool.filter(n=>!avoid.has(n));
        if(!avail.length) break; // no quedan más variantes de ese músculo sin repetir en la semana
        const dayIdx = candidateDaysIdx[di % candidateDaysIdx.length];
        di++;
        const day = days[dayIdx];
        if(isLeg && LEG_FOCUS_DAY_CAP[key] && day.exercises.filter(e=> exercisePrimarySubgroup(e.nombre)==="piernas" && exerciseLegFocus(e.nombre)===key).length >= LEG_FOCUS_DAY_CAP[key]) continue;
        // Preferí sacar un accesorio/aislamiento antes que un compuesto (así
        // no le sacamos a Juan el ejercicio "grande" del día para meterle el
        // de enfoque) — si no hay ninguno sacrificable así, probá con
        // cualquiera que sea seguro sacar.
        let dropIdx = -1;
        for(let i=day.exercises.length-1;i>=0;i--){
          if(isSafeToDropForFocus(days,dayIdx,i,key,isLeg) && !EXERCISES_COMPOUND.has(day.exercises[i].nombre)){ dropIdx=i; break; }
        }
        if(dropIdx===-1){
          for(let i=day.exercises.length-1;i>=0;i--){
            if(isSafeToDropForFocus(days,dayIdx,i,key,isLeg)){ dropIdx=i; break; }
          }
        }
        if(dropIdx===-1) continue; // este día no tiene nada sacrificable ahora — probamos el siguiente día candidato
        day.exercises.splice(dropIdx,1);
        const name = shuffleArr(avail)[0];
        day.exercises.push({ id:uid(), nombre:name, series:String(seriesForExercise(name,edad)), reps:"10", notas:"", imagenUrl:"" });
        avoid.add(name);
        added++;
      }
    });
  }

  /* ---- V29.1: "Piernas" ponderado por subgrupo, con énfasis por día ----
     "Piernas" sigue siendo UN grupo general en plantillas/reparto/cobertura
     (SPLIT_DAYS, distributeCount, distributeCountByRatio no cambian: CUÁNTOS
     ejercicios de pierna tiene cada día es exactamente lo de siempre). Lo que
     cambia es CUÁLES: antes se sorteaban del pool entero de piernas sin
     distinguir subgrupo; ahora cada día de piernas tiene un énfasis
     (cuádriceps o glúteos, alternado en la semana) y se arma respetando:
       - el dominante tiene más ejercicios que cualquier otro subgrupo;
       - su primer ejercicio es compuesto (EXERCISES_COMPOUND) si hay uno;
       - con 2+ ejercicios siempre aparece el acompañante (el otro de prioridad alta);
       - isquios preferentes desde 3+ (entran como fijo desde 4, porque con 3
         la regla del dominante ya ocupa los 3 lugares: 2 dominante + 1 acompañante);
       - cuádriceps+glúteos >= isquios+gemelos+aductores;
       - isquios nunca más que el acompañante;
       - máximo 1 de gemelos y 1 de aductores por día;
       - nunca el mismo ejercicio dos veces en el día.
     Las reglas estructurales mandan; los pesos solo deciden entre las
     opciones que las reglas permiten. Clasificación: la de siempre
     (exerciseLegFocus, región de mayor intensidad en MUSCLE_MAP) — por
     ejemplo "Abductores en máquina" es glúteo y "Sentadilla Sumo" es aductor
     según esos datos, y así se usan. */
  const LEG_PRIORITY = { quads:"alta", glutes:"alta", hamstrings:"media", calves:"secundaria", adductors:"accesoria" };
  // Pesos iniciales del sorteo por ROL dentro del día (parámetros, no reparto fijo).
  const LEG_ROLE_WEIGHTS = { dominante:4, acompanante:2.5, hamstrings:1.5, calves:0.7, adductors:0.4 };
  const LEG_EMPHASIS_LABELS = { quads:"Énfasis cuádriceps", glutes:"Énfasis glúteos" };
  // Orden de énfasis de la semana: arranca según sexo (misma prioridad de
  // siempre: Femenino glúteos, Masculino cuádriceps) y alterna.
  function legEmphasisSequence(sexo){
    return sexo==="Femenino" ? ["glutes","quads"] : ["quads","glutes"];
  }
  function legDayRulesOk(c, dom, acc, n){
    const others = ["quads","glutes","hamstrings","calves","adductors"].filter(f=>f!==dom);
    // Con exactamente 2 ejercicios de pierna no se puede cumplir a la vez
    // "dominante > cualquier otro" y "acompañante obligatorio": se prioriza el
    // acompañante (queda 1 y 1). Desde 3 el dominante es estrictamente mayor.
    if(n>=3 && others.some(f=> (c[f]||0) >= c[dom])) return false;
    if((c.quads||0)+(c.glutes||0) < (c.hamstrings||0)+(c.calves||0)+(c.adductors||0)) return false;
    if((c.hamstrings||0) > (c[acc]||0)) return false;
    if((c.calves||0)>1 || (c.adductors||0)>1) return false;
    return true;
  }
  // Devuelve exactamente `count` nombres (salvo que no queden ejercicios
  // válidos en ningún subgrupo, caso que con los pools actuales no ocurre).
  // weekAvoid: ejercicios ya usados en la semana (se evitan si hay alternativas).
  // weekCovered: sub-focos de pierna ya presentes en la semana (para que, en
  // el ÚLTIMO día de piernas, isquios/gemelos faltantes entren dentro del
  // cupo del día en vez de que la red de seguridad tenga que sumar de más).
  function pickLegDayExercises(count, emphasis, weekAvoid, riskyExclude, opts){
    opts = opts || {};
    const dom = emphasis==="glutes" ? "glutes" : "quads";
    const acc = dom==="quads" ? "glutes" : "quads";
    const pools = legFocusPools(riskyExclude);
    const c = { quads:0, glutes:0, hamstrings:0, calves:0, adductors:0 };
    const dayNames = [];
    // V31: patrones ya usados EN ESTE DÍA — evita que el día de pierna salga
    // con dos variantes del mismo patrón (p. ej. Sentadilla con barra +
    // Sentadilla Hack) habiendo alternativas de otro patrón. Las reglas
    // estructurales de V29.1 (dominante, acompañante, topes) siguen mandando:
    // esto solo decide ENTRE los candidatos que esas reglas ya permitieron.
    const dayPatterns = new Set();
    function hasOption(f){ return (pools[f]||[]).some(n=> dayNames.indexOf(n)===-1); }
    function take(f, preferCompound){
      const avail = (pools[f]||[]).filter(n=> dayNames.indexOf(n)===-1);
      if(!avail.length) return false;
      let cand = avail;
      if(preferCompound){
        const comp = avail.filter(n=> EXERCISES_COMPOUND.has(n));
        if(comp.length) cand = comp;
      }
      const fresh = cand.filter(n=> !weekAvoid.has(n));
      // Misma regla dura de patrón que en weightedPickMany, con la prioridad
      // estructural de siempre: primero los no usados en la semana.
      const base = fresh.length ? fresh : cand;
      const pick = weightedPick(candidatesWithFreshPattern(base, dayPatterns), { edad:opts.edad, usedPatterns:dayPatterns });
      if(pick==null) return false;
      dayNames.push(pick); weekAvoid.add(pick); c[f]++;
      dayPatterns.add(exercisePattern(pick));
      return true;
    }
    function canAdd(f){
      if(!hasOption(f)) return false;
      const t = Object.assign({}, c); t[f]++;
      return legDayRulesOk(t, dom, acc, count);
    }
    // 1) estructura fija: dominante (compuesto primero), acompañante, 2º del dominante, isquios
    // (el 2º del dominante va antes que el acompañante para que, con 3+, la
    // regla "dominante estrictamente mayor" se cumpla en cada paso)
    if(count>=1) take(dom, true);
    if(count>=3 && canAdd(dom)) take(dom, false);
    if(count>=2 && dayNames.length<count && canAdd(acc)) take(acc, false);
    // Isquios preferentes (no obligatorios): en el último día de piernas de la
    // semana, si isquios ya aparecieron y gemelos todavía no, ese lugar va a
    // gemelos para cubrir la semana sin sumar ejercicios de más.
    const swapHamForCalves = opts.lastLegDay && opts.weekCovered && opts.weekCovered.has("hamstrings") && !opts.weekCovered.has("calves");
    if(count>=4 && dayNames.length<count && !swapHamForCalves && canAdd("hamstrings")) take("hamstrings", false);
    // 2) último día de piernas de la semana: sub-focos que todavía no aparecieron
    if(opts.lastLegDay && opts.weekCovered){
      ["hamstrings","calves"].forEach(f=>{
        if(dayNames.length<count && !opts.weekCovered.has(f) && c[f]===0 && canAdd(f)) take(f, false);
      });
    }
    // 3) resto: sorteo ponderado entre lo que las reglas permiten
    const roleWeight = f => f===dom ? LEG_ROLE_WEIGHTS.dominante : f===acc ? LEG_ROLE_WEIGHTS.acompanante : LEG_ROLE_WEIGHTS[f];
    let guard = 0;
    while(dayNames.length<count && guard<50){
      guard++;
      const cands = ["quads","glutes","hamstrings","calves","adductors"].filter(canAdd);
      if(!cands.length) break;
      const total = cands.reduce((s,f)=> s+roleWeight(f), 0);
      let r = Math.random()*total, chosen = cands[cands.length-1];
      for(const f of cands){ r -= roleWeight(f); if(r<=0){ chosen = f; break; } }
      take(chosen, false);
    }
    // 4) red de último recurso (solo si las reglas dejaron lugares vacíos por
    // falta de ejercicios): completar con dominante/acompañante sin repetir.
    [dom, acc].forEach(f=>{ while(dayNames.length<count && hasOption(f)) take(f, false); });
    // Orden: dominante (compuesto primero), acompañante, isquios, accesorios —
    // reorderDayExercisesByGroup después ordena compuestos primero dentro del
    // bloque de piernas con un sort estable, así el compuesto del dominante
    // queda primero.
    const roleOrder = [dom, acc, "hamstrings", "calves", "adductors"];
    return dayNames.slice().sort((a,b)=> roleOrder.indexOf(exerciseLegFocus(a)) - roleOrder.indexOf(exerciseLegFocus(b)));
  }

  function generateAutoRoutine(numDays, sexo, focus){
    const templ = SPLIT_DAYS[numDays] || SPLIT_DAYS[3];
    const bump = profileHasPrimeBump();
    const [lo,hi] = sessionCountRange(numDays);
    const edad = state.profile ? state.profile.edad : null;
    const riskyExclude = (edad!=null && edad>=50) ? EXERCISES_RISKY_50PLUS : null;
    const avoid = new Set();
    const legFociCovered = new Set();
    const subgroupsCovered = new Set();
    // Orden de prioridad de sub-foco de pierna según sexo — Femenino exige
    // glúteo/cuádriceps primero (casi obligatorio todas las semanas), y
    // Masculino prioriza igual pero con menos peso relativo en el reparto.
    // V29.1: énfasis por día de piernas (puros, tren inferior o full body con
    // piernas): arranca según sexo y alterna cuádriceps ↔ glúteos.
    const emphSeq = legEmphasisSequence(sexo);
    const legDayIdxs = templ.map((dd,i)=> dd.groups.indexOf("piernas")!==-1 ? i : -1).filter(i=>i!==-1);
    const emphasisByDay = {};
    legDayIdxs.forEach((dayI,k)=>{ emphasisByDay[dayI] = emphSeq[k % emphSeq.length]; });
    const lastLegDayIdx = legDayIdxs.length ? legDayIdxs[legDayIdxs.length-1] : -1;

    // V36: tope duro de cada día, indexado igual que `days`. Lo llena el .map()
    // de abajo y lo leen las redes de cobertura.
    const dayCaps = [];

    const days = templ.map((dd, dayI)=>{
      const modality = dayModality(dd.groups);
      let target = biasedTarget(lo, hi, modality, sexo);
      // V36: el tope diario es DURO y sale de sessionCountRange, no de una
      // constante global. Antes el bump se topeaba en 8 sin importar el tope
      // del día, así que con 5-6 días por semana (base 6) podía llevar un día
      // a 8, por encima de su propio límite.
      //
      // El bump NO puede aumentar la cantidad máxima de ejercicios del día.
      // Como la tabla de sessionCountRange tiene lo===hi, topearlo en `hi` lo
      // deja sin efecto sobre el CONTEO — es exactamente lo pedido. La
      // condición del bump (solo edad, V34) no se toca.
      if(bump) target = Math.min(hi, target + randInt(1,2));
      target = Math.max(lo, Math.min(hi, target));
      // El tope se guarda por día: las redes de cobertura corren DESPUÉS de
      // este .map() y, sin esto, `target` se perdía y no tenían contra qué
      // comparar. Es la causa de que un día pudiera llegar a 9-11.
      dayCaps[dayI] = target;
      const dist = modality==="mixto"
        ? distributeCountByRatio(dd.groups, target, sexo, { piernas:2 })
        : distributeCount(dd.groups, target, sexo, { piernas:2 });
      const names = [];
      // V31 §3: patrones ya usados en ESTE día, compartidos entre todos los
      // subgrupos del día para que la diversidad de patrón valga en el día
      // completo (el día de pierna lleva su propio control interno).
      const dayPatterns = new Set();
      dist.forEach(([sg,count])=>{
        let picked;
        if(sg==="piernas"){
          // V29.1: misma CANTIDAD de siempre (count), selección por subgrupo con énfasis.
          picked = pickLegDayExercises(count, emphasisByDay[dayI], avoid, riskyExclude,
            { lastLegDay: dayI===lastLegDayIdx, weekCovered: legFociCovered, edad });
          picked.forEach(n=>{ const f=exerciseLegFocus(n); if(f) legFociCovered.add(f); });
        } else {
          picked = pickForSubgroup(sg,count,avoid,{ riskyExclude, edad, usedPatterns: dayPatterns });
          if(picked.length) subgroupsCovered.add(sg);
        }
        names.push(...picked);
      });
      const exercises = names.map(n=>({ id:uid(), nombre:n, series:String(seriesForExercise(n,edad)), reps:"10", notas:"", imagenUrl:"" }));
      // V29.1: el énfasis se muestra en el nombre del día ("Día 2 — Tren
      // inferior A — Énfasis cuádriceps"). formatDayTitle parte en el primer
      // " — ", así que el título sigue siendo "Día 2" y el subtítulo muestra
      // el resto. `legEmphasis` queda además como dato del día.
      const emph = emphasisByDay[dayI];
      const nombre = emph ? `${dd.nombre} — ${LEG_EMPHASIS_LABELS[emph]}` : dd.nombre;
      const dayObj = { id:uid(), nombre, exercises };
      if(emph) dayObj.legEmphasis = emph;
      return dayObj;
    });

    // Red de seguridad: garantiza SIEMPRE (sin importar sexo, edad o cómo
    // cayeron los cupos por día) que la semana completa cubra los 4 sub-focos
    // de pierna y los 6 subgrupos de tren superior/core — nunca se puede
    // saltear un grupo muscular entero, el sexo solo cambia el ÉNFASIS/volumen
    // relativo, y la edad solo cambia QUÉ variante puntual se elige.
    const focusPools = legFocusPools(riskyExclude);
    const piernasDaysIdx = templ.map((dd,i)=> dd.groups.indexOf("piernas")!==-1 ? i : -1).filter(i=>i!==-1);
    REQUIRED_LEG_FOCI.filter(f=>!legFociCovered.has(f)).forEach((f,idx)=>{
      const pool = (focusPools[f]||[]).filter(n=>!avoid.has(n));
      const name = pool[0] || (focusPools[f]||[])[0];
      if(!name) return;
      // V36: se prueba en TODOS los días de pierna, empezando por el que le
      // tocaba por round-robin. Antes se pusheaba a ese día sin más; ahora, si
      // está lleno, se intenta sustituir, y si tampoco se puede se pasa al
      // siguiente día candidato.
      const candidatos = piernasDaysIdx.length ? piernasDaysIdx : [0];
      for(let k=0; k<candidatos.length; k++){
        const dayIdx = candidatos[(idx + k) % candidatos.length];
        if(!days[dayIdx]) continue;
        if(coverageAdd(days, dayIdx, dayCaps[dayIdx], name, f, true, edad)){
          avoid.add(name); legFociCovered.add(f);
          return;
        }
      }
      // Sin lugar y sin sustitución válida en ningún día: este foco queda sin
      // cubrir esta semana. El tope diario manda (decisión de producto).
    });
    const pools = subgroupPools(riskyExclude);
    REQUIRED_WEEK_SUBGROUPS.filter(sg=>!subgroupsCovered.has(sg)).forEach(sg=>{
      const pool = (pools[sg]||[]).filter(n=>!avoid.has(n));
      const name = pool[0] || (pools[sg]||[])[0];
      if(!name) return;
      // V36: se recorren los días de menos a más cargados. El primero con
      // lugar (o con una sustitución válida) se lo lleva.
      const orden = days.map((d,i)=>i).sort((a,b)=> days[a].exercises.length - days[b].exercises.length);
      for(const dayIdx of orden){
        if(coverageAdd(days, dayIdx, dayCaps[dayIdx], name, sg, false, edad)){
          avoid.add(name); subgroupsCovered.add(sg);
          return;
